async function send(){
  const q = document.getElementById('q');
  const text = q.value.trim();
  if(!text) return;
  const quote = pendingQuote;
  clearQuote();
  q.value = '';
  addMsg('user', text, quote);

  const userContent = quote
    ? `我选中了书中这段文字:「${quote}」\n\n我的问题:${text}`
    : text;
  history.push({role:'user', content:userContent});

  const box = document.getElementById('msgs');
  const th = document.createElement('div');
  th.className = 'msg thinking'; th.textContent = '助教翻书中…';
  box.appendChild(th); box.scrollTop = box.scrollHeight;
  document.getElementById('send').disabled = true;

  const curCh = CHAPTERS.find(c=>c.id===cur);
  const system = `你是《一顶帽子的全球旅行:小白入行帽子厂贸实战》的随书助教。这本书教零基础读者进入帽子的生产制造与出口外贸行业。

你的行为准则:
1. 你对读者一无所知,不假设读者的任何背景、地区或资源,像面对一位陌生读者一样回答。
2. 优先依据书的内容回答;可以补充公开的行业常识,但要与书的口径一致。
3. 书是连载中的,很多章节未写。如果问题属于未写章节的范围,直接说明"这属于第X章(未写作)的内容",然后仍给出简要的先行解答。
4. 回答用简体中文,简洁、口语化、像一位耐心的师傅,一般不超过300字;需要对比时可用小表格。
5. 读者若选中了书中文字,围绕该段展开,可以举例、换个说法、或给出实操建议。

【全书目录】
${md('toc')}

【读者当前正在阅读的章节全文】
${md(curCh.id)}`;

  try{
    let resp = await fetch(CONFIG.WORKER_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ system, max_tokens: 1000, messages: history.slice(-12) })
    });
    if(!resp.ok && resp.status >= 500){ await new Promise(r=>setTimeout(r,1200));
      resp = await fetch(CONFIG.WORKER_URL, {method:'POST',headers:{'Content-Type':'application/json'},body: JSON.stringify({ system, max_tokens: 1000, messages: history.slice(-12) })});
    }
    let data = null, raw = '';
    try{ raw = await resp.text(); data = JSON.parse(raw); }catch(_){}
    th.remove();
    if(resp.ok && data && data.content){
      const ans = data.content.filter(b=>b.type==='text').map(b=>b.text).join('\n');
      history.push({role:'assistant', content:ans});
      addMsg('assistant', ans);
      saveState();
    } else {
      const detail = (data && data.error && data.error.message) ? data.error.message : raw.slice(0,300);
      addMsg('assistant', '接口调用失败(HTTP ' + resp.status + '):`' + detail + '`');
      history.pop();
    }
  }catch(e){
    th.remove();
    addMsg('assistant', '请求失败:`' + (e && e.message ? e.message : e) + '`。请稍后再试。');
    history.pop();
  }
  document.getElementById('send').disabled = false;
  q.focus();
}
document.getElementById('send').onclick = send;
document.getElementById('q').addEventListener('keydown', e=>{
  // 输入法组词中的回车(确认候选词)不触发发送
  if(e.isComposing || e.keyCode === 229) return;
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
document.getElementById('clearBtn').onclick = ()=>{
  history = [];
  document.getElementById('msgs').innerHTML = '';
  addHint('对话已清空。');
  saveState();
};

/* ───────── 面板开关 ───────── */
function setTutor(open){
  document.getElementById('tutor').classList.toggle('hidden', !open);
  document.getElementById('tutorToggle').classList.toggle('active', open);
  document.getElementById('mTutor').classList.toggle('active', open);
}
function toggleTutor(){ setTutor(document.getElementById('tutor').classList.contains('hidden')); }
function toggleToc(){ document.getElementById('nav').classList.toggle('open'); }
document.getElementById('tutorToggle').onclick = toggleTutor;
document.getElementById('tocToggle').onclick = toggleToc;

/* ───────── 字号与主题 ───────── */
let fontSize = 15;
function applyFont(){
  document.getElementById('content').style.fontSize = fontSize + 'px';
  try{ localStorage.setItem('hatbook-font', fontSize); }catch(e){}
}
function bumpFont(d){ fontSize = Math.max(13, Math.min(20, fontSize + d)); applyFont(); }
function applyTheme(dark){
  document.body.classList.toggle('dark', dark);
  document.getElementById('themeToggle').textContent = dark ? '☀️ 浅色' : '🌙 深色';
  document.getElementById('mTheme').textContent = dark ? '☀️' : '🌙';
  try{ localStorage.setItem('hatbook-theme', dark ? 'dark' : 'light'); }catch(e){}
}
function toggleTheme(){ applyTheme(!document.body.classList.contains('dark')); }
document.getElementById('fontMinus').onclick = ()=>bumpFont(-1);
document.getElementById('fontPlus').onclick  = ()=>bumpFont(1);
document.getElementById('themeToggle').onclick = toggleTheme;

/* ───────── 手机底部工具栏 ───────── */
document.getElementById('mToc').onclick = toggleToc;
document.getElementById('mFontMinus').onclick = ()=>bumpFont(-1);
document.getElementById('mFontPlus').onclick  = ()=>bumpFont(1);
document.getElementById('mTheme').onclick = toggleTheme;
document.getElementById('mTutor').onclick = toggleTutor;

/* ───────── 进度与对话持久化 ───────── */
async function saveState(){
  try{ localStorage.setItem('hatbook-state', JSON.stringify({cur, history: history.slice(-12)})); }catch(e){}
}
async function loadState(){
  try{
    const v = localStorage.getItem('hatbook-state');
    if(v){
      const s = JSON.parse(v);
      if(s.cur && CHAPTERS.find(c=>c.id===s.cur && c.done)) cur = s.cur;
      if(Array.isArray(s.history)){
        history = s.history;
        for(const m of history){
          if(m.role==='user') addMsg('user', m.content.startsWith('我选中了')? m.content.split('我的问题:').pop() : m.content);
          else addMsg('assistant', m.content);
        }
      }
    }
  }catch(e){}
}

/* ───────── 启动 ───────── */
(async function(){
  try{
    const f = parseInt(localStorage.getItem('hatbook-font'), 10);
    if(f >= 13 && f <= 20) fontSize = f;
    const savedTheme = localStorage.getItem('hatbook-theme');
    applyTheme(savedTheme ? savedTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
  }catch(e){ applyTheme(false); }
  applyFont();
  if(matchMedia('(max-width:900px)').matches) setTutor(false);
  await loadState();
  renderNav();
  document.getElementById('content').innerHTML = marked.parse(md(cur));
  if(history.length===0) addHint('你好,我是随书助教。就当前章节直接提问,或选中正文任意文字(手机长按选择)点「问这段」。');
})();
</script>
</body>
</html>
