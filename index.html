差额从哪来?**不是货代比你会砍价,是包税专线在目的国清关时用的是它自己的申报口径**,这正是17.4要专门讲"双清包税的灰色"的原因。作为使用者,你必须清楚三件事:第一,你买的是一个打包服务,税的部分不透明;第二,一旦被查,货可能被扣、补税罚款的最终责任会顺着链条找回来(见18.5);第三,**这条通道适合小票试单,不适合你把生意做大以后的常态**——货量上来、客户变成正经进口商之后,正确的路是报CIF或FOB,让客户做进口人(见13.3.2),或者你自己在目的国注册税号走正规完税。判断阈值给你:**同一个客户累计出货超过20方,或者单票货值超过CAD 10,000,就该把通道从"包税专线"切换到"正规报关+客户自税"。**便宜和干净之间,规模会替你做选择。

本节动作:找一家货代,报一次你自己产品的整柜价——哪怕你现在根本装不满一个柜。要来之后,把单顶物流成本算出来,写在你的成本表最底下一行,标注"远端坐标"。以后每次有人跟你比价,先看看对方的量在哪一档;**跨档比价是没有意义的,而知道每一档的坐标,是你唯一不会被唬住的办法。**

## 19.5 七项常漏成本

三道题做完,你回到自己这一单,把鞋盒里剩下的那几张纸也录进表。这一节,是本章的心脏。

第7章那张分账表算出成本¥11,950、毛利¥13,790、54个点(见7.3.2)。那张表没有错——它把你付给工厂、洗水厂、货代、银行的每一笔钱都记上了。但它漏了七项。逐项算,每项给出量化方法,最后合计。

**第①项:样品与寄样费。**你这单¥700(见10.4.2),占毛利5.1%。它已经在¥11,950里,列在这里是因为它是**最容易在报价时被忘的一项**——报价发生在打样之前,你脑子里只有"帽子多少钱一顶",而打样的钱是后来一笔一笔漏出去的。量化方法:**按"预计轮数×每轮成本"预估**,开发样¥80-150/顶、每轮国际快递¥150-280(见10.4.2),常规两到三轮,预算¥600-900。降低它的动作只有两个:样品费该收就收、寄样用客户的到付账号(见10.4.2)——14.5.1里那句"这¥700其实有一部分可以要求 Mike 承担,你当时为了促成第一单自己吃了",说的就是这里。

**第②项:一次性开发费用。**制版费¥200(见3.1.5),占毛利1.5%。帽子这个品类算便宜的,换成开模的产品(定制五金扣、定制织唛版费、定制印刷袋版费¥100-200,见4.6.1)动辄上千。量化方法:**列一张"与数量无关的费用清单",合计后除以摊销基数**;基数取首单量还是十二个月预计量,在表上注明(见19.1.1)。这单按首单500顶摊是¥0.40/顶。

**第③项:汇兑损失与手续费。**实账¥388(见14.5.1),占毛利2.8%。拆开看:中转行扣费60加元(定金被扣45、尾款被扣15,BEN条款的代价,见14.1.1)折¥312,结汇点差约¥76。量化方法:**按收款总额的1.5-2%计提**(小额、多笔、走第三方收款的取上限,PayPal综合能到7.5-8%,见14.4)。这一项有个特点:**它随收入增长而绝对增长,但比率稳定**,所以它是所有漏项里最容易预估的一项——没有理由漏。

**第④项:资金占用成本。**你这单的垫资峰值是¥900(见14.5.1),占用约三周;按年化12%(个人经营资金的合理机会成本)算:900×12%×(3/52)≈**¥6**。六块钱,可以忽略——但**你必须知道它为什么可以忽略**:因为你站在定制服务档、加价倍率接近3、客户定金2.84倍覆盖工厂定金(见14.5.1)。换成14.5.1里那个反例(客户定金20%、工厂要50%、缺口¥29,000、占用三个月),资金成本是29,000×12%×0.25=¥870,吃掉那单¥15,000毛利的5.8%。量化方法:**垫资峰值 × 占用月数 × 月息(年化÷12)**;年化利率取你真实的资金来源成本(自有资金取10-12%的机会成本,借来的按实际利率)。**规则:任何一单在报价前先画14.5.1那张余额表,余额线的最低点乘以时间,就是这一项。**

**第⑤项:售后与折让。**事故一的让步接受,折2加元/顶×40顶=80加元=**¥416**(见11.6.2),占毛利3.0%。这一项还有个"没花到你钱但差点花到"的兄弟:拆绣重绣80顶的返工费约¥600,老崔主动担下来了(见11.6)——**这次是运气,不是制度**;如果工厂不认,这¥600就是你的。所以量化的时候要按"可能落到你头上"来备,不是按"上次没花到"来备。量化方法:**按售价的1-1.5%计提**,首次合作的工厂、新工艺、颜色敏感的单取上限。¥25,740×1.5%≈¥386,和实际发生的¥416几乎吻合——**这不是巧合,1.5%这个数就是从这类真实事故里长出来的经验值。**

**第⑥项:意外费用。**第18章那笔加拿大海关查验的杂费**CAD 150≈¥780**(见18.4.1),占毛利5.7%。写这张表的此刻,货还在海上,这笔钱还没有发生——**而这正是本项的教学价值:意外费用的正确记法,是在它发生之前就在表上开一行。**你不知道会不会被查,但你知道被查的概率不是零(随机查验率通常在百分之几的量级),也知道被查一次的代价是三五天延误加一两百加元。量化方法两选一:**按售价1%计提**,或**按每票固定¥500-800**;小票用后者(因为查验费按票不按量)。19.6.2会告诉你这笔备付该从报价的哪几个点里出。

**第⑦项:你自己的时间成本。**这是七项里唯一不涉及现金、却最大的一项。翻手机日历数一遍:需求沟通与选料约30小时(第1-3章那些事)、找厂询价打样约40小时(第9、10、12章)、驻厂验货与两趟差旅约60小时、单证物流收款约25小时、事故处理与售后约15小时——**合计约170小时**。按你上一份工作折算的时薪¥100算,**¥17,000**。另外,这两趟山东的高铁与住宿是真金白银的**¥3,500**,7.3.2里那句"两趟中国的机票住宿几千块"就是它,而它从来没进过任何一张成本表。

  资金占用      0.5-1.0%
量小、新工厂、新工艺、新目的国 → 取上限;

```

## 19.6 定价

### 19.6.1 成本加成vs市场锚定:两种定价的适用场景

算完成本,该回答那个从第0章就悬着的问题了:**9.9这个数,当初到底是怎么来的?**

诚实的回答会让你自己吃一惊:**它不是算出来的。**你没有拿成本¥23.9去除以(1−目标毛利率),你是先看了一眼本地促销品渠道12-16加元的报价(见5.5.2),再看了一眼 Mike 说的12加元预算,然后在心里找了一个"明显比他现有选择便宜、又不至于低到让他起疑"的数——9.9。**这是两种定价法里的第二种,而你当时甚至不知道它有名字。**

两个名字,现场定义。

**成本加成(cost-plus)**:从自己的成本出发,加上目标利润,得出报价。公式7.1.2已经给过——报价=成本÷(1−目标毛利率)。它的逻辑起点是"我要赚多少",答案在你手里。

**市场锚定(market anchoring)**:从市场已经存在的价格出发,选定一个参照价(锚),再决定自己站在锚的上方还是下方多少,倒推回去检查成本能不能支撑。它的逻辑起点是"客户愿意付多少",答案在市场手里。它的严格版本在制造业里叫**目标成本法**:先定卖价、减去目标利润、得出"允许成本",然后逼着设计和采购做到这个成本——反过来倒推整条链。

两种方法不是水平高低之分,是**信息条件之分**。判断用哪一种,只看一件事:**客户手里有没有可比价?**

| 情形 | 用哪种 | 为什么 |
|---|---|---|
| 全新品类、独家工艺、无参照物 | 成本加成 | 客户无从比价,你的成本是这场对话里唯一的坐标 |
| 高度定制(客户的logo、客户的规格) | 成本加成为主 | 世上没有第二件一样的东西,可比性天然被削弱 |
| 红海标品(空白棒球帽、现货贴牌) | 市场锚定 | 你的成本与成交价无关,阿里页面上的价就是价 |
| 客户手里已有两三家报价 | 市场锚定 | 你不是在定价,你是在这几个数中间选位置 |
| 终端小B定制(Mike这种) | **锚定为主,加成设地板** | 他有本地替代品可比,但比不了中国出厂价 |
| 大客户招标 | 锚定+成本地板 | 必须提前算好walk-away价,守不住就退场 |

现在用这张表复盘你给 Mike 的9.9,能看出两处对、一处错。

**对的第一处:选对了方法。**Mike 手上有可比价——他自己说的"本地报价12起";你的成本(¥17.5出厂价)他永远看不到也理解不了。这种局面下用成本加成是自废武功:你把¥23.9除以(1−54%)得出¥51.9=9.98加元,数字巧合地接近,但这是**倒果为因**——你真正的定价动作发生在"看见12-16加元"那一秒。

**对的第二处:锚的位置选得有说服力。**9.9对12的预算,低17.5%;对本地最低价12,同样低17.5%。这个幅度很讲究:低5%,客户觉得"差不多,懒得换供应商";低40%,客户开始怀疑质量或者你会不会跑路。**行业经验值:相对客户现有选择便宜15-25%,是"值得为你冒一次险"的甜蜜区。**再加上心理定价的小手法——9.9而不是10,让它落在个位数,客户脑子里存的是"不到十块"。

**错的那一处,也是这一节最贵的一课:锚定得太低了。**Mike 的预算是12,本地最低是12。你报9.9,等于在他愿意付的价格上主动让掉了2.1加元。这2.1加元乘以500顶,是**1,050加元≈¥5,460**——比你这单表外漏掉的四项成本(¥4,690)还多。

怎么知道自己报低了?给你一个不需要任何情报的信号,也是本节最实用的一条:

> **如果客户第一次收到报价就接受、不还价、不犹豫,你大概率报低了5-15%。**

回想 Mike 那封回信——"Looks good, let's do it."没有还价,没有"能不能再便宜点",甚至没有等一天。买家的天性是还价,一个不还价的买家在告诉你:**这个数低于我的心理价位太多,我怕你反悔。**这不是玄学,是谈判的基本行为学。

反过来的翻车案例也给你,数字是全的。一位同行接美国客户3,000顶渔夫帽,完全成本$3.20/顶,他用纯成本加成、目标毛利30%,报$4.57。客户当天回"Approved, please send PI"。他高兴了一个礼拜,直到三个月后在广交会上跟另外两家同行喝酒,才知道同规格同数量这单市场价普遍在$5.80-6.20——**他每顶少赚$1.3,3,000顶少赚$3,900**,而这笔钱不需要他多干一分钟的活。他的病根写成一句话:**在一个有充分可比价的市场里,他用了一个不看市场的方法。**

两种方法的正确关系,压成一句话记住:

```
成本加成 → 算地板(低于它你不该接)
市场锚定 → 算天花板(高于它客户不会买)
你的报价 → 落在中间,且偏天花板一侧
```

回到9.9,用这个框架体检一次:地板在哪?完全成本¥33.28/顶=6.40加元;按定制服务档40%的最低目标毛利,地板价=6.40÷0.6=**10.67加元**。天花板在哪?本地最低价12加元。**地板10.67,天花板12,而你报了9.9——你报在了地板下面。**这一单能赚钱,靠的是老崔担下¥600返工费、靠的是查验只查了一次、靠的是你没把自己的时间算进去。

本节动作:给你手上每一个产品建一张"锚点卡",三行——①客户现在从哪买、买多少钱(去问,或者去看他的采购页面);②同行报价带(去展会、去平台、去问同行);③我的地板价(完全成本÷(1−最低目标毛利率))。三行齐了再报价。**一行都没有就报的价,不叫报价,叫猜。**

### 19.6.2 安全边际与阶梯设计:留出犯错的空间

上一节把地板和天花板画出来了,这一节讲**中间那段留多宽**,以及怎么把它设计成一张能直接发给客户的阶梯报价单。

先定义。**安全边际(margin of safety)**:你的报价高出保本价的那一部分,通常用百分比表示。保本价不是"成本价"——是**完全成本口径**的成本价,含19.5那七项。用你这单的数:完全成本¥33.28/顶=6.40加元,报价9.9加元,安全边际=(9.9−6.40)÷9.9=**35.4%**(和19.5算出的完全成本毛利率是同一个数,只是换了个说话角度)。

安全边际是干什么用的?它是**犯错的预算**。这一单里,它实实在在被花掉了三笔:

```
折让给 Mike 的 80加元                  = 1.6% 的售价
海关查验杂费 CAD 150(即将发生)         = 3.0% 的售价
两趟山东的差旅 ¥3,500                   = 13.6% 的售价
────────────────────────────────────────────
合计花掉                                = 18.2% 的售价
```

**报价时留出的那几个点,就是事故一那¥416的来处。**如果你当初报的是刚好覆盖账面成本的价格,这80加元的折让你就给不起——你会跟 Mike 争,会想办法让工厂全担,会在一个500顶的小单上把关系搞僵。**安全边际买的不是利润,是你"能爽快认错"的余地**,而在这门生意里,爽快认错是最便宜的客户维护。

给你三条硬线,直接抄进笔记本:

| 档位 | 完全成本口径毛利率下限 | 低于此线的处理 |
|---|---|---|
| 定制服务(你现在这档) | **25%** | 低于25%不接,除非是战略性种子单且写明只做一次 |
| 走量代工/纯贸易 | **8%** | 低于8%必须锁汇+预付款覆盖,否则汇率一动就归零 |
| 现货贴牌/小单快反 | **30%** | 小单固定费用重,低于30%基本是白干 |

25%这条线怎么来的?倒推:七项漏成本合计能吃掉毛利的三分之一(19.5算过),再加上一次中等事故的余量,**你需要至少25%才能保证"出一次事还不亏"**。这不是保守,是这一章所有算例的共同结论。

**现在设计阶梯。**阶梯报价的本质是把19.3那个"一次性费用摊销"的机制**明码标价地交给客户**,让他自己选。用你已经算出的成本,三档:

| 档 | 数量 | 出厂价 | 一次性摊销/顶 | 运费/顶 | 完全成本/顶(¥) | **报价(加元)** | 完全成本口径毛利率 |
|---|---|---|---|---|---|---|---|
| A | 500顶 | 17.5 | 8.80 | 2.80 | 33.51 | **11.5** | 44.0% |
| B | 1,000顶 | 17.0 | 4.40 | 2.78 | 27.69 | **10.5** | 49.3% |
| C | 3,000顶 | 16.6 | 1.47 | 2.78 | 23.62 | **9.5** | 52.2% |

(C档核算:货款¥49,800、洗水¥3,000、制版¥200、寄样¥700、差旅¥3,500、运费2.88方×¥2,900=¥8,352、换汇与折让备付各1.5%×¥148,200=¥2,223、意外备付¥800、资金占用¥66,合计¥70,864;收入¥148,200,毛利¥77,336。)

这张阶梯里藏着四条设计规则,每一条都是可以直接套用的:

**规则一:相邻档的价差控制在8-12%。**11.5→10.5是−8.7%,10.5→9.5是−9.5%。价差太小(<5%),客户没有加量的动力;价差太大(>15%),客户会怀疑你在小单上宰他——**而他的怀疑是对的**,大价差恰恰暴露了你小单报价里的水分。

**规则二:数量越小,毛利率必须越高。**44.0%→49.3%→52.2%,看起来"越大越赚",但这是**结果**不是让步:小单的毛利率低,是因为一次性费用把它压下去了,不是因为你少赚。这条规则的实用价值在于它给了你一句拒绝的话术:"200顶我也能做,但报价会到13.5,因为制版和打样的钱摊不动——**不是我不想给你便宜,是这两笔钱不管做多少顶都一样多。**"

**规则三:检查跳档临界点,让"再加一点"永远划算。**客户订999顶按A档11.5是11,489加元,订1,000顶按B档10.5是10,500加元——**多订1顶,总价反而少989加元。**这个悬崖看起来荒谬,但它是好事:它会把客户从999推到1,000,而你在B档的毛利率反而更高(49.3%>44.0%)。要检查的是反方向:**别让某个档位出现"多订反而你更亏"的区间**。检查方法很简单,把每档的边界数量代进完全成本表算一遍毛利,画在纸上是一条阶梯,每一级的台面都要往上走。

**规则四:阶梯必须带三个附加条款,缺一不可。**

```
① 有效期:本报价有效期 30 天(见9.7.1)
② 汇率:按 1 加元 = ¥5.05 内部结算汇率核定
        汇率波动超过 ±2% 双方重议(见9.7.2)
③ 运价:运费按货代当期报价据实调整,已按现行报价上浮 15% 计入
        (见13.5的buffer规则)
```

第②条要展开讲,因为它是**涨价预留最省事的一种形式**。你的全书算例汇率是1加元≈¥5.2(见0.3),但报价时你应该用一个**内部汇率**(见9.7.2)——比如¥5.05,比市场低3%。这3%不是骗客户,是你的汇率准备金:汇率不动,它是利润;汇率跌了3%,你不用去跟客户重谈。19.7的敏感性分析会告诉你,3%的汇率波动对毛利的杀伤力比20%的运价波动还大,而新人天天盯着运费,对汇率毫不设防。

**最后一条,关于涨价的时机。**新人最怕涨价,总想着"下次再说"。给你一个规则:**涨价永远在客户最满意的时候提,不在成本上涨的时候提。**具体说,就是翻单谈判那一刻——货收到了、活动办成了、Mike 说"帽子大家都很喜欢"的那封邮件之后,你回:"这次我按新的成本结构给你算,棉价和运价都涨了,同样500顶是10.5;如果你能做到1,000顶,还是9.9。"——**把涨价和阶梯捆在一起提,客户听到的不是"你涨价了",是"你给了我一个选择"。**这套话术第24章会在 R&B 翻单时完整用一遍。

本节动作:给你的主力产品做一张三档阶梯报价卡,每档写全"数量/单价/交期/一次性费用是否含"。做完自查两件事:①最低档的完全成本口径毛利率有没有到25%?②三个附加条款写全了没有?**这张卡做好之后,你80%的报价可以在三分钟内完成——而三分钟的报价速度,本身就是一种竞争力。**

## 19.7 Excel模板逐格讲解

前面六节把账算完了。这一节把它变成一个你按一次就出结果的工具——**一张能用三年的到岸成本核算表**,逐格讲。

打开Excel,新建一个工作表,命名"Landed Cost"。整张表分三个区,用底色区分,这是第一条也是最重要的一条设计原则:

```
输入区(浅蓝底)  = 只有这里能手填。别人改你的表,只准改蓝格。
计算区(浅灰底)  = 全是公式。做完之后整列锁定(审阅→保护工作表)。
结果区(浅黄底)  = 你要看的三五个数,字号放大。
```

为什么必须分区?因为**成本表最常见的死法是"有人在公式格里手填了一个数"**——那一格从此不再随输入变化,而你毫无察觉,三个月后用它报了一单亏钱的价。颜色和锁定,是防这一件事的。

**第三条设计原则:区间数一律取上限。**运费给你¥2,800-3,000的区间,B12填3,000不填2,800;快递¥60-80,填80。理由:低估成本的错误会以"报价太低"的形式变成真金白银的损失,高估成本的错误只会让你少接一单——**两种错误的代价不对称,所以你的估计必须有偏向。**

**现在做敏感性分析。**

先定义:**敏感性分析**,就是让表里的某一个输入按一定幅度上下浮动,看结果区的数变化多少;变化大的那个输入,就是这单的"敏感项",是你要重点管理和对冲的地方。

单因素做法最简单:把B5改成5.04(−3%),记下B53;再改成5.36(+3%),记下B53;然后改回来。用 R&B 的账面口径(与7.3.2/13.5可比)跑一遍:

| 变动项 | 幅度 | 毛利(¥) | 毛利率 | 相对基准 |
|---|---|---|---|---|
| 基准 | — | 13,790 | 53.6% | — |
| 汇率 ¥/CAD | −3%(5.04) | 13,032 | 52.2% | **−5.5%** |
| 汇率 ¥/CAD | +3%(5.36) | 14,592 | 55.0% | +5.8% |
| 运价 ¥/方 | +20%(3,480) | 13,514 | 52.6% | **−2.0%** |
| 出厂价 | +5%(¥18.4) | 13,353 | 51.9% | −3.2% |
| 折让 | 售价1.5% | 13,404 | 52.1% | −2.8% |

**结论只有一句,但值一整节:汇率±3%对毛利的杀伤力(±5.5%),比运价±20%(∓2.0%)大得多。**新人天天在微信群里问运费涨没涨,却从来不看汇率——而汇率是唯一一个**你完全无法控制、幅度可以很大、且直接乘在全部收入上**的变量。这就是14.5.2讲锁汇的理由,也是19.6.2要求用内部汇率¥5.05报价的理由。

3. 第60行往右写列变量(汇率):5.04 / 5.20 / 5.36
4. 选中 E60:H63 整个矩形

   输入引用行的单元格:$B$5   输入引用列的单元格:$B$12
6. 确定 → 九个格子自动填满
```

跑出来是这张(毛利率):

| 运价\汇率 | 5.04(−3%) | 5.20(基准) | 5.36(+3%) |
|---|---|---|---|
| ¥2,320(−20%) | 53.4% | 54.7% | 56.0% |
| ¥2,900(基准) | 52.2% | 53.7% | 55.0% |
| ¥3,480(+20%) | 51.1% | 52.6% | 53.9% |

**九个格子,极差4.9个百分点,折¥2,117。**最坏的角落(运价+20%且汇率−3%)仍有51.1%——这就是**安全边际的可视化**:你这单的成本结构厚到足以承受双向的坏消息。

但真正的教学价值在于把同一张表套到别的生意上。拿14.5.1那个走量代工的例子:采购¥100,000、售价¥115,000、毛利15个点。汇率−3%,收入变成¥111,550,毛利掉到¥11,550,**毛利率从15%掉到10.4%**——同样3个点的汇率波动,在54%毛利的单上损失相对值5.5%,在15%毛利的单上损失相对值31%。**同样的风浪,吃水浅的船晃一晃,吃水深的船就进水。**

于是得到本章最后一条规则,请把它写在核算表的表头上:

> **完全成本口径毛利率低于20%的单,必须做以下至少一项:锁汇(见14.5.2)、报价单写入汇率重议条款(见9.7.2)、或要求预付比例覆盖全部采购成本。三样都做不到,这单的风险不由你控制,别接。**

本节动作:今天就把这张表建出来——三个区、三种底色、B54和B56两个公式一个不能少。建完做三件事验收:①用上面那组 R&B 的输入值跑一遍,B50应该出**¥33.24**、B53应该出**35.4%**(对不上说明你哪一格抄错了,这是完全成本口径,和19.5那张表咬得上);②把B19差旅、B22折让备付率、B23意外备付三格清零,B50会变成**¥23.87**、B53变成**53.6%**——**这就是第7章那张账面表**,两个口径的差额在你眼前跳一下,比读十遍19.5都管用;③把B5改成5.04,看毛利掉多少。**第三件事只要做过一次,你这辈子报价都会记得留汇率buffer。**

# 第20章 认识你的客户

**主线推进** —— 九月中旬的周一早上,你还没起床,手机连震三下。Mike发来三张照片,一个字都没配。第一张:吧台后面那面旧木板墙上钉了一排木钉,五顶藏青色的帽子挂成一条线,古铜色的滑扣在射灯下泛着暗光;第二张:一个留大胡子的客人把帽檐压得很低,举着一杯琥珀色的酒冲镜头笑;第三张是块手写小黑板,粉笔字写着 RIDGE & BARREL CAP — $30。第四条消息才是字:"Sold 61 last night. Everyone asks where we got them."

你坐在床边把三张照片看了三遍。你先看的当然是绣花——麦穗的金黄在射灯下正得很,那批返工过的帽子你到现在还认得出是哪几顶。然后你才看见别的东西:那面木板墙、那杯酒、那块小黑板。这些跟你毫无关系的东西,合起来构成了一件跟你极有关系的事:你做的500顶帽子已经不是货了,它们变成了别人生意里的一个零件。

三个半月前在市集上认识Mike的时候,你以为你接到了一单生意。看着这三张照片你才明白,你刚做完的是一次演习:从翻译需求到验货返工到清关补文件,整条链路你已经完整地走过一遍,而且走通了。演习结束,问题就变了。你放下手机,在笔记本新的一页上写下一行字:

**这样的客户,世界上还有多少个?怎么找到他们?**

第二个问题要用整个第五部来回答——阿里国际站、展会、开发信、地推,第21、22章一样一样拆。但第一个问题必须今天先答,而且必须答在所有获客动作之前:**找错人,所有手艺都白使。**这一章不教任何获客动作,只做一件事——把这个世界上买帽子的人分类、称重、画像,最后从中圈出属于你的那一小块。

## 20.1 客户分类学

第5章你在酒店房间画过一张需求侧地图(见5.5),那张图回答的是"这个行业里都有谁"。这一节要把同一批人重画一遍,回答的问题换成了:**他们各自是什么脾气,我该怎么接、怎么报、怎么收钱、什么时候该躲开。**同样五类人,上一次是望远镜,这一次是说明书。

### 20.1.1 品牌方与批发商:大单的两种脾气

九月底的一个上午,你的邮箱里躺着两封信,都带着"大单"的气味,脾气却完全相反。

第一封来自一个加拿大户外品牌 Northline Outfitters,署名是 sourcing coordinator(采购专员),正文四行加一个附件:"我们正在开发 SS27 头饰胶囊系列,三个款。请填写附件的供应商问卷,并提供你们的 BSCI 或 Sedex 审核报告、面料供应商名单。目标 FOB 2.80 美元。出运窗口:2027年2月。"你数了数附件问卷的页数,十一页。你又算了算日子:出运在明年二月,还有五个月;而按品牌的流程,真正的PO要到十二月前后才下,货款还得等出货后的账期——**你今天开始填这十一页问卷,最快也要八九个月后才见得到第一笔钱**,前提还是你能过验厂那一关。

第二封来自迈阿密的 Sunbelt Headwear Supply,署名只有一个名字加一行手机号:"6片软顶水洗全棉帽,不要logo,5个颜色,每色3,000顶共15,000顶,报FOB青岛。另外把你们全部白帽的价目表发我。付款30/70。最快多久能出?"

两封信并排放着,你第一次看清了大单的两种脾气。**品牌方买的是确定性,批发商买的是价格与速度**;前者用流程把风险挡在门外,后者用比价把成本压到地板。要接哪一种,先看懂它们各自的门在哪、坑在哪。

先补一个这一章要反复用的工具:**决策链**——从"某个人产生了买帽子的念头"到"钱真正打到你账上",中间要经过的人和环节。决策链不是感觉,是可量化的三个指标:**几个人**(参与决策的人数)、**几层**(要往上报几级)、**多久**(从第一次接触到首单打款的周期)。这三个数字直接决定你在一个客户身上要投入多少小时、要等多久见钱。品牌方的决策链是5-8人、3层、9-12个月:采购专员、产品经理、设计师、品控、财务,还有一位真正拍板的品类总监,而你从头到尾只能跟采购专员对话。批发商的决策链是1-2人、1层、1-2周:老板本人看价格,采购助理催样品。同样是"大单",一个是马拉松,一个是百米冲刺。

品牌方那三道准入门,第5章已经描过一遍(季节企划、vendor list验厂、账期30-90天,见5.5.1)。这里只补上新人最容易踩碎的两块地板。第一块叫**免费开发**:品牌方开发一个胶囊系列,常规动作是同时找四五家供应商各打一轮样,比完再定。三个款、两轮打样,你要出制版费约¥600、样品成本¥400、国际快递两趟¥500,合计一千五,外加你两个月的往返沟通;而最后那句话极可能是——"抱歉,这一季头饰品类被砍了,下一季再合作。"这话十有八九是真的,不是托辞,但真话不会退你钱。第二块叫**准入沉没成本**:BSCI这类社会责任审核(见12.4.2)是**工厂的**证书不是你的,你没有工厂,你能提供的只有合作厂的报告;而中型厂常常没有,做一次几万块,厂长凭什么为你一个单去做?这就是品牌方对轻资产贸易商真正的门槛:**它审的是产能主体,而你不是产能主体。**

批发商是另一套逻辑,也必须重新定义一下。这里说的**批发商**,指的是在目的国进货囤货、再卖给下游零售店、本地绣花厂、促销品供应商的进口商——注意别和7.1.1那条价值链上"批发$13"的那一手混了,那说的是批发给零售店的价,而这里说的是那个囤货的人本身。他的生意模型只有一句话:**用仓库赚周转的钱。**由此长出他的三种脾气:**要价格**,因为他下游全是拿他的货去互相拼刺刀的人;**要现货感**,他问"最快多久能出",真实意思往往不是这一单急,而是试探你的补货能力——他的仓库缺色断码时,能不能15天内补上;**复购快但没忠诚**,他的比价成本是零,一封群发邮件就能问遍十家工厂,你的报价三天后会原封不动出现在别人的谈判桌上。

带你算一笔批发商单的账,你就知道这种"大"是什么滋味。15,000顶无logo水洗软顶帽——没有绣花、没有金属滑扣,比R&B主款简单得多,工厂出厂按 **¥11.5**(量大后的阶梯价,口径见9.7.1),加上内陆运费与报关摊销约¥0.25,你的成本是 ¥11.75/顶。你报 FOB 青岛 **$1.78**(≈¥12.64),15,000顶货值 $26,700 ≈ ¥189,570;毛利 **¥0.89/顶,合计约¥13,350,占7个点**。这个数字和R&B那一单的¥13,790几乎一样——现在看资金那一栏:客户30%定金 ≈ ¥56,871,你付工厂30%定金 ¥51,750,刚好覆盖;但出货前工厂要收尾款 **¥120,750**,而客户的尾款要等提单副本、要走他公司的付款周期——**中间那七到十天,你的账上必须有十二万现金趴着。**对比R&B那一单的垫资峰值:¥900(见14.5.1)。同样一万三的毛利,一个要你压十二万,一个只压九百块。这就是"大单"这个词最贵的部分:它大的不只是收入,还有你必须自带的血量。

给你一段最经典的批发商对话,连托辞都替你标好。你报 $1.78,三天后回信:"Another supplier quoted $1.58, can you match?"——**这句话八成是真的,但它省略了条件**:那个 $1.58 大概率是更轻的克重(180g对你的240g)、更薄的檐芯、四行檐面线对你的六行(檐面线行数与加价口径见2.3.2)。正确接法不是降价也不是辩解,是回一句:"Happy to match the spec first — could you share their fabric weight and panel construction? If it's 180gsm I can quote that spec too, at $1.60."把比价从价格拉回规格,这一句能让一半的比价当场结束(拆规格的逻辑见5.2.2)。

本节动作,两张卡。**品牌方五问**(在填任何问卷之前发出去):这个款单次下多少顶?PO大概什么时候下、船期窗口在哪个月?账期几天?测试项目和验厂标准具体是哪几项?打样费和样品费你们付不付?五问里只要"打样费"那一问对方含糊其辞,这个客户在你现阶段就该降级为"只建联系不追单"。**批发商三条自保线**:①报价单永远写有效期15天(见15.2);②首单不给任何账期,30/70雷打不动;③不为任何客户免费备库存——他说"你先备三千顶现货我随时来提",这句话翻译过来是"你出钱替我囤货"。

### 20.1.2 促销品经销商:ASI/PPAI体系与转单逻辑

第5章那道作业你做过:上一家北美促销品在线商城,按R&B的规格走一遍在线报价,得到 $9-12 的那个数(见5.5.2)。今天你要做的是把这件事反过来——不是去当他们的客户,是去当他们的供应商。

你先花两小时试了最笨的路:在行业目录里搜 custom cap,想找一条"入驻通道"。结果撞了墙。这个体系的供应商侧(supplier)几乎全是北美本土公司,想挂进行业目录要交年费、要有本国实体和信用背书,还要能承诺目录货5-10个工作日出货——这三条你一条都不占。你以为路断了,其实是你走错了门。**你不是要挤进他们的目录,你要接的恰恰是目录满足不了的那类单。**

这就是本节的核心概念:**转单**——分销商把一个原本该走本土供应商的订单,转成从海外(也就是你)直接采购。转单不是天天发生,它有明确的三个触发条件,任何一条都不满足的单你去抢也抢不到:**量**(通常1,000顶以上,量小了他懒得折腾一趟跨境);**时间**(客户给的交期在6周以上,够走海运或至少海空联运);**定制深度**(目录里没有的款型、面料、配色或工艺——全定制的绳绣款、指定潘通色的整顶染色、异形金属标)。反过来说,凡是"500顶目录里的现成款、两周内要"的单,他一定走本土,你去报价只是浪费两边的时间。把三条触发条件背下来,你在展会上和一个分销商聊三句就能判断出他手里有没有你的单。

行业结构和渠道纪律第5章已经讲过,这里补上纪律的**实操后果**,因为新人最容易在这里一次性死掉。分销商把终端客户的名字交给你,是这个行业里最高级别的信任;你若哪天绕过他直接联系那个终端,后果不是丢一个客户。真实的场景是这样的:你在展会上拿到某分销商的名片,聊天中他提了一句他在服务本地一家银行的年会;半年后你在LinkedIn上找到那家银行的市场经理,发了一封开发信。两周后你的分销商给你来一封邮件,一句话:"We're done. I've let a few friends know."——这个行业的分销商彼此都在同几个协会群里,一句话传下去,你就从"一个新供应商"变成了"那个跳单的中国人"。**渠道纪律的本质不是道德,是这个行业的生存结构**:分销商全部的资产就是客户名单,你动他的名单等于要他的命,他必然用尽全力反击。铁规则一条:**终端客户的名字只进你脑子,永远不进你的开发名单。**

怎么被他们找到?按性价比给你排序,前两条零成本,后三条要花钱。第一,**LinkedIn定向**:按公司名(带ASI编号的促销品公司)加职位关键词 sourcing、product development、purchasing 找人,一天能定位二三十个精准对象(打法见21.4)。第二,**海关数据反查**:查目的国进口帽子的收货人名单,把其中带 promotional、marketing、branding 字样的公司挑出来——这些人已经在做进口,不用你去教育(见21.3.1)。第三,**行业展会**:这个行业最大的两个展在每年一月,不摆摊只逛展也能收一叠名片(见21.2.2)。第四,**阿里国际站**:分销商确实也在上面搜,但你要熬关键词和评分(见21.1.2)。第五,转介绍——服务好第一个,他会把你介绍给协会里的同行,这是长期最便宜的那条。

接下来是全节最要紧的一段:**怎么报价。**促销品分销商不接受你从成本正着往上加,他们给你一个数,让你回答能不能做。这个动作叫**目标价倒推**——从客户给的目标价出发,逐项扣掉你必须付出的成本,看最后剩给你的空间够不够。带你完整算一遍,这是本章最该抄进笔记本的算式。

分销商邮件:"6片结构帽,3,000顶,前幅和后幅两个位置绣花,DDP洛杉矶,目标价 $3.80,可以做吗?"

第一步,把目标价换成人民币口径:$3.80 × 7.1 = **¥27.0/顶**(汇率口径见0.3)。第二步,逐项扣掉与工厂无关的成本:海派专线双清包税按方计价,3,000顶约30箱2.9方,合 **¥2.8/顶**(见17.4口径);收款与换汇约1.5%,**¥0.40**;汇率buffer按2%预留,**¥0.54**(见9.7.2);制版费两个位置¥300加样品与快递约¥500,摊到3,000顶 **¥0.27**。四项合计 **¥4.01**。第三步,剩下 ¥27.0 − ¥4.01 = **¥22.99**,这是"工厂加你"两个人分的钱。第四步,查工厂那一头:6片结构帽3,000顶的阶梯价约¥16.6(见9.7.1),两个位置绣花约14,000针比常规多一个位置,加约¥2.3,合 **¥18.9**。第五步,你的空间 = 22.99 − 18.9 = **¥4.1/顶,占报价的15%**,3,000顶合毛利 **¥12,300**。

有了这个算式,你就有了判断阈值,记死三档:**净空间低于10%,放掉**——10个点撑不住一次汇率波动加一次小返工,你是在替所有人打工;**10-15%,谨慎接**,条件是把定金提到40%、交期加两周buffer;**15%以上,正常接**。上面这单15%,可接。如果他把目标价压到 $3.40(¥24.14),你的空间掉到 **¥1.2/顶,只剩4.6%**,正确回复不是硬着头皮接,也不是干巴巴一句"做不了",而是**报出差额并给替代方案**:"$3.40 我差 $0.20——保持两个位置绣花的话,$3.60 是我能守住的底;但如果后幅改成印唛(见3.3.1),$3.40 我现在就能接,效果我发张实拍图给你看。"——这个行业尊重算得清账的人,一封写着具体差额的拒信,比十封"亲我们价格很有优势"的推销信更能让你被记住。

付款与交期习惯也和你熟悉的终端客户不同。分销商在本土的行规是给供应商 net 30(货到后30天付款),但对海外新供应商,T/T 30/70 或 50/50 他们普遍能接受——因为他们自己向终端企业客户收的常常是50%定金甚至全额预付,活动单尤其如此,**他们手里其实不缺现金,缺的是对你的信任**。所以第一单坚持30/70不丢单,反倒显得你有规矩。交期上,他们习惯本土5-10个工作日的节奏,对进口单会给到6-10周,但那个日期背后永远钉着一个终端客户的活动日,和团队机构的死线一样铁(见5.5.3)。你的交期承诺一律写成"确认样与定金孰晚起算"(见15.5.1),并在心里再压两周buffer——事故二那五天怎么来的,你比谁都清楚。

最后回答"为什么值得为一个分销商下这么大功夫"。算笔账:一家中型促销品分销商年营业额 $2-5M,帽子这个品类通常占 8-15%,即 $200-600K 的帽子采购;其中符合转单三条件的部分保守按 20-30% 算,就是 **$50-150K/年**,换算成R&B那种量级的单是**一年3-8单**。7.3.2给过你一个天花板算式:一年服务二十个Mike量级的客户,年毛利二三十万。现在把分销商放进去:**接通两三个分销商,等于凭空多出来十几个Mike,而且不用你一个一个去认识。**这就是"服务好一个等于接通一片"的具体数字。

本节动作:做一份**能力单(capabilities sheet)**,一页PDF,五块内容——①六到八张自己做过的实拍图(R&B那三张现场照,征得Mike同意后就是最好的第一张);②起订量与阶梯价;③装饰工艺与每个位置的加价表(绣花/印花/皮标,口径见第3章);④标准交期表(生产多少天+海运多少天+空运多少天);⑤到洛杉矶、纽约、温哥华三地的DDP参考价。这一页纸就是你在这个行业里的通行证,开发信正文只写三行,剩下的全交给它(写法见21.3.2)。

### 20.1.3 终端小B与C端:小单的价值在复购

把镜头拉回那三张照片。Mike是这一类客户的完美样本,整章你都可以拿他当尺子:**终端小B**——自己有终端场景、自己就是最终使用者、买帽子不是为了转手赚差价,而是为了自己的生意或组织本身,规模小到老板一个人就能拍板。

先把这类人的名单列全,因为它比大多数新人想象的宽:精酿酒厂和酒吧、咖啡烘焙店、健身房拳馆攀岩馆、业余球队与跑团、越野车与摩托车俱乐部、纹身店与理发店、农场与农机经销商、乐队与音乐节、教会与校友会、婚礼与家族聚会、刚拿到融资要发周边的创业公司。看着杂,识别特征只有三条:**有logo、有社群、有事件**。三条同时具备的,就是你的猎物;缺"事件"那一条的(比如一家没有活动计划的小超市),现在还不是。

这类客户的五个优点,每一个都要讲到机制,否则你会以为那只是运气。

**第一,单量小但毛利高。**R&B那单54%(见7.3.2),不是你会谈判,是因为**Mike没有可比价的对象**。他的参照系是本地促销品公司报的 $9-12/顶(见5.5.2),不是1688上的¥17.5——他压根不知道后面这个数存在,也不需要知道。这不是信息不对称的偷袭,是渠道级的价差(那道缝有多宽,20.4会量给你看)。**第二,决策快。**决策链1人、0层、3-15天:Mike从收到报价到打定金用了不到两周,中间还砍了一次价。对比品牌方的9-12个月,同样投入一个月的沟通时间,你在小B这里能推进三四个客户,在品牌方那里连问卷都还没填完。**第三,复购像订阅。**机制在于帽子对他是**耗材不是项目**:周年活动年年有,新酒款季季出,球队每个赛季换一批。**第四,自带故事。**他的帽子会出现在Instagram、活动现场、客人头上——这些照片经他同意后就是你的案例,而一个小B客户的案例最容易打动的,恰恰是下一个小B(内容获客的滚法见第23章)。**第五,付款干脆。**没有采购流程、没有账期、没有付款周期,30%定金当周就到账。

一个缺点,而且致命,必须算清楚:**固定成本摊销。**你为一单要付的固定开销大致是制版¥200、开发样¥300、国际寄样两趟¥700,合计约**¥1,200**(口径见3.1.5、10.4)。摊到500顶是**¥2.4/顶**,忽略不计;摊到100顶是**¥12/顶**,吃掉你近四成毛利;摊到30顶是**¥40/顶**,直接把这单变成负数。所以小B这一类客户有一条硬下限:**100顶起,且制版费与样品费照收(下单冲抵,见10.4.1)。**低于100顶不是不能做,是不能用这套流程做——那是下面C端那一段的话题。

**C端定制**,指个人消费者的定制单,1到12顶,常见于婚礼、家族聚会、生日、送人。给你算一笔真实的账,算完你就再也不纠结了。一位加拿大网友想要12顶婚礼帽,绣新人姓名首字母。走你现有的流程:制版¥200 + 打样一轮¥300 + 样品快递¥250 + 12顶货款¥210 + 12顶国际快递(约1.5kg)¥300 = **¥1,260**,合每顶 **¥105 ≈ 20.2加元**;而他在本地手工电商平台上能买到当地绣好、三天到手的同类产品,CAD $28/顶。你便宜不到8加元,却要他等四周、承担关税风险、还没法退换。更要命的是另一本账:这一单你要回15封邮件、出3版效果图、耗掉近两小时——**毛利不到¥400,时薪不到¥200,而且下一单从零开始,一点复用价值都没有。**结论写死:**跨境C端定制在"制版+打样+国际快递"这三项固定成本上必然亏,除非把这三项产品化**——三条出路是现货贴牌(用共享字体版免制版、成品帽绣花¥2.5-3.5/顶,见第6章)、把起订量和加价写成菜单让客户自助(见22.4.2)、或者干脆把C端当作款式测试与内容素材来源,不当利润来源(见22.2)。

现在给你本章最赚钱的一句话,它就藏在一段C端对话里。有人来问:"能不能只做1顶?我愿意多付点钱。"你按上面的账算给他听,他说"那算了,谢谢"。三个月后同一个人回来了:"我们攀岩馆要办十周年,老板让我问问200顶什么价。"——**C端询盘不是订单,是线索。**所以任何一个C端询盘进来,你的第一句回复不是报价,是这一问:"**这是给你自己做,还是给一个团队、店铺或者组织做?**"这一句把C端和小B分开,也把今天的小单和明年的大单分开。答"自己",给他菜单式的现货方案,三句话结束;答"给店里/给队里",恭喜你,一个小B站在门口。

本节动作,小B接单三条铁律,现在就写进你的报价模板:①**100顶起订**,低于100顶只提供现货贴牌方案,不走定制流程;②**制版费与样品费照收**,写明下单后冲抵——收费不是为了那几百块,是为了筛掉不认真的人;③**每单交付后30天内做一次回访**,只问一句"下一个活动大概什么时候",把答案连同日期记进客户表。第三条是第24章那整套复购打法的种子,现在种下,明年收。

## 20.2 订单特征对照表:量价质决策复购五维

你把五类客户写在五张便利贴上,按顺序贴在旅馆房间的墙上:品牌方、批发商、促销品分销商、终端小B、C端。然后在旁边竖着写下五个词:量、价、质、决策链、复购。

为什么偏偏是这五维?因为它们分别对应你这门生意的五个死穴。**量**对应工厂的门槛——量不对,你连生产都排不进去;**价**对应你的毛利;**质**对应返工与索赔的风险;**决策链**对应你最稀缺的资源,时间;**复购**对应你能为获客花多少钱。任何一个客户,只要这五格填出来,该不该接、怎么接、先接谁,答案自己就浮出来了。

| 维度 | 品牌方 | 批发商 | 促销品分销商 | 终端小B(R&B型) | C端 |
|---|---|---|---|---|---|
| **量** | 单款3,000-20,000顶,按季 | 单次10,000-50,000顶 | 单次1,000-5,000顶 | 100-500顶 | 1-12顶 |
| **价** | 压到工厂档,你留5-10% | 拼刺刀,你留5-8% | 目标价倒推,你留10-20% | 40-55% | 纸面高,固定成本吃光 |
| **质** | 测试报告+AQL+验厂 | 批次一致性(色差是头号投诉) | 装饰精度(logo即交付物) | 手感与故事 | 单顶完美,一顶就是100% |
| **决策链** | 5-8人/3层/9-12个月 | 1-2人/1层/1-2周 | 2人(分销商+终端)/1层/2-6周 | 1人/0层/3-15天 | 1人/当天 |
| **复购** | 年度框架,进得去就稳 | 高频但零忠诚,随时被比价换掉 | 稳定转单,一个顶一片 | 年年有活动,像订阅 | 几乎为零 |
| 定金习惯 | 无定金+账期30-90天 | 30/70,尾款拖 | 30/70或50/50,爽快 | 30/70,当周到账 | 全额预付 |
| 你的角色 | 供应商名录里的一行 | 一个报价来源 | 海外产能伙伴 | 唯一的那个人 | 一次性交易 |

表填完了,逐维再说透,每一维都给你一个能直接用的阈值。

**量:你的约束不是产能,是工厂门槛。**产能是工厂的事,轮不到你操心;真正卡你的是订单量落在哪个厂型的甜区里(厂型口径见第6章)。低于300顶,只有作坊和快反厂接;300到3,000顶,是中型厂的甜区,也就是你现在这家八条线的厂;超过10,000顶,你会遇到另一种风险——量大到工厂觉得值得自己去接,你被绕过去(客户直连的风险见7.3.2)。所以量这一维,你的安全区是 **500-5,000顶**,这个数字20.4还会从另一个方向再推一遍。

**价:不看单价,看毛利额除以垫资额。**这是本节最该记住的一条。把前面三笔账并排放:小B单,毛利¥13,790,垫资峰值¥900;分销商3,000顶单,毛利¥12,300,守住"款到交仓"(见14.1.2)后垫资峰值约¥20,000;批发商15,000顶单,毛利约¥13,350,垫资峰值约¥120,000。三笔单的毛利额几乎一样,做一次除法:**15.3、0.6、0.11。**每压一块钱现金,小B单给你回的是批发单的一百四十倍。同样的一年,你能做多少笔?小B单一笔压九百块,你可以同时跑五个;批发单一笔压十二万,你一年只跑得动一笔,还得祈祷不出事。**新人排序订单的正确指标是毛利额÷垫资额,不是订单额。**把这条写进你的判断纪律,它会替你挡掉大部分"看起来很美"的机会。

**质:不同客户对"质"的定义完全不同,验货标准要按客户类型调。**品牌方要的是第三方测试报告加AQL判定(见第11章);批发商最怕的是批次色差,因为他要靠不同批次配色补货,同一个色号两批不一样,他的下游就炸了;分销商要的是装饰精度——logo是他交付给终端的全部,绣歪了他没法交差;小B要的是手感和故事,Mike那句"摸起来厚实、戴旧了好看",本质上是感官验收;C端要的是单顶完美,你出一顶次品就是100%不良。由此推出一条实操规则:**500顶以下的小B和C端单,一律100%全检**——反正只有几百顶,人工按¥0.2-0.5/顶算(见第11章口径),500顶的全检成本不到250块,而一次差评的代价是这个客户和他背后整个社群。

**决策链:换算成小时,你才知道贵不贵。**品牌方一个客户从首次接触到首单打款,你要投入40-80小时,周期9-12个月;分销商是8-15小时、2-6周;小B是2-6小时、3-15天。再叠一层现实的转化率:冷开发信的回复率通常1-3%(见21.3.2),本地面对面地推的转化率能到10-20%(见22.5)。两个数字相乘你就明白为什么第五部把顺序排成那样:**在你只有一个人、每天只有八小时的阶段,决策链短的客户不只是好谈,它是你唯一负担得起的客户。**

**复购:它决定你能为一个客户花多少钱。**先补一个概念:**LTV(客户终身价值)**——一个客户在你这里累计贡献的毛利,而不是单笔订单的毛利。算Mike的LTV:首单¥13,790;此后若年年翻单,翻单免制版、免打样、款式已定型,单顶毛利更高,按¥30/顶、每次400顶算是¥12,000一次;三年做五次,加上首单,**LTV约¥7万**。保守一点,把小B的LTV区间定在**¥3-8万**。行业通行的获客预算规则是按LTV的10-20%花,于是你得到一个会改变你所有决策的数字:**为拿下一个小B客户,你可以花¥6,000-16,000。**——飞一趟温哥华、住五天、跑三十家精酿酒厂,值不值?现在你有答案了(这条路怎么走见22.5)。批发商的LTV表面上更高,但忠诚度接近零,按五折看待;品牌方LTV最高但要先熬过9-12个月,资金成本自己算。

最后给新人的切入路径,一句话:**先小B,再分销商,后品牌与批发。**三条理由,每条都在上面的表里。**现金流**:小B的定金覆盖工厂定金,你几乎不垫钱(见14.5.1),这决定你能不能活到第二年。**学习曲线**:同样一次绣花色差,在500顶上是¥600加两天(事故一),在15,000顶上就是一万八加两周,你现在这个阶段犯的每一个错都必须便宜。**案例资产**:小B自带故事,一个客户的现场照片能给你滚出下一个客户,而品牌方和批发商的单你连拍照发朋友圈的权利都没有。给你一个十二个月的节奏表:前六个月吃透8-10个小B单,把流程跑顺、把案例攒够;六到十二个月,拿着案例和能力单去敲2-3个促销品分销商;满一年之后再谈批发和品牌——那时候你缺的不再是能力,是本金,而本金正是前面十二个月攒出来的。

本节动作:把上面那张大表打印出来贴在你办公桌正对的墙上。以后每收到一个询盘,第一个动作不是报价,是在表上找它属于哪一行——**行找对了,回复的速度、报价的姿势、收款的条件,三件事同时就有了答案。**找不到行的,说明这是个你还不认识的客户类型,先问问题,别急着报数。

## 20.3 市场画像

客户类型解决的是"他是谁",市场解决的是"他站在哪块地上"。同样是终端小B,温哥华的Mike和大阪的一家咖啡店,你要准备的东西完全不同:一个只要产地成分标,一个要检针证明。这一节两小节,北美讲透,其余四片速写——顺序就是新人该去的顺序。

### 20.3.1 北美:品类、价格带与合规要点

你把Mike那张吧台照放大看背景,才发现木板墙上除了帽子还挂着两件连帽卫衣和一块搪瓷牌。看着看着你意识到一件事:**你其实只认识一个北美,就是Mike的那个北美。**于是你花了一个下午做了件笨事——开三个浏览器窗口,一个开品牌官网,一个开促销品商城,一个开亚马逊,把帽子的价格和款式抄了一遍,抄满两页纸。抄完你才第一次看清这块大陆的形状。

**品类偏好,按渠道分得很清楚。**软顶水洗棉的 dad hat(见2.1.2)是精酿、咖啡、生活方式类品牌的默认款,R&B就是标准样本;**trucker**(前布后网,见1.2.4)是美国中西部、农业机械经销商、户外与钓鱼文化的图腾,也是夏季活动的第一选择——你给Mike做的四SKU方案里那个夏季款(见1.2)正是冲着这个来的;**五片camp cap**属于滑板与年轻户外;**结构化六片棒球帽**是企业礼品、体育队和大众促销的主力,量最大、竞争也最凶;**beanie**是秋冬节日礼的头牌,注意一个本地细节:**加拿大人管毛线帽叫 toque**,你在邮件里用这个词,对方会立刻感觉你懂行;高尔夫帽与visor跟着高尔夫季(4-9月)和美国南部的网球走。

**价格带三条线,请背下来,它们是你所有报价的坐标系。**白帽批发 $3-8/顶(见5.4.1);促销品渠道定制落地 $9-12/顶(见5.5.2);品牌零售 $25-40/顶(见7.1.1)。而你的位置在哪?给终端客户的DDP报价 $6.5-7.5(R&B那9.9加元合$7.25),给分销商的报价 $3-4.5。**你的报价永远落在"白帽批发价之上、本土定制价之下"的那条带里**——低于白帽批发价说明你在亏,高于本土定制价说明你没有存在的理由。

**采购季节性,是北美最值钱的一条规律,新人十个有九个不知道。**这个市场的下单窗口按季走:**Q1(1-3月)**下春夏帽——棉质dad hat、trucker、visor,4-6月到货,赶4月开始的活动季、棒球季、高尔夫季;**Q2(4-6月)**下秋季与开学季的单——校队、大学周边、社团;**Q3(7-9月)**下节日礼品单——beanie、礼盒装,10-11月到货,赶11-12月的企业年礼与节日零售;**Q4(10-12月)**是整个行业的交付季与收货季,几乎不下新单。请把最后这句话读两遍:**Q4不是你的旺季,是你的开发季。**别人在忙着发货和收尾,正是你打电话、发开发信、约明年的最好时机。

由此反推出你的**开发日历**,两句话:**开发要比下单早两个月,下单要比交付早三个月。**也就是说,你要在11-12月去敲那些明年春夏要下单的客户,在5-6月去敲那些下半年做节日礼的客户。拿主线验证一遍:Mike的活动在9月中,他6月初发的第一封邮件,提前三个半月——完美落在标准节奏上。这不是Mike懂行,是**做活动的人天生按活动日倒推**,而你要做的是比他更早一步出现在他视野里。

**合规要点,四条,每条都直接对应你要问客户的一个问题**(法规细节与标签样式见18.6)。第一,**永久性产地标**:Made in China 必须以永久缝制的标签形式出现在帽内,美加都要求,漏了就是清关风险。第二,**成分标**:美国要求纤维成分、原产国、以及负责方名称或RN号;加拿大更进一步,要求**英法双语**外加CA号(经销商注册号)。这里给你一个立刻能用的动作——报价时顺口问一句"**你的RN号或CA号是多少?我们缝标时要打上去**",这一问在北美客户耳朵里的分量,顶得上你三段自我介绍。第三,**童帽**:12岁以下的儿童尺码(50-54码段,见2.5)在美国要过CPSIA——铅与邻苯限量、追溯标签、拉绳规范,加拿大有对应的CCPSA。规则一刀切:**儿童尺码的单,先问客户要合规要求和测试预算,拿不到就不接**,一次召回够你破产三次。第四,**加州Prop 65警告标**(新术语:加州对含特定化学物质的商品要求在包装上标警示语)——金属件是重灾区,滑扣、鸡眼的电镀层可能触发铅镉限量。R&B用的古铜滑扣如果哪天要发加州,你必须回头找工厂要电镀件的检测报告。

**加拿大和美国,五条差异必须分清,因为你的第一个客户就在加拿大。**其一,**规模差十倍**:加拿大人口约3,900万,美国约3.4亿,所以加拿大的促销品行业小、圈子紧——好处是口碑传得快,坏处是得罪一个传一片。其二,**双语**:标签、包装、甚至产品说明都可能要英法两种语言,魁北克尤其严。其三,**税与关税**:加拿大有MFN与General Tariff的巨大差别(见16.6)、有GST/HST、有CARM申报系统(见18.4.1);美国走HTS并可能叠加加征(见18.4.2)。其四,**小包免税额差得离谱**:美国的de minimis门槛长期是$800,加拿大走快递渠道只有CAD $40免税、CAD $150免关税——这条直接影响你的打法:**寄样品和做小批量试单,发美国比发加拿大便宜得多**,给加拿大客户寄样时一定提前告诉他可能被收税,否则他签收时的心情会毁掉你整轮沟通。其五,**品类结构**:加拿大冬季长,beanie和保暖款占比明显高于美国。

本节动作两件。第一,建一张**北美开发日历**,两列:月份 / 这个月该敲谁,把上面四个季度的窗口填进去,设成日历提醒——这张表会在你没单的月份告诉你该干什么。第二,把三个合规问题写进你的询盘回复模板,一次问清:①产地标和成分标你希望怎么写、有没有RN/CA号?②有没有儿童尺码?③货最终会不会进加州?三个问题三行字,却能挡掉你未来三年最贵的几个坑。

### 20.3.2 欧洲、日韩、中东拉美速写

你在一个外贸交流群里潜水,一个下午刷到四条求助,截图存了下来:一个人在问德国客户要的REACH报告去哪办;一个人说日本客户为一根断针退了整批货,一千二百顶;一个人在问迪拜客户"先发货后付款"能不能答应;还有一个人的货在圣保罗港压了七周,客户开始要求降价才提货。

四条求助,其实是四张市场名片。北美之外的世界不必一次学完,但每片大陆的脾气你要能在三句话里说清——**偏好、门槛、支付与物流**,这三句就是你决定要不要报价的全部依据。

**欧洲。**偏好上,欧洲客户要素、要简、要环保叙事:纯色或极小logo、有机棉(GOTS)与再生涤纶(GRS)证书越来越常被点名,beanie与渔夫帽份额比北美高,单量中等(500-3,000顶),对文件齐全度的要求远超对价格的要求。门槛是全世界最硬的一片:**REACH**(化学品法规,管偶氮染料、邻苯二甲酸盐、甲醛这些)、**GPSR**(通用产品安全条例,2024年底起全面执行,要求每件在欧盟销售的商品在欧盟境内有一个"责任人",名址要印在产品或包装上——没有欧盟主体的中国卖家必须花钱找授权代表)、还有各国的包装法(德国的包装注册、法国的Triman分类标)与EPR回收费。这条要说得很直白:**没有欧盟责任人,你连包装都过不了关。**支付与物流:T/T 30/70能谈,但德国、荷兰的老牌买家习惯性要net 30-60账期;海运到鹿特丹或汉堡约30-35天;报DDP时最大的陷阱是**VAT谁付、能不能递延**,这一项谈不清就别报DDP(条款逻辑见13.3.2)。一句判断:欧洲单的利润不比北美差,但合规是一次性的重资产投入,**等你有了第一个确定的欧洲客户再去补,别空转。**

**日本。**偏好:极致品质、小单(100-500顶)、翻单频繁、款式素净,对做工细节的挑剔到了线头、针距、缝份倒向的程度。门槛:几乎所有服饰进日本都要过**检针**——用金属探针机逐件扫描,出具**检针证明**;工厂那头还要有断针管理制度(断针要交旧领新并登记造册),你得先问清合作厂有没有检针机,没有就要外发。对色差和手感的容忍度是全球最低,还常要求你提供加工工程表。支付与物流:付款极守信用,T/T 30/70甚至到货后付都能接受;海运到大阪或东京只要7-10天,空运两天——**交期短意味着返工的空间也短**,出了问题没有海上那三十天给你缓冲。一句判断:日本客户是最好的老师、最难的考官,做成一个,你的品控体系被迫升一档;不适合当第一个市场,适合当第二年的练兵场。

**韩国。**偏好:比日本更小的单(50-300顶)、时尚周期更快、要求打样三五天出、款式跟着潮流走。门槛:砍价狠、改单频繁、儿童用品有KC认证。支付与物流:付款快、海运2-3天、空运隔日达。一句判断:这是拼速度不是拼价格的市场,你若有快反工厂资源(见第6章)可以试,没有就先放着。

**中东。**偏好:量大、款式简单(素色棒球帽加一个印刷或绣花logo)、政府与企业活动单多,节日、国庆、大型赛事是下单高峰,颜色偏白、黑、金。门槛:价格敏感度全球第一,他们会拿孟加拉、巴基斯坦的报价来压你(那边车工月薪只有一两千,见第6章);沙特有SASO/SABER符合性认证;文化禁忌要提前问清楚,图案上出个岔子整批作废;还有一条软门槛——口头承诺多于书面,你说的和他记的常常不是一回事。支付与物流:迪拜是转口枢纽,海运到杰贝阿里约18-22天;付款习惯是30%定金加见提单副本,但你必须防一手**"到港压价"**:货到了他说降10%否则不提,赌的就是你退运不起。规则写死:**定金比例咬死40%以上,合同里写明到港后不接受任何价格重议,宁可少接一单。**

**拉美。**偏好:巴西、墨西哥、智利、哥伦比亚是主要市场,款式跟美国潮流走但价格更敏感;墨西哥受近岸外包影响,B端订单这几年在涨。门槛:巴西的进口税费叠加起来能达到货值的60-100%(进口税、工业产品税、州流转税、社会贡献费层层叠加),所以客户对到岸成本极度敏感,**几乎必然会开口请你低报货值——这是红线,一律拒绝**(后果见18.5);清关慢,圣保罗港压两到六周是常态;沟通还要过西班牙语和葡萄牙语这一关。支付与物流:这是全球**收款风险最高的一片**,"你先发货,我清关后付款"是高频请求;规则只有一条:**100%预付或高比例定金,不接受D/A、O/A赊销(见14.2)**,除非你买了出口信用保险。智利和墨西哥相对规范,巴西和部分小国最需要警惕。

把五片地方排个序,给你一个新人的市场优先级:**北美第一、欧洲第二、日韩第三、中东与拉美机会主义接单。**理由不是哪里钱多,是三件事的乘积:**信息成本**(北美的客户画像你已经通过Mike摸熟了,别的地方要从零学)、**收款安全**(拉美与中东的风险溢价你现在赔不起)、**复购结构**(北美的小B和促销品体系天然复购,中东多是一锤子的大活动单)。等你的现金流厚到能扛一次赖账,再谈机会主义。

本节动作:做一张**新市场准入清单**,以后每碰一个新国家的客户,报价前必须答齐三问——①这个国家有没有强制文件或认证?谁出、多少钱、几天?②它的付款惯例是什么?我能不能守住我的定金线?③它的物流时效和我承诺的交期配不配?三问答不齐,先回一句"我需要两天确认清关要求再给你正式报价"。这句话不丢单,反而会让对方觉得你专业——**在国际贸易里,承认自己需要查证的人,比什么都敢答应的人可信得多。**

## 20.4 缝隙市场:小单快反定制为什么适合新人

晚上你在笔记本上画了一条坐标系:横轴是订单量,纵轴是每顶价格。然后往上标点。

第一个点标在左下角:1688上的现货帽,一顶¥8(算例口径见第6章),没有logo、没有定制、量多少都行。第二个点标在右侧:大厂的世界,起订量3,000-5,000顶起步,低于这个数你连报价都拿不到(见第6章)。第三个点标在左上角:北美本土促销品渠道,500顶级别的定制帽,落地 $9-12/顶(见5.5.2)。第四个点是你自己:R&B,500顶,9.9加元 ≈ $7.25。

四个点标完,你盯着图看了很久,因为你第一次看见了那块**没有人站的地方**。

这块空地由三面墙围出来。**墙一,大厂看不上。**机制在于大厂的成本结构靠开机率吃饭:换一个款要重新排产、开版、采购辅料,一条线换线一次至少占掉半天,而大厂一条线日产800-1,200顶(见第4章),半天就是**400-600顶的产值**——为一个500顶的订单付出500顶的产值代价,任何一个排产厂长都会摇头。这不是他傲慢,是算术。**墙二,本土渠道贵。**$9-12 这个数里,坯帽进口商、本地绣花厂、分销商三层加价各拿走一块(拆解见5.5.2),这个结构短期内不会变,因为每一层都在提供真实的服务。**墙三,快反厂做不了跨境交付。**国内有的是能接100-300顶、7-15天出货的快反厂,但他们只会做货,不会做翻译、整合、担责这三件事(见7.3.2),更不会替客户操心清关和标签合规。

三面墙围出来的这块空地,就是**缝隙市场**:**订单量在500-5,000顶之间、要真定制、时间给得起、客户在乎结果胜过在乎便宜三毛钱的那一类单。**

现在把这条缝的宽度量给你看,用R&B这单实测。上边界是本土渠道的下限 $9/顶,换算成加元约 **12.3加元**;下边界是你的完全到门成本 ¥23.9/顶(见7.3.2的分账),换算成加元约 **4.6加元**。**这条缝有 7.7 加元宽。**你在里面站在 9.9 的位置:往上让给客户 2.4 加元(比本土渠道便宜约19%,这是Mike选你的理由),往下留给自己 5.3 加元(这是你毛利54%的来源)。500顶算总账:Mike省下约1,200加元,你赚¥13,790——**双方都没有挤,因为这条缝足够宽。**

这条缝会不会被竞争填平?会变窄,但不会消失,因为它是**结构性的**,不是价格性的。你可以试着从两头挤它:一头,你把报价降到 4.9 加元贴着成本卖,省下的全给了客户,你白干一场,这条路走不通,因为没人愿意白干;另一头,本土渠道把价降到 $6,他们做不到,因为光是坯帽进口成本就 $3-8,再加绣花和人工,$6是亏本价。两头都挤不动,缝就一直在。**你要理解的是:你赚的不是差价,你赚的是"两种成本结构之间的距离"**——这个距离由太平洋、由中国的产业带、由北美的渠道分工共同撑着,不是哪个对手降价就能抹掉的。

有了这块地,下一步是给自己划**射程**——你能以正常毛利、正常风险、稳定交付的订单参数区间。四个参数,一个一个定,每个都有推导过程,不是拍脑袋:

**量:500-5,000顶。**下限来自固定成本摊销:制版加打样加寄样约¥1,200,摊到500顶是¥2.4/顶(可忽略),摊到200顶是¥6/顶(可接受但要收样品费),摊到100顶是¥12/顶(必须另收费),再低就不成立了。上限来自垫资:5,000顶货款约¥8万,按30/70的收付节奏,你的垫资峰值在两三万量级——这大约是一个新人账上能安心压住的极限。**交期:4-8周。**下限是硬约束:生产12-18天(见第4章)加空运5-7天加清关,最快也要4周出头,而且必须走空运并加价(空运约¥6.6/顶,见第17章)。舒适区是6-8周:生产完走海派28-32天(见17.4),不慌不忙。低于4周的单,不是难做,是**必然出事**——一次插单、一次色差返工就穿了,直接放掉。**定制深度:至少要定制装饰,最好要定制款型或面料。**这一条决定你的护城河:纯白帽无装饰的单,你和任何一家工厂没有区别,那是批发商的地盘;而当客户要指定潘通色、指定克重、指定绣花针法时,你在第1到第3章学的东西全部变成了别人替代不了的东西。**客户属性:决策链不超过2人、预算出自"营销"而不是"采购成本"、在乎故事。**最后半句最要紧——Mike买帽子的钱记在市场费用里,不是记在成本里,所以他关心的是"客人戴着它拍照好不好看",不是"每顶省了三毛钱"。

射程之内,全力以赴;**射程之外的单,必须放掉。**这句话说起来容易,做起来是新人最难的一课,因为放掉的时候你往往正饿着。给你五种最常见的射程外订单,每种配一句拒绝的说法——注意,好的拒绝不是关门,是埋种。

"100顶,下周活动要"——本土渠道的活,你抢不了。说:"这个量加这个时间在国内做不划算,我建议你找本地供应商;但如果明年提前两个月找我,同样的预算我能让你多做一倍的量。"**"10万顶,目标价$1.80"**——大厂加走量代工的活,你接了也只是过一手,毛利薄到经不起一次汇率波动,垫资却能压死你。说:"这个量级我给你推荐两家大厂直接对接,我不赚这个中间价;等你要做小批量特别款的时候再找我。"**"账期90天"**——阈值早就给过你了,无信用保险不接(见5.5.1)。**"能不能只做1顶"**——转现货贴牌方案或直接建议对方找本地定制平台,同时问那一句"你是给自己做还是给一个团队做"(见20.1.3)。**"带球队/名牌logo,没有授权"**——侵权红线,数量再小也拒(见5.4.3、25.4.1)。

再加一条纪律,它会在半年后给你惊喜:**每放掉一单,在客户表里记一行"为什么放"。**半年后回头看这份放单记录,你会发现某一类被拒的单在反复出现——比如"三次都是要100顶、两周内要"。反复出现的射程外需求不是噪音,是市场在告诉你下一步该往哪儿扩:如果一年里有二十个客户都要100顶两周内交,那你该做的不是继续拒绝,是去找一家国内快反厂做一条"小单快线"产品(打法见22.4.2)。**射程是画给现在的自己的,不是画给一辈子的。**

最后收束到根子上:为什么偏偏是这块缝隙适合新人?三条,每条你都已经验证过了。**第一,它要的是能力不是资本**——翻译、整合、担责(见7.3.2),这三样这本书正在一章一章塞进你口袋,而大厂那条路要的产能和批发那条路要的现金,你短期内变不出来。**第二,它的犯错成本低**——同样一次绣花色差,在500顶上是¥600加两天(事故一),放到15,000顶上就是一万八加半个月加一个客户;新人一定会犯错,你要选一个"犯得起错"的量级去练。**第三,它自带复利**——小B的故事会滚出下一个小B,分销商的信任会滚出下一批转单,而这两种滚动都不需要你花钱买流量。

也把天花板诚实地摆出来:这条路的收入公式是**客户数 × 单均毛利 × 复购次数**(见7.3.2),一个人一年跑二十来个Mike量级的客户,毛利二三十万,这就是勤奋的上限。想再往上,只有三条路:把获客做成系统(第21-23章),把流程做成产品让单均耗时下降(见22.4.2),或者从"接单"升级到"替客户做年度周边规划"(见第24章)。但这些都是明年的事。**今晚你只需要做一件事:把射程写下来。**

本节动作,一句话射程声明,现在就写,模板给你:"我做 **500-5,000顶**、**6-8周**交期、需要 **定制装饰以上**深度的 **终端小B与促销品分销商**;我不做 **一件起做**、**两周急单**、**90天账期**、**无授权IP**、**10,000顶以上纯白帽**。"写完贴在你报价单模板文件的第一行(设成灰色小字,只给你自己看)。**它的用处不是让你会挑单,是让你在最饿的那个月,还记得自己是谁。**

## 21.1 阿里国际站

### 21.1.1 成本账:年费、P4P与真实投产比

九月下旬的一个上午十点,阿里国际站的招商经理加了你的微信——你在1688上留过手机号,这号码在他们的系统里躺了半年。他约了下午视频,分享屏幕,PPT 第三页写着一行大字:"帽子类目询盘量同比增长 37%"。

你没接这个话,你问了一句:"开一年,总共要花多少钱?"

他说:"基础版年费两万九千八。"

你说好,我记一下。然后你打开一张空白 Excel,把接下来两个小时问出来的每一项都填进去。这张表就是本节的内容——**在你决定要不要付这笔钱之前,你必须先知道钱有几笔、每笔买的是什么。**

**第一笔,年费。**基础档常见口径 **¥29,800/年**,往上还有 **¥6-10 万**的高档位(更多曝光资源位、更多 RFQ 报价配额、更贴身的服务)。这笔钱买的是:一个店铺、发布产品的权限、基础的自然曝光、若干 RFQ 报价额度、一个客户经理,以及信保交易的通道(卖家不单独收费,成本就打包在这笔年费里,见14.4)。**年费不买流量。**这是第一个必须纠正的认知——很多人以为交了三万块就等于开了一家临街店铺,其实你开的是一家在无人区里的店铺,门口的路要另外买。

**第二笔,P4P。**全称 **Pay for Performance(按效果付费)**,行话叫"直通车":你为关键词出价,买家搜索时你的产品被排到前面,**买家点一次,你的账户扣一次钱——不管他有没有发询盘,不管他是不是同行来看价的**。帽子类目的常见点击单价 **¥1.5-5**;`baseball cap`、`custom hat` 这类大词在旺季能冲到 **¥8-15 一次点击**。更要命的是新店没有历史数据,系统给的质量分低,**同一个坑位你要比老店多出三到五成的价才抢得到**。

**第三笔,装修与人力。**旺铺装修模板 ¥2,000-5,000/年,找服务商做一套 ¥5,000-15,000;产品主图与场景图拍摄,一套 30 款 ¥3,000-8,000;运营——要么你自己每天投进去两小时,要么招一个人,**¥6,000-9,000/月,一年 ¥8-11 万**(薪资口径见8.2)。

现在把三笔钱拼起来,算你自己干、不雇人的首年总投入:

```
年费                    ¥29,800
P4P(月¥5,000×12)      ¥60,000
拍摄+装修               ¥8,000
询盘寄样(30次×¥250)   ¥7,500
────────────────────────────────
首年现金投入          ≈ ¥105,300
```

**约 ¥10.5 万。**这还没算你自己一年七百多小时的时间。

投入算完,该算产出了——而这一半,招商经理不会主动给你。**带你自己推一遍:**

- 前三个月自然曝光基本为零,询盘几乎全靠 P4P 买。
- 月投 ¥5,000、点击均价 ¥3 → 约 **1,670 次点击/月**。
- 帽子类目"点击→询盘"的转化率常见 **0.8-1.5%**,取 1% → **月约 17 条询盘**;加上自然流量和 RFQ,乐观算 **月 25-35 条**,**全年 300-400 条**。
- 用五特征评分卡筛一遍(见15.1.1),平台询盘里 ≥3 分的有效询盘占 **10-15%** → **全年 35-55 条有效**。
- 新店没有评价、没有认证、没有成交记录,有效询盘的成交率 **5-10%** → **全年 3-5 个客户成交首单**。
- 平台上来的单子比 Mike 大,常见 1,000-3,000 顶,货值 ¥3-8 万,你按 25-30% 毛利做 → **单客首年毛利 ¥1-2 万**。

**全年毛利 = 4 个 × ¥1.5 万 ≈ ¥6 万,对上 ¥10.5 万投入,首年净亏 ¥4.5 万左右。**

这不是唱衰,这是这条路的真实形状:**国际站是一笔两年期的投资。**第二年,店铺权重起来了、有了成交记录和买家评价、老客户开始复购(帽子这类目做得好的复购率能到 40-50%),同样的推广费能换回两三倍的询盘,那时候才谈得上赚钱。**你要判断的不是"第一年能不能回本"——第一年多半不能——而是"我能不能连续亏两年还活着"。**

两个可以随身带走的阈值:

**阈值一:单条有效询盘成本 = 推广费 ÷ 有效询盘数。**上面这本账里是 60,000 ÷ 45 ≈ **¥1,333/条**。行业里帽子类目做熟的店能压到 **¥300-800**。**连续三个月高于 ¥1,500 还降不下来,就停投**——问题在产品和关键词,不在预算,继续加钱只是加速失血。

**阈值二:单客获取成本(CAC,见7.2.3)= 105,300 ÷ 4 ≈ ¥2.6 万/客户。**判断规则:**CAC ≤ 单客首年毛利的 50%,这个渠道才健康。**上面这本账里 2.6 万 : 1.5 万,是 173%,不健康;如果你的产品能把单客首年毛利做到 ¥6 万(比如常年翻单的促销品分销商,见5.5.2),同样的 CAC 就变成了 43%,一下子就成立了。**所以国际站赚不赚钱,不取决于平台,取决于你接的是什么客户。**

再来拆招商经理那三句话——不是他撒谎,是每句真话里都埋着一个你要自己补的问句:

> "我们平台帽子类目去年成交增长 37%。"
> ——真的。但增长的是**类目大盘**,大盘增长和你的新店没有必然关系。大盘涨 37%,供应商数量可能涨了 50%。

> "现在开通送首年 P4P 代金券五千。"
> ——真的。但代金券通常要求**同比例配自有充值**才能用掉,五千代金券意味着你还得先掏五千。

> "隔壁做帽子的老板去年在平台上做了八百万。"
> ——可能也是真的。但那家店开了七年,五个运营,年推广费百万级,这个案例和你的关系,相当于一个刚学游泳的人和奥运会决赛的关系。

**你该反问的三句**(记下来,签任何按年付费的渠道之前都能用):
① "**我这个类目,新开店铺首年的中位数询盘量和成交客户数是多少?**"——注意问的是**中位数**,他一定会给你平均数,而平均数被头部几家拉得面目全非。
② "**帽子类目的关键词点击均价,能不能现在拉给我看?**"——能当场拉出来的是真数据,说"回头发你"的多半就不发了。
③ "**如果第一年做不出来,年费能不能按季付、能不能退?**"——答案通常是不能,但他会开始松口给资源包,他松口的那部分,就是他手里真实的弹药。

**什么人适合开?**四条全中才开:①**产品有差异化**——能做低起订量定制、有独特工艺、有自己的版房(见8.2);②**能承受 ¥10 万/年 × 两年**,且这笔钱全亏掉不影响你的生活;③**每天有两小时以上专门处理询盘**,且对北美时差有覆盖方案;④**背后有真实的工厂关系**——买家问"能不能五天出样"的时候你能给出真答案,而不是"我问一下"。

**什么人是去交学费?**五种:交了年费没预算投 P4P 的(等于开了店不进货);一个人又跟单又运营、询盘 48 小时才回的;卖的是通版白帽(见5.4.1)、只能拼价格的;把国际站当成"上架就有单"的自动售货机的;以及最贵的一种——**为了拿一个"平台认证供应商"的标签去开店,却从没算过这个标签值不值 ¥10 万**。

回到主线。你没有当场签。你跟招商经理说:给我两周。

这两周你用**免费账号**发了 20 个产品,收到 11 条询盘。你把评分卡拿出来一条条打分:**9 条是 0-1 分**(就是15.1.1里那种"Please send us your price list and catalog with best price"),**2 条 2 分**,**3 分以上:0 条**。这 11 条询盘值多少钱?零。但它们告诉你一件事:**在你什么权重都没有的时候,平台默认推给你的,是需求链条最底端的那一层——只比价的那一层。**

于是你做了决定:**国际站先不开,等有了三个自主开发的客户、账上能覆盖 12 个月推广费,再回来开。**

这个决定本身就是本节的动作,把它抄成规则:**任何按年付费的获客渠道,先用免费档或最低档跑满三个月,拿真实询盘算一遍单条有效询盘成本和 CAC,再决定要不要交年费。**销售的话术永远向前看,你的 Excel 只认已经发生的数。

### 21.1.2 运营逻辑:产品发布、关键词与询盘质量

决定不开是一回事,不懂怎么运营是另一回事——因为你早晚要开,而且这一套逻辑在所有电商平台上都通用(第22章的 Amazon、Etsy 会原样再用一遍)。

所以你让老纪(胶州那家厂的业务,见8.2.1)介绍了一个人:**老徐**,胶州本地一家贸易公司的老板,阿里国际站开到第六年,一年从平台上出七八百万的货。你请他吃了顿饭,把手机录音打开,问了两个半小时。这一节是那两个半小时的笔记。

**第一件事:产品发布,精品还是铺货。**

老徐第一句话就把这个问题定了性:"平台不怕你产品少,怕你糊弄它的搜索结果。"

他第一年的做法是错的:为了冲曝光发了 420 个产品,其中八成是同一款换个颜色、改个标题、换张图。三个月后平台判定重复铺货,店铺权重掉了两个月,自然流量归零;他删到 90 个,又过了三周才慢慢回来。

正确的逻辑是:**你发的不是产品,你发的是一张关键词地图。**一个产品对应一组长尾词,60-100 个产品把你能吃下的词铺满,就够了。判断标准很简单:**如果两个产品你自己都说不清它们分别是给谁搜的,那它们应该是一个产品。**

**标题公式**(这是你能拿走的最直接的东西):

```
核心词 + 材质/结构词 + 定制词 + 场景/客群词
```

举例:`Custom Embroidered 6 Panel Unstructured Dad Hat 100% Cotton Twill Baseball Cap for Brewery`

三个忌讳:同义词堆砌(平台识别得出来)、全大写、出现 `cheap`——**你在标题里写 cheap,来的就全是只认 cheap 的人**,而那批人是全平台最难成交、最爱压价、最容易索赔的一群。

**第二件事:关键词分三层,新店只打第三层。**

- **第一层大词**:`baseball cap`、`hat`。搜索量最大,首页被年费几十万、开了七八年的老店钉死,新店出十倍的价也只能买到第三页。
- **第二层属性词**:`unstructured dad hat`、`cotton twill cap`、`5 panel camp cap`。竞争中等,是你半年后的战场。
- **第三层需求词/长尾词**:`custom embroidery cap low moq`、`blank dad hat wholesale bulk`、`embroidered cap for brewery`。搜索量小,但**每一个搜这类词的人,都已经知道自己要什么了**——这类词的询盘质量高出一个数量级,而且新店买得起。

词从哪来?平台自带的数据工具能看**搜索指数和竞争度**,挑"搜索量中等、竞争度低"的;更笨也更准的办法是:**把你已经成交的那个客户当初是怎么描述需求的,原样写下来**——Mike 说的是"thick, gets better when worn in"(厚实、戴旧了好看),这就是一条真人会搜的词。

**第三件事:主图五张与详情页六要素。**

主图五张,顺序不能乱:①**白底主图**(平台硬性要求,方图 1000×1000 以上,无水印无拼接);②**佩戴场景图**(有人、有环境,买家要看它戴在头上什么样);③**绣花特写**——能看清针脚的那种,**这张最值钱**,它一秒钟证明你是懂工艺的人;④**结构与尺寸图**,把帽围、帽深、檐长标上去(见2.5);⑤**工厂/服务图**:12头绣花机开动的画面,图上直接压字写起订量和交期。有条件再加一段 **15-30 秒的车间视频**——停留时长是排序因子,而车间视频是全平台停留时长最高的素材。

详情页六要素:规格表(直接搬2.5的格式)、可定制项清单、起订量与数量阶梯价、打样流程与费用(见10.2)、交期(**必须带起算点**,见15.5.1)、包装与出运方式。原则是**把买家会问的问题提前答掉八成,故意留两成不答**——价格写成"from $X.XX,按数量与工艺核价",他要准确的数,就得发询盘。

**第四件事:RFQ——新店唯一能绕过排名的入口。**

**RFQ = Request for Quotation(采购需求/求购单)**:买家在平台上发布一条采购需求(我要什么、多少、什么时候要),平台按类目推送给供应商,供应商消耗"商机分"或报价额度去抢报,一条 RFQ 通常限 **10 个供应商**报价,先到先得。

**它的机制价值在于:RFQ 不看你的店铺权重。**一个开了七年的老店和你这个新店,在同一条 RFQ 面前是平等的——比的是谁先看到、谁报得认真。这是新店唯一一个不用花钱买流量就能直接站到买家面前的入口。

老徐的动作固定成两个时间点:**每天早上 8:30 和晚上 10:00 各扫一次 RFQ 池**(对应北美东西两岸的下班和上班)。筛选标准就是把五特征评分卡搬过来用(见15.1.1):买家信息完整、需求写得具体、有量有时间的才报。**每天只报 3-5 条,每条认真写 15 分钟**——附一张最对口的产品图、给一个区间价、外加三个反问。绝不群发。

他的数字:**月报 80-100 条 → 买家查看率 50-60% → 回复率 10-15% → 进入实质沟通 5-8 条 → 成交 1-2 单。**一年下来,RFQ 贡献了他店铺三成的新客户,而这部分**没花一分钱推广费**。

**第五件事:响应速度,它同时是服务分也是成交率。**

平台把**平均响应时间**和**24 小时回复率**计入服务评分,而服务评分反过来影响自然排名和 RFQ 配额——这是一个正反馈环:回得快 → 排名高 → 询盘多 → 更多机会回得快。行业里的及格线:**平均响应时间 <4 小时,24 小时回复率 >95%。**

难点是时差:北美买家上午十点发询盘,中国是凌晨一两点。做法三条:手机装卖家 App 开推送;睡前(正是北美上午)清一次;**首回不报价,只回三句**——确认收到 + 两个关键问题(数量、什么时候要) + 一个明确承诺("I'll send you a full quotation within 12 hours")。

为什么首回不报价?因为**他此刻正坐在电脑前,同一分钟给五家发了同样的信**。你的三句话不是为了成交,是为了**在他关掉电脑之前占住一个位置**。粗口径:**首回在 30 分钟内到达的询盘,买家继续对话的概率是 24 小时后回复的两三倍**——这个差距不是平台给的,是人性给的。

**最后一件事,也是最重要的:帽子类目的竞争现状,和你唯一的活路。**

打开帽子类目首页,清一色是 `$1.20-$2.50/piece, MOQ 50`,主图长得都像同一个人拍的。这是一个同质化到几乎没有信息量的类目。你如果也进去拼价格,账是这样的:白帽(见5.4.1)报 $1.35,你的成本 $1.30,**单顶毛利 $0.05 ≈ ¥0.36**;做 8,000 顶,毛利 ¥2,880,而你要垫十几万货款、担全部质量风险、还要伺候一个只认价格所以随时会跑的客户。

换一条路:**卖定制服务包**。低起订量(100 顶)、免费制版(digitizing,见3.1.6;制版费口径见3.1.5,你的成本一次 ¥200)、48 小时出绣花效果图、色卡与样帽寄送、可以一件代发。同一个客户下 1,000 顶,你报 $2.60、成本 $2.20,**单顶毛利 $0.40 ≈ ¥2.84,1,000 顶 = ¥2,840**。

**同样的钱,一个要做 8,000 顶,一个只做 1,000 顶——而后者占用的资金只有前者的八分之一,风险也只有八分之一。**这就是整本书从第7章开始反复讲的那件事:你卖的不是帽子,是翻译、整合和担责(见7.3.2)。在一个供应商比买家还多的平台上,**价格是唯一一个你永远打不赢的维度**,因为总有一个比你更不怕死、更算不清账的人。

本节动作,一张"每天 30 分钟"的清单,抄进手机备忘录:
① 8:30 扫 RFQ,认真报 3 条;
② 清昨夜的询盘,全部用三句式首回;
③ 更新 1 个产品的主图或详情页;
④ 记录 1 个新的长尾词进你的关键词表;
⑤ 每周五看一次数据:**曝光、点击、询盘**三个数,哪一环掉就修哪一环——**曝光低 = 关键词问题;点击低 = 主图和价格问题;询盘低 = 详情页问题。**这条三段诊断法在任何电商平台上都成立,第22章还会再用一次。

## 21.2 展会

### 21.2.1 广交会:摊位、证件与"扫楼"

九月的最后一周,你给老徐打了个电话问别的事,他顺口说:"我摊位号下来了,秋交会第三期。"

你愣了一下:"广交会我能去吗?"

他笑:"能去。但你得先搞清楚去干什么——你要是想去摆摊,今年别想了;你要是想去看,现在就该订酒店,再晚一周,琶洲十公里内三百块的房都没有了。"

**先把这个展会本身讲清楚。广交会**,全称中国进出口商品交易会(Canton Fair),1957 年办到今天,每年**春(4-5月)、秋(10-11月)两届**,广州琶洲展馆,是中国规模最大、历史最长的综合性出口展。它一届分**三期**,每期五天,中间隔三天换馆——**走错期等于白跑一趟**,所以这三个数字要背下来:

- **第一期**:电子家电、机械、五金工具、建材、车辆及配件
- **第二期**:日用消费品、礼品、家居装饰
- **第三期**:**纺织服装**、鞋、箱包、办公文具、医药保健、食品

**帽子在第三期的服装服饰区。**秋交会第三期通常在**十月底到十一月初**那五天(春交会在五一前后),记不住就记一句:**做帽子的,一年只有两个五天。**

**摊位怎么来?这是新人最容易误解的地方——钱不是主要门槛,配额才是。**

标准展位 9 ㎡(3×3),官方展位费 **¥2.4-3.5 万/期**(不同展区不同)。听起来不贵。但摊位是按"交易团"(各省市外经贸主管部门、商会)分配的,分配依据是企业的**出口实绩**(上一年度自营出口额)和信用记录。一个没有进出口权(见18.2.1)、去年出口额为零的新公司或个体户,**在这个排队体系里的位置是无穷远**。

于是市场上出现了转让摊位:一个第三期的标准展位,转让费炒到 **¥8-15 万**,位置好的更高。两个提醒:第一,**转让本身不合规**,组委会查到会取消展位并影响原企业的资质;第二,即便你接了,展位上挂的是别人的公司名和资质。

真自己有摊位,一届的总账是这样:

```
展位费(9㎡)              ¥30,000
展品运输 + 展台搭建        ¥15,000
差旅(3人×5天)           ¥25,000
  ├ 酒店:平时¥300的房 → 展会期间¥1,000-1,500
  └ 机票/高铁 + 餐饮
物料(画册/名片/样品/展架) ¥8,000
────────────────────────────────
一届总成本              ≈ ¥7-8 万
```

再加上你和团队整整一周不干别的,这就是"参加一届广交会"的真实价格。

**没有摊位怎么进去?**证件分三种:

① **境外采购商证**——免费,凭护照和商务签证登记,面向海外买家,你用不上;
② **境内专业观众/采购商证**——凭企业营业执照登记申请,这是你最正当的路,而且你确实是采购商:你要采购面辅料、包装、绣花设备、找加工厂;
③ **参展商证**——每个标准展位配 4 张工作证,只有参展企业能领。老徐给你留了一张。

**进去之后干三件事,按价值从高到低排:**

**第一件,看价格和新品。**用大半天走完第三期的帽子展区,把每一家的**主推款、报价口径、起订量、宣传的差异点**记进一张表。这是你一年一次能拿到的最完整的竞品情报,线上永远拿不到——因为**线上没有人会把真实的报价口径写在页面上**。开口话术很简单:"我是国内做帽子外贸的,想请教一下你们主打哪个市场?"同行不会给你真价,但会给你方向:他说"我们主要走欧洲超市单",你就知道了他的量级、他的价格带、他不碰的那块市场在哪。

**第二件,收同行和供应商的名片。**这是你能带回去的最实在的东西:备份工厂(见12.5的 8:2 分单)、辅料商、有产能没销路的小厂。一个下午收三十张这样的名片,值回你的差旅。

**第三件,捡外商。**第三期展馆里有大量境外采购商在走,但他们的目标是摊位,不是你。没有摊位的人只有一个战场:**摊位之外的所有地方**——过道的空档、餐厅、摆渡车、酒店大堂。这就是行话里的"**扫楼**":原意是业务员在写字楼里一层层敲门找客户,搬到展会上,指的是在展馆里挨个摊位、挨个人地扫过去。

扫楼两条规矩,破一条你就出局:
- **绝不在别人的摊位前面抢客户**——这是展会最大的忌讳,被投诉可以清退,而且这行圈子小,你被记住的方式会决定你后面五年过得顺不顺。
- **别递名片,递帽子。**你包里带三顶样品(一顶 R&B 主款、一顶速干款、一顶提花 beanie),遇到外商先把帽子递过去让他摸。他摸两秒还给你的那一刻,名片才出手。**名片会被丢进一堆里,帽子的手感不会。**

**接下来是本节最值钱的一段:黄金 48 小时。**

老徐第一届参展,五天收了 **180 张名片**。回去以后订单一堆,他**两周后**才开始发跟进邮件,180 封发出去,**回了 7 封,成交 0**。

第二届他改了做法:每天晚上回酒店,当天的名片当天录进表格——公司、人名、聊了什么、他要什么、他摸了哪顶帽子;**第二天早上八点发出去**。五天发了 160 封,展会还没结束就有 **23 个人回了信**,其中 4 个后来下了单。

**同样的名片,同样的话术,差别只在时间。**

机制在这儿:一个外商在广交会五天里会收 **50-200 份**资料、见几十家供应商,回到酒店当晚,他的记忆就开始糊——**他记得的不是你的公司名,是"那个给我摸厚帽子的人"**,而这个记忆的半衰期以小时计。超过一周,你在他的名片盒里和其他一百九十九张纸没有区别。粗口径:**48 小时内跟进,回复率 20-30%;一周后跟进,跌到 5% 以下。**

跟进邮件三行,结构固定:
① **提醒他你是谁——必须写一个只有你们两个人知道的细节。**"你摸了那顶藏青色磨毛的 dad hat,说手感比隔壁厚。"这一句比任何公司介绍都管用。
② **回答他现场问了、你当时没答上的那个问题。**所以现场一定要**故意留一个**"我回去查准确数字给你"的问题——这就是你第二天发信最自然的理由,你不是在推销,你是在履约。
③ **一个具体的下一步**:寄样,或者一份带他名字的报价单(见15.2)。

**算一遍参展的 ROI**(按自有摊位):¥8 万成本 → 180 张名片 → 20 个有实质意向 → 3 个成交首单 → 单客首年毛利 ¥1.5 万 = **¥4.5 万**。**首届必亏。**摊平要靠第二年的复购和第三届的老客回访——展会这个渠道的本质是**复利型**的:同一批买家每年在同一个地方出现,你第三年站在那儿的时候,过来打招呼的人就不是陌生人了。

**判断阈值**:**年出口额低于 ¥300 万、或者没有稳定产能的人,不要自己租摊位。**先以观众身份去逛两届,把展区结构、买家构成、价格带摸熟,顺便攒下一批工厂和辅料商名单;等到你有稳定的老客户需要"每年见一面"的时候,再考虑那 ¥8 万。

本节动作,也是主线的下一步:你订了十月底去广州的高铁票,在笔记本上写下这一趟的目标——**不摆摊;收 30 张同行与辅料商名片;见 5 个境外采购商;带 3 顶样品;每天晚上把当天名片录完再睡。**目标写得越具体,你在展馆里就越不会变成一个乱走的人。

### 21.2.2 海外展与逛展策略:不摆摊也能收名片

挂电话之前,老徐说了一句话,你后来想了三天:

"你要真想找 Mike 那样的客户,广交会不一定对。他那种人,一辈子不会来中国。"

这句话把一个问题摆到了你面前:**Mike 那样的人,如果不认识你,他会去哪儿买帽子?**答案在5.5.2里已经写过——他会打给本地的促销品经销商。而那些经销商,每年一月都会在同一个地方集体出现。

**北美的两个展**(ASI、PPAI 的定义与体系见5.5.2):

- **PPAI Expo**:每年**一月**在拉斯维加斯,促销品行业最大的年度展,数千家 supplier 参展、上万名 distributor 来采购。
- **ASI Show**:一年多站巡回(常见 Orlando 一月、Chicago 七月等),单站规模小一些,但节奏密、行业属性更纯。

**欧洲方向**:**PSI Show**(一月,德国杜塞尔多夫,欧洲促销品第一展);服装配饰方向另有 **Première Vision**(巴黎,面辅料,二月和九月)、**MAGIC**(拉斯维加斯,服装配饰批发大展,二月和八月)。

选展的原则一句话就够:**去买家在的展,不去同行在的展。**广交会上八成是中国供应商,买家是稀缺资源;PPAI Expo 上八成是采购方,你是稀缺资源——**同样是一个展馆,你站的位置完全不同。**

**但这里有个门槛必须先讲清楚,不然读者会买了机票被拦在门口。**

ASI 和 PPAI 的展是**行业内展**:参展方是 supplier(供应商),入场观众是 distributor(分销商),终端企业客户不来。注册入场时要证明你是行业从业者——公司名、业务类型、网站、名片,有的还要求会员资格。而对"supplier 身份的观众",这类展会通常是有限制甚至明文禁止的:场刊上常常印着一句 `Suppliers may not walk the floor to solicit`(供应商不得在展场兜售)。想以正式身份进入,常见做法是**申请行业协会会员**(PPAI 会员年费量级 **$500-1,000**),或者干脆以参展商身份进去。

**所以海外展的正确姿势,不是在场内扫楼,是把展会当成"人都在这里"的那几天,把生意谈在场外。**这一条如果没听懂,后面那 ¥4 万就是白花的。

**不摆摊的五步打法:**

**第一步,提前三到四周拿展商名录。**所有正规展会官网都有 exhibitor list 和 floor plan,能导出来。按类目筛出做服饰、做帽子、做多品类的 supplier 和 distributor,通常几百到上千家。**这份名录本身就值那张机票**——即使你今年不去,它也是一份现成的、精准到人的开发名单(下一节讲怎么用)。

**第二步,发约见邮件——注意,这不是开发信,是约时间。**

> "我 1 月 13-16 号在拉斯维加斯参加 PPAI。能不能约 15 分钟喝杯咖啡?我带了几顶样品给你摸一摸,不推销。"

约见邮件的回复率显著高于冷开发信,常见 **15-25%**(冷开发信首封只有 1-3%,见21.3.2),原因有三个:它有**明确的时间边界**(15 分钟)、**明确的时间窗口**(过了这四天就没了)、**极低的心理成本**(喝杯咖啡而已)。人对"你什么时候有空"的抵抗力,远低于对"我们公司专业生产"的抵抗力。

**第三步,带样品箱。**20-30 顶不同工艺的样品:不同面料、不同装饰工艺、不同扣具,每顶挂一张小卡,写清工艺和量级价。报关走样品口径(标 `SAMPLE OF NO COMMERCIAL VALUE`,见15.3),数量别超、别带整箱同款——**同款超过十几顶,海关就有理由按货物处理。**

**第四步,把主场设在场外。**展馆周边的酒店大堂、行业晚宴、after-party、展会官方的 networking session——这些地方没有"不许兜售"的规矩,人也是放松的。一个在展位上守了十小时的采购,晚上在酒吧里跟你聊二十分钟,信息密度是白天的五倍。

**第五步,当晚跟进。**21.2.1的黄金 48 小时法则在这里同样成立,而且更狠——**你在国外,时间成本是每天 ¥8,000,不能等回国再发信。**

**一次的成本账**(单人,以一月拉斯维加斯为例):

```
往返机票                    ¥6,000-9,000
住宿($200-350/晚 × 6晚)   ≈ ¥10,000
签证 + 保险                 ¥1,500
展会门票/会员($300-800)    ¥2,000-5,700
样品与托运                  ¥3,000
当地交通餐饮                ¥4,000
────────────────────────────────────
一次合计                  ≈ ¥3.5-5 万(取中 ¥4 万)
```

**对比国内自租一个摊位的 ¥7-8 万,这一趟便宜一半,而且你见到的是渠道端的真买家,不是路过的观众。**这是本节最反直觉、也最有用的一个结论:**对新人来说,飞出去逛展,比在国内摆摊便宜,也更有效。**

**ROI 怎么判断:**一趟行程,提前约见 + 现场碰见,能有效对话 **25-40 人**(每天 8-10 个,这是体力上限);现场拿到明确报价机会 **8-12 个**;**成交 2-3 个促销品分销商**。一个中型分销商一年在帽子上的采购量常见 **3,000-8,000 顶**,你按单顶毛利 ¥3 算(它的终端价 $9-12 的结构见5.5.2),**单客年毛利 ¥0.9-2.4 万**;三个客户 = **¥3-7 万**。

**第一年基本打平,第二年起是净赚**——而且这类客户复购极稳(见5.5.2),第二年你不用再飞,他自己会来邮件。

**什么时候才该买这张机票?三个条件全中,缺一条都先别飞:**
① **手上至少有一个能讲的成功案例**——照片、数字、客户愿意被提及。你现在有了:R&B 那十四张照片、500 顶、9.9 加元到门、吧台卖 30 加元。
② **产能能接 3,000 顶级别的单**,交期兜得住。你要是只能做 500 顶,谈成了也交不出货,比谈不成更糟。
③ **这 ¥4 万亏光了不影响你活到明年。**

**一个反例,记住它省你四万块。**有人满怀信心飞过去,四天时间在展馆里挨个摊位递名片,第二天就被两个展商投诉,第三天被工作人员礼貌地请出场;回国后总结:"美国展没用,老外不理人。"

真正的原因不是老外不理人,是他**把国内扫楼的动作原封不动搬进了一个明令禁止兜售的场子**。同样的 ¥4 万,同样的四天,换成"提前约二十个人喝咖啡",结果是另一个世界。**渠道没有好坏,只有你用的动作对不对得上它的规矩。**

本节动作,你在笔记本上写下一行,后面画了个方框:

> **明年 1 月,PPAI Expo,拉斯维加斯。**
> 解锁条件:到 12 月 31 日,自主开发客户 ≥ 3 个,账上留出 ¥5 万。

**这是你给自己设的门票。**渠道要按顺序解锁——先把不花钱的走满,才有资格花钱;先证明自己能从零谈成一个陌生客户,再去一个所有人都是陌生人的地方。所以下一节开始,是那条不花钱的路。

## 21.3 开发信

### 21.3.1 名单来源:Google语法与海关数据

九月最后一个周六,早上八点半。你给自己定了一个当天中午之前必须完成的任务:

**做出一份 100 家加拿大西海岸精酿啤酒厂的名单。**

为什么是精酿啤酒厂?因为你已经有一个了。你手里有一个成功案例、一套跑通了的产品(dad hat + 平绣 + 轻酵素洗)、一沓活动现场的照片、一个能讲的故事,以及一个愿意被提及的客户。**找下一个客户最省力的方向,永远是"和上一个客户长得一模一样的人"**——同样的行业、同样的规模、同样的用途、同样的死线结构。你要找的不是"任何需要帽子的人",是**下一个 Mike**。

**先给你七个 Google 语法,这是本节的工具箱:**

| 语法 | 作用 | 帽子行业用法 |
|---|---|---|
| `"关键词"` | 精确匹配整个短语 | `"craft brewery"` |
| `site:` | 限定域名或后缀 | `site:.ca` 只看加拿大 |
| `intitle:` | 网页标题里含这个词 | `intitle:brewery` |
| `inurl:` | 网址里含这个词 | `inurl:merch`、`inurl:shop` |
| `OR` + `( )` | 或、分组 | `("Vancouver" OR "Victoria")` |
| `-` | 排除 | `-jobs -indeed -reddit` |
| `filetype:` | 限定文件类型 | `filetype:pdf "member directory"` |

**五条可以直接抄进搜索框的实战搜索式:**

```
① site:.ca "craft brewery" ("British Columbia" OR "Vancouver Island") -jobs -indeed
   → 铺底名单,一次能刷出几十上百家

② site:.ca brewery inurl:merch ("hat" OR "cap" OR "beanie")
   → 已经在卖帽子的 —— 需求已验证,最高优先级

③ site:.ca brewery ("anniversary" OR "10th year" OR "festival") 2026
   → 今年有周年或节庆的 —— 有硬死线,就是 Mike 那种结构

④ filetype:pdf "craft brewers" "British Columbia" (directory OR members)
   → 行业协会的会员名录,一份 PDF 顶你搜半天

⑤ "craft brewery" "Vancouver" ("contact us" OR "marketing manager")
   → 直奔联系人页
```

**注意第②和第③条的价值,它们和前面几条不是一个量级。**第①条给你的是"存在的酒厂",第②条给你的是"**已经掏钱做过帽子的酒厂**"——他不需要被说服"要不要做周边",他只需要判断"要不要换个供应商";第③条给你的是"**今年有人在他公司内部被这件事追着的酒厂**"(五特征里的"有时间点",见15.1.1)。**同样发一百封信,名单排序不同,回复率能差三倍。**

**三个比搜索引擎更快的入口:**

**① 行业协会的会员名录。**几乎每个细分行业、每个地区都有协会,会员名录常常是一个网页或一份 PDF,几百家,带官网链接、城市、规模。这是名单的金矿——**因为它是被别人整理好的、且持续更新的结构化数据**。

**② Google Maps。**搜 `brewery near Vancouver`,地图列表给你电话、官网、营业时间、评分,还有一样搜索引擎给不了的东西:**照片**。翻店内照片,看吧台后面挂没挂周边、看店员穿戴什么——**这是需求的实物证据,比任何数据库都硬。**

**③ 行业社区和评分站。**Untappd、BeerAdvocate 这类按地区列出的商户名单,顺带还能看出哪家人气高、哪家在扩张。

**换个行业,这套动作原样照抄:**

- **健身房**:`site:.ca inurl:crossfit "Toronto"`,再加上 CrossFit 官网的 affiliate map——全球每一家加盟 box 都在上面,带官网和邮箱;这类店铺天然要做会员周边,而且一年做两三次。
- **球队**:本地青少年冰球、棒球、足球联盟的官网 → teams 页 → 每支队伍一个 manager 邮箱。**一个联盟 = 几十支队伍 = 几十个决策人**,而且他们每年赛季前必须订队服和帽子,死线是开赛日,雷打不动。
- **通用形式,记住这一句就够了**:**找"有组织、有归属感、有年度活动、人数 50-500"的群体名录。**符合这四条的群体,买帽子不是消费,是身份表达(见5.1.2),他们不会为了省两块钱去比十家价。

**现在讲海关数据——这个词在外贸圈被吹得很神,你要知道它到底能干什么、不能干什么。**

**海关数据**,指各国海关的进出口报关记录/提单数据(货描、数量、重量、发货人、收货人、日期),由商业数据公司整理成可检索的数据库对外出售(海外如 ImportGenius、Panjiva,国内也有一批服务商),**年费量级 ¥5,000-3 万**。

**两种正经用法:**
① **反查买家**:用 HS 编码 6505(帽子的税号,见18.1.1)加目的国,拉出过去 12 个月从中国进口帽子的收货人名单,看他的**进口频次、每次的量、现在的供应商是谁**。这是唯一一个**在你联系他之前就能知道"他真买、买多少、多久买一次"的工具**——五特征里的"有具体数量",在这里可以被数据直接验证。
② **查竞争对手**:输入某家工厂的名字,看它给谁供货、量多大。你想知道老纪厂里的美单从哪来,这里能看出个大概。

**五条局限,不知道这五条,这笔年费就是白交:**
① **只有海运提单数据。**空运、快递、专线(见17.4)统统不进这个库——而中小订单大量走空运和专线,**你的很多潜在客户根本不在里面。**
② **走 DDP/双清专线的货,提单上的收货人常常是货代或清关行**(见13.3.2、17.4),真买家看不见。你自己给 Mike 发的那五箱货,在任何海关数据库里都查不到"Ridge & Barrel"。
③ **加拿大的海关数据不公开。**美国、印度等国有公开数据,加拿大没有——**你想用它找下一个 Mike?查不到。**这一条直接决定了它在本节的定位。
④ **数据滞后 1-3 个月。**
⑤ 最要命的一条:**你能看见的这些买家,几百上千个中国供应商也看得见。**同一份名单,同一批邮箱,已经被群发轰炸过几十轮——你发过去的信,落在一个早已建好过滤规则的收件箱里。

**所以海关数据的正确定位是:验证工具和画像工具,不是名单来源。**当你已经通过别的路子找到一个买家、想判断他值不值得投入时,去查一下他的进口记录;而不是打开数据库导出五千个收货人然后开始群发。

**找到公司了,怎么找到人?**四步:官网的 contact / about / team 页 → LinkedIn(见21.4)→ 邮箱格式推断(`first@`、`first.last@`、`f.last@`,**同一家公司的邮箱格式是统一的,找到一个就能推出其余**)→ 用邮箱验证工具批量验真。

**验真这一步不能省。退信率必须压到 5% 以下**;一旦超过 10%,邮件服务商会把你的发信域名判定为垃圾源,**你后面所有的信——包括发给老客户的报价单——都会进垃圾箱**(这条的完整后果在21.3.2)。

经验值:一份 100 家的名单,能拿到**直达决策人**邮箱的约 **30-40%**,`info@`/`hello@` 这类公共邮箱约 **40%**,剩下 20-30% 只有网页表单。**表单不要放弃**——小公司的网页表单往往直接转发到老板的手机上,打开率反而比邮件高。

**名单表七列,最后一列是全表最贵的一列:**

| 公司名 | 官网 | 城市 | 已卖帽子? | 今年有活动? | 联系人/职位/邮箱 | **个性化钩子** |
|---|---|---|---|---|---|---|
| Fernwood Brewing | … | Victoria | N | 十周年(明年3月) | Marketing Lead / … | merch页只有T恤和杯子,评论区有人问"什么时候出帽子" |

**这张表有一条禁入规则,来自20.1.2:从促销品分销商嘴里听来的终端客户名字,永远不进这张表。**你可以自己搜出全世界的酒厂,但不能碰任何一个由分销商交到你手上的名字——那不是名单,那是别人的命根子。

**没有第七列,下一节的开发信写不出来。**一个具体到只可能属于他的细节——他网站上的一句话、一条评论、一张照片、一个日期——这是你唯一能证明"我不是群发"的东西。

**算一遍这个上午的账:**你从八点半干到十二点半,**4 小时**,产出 **87 家**(目标 100,达成 87%),其中"已卖帽子"标 Y 的 **31 家**,今年有周年或节庆的 **12 家**,拿到具名邮箱的 **34 家**。成本:四小时,加一杯咖啡。

对比市面上卖名单的:¥2,000 买 5,000 条"精准外贸客户数据",退信率 30% 起,里面一半是被发烂的公共邮箱,而且——**它没有第七列。**

**自己搜的名单慢,但每一条都带着钩子;买来的名单快,但每一条都是一个陌生人对陌生人的骚扰。**这就是全部区别。

最后一件事,这个上午最好的收获:你在第②条搜索式里翻到一家维多利亚的酒厂,merch 页上在卖 T 恤和玻璃杯,**没有帽子**;往下拉到 Instagram 的嵌入区,有条评论:

> "when are you making hats? 🧢"(你们什么时候出帽子?)

你把这条评论截了图,存进名单表的第七列。三天后,它成了你发给这家酒厂那封信的第一句话。

**记住本节最后这一句:名单不是名字的集合,是证据的集合。**

### 21.3.2 写法模板与反垃圾邮件合规

名单在手,周一晚上,你打开新邮件,光标在空白正文里闪。

第一封你写了四十分钟,写成了一份公司介绍:"我们是中国专业的帽子制造商,拥有十年生产经验,通过 BSCI 认证,产品远销欧美三十多个国家……"

你自己从头读了一遍,然后全选删掉。**因为如果这封信落到你的收件箱里,你不会回。**

**先把这封信的性质定义清楚。冷启动开发信(cold email)**:向一个没有任何前置关系、从未主动询价的潜在客户发出的第一封商业邮件。它和询盘回复(见15.1)是两种完全不同的东西——**询盘回复里,对方已经举了手,你只要答得比别人好;开发信里,对方没举手,你得先证明你凭什么打扰他。**

这个差别决定了全部写法:**开发信的第一段不是介绍你,是证明你看过他。**

**先说主题行,它决定一半的成败。**三条规则:**≤50 个字符**(手机上只显示前 35-40 个);**不出现价格、free、best price、全大写**(这些是垃圾邮件过滤器的特征词);**出现他的名字或他的事**。

```
✗ Cap Manufacturer from China – Best Price!!    (垃圾特征全中)
✗ Cooperation Proposal                           (等于没写)
✗ Introduction of Our Company                    (没人关心)

✓ Hats for Fernwood's 10th anniversary?
✓ Saw the "when are you making hats?" comment
✓ Question about your merch caps
```

口径:带对方公司名或具体细节的主题行,B2B 冷邮件打开率常见 **30-45%**;通用模板主题行 **10-15%**。**同一封信,主题行换一下,打开的人差三倍。**

**正文三段式,全信 150 词以内,一屏读完:**

**第一段,凭什么是你——一个只可能属于他的细节。**

> "上周你们发了 Hazy IPA 的新罐。你们 merch 页上有毛线帽和 T 恤,但没有棒球帽——底下还有人在评论区问什么时候出。"

这一句话干了两件事:证明你花了三分钟看他(而不是三秒群发),以及**替他把问题说出来了**——他自己可能都没注意到那条评论。

**第二段,我能给你什么——不是介绍公司,是给一个同类案例。**

> "今年我给温哥华的一家精酿厂做过 500 顶绣 logo 的 dad hat,厚棉磨毛,送到他们门口 9.9 加元一顶,他们在吧台卖 30。"

三个数字:500、9.9、30。**全部是真的,而且全部是他能立刻换算成自己账本的数。**再配两三张照片:活动现场戴着帽子的人、绣花特写、吧台上挂着的那一排。

**照片放正文里 1-2 张,或者给一个链接页,不要发附件。**原因两条:附件明显拉低送达率(带附件的陌生邮件是过滤器重点关照对象);以及**没有人会点开陌生人的附件**。那份一页纸的能力单(capabilities sheet,见20.1.2)就挂在这个链接后面——**正文只写三句话,想看细节的人自己会点进去,而点进去的那个人,就是你要的那个人。**

**第三段,一个低门槛的下一步。**门槛的高低直接决定回复率——最低的门槛是"回一个字",最高的是"开个视频会"。

> "要不要我寄一顶那款帽子给你摸摸?告诉我地址就行,不收钱,也不用还。"(样品政策见15.3)

签名:**真名 + 手机号 + 网站或作品集链接 + 实体地址**。最后一项是合规要求,下面就讲。

---

**现在是本节最值钱的一段:三部法律。做错了不是没生意,是罚款和封域名。**

**CAN-SPAM(美国,2003年)**——"先发后退"原则,**不要求事先同意**,但每一封商业邮件必须满足四条:①发件人信息和主题行真实、不误导;②包含**有效的实体邮寄地址**;③提供**清晰可用的退订方式**;④退订请求必须在 **10 个工作日**内处理完毕。罚则**按封计算**,单封最高可达数万美元——群发一万封违规邮件是什么概念,自己乘。

**GDPR(欧盟,2018年)**——管的是个人数据。给公司通用邮箱(`info@`)发 B2B 邮件,通常可以依据"**正当利益(legitimate interest)**"这一法律基础;但发给具名个人邮箱时,你必须能说明业务相关性、在信里告知**数据从哪来的、怎么删除**,并保留处理记录。德国等成员国另有更严的本国规则,实务上对未经同意的 B2B 冷邮件容忍度很低。

**CASL(加拿大反垃圾邮件法,2014年生效)**——**全世界最严的一部**,而你的目标客户恰好全在加拿大,所以逐条记牢:

- ① **原则上要求事先同意**,分**明示同意(express consent)**和**默示同意(implied consent)**两种。
- ② **默示同意里有一条是 B2B 开发信唯一的合法通道**:对方**在网站上公开发布了这个邮箱**、**没有声明拒收商业邮件**、且你发的内容**与其业务或职务相关**。——请回头看21.3.1那一句"从官网公开页面采集,不要买名单":**那不是效率建议,那是法律条件。**
- ③ 每封必须写明**发件人身份、实体地址、有效的联系方式**。
- ④ 必须提供**退订机制**,并在 **10 个工作日**内生效。
- ⑤ 罚则:**企业单次违规最高 1,000 万加元,个人最高 100 万加元。**

**落成动作,你的每封开发信底部固定三行,不到 30 个词:**

```
You're receiving this because your email is publicly listed on [他的官网地址].
[你的真实公司/个人名 + 完整实体地址]
Reply "unsubscribe" and I'll remove you immediately.
```

这三行同时满足 CAN-SPAM 和 CASL 的形式要求,**而且它还有一个意外的好处:它明显提升可信度。**真正的骗子不写这个,写这个的人看起来像个有地址、能被找到、准备长期做生意的人。

**外加三条法律没写但保命的自律:**
- **同一家公司只发一个人。**同时发给老板和市场经理,他们一对照,你就成了群发。
- **同一个人一个季度不超过一轮**(一轮 = 下面讲的 4 封)。
- **对方说"不需要",立刻从名单删掉并记录下来**,一年后也不要再发。

---

**技术侧三件事,不做的话信写得再好也进垃圾箱:**

① **用独立的发信域名。**主域名是 `xxcaps.com`,开发信用 `xxcaps.co` 或 `getxxcaps.com` 之类。**你主域名的信誉不能拿来赌**——那是你给老客户发报价单和 PI 的通道。
② **配好 SPF / DKIM / DMARC 三条 DNS 记录。**这是邮件服务商用来验证"这封信真是这个域名发的"的三把锁,不配的信,送达率直接腰斩。找域名商的技术支持,半小时的事。
③ **养号。**新域名前两周每天 ≤20 封,第三四周升到 30-40 封,稳定后**每个账号每天不超过 50 封**。新域名第一天就发三百封,当天就废。

**发信节奏:一个人总共 4 封,发完就停。**

```
D0    首封    三段式,150词以内
D+4   跟进1   两句话。"上封信可能被埋了。样帽还要不要?我这周寄。"
D+11  跟进2   换角度,不提自己,只给对他有用的信息:
              "顺便提一句:秋天做活动帽的客户一般七月就下单了,
               生产加海运要两个月。你们明年三月的周年,
               年底前定下来时间最舒服。"
D+21  结尾信  "我就不再打扰了。以后有需要,这封信在这儿。"
```

**数据口径:首封回复率 1-3%(写得够个性化的能到 5%);加上三封跟进,总回复率 5-10%。**注意中间那句最重要的话:**其中大约一半的回复来自跟进信,不是首封。**这正是九成新人放弃的地方——发一轮没人理,就断定"开发信没用",然后转头去交国际站的年费。

**现在带你把章首那笔账算完。**目标:一年十个客户。开发信这条路的漏斗是:

```
100 封  →  5-10 个回复  →  2-3 个进入实质对话  →  0.5-1 个成交首单
```

要靠开发信拿到 **5 个客户**,你需要发 **500-1,000 封首封信**。按每天 30 封新信、每周 5 天算,是**四到七周的纯发信量**;再加上每封要写一句个性化钩子(平均 3 分钟)、加上跟进信,现实的节奏是:**每周 100 封新信 + 300 封跟进,一年做到 2,000-3,000 封触达。**

**这就是"一年十个客户"这句话的真实工作量。它不靠灵感,靠一个算得出来的重复。**你现在知道为什么老徐宁可交十万块年费了——他是在用钱买这个重复。而你现在没有十万块,所以你用时间买。

**一个翻车案例,记住它省你三周。**有人图快,花 ¥2,000 买了一份 5,000 条的"北美服装采购商"名单,用群发工具一晚上全发出去。第二天:**退信率 41%**,发信域名被列入黑名单;**连带主域名的所有邮件——包括发给老客户的报价单——全部进垃圾箱**,花了三周、两千多块找服务商申诉才恢复。更糟的是名单里有几家加拿大企业投诉,他收到了监管机构的问询函。

**开发信这件事,慢就是快。**一晚上五千封的结果,是零个客户加一个废掉的域名;一天三十封写了三个月的结果,是三五个真正的客户加一个干净的域名。

本节动作,今晚只做一件事:从那 87 家名单里挑出 **10 家**标了"已卖帽子"或"今年有活动"的,**给每一家写一句个性化的第一句话**——不写全信,只写第一句。

十句写完你会发现:**其中有三四家,你根本写不出第一句。**那说明你对它一无所知,它不该在名单里——划掉。

**这才是开发信真正的筛选动作:能不能写出第一句,就是这个客户值不值得你花二十分钟的唯一标准。**

## 21.4 LinkedIn开发

第一批十封信发出去的第三天,你收到两封回信。

第一封是 `please remove me`(请把我删掉)。你照做了,在名单表上那一行标了红,注了日期——**这一封信不算失败,它是你合规记录的一部分**(见21.3.2)。

第二封来自维多利亚那家酒厂,就是评论区有人问"什么时候出帽子"的那家。整封信只有四个词:

> **"Interesting. Who are you?"**(有意思。你是谁?)

你盯着这四个词看了很久,然后意识到一件事:**在他眼里,你是一个没有脸的邮件地址。**他不是在问你的公司名——公司名你签名里写了;他是在问**你这个人存不存在**。他要在花二十分钟跟你聊之前,先花两分钟确认你不是一个骗子。

于是你做了一件从没做过的事:你 Google 了一下自己的英文名和公司名。

结果:什么都没有。你打开 LinkedIn,发现自己三年前注册的账号还在——**头像是默认的灰色人形,履历一片空白,好友 11 个,全是国内的老同学。**

**这就是 LinkedIn 在 B2B 开发里的真实位置:它不是一个发消息的地方,是一个"让对方可以核实你"的地方。**领英是全球最大的职业社交网络,但对你来说,它的第一功能不是社交,是**存在证明**。冷邮件的转化率里有很大一块,取决于对方在动手回复之前搜了你的名字,然后看见了什么。

**所以第一步不是加人,是修自己的档案。五件事,一个晚上做完:**

① **头像用真人正脸**——不是 logo,不是风景照,不是戴墨镜的侧影。北美的商业社交里,不露脸约等于不存在。
② **Headline 不写"Sales Manager"**,写你能给谁解决什么问题:
```
Custom caps for breweries, gyms & teams | low MOQ, factory-direct from China
```
③ **About 写三段**:我做什么、我给谁做过(R&B 案例 + 那三个数字)、怎么找我。
④ **Featured 区挂三张图**:绣花特写、活动现场、一页规格表截图(见2.5)。**规格表那张最反常识,但它最有说服力**——它证明你不是个中间人,你懂这个东西是怎么被造出来的。
⑤ **把公司页建起来**,哪怕只有一页、只有五个关注者。它的作用是让你的个人档案上那个公司名**可以被点开**。

**这五件事做完再去加人,接受率能差一倍。**顺序反了,你就是在用一个空白档案去敲几百个人的门——加得越多,被标记为可疑账号的风险越大。

**第二步,找决策人。给你五条搜索路径:**

```
① 关键词直搜:  brewery marketing manager Vancouver
② 加筛选:      地区(British Columbia)+ 行业(Food & Beverages)
                + 公司规模(11-50人)
③ 找促销品渠道: "promotional products" distributor + 地区
                或直接搜 ASI / PPAI(见5.5.2)
                —— headline 或签名里带 ASI 编号的,一律是这行的人
④ 从公司页进:  公司主页 → People 标签 → 按职位关键词过滤
                (marketing / merch / brand / operations)
⑤ 小公司没有"marketing manager":决策人就是 Founder / Owner —— 像 Mike
```

第④条要特别说一句:**公司页的 People 标签是最省事的入口**,因为它把这家公司在 LinkedIn 上的所有员工列了出来,你能一眼看出这家公司多大、有没有专职做市场的人、决策链有多长——**这三件事,你在他官网上永远看不到。**

**Sales Navigator** 是 LinkedIn 的付费销售版,月费量级 **$99**,能按职位、公司规模、地区做精细筛选并保存名单、跟踪动态。免费账号有"商业搜索次数上限"——一个月搜到一定次数就被限流到下个月。建议:**先用免费账号做满三个月,确认这条路对你有效,再开一个月试试。**

**第三步,连接请求怎么写。300 字符上限,三条铁律:不推销、给理由、留出口。**

**空白连接请求的接受率 <10%**,更糟的是:对方点了"I don't know this person"(我不认识这个人),点的人多了,**你的账号会被限制**。

带 note 的写法:

> `Hi Alex — I make custom embroidered caps in China, and I've been following how BC breweries do their merch. Did a run for a Vancouver brewery this spring. Not pitching — just like to connect with people in this corner. — [你的名字]`

拆开看:第一句说我是谁、第二句说我为什么关注你这个圈子、第三句给一个可验证的事实、**第四句明确说"不是来推销的"**。最后这句看起来多余,其实是全条最重要的一句——它把对方点"接受"的心理成本降到了最低。

**数据口径:带个性化 note 的冷连接接受率 20-35%;纯模板群发 <10%。**

**第四步,内容营销式开发——这是中国供应商在 LinkedIn 上最大的、也最被浪费的优势。**

你有一样北美同行没有的东西:**车间。**

一个北美的促销品分销商做了十五年帽子生意,可能一辈子没进过帽厂。你随手拍的东西,对他是稀缺内容:

- **12 头绣花机同时开动的 15 秒**——把声音留着,那个声音本身就是内容;
- **裁床上一层层铺布**(见4.2),布匹像水一样流下来;
- **一顶帽子从裁片到成品的六张照片**;
- **"为什么你的帽子洗三次就走形"**——把书里的知识翻成三句英文短句(定型、衬布、缝份,见2.1.1);
- **客户案例**——发之前先问客户同不同意露出 logo。你给 Mike 发了条消息问,他回:"Go for it."(发吧。)

**节奏:每周 2-3 条,每条配两三句英文说明,用一个问题结尾**(问题能带评论,评论能带曝光)。

现实数据,别抱幻想也别小看:一个几百到一千关注的小账号,一条工厂视频常见曝光 **500-3,000 次**;稳定发三个月后,**每月自然找上门的私信询盘 1-3 个**。量不大——但**这些人是自己找过来的,用五特征评分卡(见15.1.1)打分,普遍在 3 分以上**,比平台上买来的询盘质量高一个数量级。(内容获客的完整打法是第23章,这里只讲它在 LinkedIn 上的最小可行版本。)

**第五步,私信三步节奏。连接通过之后不要立刻推销——这是最常见的错误,也是最快被拉黑的方式。**

```
通过后 +2~3 天   第1条:不推销。给一条与他相关的信息,或一句具体的赞。
                 "看到你们 Oktoberfest 那组照片,那批 T 恤的印花做得挺干净。"

     +4~5 天     第2条:给钩子。一句话案例 + 一个问题。
                 "我今年给温哥华一家精酿厂做了 500 顶绣花 dad hat。
                  你们现在的帽子在哪儿做?"

     +5~7 天     第3条:低门槛动作。
                 "我可以照你们的 logo 做一张绣花效果图,免费,你看看合不合适。"

没回复即停。留在关注列表里,靠内容养着。
```

**一个人最多 3 条,每条间隔不少于 3 天。**为什么必须比邮件更克制?因为 LinkedIn 的私信是"在他同事、他老板、他整个行业圈子都看得见的地方"的通道——**被标记为骚扰的代价,比邮件高得多。**邮件被删了就没了,LinkedIn 上被人记住是"那个天天私信的中国供应商",这个标签洗不掉。

**避免被封的四条限度**(平台规则每年调,这是普遍安全区):
① **每天连接请求 20-25 个上限,每周不超过 100 个。**
② **接受率低于 30%**,或者"I don't know this person"的标记多了,账号先被警告,后被限制功能。
③ **每天主动私信控制在 10-20 条。**
④ **绝对不用自动化插件和爬虫脚本。**被检测到直接限制,恢复要 7-30 天,严重的直接封号。**你的账号是资产,不是一次性工具**——一个养了两年、有三千个行业关注者的账号,值好几万块,而且买不到。

**算一笔时间账:**

```
每天 30 分钟:
  15 分钟  加 20 个人(带个性化 note)
  10 分钟  发/回私信
   5 分钟  给别人的帖子留有价值的评论(评论比私信更容易被看见)

一周:100 个连接请求 → 接受约 30 个 → 实质对话 5-8 个
一个月:成 1 个客户,是合理预期
一年:LinkedIn 贡献 3-5 个客户
```

**成本是一年 183 小时,加上可选的 Sales Navigator $99 × 几个月。**对比国际站的 ¥10.5 万,这条路的真实成本是时间——**而时间恰好是你现在唯一富余的东西。**

回到那四个词。你花了一个晚上把档案补完,第二天给他回了条私信:附上活动现场的三张照片、一张绣花特写,加一句"这是我今年做的,就在你们隔壁省"。

隔了两天,他回:

> **"Send me the sample. And a quote for 300."**(寄样品来。再给我报个 300 顶的价。)

**从"你是谁"到"给我报 300 顶",中间隔的不是话术,是一个能被核实的身份。**

本节动作:今晚一小时,把那五件事做完(头像、Headline、About、Featured 三张图、公司页)。从明天开始,每天 20 个连接请求,连做四周,**把每周的接受率记在表里——低于 20% 就改你的连接语,不要改人数。**大多数人做反了:接受率一低就疯狂加人,结果是账号更快被限制。

## 21.5 批发平台:Faire等入驻实操

十月初的一个晚上,你把这四条路摊在桌上盘账。

名单在跑,LinkedIn 在养,展会订在明年一月。三条路都在动,但你发现它们有一个共同的毛病:

**在客户来之前,你一分钱都收不到。**

开发信发出去要等,LinkedIn 加了人要等,展会要等到一月。这三条路的现金流曲线,前半年全在水面以下。你需要一条不一样的路——**一条不用等某个具体的人回你信、就能有单进来的路。**

搜到半夜,你撞见一个词:**Faire**。

**先定义。Faire**,一个面向**独立零售店**的线上 B2B 批发市场,2017 年创立于旧金山。一端是几十万家小零售商——精品店、礼品店、咖啡馆、书店、花店、民宿;另一端是十万级的品牌方。零售商在上面像逛购物网站一样按品类挑货、下小额批发单。同类平台还有 **Ankorstore**(欧洲)、**Abound**、**Creoate**(英国)。

**它凭什么长起来?两件传统批发做不到的事——而这两件事直接决定了你该怎么用它:**

① **零售商首单免运费、60 天账期(net 60,先收货后付款)**;
② **首单可退**——卖不掉可以退回,风险由平台兜。

这两条把一个小店老板下单的心理门槛砍到了接近零。**那对你这个卖家意味着什么?**关键的一句:**平台承担了买家的信用风险,而你照常拿到货款——你不用去追那 60 天的账期。**

把这一条和5.5.1里品牌客户的 30-90 天账期放在一起看,你就明白它的价值了:**同样是给零售端供货,一个是你替客户垫三个月的钱,一个是平台替你担着。**这一条对现金流的意义,比佣金率本身重要得多。

**现在泼冷水,讲入驻的真实门槛——别让任何人以为注册就能卖。**

**第一,你必须以"品牌"身份入驻,卖自有品牌的成品。**不是卖"代工服务",不是接"客户来图定制"。平台审核看的是:独立官网或社媒、**产品实拍**(不是工厂白底图)、品牌故事、批发价与建议零售价的合理关系。**一个"我们是中国帽厂,可以按您的 logo 定制"的账号,过不了审——因为平台上的买家不要定制,他们要现货。**

**第二,主体与地区限制。**平台对卖家所在地区、收款账户、税务信息有明确要求,中国大陆主体能不能直接开店、以什么形式开,各平台政策不同且逐年调整。**入驻前一定去官网看当年的卖家条款,别信任何二手教程——包括这一本。**这句话不是谦虚,是这类平台的规则每年真的会变,而变的那一条往往正是决定你能不能做的那一条。

**第三,要备库存。**平台上的订单是**即时发货**逻辑(通常要求几个工作日内发出),不是你熟悉的"下单—生产 45 天—海运一个月"。**这意味着你必须先押货。**这是这条路和前面四条最本质的区别:**前四条卖的是产能和服务,这一条卖的是库存。**

**费用结构**(以 Faire 为例,常见口径,数字每年会调,以官网为准):

| 项目 | 费率 |
|---|---|
| 平台带来的**新客户首单** | 佣金约 **25%** |
| 该客户之后的**复购** | 佣金约 **15%** |
| **你自己带来的客户**(Faire Direct) | **0% 佣金** |
| 支付处理费 | 约 **2-3%** |

**注意第三行,它是这张表里最重要的一行。**你自己开发的客户,可以引到平台上下单——走平台的账期和收款系统,但**平台不抽佣**。也就是说:**这个平台可以只当你的收款和账期工具用。**这一点后面还要用到。

**带你算一单,用你自己的主款换算:**

```
成本侧
  出厂价 ¥17.5/顶(工厂口径见9.1.1)         = $2.45
  海运到美国仓 + 关税税费 + 入仓上架
  (小批量口径,完整算法见19.1)             ≈ $1.20
  ─────────────────────────────────────────────────
  落地成本                                  ≈ $3.65/顶

定价侧
  自有品牌成品帽,建议零售价                  $28
  批发价按 keystone 取零售一半(见7.2.3)     $14/顶

一张典型订单:12 顶,货值 $168
  平台新客首单佣金 25%                       −$42.0
  支付处理费 2.5%                            −$4.2
  履约:3PL 拣货打包 $3.5 + 美国境内运费 $12  −$15.5
  货值成本 12 × $3.65                        −$43.8
  ─────────────────────────────────────────────────
  净剩                                       ≈ $62.5
  单顶净 $5.21,净利率 37%

同一个客户的复购单(佣金 15%):
  净剩 ≈ $62.5 + $16.8 = $79.3,净利率 47%
```

(**3PL** = third-party logistics,第三方仓储配送服务商:你把货发到它的仓库,它按订单拣货、打包、贴单、交给快递,按件收费。)

**看出来了吗——首单和复购之间差了 16%,而 16% 就是这门生意的全部利润。**首单是买客户,复购才是赚钱。**这类平台的所有玩法,归根到底都是围绕"怎么让第一次下单的人下第二次"设计的。**

**但把镜头拉远,算年度账,你会看到它真正的形状:**

一家小零售店一年下 **2-4 单**,每单 **$150-400**。你要做到章首那个目标——年到手 ¥15 万,折合约 **$2.9 万净利**——按每单净 $60 算,**需要约 480 单**,也就是**150-250 家活跃的零售客户**。

**这是一门"多、小、慢"的生意。**它不会给你 Mike 那样一单顶三个月的爽快,但它**每个月都在流水**。这正是它和前四条路互补的地方:**开发信和展会给你的是大额、低频、有波峰波谷的收入;批发平台给你的是小额、高频、能填平谷底的现金流。**

**起步资金算一下**:3 款 × 3 色 × 每色 50 顶 = **450 顶**,备货 ¥7,875(按 ¥17.5)+ 头程与入仓约 ¥8,000 + 产品拍摄与品牌物料 ¥5,000 ≈ **¥2.1 万押在库存上**,回收周期 3-6 个月。

**把这 ¥2.1 万和国际站的 ¥10.5 万并排放着看:一个赌流量,一个赌选品。**赌流量赌错了,钱是花掉的;赌选品赌错了,钱还在——它变成了仓库里 450 顶卖不动的帽子,你还可以降价、可以送、可以拆开当样品用。**对没有本钱的人来说,这个区别很重要。**

**适合什么产品线?四条判断标准:**
① **不需要客户 logo 的自有设计**——有图案、有态度、有系列感的成品。这是最难的一条,它要求你从"给别人做"切换到"做自己的东西"。
② **零售价带 $20-35**。低于 $15,美国境内那 $12 的运费会把你吃穿(见下面的翻车案例)。
③ **SKU 少而精**:3-5 款 × 2-3 色。**库存深度重于宽度**——十个款各备 20 顶,等于十个款都缺货。
④ **能小批量补货**。你的工厂肯不肯给你接 200 顶的翻单,直接决定这条路走不走得通——这就是第12章讲的备份厂和小单关系的现金价值。

**不适合**:纯代工、需要客户 logo 的定制单、超低价通版白帽(见5.4.1)。

**和自己开发客户,怎么取舍?给表,不和稀泥:**

| 维度 | 批发平台 | 自己开发(21.3/21.4) |
|---|---|---|
| 获客方式 | 被动,平台给流量 | 主动,慢 |
| **客户归属** | **平台的**(站外引流受规则限制) | **你的** |
| 定价权 | 受平台价格带和同行比价约束 | 你定 |
| 现金流 | 平台按周期付你,稳定 | 定金自己谈(见14.5.1) |
| 单值 | $150-400/单 | ¥2-5 万/单 |
| 前置投入 | 库存 ¥2 万起 | 时间 |
| 学到的东西 | 选品与库存管理 | 谈判、方案、客户关系 |

**决策规则:两条腿走路,但比例要清楚。新人期建议 8:2**——八成时间在自主开发(利润高、关系归你、能力可以复用到所有渠道),两成在平台(测款、收现金、把库存周转起来)。

**两个触发切换的阈值:**
- **向上**:平台上某个零售客户**一年复购 ≥3 次、年采购 ≥$5,000**,就该把他转成直连关系(走 Faire Direct 或者线下直供),**把那 15% 的佣金变成你的利润**。一个年采 $5,000 的客户,15% 就是 $750/年,而这层关系一旦建立,能维持好几年。
- **向下**:如果连续两个季度**平台单量不增长、且库存周转慢于 90 天**,说明选品不对——**砍 SKU 止损,不要靠加广告硬扛**。库存生意里,最贵的成本不是没卖掉,是"再等等看"。

**一个典型翻车案例,它把这一节所有的数字串起来:**

有人把工厂现成的爆款白帽拍了张图就上架,定价**批发 $9 / 零售 $18**,第一个月出了 6 单,觉得这事成了。三个月后他算了一次总账:

```
一单 6 顶,货值 $54
  美国境内运费          −$12.0
  3PL 拣货打包          −$3.5
  佣金 25%              −$13.5
  支付处理费            −$1.4
  货值成本 6 × $2.20    −$13.2
  ──────────────────────────────
  净剩                  ≈ $10.4
```

**一单忙到头,净剩十美元。**更糟的是:这款帽子在 Amazon 上有人卖 $14 零售(见22.1),他的零售商买回去标价 $18 卖不动,退了两单——**退货运费和处理费又吃掉一单半的利润。**

**两条教训:第一,批发价低于 $12 的商品在这类平台上很难赚钱,因为固定的履约成本(运费+拣货)是刚性的,货值越低,它咬掉的比例越大;第二,你的产品在别的渠道的零售价,就是你批发价的天花板——零售商在下单前,一定会去 Amazon 搜一遍。**

**本节动作,今晚一小时:打开 Faire,以买家身份注册一个免费账号**(这不需要任何资质),进 Hats & Caps 类目,把排在前面的 **20 个品牌**记进一张表:卖什么款、批发价多少、建议零售价多少、最小起订几顶、店铺照片是什么调性、有多少个 SKU。

这张表就是这条路对你的可行性报告。看完你只会得出两个结论之一:**"我的东西能进这个价格带"**,或者**"我现在的东西只能拼价格"**。

**两个结论都值这一小时**——因为第二个结论会把你推回到21.3和21.4:在你有一个像样的自有品牌之前,你最该做的事,还是一封一封地写信,一个一个地加人。

## 本章工具

**工具一:开发信模板库(三封)**

三封都遵守同一套骨架:**一个只属于他的细节 + 一个带数字的同类案例 + 一个低门槛的下一步**,全信 150 词以内,不带附件,底部三行合规声明(见21.3.2)。

**① 冷启动开发信(第一次接触)**

```
Subject: Hats for [Brewery Name]'s 10th anniversary?

Hi [Name],

Saw your merch page — you've got tees and a beanie, but no cap.
There's even a comment asking when you'll make hats.

This spring I made 500 embroidered dad hats for a Vancouver brewery.
Heavy brushed cotton, logo on the front, CAD 9.90 landed at their door.
They sell them at the bar for 30. Photos here: [链接]

Want me to mail you one to feel? Just send me an address —
no charge, nothing to return.

[真名] | [手机] | [网站]

— — —
You're receiving this because your email is publicly listed on [官网].
[真实公司/个人名 + 完整实体地址]
Reply "unsubscribe" and I'll remove you immediately.
```

**② 展会跟进信(展后 48 小时内发,主题行必须带展会名)**

```
Subject: The navy brushed cap you tried — Canton Fair, Hall 4.1

Hi [Name],

We met Thursday afternoon — you tried on the navy brushed dad hat
and said it felt heavier than the one next door. That's 240 gsm
after wash, which is the number you asked me to confirm.

You mentioned you're sourcing for [具体用途] around [时间].
Attached is nothing — just three numbers for that spec:
500 pcs / USD X.XX FOB / 30 days ex-factory.

I still have that sample. Want me to ship it to your office?

[真名] | [手机] | [网站]
[合规三行]
```

**③ 老客唤醒信(六到十二个月没下单的老客户)**

```
Subject: Same cap, one year on

Hi [Name],

It's been about a year since your 500 caps shipped.
Two things:

1. If you're planning anything for [他今年的活动/季节],
   ordering by [具体日期] keeps you clear of the shipping season.

Your embroidery file is still on hand, so a repeat order needs

唤醒信的机制:**它不问"最近好吗",它给一个日期和一个免费的东西**。老客户不回信的首要原因不是不满意,是**没到他想起这件事的时候**——你的任务是替他想起来。

# 第22章 B2C与定制路线

**主线推进** —— 十月初的一个上午,你正在整理 R&B 那单的结案文件夹,邮箱跳出一封陌生地址的来信,抬头是 Cedar Room Yoga,落款 Dana。第一句就把来路交代干净了:"Mike 给了我你的邮箱。上周去他们酒厂喝酒,吧台上摆着那批帽子,我摸了一下,就问是谁做的。"她说下个月是瑜伽馆五周年,想给老会员做一批帽子,炭灰色,前面绣馆名和一棵杉树,预算15加元一顶。然后是那个数字:**80顶**。

你盯着"80"看了几秒。三个月前的你会觉得这是天上掉下来的:客户主动上门、预算比 Mike 还高、logo 都想好了。但你现在是从车间里爬出来的人,第一反应是老纪那张脸和报价单上那行字——中型厂现货色起订300-500顶(见6.2.2)。80顶这个量,电话打过去,老纪会客气地说"这个数我们排不进去";老崔的白板上(见8.3.1)根本没有这一格。更难堪的一层你也想到了:就算有厂肯做,80顶去摊制版费、摊调机时间、摊一整趟头程运费,单顶成本会高到你没脸报价。

这封邮件把一个迟早要面对的问题推到了眼前:**小于起订量的单,到底怎么接?**

答案不在工厂那一侧,在你这一侧——你得把"接单"这件事本身做成一件有规格、有价目、有交期的产品。本章走的就是这条路:先把 B2C 三个平台的账一分一分算开(你会发现它们比传闻里薄得多),再设计定制业务的完整动线,把起订量、加价、交期写成一张公开的菜单;最后回到 Dana 这80顶——它有解,而且解出来的毛利率比 R&B 那单还高。

## 22.1 Amazon

### 22.1.1 类目现状与FBA费用链

先看一眼战场长什么样。你在浏览器里打开亚马逊美国站,搜索框敲进 "baseball cap",回车。屏幕上瀑布一样铺下来的东西,前四行是广告位,标着小小的 Sponsored;往下滑,几十个几乎长得一模一样的六片棒球帽,黑的藏青的卡其的,价格挤在一条窄带里:**$12.99 到 $29.99,主力全在 $16.99-24.99 这一段**。头部那几个链接的评论数是五位数,一万八千条、三万六千条;第二梯队三五千条;而排在第四页之后的,评论数只有个位数,大概率一天卖不出一顶。

先把三个词认了。第一个,**listing**:平台上的一个在售条目,一个商品页,包含标题、五点描述、图片、价格和库存——中文常直接叫"链接"。你以后跟电商卖家客户打交道,他说"我这条链接跑起来了",说的就是这个东西。第二个,**BSR(Best Sellers Rank,类目排名)**:平台按近期销量给每个商品在类目里排的名次,是行业里唯一公开可见的销量代理指标;帽子这种大类目,排进前一百意味着日销在一百到三百单量级。第三个,**FBA**(见0.2、4.6.4):你把货发进亚马逊的仓库,平台替你存、替你发、替你处理退货,你只管卖——代价是它按环节一层一层收费,收成一条链,行内就叫**FBA费用链**。

这个类目现状,一句话总结:**极度同质化、极度透明、极度依赖广告**。同质化是因为帽子本身没有技术壁垒,你能开的模,别人明天也能开;透明是因为价格和评论数全部公开,任何一个新人第一天就能看到所有对手的底牌;而当产品和价格都没差别时,唯一的变量就只剩"谁的链接被看见",于是所有人被赶进同一个拍卖场——广告位。记住这个因果,它是后面那张利润表所有窟窿的源头。

现在拆费用链,逐项过一遍,每一项都告诉你它为什么存在、多少钱、以及帽子这个品类在这一项上是吃亏还是占便宜。

**一、销售佣金(referral fee)。** 平台按成交金额抽成,服装配饰类目的行业口径是 **15%-17%**,本书全部算例统一按 **15%** 计。这一项还藏着一条与定价强相关的分档规则:平台在某个价格线(近年画在 $15)上下设了两档费率,线以下的服饰件费率显著更低。这意味着 $14.99 和 $15.99 之间不是一块钱的差别,而是一整档佣金的差别。费率年年微调,你要记住的不是数字,是这个**动作**:定价之前,去后台费率表把你的类目查一遍。

**二、FBA配送费(fulfillment fee)。** 平台按包裹的**尺寸段+重量段**收一笔固定金额,这是费用链里最大的一刀。帽子在这一项上是明确吃亏的品类:它不重——单顶净重110g,连塑袋不过四盎司出头——但它**占体积**。帽冠是个撑起来的半球,厚度五英寸打不住,于是几乎必然从"小号标准件"掉进"大号标准件"那一档,配送费从三块出头跳到 **$4.50 上下**。这里有个真实的两难,你迟早会碰上:把塑袋抽真空压扁,尺寸降一档,一顶省一块多美元,一千顶就是一千多美元;但帽子靠蒸汽定型(见4.5.1)撑起来的那个形,压三个月就废了,客户拆开是一顶软趴趴的饼,差评直接砸在你链接上。这笔账怎么选,取决于你的价格带——二三十美元的帽子,一个差评的代价远不止一块钱。

**三、仓储费。** 按体积按月收,标准件淡季(1-9月)约 **$0.78/立方英尺·月**,旺季(10-12月)跳到 **$2.40**,三倍。一顶塑袋装的帽子占体积约 **0.25立方英尺**,折下来淡季 **$0.20/顶·月**、旺季 **$0.61/顶·月**。别小看这个数:一顶帽子在仓里躺三个月,光仓储就吃掉六毛到一块八——而它的出厂价才两块五。**滞销在亚马逊不是"钱没赚到",是"钱在往外流"**,这是它和实体零售最不一样的地方(见7.2.3,实体店的滞销至少不额外收租)。

**四、长期仓储费。** 在仓超过一定天数(近年是271天)加收一笔惩罚性费用,量级是 $0.15/立方英尺·月与 $0.15/件取高者。它的作用不是创收,是**赶人**:平台用价格逼你别把它的仓库当自己的库房。

**五、退货处理费与移除费。** 服饰类目退货时,平台要拆、要检、要重新包装或判废,这笔工序费用向你收。移除费(把卖不掉的货从平台仓退回你指定地址)约 **$0.97-1.15/件**,弃置约 **$0.32/件**。这里帽子终于占了一次便宜:整个服饰大类的退货率常在 **20-30%**,因为尺码试穿是重灾区;而帽子靠均码加调节扣(见2.4),尺码退货几乎被免掉了,退货率通常只有 **5-10%**——7.2.3 里 Mike 那两箱 XL 码的教训,在这里第二次兑现成真金白银。

**六、贴标与包装合规。** 这一项在4.6.4已经讲透:FNSKU 商品条码每件一张、原有条码必须完全遮盖,货件标签每箱两张;单件透明袋、袋口≥5英寸必须印窒息警告语;外箱单边≤63.5cm、单箱毛重≤22.7kg;箱内不得混装不同 FNSKU。在工厂贴,**¥0.2-0.5/顶**;等货到了海外仓再拆箱补贴,**$0.3-0.55/件**外加三到五天,或者交给平台代贴,约 **$0.55/件**——同一件事,时间点差几天,成本差十倍。

**七、头程。** **头程**指货从中国工厂运到平台海外仓的这一段(渠道与费用构成见第17章),它不属于平台收费,但它是费用链上必须一起算的一格,而且是新手最容易低估的一格。两条路:海运整柜或拼箱、双清到仓派送,行价约 **¥2,000-3,000/方**;走 FBA 包装的帽子不能像 R&B 那样嵌套八顶一摞(要塞纸团撑形、降到六顶),1,000顶大约占 **1.6方**,合 **¥4,000 上下,即 $0.55/顶**。另一条是空派,**¥32-50/公斤**,帽子按体积重计费约 0.27kg/顶,折 **$1.3-1.8/顶**。你会发现自己经常被迫走空派——新品要抢上架时间、爆款断货要救命,这两件事一年至少发生三次。

一段对话,是这一节最该记住的东西。你在电商群里看见有人问:"帽子出厂两块五美金,亚马逊卖二十,能做吗?"底下一堆人说"太能了"。这时候你该开口的是一句反问:"**你说的二十块,是收进来的,还是留下来的?**"上面七项加起来,平台和物流会从这二十块里拿走一半以上,而工厂只拿走两块五。至于剩下的到底是多少——下一节一格一格算给你看。

本节动作:开一张空表,把上面七项抄成七行(佣金/配送费/仓储/长期仓储/退货与移除/贴标/头程),每一行后面留两格,一格填"行价区间",一格填"我这个 SKU 实际是多少"。第二格的数,一律去后台费率表和货代报价单里抄,**不许凭印象填**——这张表填不满,你就还没有资格给任何一个亚马逊卖家报价,更没有资格自己去卖。

一格一格来。
