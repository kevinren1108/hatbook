# 第6章 中国产业带地图

**主线推进** —— 生产进入第七天。今天你的帽片不在厂里——绣花外发(见4.3.4)去了邻镇。傍晚,工厂跟单员小周在微信上发来一段十几秒的视频:绣花厂的车间,一排多头绣花机同时起落,绷架上撑着的正是你那批藏青帽片,金黄的麦穗一针一针浮出来。视频最后两秒晃到窗外:马路对面是一家纸箱厂,再过去一个门头,挂着"织带·辅料"四个字。你把这两秒来回看了三遍,忽然意识到一件事:从你住的旅馆出发,面料商行、辅料档口、绣花厂、纸箱厂,车程没有一个超过一小时——做一顶帽子要用的东西,全在方圆几十里内长齐了。一个多月前把询价名单圈定在胶州之前,你做过一夜功课,画过一张中国帽子产业带的草图:山东、广东、江苏、河北、浙江,每个地方接什么单、报什么价、什么脾气。那张草图当时救了你的预算,以后还会决定你手里每一张订单该发往哪里。这一章,把它完整摊开。

## 6.1 产业带原理:帽子为什么扎堆长

### 6.1.1 一小时配套圈:面料、辅料、绣花、包材怎么围着帽厂长

在胶州李哥庄镇的主街上站十分钟,你能数出一条完整的帽子供应链:一辆小货车正卸成卷的斜纹布;电动三轮拉着两编织袋绣好的帽片从巷口拐出来;五金店隔壁的门头写着"汗带 织唛 帽檐芯";再往前,纸箱厂的叉车把压扁的瓦楞纸板码上车。这个镇挂着"中国制帽之乡"的牌子不是虚名——第0章开头那个"早晨七点半响成一片"的镇子,写的就是这样的地方,你的工厂就在这个圈里。**帽厂从不单独存在,它长在一整片配套里。**行内把同一种产品的工厂、原料商、加工商、服务商在一个地理范围内高度聚集的现象,叫**产业带**;而衡量一个产业带成色最直观的标尺,是**一小时配套圈**:做这个产品要用到的所有东西,能不能在一小时车程内配齐。

把R&B这顶帽子拆开,对着圈数一遍。面料:60米磨毛斜纹(见1.2.2),镇上面料商行的现货色(见1.5.2),当天提货;辅料:汗带(见2.3.3)、织唛(见2.3.4)、金属滑扣(见2.4.2)、帽檐芯,档口一条街,常规货当天配齐,定制织唛一周;绣花:外发(见4.3.4)的绣花厂在邻镇,帽片早上送去、按针数排机;包材:纸箱厂按你的箱规(60×40×40cm)三天交货;出运:货代——帮你订舱、拖车、报关的货运代理(第17章专章讲它)——在胶州和青岛市区遍地都是,拖车到青岛港一个小时。五样东西,一样都出不了这个圈。

机制层面,配套圈替你买的是两样东西:交期弹性,和试错成本。生产是一条环环相扣的链(见4.1.2),任何一环缺料,整条线就停。配套在一小时内,缺料是"下午补上"的事;配套在五百公里外,缺料是"快递三天加上对方起订量(见1.5.2)"的事。带你算一笔:假设装配前清点,发现金属滑扣短了500个——这种事故的概率比你想的高,辅料按损耗加量发货,碰上一批电镀不良就会短数。在李哥庄,业务员一个电话,档口老板下午骑三轮送到,当天不停线;换成没有配套的内陆城市,滑扣要从外地五金厂发,人家起订3000个、物流三天——车缝线(见4.4)停三天,按一条线日产千顶算(见4.4.4口径),压住的是三千顶的产能。工厂只有两个选择:让计件的工人(见4.4.3)闲着——闲着就是没收入,工人会流失;或者把你的单撤下来先做别人的——你的交期就是这么烂掉的。

对话样本,事故的另一半。功课阶段你问过一家中部省份"帽厂"的报价,比胶州低5%,你多问了一句:"绣花自己做还是外发?外发厂多远?"对方:"发到外省绣,来回一周吧,不耽误的。"——一句话暴露了全部:绣花来回一周,意味着任何一次绣偏返工(见4.3.2)再加一周,而他报的交期和胶州厂一样是35天。**便宜的5%,买进来的是交期里一颗随时会炸的雷。**

本节动作:把"配套半径"写进你的选厂问题清单,开口问三样——"面辅料主要从哪进、多远?绣花自己做还是外发、外发厂多远?纸箱几天能到?"三个答案都落在一小时圈内的厂,它承诺的交期才有弹性可言;有一个答案在五百公里外的,把它报的交期自动加一周再做决定。

### 6.1.2 工人池与信息池:产业带的两笔软资产

配套圈是产业带看得见的资产。还有两笔看不见的,分量更重。

第一笔叫**工人池**。帽子车缝是一门专门手艺:帽片是弧线拼接,六片要拼出一个规整的球冠(见2.2.1);上帽檐要把一条硬檐芯均匀地"吃"进圆弧里,快了起皱、慢了歪斜——一个做惯了衣服的熟练车工转做帽子,也要三到六个月才真正上手。产业带的意义在于:这门手艺以万人计地囤积在方圆几十里内。李哥庄和周边镇村,帽厂及配套的从业者以数万计,车工在厂与厂之间自然流动:这家旺季加班,那家新线招人,厂门口的小黑板和老乡微信群里贴着计件工价(见4.4.3)。对工厂,这意味着旺季扩线招得到人、淡季收线人有去处;对你,这意味着**你的帽子大概率是被做了十年帽子的手车出来的**。反过来想就懂它值多少钱:一家搬到无产业带地区的新厂,招来的工人要从"帽子怎么拿"教起,前半年效率和良率打七折——这七折,最终都会折进你的价格、交期和退货里。

第二笔叫**信息池**。产业带里,行情不走文件,走饭桌、婚宴和老乡群:哪家外贸公司拖货款、哪个客户验货最狠、今年美国客人流行什么洗水(见3.3.3)、隔壁镇工价涨到多少——这些花钱买不到的信息,在这里是空气。你在产业带泡一个星期,对行情的了解会超过在写字楼里查一个月。信息池还有一个副产品,行内叫**裂变**:班组长(这个岗位第8章正式认识)手艺到了、客户认识几个,出去租个院子、买五台平车,就是一家小厂——先接老东家的外发单,慢慢长大。李哥庄那几百家厂里,相当一部分是这么一代代裂出来的。裂变对你是双刃剑:一面是外发网络像毛细血管一样发达,旺季你的单总找得到人做;另一面是小作坊良莠不齐——你的单要是被工厂悄悄转给裂变小厂做(行内叫转厂,怎么防,第12章教),品质就脱离了你验过的那家厂的管控。

带你把两笔软资产折成钱,看一个对比。同样接你500顶:产业带内的中型厂,车工平均工龄五年往上,车缝良率常规98%上下,损耗按2-3%备料(第4章口径);无产业带地区的新厂,新手占一半,良率掉到93-95%——差出的这三五个点,直接变成补裁补做的成本和交期风险。更扎心的是,新厂报价未必更便宜:它的招工、培训、返工成本都比产业带里高,只是没摊开给你看。**工人便宜不等于工厂便宜;成熟,才等于便宜。**

对话样本:验厂时你夸一句"师傅们手真快",老板顺口答:"我这的车工,最短的也干了六年,上帽檐那两个,做帽子十几年了。"——这句话在产业带里是平常话,在产业带外是奢侈品。所以验厂时有一个零成本的动作:走到上帽檐的工位边上,问一句"这道谁做,做了几年?"——这道最难的工序上坐着三年工还是三个月工,基本就是这家厂的底色。

本节动作:把6.1两节收成一条选厂总则,写进笔记——**选厂先选带:配套看一小时圈,车工论年不论月;产业带外的低价,先替它把良率和交期的账算完,再决定心动不心动。**下一步,把中国地图摊开,一个产业带一个产业带认过去。

## 6.2 山东青岛/胶州:美单绣花棒球帽重镇

### 6.2.1 基因与强项:为什么美单都往山东跑

你的工厂所在的这片产业带,故事要从三十多年前讲起。八十年代末九十年代初,韩国和港台的制帽企业外迁,选中了青岛:离韩国一海之隔、有深水港、劳动力充足。外资厂带来的不只是缝纫机,是完整的订单体系——它们手里握着的主要是**美单**:以北美市场为主的出口订单,典型形态就是结构化棒球帽(见2.1.1)加前幅绣花,量大、版型标准、验货规范严。此后三十年,外资厂本土化,管理层出来开厂,班组长再裂变(见6.1.2),滚成今天的局面:以胶州李哥庄为中心,帽厂和配套厂数百家、从业数万人,全国出口的绣花棒球帽里,相当大的一块从青岛口岸走向北美。**一个产业带的基因,就是它第一批订单的样子**——山东的第一批订单是美单,所以它今天最擅长的还是美单。

这个基因落到实处,是三件事。第一,**绣花配套全国最密**:美单棒球帽九成带绣花,几十年的订单喂出了密度最高的绣花厂集群,从平绣到3D绣(见3.1.7)、从裁片绣到成品帽绣(见4.3.3)一应俱全——你那8800针的麦穗在这里是家常菜。第二,**版型审美对路**:你说dad hat、说snapback(见2.1.2),报一个PMS色号(见1.4.2),业务员不用你解释——他们做了几十年北美客户,你的客户想要什么,他们比你先见过。第三,**出口动线短**:拖车一小时到青岛港,直航北美的航线密,本地货代和报关行(第17、18章展开)对帽类操作烂熟。

报价风格也带着基因:**直爽**。山东厂接询价,规格问齐,当天或次日给价,给的基本就是能做的价——水分小,但砍价空间也小。这跟美单的训练直接相关:北美客户比价狠、决策快,习惯报虚价慢慢磨的厂,几十年下来早被淘汰干净了。对话样本,把你功课那几天的一通电话原样放这里——你报完规格(全棉精梳21支磨毛斜纹240克、8800针前幅平绣、金属滑扣、500顶),对面沉默十几秒,像在按计算器:"这个配置,¥17.5。制版费(见3.1.5)另算,200,翻单免。交期下单后35天。你这绣花针数不少,麦穗那块得用金黄线——潘通号发我。"——三句话:报价、交期,还替你想到了线色确认。最后那半句的分量,要到验货那天你才会真正掂出来(第11章见)。

数字上给你一个受用全书的锚:同规格的绣花棒球帽,把**胶州中型厂的报价当作基准价**——本章后面所有产业带的价格,都用"比胶州贵几成、便宜几成"来标定。这不是山东情结,是因为它的量、配套和竞争密度摆在那里,价格最贴近真实成本;**基准价的意义,是让别处的报价有了坐标**:比它低两成的,先查克重和密度(见1.3.2、1.1.5);比它高两成的,得能说出贵在哪。

本节动作:凡是美式版型加绣花logo的单——这会是你未来订单的大多数——询价名单里必须至少放一家胶州厂。哪怕最后不在这里下单,它的报价就是你手里的价格标尺;没有这把尺,你在任何产业带听到的价都无从判断贵贱。

### 6.2.2 厂型与起订量画像:在这里下单的正确姿势

同一条镇街上门挨门的两家帽厂,量级可能差着两个数量级。把胶州的厂型摆成一张对照表,你就知道该敲哪扇门:

| 厂型 | 车缝线规模 | 典型客户 | 单款起订量 | 跟你的关系 |
|---|---|---|---|---|
| 头部大厂 | 二十条以上,自动化车间 | 国际品牌、大型促销品集团(见5.5.2) | 3000-5000顶起 | 认门,别敲门 |
| **中型厂** | 5-10条 | 贸易商、中小品牌、电商卖家 | 现货色300-500顶 | **你的主战场** |
| 小厂/作坊 | 1-3条 | 老东家的外发、低价单 | 几十顶也接 | 只做备份 |

你后来签下的那家厂,8条车缝线,是教科书式的中型厂。为什么中型厂是你的主战场?机制从两头看。往上看:大厂管理规范、认证齐全,但它的成本结构为万顶级订单设计,500顶对它是负担(这笔账6.4.2细算);往下看:小作坊价格灵活、几十顶也接,但没有质检岗,面辅料随行就市地买,品质押在老板一个人的手艺和心情上——做备份、接外发可以,把主单交给它,等于把验货(第11章)的全部压力留给自己。中型厂正卡在中间:老板大概率车间出身(见6.1.2的裂变),天天在产线上转;业务员三五个,人人做过跟单;300-2000顶的单是它的主力口粮——你的500顶在这里不是添头,是正餐。

但"正餐"不等于"大餐",这个体感先给你校准。带你算:8条线、每线日产800-1200顶(见4.4.4口径),全厂日产七八千顶往上,月产能20万顶量级;你的500顶,占它月产能的千分之二三——一条线一天的活。对话样本,功课时你直接问过业务员"500顶你们嫌不嫌小",对方答得很实在:"接。你这个量,插在两个大单换款的空档里正好(插单与排产的门道见4.7.3)。绣花帽单价高,做着划算;再说做熟了,明年你翻四个款,不就大了?"——这段话是中型厂接小单的三个真实动机:**排产调剂、单价结构、翻单期望**(翻单红利的机制见4.4.2)。听懂这三个动机,你就知道自己在这家厂里的分量怎么涨:交样利索、确认及时、按时打款,你是它眼里"值得投资的小客户";反复改规格、拖着不确认、砍价砍到骨头缝,它下个月就会用排期教你做人。

还有一个时间变量要叠进去:**淡旺季**。美单有自己的日历——北美客户春夏戴帽,倒推回来,头年秋冬到次年开春是胶州的抢产能季,中型厂的排期表在旺季里以周为单位被大单填满,小单的"插空"位置随时可能被挤掉;四到六月之后节奏放缓,同一家厂对500顶的态度会从"排排看"变成"下周就能上"。你这单赶在六七月生产,正踩在顺风口上——同样的单放在十一月去谈,交期和价格都会硬一截。把这一条记成规矩:**给中型厂下小单,先问排期再谈价格,旺季给自己多留两周**。

在这里下单的正确姿势,收成三个动作。第一,**画像三问**,电话里就能问:"你们几条车缝线?主要做哪个市场的单?去年接过最小的单是多少顶?"——三个答案拼出厂型:8条线、美单为主、最小接过300顶,就是你要找的门。第二,**对号入座**:300-2000顶,找5-10条线的中型厂;低于300顶别硬磨——磨下来的价也不会好,走6.5的现货路;高于5000顶,再去敲大厂的门。第三,**把"我会翻单"讲在前面**——不是空口许愿,是把你的产品线规划亮出来:你给Mike做的那份四SKU方案(见1.1-1.2),此刻就是谈判筹码,让工厂按"年度客户"给你定位,而不是按一锤子买卖报价。

## 6.3 广东东莞/广州:品质、快反与潮牌单

### 6.3.1 强项:版房能力与小单快反

换一个场景。东莞一家帽厂的二楼**版房**——工厂里专做样品的部门:打纸样的师傅、两三台样品车、一面挂满历季样帽的墙(它在工厂组织里的位置,8.3.2正式介绍)。一个潮牌主理人坐在样品车边上,捏着刚下车的样帽:"檐再短5毫米,顶扣换黑镍的,下午能再出一版吗?"师傅点点头。当天下午,第二版真的出来了,当场确认——这个"当场",就是广东的核心竞争力。

先把这一节的关键词钉死。**快反**,快速反应:小批量、多款式、短交期的接单与生产模式。它不是"做得快"三个字,而是一整套组织方式:版房与产线一墙之隔,小流水线随时换款,面辅料半天配齐,首件老板娘亲自盯。快反能力强的厂,一个款100-300顶也接,下单到出货7-15天;对比常规模式30-40天的交期(构成见4.7.2),快出来的这三个星期,就是潮牌客户愿意多付钱买的东西。

顺手把东莞和广州的分工也认清:两个名字常连着说,角色并不同。东莞是制造端,帽厂和加工厂长在各个镇街;广州是资源端——辅料市场、设计工作室、贸易公司、批发档口密集,很多"广州帽厂"实际是前店后厂:接单展厅在广州,生产在东莞或更远。问清"厂在哪个镇",是你在珠三角开口的第一句话。

为什么这套能力长在广东?三层地利。第一,**辅料与工艺半径**:广州的辅料市场、东莞及周边的五金电镀、皮标胶章(见3.3.1)、洗水厂(做旧工艺见3.3.3),密度全国最高——潮牌款用的异形金属标、特殊洗水,在山东可能要外发广东做,在东莞就是隔壁镇。第二,**设计资源半径**:潮牌、买手店、设计师工作室扎堆广深,改版是当面改,不是快递改——打样一来一回省下的每个三天,乘以一季十几个款,就是一个上市窗口。第三,**组织基因**:珠三角服装业几十年做欧美快时尚单,换款是日常不是事故,换款损耗(见4.4.2)早被组织方式消化掉了。

带你算清潮牌单的账,你就懂这种单为什么只有广东接得住。一个潮牌一季20个款、每款150顶,总量3000顶,听着不小——但要换款19次。按第4章的机制,普通流水线每换一次款吃一次爬坡损耗,19次换款能把一条线的月效率打到六成以下;山东为大批量优化的厂接这种单是受刑,广东为换款优化的厂接这种单是主业。**同一张单,落在两个产业带的成本结构里,是两门生意。**

对话样本,东莞业务员接潮牌询盘的标准话术:"三个款先各做150顶试卖,版费我们担一半;哪个爆了,翻单7天补货。"——这句话对潮牌客户是致命的:试错成本低、爆款不断货,正是快反模式真正出售的东西。你要学的不是复述它,而是识别它背后的定价逻辑:这种服务,单价必然高于基准价(见6.2.1)——高多少、还有什么隐性代价,下一节逐项算。

本节动作:给"该去广东的单"画像,写进决策笔记——**款式复杂(特殊辅料/洗水/拼接)、单款300顶以下、多款并行、交期两周以内、客户愿为设计和速度付钱**。五条占了三条,询价名单就该往东莞、广州倾斜;一条不占的,接着往下读,看看你会为此多付什么。

### 6.3.2 代价:价格、排期与沟通成本

广东的好处上一节讲完了,这一节看价签。三行:价格、排期、沟通成本。

第一行,**价格:同规格贵一到三成**。机制拆三层。工价:广东车工月薪比山东高一到三成——珠三角生活成本高,电子厂、服装厂互相抢人;人工占帽子成本两三成,单顶直接贵出几毛到一块。厂租水电:东莞镇街的厂房租金是胶州镇上的好几倍。模式成本:快反养着的版房师傅、机动工、随时留白的产能,全是钱,都要摊进每一顶帽子。带你代入R&B这单:胶州基准价¥17.5,东莞同规格报¥21上下,500顶差出¥1750——听着不大,但这单毛利总共几千块(完整的账第7章、第19章算),这一刀下去就是两三成。关键不是贵,是**贵得冤**:R&B主款是标准6片dad hat、单款500顶、交期35天,快反的三样本事——复杂、多款、快——你一样都用不上。**为用不上的能力付费,是新人在广东交的第一种学费。**

第二行,**排期:普通单让路**。快反厂的排产逻辑是急单优先、爆款翻单插队(插单机制见4.7.3);你一个35天交期的常规单,天然排在优先级末尾,旺季碰上哪个客户的爆款补货,你的交期就会被"商量"。对照着看:在胶州,你的500顶是插在大单空档里的调剂(见6.2.2),反而稳。同一张单,在一个产业带是正餐,在另一个产业带是让路单——**排期地位,和价格一样是产业带属性**。

第三行,**沟通成本:隔手**。两个具体形态。其一,广东的外贸和贸易公司密度全国最高,平台上挂着"东莞工厂"的,相当比例其实是贸易公司——你以为在跟厂谈,中间隔了一手甚至两手,报价含两层利润,品质问题传话失真(工厂和贸易公司怎么分辨、贸易公司什么时候反而该用,第12章专讲)。其二,转厂(见6.1.2):接单的厂排期满了,把你的单转给别的厂甚至外地代工点做——你验过的厂和做你货的厂不是同一家,验厂等于白验。事故案例:一个电商卖家在广州下了800顶"12天快反"单,单价¥23;第18天货才到,两批帽檐弧度还不一致——追问才知道,单被转到几百公里外做了。快反的钱付了,买到的是转厂的货和错过的上新档期,首批评价两颗星。

最后给你一个把"买不买快反"变成算术题的判断式:**只有当"晚三周交货的损失"大于"快反的溢价"时,这笔钱才值得花**。代进数字:500顶的单,东莞比胶州贵¥1750;如果你的客户只是普通补货,晚三周没有任何实际损失,这¥1750就是白扔;如果晚三周意味着错过一场确定的活动、一个上新档期,损失以千美元计——那¥1750买三周,是全场最便宜的东西。快反没有贵贱,只有用对用错。

本节动作,三条防线加一条规则。防线:①下单前视频连线看产线——让业务员举着手机走到车缝线边上,拍正在生产的款,贸易公司这一步就露馅;②问明白:"我的货在哪个厂区哪条线做?生产中能不能随时看视频?"③把"未经书面同意不得转厂"写进订单条款。规则一句话:**要快、要复杂、客户付得起,来广东;只是要一顶普通的好帽子,回山东。**

## 6.4 江苏泰州/淮安:超大厂集群与小单现实

### 6.4.1 超大厂的规模逻辑:谁在这里下单

把地图往北挪到江苏。泰州、淮安一带的帽业园区,是另一个物种:大门有门禁和访客登记,厂区里几栋标准化车间,车缝线三五十条,工人两三千,宿舍楼、食堂、篮球场一应俱全,一年出货几千万顶。你在胶州看到的是"厂",这里是**帽子小镇**。

谁在这里下单?看车间里挂的生产看板就知道:国际运动品牌的基础款、北美大型商超的自有品牌帽、头部促销品集团(见5.5.2)的年度框架单——单款几万到几十万顶,一签一年。机制上,超大厂的规模逻辑是三层互相咬合的齿轮。第一层,**摊薄**:国际大客户下单前要过社会责任审核、验厂认证、实验室检测一整套(这些证书怎么读,12.4.2教你),这套体系一年的维护费用几十上百万——摊到几千万顶上,每顶几分钱;中型厂伺候同样的客户,同样的钱摊到几百万顶上,成本立刻不成立。第二层,**自动化**:自动拉布裁床(见4.2.4)、吊挂流水线、上百头的绣花车间,设备投入千万级——只有量大到一定程度,机器才比人便宜。第三层,**确定性**:大客户真正买的不是最低价,是"十万顶按月保质交付、出了问题赔得起"的确定性;超大厂的厂房设备和年报,本身就是履约担保。

这个集群为什么长在苏北?两个条件凑齐了:一是土地和人工比珠三角便宜一截、又背靠长三角的港口与外贸服务圈——上海、太仓的航线和货代资源一小时高速圈内够得着;二是这类超大厂要的不是"配套一条街",而是大片连续的厂房用地和以千计的稳定用工,苏北的县域恰好给得起。同样是产业带,胶州长成了"几百家厂的生态",苏北长成了"几家超级工厂"——**订单结构决定产业带的形状**,这句话反过来也成立:看一眼产业带的形状,你就知道它想接什么单。

带你算规模的价差。同一款常规棒球帽,10万顶的单,超大厂报价能比中型厂低5-8%——单顶省一块上下,整单省出十来万;而且量越大越稳:面料整缸起染(见1.5.2的染缸逻辑,万顶级订单是染厂眼里的好客户)、辅料按年度协议价锁定、海运整柜直发(第17章)。规模在供应链每一环上都拿到更好的价格——**便宜不是挤出来的,是量换来的**,这就是规模逻辑的全部。

对话样本,你功课时跟一家江苏大厂业务员的通话(那时纯属见世面),你假设性地问了句"如果有10万顶的单",对面语气平静得像报天气:"这个量,一个车间一个月就出来了。真有的话先谈年度框架,单款价格都好说。认证要哪几家的?我把现有证书清单发你。"——注意他的第一反应:谈框架、发认证,而不是报价。大厂的销售语言体系是为年度客户设计的,这个细节记住,下一节马上用到。

本节动作:今天你和它没有交集,但要在名单里给它留个位置——未来某天你真接到品牌方或商超量级的客户(这些客户长什么样,第20章画像),江苏就是名单上的答案。现在,把它的存在记下来就好;然后看下一节:为什么今天的你,连它一张报价单都拿不到。

### 6.4.2 小单为什么进不去:起订量的硬门槛

先看一段真实质感的往来。功课阶段,你给一家江苏大厂发过正式询价:规格齐全、数量500顶、附logo文件——按第1章练出来的标准话术,挑不出毛病。三天后收到回复,全文两行:"您好,我司单款起订量5000顶,贵司数量暂无法安排,抱歉。祝商祺。"没有报价,没有下文。

先别觉得被怠慢——这两行已经是**诚实的好厂**。更坏的版本是给你报一个¥25的"劝退价":不好意思直接拒绝,就用价格劝退;你若不懂行情,还以为这帽子就值这个价,回头拿着它去衡量别家,整个坐标系都歪了。为什么500顶真的进不去?三笔账,每笔都是数学,不是态度。第一笔,**换款账**:几十条线的排产以周为单位、以万顶为刻度,你的500顶上线,调线、换工序、工人爬坡(换款损耗机制见4.4.2)要吃掉半天到一天。把数字摆出来:一条线日产上千顶,停半天调线等于凭空少做五百顶的产值,而你的整张单一共才500顶——**做完你的单,产出刚好抵掉换款损耗,等于白干**;同样这半天调线,摊在一个5万顶的款上,是百分之一的零头。这不是大厂矫情,是分母不同。第二笔,**组织账**:大厂一个业务员对接几个年度大客户,跟单、单证、验货流程全按大单设计;走完你500顶的全流程,人力成本和5万顶的单几乎一样,摊到每顶上贵得离谱。第三笔,**机会成本账**:接你的500顶占掉的排产窗口,本可以留给年度客户的插单(见4.7.3)——大厂的产能永远优先喂给框架客户,这是它对大客户履约承诺的一部分。

顺带教你一眼识别"劝退价":同一份规格,拿6.2.1的基准价当尺——中型厂报¥17.5,大厂报到¥25,高出四成,而大厂的规模优势本该让它更便宜——**报价方向和规模逻辑拧着的,就不是报价,是逐客令**,礼貌收下,别还价,更别拿它当行情。

给你三条阈值,把"门当户对"变成可操作的数:**单款3000顶以下,不碰30条线以上的厂**,询价都省了;**3000到10000顶,可以谈中大型厂**,这时你对它开始有意义;**10000顶以上或年度框架,大厂的门才真正打开**。反方向的错配同样成立:拿5万顶的单去压一家5条线的中型厂,它接了也做不动,只能偷偷外发,品质失控——6.1.2讲过的转厂风险,换个方向重演。

还有一个隐蔽变体要防。有些大厂不直接拒小单,而是转给"关联小厂":挂着大厂的招牌接单,做货的是园区外另一套班子,设备、工人、品控全是两回事——你以为买到大厂品质,拿到的是贴着大厂名头的小厂货,价格还按大厂收。防御就一句话,当面问清:"**我的货在哪个厂区、哪条线生产?验货能不能进产线看?**"答案含糊的,名头再大,按小厂对待。

本节动作:询价之前先问一句"单款起订量多少",省下三天等一封"祝商祺";再把这条原则写进决策笔记——**门当户对是供应链的第一美德:厂比你大两个量级,你是它的负担;厂比你小两个量级,它是你的风险;大一号,才是彼此的甲方。**

## 6.5 河北白沟/浙江义乌:低价现货与二次加工

### 6.5.1 现货帽+成品绣花:最低成本的起步法(承接4.3.3)

换到义乌。国际商贸城的帽子区,一条走道两侧全是档口,每家十几平米,货架从地板码到天花板:纯色棒球帽按色号插成一面彩虹墙,渔夫帽(见2.1.2)一摞摞捆着,trucker(见1.2.4)挂满侧墙。价签直白:纯色斜纹棒球帽批发**¥5-15/顶**,大头落在¥6-10,几十顶起拿,当天发货。河北白沟是同一物种的北方版本——那个镇以箱包批发闻名全国,帽子搭着箱包的渠道一起走量。这两个地方卖的不是"定制",是**现货**:货就堆在那里,你买的是"现在、马上、便宜"六个字。

这一节教你的路数,行内叫**现货贴牌**:不开定制生产,直接买市场现货白帽(无logo的成品帽),用帽绣机做成品帽绣花(见4.3.3)把客户的logo绣上去,贴牌交货。它是这本书里**启动成本最低的一条起步路**——带你把账算完,你就知道低到什么程度。假设客户只要100顶试水:现货帽¥8×100=800;成品帽绣花——成品帽要单只上绷、效率比裁片绣低得多,千针单价比大货裁片绣贵三到五成,常规logo折下来¥2.5-3.5/顶——按¥3×100=300;制版费(见3.1.5)¥200。合计**¥1300,三到五天交货**。对比走定制:中型厂起订300-500顶(见6.2.2),货款¥17.5×500=8750,交期35天。**整整一个数量级的差距。**预算三千以内、客户要货百顶以下、或者下周就要的救火单,现货贴牌是唯一解;它也是你自己练手第一单的最佳姿势——第0章说的"低成本动手",在这里可以低到一千块出头。

配套圈的原理(见6.1.1)在批发市场同样成立,只是长相不同。对话样本,义乌档口的真实节奏——你:"这个藏青的,200顶有货吗?"老板娘头都不抬:"有,仓库现调,下午发。"你:"要绣logo。""三楼老陈家,绣帽子一条龙,拿我名片过去,版费让他给你抹了。"——十五秒,货、加工、人情价全部接通。市场楼上楼下长着绣花档、印花档、烫画档、包装档,微单的二次加工在这里是流水作业;这也是义乌比白沟对新人更顺手的地方:白沟胜在极致便宜的走量,义乌胜在"买货+加工+发货"一栋楼办完。

机制上想明白一层,你会用得更准:现货贴牌的本质,是**把生产环节的一切不确定性换成了商品货架的确定性**——不用等排产、不用盯交期、不用赌打样,代价是你对这顶帽子的规格没有任何发言权:克重、辅料、版型,货架上是什么就是什么(这个代价有多大,下一节展开)。所以它天然适配的是"对帽子本身没有精确要求、只要logo上身"的场景:一次性活动、展会赠品、社群试水。

本节动作,两件都为将来留后路:第一,**留封样**——拿货当场留一顶,签字装袋封存,它是你和客户之间"就按这一顶的品质"的凭证,也是万一翻单时对色对版的唯一依据;第二,**问三句**——"这个款常年有货吗?下次拿还是这一批吗?成分克重能告诉我吗?"三个答案原话记进笔记。为什么这三句性命攸关,翻过这一页就知道。

### 6.5.2 低价的边界:什么单千万别在这做

先拆机制:¥8的帽子凭什么卖¥8?对着¥17.5的定制款逐项扒。面料:克重(见1.3)180克上下甚至更低——定制款是240克;普梳低支纱(见1.1.5),布价省一半。辅料:塑料排扣(见2.4.1)、纸板檐芯、通用洗水标或干脆无标,一套几毛钱——定制款一个金属滑扣就顶它一套。做工:小作坊快车快出,没有质检岗,跳线、歪缝按概率随机出现(这些疵点长什么样,第11章图鉴里全有)。而最大的省法你看不见——**它不为一致性花一分钱**:市场现货是许多小厂的货汇进同一个档口的,今天这批和下个月那批,可能不同厂、不同缸(缸差见1.4.1)、甚至不同版型;定制生产里花在验布(见4.2.1)、扎号(见4.2.5)、封样比对上的所有钱,现货全省了。**¥8买到的是一顶帽子,买不到的是"下一顶和这一顶一样"。**

所以现货贴牌的死穴不在第一单,在翻单。事故案例:一个做本地团建生意的卖家,用白沟¥6的现货帽给一家连锁健身房做了300顶logo帽,客户很满意;三个月后翻单1000顶,他按原路进货——第二批到货,帽身颜色深了半个色号,帽型比首批矮了将近一指。健身房拿着首批样帽逐顶对,整批拒收。他赔了来回运费,两单利润归零,客户拉黑。复盘病根:第一批和第二批根本不是同一家小厂的货,档口自己都说不清货源——6.5.1让你问的那三句,他一句都没问,封样也没留。

**什么单千万别在这做**,边界清单背下来:①会翻单、且客户会拿上一批对这一批的——一致性是现货永远给不了的东西;②对克重、手感有明确要求的——R&B那句"摸起来厚实"在现货区无解,¥8的帽子拿在手里就是轻的,240克磨毛斜纹(见1.2.2)在货架上根本不存在;③品牌客户、出口带第三方验货的——验货按封样和规格表(见2.5.2)判定,现货过不了(验货怎么验,第11章);④儿童帽和合规敏感市场——成分标、安全要求(18.6展开)现货帽一概答不上来;⑤零售价20美元以上、客户拿品质讲故事的——故事会被一顶脱线的帽子一票否决。五条收成一条阈值:**只要客户会拿着上一批对这一批,就离开现货区。**现货贴牌的正确客户画像是"不回头的场景":活动、赠品、试水,货交完,这一单就翻篇。

带你最后算一笔"该升级了"的账,给这条路画上刻度:现货贴牌单顶合¥11上下(见6.5.1算例,不含版费),定制500顶单顶¥17.5——看似贵6块多,但从300顶往上,定制的单顶成本被起订量摊开,而你能拿到的售价因为"定制款"三个字高出一截;经验刻度是:**单量过300顶、或客户开始问"能不能换个扣/加个标",就是从现货区毕业、走进产业带的信号**——客户对细节开口的那一刻,现货的天花板就到了。

本节动作:把6.5两节合成一条双面规则写进决策笔记。正面:"预算三千内、百顶内、一周内——现货贴牌,留封样、问三句";反面:"翻单、厚实、验货、儿童、品牌——五个词沾上任何一个,回产业带开定制"。中国境内的地图至此走完,最后把视线移出国境线。

## 6.6 东南亚与"中国+1":什么单在外流

### 6.6.1 外流三角:关税、工价、交期

做功课那晚,你在B2B平台上注意到一类供应商:名头挂着"越南工厂直供""孟加拉产能对接",详情页里是和胶州看着没差别的棒球帽。这不是零星现象,是一场持续多年的产能迁移,采购圈叫它**"中国+1"**:海外品牌不把鸡蛋全放在中国,在中国之外再布局至少一个生产国的采购策略。第5章点过名的国内头部大厂(见5.4.2),这些年陆续在缅甸、孟加拉建分厂,一建就是几十条线、几千工人的量级——注意这个细节:**出海建厂的主力,恰恰是中国大厂自己**。产能在外流,订单未必离开中国公司的手。

驱动外流的是一个三角,逐个角讲。**关税角**:美国对帽类的基础进口税率本来就有几个点,叠加对中国产商品的加征之后合计到两位数;同一顶帽子从孟加拉、越南出口美国,只按基础税率甚至更优惠的安排走(两头海关的完整机制,第18章展开)——货值百分之十几的差距,量大的时候是决定性的。**工价角**:山东熟练车工月薪五六千、旺季更高,越南大约两千五到三千五,孟加拉、缅甸一两千;人工占帽子成本两三成,单顶差出¥1-2。**交期角**——反着的一角,也是新人最容易漏看的:帽子的面料、辅料、绣花线,当地配套几乎为零,大头仍要从中国海运过去,前置期多出2-4周;6.1.1讲的一小时配套圈,在那边不存在——缺500个滑扣,在李哥庄是下午的事,在仰光是下一班船的事。综合下来,东南亚产能的交期更长、弹性更差、事故修复能力弱。

把三角代进两个量级算一遍,答案自己会跳出来。10万顶的美单:单顶工价省¥1.5上下,关税按货值再省百分之十几,合计省下几十万人民币——为这笔钱养一个驻厂团队、忍受长交期,划算。所以外流的单长这样:**量超大、款式简单、交期宽松、目的地美国**。换成你的500顶:同比例省下来三五千块,一轮打样的国际快递加一趟差旅就吃光了,还没算沟通成本和风险——**外流三角是大单的数学,小单代进去是负数**。这也解释了你在地图上看到的分工:简单大货往外走,小单、复杂款、快反、绣花配套重的款,反而在向中国的产业带回流集中。外流不是中国帽业在失血,更像一次按订单类型的分层。

对话样本,一段你迟早会遇到的开场。功课时你向一个挂"越南产能"的供应商询了500顶,对方倒是坦率:"500顶?越南线起订两万顶,你这个量我们还是在国内厂做——越南是给沃尔玛那种单准备的。"——一句话印证了整个三角:门槛是量,不是意愿。

本节动作:把三角画进笔记——关税、工价、交期三个角,各标一行"谁受益、谁受损";然后记住它真正的用途:不是指导你去哪下单,而是**应对客户的提问**。你未来的北美客户,几乎一定会在某封邮件里问出那句"你们能不能在越南做"——怎么接,下一节给你现成的话术。

### 6.6.2 新人跟不跟:结论先给,别碰

结论先给,一句话:**东南亚下单,新人五年内别碰。**这一节先把理由讲硬,再教你把"不碰"说得漂亮。

四道门槛,一道比一道高。第一道,**量的门槛**:东南亚产能为几十万顶级的框架单设计(见6.6.1),单款万顶以下基本无人接——你连6.4.2那封"祝商祺"都收不到。第二道,**管理门槛**:大牌在东南亚下单,标配是驻厂质检团队常年盯线;你一个人,隔着时差、语言和文化,连"帽檐弧度不对"都传达不清,更别说应对罢工、停电、雨季物流这些当地日常。第三道,**供应链门槛**:面辅料要自己从中国组织出运过去——等于做贸易之前先当一回跨国采购经理,任何一卷布迟到,停的都是你付了钱的产线。第四道,**资金门槛**:更长的交期意味着更长的资金占用,加上预付比例高、出了争议隔着国境难解决,一单压进去的现金流是国内下单的两倍以上。

事故案例,把这笔学费展示一遍。一家做促销品的贸易公司,2万顶美单,为省十几万的关税和工价差把单转到缅甸的合作厂;生产中赶上当地状况停工,复工后又缺辅料等中国的补货船,交期从60天拖到105天。客户的促销档期等不起,最后1.2万顶改走空运——空运费一出,两单的利润倒贴进去。老板复盘只说了一句话:"省的钱是纸上的,延误是真的。"注意这还是一家有大厂关系、做过两万顶的老手;同样的局面换成新人,连"当地到底发生了什么"都要靠对方转述,止损的每一步都慢一拍。

但"别碰"不等于"别懂"——客户会问,而你的回答质量,直接决定你在他眼里是"接单的"还是"懂行的"。把这段标准话术抄走,客户问"能不能在越南/孟加拉做"时用:"可以聊。我们合作的大厂在东南亚有产能,经验上单款两万顶以上、交期能放宽四周的订单,走那边才真正划算;您现在的量级,中国产业带在成本、交期、品质上仍是最优解——关税差价我可以做进到岸成本表,两条路线并排算给您看(这张表怎么做,第19章手把手教)。"这个回答一次做了三件事:承认趋势,不装外宾;亮出资源,合作大厂;把决策拉回数字,到岸成本。多数客户听完会选中国路线——因为提问的客户,多半自己也只是听说了"中国+1",从没算过账。

再给一个远期阈值,免得"五年"变成教条。当你同时满足三个条件——**单款2万顶以上、年度稳定翻单、客户明确愿为关税差分担配合成本**——可以重启这个话题;姿势也不是自己去建厂,而是**借船出海**:通过在东南亚有产能的中国大厂下单,让它替你扛管理和供应链,你只多付一层可控的服务费。本节动作:把上面那段应答话术录进你的客户FAQ文档,原句背熟;然后合上世界地图——你的战场在国内几个产业带之间。最后一节,把它们放上同一张决策表。

## 6.7 决策表:按订单类型匹配产业带

一个多月前做功课的那个晚上,你干过一件后来看极其划算的事:拿着同一份规格——500顶、全棉磨毛斜纹240克、8800针前幅平绣、金属滑扣——给三个产业带各打了一通摸底电话。三通电话的原样记录如下。

东莞的厂,业务员语速快:"这个配置我们做得漂亮,类似的潮牌款上个月刚出过一批。¥21,300顶起也接;常规25天,加急15天。"胶州的厂——就是后来做你这单的那家:"¥17.5,35天,500顶没问题。潘通号发我。"义乌的档口,老板娘听完直接笑了:"磨毛斜纹240克,定制?没有的,现货最厚也不到200克。要logo隔壁给你绣,¥8的帽子绣完合11块——但你说的那个厚实劲儿,跟这个不是一个东西。"

十五分钟,三个答案,比任何攻略都诚实:同一顶帽子,三个产业带给出的根本不是三个价格,是**三种做法**——贵三成的精做、基准价的正做、便宜一半的"另一顶帽子"。把全章走过的六个地方收进一张决策表,以后每张订单,先过表、再询价:

| 订单画像 | 首选产业带 | 一句话理由 |
|---|---|---|
| 量大价敏:单款5000顶+,款式常规 | 山东大厂;万顶以上敲江苏 | 规模摊薄,基准价再往下(见6.4.1) |
| 品质定制中批量:300-3000顶,美式版型+绣花 | **山东胶州中型厂** | 美单基因+绣花配套+基准价(见6.2) |
| 潮牌复杂款/多款小单/两周内急单 | 广东东莞、广州 | 版房+快反,为快和复杂付钱(见6.3) |
| 微单试水/赠品/一周内救火:300顶以下 | 义乌、白沟现货贴牌 | 最低成本,放弃一致性(见6.5) |
| 超大单+美国关税敏感:2万顶+ | "中国+1",借中国大厂海外产能 | 大单的数学,新人别碰(见6.6) |

用R&B的单把表跑一遍,五个条件逐项过筛,你就看懂当初的结论是怎么长出来的。条件一,**500顶**:江苏大厂和"中国+1"直接出局(见6.4.2、6.6.2的量级门槛)。条件二,**"摸起来厚实"=240克磨毛斜纹定制**:现货区出局(见6.5.2)——这一条卡死了最便宜的路。条件三,**8800针绣花是这顶帽子的脸面**:绣花配套的密度和熟练度权重拉满,胶州加分(见6.2.1)。条件四,**九月中旬的周年活动是死线**:你要的不是"快",是"稳"——不需要15天快反,需要35天说到做到;配套圈完整、你的单在厂里是正餐而不是让路单(见6.2.2、6.3.2),这两条又指向胶州。条件五,**预算**:出厂¥17.5过得了账,东莞的¥21会把毛利先削掉两成(这两成意味着什么,第7章摊开算)。五个筛子落完,盘子里只剩一个答案:**胶州,中型厂**。你此刻住的这个镇,不是碰巧,是推演的终点。

这张表还有一个隐藏用法,教给你:**倒着用,筛供应商**。凡是报价严重偏离它所在产业带"人设"的,都值得多问一句为什么——义乌档口报出定制精做的价,东莞厂报出比胶州还低的价,内陆新厂报出胶州都做不到的交期,每一个反常背后,要么有你没看见的猫腻,要么有你没听懂的条件。产业带的脾气,就是你校验报价的第二把尺(第一把是6.2.1的基准价)。

本节动作,两件。第一,把决策表抄进笔记本第一页,连同使用规则:**先给订单画像——量、款、期、价,四个字;再对表选产业带;最后才开始找具体的厂**。产业带选错,后面找厂的功夫全是白费;找厂的手艺,第12章有一整章。第二,回一条微信。你对着小周发来的视频看了最后一遍,回:"收到,辛苦。帮我拍一张麦穗那块的近照。"两分钟后照片来了,屏幕上的金黄看着挺正常。**看着挺正常**——这五个字里睡着一颗雷,要到验货那天才响(第11章见)。

## 7.1 链条解剖

### 7.1.1 从¥15出厂价到$29.99零售价:每一手加价表

先把第0章那顶帽子请回桌面。一顶普通的绣花棒球帽,离开胶州这样的工厂时出厂价约¥15,按全书汇率口径(见0.3)折合2.11美元;几个月后,它躺在北美一家零售店的货架上,吊牌29.99美元——十四倍多。新手看到这个倍数,第一反应几乎都一样:中间的人在暴利。你今晚要做的第一件事,就是把这十四倍逐手拆开,拆完你会得出一个反直觉的结论:**这条链上没有谁在暴利,每一手的加价里,大头是成本和风险,利润只是尾巴。**这条从工厂到消费者、每一手都加一道价的链,行内借管理学的词叫**价值链**——听着抽象,拆开就是一张表:

| 环节 | 拿货价 | 卖出价 | 加价幅度 | 这一手承担什么 |
|---|---|---|---|---|
| 工厂 | 材料+工缴约¥13.8 | 出厂¥15(≈$2.11) | 约8个点 | 厂房设备、几百工人的工资、垫料垫工、质量返工 |
| 贸易商/出口商 | ¥15 | FOB约$2.50(≈¥17.8) | 约15个点 | 跟单验货、单证报关、垫定金、收汇汇率、客户跑单 |
| 进口商/品牌方 | 到岸约$3.30 | 批发$13 | 约4倍 | 海运关税、整柜库存压半年、款式开发、品牌营销、滞销 |
| 零售商 | $13 | $29.99 | 约2.3倍 | 房租人力、试戴损耗、季末清仓、退货 |

逐手念给你听。第一手,工厂:¥15的出厂价里,材料辅料工缴占掉近¥14,毛利一两块钱——具体怎么拆,7.2.1整节算给你。第二手,贸易商按¥15拿货,以**FOB价**卖给海外买家——FOB即离岸价,货送到中国港口装上船为止的价格,责任费用的完整分界到13.3.1精讲,这里先当"卖给外国客户的出口价"理解——报$2.50,折¥17.8,毛利率约15个点,赚的是语言、渠道和担责的钱(7.2.2展开)。第三手,进口商或品牌方:FOB价之外,还要自己掏海运费(整柜摊到每顶不过一两毛美元,规模效应见17.1)、关税税费、目的国内陆运仓储,货到自己仓库的完整成本约$3.30——这个"货送到手上一共花了多少"的数,行话叫**landed cost(到岸成本)**,全书最重要的一个数,第19章整章教你算,这里先记住名字。然后他以$13的批发价卖给零售渠道,加价约四倍——最凶的一手,但注意他扛的东西:一柜货几万顶压在仓库里周转半年,款式开发和品牌广告的钱全在这一手里烧,一个滞销季就能把几年利润吐回去。第四手,零售商$13进、$29.99卖,加价2.3倍,养的是房租、店员和卖不掉的那三成货(7.2.3算细账)。

看懂这张表,你就拿到了本节最要紧的那句话:**加价不等于利润。**每一手的加价=这一手的经营成本+这一手的风险准备金+最后剩下的利润。四倍加价的品牌方,净利率常常只有个位数到10个点;2.3倍加价的零售店,年底一算净剩的也是个位数。链条上每个位置的"点数"和"倍率"长得完全不一样,但净利差距远没有表面那么悬殊——因为**加价高的位置,一定是成本重、风险大、离消费者近的位置**;市场不给白拿的倍率。

一段对话帮你把这个认知焊死。做外贸的社群里,隔三差五就有人发这种帖子:"兄弟们,帽子出厂两美金,亚马逊上卖三十,十五倍!这还不冲?"三个月前的你可能真会心动;今晚的你可以一句话拆掉它:"你冲进去之后,占的是链条上哪一手?品牌方那一手吗——那你准备好压多少库存、每月烧多少广告?零售那一手吗——你的流量从哪来?"十五倍是**整条链所有人的成本加起来**的倍数,不是留给任何一个新进场者的空间;你能赚的,永远只是你实际顶替的那一手的钱。这也是"钱的地图"的用法:**看到任何一个诱人的价差,先问它横跨了几手,再问你有能力顶替其中哪一手。**

### 7.1.2 加价倍率与毛利率:两个常混淆的概念

上一节的表里,工厂那行写"8个点",零售那行写"2.3倍"——你有没有停下来问一句:"点"和"倍",到底是不是一套算法?这一节把它掰开,因为**这是新手报价时最容易亏钱、也最容易被绕晕的一对概念**,不夸张地说,分不清它们的人不该报价。

两个定义,现场钉死。**加价倍率**:卖价除以成本,答案是"几倍"——成本¥20卖¥30,倍率1.5倍;与它同源的说法叫加价率,(卖价−成本)÷**成本**,同一个例子是50%。**毛利率**:(卖价−成本)÷**卖价**——注意分母换成了卖价,同一个例子,(30−20)÷30≈33%。同样一笔买卖,"加价50%"和"毛利33%"说的是一回事,数字却差出十七个点——**差别全在分母:加价率除以成本,毛利率除以卖价。**再给一对换算公式,值得抄在手机备忘录里:毛利率=1−1÷倍率;倍率=1÷(1−毛利率)。代两个数你就有感觉了:2倍加价=毛利率50%,不是100%;想要毛利率50%,要加价2倍,不是1.5倍。顺带把第三个词也认了:毛利之外再扣掉房租、工资、广告这些经营费用,剩下的才叫净利,净利÷卖价即净利率——本章说"工厂5-15个点""贸易商10-20个点",说的都是毛利率口径;净利还要再薄一层。

为什么行业里两套话并存?习惯使然:**零售和品牌端开口是毛利率**("我们做户外渠道要五十个点"),**工厂端开口常是加价口径**("这单我就加你五个点");同一个"点"字,分母不同。所以给你一条实战纪律:**凡是听到"点",先问分母**——"您说的四十个点,是按卖价算还是按成本算?"一句话,土,但它救过很多单的利润。

看一场真实质感的翻车,数字都给你留着。一位刚起步的同行接了美国客户1000顶渔夫帽,含运含税到门,他把成本算得很扎实:每顶合计$4.10。客户邮件里写"我们这边渠道要留40个点",他心想:那我自己也留40个点吧——**于是按成本乘以1.4报价:$5.74。**错在哪?"留40个点"是毛利率,正确算法是成本除以(1−40%):4.10÷0.6=**$6.83**。一乘一除,每顶差$1.09,1000顶,报价那一秒就把一千多美金让出去了。故事还没完:谈判中他又让了5%,成交$5.45,此时真实毛利率只剩(5.45−4.10)÷5.45≈25%;收款走PayPal,手续费吃掉营收的4.4%;结汇再损1个点;后来补寄15顶瑕疵货,快递$180——期末一算,到手$875左右,合**16个点**。他从头到尾以为自己"留了40个点",实际连一半都没拿到;要是中间再出一次像样的事故,这单就是白干。病根只有一个:**他用加价的算法,去兑现毛利率的承诺。**

回到你的主线核对一下姿势。你给 Mike 报的是9.9加元/顶到门(这单的完整分账在7.3.2摊开),假如当初你的目标是"到手一半",正确的检查方式是:毛利率=(卖价−成本)÷卖价,而不是看"我在成本上乘了几"。以后每次报价,流程固定成一句话:**先定目标毛利率,报价=成本÷(1−目标毛利率),报出去之前再用毛利率公式倒验一遍。**乘法留给别人犯错用。

本节动作:在手机备忘录建一条置顶,就三行——①报价=成本÷(1−目标毛利率);②毛利率=1−1÷倍率;③听到"点"先问分母。然后做一道自测:成本¥22,目标毛利率45%,该报多少?(答案:22÷0.55=¥40,而不是22×1.45=¥31.9——两个答案差出的¥8.1,就是这一节的全部价值。)

## 7.2 各环节真实毛利

### 7.2.1 工厂:5-15个点,靠量、翻单和退税活着

白天你在车间外的走廊上看过一块白板:八条车缝线,每条线后面写着当天的目标产量和实际产量,差几十顶的那条线用红笔圈着。晚上回来拆账你才真正看懂那块白板的意思——**在5-15个点的毛利率里,工厂每天追的那几十顶,就是利润本身。**空口说薄没有感觉,拿你自己的帽子开刀:R&B 主款出厂价¥17.5,把它拆到底:

| 成本项 | 金额(¥/顶) | 口径出处 |
|---|---|---|
| 面料(磨毛斜纹,含裁耗) | 1.5 | 见1.5.1 |
| 里衬、檐芯等结构料 | 1.0 | 见2.1.1 |
| 辅料(金属滑扣+收尾环、气眼、汗带、织唛洗水标、包装袋箱) | 2.5 | 见2.3/2.4 |
| 绣花(8800针×¥0.45/千针,外发) | 4.0 | 见3.1.5 |
| 裁剪与车缝工缴 | 3.5 | 见4.4.3 |
| 后整、定型、包装工缴 | 0.9 | 见4.5/4.6 |
| 水电房租、设备折旧、管理人员摊销 | 1.8 | — |
| 损耗(按2-3%计) | 0.4 | 见4.1 |
| **成本合计** | **15.6** | |
| **工厂毛利** | **1.9(约11个点)** | |

一顶¥17.5的帽子,工厂赚¥1.9——这还是小单的价:500顶要单独排产、单独调线,点数本来就给得靠上;同样这顶帽子如果是十万顶的长单,出厂价会被砍到¥15.5-16,点数掉到5-8个。为什么工厂没有还手之力?第5章你刚看过答案:全球前十厂商份额不足15%,高度分散意味着客户永远找得到第二家报价(见5.2.2),而工厂的成本结构里,材料辅料工缴全是市场价,谁也藏不住——**一个人人都会算的成本表,撑不起高毛利。**

那工厂靠什么活?三根柱子。第一根,**量**:带你算年账——八条线、日产八千顶、一个月开二十五天、一年有效生产算十一个月,约二百二十万顶;单顶净赚¥0.8-1.5,一年就是两三百万——前提是全年吃饱,淡季线一空,固定成本照烧,这个数直接打八折。所以工厂最怕的不是价低,是没单:**宁可微利接单养线,不能停线等价**,你以后听到工厂淡季报出"不像话"的低价,背后是这笔账。第二根,**翻单**:第一单要打样、制版、调机、工人学新款,换款损耗全在里面(见4.4.2);翻单时这些全免,工人手熟效率再涨两三成——同一个价,翻单能多挤出两三个点的利润。这就是为什么工厂对翻单客户又爱又让着:**你嘴里的"老客户",在工厂的账本上是一条毛利率更高的生产线。**第三根,**退税**:帽子出口退税约13%,机制到18.3细讲,这里只把量级给你——落到这顶¥17.5的帽子上,退税带来的现金回流约¥0.8-1.2,**对一个毛利只有¥1.9的工厂,这笔钱接近毛利的一半**。所以有的工厂敢把报价贴着成本报,把退税当利润(见9.7.3)——你在1688上见过¥13.9的"同款",现在你有了两把解释的刀:要么在成本表里减了配(第9章教你逐行抓),要么就是把退税折进价里的走量打法。

对话样本,是你砍价前必须先听懂的一句行话。你试探性地问过一句"量再大点,价格还有没有空间",对方答:"实话说,这个价我就赚个加工费,再让就要在料上想办法了。"——前半句是真话:11个点里,材料辅料是市场价、绣花是外发价,能"让"的只有工缴和管理摊销那五个来点;后半句是警告也是实情:**砍掉的价一定会从成本表里最软的那格找回来**(降克重、换辅料档次,手法见9.2.2、9.3.2)。所以给你一个谈判阈值,先立在这里、第9章还会用到:**对工厂的还价空间,常规就在3-5个点以内;有人爽快答应你砍10个点,不是你赢了,是配置输了。**

本节动作:把上面那张拆解表存档,以后拿到任何一张帽子报价,先自己按这个框架拆一遍BOM(材料+辅料+工艺+工缴+摊销+损耗),再对照工厂报价——报价低于你拆出来的成本合计,不要窃喜,逐格去找哪一格被动了手脚;报价高出成本合计五个点以上,那多出的部分才是真正可谈的(见9.6.2)。

### 7.2.2 贸易商:信息差的10-20个点,与被两头挤的宿命

晚饭你是在镇上一家小饭馆解决的。邻桌两个人的对话你越听越入神——其中一位做了十年帽子外贸,正跟同伴倒苦水:"昨天美国客户发我一张1688截图,同款帽子,问我为什么贵15%。我能怎么说?我说你按截图买一次试试——他还真去买了,你猜怎么着,今天又回来了,说收到的样品克重不对、没人理他。"同伴笑,他不笑:"这次他回来了。下次呢?"

这段对话就是贸易商这一手的全部处境。先说他的10-20个点从哪来。教科书会说"信息差":他知道哪家厂做金属扣款最稳、哪家绣花厂旺季不掉链子、哪个价是实价哪个价是钓鱼价——这些信息客户没有,愿意付钱买。但信息差只是入场券,真正支撑点数的是三样更重的东西。**整合**:海外客户要的常常不是"一款帽子",是帽子加T恤加袜子三个品类、五个款式各几百件,背后是三四家工厂——每家工厂都嫌单小,贸易商把它们拼成自己的采购量,拿着几家的货拼一个柜(拼箱的账见17.2),客户面对的始终只有一个人。**担责**:货出了问题,工厂的责任边界是"返工"(见11.6),而贸易商对客户签的是整单交付——赔偿、补货、空运追时效,先扛下来的是他;客户多付的点数里,有一部分是保险费。**服务**:时差里秒回的邮件、打样三轮的来回盯、验货、单证、物流,全是工厂不愿干或干不好的活。**贸易商真正卖的不是帽子,是"确定性"**——这句话你记住,因为它马上也是你的商业模式。

再说"被两头挤"。第一头,客户比价:阿里国际站和1688把中国工厂摆到了全世界买家的浏览器里(平台的账见21.1),纯粹的价格信息差正在肉眼可见地消失——开头那位同行的15%,十年前是30%。第二头,工厂直客化:工厂自己开国际站账号、自己拍短视频接海外单(这股潮流第23章你会站到它有利的一面),等于供应商亲自下场做你的竞争者。两头一挤,纯搬运型的贸易商——只转发报价、赚差价、不提供任何增量价值的那种——点数一路被压向个位数,直到无利可图。这不是预测,是正在发生的事。

一场事故,把"挤"的第三种形态也给你看了:**被绕过**。那位同行讲了他自己交学费的一单:早年他有个合作三年的美国客户,每年翻两次单。有一年出货,工厂按惯例刷箱唛(见4.6.3),箱唛上印着客户公司名和目的港;第二年广交会,那家工厂的业务员在展位上直接把名片递到了这位客户手里,报价低8%。第三年,客户的单没有再来。"怪工厂吗?"他自己回答自己,"怪我。三年里我除了转单,没给客户干过一件工厂干不了的事——人家绕过我,一点损失都没有。"从那以后他的规矩改了:箱唛用自己公司的代码、单证信息脱敏是基本功(操作细节见16章),但更根本的是**每一单都要留下工厂替代不了的痕迹**:替客户做款式建议、整合多厂供货、扛住一次索赔——让"绕过你"这件事变得有成本。

你现在就是一个贸易商——R&B 这单里,你既不拥有工厂也不拥有品牌,你站的正是中间这一手。所以这一节的结论请对号入座:**信息差会持续贬值,整合、担责、服务不会。**靠前者只能赚到行业的过去,靠后三样才能赚到它的未来。

本节动作:从这一单开始养成一个月度自问,写进你的复盘模板:"这个客户的最近一单里,我除了转发报价和转账,还干了哪三件事?"——三件都答得上来(比如:改过他的方案、拦过一次质量问题、垫过一次时效),这个客户就还是你的;答不上来,别等箱唛泄密,他已经在离开的路上了。

### 7.2.3 批发与零售/DTC:2-4倍加价背后的库存与流量成本

正拆着账,Mike 的邮件进来了,像是掐着点要给你这一节当教材。译过来是:"生产顺利吗?对了,帽子到了我们打算吧台卖30一顶,周年活动那天买两杯酒送一顶。上次做T恤,进价9块卖25,我一直以为自己挺黑的——直到年底盘库,发现赚的钱全压在两箱没人要的XL码里。Mike"

先接他前半句:你的到门价9.9加元,他卖30,正好3倍——落在零售2-4倍加价的标准区间里。北美零售有个老行话叫**keystone定价**:进价翻倍挂牌,毛利率50%,是实体零售的传统底线;帽子这类小件配饰,常规做到2.5-4倍。为什么"底线"就要翻倍起?把一家零售店的毛利率拆开你就服了:以7.1.1那顶$13进、$29.99卖的帽子为例,毛利率57%,听着肥,往下扣——房租摊掉营收的15-20个点,店员工资10-15个点,刷卡手续费和损耗2-3个点;最狠的一刀是 Mike 邮件后半句说的那个东西:**滞销**。零售业用**售罄率(sell-through)**衡量它:一批货按原价卖出去的比例。带你算一批:100顶按$29.99上架,原价卖掉70顶、季末五折清20顶、最后10顶按清仓价甩——实际收入约$2,450,只有理论营收的八成出头;那"消失的两成",分摊到每一顶卖出去的帽子上,又是十来个点的成本。四刀扣完,一家经营正常的帽子零售店,净利率剩个位数——**2-4倍加价养的不是老板的口袋,是房租、人力和卖不掉的那三成货。**批发商的账同理,只是把"房租+滞销"换成"仓库+压款":他一次吃进几千上万顶,给下游零售店铺账期,赚的那一倍多加价里,一大块是资金和库存的利息。

再讲这个词:**DTC(direct-to-consumer,直面消费者)**——品牌不经过批发零售,自己开网店直接卖给消费者。听起来是把中间两手的钱全省下来了,对吧?新手都这么想,直到认识另一个词:**获客成本(CAC)**,平均烧多少广告费才换来一个下单的客户。DTC的账长这样:$29.99的帽子,货的到岸成本$5,投放广告换一个订单常见要$10-14,发到消费者手里的尾程运费加包装$6-8,支付手续费、退换货摊销再去$3——**剩下的和实体零售的净利,惊人地接近**。传统零售把15-20个点交给房东,DTC把30个点以上交给广告平台——**广告费就是新房租**,而且这个房东天天涨价。亚马逊路线也一样,只是房东换成平台佣金和FBA费用,那笔账22.1.2会一分一分算给你看。一句话立住本节的判断:**流量不是免费的,谁离消费者近,谁就在给流量付费;2-4倍加价是这笔费用的对价,不是暴利的证据。**

那 Mike 为什么是例外?看他的结构:酒厂的吧台就是现成的货架——房租早被卖酒摊掉了,来买帽子的人本来就是进店喝酒的常客——**获客成本是零**。9.9进、30卖,他这一手是整条链上最肥的,肥得干干净净。这里藏着一个对你未来获客极其重要的洞察(第五部会反复用到):**自带线下流量的小商家——酒厂、咖啡馆、健身房、球队——是定制帽生意里双赢最大的客户**,因为你帮他把"最肥的一手"装进了他自己的口袋;他赚得越明白,翻单越痛快。至于他那两箱XL的教训,替他记着:做帽子比做T恤幸运,均码调节扣(见2.4)天然免掉了码数滞销——这句话,下次给服装类客户提案时值一分信任。

本节动作:把"帮客户算他那一手"做成你方案的固定页。给任何终端客户报价时,附一行字,套用今天这个模板:"按您零售__元计,单顶毛利__元、毛利率__%,售出__顶即覆盖整批采购成本。"(对 Mike:卖30,每顶毛利20出头,卖165顶就回本500顶的全部货款。)你不再是报一个成本,而是递给他一门生意——这一页纸的说服力,超过降价一加元。

## 7.3 三个利润档位

### 7.3.1 走量代工:赚加工费的数学与天花板

回酒店的路上你经过镇子北头,那家全镇最大的帽厂灯火通明——十几条线在赶夜班。白天听厂区的人说起过它:给两个美国大牌做代工,一年出货五百万顶。你顺嘴问了句"那得赚多少",对方笑笑:"算下来,未必比镇上做跨境电商的两口子多。"当时你以为是酸话,现在你会算了——这一节,把三个利润档位的第一档拆给你:**走量代工**,也就是行业地图里的OEM模式(定义与三模式对比见5.3.1),按客户的设计和订单生产,赚加工费。

它的数学冷得像一台计价器:**年利润=产能×开机率×单顶净利**,三个变量,一个都不浪漫。拿你熟悉的这家八条线中型厂代入:产能一年约二百二十万顶;开机率按吃得比较饱算九成;单顶净利含退税¥0.8-1.5——乘出来,一年一百六到三百万。这就是答案的全部,而且三个变量各有各的硬:单顶净利被7.2.1拆过,5-15个点的毛利扣完费用就剩这几毛一块,提升空间以"分"计;开机率靠淡季接微利单硬填;于是**想多赚,只剩"产能"一个变量可动**——天花板就露出来了:加产能=盖厂房、上设备、招几百工人,几百万资本开支砸下去,新增的线必须立刻有大单来填,否则开机率崩、全盘账崩;而填得满八条、十六条线的单,只能来自大客户,大客户的采购逻辑(见5.5.1)是每年招标、逐年压点——五百万顶那家厂,行里传闻它给核心客户的点数八年间从12个被谈到6个。**产能翻倍,议价权减半,这是走量代工的宿命循环:规模是它的护城河,也是它的人质。**规模化代工能不能破这个局、天花板之上还有什么,尾声"代工天花板的数学"会给出全书最后的答案,这里按下。

那这档钱谁该赚?看门槛就知道:它筛掉的恰恰是"新人"两个字——你没有产能,没有压给设备的资本,更没有喂饱一条线的订单来源。0.2的画像一(家里有厂的)是唯一的例外:厂已经在了,固定成本已经沉了,你要做的不是进入这一档,而是**站在这一档的肩膀上往外长**——把家里的产能当成你的底价和交期优势,自己去做海外前端赚贸易和服务的钱,这条"你管嘴和手、工厂管货"的路线,27.1整节铺开。而对画像二、画像三,这一档的正确用法是**看懂它、利用它,不进入它**:看懂工厂靠量活着,你才明白淡季议价、翻单让利这些机会窗口在哪(见24.1.2);看懂单顶净利以毛计,你才不会提出"再砍两块钱"这种等于让对方亏本的要求。

一段对话,把这一档的体感钉死。饭馆那位老外贸提过他早年的东家——一家做到过千万顶的大厂老板的原话:"我这厂子,说白了是给银行和工人打工:设备贷款一年利息七十万,工资一个月发出去两百多万,年底剩给自己的,好年景三四百万,差年景倒贴。隔壁我小舅子,俩人一间办公室做定制单,一年挣得不比我少,气人不气人?"——这段牢骚里没有一个字是假的,它就是**量的档位**的完整画像:营收巨大、现金流巨大、责任巨大,利润率纤细如发。你听懂它,就不会再迷信"有厂才是做实业""量大才是生意"。

本节动作:给自己立一条档位判断规则,写进笔记本:**如果一门生意的赚钱公式里,"量"是唯一能动的变量,它就是代工档——没有产能和资本的人不要进,已经在里面的人(画像一)要往链条两端长。**下一节,看你现在正站着的那一档。

### 7.3.2 定制服务:赚服务费与信息差,新人的主战场

现在,把你自己填进表里。台灯下,你在笔记本上画出这一单的完整分账——R&B,500顶,你报给 Mike 的价:9.9加元/顶,含绣花、含头程物流、含税到门(报价时 Mike 的预算是12以内,你留足了竞争力也留足了自己):

| 项目 | 金额(¥) | 折每顶(¥) |
|---|---|---|
| 收入:500顶×9.9加元=4,950加元 | 25,740 | 51.5 |
| 工厂货款(出厂价¥17.5) | 8,750 | 17.5 |
| 绣花制版费(首单,见3.1.5) | 200 | 0.4 |
| 打样与两轮国际寄样快递 | 700 | 1.4 |
| 成品轻酵素洗(洗水厂外发,见3.3.3) | 500 | 1.0 |
| 海派专线,双清包税到门(关税税费打包在运价内,见17.4) | 1,400 | 2.8 |
| 收款与换汇手续费(约1.5%) | 400 | 0.8 |
| **成本合计** | **11,950** | **23.9** |
| **毛利** | **13,790** | **27.6** |

毛利率约54%。你盯着这个数看了很久——它高得让你不安:第0章明明说,规规矩矩做贸易,这种单毛利常常就一两千块;7.2.2的贸易商也就10-20个点。凭什么你有54?**把两种卖法并排放,答案自己会站出来。**卖法一,纯贸易:你把这500顶按FOB价$2.45加15个点卖给一家加拿大促销品经销商(这类买家见5.5.2),毛利约一千九人民币——正是第0章那句话的口径,你赚的是贸易商那一手。卖法二,就是你现在做的:客户是终端的 Mike,贸易商、进口商、本地经销商这三手中间全没有——**链条被你压短了,被省掉的每一手的加价,合并成了你的54%**。这就是**定制服务**这一档的本质:面向终端客户,把"贸易+进口+分销"几手的活一个人干完,把几手的钱一个人收走。

但54%不是白给的,把你实际干的活列出来,你就知道这笔钱的名目——它分两半。一半叫**服务费**:你把"摸起来厚实、戴旧了好看"翻译成了21支磨毛斜纹240克(第1章整章就是这笔钱的来历);你盯了打样、验了克重、确认了色样;你把工厂、绣花外发厂、货代整合成 Mike 眼里的"一个供应商";出任何问题,Mike 只找你——翻译、整合、担责,7.2.2里贸易商赖以生存的三样,你一样没少干。另一半叫**信息差**:Mike 不知道¥17.5的出厂价,也不需要知道;他知道的是本地礼品公司同规格报价14加元起、交期还比你长——**你的9.9对他是实惠,对你是厚利,信息差的钱赚得堂堂正正,前提是货真价实。**再把丑话的另一面说全:这54%是毛利率,不是你的时薪。往下扣:两趟中国的机票住宿几千块;从市集到交货近四个月的时间;还没走完的路上仍埋着风险(这一单后面真出了几次事,第26章的损益表会把"预算与实际"摆在一起对账)。第一单折算下来,你赚的是**一份认真工作的钱,不是一夜暴富的钱**——但请注意方向:这份钱,量级上已经是纯贸易卖法的七倍。

这一档为什么是**新人的主战场**?拿三档位的门槛互相一照就明白:走量代工要产能和资本,你没有;自主品牌要库存资金和流量能力(下一节算给你看它多烧钱),你也没有;而定制服务的门槛清单是——懂行话、会流程、肯服务、找得到终端客户。前三样,这本书正在一章一章帮你装进口袋;第四样是真门槛:**你的天花板不在利润率,在客户数。**算一笔封顶账:一人操盘,一年认真服务二十个 Mike 量级的客户(首单加翻单三十来单),单均毛利万元上下,年毛利二三十万——想再往上,要么把获客做成系统(整个第五部讲的就是它),要么把流程做成产品让单均耗时下降(见22.4.2),要么升档去背品牌的风险。而此刻最该看清的是:**这一单里最难复制的不是任何环节,是"你在市集上遇到了 Mike"**——运气给了你第一个客户,第五部教你把运气换成管道。

本节动作:把你为这单干过的所有活,按"翻译/整合/担责"三栏列成清单存档。它有两个用途:其一,下次终端客户问"你比工厂网店贵三成,凭什么",你不用辩解,把清单递过去——工厂卖他的是一顶帽子,你卖他的是这顶帽子按时、绣对、完好地出现在他门口;其二,这张清单就是你的报价底气——**服务费的定价权,来自你能说清自己提供了什么服务。**

### 7.3.3 自主品牌:赚溢价,也背库存与营销风险

睡前刷朋友圈,你看到一位同行发的九宫格:自建的小仓库,货架上码着整整齐齐的帽盒,配文"XX品牌首批到仓,3000顶,梦想开箱"。评论区一片恭喜。你顺手点进他的主页往前翻了翻——八个月过去,最近一条动态是:"清仓,全场2.9折,兄弟们帮帮忙。"

这就是第三档:**自主品牌**——自己设计、自己下单、贴自己的商标、直接卖给消费者,赚7.1.1那张表里加价最凶的一手:品牌溢价。先把溢价说公道:它是真的。一顶到岸成本$4的帽子,贴上有认知度的牌子卖$29.99,毛利率纸面80%以上;消费者付的不是布和线的钱,是设计、审美、身份认同——第5章你见过把配件都做成品牌的Yupoong(见5.4.1),溢价是这个行业里唯一能突破"点数"逻辑的钱。但注意语序:**是"品牌"产生溢价,不是"贴牌"产生溢价。**你注册一个商标印上去,市场不欠你一分钱认知——没有认知的"品牌",本质上是在做零售,而且是没有流量的零售。品牌这扇窄门有多窄、值不值得挤,尾声会郑重地谈;这一节先把新人最容易踩碎的两块地板踩给你看。

第一块地板:**库存**。品牌要有款式和颜色的矩阵才像个品牌,而工厂的起订量(见1.5.2的逻辑,成帽同理)决定你每个款色都要吃进几百顶——朋友圈那位同行的账你现在会算了:3款×2色×每色500顶=3000顶,到岸成本按$4.2算,**¥9万现金变成货,趴在货架上**。然后残酷的统计规律登场:多款并推,几乎必然有爆有死。他后来在群里复盘过:A款月销三百多顶撑住了,B款月销四十,C款月销十几;八个月下来,A款赚的钱,约等于B、C两款降价清仓亏掉的钱加上仓储费——**忙一年,账面打平,现金还少了两万,货架上还剩六百顶"资产"。**这就是库存的真面目:它不只是压钱,它是把你"猜错款"的每一次错误都变成真金白银的亏损;而选款,恰恰是新人最没有数据支撑的环节——这也是为什么27.3给画像三的路线叫"先C后B":先用零售现货试出什么卖得动,再谈自己的款。

第二块地板:**营销**。7.2.3的公式在品牌档全额生效,而且更重:新品牌没有自然流量,每一单都要用广告买,获客成本$10-15起步;更要命的是广告是"竞价的房租"——你出价的对手是预算百倍于你的大牌。把两块地板叠起来,得到品牌档的现金流画像:**先付九万买库存,再按月付广告费买流量,收入按天滴灌回来,任何一环断掉,压着的都是你自己的钱。**对比一下你现在的定制服务档:Mike 的三成定金先到账,再付工厂三成定金——客户的钱盖住工厂的钱(这套现金流设计见14.5.1),你全程几乎不垫资。两档生意对现金的胃口,差着一个数量级。

那品牌档留给谁?三个条件,缺一别进:**已验证的款**(有零售数据证明它卖得动,不是"我觉得好看");**亏得起十二个月的钱**(库存+广告至少预算十来万,且做好它归零的心理建设);**流量能力**(会投放,或者有内容获客的手艺——第23章那条路,是小玩家唯一付得起的流量)。而对今晚的你,正确的姿势写一行就够:**用第二档养第三档**——先赚定制服务确定性的钱,攒客户、攒现金、攒对"什么款卖得动"的手感;哪天你的定制客户里有十个 Mike 都在替你验证同一种审美,品牌的第一款,才有了不靠猜的出生证。

本节动作:给品牌冲动上一道闸,把三个条件抄成检查清单钉在笔记本里——已验证的款?亏得起十二个月的资金?自己的流量来源?**三问有一问答"没有",就把品牌计划锁回抽屉,回去多接两个定制单。**冲动最贵的形态,就是3000顶带着自己logo的库存。

## 7.4 定位练习:三个问题决定你赚哪段钱

笔记本翻到最后一页,今晚的地图差一个坐标:你。链条拆完了(7.1),每一手的真实毛利见过了(7.2),三个档位的门槛和天花板也都亮过底牌了(7.3)——现在轮到把"你"放到图上去。别小看这一步:**这个行业里大多数第一年就阵亡的人,死因不是不勤奋,是站错了格子**——没厂没钱的人冲去铺库存做品牌,手握产能的人守着6个点的代工单眼看利润被逐年砍薄。定位不对,越努力亏得越快。三个问题,一支笔,现在就答。

**第一问,资源:你身后有没有一间"自己人"的工厂?**这是三问里最硬的一问,答案没法努力出来。所谓"自己人",标准很具体:能给你接近底价的报价、旺季肯为你插单排期(见4.7.3)、小单不嫌弃、出了问题一起扛——通常只有直系亲友的厂或你自己干过多年的老东家做得到。答"有",你就是0.2的画像一:代工档的成本优势天生长在你身上,你的正解不是留在厂里,而是做那个往外长的前端——用家里的产能做底牌,去赚定制服务和贸易的钱,路线图在27.1,同时提前读一遍28章那个亲友反目的案例,把分利和责任在第一单之前写成白纸黑字。答"没有",也干脆——代工档从你的地图上划掉,连"以后攒钱开厂"的念头一起划掉:那是一条资本和产能的赛道,不是手艺和勤奋的赛道(7.3.1的数学你今晚刚算过)。

**第二问,资金:你亏得起多少钱?**注意问的不是"你有多少钱",是"这笔钱亏光了,你的生活还转不转得动"。这个数直接圈定你离库存能有多近。亏得起十万以上、且能接受它压上一年——品牌档的门槛你摸得到,但7.3.3的三条件还要另外过;亏得起两三万——你可以做带小库存的电商现货(画像三的起手式,27.3有完整的现金流推演);只亏得起几千块——恭喜你,答案反而最清晰:**定制服务档几乎不需要你垫钱**,客户定金盖工厂定金(见14.5.1),你的启动成本是样品、色卡、机票和时间。钱少不是劣势,钱少却硬要站到吃库存的格子上才是。第9章之后你会反复看到:这个行业对轻资产的人出奇地友好,前提是你别去背不属于你的重。

**第三问,性格:你更享受跟人磨,还是跟货和数据磨?**这一问最容易被跳过,但它决定你能不能在一个档位里待满三年。定制服务档的日常是:时差里回邮件、翻译客户说不清的需求、在工厂和客户之间和稀泥、被放鸽子后笑着催款——**它本质是个乙方服务业**,享受搞定人的成就感的人如鱼得水,视沟通为消耗的人度日如年。电商品牌档的日常是:看数据、调listing、优化投放、研究评论区——对着屏幕跟转化率较劲,不用求任何人,也没有任何人可求。两种苦味完全不同,没有高下,只有合不合。画像二的老外贸底子适合前者,画像三的电商手感适合后者;都不沾的,从定制服务练起——**沟通是可以练的,性格里对"跟人打交道"的耐受度,练不出来,只能诚实面对。**

三问答完,把结果压成一句话,模板给你:"我有/没有工厂资源,亏得起__万,更享受跟人/跟数据磨——所以我站**__档**,赚**__**的钱,十二个月目标是__。"这句话就是你的定位声明,它不是终身判决——第27章会给三条路径各画一张12个月的路线图,做完第一年你有权重答;但在那之前,**一次只站一个格子**:这个行业淹死的人,多数是三个档位都想赚、每个都只伸了半只脚的人。

你在自己的笔记本上写下你的那句:"没有工厂,亏得起的钱不多,但我不怕跟人磨——定制服务档,赚服务费和信息差的钱,十二个月内,把 Mike 这样的客户做到二十个。"写完合上笔记本,窗外镇子北头那家大厂的灯还亮着——那是别人的格子,挺好,但不是你的。明天车缝线全面开动,后天开始你要在车间里泡上几天——地图看完了,该回到地面,去认识那些真正把帽子做出来的人。

## 本章工具

**工具一:价值链加价表(模板+本章两个实例)**

分析任何产品"谁赚走了什么"的固定表格。栏目:环节 → 拿货价 → 卖出价 → 加价幅度 → 该手承担的成本与风险。使用铁律:①每一手的加价≠利润,先填"承担什么"再下判断;②看到诱人价差,先数它横跨几手,再问自己顶替得了哪一手(见7.1.1)。

通用帽实例(¥15出厂→$29.99零售,约14倍):工厂 +8个点(设备工资垫资)→ 贸易商 +15个点(跟单担责收汇)→ 进口/品牌 约4倍(海运关税、库存、营销)→ 零售 约2.3倍(房租人力滞销)。

R&B 单实例(你压短了链条):工厂出厂¥17.5 → 你到门交付合¥23.9/顶成本 → 售 Mike 9.9加元(¥51.5),毛利率约54%(顶替了贸易+进口+分销三手,见7.3.2)→ Mike 吧台零售30加元,约3倍(自带流量,获客成本为零,见7.2.3)。

| | 走量代工 | 定制服务 | 自主品牌 |

# 第8章 工厂里的组织与人

**主线推进** —— 车缝线全面吃上你的单,已经两天了。你把镇上快捷酒店的房间又续了一周,每天早上八点跟着打卡的人流走进厂门,晚上带着一身线头味回去。第三天早上你忽然发现,自己看这家厂的方式变了:一个多月前来看厂时,你看见的是设备和车间;这几天天天泡在里面,你看见的是人——白板前拿着保温杯的厂长老崔,外贸办公室里嗓门最大的业务员老纪,七点五十就站在线头数半成品的跟单员小周,还有财务室里那位不怎么说话、但所有人提到"打款"两个字都会下意识看一眼的老板娘。你的五百顶帽子此刻正躺在三线和四线的流水线上,但真正决定它们哪天上线、谁来缝、缝坏了算谁的,不是机器,是这些人,和他们之间那张看不见的网。距PI上写的出货日还有五天,你决定用驻厂的这几天,把这张网彻底看清楚:谁能帮你,谁会卡你,出了事该找谁。这一章,认人。

## 8.1 双主体结构:帽厂+外贸公司两块牌子

### 8.1.1 三个原因:退税载体/风险隔离/接单灵活

驻厂第一天早上,你在办公楼门口停了一下:大门右侧上下挂着两块牌子,上面一块"胶州××制帽有限公司",下面一块"青岛××进出口有限公司",漆色都有点旧了。你拍了张照发给学会计的朋友:"一家厂怎么两个名字?"朋友回:"不是一家厂,是两家公司。"你拿着这句话去问小周,小周头也没抬:"全镇的厂差不多都这样,一个管做,一个管卖。"——这就是**双主体结构**:同一个老板名下注册两个法人,一个是生产型企业(工厂),名下是厂房、设备、工人;一个是外贸公司(贸易主体),名下是客户、合同、资金流。两块牌子挂在同一栋楼上,法律上却是互相独立的两家公司。为什么要费这个事?三个原因,一个比一个实在。

第一个原因,**退税的载体**。帽子出口能退约13%的增值税(完整原理与流程见18.3),但"怎么退"跟主体类型强相关。生产企业自己出口,走的是"免抵退"——要跟进项抵扣、征退税率差搅在一起算,账目绕,退多少受工厂整体进项结构的牵制;外贸公司出口走的是"免退"——从工厂把货买过来,拿到13%的增值税发票,出口之后凭这张票按采购金额退,一张票对一笔退税,干净利落。于是标准动作是:工厂把货"卖"给自家外贸公司、开票,外贸公司报关出口、收汇、退税。拿你的单代入:500顶、出厂价¥17.5,货值8,750元,工厂账面毛利大约每顶1.9元、十一个点上下(BOM拆解在第7章算过,见7.2.1),而退税带来的现金回流有每顶0.8-1.2元——接近毛利的一半量级。第7章那句"工厂靠量、翻单和退税活着",落到组织结构上,就是门口这第二块牌子。

第二个原因,**风险隔离**。工厂是重资产:厂房、设备、一百六七十号工人,外加工伤、社保、环保这些跑不掉的责任;外贸公司是轻资产:几张桌子、几台电脑、一摞合同。把对外签约的主体放在轻资产这头,客户索赔、收汇坏账、贸易纠纷打官司,最坏的结果是贸易公司赔穿,厂房设备纹丝不动;反过来,工厂端出了工伤事故或环保处罚,也不污染贸易主体的信用记录和收汇资质。这不是什么灰色操作,全世界的集团公司都这么切分,只是帽子厂把它做成了夫妻店的尺寸。

第三个原因,**接单灵活**。外贸公司并不"必须"只卖自家工厂的货:旺季产能吃不下,把单外发给同行工厂做(产业带里互相补产能的老熟人网络,见6.1.2);客户要帽子配围巾、配袜子,自己不做的品类直接外采拼进同一票货——对客户,它是"什么都能搞定"的供应商;对工厂,它是一台不挑食的接单机器。这也带出一件你必须知道的事:**你把单下给这家"工厂",货不一定百分之百出自这家工厂**——第6章选厂八问里那句"会不会转厂",问的就是这个,识别与防范第12章细讲。

动作,两个。第一,任何新供应商,合作前花十分钟把两个主体都查一遍(企查查一类工具):成立年份、注册资本与实缴、涉诉记录——工厂成立十几年、贸易公司成立三五年,正常;两个主体都查不到什么实底,快跑。第二,开口问一句:"我的合同和货款走哪个主体?"——这句话问出去,下一节的坑就已经躲掉一半了。

### 8.1.2 合同和钱跟哪个主体签

其实这道题你在一个多月前就交过答卷。翻出手机里那份PI:抬头是"青岛××进出口有限公司",落款盖的是同名的合同章;三成定金,打的是这家公司的对公账户,账户名与合同抬头一字不差。当时你多半是凭直觉照办的,现在把道理补齐:**合同抬头、收款账户名、发票开具方,三者必须是同一个名字**。合同跟A签、钱打给B、票由C开,任何一处错位,你的证据链就断一截——真到扯皮那天,对方一句"我们公司没收过你的钱",你连转账记录都对不上号。

为什么必须咬得这么死?因为买卖关系在法律上是靠两条线互相印证的:一条是纸(合同、PI、订单确认),一条是钱(对公流水)。两条线指向同一个主体,你和它之间的权利义务才立得住;钱一旦流进个人账户,那笔钱在性质上就成了"个人往来款",跟桌上那份盖着公章的合同,谁也证明不了谁。

这就说到那个几乎每个新人都会遇到的诱惑——**"私账优惠"**。询价那阵子,曾有一家的业务员在微信上补过一句:"打我们老板个人卡,还能再便宜两个点,不用开票。"两个点,按你8,750元的货款算是175块。这175块买走了什么,拆开看:其一,对公流水没了,你们的买卖关系在法律上接近裸奔;其二,发票没了——没有票,这批货在税务意义上"不存在",工厂省下的是税,你丢掉的是凭证,将来你自己走正规出口、要办退税(第18章),没有进项发票寸步难行;其三,对方的约束没了——公司账户收钱,公司要对合同负责,个人卡收钱,理论上那只是"某个人"跟你的私交。175块,买断三层保护,这买卖不能做。还有一个更隐蔽的变体:合同抬头是公司,打款时"财务说对公账户在走年审,先打这张卡应急"——一样,停下来。正常经营的公司,极少出现收不了对公转账的时刻。判断规则一句话:**打款账户名与合同抬头不一致,无论理由编得多圆,一律当红灯处理**。

事故给你一个具体版本。一位做促销单的同行,三万块货款按业务员给的账号打了"老板娘的卡",货期一拖再拖,追问之下才发现那位业务员早已离职,卡是他亲戚的——工厂承认有这张订单,但只认对公收到的五千定金,私卡那两万五"与公司无关"。报警、扯皮小半年,追回一半。这种局的病根不在骗术多高明,在于付款那一刻,他亲手拆掉了自己所有的防线。

这条纪律还有一个镜像:将来你有了自己的主体(第25章),给客户的PI抬头、收款账户、发票,同样三位一体——Mike之所以敢把几千加元的定金打过太平洋,凭的也是这条。动作:每次付款前做三核对——①合同/PI抬头与公章一致;②收款账户名与抬头逐字核对,公司名差一个字都不行;③转账备注写上订单号和款项性质("R&B订单 定金30%")。再加一个习惯:打款后让对方回一张盖章的收款确认,这张纸在第14章讲尾款博弈时会派上大用场。

## 8.2 接单端

### 8.2.1 业务员与外贸经理:报价权、提成逻辑与你的对接面

外贸办公室在办公楼二层,五张办公桌,一面小白板写满客户简称和船期。你进门时,业务员老纪正在打电话,嗓门大得半层楼都听得见:"……这个款打完样才能给你准数,我先按九千针估——对,估的,上下差不了一毛钱。"挂了电话,他冲你摆摆手让你坐。你和老纪不是初见:一个多月前三家询价,这家就是他接的,PI也是跟他签的(那几轮往返,第9章细说);但直到驻厂这几天,你才第一次看清他这份工作是怎么运转的。

先摆结构。业务员是工厂的"嘴":守平台、跑展会、接询盘、谈价签单;**外贸经理**是业务员们的上限——统管业务口、握着定价权,通常自己手里还攥着两三个最大的客户。这个**报价权的分层**,是你要摸清的第一件事:常规款、常规量,老纪手里有一张内部成本底表,上下3%以内他当场就能拍;新款、低于底线的价、付款方式特殊的单,必须报经理批。所以跟业务员谈价,你要分得清哪句他能定、哪句要"问一下"——"我请示下经理"不总是托辞,多数时候是真流程。

顺手揭一个你惦记了很久的谜:当初你的报价单为什么等了两天?现在答案齐了——老纪拿到你的规格,要把面料拆给采购问行情、工缴拿给生产口估工时、绣花发给绣花厂估针数,回来自己拼成本表,再送经理审毛利:一张认真报的价,要在组织里走四个岗位。反过来,秒回的报价单才要警惕:那是拍脑袋的区间价,后面自会用"料涨了"找补回来。

再看钱怎么分,这决定了老纪的一切行为。业务员收入=底薪+提成:底薪四五千,大头在提成——中型厂常见按订单金额提0.8-1.5个点,也有按毛利分10-20%的。把这个结构装进脑子,行为就全可预测:他偏爱翻单的老客户(不费力气的提成)、烦改来改去的小单、对交期什么都敢应(应下是业绩,做不做得出是生产的事,见8.5.2)。你的500顶货值8,750元,按一个点提87块5——他接你这单,图的显然不是这一单。有天加班,老纪自己把话挑明了:"你这单我是当种子接的。加拿大精酿这种客户,第一年五百顶,做得好第二年就是三个款两千顶。做不起来,我这八十几块提成够干嘛的?"这句是真话,而且是对你最有用的一句真话:**你在这家厂的议价筹码,从来不是这一单的量,而是"下一单"的可能性**——把翻单预期经营好,比磨着砍价有用十倍(第24章会把它变成方法)。

提成结构还有一个反面:**地盘意识**。客户就是业务员的钱袋子,你若将来跟工厂深度合作,谁的客户归谁必须提前划清——这件事放到8.7.2跟"地盘"一起讲。本节动作,三条:①跟业务员谈价,规格一次给全(材质三件套、工艺、数量、目标价),他一趟就能问完四个岗位,报价周期从两天缩到一天;②催报价别问"好了没",要问"卡在哪个环节"——他会告诉你是采购没回价还是经理没签字,真假一听便知;③记住他的提成在出货后才结——从签单到出货,他和你的利益完全一致,这段蜜月期,有事尽管使唤他。

### 8.2.2 跟单员:你订单的真正管家,怎么处成半个自己人

早上七点五十,车缝车间的灯刚亮齐,小周已经站在三线线头,夹板上按着一页进度表,在数昨天下线的半成品。你跟着走了一个上午,才知道这份工作有多满:八点巡完三条在产线,把每张单的实际进度记上;八点半回办公室敲表格,回了七条客户微信、两封邮件,其中一封在替美国客户改箱唛;十点给绣花厂打电话催另一张单的外发件;十点半陪QC复核一批要出货的抽检;十一点跟采购对三张单的辅料到货日;午饭在工位上吃,吃到一半接起货代催订舱资料的电话。电脑边贴着一张便签,写着十三个订单号——**你的R&B,只是其中一个**。

正式给这个岗位下定义:**跟单员(merchandiser)**,订单签下之后的总协调人——开生产通知单(见4.1.1)、盯打样、催物料、跟进度、安排验货、订舱发货;客户改logo、加数量、赶交期,全靠跟单员在两头翻译和协调。跟单员一顶帽子都不生产,却决定你的帽子在每个环节等多久。注意这份权力的性质:排产定不了(那是厂长的白板,见8.3.1),但**"谁的事先被提起",跟单员定得了**——同样是催绣花厂,你的单是今早第一个电话,还是周五顺口一提;同样是发现车缝问题,是当场叫组长,还是攒到周会上说。这种排序上的软权力,日积月累,就是你交期里看不见的一星期。

从打样那阵子算起,你和小周打交道快一个月了:绣花厂的视频是小周发的,麦穗的近照是小周拍的,产前样的快递单号是小周夜里补发给你的。这一个月你其实一直在无意中做对一些事,现在把它总结成方法——怎么把跟单员处成半个自己人,四条,没有一条需要花钱。

第一条,**省事**。跟单员最怕的不是要求多的客户,是含糊和消失的客户。规格一次给全;改动必落文字——微信里说完,补一句"总结:第X条改为……,请确认";对方问什么,两小时内必有回音。你回得快,小周才敢替你去催别人——每一次催促,都是拿自己的脸面垫的。小周自己说过一句掏心话:"最怕的不是事多的客户,是失踪的客户——问个尺寸三天不回,一回来就问怎么还没做好。"

第二条,**给体面**。出货顺了,把表扬送到能决定小周年终的人耳朵里:给老纪或老板正式说一句"这单小周盯得特别细"。跟单员月薪五千到八千,基本没有提成,在这份工作里能攒下的,除了工资就是口碑——而你,是少数能给口碑的人。

第三条,**不越过**。你驻厂看到的任何问题,先告诉小周,让组织内的流程去转,而不是直接捅给老崔或老板。越级一次,以后你听到的就全是官方口径。

第四条,**对等交换信息**。跟单员做计划需要你这头的信息:验货定哪天、尾款几号付、翻单有没有谱——你主动给,对方也会把厂里的实情漏给你。小周前两天就漏过一句:"下周有个大单要上线,你的验货最好赶在周三前。"这种一句话,值钱。

动作:给小周做一页"订单单页"发过去——订单号、规格要点、五个关键日期(料齐/绣花回厂/上线/终检/出货)、你的联系时段和"两小时内必回"的承诺。这页纸翻译过来就是六个字:这个客户,省心。在十三个订单号里,省心的那一个,永远排在前面。

### 8.2.3 单证员:钱与单据的通道,出错最伤的岗位

外贸办公室最里面靠窗的位子,是全屋唯一安静的角落。单证员桌上立着三层文件盘,分别贴着"待做""待审""已放行";说话轻,打字快,你驻厂三天,听到过的最长一句话是:"箱数再跟仓库核一遍,装箱单我先不打印。"

**单证员**,专职做外贸单据的岗位:商业发票(CI)、装箱单(PL)、报关资料、产地证,对接货代和报关行——每张单据长什么样、在哪个环节给谁看,第16章逐张讲。小厂不设专职,由跟单员兼任;这家厂养了一位,是老板吃过亏之后的决定,亏在哪,下面的事故里说。你先记住这个岗位的特殊性:**全厂唯一一个"生产上的错多半能救、自己的错常常没得救"的岗位**。车缝缝歪了可以返工,绣花绣坏了可以补片;单据错了,货已经在海上、在海关、在对方银行柜台上——错误发生的地方,你的手够不着。

单证员的核心纪律叫**单证一致**:品名、数量、箱数、毛净重、唛头,在发票、装箱单、报关单、提单和箱子上的箱唛之间,必须逐项咬合(完整机制见第16章,它同时是信用证的生死线,见14.3.2)。要害在于:哪怕每个数字单独看都"对",互相对不上就是错。举个最常见的:工厂习惯多做2%备品,仓库按实装了510顶,单据按PI写500——目的港海关抽箱一数,510对500,数目不符,轻则开箱彻查、仓租照天算,重则按瞒报处理。

事故是本地流传的一个真实版本:某厂出美国的一票货,单证员把两个客户的装箱单贴串了——A客户的柜子里躺着B客户的PL,数量箱数全对不上,目的港清关卡了九天,仓租滞箱费一千多美元,客户再索赔延误损失。厂里复盘,错误只有一秒钟:两张刚打印的单据在出纸口叠在了一起。从那以后,这家厂立了规矩:所有单据打印后由第二人复核签字——你现在看到的那个"待审"文件盘,就是那次事故留下的疤。

给两个量级,把"出错最伤"落到数上。单据本身不值钱:改一票提单几十到一百美元,改一票报关单几百块人民币;贵的是时间——单证错误引发的清关延误动辄三五天,赶上船期就是一周,而你这单海派专线28-32天的时效设计里,根本没有给这一周留位置。还有更疼的一头:报关单上的品名、金额若与增值税发票对不上,工厂的退税(见8.1.1)直接卡壳——单证员一个笔误,能同时伤到你和老板。这也是为什么这个月薪四五千的安静岗位,在老板心里的分量远超工资条:管的是钱与单据的通道,通道堵了,两头一起淹。

动作:出货前,把"你版本的五个数"主动发给小周转单证员核对——品名中英文、数量、箱数、毛净重、唛头内容,一条微信的事。别觉得多余:你是全链条上唯一同时见过PI、见过货、又要拿单据去收货收款的人,**你就是单证一致性的最后一道人肉校验**。这个动作到第16章会扩成完整的核单清单,习惯先养上。
## 8.3 生产端

### 8.3.1 厂长与班组长:排产权在谁手里

生产办公室夹在两个车间之间,一面墙全是白板,画成八行乘日期的格子——八条车缝线,每个格子里写着客户简称和数量:"HD 3000""R&B 500""佳美 1200"……你的订单第一次出现在一家工厂的白板上,占着三线和四线的格子,横跨六天。老崔就站在白板前,五十多岁,手里一个磨掉漆的保温杯,说话慢,但每句都往地上砸:"四线明天上午把佳美收尾,下午换款上R&B。换款那两个钟头算厂里的,别扣组里产量。"

那面白板叫**排产表**——哪张单、上哪条线、占哪几天,全厂的生产秩序都写在上面;而**排产权在厂长手里**:老纪们在楼上对客户应承交期,能不能兑现,全看老崔往哪个格子里落笔。厂长以下是**班组长**:每条车缝线一个,管十几个车位工的分工、领料、交数和工资表——你的帽子具体缝得好不好,一半取决于组长把关键工序(合帽身、上帽檐)派给谁。老崔那句"四线组长做过美单精做款",就是在把你的单往熟手堆里放。

白板上还藏着一道值得算的题:一条线日产800-1200顶(见4.4.2的量级),你的500顶按纸面产能半天多就该缝完,凭什么排了六天?三个原因。其一,线不是为你清空的——你的单是"塞"进两条线的空当里,和别的单交错着跑(并行与串行的逻辑,见4.1.2);其二,换款有损耗——上一个款下线、你的款上线,调机器、换线色、分工序、试缝头几顶,两条线各吃掉两三个小时(见4.4.2);其三,你的款不是快款——金属滑扣、前中缝劈缝烫平、六片跨缝绣的前幅对位,工序表比促销款长一截。**小单的交期,从来不是"产能除以数量"算出来的,是"空当加换款"拼出来的**——这也是第6章说小单要找中型厂的原因之一:大厂的白板上,根本不会有你的格子。

驻厂第二天,你亲眼看见了一次"挪动":一个老客户的1200顶要赶船期,老崔把五线的一张单往后抹了两天,在边上补了行小字。被挪的不是你——但你后背发凉:凭什么不是你?答案并不浪漫:因为小周提前把你的料齐日和验货日钉在了表上,因为你人就站在车间里。**白板是软的,谁的日期"有主"、谁人在场,谁就不容易被抹掉**——这就是驻厂盯单最朴素的价值(挪单背后的完整规则,见8.5.2与4.7.3)。

跟厂长打交道,新手最常见的错误是把客气话当承诺。你问"我的单没问题吧",老崔答"没问题"——这三个字信息量为零。正确的问法是要三个具体答案:"**我的单在哪条线?组长是谁?料齐了没有?**"三个都答得具体,才是真排上了;有一个含糊,说明你的单还在白板外面飘着。动作:今天就把这三问用在你手里任何一张在产的订单上;顺手把组长的称呼记下来——明天路过四线,叫得出"X组长"和只会喊"师傅",你的货在这条线上的待遇不一样。

### 8.3.2 版房与绣花制版师:样品质量的源头(第10章伏笔)

版房在办公楼一层最里间:两台平车、一张裁样台、一个烫台,墙上两排钉子挂满样帽——每一顶,都是这家厂拿下某张订单时的敲门砖。版师是位戴老花镜的老师傅,你进去时,他正对着客户发来的一张照片剪纸样,剪几刀,往台上的半成品上比一比。你那顶让Mike隔着太平洋点了头的确认样,当初就是从这张台子上下来的;十来天前复核的产前样,走的也是这里。

**版房**这个词你在第6章见过(见6.3.1,广东厂的版房能力是产业带级的卖点),现在看看它的内部分工:版师(纸样师)负责把照片、规格表翻译成一套纸样——帽片的弧度、缝份的余量、帽檐的翘度,全落在几张硬纸板上;样品工负责用这套纸样做出样帽。**打样能力就是工厂的天花板**:好版师看照片能仿出九成像,差版师连自家老款改个帽深都走样。而样品的质量决定你后面一切的质量——大货是照着确认样做的,样错一分,五百顶一起错一分(样品体系与封样的合同意义,第10章整章展开;到那一章你会回看当初打样往返的十几天,那十几天里的每一分质量,源头都在这间屋子)。

版房之外,还有一位你在厂里见不到的关键人:**绣花制版师**(打带,见3.1.6)。这家厂绣花外发(见4.3.4),制版也跟着绣花厂走——你那份8800针的.dst文件,当初就出自绣花厂制版师之手,¥200,版权归你(见3.1.5的行规)。绣花好不好,一半在制版:针迹方向、拉力补偿、色序,都是键盘上敲出来的;而这位关键人隔着一层转手,你对绣花的任何意见传到那里,已经是第三手转述。这正是第3章教你自购版权、自己核针数(见3.1.9)的组织学理由:**隔着两层组织的技术岗位,必须用文件沟通,不能用话沟通**。

数字上认识一下这个部门的分量与脾气。版师月薪八千到一万五,是全厂工资最高的技术岗,比车工高出一倍;一套新款纸样半天到一天,一顶完整样帽从纸样到发快递,顺的时候三四天。但版房同时是全厂最典型的瓶颈部门:版师只有一位,而每一张潜在订单都要先过他——旺季打样排队一到两周是常态。你在裁样台边上看到夹着的一摞打样需求单,数了数,十一张,张张都排在别人前头。将来你要打新款,这一两周必须提前算进你对客户的承诺里(打样费与周期的行规,见10.4.1)。

版师跟你聊了十分钟,顺手给你上了一课:"照片打样,最怕客户说'跟这个一样'。一样到什么程度?帽檐翘三公分还是四公分?照片看不出来。上个月一个单,样打了三轮,客户才说要的是十年前那种平檐——早说一句话的事,我白做两顶。"翻译成你的语言:**打样需求单上每留一处空白,就是版房一轮白工、你一周时间**(需求单模板,第10章给)。

动作:驻厂期间去版房办一件正事——把你的封样登记借出来,对着大货线上随机抽的一顶,六个部位各比一遍:帽深、檐形、檐面线行数、汗带、织唛位、绣花位。样与大货的一致性,此刻你能亲眼验证;远程怎么验,第10章、第11章教。另外记一条给版房的基本礼貌:墙上的样帽只看不抓捏,想上手先问一句——那一墙挂着的,是人家吃饭的手艺。

### 8.3.3 机修与设备:停机一小时的连锁账

下午三点半,四线中段忽然静了一小块——一台电脑平车停了,车位工举手,组长看了一眼,朝车间门口喊了一嗓子。机修师傅拎着工具箱小跑过来,俯身听了听,拆开针板,镊子夹出一小团缠死的线,又换了个旋梭,前后十二分钟。机器重新哒哒响起来时,你注意到一个细节:停机那十二分钟里,这个工位前后的两个工人也慢慢停了——前面的做完没人接,后面的等着没活干。

中型厂的机修一两个人,管着全厂上百台设备:平车、双针车、锁边机、上檐机、定型机、裁床。这个岗位平时存在感极低,一停机就是全场焦点——因为**停机的成本从来不是一台机器的成本,是一条链的成本**。拆开看:车缝线是接力赛(流水线的平衡逻辑,见4.4.2),一个工位停,前面的半成品开始堆,后面的工位断粮;停十分钟,线内自己消化;停一小时,整条线的节奏就乱了。

把账算给你看。按一条线日产1000顶、十小时工作制算,线均每小时出100顶:瓶颈工位停一小时,当天就少100顶。工人是计件的(见4.4.3),停机的那一小时,车位工分文不挣——日挣二百四的熟手,停一小时少挣二十几块,哪个组的机器老出毛病,哪个组留不住人。再往大处算:定型机(见4.5.1)全厂只有两台,八条线的帽子最后都要从它肚子里过——它停一天,全厂当天的成品颗粒无收,这叫单点瓶颈;绣花机虽然在外发厂,账是同一笔:一台12头机日产约480片(见3.1.4),停一天,等于480顶帽子的前幅凭空消失。最后跟机修的工资对个账:月薪六千到九千,折每天三百块上下;而一次发生在出货前夜的两小时停机,若逼得你海运改空运去追时效,差价几千上万——**机修是全厂最便宜的保险**。

收工具的时候你递了瓶水,机修师傅指着那台车说了句行话:"这台是零几年的老车,轴磨了。今天换旋梭先顶着,大修得等周日停线。"这句话你要听出两层:第一层,周日之前,这台车随时可能再停;第二层,好工厂的停机是"计划内维修",差工厂的停机是"哪坏修哪"——你的单落在哪种厂里,风险差一个量级。这也是第12章验厂要看的点,先给你两个观察指标:①车间里长期披着防尘罩不动的机器超过三五台——要么产能虚标,要么设备成批老化;②问一句"易损件备在哪",能领你去看备件柜(旋梭、皮带、电机配件码得整整齐齐)的厂,设备管理及格;答"坏了再买,市里当天到"的,把它的交期承诺自动打个折。

动作:驻厂盯单,学会用耳朵。正常的车间是一片均匀的哒哒声,像下不完的雨;哪个角落频繁出现几分钟的安静、组长背着手往那边聚,就是有机器在闹脾气。你不用懂机器,只需要问小周一句:"那台车今天停了两回了,做的是谁的活?"——如果答案是你的活,傍晚进度表上那个被抹平的数字,你就知道该按几折去信。

## 8.4 支持端

### 8.4.1 采购:面辅料交期的第一张多米诺骨牌

采购的工位最好认:桌上摆满小盒子——各色滑扣、气眼、织带、汗带头,像个微缩五金铺;墙上贴着一张表,十几家供应商的名字和电话。你过去的时候,他正在电话里砍价:"……上次那批就这个价,你再涨,我找老三家去了啊。"挂了电话,他跟你说的第一句话是:"你那个古铜扣,当时可是我盯着电镀批次要的货。"

先把采购放进交期的地图里。你的交期三十多天,车缝只占六天,裁剪、绣花、后整加起来也不过两周——剩下的时间去哪了?一大块在备料(交期构成的完整拆法,见4.7.2)。而备料期完全在采购手里:**面辅料是交期的第一张多米诺骨牌**——采购晚下单一天,后面所有工序整体后移一天,而且这一天几乎不可见:车间停着有人看见,料没到只是"还没开始",没人心疼。行业里大量的"工厂延误",验尸报告上写的是"生产慢",真实死因是第一张骨牌倒晚了。

拿你自己的备料单复盘一遍。你的辅料清单里,大部分是"一小时配套圈"(见6.1.1)内的快件:沿条、汗带、檐芯、纸箱,本镇或邻镇,一两天到;织唛主标要定制,七到十天(千枚起订的行规,见2.3.4);最长的一根,是那批**古铜金属滑扣**(见2.4.2):套装¥1.2一套,500顶加损耗备品共下了520套——古铜色是电镀出来的,颜色跟着电镀批次走(批次坑2.4.2讲过),辅料商现货够,三五天到;现货不够要单独排电镀,十到十五天,比织唛还长。你这单的运气是人为的:定金一到账,采购发出的第一张订单就是这520套扣,四五天后到仓——**备料的正确姿势就是这个顺序:先下交期最长的件**。反过来想,如果这批扣被拖到面料齐了才顺手下单,你的车缝线就会在"上扣"那道工序前整体趴窝——万事俱备、只欠一颗扣,是帽厂最经典的停线姿势之一。

事故版本更疼一些。一位同行的两千顶帽子全部车缝完毕,就差主标织唛——织唛厂旺季排队,整批货在后整车间躺了四天等标,船期错过,改空运,运费差价八千多,一单的利润去了一半。事后追责,采购说"织唛一直是一周到的",织唛厂说"旺季我提前讲过要十天"——**两个"没错"的人中间,躺着一根倒了的骨牌**。

采购还有一层组织学,你要懂,但别碰:这个岗位手握供应商选择权,是回扣文化的高发地,也因此是老板重点盯防的对象——比价单、老板签字、定期换供应商,都是防它的制度。对你的意义只有一条:**永远不要试图私下给采购好处换"方便"**——你以为在交朋友,老板看到的是你在腐蚀他的内控,这家厂你就做到头了(人情的正确尺度,见8.7.2)。

动作:每张新单下达后,问跟单员一句固定的话:"**这单的面辅料里,哪一样交期最长?哪天下单、哪天到仓?**"把答案写进你自己的时间表,到期前三天没到仓就开始催。这一问的完整版,会出现在第4章章末的催单五问里(见4.7)——你先把最锋利的这一根用起来。

### 8.4.2 QC、仓库与财务:三道闸口各拦什么

下午,你跟着小周把厂里剩下的三个部门走了一圈:线尾小凳上的驻线QC,面辅料仓一排排铁货架,还有财务室——老板娘正对着两台显示器核账。走完,你在笔记本上画了三扇门,每扇门上写了一个字:货、物、钱。

这三扇门就是**三道闸口**——QC拦"货",仓库拦"物",财务拦"钱",各拦各的,谁都绕不过去。

第一道闸,QC,三到八个人,对上百号生产工人。两种工作方式:**驻线检**(坐在线尾,边下线边挑)和出货终检——行内叫**尾查**(装箱前按比例抽箱复验)。注意那个悬殊的配比:一比二三十的人数关系,决定了厂内QC只能是抽查逻辑、拦大放小——它是工厂自己的免疫系统,不是你的验货(你的验货是另一套体系:AQL抽样、第三方机构,第11章整章讲)。QC能替你拦住的是成批的、显眼的错;拦不住的是"这个算不算次品"的标准之争——那场拉锯,8.5.1马上开演。

第二道闸,仓库,面辅料仓和成品仓两头。它的武器是单据:面辅料进来对采购单点收,车间领料凭领料单对生产通知单(见4.1.1),成品下线按箱登记入库。别小看这个"对数"的部门:你的520套滑扣到了没有、是不是同一个电镀批次、大货装了几箱零几顶——最诚实的答案全在仓库的本子上,比任何人的口头汇报都硬。仓管手里还替你存着一样东西:**同缸布头**(见1.3.2)——验货复称克重要用的那两米布,就躺在他的货架上。清点滑扣那天,仓管跟你说了句让你心里一松的话:"你这个扣我单独放了一格,同一批电镀的,颜色齐。布头留了两米,验货要用说一声。"

第三道闸,财务,两三个人,管着两个主体(见8.1.1)的账、开票、退税、收付汇。在家族厂,这个位置几乎必然坐着老板娘或至亲——钱袋子不外放,这不是落后,是这类企业最理性的安排。财务的闸门逻辑与你直接相关,两条:**定金不到账,采购不下单**——你的多米诺(见8.4.1)是从财务确认到账那一刻才开始倒的,"我打了"不算,"到账了"才算;**尾款不结清,成品仓不放货**——将来你收Mike的钱讲究"七成尾款见提单副本"(第14章展开),工厂对你,同理。有位同行的教训:尾款审批在自己公司内部走了六天,货在成品仓多躺六天,错过船期,他抱怨工厂不通融,工厂只回了一句:"财务制度就这样。"——那不是刁难。**闸口对谁都关,恰恰是你敢跟这家厂长期做下去的理由**:今天它替自己拦你,明天它同样替你拦别人。

看完三扇门,你该明白它们的另一面:三道闸不只是拦人的,更是**替你记账的**——QC的尾查记录、仓库的出入库数、财务的到账凭证,将来任何一笔扯皮,证据都从这三扇门里出。动作:驻厂(或远程)把三样东西各看一眼、要一份:①你这单的辅料入库记录,核数量与电镀批次;②尾查的抽检记录表,看抽了多少、挑出了什么;③你每笔打款的到账确认。三张纸对应三道闸——都拿到手,你对这张订单的了解,就不再依赖任何人的一句"没问题"。

## 8.5 结构性矛盾

### 8.5.1 产量vs质量:计件制下的天然拉锯(承接4.4.3)

你在四线线尾看见这样一幕:驻线QC从筐里拎出一顶帽子,后檐线歪出一截,叫车位工返工。那位车位工接过帽子,没吵,只把它往台面上一放,先缝完了手里堆着的六顶,才慢慢拆那顶歪的。小周在你旁边低声解说:"返工不计件。多缝一顶,是一顶的钱。"

这一幕就是全章最重要的一对矛盾:**产量与质量的拉锯,根子长在计件制里**(工价表与计件的完整机制,见4.4.3)。把账算穿你就全懂了:假设那道工序的工价三毛一顶,一天过手800顶,日工资二百四;慢下来一成、把每顶都缝到无可挑剔,一天少挣二十几块,一个月少六七百——没人跟自己的钱过不去。而返工是双倍惩罚:拆一顶、重缝一顶,花两倍时间,计件工资一分不加。所以每个计件工人的理性策略都收敛到同一句话:**快到QC刚好抓不住的程度**。这不是道德问题,是制度算出来的行为——你要跟它斗,靠的是规则和在场,不是讲道理。

再看裁判这边。QC的KPI是不良率,生产端的KPI是产量和交期,天然顶牛;更微妙的是,多数厂里QC在行政上归厂长管——**裁判受雇于运动员的教练**。平时相安无事,一到交期吃紧,厂长一句"先出货,客户那边我去说",QC的标准就软了。旺季的货普遍比淡季糙,全行业皆然,病根就在这里。

你亲眼看到的第二幕更说明问题。尾查时,QC挑出一小筐后幅缝歪的,组长过来打圆场:"哪有那么严重?这个角度,客户戴上根本看不见。"QC正犹豫,一抬头看见你站在旁边,把筐扣下了:"返。"——那一刻你彻底明白了驻厂盯单的最大作用:**不是你比QC更会验货,是你站在那里,改变了这场拉锯的均衡**。你在场,"先出货"的成本就变高了——放走的每一顶次品都可能被你当场看见,厂长和组长会自动把标准调回去。你不在场怎么办?第11章教你远程的打法;此刻先记住结论:**别把你的质量全部外包给厂内QC**——它的立场决定了它只能做第一道滤网,永远不是最后一道。

两个数字傍身。问厂里"尾查一般挑出多少",答"百分之二三"是正常水平(疵点怎么分级、多少判退,见11.2.1);答"我们基本没有不良"的,不是工厂太好,是QC太软。另一个数字是你自己的:驻厂期间,每天在线尾站二十分钟、随手翻十顶,发现问题不当场发作——拍照,发小周,让组织自己的流程去处理(还记得8.2.2的规矩:不越过)。二十分钟听着少,但车间是消息流通极快的地方,第二天全厂都会知道:**这个客户,天天翻货**。你的五百顶从此在每个工位上都会被多看一眼——这是拉锯里你能放上的最便宜的砝码。

最后一个动作留给开线时刻:任何一道新工序上线,头几顶做出来时到场,跟组长一起看——头几顶定调子,调子定了,后面九成的质量靠惯性。你的单已经上线两天,补做也来得及:明早开工前,把三线四线正在做的工序各翻五顶,有疑问当场跟组长对标准。质量这场拉锯没有终局,你能做的,是让均衡朝你这边偏一点,再偏一点。

### 8.5.2 业务vs生产:插单、改单与排产的暗战(承接4.7.3)

傍晚六点半,生产办公室。老纪拿着手机进来,屏幕上是聊天记录:"崔厂,老周那边800顶,要提前一周,加急。"老崔没接手机,眼睛看着白板:"往哪塞?八条线,你给我指一条闲的。"老纪:"人家一年十几万顶都放咱家,这个面子……"老崔用笔帽敲了敲两个格子:"塞可以。五线六线各让两天——让的是谁的单,你去跟人家客户解释。"两人在白板前站了十分钟,像两个下棋的。你坐在角落假装看进度表,大气不敢出——这十分钟,比你读过的任何管理学都真实。

业务与生产的暗战,是每家工厂的常驻剧目,剧本永远是同一套。业务的KPI是接单额和客户关系,所以对外什么都敢应——交期、**插单**(排产与插单的完整规则,见4.7.3)、改单,应下来是他的业绩,做不做得出来是生产的事;生产的KPI是交期兑现和成本,白板就那么大,每塞进一张单,必有别的单被往后推。谁被推?潜规则的排序你要背下来:**大客户 > 老客户 > 合同里带罚款条款的 > 新小单**——翻译一下:没有靠山的新小单,是排产暗战里的默认让路者。改单比插单更招人恨:改logo、改数量、改包装,意味着物料重下、排产重排、版可能重制——你将来对工厂的每一次"小改动",在白板上都是一次余震。

现在可以回答你憋了很久的一个问题了。几天前,你的裁片在绣花外发厂排了两三天队(第6章你看视频那阵),当时小周的解释是"旺季,排一排"。组织学的完整答案是:绣花厂里也有一个"老纪"和一个"老崔"——绣花厂自己的大客户加急单插了进去,而你的裁片是从帽厂转发过去的外发件(外发=交期与品控的转手,见4.3.4),在绣花厂的白板上,你连"新小单"都算不上,你是"别人家的单"。**每转手一层,你的优先级就衰减一档**——那两天,不是谁在怠工,是结构的力量把你往后排了两格。更要紧的是下半句:那两天,从来没有被追回来过。它一直躺在你的时间表里——PI上的出货日就在五天后,账面刚刚好。而**"刚刚好",是排产表上最危险的状态**:它意味着任何一次新的插单、返工、停机,都没有缓冲可吃。这句话你先记下,记到验货那天(第11章),再记到复盘那天(第26章)。

暗战你防不了,但可以给自己修三道工事。第一,**把交期变成条款**:PI里写清交期起算点——定金到账、物料齐备、样品确认,以哪个为准——和延误责任(条款模板见4.7.2)。白板上,带罚款条款的单,没人敢随手抹。第二,**用里程碑代替出货日**:别只盯最后那个日期,把料齐、绣花回厂、上线、尾查四个节点日期跟小周逐个确认——延误永远先在里程碑上现形;那些在出货日当天爆雷的延误,全是里程碑失守时没人吱声、一路攒出来的。第三,**红线时刻要方案,不要道歉**:真被插了队,带着小周去找老崔,开口不是"你们怎么回事",而是"还差几天?周日加半天班能不能追回来?加班费怎么算?"——生产的人不怕客户凶,怕客户不懂;你递台阶加方案,他还你产能。这三件事,第4章的时间账会系统再讲一遍(见4.7);今晚白板前那盘棋,算你提前看了棋谱。
## 8.6 一张订单的组织内流转图

晚上回到酒店,你把这几天认识的名字摊在笔记本上——老纪、小周、单证员、老崔、四线组长、版师、机修、采购、仓管、老板娘——忽然起了个念头:把自己这张单从第一封询价开始,在这些人手里走过的完整路线画出来。画完你盯着那页纸看了很久:**你以为你把订单交给了一家工厂,其实你把它交给了一场十几个人的接力赛**——每一棒都可能掉,而每一次交接,都有一张单据作证。

把这条路线用R&B的单复述一遍,这是它过去一个多月真实走过的路。第一棒,老纪接你的询价,两天核价(采购问料、生产估工、经理审毛利,见8.2.1),报价单出门;往返几轮,PI签订,抬头是贸易主体(见8.1.2)。第二棒,财务确认三成定金**到账**——是"到账",不是"你说打了"——闸门第一次抬起(见8.4.2)。第三棒,小周开出生产通知单(见4.1.1),订单从"合同"变成"任务";采购同步启动,最长交期的古铜滑扣第一个下单,织唛跟上,面料确认同缸(见8.4.1)。第四棒,版房产前样复核、绣花厂制版师的样带确认(见8.3.2)。第五棒起进车间:仓库发料,裁剪上床(见4.2),裁片外发绣花——在邻镇的白板上排了两天队(见8.5.2)——绣好回厂,车缝在两条线上交错着跑六天(见8.3.1),后整定型、剪线、包装装箱(见4.5、4.6)。第六棒,QC尾查,然后是你自己的验货(第11章)。第七棒,单证员做CI、装箱单、报关资料(见8.2.3),小周订舱。第八棒,财务收尾款、放货,货代提走。最后一棒在你看不见的地方跑完:报关出口、收汇、凭票退税(见8.1.1与18.3)——这张单在组织里的旅程,要到退税到账才算终点,比你收到货还晚一两个月。

这张图上有三个规律,值得用红笔标出来。第一,**订单的流动,本质是单据的流动**:PI、到账凭证、生产通知单、领料单、入库单、尾查记录、报关单——每一棒的交接物都是一张纸。人会忘、会说错、会离职,纸不会。所以你追进度,追的不该是"做到哪了"这句话,而是"哪张单据已经产生了":生产通知单开了没有?料入库了没有?尾查记录出了没有?单据在,事就真发生了;单据不在,一切汇报都只是情绪稳定剂。第二,**事故几乎都发生在交接点,而不是工序里**:裁床不会突然忘了怎么裁,但"绣花厂以为周三来取、司机记成周四"会白丢一天;每个部门内部都有人负责,**部门与部门之间的那道缝,只有跟单员和你在看**。你驻厂这几天真正该盯的,不是哪台机器转得快不快,是货从一个部门交到下一个部门的那几个瞬间。第三,**你买的"交期"里,一大半是组织内的等待与流转**:从询价到出货四十多天,车缝只有六天,全部生产工序加起来不过两周(这笔账的完整拆法,见4.7.2)——看懂这一点,催单的姿势就该换了:别对着车间喊快点,去问那几个交接点。

动作:把这张流转图抄进笔记本(章末工具里有整理好的版本),在五个交接点上画星——**定金到账、料齐、绣花回厂、尾查完成、放货出运**。从下一张订单起,每过一颗星,当天找跟单员要一句书面确认("料已齐,面料辅料均入库,批次一致")。五句话,就是你远程盯单的全部骨架;驻厂盯单,盯的也无非是这五颗星之间发生的事。

## 8.7 外部合作者生存指南

### 8.7.1 三个关键人:跟单员、厂长、老板/老板娘

晚饭是在厂里吃的——驻厂的客户,老板照例要请一顿。饭桌上你把这家厂的权力地图看全了:老板坐主位,话不多;老板娘从财务室过来,上桌前还在跟银行通电话;老崔陪坐,聊的全是设备和工人;老纪最活跃,负责倒茶和讲段子。散席时老板送你到门口,说了句标准话术:"有什么事,直接找我。"——这句话你要会听:**它是客气,不是流程**。真把什么事都"直接找他",是新人在工厂里死得最快的方式之一。

一家中型厂,你真正要经营的关系只有三个人,各管一段,各有各的打开方式。

**跟单员**——你的日常操作系统。九成的事到小周为止:进度、改动、物料、验货、发货,全走这条线(怎么处,8.2.2已经给全)。判断标准:凡是"流程内"的事,找跟单员;跟单员明说搞不定的,才升级。

**厂长**——交期与质量的最终裁决。找老崔的时机只有三种:交期红线(里程碑连丢两个)、质量争议(返工范围和标准谈不拢)、重大变更(数量加三成这种要重排产的)。找法记两条:带着小周去——不越级(见8.2.2);带着方案去——给他选择题("周日加半天班,加班费我认一半,能不能追回两天?"),不要给问答题("崔厂,这可怎么办啊")。频率上还有个不成文的额度:**一张订单,找厂长别超过两三次**——次次升级,等于当众宣布你的跟单员没用,以后没人真心替你办事。

**老板/老板娘**——规则的例外通道。价格政策、账期、市场边界(你想做他们没做的渠道)、大事故的赔偿方案,这些"改规则"的事,只有他们能拍板;老板娘那一票尤其关键——凡是往外掏钱的决定(退款、赔偿、垫资),没有财务室点头,谁答应都不算数。找他们也讲场合:饭桌上不谈判,饭桌只做一件事——让他们记住你是个"做得起来"的年轻人;真谈事,白天,办公室,带着数字去。

三个人怎么分层,给你一个粗糙但好用的规则:**几百块以内、不动交期的事,跟单员;动交期一天以上、或要返工的事,厂长;动钱超过货值百分之五、或要改规则的事,老板**。层级找对了,事情办得快;找错了,代价是隐性的——小事捅到老板,老板转头问老崔,老崔问小周,兜一圈事还是小周办,只是从此你的事,一律"按流程来"。

那顿饭上,老板娘只跟你说了一句正经话,你记进了本子:"年轻人,咱们这行没什么秘密,就是钱按时、话算数。你按时打款,厂里什么都好商量。"这句朴素的话,是你和这三个人全部关系的地基:**先做一个让工厂省心的客户,才有资格要求一个让你省心的工厂。**

动作:出货顺利后,给老板发一条正式的感谢微信,里面点名表扬小周,一句就够("这单小周盯得细,几个节点都提前打了招呼")。成本为零,效果三层:小周得了最缺的口碑(见8.2.2),老板确认了你懂事,你自己攒下了下一单开口的人情。关系维护的完整节奏——回访、节礼、年度盘点——放在第24章;驻厂这几天,先把三个人的微信备注改成"归谁管什么",存进通讯录。

### 8.7.2 地盘边界与人情尺度:什么能开口、什么不能碰

上午在四线,你看见一顶帽子后幅明显缝歪,几乎就要脱口叫住那位车位工返工——话到嘴边,咽回去了。你拍了张照发给小周,两分钟后,组长走过去自己把帽子抽走了。中午小周跟你说:"幸亏你没直接喊。那是组里手最快的熟手,你一个外人当面挑人家的活,组长下不来台,往后你的款过那个工位,什么待遇就不好说了。"

工厂是个地盘社会,每块地盘都有主人。你作为外部合作者,先认清三块碰不得的。**第一块:车间是班组长的。**你能不能直接进车间指挥工人?不能,三个理由,一个比一个硬:安全责任——车间里是针、刀、烫台,你指挥出的操作出了工伤,说不清;计件秩序——你叫工人返工,人家的损失谁补?(见8.5.1,返工是双倍惩罚)你补不了,你就是在动别人的工资;权威结构——越过组长发指令,等于当众宣布他不存在,他找回场子的方式有一百种,每一种都会落在你的货上。正确路径永远是:**发现问题 → 留证据(拍照) → 交给跟单员或组长 → 让指令从组织内部发出**。看、问、站在线尾翻货(见8.5.1),都可以;指挥,不行。**第二块:客户是业务员的。**驻厂时你会撞见别家客户的样品、白板上别家的单——不问价格、不拍照、不打听是谁;撞见对方客户本人,点头微笑,不递名片。这是行业级红线:工厂最深的恐惧之一就是客户信息外泄,你犯一次,借着产业带的信息池(见6.1.2),全镇的厂都会知道。**第三块:价格是经理和老板的。**别当众拿别家报价砸老纪的脸("××厂比你便宜两块")——要谈价,单独谈、拿规格差异谈(怎么拆,第9章整章教)。

再说人情的尺度。给小周带杯咖啡,算不算越界?不算——但你要知道**为什么**不算,才守得住界。三条判断标准:**公开**——给整个办公室带一提,而不是单独塞一杯;**小额**——几十块,收的人没有心理负担;**不指向具体放行**——它换的是好感与透明度,不是"帮我把这筐让QC放了"。同理,回访的伴手礼是"给办公室的":一箱水果、两袋特产,放在公共桌上;节日问候发在明面上。什么算越界,也是三条:私下给QC塞钱放次品——你在亲手教这家厂怎么骗你;给采购好处换"方便"——你在腐蚀老板的内控(见8.4.1);加工人微信打听工价、挖人——你动了老板的命根子。数字上给个粗线条:你这单毛利一万四千多,在一家厂一年的人情花费,几百块到一千块封顶——**超过这个量级,你买到的就不再是关系,是把柄**:收了大礼的人从此怕你,而怕你的人,不会真心帮你。

下午你给外贸办公室带了一提咖啡,顺手多买两杯放到生产办公室。小周说:"又破费。"你说:"楼下顺手。对了,明天尾查我能不能跟着看?"小周笑了:"你这咖啡,喝得一点不亏。"——这就是人情的正确用法:它不兑换任何违规,它兑换的是"多让你看一眼"的透明度;而透明度,是外部合作者在一家工厂里能得到的最值钱的东西。

动作:把"三不碰"写进你的驻厂守则,抄在笔记本第一页——不直接指挥工人、不碰别家客户、不私下塞钱。每次想开口之前,先默念一句:"这是谁的地盘?"——能问出这句话,你已经比八成的客户懂事;而"懂事"两个字,在人情社会里的兑换率,高得超出你的想象。

# 第9章 看懂报价单

**主线推进** —— 驻厂的第二个晚上,镇上小旅馆的台灯底下,你翻文件夹找明天要用的规格表,一页打印纸从夹层里滑出来——老纪一个多月前发来的那份报价单。你把它捡起来,忽然不想睡了。一个多月前收到它的那个晚上,你能做的只有一件事:把最下面那个数,和东莞的21、义乌的11摆在一起比大小。面料那栏为什么是1块5?工缴凭什么要4块多?损耗率两个点是多是少?当时一个都答不上,只能安慰自己"胶州是基准价,应该没错"。而现在——布,你在档口一米一米摸过;裁床,你前几天亲眼看它一刀下去几百片;绣花,那8800针是你自己出钱制的版;车缝,今天下午你就站在车间里,看着墙上那张工价表把每道工序的钱标到分。你把报价单在灯下铺平,从第一行重新往下读:一行,亮了;再一行,又亮了。**同一张纸,一个多月前是一团雾,今晚是一张成本地图。**这一章就做这件事:以现在的你,替当时的你把这张单子逐行核一遍——报价单是这门生意里离钱最近的一页纸,看不懂它,你砍的每一刀都砍在自己身上。

## 9.1 一张报价单的解剖

### 9.1.1 FOB一口价里有几层:报价单逐行认

先把这张纸念给你听。表头是工厂外贸公司的抬头,正文其实只有薄薄几行:品名,6片软顶dad hat;规格,一行小字"全棉精梳21支108×58磨毛斜纹240g/㎡,藏青PMS 289C,前幅平绣约8800针,古铜金属滑扣,详见客户规格表v1.1";数量,500顶;单价,**FOB青岛 USD 2.45/顶**;交期,收定金后35天;付款,30%定金、70%见提单副本;报价有效期30天。最底下备注栏原本打着"制版费¥200,翻单免收",后面补了一行小字:"版客供,免收。"——就这么多。当时你用手机汇率一乘,2.45×7.1≈17.4,心里给它记了个"¥17.5上下",然后就去比总价了。**一张报价单最重要的部分,恰恰是它没写出来的那半张纸。**

先钉两个全书后半程天天要用的词。这个"没写出来的半张纸",行内叫**BOM(bill of materials,物料清单)**:一件产品由哪些材料和工序构成、每项用量多少、单价多少的完整清单——工厂内部核价就是按它做的;而把一口价还原成BOM式明细的动作和产物,叫**成本拆分(cost breakdown)**,行内口语就说"拆分"或"breakdown"。FOB是什么,第7章给过一句话(见7.1.1),完整讲解在13.3.1,此处只需要知道:FOB青岛=工厂负责把货送上青岛港的船,拖车、报关这些内陆段费用它承担——胶州到青岛港拖车一小时(见6.2.1),500顶拼在别人柜里,这段钱小到老纪直接揉进价里没单列。

现在把那半张纸铺出来。三天前的晚上你已经亲手拆过一次账(见7.2.1),那张表原样搬过来,和报价单并排:

| 报价单上的一行 | 拆开后的八层(¥/顶) |
|---|---|
| FOB青岛 USD 2.45 | 面料1.5 + 里衬檐芯1.0 + 辅料2.5 + 绣花4.0 + 裁剪车缝工缴3.5 + 后整包装0.9 + 管理摊销1.8 + 损耗0.4 = **成本15.6**,+ 工厂毛利1.9 = **¥17.5** ≈ USD 2.45 |

带你把加法真的做一遍:1.5+1.0=2.5,+2.5=5.0,+4.0=9.0,+3.5=12.5,+0.9=13.4,+1.8=15.2,+0.4=15.6;毛利1.9,合计17.5;按报价单脚注的折算汇率一除,正好2.45。**一口价就是这八层被压扁成的一个数**——压扁的过程丢掉了所有信息,而信息就是钱:你不知道面料是1.5还是2.3,就不知道该不该问;不知道毛利是1.9还是3.9,就不知道能砍多少;不知道损耗报了几个点,就连"多报的那一个点进了谁的兜"都无从谈起。

当时的你差点犯的错,现在可以公开处刑了:盯着2.45,盘算"砍到2.30行不行"。砍总价等于蒙着眼在八层里乱抽一层——你以为砍的是毛利,工厂完全可以从面料里找回来(手法见9.2.2),你省七毛五,货差一个档。而拆开之后,同一个问题变成八个具体的问题:面料1.5诚实吗?辅料2.5对得上清单吗?绣花4.0的针数是谁说了算?每个问题都有核法,后面各节一节核一栏。

本节动作,一个习惯:从今天起,拿到任何一张帽子报价——不管对方给不给拆分——先自己画这张八行表,凭第一部的知识把每格填上估计值,加总,和对方的一口价比。**你拆出来的合计比报价高,说明对方可能在某格动了手脚;低五个点以上,多出的才是真正可谈的空间**(见7.2.1、9.6.2)。这张空表,就是你面对一切报价的第一反应。

### 9.1.2 要breakdown的话术:工厂为什么抵触、怎么开口

把时间拨回一个多月前。你收到报价单当晚就给老纪发微信:"能不能给个成本拆分?面料、辅料、绣花、工缴分开列一下。"老纪回得不快,隔了半小时:"兄弟,拆分一般不给的。不是防你,是给你拆了,你转手发给别家,人家专挑我每格里最低的那格凑一张'全市场最低价'回来压我——我按那个价接,货就得往烂里做。你要是嫌高,咱们说配置,配置对着规格表一条条过,比拆分实在。"——这段话值得逐句分析,因为它是全行业业务员的标准心声,真话托辞各占一半。

真话的部分,是工厂的**三怕**。一怕**比价拼盘**:你拿A厂的面料价、B厂的绣花价、C厂的工缴拼一张"理想报价"去逼第四家,拼出来的数字物理上不存在——每家的低格都有它自己的条件(量、配套、淡旺季),拼在一起就是逼人减配。二怕**算穿**:拆分等于把毛利那格摆上桌,谈判从"这顶帽子值多少"直接退化成"你凭什么赚1块9"——毛利见光,砍价就有了瞄准镜,这是人之常情。三怕**麻烦与外泄**:细拆等于交出供应商价格体系,布从哪进、扣多少钱拿的,这些是工厂攒了多年的家底。托辞的部分也要听出来:"给你拆了你也看不懂""我们从来不拆"——这两句翻译过来是"我赌你不会算"。**工厂给不给拆分,本质上取决于它对你的两个判断:你会不会算,和你是不是来比价的。**话术要做的,就是同时回答这两个判断。

你当时回的那段话,现在可以当模板用:"**纪哥,我不是拿去比价的——比价我拿总价就够了。我要拆分是为了锁规格:每一栏对应什么材质什么档次,写清楚,将来翻单改配置——比如换个扣、加个码——按项加减,不用整单重新报价;出了纠纷,也按栏说话,不用扯皮。你按大项给我就行,面辅料、绣花、工缴、其他,四栏。**"这段话的三个设计:第一句卸掉"比价"的戒心;第二句给出一个对工厂有利的理由——翻单按项调整,省的是它自己的报价功夫(工厂听到"翻单"两个字,态度天然软三分,原因见7.2.1);第三句主动降低要价——**不逼细拆,先要大项**。细拆是关系深了以后的事,大项是第一单就该拿到的底线:面辅料、绣花、工缴、管理利润四大块,足够你判断结构对不对,又没逼工厂交家底。

老纪第二天给了:"面辅料5.0,绣花4.0,工缴4.4,管理杂项利润4.1,合计17.5。行了吧?"——四个数,和你后来自己拆的八层严丝合缝对得上:面料1.5+里衬1.0+辅料2.5=5.0;裁剪车缝3.5+后整包装0.9=4.4;管理1.8+损耗0.4+毛利1.9=4.1。**工厂给大项,细账自己补**——大项锁结构,细项用第一部的知识逐格还原,这就是买卖双方之间现实的信息平衡点。反面案例给你看拿拆分去拼盘的下场:一位同行拿着两家的细拆互相压,硬生生把一顶合理成本16块的帽子压到15.8成交,自以为赢麻了;大货到手,克重、扣、沿条三处减配(减在哪、怎么查,9.2.2和9.3.2正好都讲),客户索赔,他回头找工厂,工厂一句话:"这个价,做出来就是这个货。"——**拼盘拼掉的从来不是工厂的毛利,是你自己的货。**

本节动作:把那段话术存进备忘录,以后每次询价原样用;并给自己立一条规矩——**拿不到细拆不勉强,拿不到大项要警惕**:连四栏都不肯给的工厂,要么毛利厚得见不得光,要么根本没算过自己的成本,两种都值得再想想。

## 9.2 面料成本

### 9.2.1 反算验价:克重×用量×米价,三分钟核一栏(承接1.5.1)

现在开始逐栏核,第一栏:面料,¥1.5。核这栏你有个别人没有的优势——这块布你比工厂还熟:一个多月前你亲自在面料市场把21支108×58磨毛斜纹的行情问穿了,普通斜纹¥10-12/米,磨毛加¥0.8-1.2(见1.2.2),当批实价¥12/米,门幅1.5米,布头现在还在你包里。1.5.1的公式搬出来,三步,一分钟一步。

第一步,把米价折成平米价:12 ÷ 1.5 = **¥8/㎡**。第二步,乘单顶用布:8 × 0.17㎡ = **¥1.36/顶**——0.17这个数的来历1.5.1讲过,净裁片0.13-0.14㎡加排料间隙与裁耗。第三步,和报价比:工厂报1.5,高出1.36约一成。这一成是什么?是真实世界的摩擦:工厂按大货采购要含运费和票(含税价比档口现金价高几个点),排料不可能永远排到最优(用料率的账见4.2.3),再留一点点余量。**套1.5.1给过的阈值:反算高出市价两成以内,正常浮动;高出五成,必须问。**1.5落在一成——这栏是诚实的。你在报价单的"面料"旁边用铅笔打了个勾,这是整张单子上第一个勾。

再教你阈值另一侧怎么问,因为1.5.1留过话:"怎么开口、工厂会怎么答、哪句是托辞,9.2.1专门教。"拿你询价那阵子真实收到的另一份报价做靶子:同规格,面料栏报**¥2.0**。反算:2.0 ÷ 0.17 = 11.8元/㎡,×1.5米门幅 = **折合米价约¥17.6**——比市价12高出47%,踩在"必须问"的线上。开口的姿势很讲究,不问"能不能便宜"——那是把主动权交出去;问规格:"**面料这栏折下来米价17块6了,你们这个布是什么规格?几支几乘几、多少克,布票发我看看。**"这一问是照妖镜,对面只有三种答案。答案一,报得出完整规格且确实高档——"我们用的21/2双股,128×60高密"——那你拿新规格重新查市价再算一轮,贵得有名有姓,这栏就算过了,买不买单是另一回事。答案二,含糊其辞——"我们的布好,你摸了就知道"——**"布好"两个字没有规格,就是托辞**,这栏塞了利润,点破或走人。答案三,当场改口——"哦这栏报高了,我核一下"——最常见,所谓"核一下"就是把试探性的水分挤掉,一句话省几毛钱一顶。你当时收到的那家属于答案二,追问两轮报不出纱支密度,询价名单上划掉。

把这三分钟的价值算给你看:面料栏虚五毛,500顶就是¥250;虚一块,¥500——**而核它的成本,是你早已背下来的一个除法一个乘法**。更重要的是威慑价值:你在第一轮询价里就把米价折出来问,工厂对你的分类当场从"看总价的"改成"会算的",后面每一栏的报价水分都会自动收敛——1.1.5说过行话是用来省钱的,反算公式是行话里最锋利的那句。

本节动作:把三步反算写成卡片贴进询价流程——**①问全四样:材质、纱支密度、克重、门幅(缺一样先补齐);②1688同规格问三家取中间值当市价;③米价=面料栏÷0.17×门幅,套两成/五成阈值**。以后任何报价单到手,面料栏永远第一个核——它是最大的材料单项,也是你唯一手里有现成公式的一栏,三分钟,先下一城。

### 9.2.2 换料猫腻四手法:降克重、抽密度、换比例、以次充好

面料栏还有另一种不诚实,比报高价隐蔽得多:**价钱如你所愿,布不再是那块布**。它几乎从不发生在第一次报价里——第一次报价工厂按你的规格实报;它发生在你砍价成功之后。7.2.1那句行话再念一遍:"再让就要在料上想办法了"——这句是明说的,更多工厂不说,直接办。四个手法,从最常见到最恶劣排开,每个都配上验法,因为**每一手都恰好踩在你第1章学过的一件仪器上**。

**手法一,降克重。**240克的布换成215克的,米价省一块多,单顶省两毛上下,500顶一百来块——钱不多,但这是最顺手的一刀,因为新布状态下215克上了浆一样挺括厚实(机制见1.3.2),肉眼、手感全体失灵。验法你早就会:圆刀取样、洗后称重(见1.3.1、1.3.2)——规格书里那句"以退浆水洗、常温平衡24小时后圆刀取样为准,允差±5%",就是为这一刀准备的;大货验货用随货的两米同缸布头做洗称,三分钟现形。**手法二,抽密度。**108×58抽成96×54,克重居然还能"达标"——粗一点的纱、稀一点的密度,靠浆撑到240克,秤上看不出,布的骨架却松了:耐磨、吃绣花的能力全降档。1.3.2说过"克重可以靠浆撑回来,密度骗不了拆线数数"——验法是剪一平方英寸数经纱,实操交给检测机构几十块一项(见1.1.5);写在纸上的防线是"密度允差±4根"那半句。**手法三,换比例。**"全棉"悄悄变成掺了一成涤的混纺,或精梳换普梳——布价差出两三成,新布手感几乎无差。验法:火柴,烧毛测试(见1.1.3),灰末里有没有硬黑珠,十秒;较真到底就加一份第三方成分检测,两三百块,规格书里"成分允差±5%,大货随附检测报告"那行字就是它的法律位。**手法四,以次充好。**规格全对,但布是B品:布面有织疵、有色档,或者是库房压了两年的陈布、别单剩下的尾货拼缸——这一手最恶劣,因为前三样仪器全查不出它,它躲在"规格"之外。验法在生产端:验布(见4.2.1)和同缸条款(见1.4.1)——"同一订单面料须同缸染出,大货附缸号",一句话堵死拼缸尾货的路。

四个手法有个共同的数学结构,想通它你就永远不会掉以轻心:**单顶省两三毛,单笔看着不值当,但它是纯利**——工厂让给你的五毛价,从布上抠回三毛,毛利只伤两毛;你以为砍下了3%,实际货降了一档。反过来这也是你的谈判纪律:**砍下来的每一分钱,都要问自己"这钱会从哪格回来"**——答不出,就别砍。

一场事故把四手法串起来。一位做促销单的同行,3000顶,把¥16的报价硬磨到15块,工厂爽快答应——爽快本身就该警觉。大货出来,他也验了:克重,秤上239克,过;颜色,对着色卡,过。发货。客户上架两周后投诉:帽子洗一水就软塌走形,绣花周围起皱。他寄回样品送检:洗后克重212克(重浆,手法一),密度96×54(手法二),棉含量88%(手法三)——三刀齐下,每刀都停在他"验过"的项目旁边一毫米。索赔谈判里工厂只认了一部分:"含量差了算我们的;克重你验收时是过的。"——他验的是洗前克重,规格书里没写"洗后为准"。这单赔掉的钱,是砍下来那3000块的四倍。**猫腻从不正面强攻,专找你规格书里缺的那半句话。**

本节动作:把"砍价后的第一批大货"设为最高警戒等级,四件套检查一次做全——洗后称克重、数密度(或送检)、烧毛、核缸号——四手法每样都有一件仪器对着它;并在心里立一条铁律:**工厂爽快答应的降价,九成不是让利,是换料的预算已经批下来了。**

## 9.3 辅料成本

### 9.3.1 辅料清单(trim sheet):扣、眼、汗带、标逐项有价

报价单第三层,辅料,¥2.5。这一栏和面料栏的性格完全不同:面料是一样东西一个数,辅料是**十来样小东西挤在一个数里**——扣、眼、汗带、标、袋、箱,每样几分到一块多,单看哪样都不起眼,合起来占掉这顶帽子成本的16%,比面料栏还大。挤在一起,就是它的猫腻空间:你不拆开,永远不知道2.5里面少了哪样、换了哪样。拆它的工具,行内有个专名:**辅料清单(trim sheet)**——把一顶帽子用到的全部辅料逐项列出名称、规格、用量、单价的清单。第2章讲规格表时预告过它(见2.5.2):规格表是树干,trim sheet是"辅料"那一栏的展开,作为附件挂在规格表后面——规格表上"调节扣:古铜金属滑扣"一行字,在trim sheet里展开成材质、电镀色、批次要求、单价、确认扣样编号五列。

现在拿第2章的价格表,把2.5逐项核开。你的trim sheet长这样(单价均为第2章口径):

| 辅料项 | 规格 | 单价(¥/顶) | 出处 |
|---|---|---|---|
| 金属滑扣+收尾环 | 锌合金,古铜色,同批电镀 | 1.20 | 2.4.2 |
| 汗带 | 藏青全棉斜纹,3cm | 0.40 | 2.3.3 |
| 沿条 | 同色,六缝全包 | 0.30 | 2.2.2 |
| 织唛主标 | 同色织唛6×2cm | 0.12 | 2.3.4 |
| 洗水标 | 成分/产地/洗涤图标 | 0.04 | 2.3.4 |
| 顶扣 | 同布包布 | 0.05 | 2.3.1 |
| 单塑袋 | 含窒息警告印刷 | 0.08 | 4.6.1 |
| 外箱摊销 | 五层瓦楞60×40×40,约¥3.5/个,100顶/箱 | 0.04 | 4.6.2 |
| **小计** | | **2.23** | |

带你把尾数也找齐:2.5 − 2.23 = 0.27,这两三毛是缝纫线、包扣布、气眼绣线这类没法单列的杂料——**辅料栏能核到九成对得上、尾差不超过一两成,就是一栏诚实的报价**;反过来,报3.5而你按同规格只能凑出2.3的,中间那一块多就要逐项问了。注意两个容易漏的核点:织唛按1000枚起订(见2.3.4),500顶的单摊的是千枚的钱,0.12已含这层;塑袋上那行窒息警告语不是装饰,是北美渠道的硬要求(见4.6.1),报价里没有它,后面加印是要另收钱的。

trim sheet的地位,比"核价工具"重得多,它是**一张纸三个用途**,和规格表的三程共用(见2.5.2)完全对位:询价时,它让三家工厂对着同一串辅料报价——没有它,A厂按合金扣报、B厂按铁扣报,你比的价根本不可比;下单时,它作为PI附件锁定每项规格,"大货和样品不一样"的投诉,行内出事最多的就是辅料,因为它们太小、太容易"顺手换一个差不多的";验货时,它就是逐项对照的清单——扣吸不吸磁铁(下一节教)、汗带搓不搓得响(见2.3.3)、织唛密度对不对,一行一行打勾。一段真实质感的对话给你听:你当时问老纪"辅料2.5都包括什么",老纪回:"你trim sheet上列的全包了,连塑袋纸箱都在里头。就一条——你那个合金扣占了一半,1块2,这个别嫌贵,嫌贵我给你换铁的,省7毛。"——这句"省7毛"是真话也是伏笔,它值多少代价,下一节整节讲。

本节动作:照上表给自己做一个trim sheet空白模板(名称/规格/用量/单价/确认样编号五列),从此**凡询价,规格表+trim sheet双附件同发**;凡报价回来,辅料栏对着它逐项凑数,凑不齐的差额就是你的第一个问题。这张表花你十分钟,此后每一单都用得上——辅料的钱是小钱,辅料的规格从来不是小事。

### 9.3.2 档次替换:一个金属扣的三档价差与看不见的降配

老纪那句"省7毛"背后,是辅料世界的一条食物链。同一个词——"古铜色金属滑扣"——在辅料市场里对应三种东西,三个价:**铁滑扣**,铁片冲压、表面电镀古铜色,¥0.4-0.6一套;**锌合金滑扣**,实心合金压铸,坠手、边角圆润,¥0.8-1.5一套,R&B用的就是它,按¥1.2计;**实心黄铜滑扣**,真铜,¥2-3一套,做旧后包浆最漂亮,高端品牌帽和皮具上见得多。三档摆在柜台上,电镀成同一个古铜色,隔着半米看是三胞胎——**"古铜色"锁的是颜色,不是材质**,这就是档次替换的门:规格写得不够深,工厂(或者被砍急了的工厂)从三档里往下滑一档,字面上没有任何违约。

三档差在哪,拆给你。重量:铁扣冲压是空心薄片,合金压铸是实心,上手一掂,合金明显坠手——2.4.2讲过,那0.5秒的分量感就是消费者判断"这帽子不便宜"的瞬间,降配降掉的正是你花钱买的那0.5秒。寿命:铁扣的电镀层薄,磨损后露铁、遇潮生锈,海运集装箱里的高温高湿是它的刑场(2.3.1那批锈鸡眼的事故,同一个死法);合金不锈,磨旧了是变暗,不是烂掉。手感:压铸件边角圆润、布带滑动顺;冲压件边缘有毛刺感,布带磨几个月起毛。**每一项差异都要用三个月到半年才暴露——而验货就在出货那三天。**这就是"看不见的降配"的完整含义:不是验货时看不见,是它专挑验货之后才发作。

验法,两个动作,加起来十秒。第一,**掂**:同款合金扣你手里有确认扣样(2.4.2的条款写过"以确认之实物扣样为准,大货留样比对"),大货抽十顶,扣拆下来和扣样放两只手里对掂,铁换合金,重量差立判。第二,**磁铁**:铁有磁性,锌合金和铜没有——口袋里带一粒磁铁,往扣上一贴,吸住的就是铁扣,当场现形,没有任何争辩空间。这粒磁铁从今天起进你的验货工具箱,第六件仪器(前五件:火柴、克重仪、潘通卡、拆线刀、软尺,见2.5.1)。

事故讲一单"省7毛"的完整下场。一位同行做精品款dad hat,600顶,客户是本地一个滑雪品牌,规格里写的是"金属滑扣,古铜色"——没写材质。他把价砍下去1块,工厂没吭声,大货用了铁扣。出货验货,颜色对、功能好,过。三个月后雪季,客户的顾客把帽子塞在潮湿的雪具包里,扣子一圈锈黄晕到布带上,退货照片在客户的社媒评论区挂着。客户没索赔,只做了一件更狠的事:第二年的翻单询价,没有发给他。算这笔账:铁扣省7毛×600顶=¥420;丢掉的翻单,按他自己说是两千顶——**辅料降一档省的钱以百计,丢的单以千计,这是全书里汇率最差的一笔交易之一,而它的起点只是规格表里少写了"锌合金"三个字。**

本节动作,三件:①trim sheet上凡金属件,材质+电镀色+批次三要素写全——"锌合金,古铜色,同批电镀,防锈电镀,以确认扣样为准",一个都不能少(条款出处见2.4.2、2.3.1);②买一粒磁铁挂进钥匙串,验货操加第七式:贴扣;③把三档价背下来——铁0.5、合金1.2、铜2.5的量级——以后客户预算紧,你主动给他讲这三档,让降配发生在**桌面上**:"预算再压1块,扣换铁的,寿命和质感我先说清楚"——同一个动作,写在纸上叫方案,藏在货里叫欺诈,区别只在谁先开口。

## 9.4 绣花成本

### 9.4.1 针数验证与千针单价核算(承接3.1.9)

第四栏,绣花,¥4.0——整张BOM里最大的单项,比面料和里衬加起来还多,7.2.1的拆解表里它一项占掉成本的四分之一。核它的公式第3章早就交给你了:**绣花费=针数×千针单价**(见3.1.5),两个乘数,一个一个来。

先核针数。这一单的针数你核起来最没有悬念,因为**8800这个数是你自己的**:版是你出¥200找制版师做的,.dst文件躺在你手机里,查看器打开是8,792针(见3.1.9)——询价时你把文件直接发给了三家,针数不是工厂报的,是你给的。这个位置的价值在比价那一刻兑现:东莞的报价单,绣花栏4.4;老纪的,4.0——两家都按8800针算,4.4=8800×0.5,4.0=8800×0.45,**针数锁死之后,绣花栏只剩千针单价一个变量,比价才第一次真正成立**。两个单价都落在¥0.35-0.55的行情带里(见3.1.5),东莞取高是广东工价的正常体现(见6.3.2),没有一家在针数上做文章——因为没法做。

但多数读者的第一单没有自己的版,针数是工厂制版后报给你的——那就是3.1.9讲过的处境:**乘数长在别人的文件里**。把验证的三招在这里正式编成流程。第一招,**要文件或开屏**:打样需求单里写"制版后回传.dst与色序表"(见3.1.6);对方以"公司资产"拒绝的,退一步要求视频开屏,针数栏、尺寸栏入镜——验数的权利和文件归属是两回事,这个理站得住(见3.1.9)。第二招,**自查**:拿到文件拖进免费查看器,针数、尺寸、色序三样各花一分钟;允差口径照3.1.9——自查差5%以内正常,**工厂报数比文件高出10%以上,必须要说法**。第三招,**两家对比**:同一个logo发两家厂各自制版报价,针数差超过15%就有问题——制版师手艺有差异(见3.1.6,好坏版针数差10-20%),但差出15%的,多半有一家在虚报。三招的成本合计是半小时,拦住的是绣花栏里最隐蔽的一刀:3.1.9那单虚报——8200针报12000——每顶多收¥1.9,做过1200顶才被抓住。套在你这单算一遍就知道利害:如果当初没有自己的版,工厂报11000针,×0.45=¥4.95,比8800针多收近1块,500顶就是**¥495**——一个免费软件的事。

千针单价这个乘数,核法是阈值,3.1.5的两条警报线搬过来站岗:**高于¥0.6,先问为什么**——小单、急单、3D绣(见3.1.7)、金属线(见3.1.8)都可以解释,解释不出来就是虚;**低于¥0.30,更要警惕**——那不是捡到便宜,是密度要被抽稀(绣出来露底布),或者接单的根本不自己绣、转包给没人管品质的外发厂。还有一个整栏消失式的坑要提防:**"包干价"**。"绣花包干¥5,啥logo都这个价"——3.1.5拆过它的本质:赌你不懂针数;应对就一句:"我的logo 8800针、3色、平绣,请按千针报。"让报价回到公式上,双方才在同一杆秤上。

本节动作:把绣花栏的核价三问固化——**①针数谁说了算?(有.dst按文件,没有就三招走一遍)②千针单价落在0.35-0.55了吗?③制版费单列了吗、翻单免不免?**——第三问牵出下一节的行规。以及一个身份提醒:你此刻核的是"工厂报给你的绣花价";将来你给客户报价,绣花栏就轮到你来写了——这杆秤两头都要会站。

### 9.4.2 制版费的行规:首单谁出、翻单免不免

报价单备注栏那行被划掉的字——"制版费¥200,翻单免收。版客供,免收。"——背后是一套值得单独讲一节的行规,和一个你当初歪打正着、现在越想越值的决策。

先讲行规的通行版本。制版费(打带费)¥150-300一个logo(见3.1.5),**首单收、翻单免**,这是行业默认:版做出来是数字文件,翻单直接调用,再收就是重复收费——但"默认"不等于"自动",报价单上没写"翻单免收"四个字的,翻单时真有工厂再收一遍,你拿着上一单的邮件都未必扯得清。所以第一条规矩:**"制版费单列、翻单免收"必须写在首单报价单或PI备注里**,一行字,省掉将来一场架。有些工厂还会玩另一个变体:"量到1000顶,制版费全免"——听着大方,其实是把¥200摊进了单价,羊毛出在羊身上,你会算BOM之后这类话术都是透明的。

行规里真正的深水区是**版权归属**。默认状态下,版是工厂(或它的外发制版师)做的,.dst文件在工厂手里——3.1.9你已经领教过那句"文件是公司资产,不外发"。这句话的份量在你想换厂的那天才显现:版不在你手里,换厂=重新制版,¥200是小事,要命的是**绣感漂移**——3.1.6讲过,同一个logo两个制版师做,针数差10-20%、效果差一个档次;客户拿着两批货对比"怎么麦穗不一样了",你没法回答。版权,本质上是**客户关系的一部分押在了工厂手里**:文件归它,你换厂的成本就永远比留下高一截——这正是工厂愿意"免费送制版"的深层动机之一,入场费替你出了,出场费你自己付。

现在看你的特例。第3章的流程里(见3.1.6),你没走工厂制版,自己花¥200找了十五年手艺的独立制版师,**版权归你,文件在你手机里**。当时只是顺水推舟,回头看,这¥200买到了四样东西。其一,**询价的同一把尺**:三家工厂拿到同一个.dst,针数、尺寸、色序完全一致,绣花栏的比价干净得像做实验——上一节你已经见过它的威力。其二,**换厂自由**:胶州这家做得不好,文件转身就能发东莞,零摩擦、零漂移——你未必真换,但**"随时能换"这件事本身,就是谈判桌上看不见的筹码**(供应商组合的完整打法见12.5)。其三,**翻单免收没有悬念**:版是客供,工厂连"收不收"的话头都没有。其四,**绣感的一致性押在你自己手里**:哪天加做beanie、trucker款(你给Mike的四SKU方案,见1.1-1.2),同一个版稍作调整就能用,品牌资产从第一单就攥在自己手里。四样加起来,¥200是全书到目前为止性价比最高的一笔支出——3.1.9说它买的是"谁也骗不了你"的位置,这一节补上后半句:**还买了"谁也留不住你"的位置。**

给你决策规则和话术,分三档。预算宽裕、打算长做:**学你自己——版自购,版权归己**,找独立制版师或直接跟工厂谈"制版费我出,文件归我",两三百块买断,写进书面。预算紧、首单试水:接受工厂制版,但报价单备注必须加两句——"**制版费¥XXX单列,翻单免收;如合作终止,凭已付制版费调取.dst文件**"——第二句工厂不一定全答应,谈判起点先摆上去,谈成一半是一半。最次的底线:什么都没谈成,至少留着3.1.9的开屏验数权,针数这个乘数不能失守。事故案例照进现实:一位同行给客户做了三年的logo帽,和工厂闹翻,文件要不出来,新厂重新制版,新版9600针对旧版8800,绣出来的字饱满度差半档,客户验货问"这批怎么不一样",他赔笑解释了半个月,折让3%收场——**¥250的制版费没谈归属,三年后收了一张3%的账单。**

本节动作:把"制版三问"写进询价模板的固定问题——**制版费多少、翻单免不免、文件归谁**——三个答案都要落在书面上;有条件的,永远选"版自有"那条路。

## 9.5 工缴:为什么砍工缴没有意义(承接4.4.3)

今天下午你在车缝车间墙上见过一张表,现在它要正式进入你的报价单知识体系。那张表叫**工价表**(见4.4.3):一个款式拆成几十道工序,每道工序后面标一个钱数——上帽檐一道几毛、拼帽身一道几毛、钉汗带几分、穿扣带几分——车工做一道记一道,月底按件数结钱。这就是**工缴**的来源:**工缴=付给"人"的加工费**,报价单上裁剪车缝那栏的3.5,和后整包装那栏0.9里的工钱部分,本质上都是车间里那张工价表逐道加总、再摊上车位和班组管理的结果。这个词全书前面零星出现过几次,正式定义放在这里,因为只有站在报价单前,你才需要真正理解它的一个性质:**刚性**。

刚性从数学上给你证一遍,用的全是你已有的口径。胶州车工月薪五六千(见6.2口径),取5500,月开工26天,日薪约¥210;一条线10-20人、日产800-1200顶(见4.4.4口径),取中位15人做1000顶,人均日产约70顶;210 ÷ 70 = **每顶车缝人工约¥3**,加裁剪的三四毛,正好落在报价单的3.5上。这个除法里没有一个数是工厂能操纵的:工资是劳动力市场定的——低了车工第二天就去隔壁厂(工人池的流动性见6.1.2);产量是手速和工序数定的——R&B这款6片、劈缝烫平、六缝全包沿条、檐面线6行、金属扣穿带收尾,道道是功夫,人均70顶已经是熟手速度。**工缴是工资除以产量,分子分母都是物理,里面没有水分,所以也没有谈判空间**——这就是本节标题的前半个答案。

后半个答案更要紧:**砍工缴不是砍不动,是砍动了更可怕**。工厂真在工缴上让了你五毛,这五毛不可能从车工工资里出——工资动一分,人就走;它只能从"道数"里出,也就是从工价表上删工序:檐面线6行改4行,省¥0.1(见2.3.2);沿条不包净、只包前两缝,省两毛(见2.2.2);劈缝不烫平,logo跨缝绣出一条棱(见2.2.1);剪线马虎、定型缩时——每一样单看都"不算大事",合起来就是你第2章练出的验货操六式逐条报警。还有一条更隐蔽的出路:工序一道不少,**人换了**——你的单从熟手线挪到新工人线,工价低两成,良率也低(产业带外新厂良率打七折的机制,见6.1.2,同样适用于厂内的新线),你省下的工缴,变成了11章验货时挑不完的次品。一段对话把这个机制钉死,就是当初询价时你和老纪的原话——你试探:"17.5能不能再让让?"老纪在电话那头按了半天计算器:"兄弟,实话说,这个价我就赚个加工费,再让就要在料上想办法了。你要是嫌工缴高——工缴没法高也没法低,工价表贴在墙上,车工看得比我还紧,我少给一道的钱,第二天那道工序就没人给你做。"——后来你把这段话咀嚼了很久(见7.2.1),今天在车间亲眼看过计件的运转,才算真懂:**工价表是贴在墙上给几十个工人看的公开合约,它的刚性不是工厂的借口,是这个行业能稳定出货的底层结构**(计件制与质量的拉锯,8.5.1还会再深一层)。

那"嫌贵"的正确出口在哪?三条,全都不碰工价表。第一,**谈数量**:工缴单价刚性,但换款调机的损耗摊在你头上的份额随量变薄(见4.4.2),量上去,总价自然下来——这是9.7.1的主题。第二,**谈配置**:六行檐面线改四行、沿条改半包、滑扣改排扣——每一项都对应工价表上明明白白的一道钱,**在桌面上做减法,和在车间里被偷工,减的是同样的钱,拿到的是两种货**。第三,**谈款式设计本身**:接新客户的单,报价前先看一眼工艺复杂度——难款工缴高还没人爱做(计件制下工人挑活的机制,4.4.3展开),能在设计阶段简化一道缝,比谈判桌上磨一小时都值钱。

本节动作:把一句判断句立成规矩——**报价单上,材料栏核"真假",工缴栏核"合理",唯独不砍**;核合理的算法就是本节那个除法:当地车工月薪÷26÷人均日产,得数±20%以内都属正常(车缝工缴行情¥2.5-4,见4.4.3口径)。低于这个区间的报价别高兴——工缴报不出成本价,做出来的货会替它把账找平。

## 9.6 弹性项

### 9.6.1 损耗率:2%与5%之间藏着的利润

报价单拆到第七层,出现了整张BOM里唯一一个**以比例形式存在**的成本项:损耗,¥0.4。先定义:**损耗率=报价时预估的、从布到成品全程报废与损失占比**——裁剪裁坏的片、绣花绣废的前幅(绣废一片,同裁片的五片陪葬,机制见4.2.5)、车缝做坏的次品、水洗洗损的(见3.3.3)、验货剔除的,全算在内。工厂备料按它多裁、报价按它加成:你的单,成本前七项合计15.2,0.4 ÷ 15.2 ≈ **2.6%**——落在行业常规的2-3%里(见4.1口径),又一栏可以打勾。

但这一栏值得单独一节,因为它和前面六栏的性质完全不同:面料有市价、工缴有工价表,**损耗率没有任何外部锚,它是工厂自己报的一个预估数**——预估,就有了艺术空间。机制想透一层:损耗率是"保险费",工厂投保的是自己的生产波动;而管理好的厂,实际废品率能压在2%以内——**报3%,多出的1%是正常缓冲;报5%,多出的3%里有一大半会在月底变成利润**,因为废品并没有真的发生。它的隐蔽性在于形式:一个百分比,不是一个钱数,新手扫一眼"5%"毫无感觉——换算成钱就有感觉了。带你算:500顶按2%损耗备裁510顶,按5%备裁525顶,差15顶;这15顶的成本按出厂价口径算,15×¥17.5≈**¥260**——你的单子小,¥260像是小事;把量级放大到产业带的日常,一个3万顶的美单,3个点的差=900顶,按¥16算就是**¥14,400**——一个百分比数字改一改,一辆电动车就从报价单里开出去了。**比例项的可怕就在这:它跟着规模长,而看上去永远只是个位数。**

反方向的坑同样要讲,因为新手懂了这节之后最容易矫枉过正:把损耗率往1%以下砍。工厂答应了,你以为又赢了——生产波动不会因为报价单改了就消失,损耗真发生了怎么办?两条路:要么**缺数交货**,500顶到手488顶,你对Mike的500顶承诺当场穿帮;要么**次品充数**,把本该剔除的边缘品塞回箱里凑数——第11章验货时你会见到"让步接受"这个词,源头有一半埋在这里。**损耗率的正确目标不是最小,是诚实**:让它如实覆盖波动,然后用条款锁住两头。

对话样本,当初你和老纪核这栏:"损耗按几个点报的?"老纪:"两个半。你这单绣花在外发厂,我多备了2%的裁片给他们练手感,绣废的算他们的,不摊你头上。"——这句话信息量很大:损耗率的归属是可以谈的("绣废算外发厂的"是胶州绣花配套成熟才敢说的话,见6.2.1),多备裁片是行业常规操作(备的布钱在1.5.1那60米里早留过余量)。而一个反面样本长这样:某厂报价单损耗率一栏印着5%,你问为什么,对方答"我们一直这么报的"——**"一直这么报"翻译过来是"从来没人问过"**,你一问,下一版报价单就变成3%了,一句话省¥170。

本节动作,三件:①凡报价,要求**损耗率单列并写明比例**——它藏在总价里你连问的入口都没有;②套阈值:**2-3%签字,4%以上必须让对方说出这单特殊在哪**(难款、新款、深色布高危这类理由可以成立),**低于1.5%的自己主动加回去**——那不是便宜,是隐患;③PI数量条款写"**足数交付**":交付数量不低于订单数,损耗是工厂的成本项、不是你的风险项——这行字把"缺数交货"的门焊死。

### 9.6.2 管理费与利润:工厂真正留给谈判的空间

最后两层一起看:管理摊销1.8,毛利1.9,合计3.7,占报价的21%。先把1.8的内容说实:厂房租金、水电、设备折旧、办公室里不上产线的人——老纪的提成、小周的工资、财务、单证——全厂的月开销除以月产量,摊到每顶帽子头上的结果。这1.8其实也谈不动:8条线的厂,固定开销是死的,产量是产能定的,除法做出来就是这个数;它和毛利的区别只在于,**毛利是工厂"想赚"的,管理摊销是工厂"必须收"的**。所以整张报价单从上到下捋一遍,你会得出一个此前想不到的结论:材料辅料是市场价,绣花是外发价,工缴是工价表,损耗核到诚实,管理是除法——**真正搬得动的,只有毛利那1.9,而它一共只有11个点**(见7.2.1)。

这就是7.2.1立过、现在正式交到你手里的那条谈判阈值:**对工厂的还价,常规空间就在3-5个点以内。**带你把这几个点换算成钱,建立体感:17.5砍3%≈让5毛,到17.0;砍5%≈让9毛,到16.6——这已经把毛利1.9砍掉将近一半,是工厂咬着牙能接的极限;再往下,16.0以下,毛利见零,报价跌破成本线15.6只剩退税撑着(9.7.3讲这种极端打法的条件)——工厂但凡接了,钱一定从9.2.2和9.3.2的手法里回来。**所以"有人爽快答应你砍10个点"不是谈判胜利,是配置降级通知书**——这句话第7章说过一遍,放在报价单前再说一遍,因为此刻你终于能逐格指出那10个点会从哪几格漏走。

3-5个点怎么谈下来,姿势比力气重要。核心原则:**给工厂一个成本真的下降的理由,让降价有出处,而不是让它凭空出血**。理由清单按有效性排:第一,**翻单与年度量**——把你的四SKU规划亮出来(6.2.2教过这一手),工厂按"年度客户"给你定位,翻单省下的换款损耗和学习成本(见4.4.2)是真金白银,它让得有依据;第二,**排产配合**——"交期我不卡死,你插空排"(插单与排产的价值见4.7.3),给工厂调剂产能的自由,值一两个点;第三,**付款干脆**——下一节展开;第四,**规格清爽**——规格表、trim sheet、.dst一次给齐,打样一次过,业务和版房在你身上花的时间少,这类"好伺候"的客户,报价时手就是松半分。注意这四条全都成立在**你专业**的前提上——9.1.2说过工厂对你有两个判断,"会算"决定它不敢虚报,"值得长做"决定它愿意让利。

你当初的实战收在这里做样本。你试探过一句:"16.5行不行?"老纪的回答是一道选择题:"16.5可以做——扣换塑料排扣,或者绣花密度降一档,你选一个。"——注意他没说"不行",他把价格问题翻译回了配置问题,这是老业务的标准动作,你从中该学的是:**报价谈判的终点从来不是一个数字,是"这个数字对应哪套配置"**。你最终一分没砍,保住全配置按17.5成交,但要来了三样不花钱的东西:翻单阶梯写进报价备注(3000顶¥16.6、10000顶¥16.0,数字的机制下一节拆);报价有效期从30天延到45天——盖住打样往返的周期(见1.4.3的时间量级),防的是"样品确认完,报价过期涨价"这一手;制版费一栏彻底划掉。**不砍价,不等于没谈判;把弹性用在锁条件上,比用在磨数字上,回报高得多。**

本节动作:把谈判前的功课固化成三步——**①自己拆BOM,算出成本合计;②报价−成本=毛利,毛利在8-15个点之间属正常报价;③还价瞄准3-5个点,每让一个点都要能说出对应的理由(量、排产、付款、配置)**。以及一条底线纪律:对报价低于你拆出的成本合计的单,不谈判,先查货(见9.2.2)——便宜到不合理的价格不需要谈判技巧,需要的是警惕。

## 9.7 价外五变量

### 9.7.1 数量阶梯与淡旺季:同一顶帽子的四个价

报价单核完了八层,还没完——**报价单上那个数,只在四个隐藏条件下成立:这个数量、这个季节、这个付款方式、这个汇率**。条件一变,同一顶帽子就是另一个价。这一小节讲前两个变量,它们决定的价差,比你在9.6.2磨半天的3-5个点大得多。

先看数量。老纪应你要求写进备注的那行阶梯,展开成表,就是"同一顶帽子的四个价"的前三个:

| 场景 | 单价 | 相对你这单 |
|---|---|---|
| 500顶(你这单,初夏下单) | ¥17.5 | 基准 |
| 3000顶 | ¥16.6 | −5% |
| 10000顶 | ¥16.0 | −8.5% |
| 500顶,改在秋冬旺季下单 | ¥18.4-18.9 | **+5-8%** |

**数量阶梯**——单价随订量分档递减的报价结构——递减的每一格都有机制,不是工厂心情。拆给你:其一,**固定成本摊薄**,这是1.5.2讲染缸、2.3.4讲织唛、2.4.3讲分码时同一个逻辑的总爆发——调机、换款损耗(见4.4.2)、制版(若工厂出)是死数,除以500和除以10000,单顶差出几毛;其二,**采购档位跳变**:3000顶用布约510米,跨过整缸起染量的门槛(见1.5.2),不但能开缸做定制色,布价本身按整缸拿也省几个点;辅料同理,扣具按整箱、织唛按万枚,单价全部下一档;其三,**排产价值**:3000顶能让一条线连开三天不换款,工厂让利买的是这份"不折腾"(见4.4.2的翻单红利,同一个机制)。倒过来用才是这张表的真正价值:**拿大单报价做小单预算,必死**——你在1688看到的"¥13.9同款"标价,标的是万顶阶梯的价(它还有另一半解释,9.7.3见),拿它去预算500顶的单,报给客户的价格从第一天就是亏的。所以铁律:**询价必带数量,报价必问阶梯**——阶梯要来不花钱,还顺手锁定了翻单价,一举两得。

再看第四个价:季节。**淡旺季**是产业带的呼吸节律,胶州的美单日历6.2.2给过:北美春夏戴帽,倒推回来,头年秋冬到次年开春是抢产能的旺季,四到六月之后放缓入淡。同一张500顶的单,淡季是"插空正好的正餐",旺季是"排期表上被大单挤来挤去的添头"——价格贵5-8%只是明账,暗账是交期:旺季报价单上的35天,兑现率要打个问号(旺季插单的门道见4.7.3)。你这单六月底谈、七月生产,踩在顺风口上,17.5和35天都拿得又稳又值——6.2.2说过,同样的单放到十一月去谈,价格和交期都会硬一截,现在你知道"硬一截"的刻度了:一顶帽子一块钱上下。这个变量马上有实战用途:Mike要是满意,翻单大概率谈在秋天(交付后30天是返单黄金期,第24章讲)——那正是胶州的旺季门口,**翻单窗口要么赶在旺季前锁价锁排期,要么用今天备注里那行阶梯价说话**,这也是你当初坚持把阶梯写进报价单的原因之一。

事故一单,把两个变量拧在一起:一位同行春天给客户报了促销帽单价,按当时淡季行情¥14报的,客户内部审批拖到十月才下单,他没重新询价直接下厂——工厂按旺季价¥15.1回签,他对客户的报价已经锁死,一进一出,1200顶的单,毛利被季节差吃掉¥1300,白做。教训写成条款就一句:**给客户的报价注明有效期(和工厂给你的有效期对齐),过期重询**——季节是会动的,你的报价单不能装作它不动。

本节动作:①询价模板里"数量"一栏改成三档并排(如500/3000/10000),一次询价拿三个价,阶梯白送;②在日历上标出你所在品类的产业带旺季(胶州:秋冬到开春),**大货和翻单尽量排淡季,旺季只抢交期不砍价**;③给客户的每一张报价单,右下角写上有效期。

### 9.7.2 付款方式与汇率buffer:报价里的金融项

报价单最底下两行小字,当初你几乎跳过没看:"付款:30%定金,70%见提单副本""汇率按7.15计,有效期内有效"。现在的你知道,这两行是报价单里的**金融项**——它们不改变帽子的成本,却实实在在改变价格,因为它们分配的是另外两种东西:**资金占用**和**汇率风险**。

先拆付款。30/70是外贸订单的经典结构:30%定金下单时付,70%尾款见提单副本付(T/T电汇的管道细节见14.1,这里只看它对价格的作用)。带你算工厂的账:你的定金30%×¥8,750=¥2,625,而工厂开工要先垫的面辅料采购是5.0×500=¥2,500——**30%定金的行规不是拍脑袋,它刚好盖住工厂的材料垫资**,工厂垫的是工缴和时间,你押的是货权,两边风险对齐(这个"定金要盖住垫资"的设计思想,14.5.1轮到你自己用——到时候你要算的是Mike的定金盖不盖得住你给工厂的定金)。既然付款结构分配的是资金占用,它就可以交易:**全款前TT——货没做先付100%——可以换1-2%的价格优惠**,因为工厂零垫资零风险;反过来要账期(货到付款、月结)的,价格加2-3%,加的是工厂的资金成本和坏账风险。但这里立刻要补一条纪律,比那1-2%重要十倍:**新工厂的首单,永远不要用全款换优惠**——尾款是你对货质量的最后一道抓手(11.6.2会讲"尾款是最后的筹码"),为省一两百块把筹码全部提前交出去,是新手最不划算的交易。你这单30/70一分没动,正确。

再拆汇率那行小字。工厂报美金价要过一道折算,用的不是当天银行牌价,是财务定的**内部汇率**——通常比即期低1-2%,给自己留一层**汇率buffer(缓冲垫)**:美金收进来到结汇有时间差,人民币升值一分,工厂的真实收入就掉一分,buffer就是预吃这口波动。落到数字上:¥17.5按即期7.1折是$2.465,按压低1.5%的内部汇率7.0折,就报$2.50——多出的3分半美金就是垫。**判断法很简单:拿计算器把美金价×即期汇率折回人民币,高出人民币口径的部分,就是藏在报价里的buffer。**有意思的是你这张单反着来:脚注写着7.15,17.5÷7.15=2.448,老纪凑整报了**2.45**——按即期7.1折回来只有17.40,比人民币口径还低一毛,等于buffer没留、还倒贴了个零头,山东报价的直爽(见6.2.1)连汇率折算里都看得出来。懂了这层,两件实务立刻通了:其一,**工厂美金报价"突然涨了"未必是成本涨**,可能只是财务把内部汇率调了——追问一句"人民币口径变没变",一句话分清真涨价和汇率调整;其二,报价单和PI里要有**汇率条款**:"汇率波动超过±2%,双方重新协商价格"——这行字对双方公平,人民币急升时保工厂,急贬时保你,没有它,汇率剧烈波动的月份里总有一方想毁约。

一场事故讲给你听,主角是没看小字的人。一位同行接美国客户$2.60/顶、8000顶的单,对工厂锁的是人民币价,中间隔着自己收美金、付人民币的敞口;签单到收尾款四个月,汇率从7.2走到6.9——每美金少收3毛,8000顶×2.60×0.3≈**¥6,200**,他这单的毛利本来才一万出头,汇率一口吃掉六成。他的错不在没能预测汇率——没人能——在于敞口全裸:既没在报价里留buffer,也没写重议条款,更没做任何锁汇动作(锁汇的入门概念见14.5.2)。**汇率不是高级话题,是每一张跨币种报价单里都躺着的一行小字**;你现在单小,一单的敞口几百块,正好用小学费养成看小字的习惯。

本节动作:给报价单加一道"三行小字检查"——**①付款条款:结构是什么、能不能用它换价、该不该换(新厂首单不换);②汇率脚注:美金价×即期折回来,和人民币口径差多少;③有效期:多长、盖不盖得住你的决策周期**。三行都看完,这张报价单才算读完了最后一页。

### 9.7.3 退税:工厂报价为什么敢贴着成本(承接8.1,详见18.3)

价外五变量的最后一个,也是最反直觉的一个。核完全部八层之后,留一个思想实验:如果哪天你收到一张**¥15.8**的同规格报价——低于你拆出来的成本合计15.6只差两毛,工厂几乎零毛利甚至贴钱——第一反应当然是9.2.2教的:查减配。但确实存在一种可能,货是真的、配置是足的、工厂也没疯,它靠的是报价单之外的一笔钱:**出口退税**。

机制的完整版在18.3,原理在这里给够用的一层。工厂采购面料、辅料、支付加工费时,价款里都含着增值税,这部分叫进项税;国家对出口货物实行退税——货物报关出口后,把出口环节对应的进项税按**退税率**退还给出口企业,帽子类的退税率约**13%**。注意两个关键限定词:退给"**出口企业**"——谁的名义报关出口,退给谁,这就是为什么帽厂旁边总挂着第二块牌子:驻厂第一天你就注意到办公楼门口"帽厂+外贸公司"两块招牌(双主体的三个原因见8.1),出口和退税走的是外贸公司那块牌子;退的是"进项对应的税"——不是出口额×13%照单全退,名义上限17.5×13%≈¥2.3,实际能落袋的受进项票齐不齐、各环节税额多少的约束,七折八扣,**落到这顶帽子上约¥0.8-1.2的现金回流**(详细的计算路径18.3拆)。

现在把这笔钱放进工厂的损益里看,你就懂了"敢贴着成本"的底气。正常报价:毛利1.9+退税约1.0≈**每顶真实落袋2.9**——7.2.1说过,退税对一个11个点毛利的工厂"接近毛利的一半",工厂活着的三根柱子里它是实打实的一根。极端报价:把价压到成本线15.6,账面零毛利,退税那¥1.0照拿——**对追着量跑的工厂,这依然是一门生意**:线不能停(停线的账见7.2.1),零毛利接单养住产能,退税就是利润本身。1688上那顶¥13.9的"同款",现在你手里有完整的三把解释刀了:减了配(9.2.2/9.3.2)、万顶阶梯价(9.7.1)、退税折进价里的走量打法——三把刀轮着比对,基本没有解释不了的低价。

但"退税打法"有严格的成立条件,这正是你判断真假的抓手,三问:**一问量**——退税是按单结算的现金流游戏,只有量大、周转快的单玩得转,500顶的定制单报出贴成本价,不是退税打法,是钓鱼;**二问款**——贴成本抢的都是白帽、素帽这类标准款(见6.5.1的现货逻辑),你这种带8800针绣花、金属扣的定制款,人家犯不上;**三问出口**——退税的前提是自营出口、票据链完整,连出口权都没有的小作坊报低价,和退税半毛钱关系没有。三问过不了的低价,回到9.2.2查货。

最后把这个知识点转个身——它不只是"理解工厂"的钥匙,**它就是你自己的钱**。这一单是工厂的外贸公司出口、退税归它,那约¥500(500顶×¥1)的现金流已经算在它给你的17.5里了(换句话说:没有退税制度,这个价还要高几毛)。但往后走,当你有了自己的出口主体、以自己的名义报关(主体怎么设立见25.1,报关见18.2),这13%就退进你自己的账户——**对一个毛利以个位数点计的行业,退税不是补贴,是商业模式的一部分**;第18章会教你把它从"工厂的底气"变成"你的利润表科目"。

本节动作:把低价三问做成条件反射——**量、款、谁出口**;并在你的供应商档案里给每家厂加一栏"出口主体":有没有自营出口权、退税走谁——这一栏此刻看着闲,谈价时它解释对方的底线,签约时它决定单证和货款的流向(见8.1.2),到第18章,它决定你自己能不能碰到那13%。

## 9.8 询价SOP:锁规格→三家询价→拆分→问why→入PI(主线R&B询价实战)

夜里快十二点,报价单核完最后一行,你从文件夹里又抽出两页纸,和它并排铺开——东莞那家的报价单,和义乌档口老板娘发在微信里的两行字。三张纸凑齐,一个多月前那十来天的询价全程,今晚可以用"现在的你"完整重演一遍——第6章你复盘过一次"为什么选胶州这个产业带"(见6.7),这一遍不一样:**产业带回答的是"去哪问",这一遍回答的是"怎么问、怎么核、怎么定"**——五个步骤,每一步都有当时的实景,合起来就是往后你每一单都要走的询价SOP。

**第一步,锁规格。**摸底电话之前,你先花了一晚上打包"询价包":规格表v1.1(见2.5.2,十五栏无一留白)+面料需求卡(第1章工具)+trim sheet(见9.3.1)+你自己的.dst与色序表+数量500+期望交期+付款意向。这一步是五步里最不起眼、也最值钱的一步,道理一句话:**规格不锁死,三家报的就是三顶不同的帽子,后面所有比价都是比寂寞**——A厂按180克素帽理解、B厂按240克精品理解,报价差三块,你以为是价格差,其实是产品差。反面教材天天在1688上演:甩一张logo图片问"这个帽子多少钱",得到的报价从9块到22块都有,每一个都"没错",每一个都没用。

**第二步,三家询价。**那个晚上的三通电话,6.7记录过原文,这里补上你当时的问法:同一个询价包,三个产业带各发一家(怎么从茫茫供应商里筛出这三家,是另一门手艺,第12章整章教),电话跟进。东莞,业务员语速快:"这个配置我们做得漂亮,¥21,300顶起也接;常规25天,加急15天。"胶州,老纪沉默十几秒像在按计算器:"这个配置,¥17.5。制版费另算,200,翻单免。交期下单后35天。"——你说版自有,他那头"哦?"了一声,语气立刻不一样了:"那你这单清爽,.dst发我。"义乌,老板娘直接笑了:"磨毛斜纹240克,定制?没有的,现货最厚也不到200克。要logo隔壁给你绣,¥8的帽子绣完合11块——但你说的那个厚实劲儿,跟这个不是一个东西。"**三家至少一家跨产业带**,是这一步的要领:同带的两家报价互相印证,跨带的那家给你坐标——义乌这通电话看似"无效",其实它告诉你这单的地板价在哪、以及为什么你不能睡在地板上。

**第三步,要拆分。**东莞和胶州各要了大项。胶州:面辅料5.0/绣花4.0/工缴4.4/管理杂项利润4.1(9.1.2的原文)。东莞:面辅料6.2/绣花4.4/工缴5.6/管理与利润4.8,合计21。两张拆分并排,差价3.5的去向一目了然:面辅料贵1.2(小批采购、广东辅料档次默认往上配),绣花贵0.4(千针0.5对0.45),工缴贵1.2(广东工价,见6.3.2),毛利厚0.7。**拆分的价值在这一刻兑现:¥3.5的总价差,被拆成了四笔各有名有姓的钱**——没有拆分,你只能感叹"东莞好贵";有了拆分,你看到的是"贵的每一块钱都对应一种我用得上或用不上的能力"。

**第四步,问why。**这是新手和老手在询价里分野的一步——新手问"能不能便宜",老手问"为什么"。你当时的三组问题,原样记录:问东莞:"同规格比胶州贵3块5,贵在哪?"答:"我们版房当天出纸样,车工平均工龄八年,小单也走快反线——你要改款、要赶两周的急单,这钱花得值。"——真话,不是托辞,但你拿它对照自己的单:版你已有、款已定、35天交期宽裕,**每一项溢价对应的能力你都用不上,为用不到的能力付钱,是采购里最体面的浪费**。问胶州:"损耗率几个点?绣花外发谁管品质?翻单价格怎么算?"老纪答得具体(损耗两个半、跟单员盯外发首件、阶梯价可写进备注)——**能把why答到细节的,报价大概率是实的;答不到细节的,再低的价都要打问号**(9.2.1面料栏那家,就是死在why上)。问义乌的问题只有一个:"克重多少?"——一问出局,但这条路线你记进了笔记:哪天接到"300顶以下、一周要货、预算见底"的单,现货+成品绣花是唯一的活路(见6.5.1)。

**第五步,入PI。**比价、验证做完,选定胶州,最后一步是把询价的成果**钉进文件**:所谓PI(proforma invoice,形式发票——双方签认的订单确认文件,逐栏精讲见15.5),你在后来签它的时候(打样满意之后的事,下一章讲),把三样东西作为附件钉了进去:规格表v1.1+trim sheet、大项拆分价、以及备注栏的翻单阶梯与"版客供、制版费免"——**询价拿到的每一个承诺,不进PI就等于没发生**;进了PI,它们从"老纪说的"变成"合同写的",翻单时按项调整、验货时按栏对照,9.1.2那段话术里许诺工厂的好处,兑现闭环也在这里。

最后是决策本身,今晚重看,你当初做对的地方比想象的多:没有选最便宜的11块——那不是便宜,是另一顶帽子;没有选最贵最稳的21块——稳是真的,但为用不上的能力多付¥1,750(3.5×500),等于把给Mike报价里两个点的毛利白送掉;选了**每一栏都核得过、产业带人设吻合、why答得出细节**的17.5。6.7教过"报价偏离产业带人设必有蹊跷"——这句话的正面表述,就是你的成交逻辑:**选的从来不是最低价,是最诚实的那张报价单。**你把三张纸摞好放回文件夹,关台灯。窗外车间的夜班还亮着灯——里面那批正在车缝线上流转的裁片,就是这张报价单一行一行长出来的实物。

本节动作:把五步SOP抄成清单贴在询价流程第一页——**锁规格(询价包五件套)→三家询价(至少一家跨产业带)→要拆分(大项起步)→问why(不问"能不能便宜")→入PI(承诺全部落纸)**——从下一单起,一步不跳。

**工具二:询价SOP五步清单(含话术)**

1. **锁规格**:询价包五件套——规格表+面料卡+trim sheet+logo文件(有.dst发.dst)+数量/交期/付款意向。规格不锁,比价作废。
2. **三家询价**:至少一家跨产业带(见6.7决策表);同一套询价包同时发,报价单收齐再谈。
3. **要拆分**:话术照抄——"我不是拿去比价的,是要锁规格:每栏对应什么档次写清楚,翻单按项加减,不用整单重报。按大项给就行:面辅料、绣花、工缴、其他,四栏。"
4. **问why**:不问"能不能便宜",问"这栏为什么是这个数"——"面料折下来米价17块6,什么规格?""比另一家贵3块5,贵在哪?""损耗按几个点报的?"——答得出细节的价才可信。
5. **入PI**:规格表与trim sheet作附件、拆分价与阶梯价入备注、制版费归属写明、损耗"足数交付"、汇率±2%重议、报价有效期对齐——询价拿到的承诺,不落纸等于没发生。

> **本章作业**:把任意一个logo(自己画一个也行)发给1688上三家定制帽厂询价,规格用第1、2章练出的标准话术锁死,数量分别报200顶和2000顶,并要求:按千针报绣花、制版费单列、给大项拆分。把六份报价填进"工具一"那张核价卡逐行核——面料反算一遍、绣花针数问一遍why、损耗率看谁单列了。你会亲手抓到本章讲过的至少三种现行:两个数量档的差价(数量阶梯)、同一栏两家规格对不上(锁规格失败的代价)、以及某一栏问不出why的含糊(那就是水分本身)。抓到的每一处,都是这一章长进你身上的部分。

*报价单核完了,每一行都对上了号——只剩一个当时让你来回折腾了十来天的环节还没复盘:样品。工厂寄来的第一顶样品差在哪、封样封的是什么、产前样为什么救了你一次,明天晚上接着回忆:[第10章 打样的艺术](chapters/ch10.md)*
