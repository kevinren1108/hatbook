### 25.1.2 海外主体的时机与双主体组合

先泼一盆冷水:**九成的新人不需要海外公司,而九成的新人在第一年就想开一个。**

原因很好理解——"香港公司"这四个字听着就国际化,中介的广告里全是"零关税、免税、自由收汇"。但一家香港公司的真实年成本是:公司秘书与注册地址HKD 3,000-6,000、**法定审计HKD 6,000-15,000(强制,不做审计报不了税)**、报税与年审杂费,合计折人民币**¥1.5万-2.5万/年**。你今年的全年毛利大概三万多,开一家香港公司要吃掉一半以上。

所以这一节先回答"什么时候",再回答"怎么配"。

**三个真正的触发场景,每一个都是客户或平台逼出来的,不是你想出来的:**

**场景一,客户要本地合同或本地付款。** 北美稍微上点规模的公司,采购系统里有"供应商入库"这道关:要W-9或W-8BEN-E表、要本地银行账户做ACH付款、要签他们的标准采购合同。你一个中国自然人或中国公司走完这套流程要三个月,而一家美国LLC三天就进去了。**判断信号:当客户说 "our AP system can't pay overseas vendors" 时,这一条就触发了。**

**场景二,平台入驻。** 亚马逊北美站中国主体可以开;但Shopify的Stripe收款、部分独立站支付通道、以及一些B2B批发平台,要求本地实体和本地银行账户。欧盟站还要处理VAT注册与GPSR责任人(见25.5)。

**场景三,品牌注册与资产持有。** 你要在美国注册商标(见25.4.2)、要做亚马逊品牌备案、要持有独立站域名和品牌资产,把这些放在一个海外主体名下,比放在个人名下清爽得多——将来这门生意要卖、要引资、要给合伙人分股,资产是打包好的。

**香港与北美主体的差异,一张表说清:**

| | 香港有限公司 | 美国LLC(特拉华/怀俄明等) | 加拿大公司 |
|---|---|---|---|
| 注册成本 | HKD 5,000-10,000(含首年秘书) | USD 100-500官费+注册代理USD 50-300/年 | CAD 200-450 |
| 年维护 | ¥1.5万-2.5万(**含强制审计**) | USD 200-600(年报+州特许税+报税) | 年报+报税,¥5,000-1万 |
| 银行开户 | 实体银行较难(要业务证明);持牌虚拟银行较易 | 拿EIN后线上开(Mercury/Wise Business等),快 | 部分省要求本地董事,较难 |
| 所得税 | 利得税两级:首200万港币利润**8.25%**,超出部分16.5%;境外利润豁免需申请且审核严 | LLC默认**穿透课税**:非美居民、无美国境内实质经营时通常不缴联邦所得税,**但必须报表**(5472+1120形式申报),漏报罚款USD 25,000起 | 联邦+省,小企业合计约12%-15% |
| 收汇 | 多币种自由兑换,无外汇管制 | USD账户,ACH/Wire | CAD本地账户 |
| 最适合 | 收汇、转口、持商标,中国老板最熟的一档 | 面向美国客户签约收款、上平台、注册美标 | 客户集中在加拿大且要求本地采购 |

**双主体怎么配合——这里有一个你已经见过的模型。** 第8章开头,你在工厂门口看见两块牌子:一块"胶州××制帽有限公司",一块"青岛××进出口有限公司"(见8.1.1)。老板这么切,图的是退税载体、风险隔离、接单灵活三件事。**你现在要做的是同构的一件事,只不过那条边界从"生产/贸易"挪到了"境内/境外":**

```
【海外主体】香港公司 或 美国LLC
   ├─ 与客户签约、开CI、收美元/加元
   ├─ 持有商标、域名、平台店铺
   └─ 向国内主体采购(付美元)
          │
          ▼  一笔正常的跨境采购,有合同、有发票、有报关单
【国内主体】有限公司 + 进出口权 + 一般纳税人
   ├─ 向工厂采购(收13%专票)
   ├─ 以自己抬头报关出口(境内发货人 = 你)
   ├─ 收汇、结汇、退税
   └─ 报关金额 = 卖给海外主体的价
          │
          ▼
      【工厂】
```

看懂这张图,你就同时看懂了三件事:**海外主体赚的是"客户价 − 内部结算价"的差,国内主体赚的是"内部结算价 − 采购价"的差再加退税;报关单上第一栏终于是你自己;而Mike的会计要的那张"registered company invoice",由海外主体或国内主体开都成立。**

但这里有两条线,踩上去比不开海外公司还惨,必须写清楚。

**第一条线:转移定价。** 两个主体都是你的,是**关联方**。你在中间怎么定价,税务上叫**转移定价**,必须遵循**独立交易原则**——即"和不相关的第三方做同样的交易会是什么价"。如果你把国内主体的利润做成零、利润全留在香港,《企业所得税法》第六章"特别纳税调整"允许税务机关直接调整你的应纳税所得额并加收利息。给新人的安全口径:**国内主体保留5%-8%的贸易毛利**——这个数和市场上外贸公司的实际水平一致,解释得通、经得起问。

**第二条线,更常见也更致命:居民企业认定。** 你人在中国,用中国的电脑、中国的手机操作那家香港公司,所有决策、所有客户沟通、所有资金指令都从中国发出。按《企业所得税法》,**实际管理机构在中国境内的境外企业,属于中国居民企业,要就全球所得按25%缴中国企业所得税**。也就是说,那家你花两万块一年养着、以为在按8.25%交税的香港公司,可能法律上一直该按25%交。中介绝不会跟你讲这一段。

所以时机规则,一句话:**先有客户或平台逼着你办,再办;不要为了"看起来国际化"提前开。**具体阈值,命中**两条**再动手:

> ① 北美客户的年采购额超过¥50万,且明确要求本地合同或本地付款;
> ② 你要做独立站并用Stripe/Shopify Payments收款;
> ③ 你要在美国或加拿大注册并持有自己的商标(见25.4.2);
> ④ 你的年利润已经稳定超过¥30万——低于这个数,¥2万的年维护费不划算。

本节动作:做一张"**海外主体触发卡**",四条阈值写在上面,贴在你记账表旁边。**每个季度对一次**,两条同时亮再动。在那之前,遇到客户问 "Do you have a US entity?",标准回答是:"Not yet — we invoice from our Chinese company, which is a registered exporter with full export documentation. If your AP system needs a US vendor, tell me and I'll set one up before your next PO." 这句话既诚实,又把决定权还给了客户——**而客户十次里有九次会说"没关系"。**

## 25.2 资金通道

### 25.2.1 对公收汇与结汇流程

执照下来得比你想的快。**九个工作日后**,你抱着一沓材料坐在银行的对公窗口前,对面的客户经理问了你一个你答不上来的问题:"你们做外贸的话,名录办了吗?"

你说:"什么名录?"

**贸易外汇收支企业名录**,外汇局的说法是"名录登记",行内也叫**货物贸易外汇监测名录**。定义钉死:**企业办理货物贸易项下的外汇收支之前,必须先在外汇管理部门办理名录登记;不在名录里的企业,银行不得为其办理货物贸易外汇收支。**这是2012年货物贸易外汇管理改革之后的制度——那次改革取消了出口收汇核销单、取消了待核查账户(所以老一辈说的"买核销单"是过时黑话,见18.2.2),改成**企业名录管理+总量核查**。

办理很简单:现在多数地区可以在银行代办或在外汇局网上服务平台自助办,**当天到三个工作日,免费**。但它是一道硬闸——**你的公司即使办齐了18.2.1那六件事,名录没登记,美元照样进不来。**

登记完你就有了一个身份标签:**名录企业的A/B/C分类**。

- **A类**:正常,享受便利化,单证审核简化,大部分业务线上办;
- **B类**:被列入后实行严格监管,货物贸易外汇收支要**逐笔到银行做电子数据核查**,业务量一大,你的时间成本立刻翻倍;
- **C类**:更严,收付汇需要事前逐笔登记。

怎么会掉到B类?核心是**总量核查**——外汇局的系统把你的**货物流**(海关报关数据)和**资金流**(银行收付汇数据)放在一起对,看两条线的总量匹不匹配。最常见的两个指标:**资金货物比率**(一定期间收付汇总额与进出口总额的比值)偏离过大,以及**贸易信贷报告**没做(预收货款超过30天、延期收款超过90天,且金额与占比超过规定标准的,要向外汇局报告)。

带你把主线代进去算一遍,一算就通:

```
R&B翻单:报关金额 CAD 4,950,收汇 CAD 4,950
资金货物比率 = 4,950 ÷ 4,950 = 100%   ← 干净

假如你报关只报了 3,000,收汇却收了 4,950
比率 = 158%                            ← 多出的2,920加元哪来的?系统会点你

再回头看你今年的做法(借抬头、个人卡收汇):
你的名录里:货物 0,资金 0
```

最后这一行值得盯着看三秒。**在监管的眼里,那不是"干净",那是"不存在"。**你做了一年、走了1,340顶帽子、收了一万四千多加元,而你的经营史是一张白纸——第18章说过这句话(见18.2.2第四条),现在你有了主体,才第一次有资格把它变成非白纸。

### 25.2.2 万里汇/PingPong/Wise:费率与到账

Dana那80顶结尾款的时候,发生了一件小事。你按老规矩发了银行电汇信息过去,她第二天回:

> "My bank charges CAD 45 for an international wire and wants a copy of your passport. Can I just send you an e-transfer?"

960加元的单子,45加元的手续费——**手续费占了货款的4.7%**,而且她还要跑一趟。这就是第14章说的那句话在现实里的样子:**成交是有摩擦的**(见14.4)。

第14章已经把第三方跨境收款的机制讲清楚了:平台给你一个**海外本地收款账户**,客户在他本国做一笔本地转账,钱进这个账户,你再提现结汇回国内。那一节留了个尾巴——"开户资质、结汇合规、能不能进对公,涉及你的经营主体,那一整套在25.2讲"。现在你有主体了,把这个尾巴收掉。

**先给全表。**六个通道,按你实际会用到的顺序排:

| 通道 | 客户端体验 | 你的综合成本 | 到账 | 能否结汇进**对公** | 能否关联报关单 | 适合阶段 |
|---|---|---|---|---|---|---|
| 银行T/T电汇 | 柜台/网银国际汇款,被扣15-45 | 固定CAD 15-30 + 点差0.3%-0.5% | 2-5工作日 | **天然是对公** | 直接关联 | 单笔 > CAD 2,500 |
| 万里汇 WorldFirst | 本地转账,免费、当天 | 提现费0.3%-1%(阶梯)+ 汇率加价 | T+1 | **能**(须开企业账户) | 支持 | CAD 500-5,000 |
| PingPong | 同上 | 0.3%-1% + 汇率加价 | T+1 | 能(企业账户) | 支持 | 同上 |
| 连连国际 / Airwallex | 同上 | 0.3%-1% + 汇率加价 | T+1~T+2 | 能(企业账户) | 支持 | 同上 |
| Payoneer | 本地账户+卡收款 | 1%-2%(信用卡收款更高) | T+1~T+3 | 能(企业账户) | 弱 | 平台回款为主 |
| Wise | 体验最好,客户端零摩擦 | 换汇费约0.4%-0.6% | 数小时-2天 | **不能**(对中国大陆的人民币入账长期受限) | 无 | **海外主体的钱包** |
| PayPal | 一键付 | **7.5%-8%**(见14.4) | 即时 | 提现可,但无贸易属性 | 无 | < $500的样品费 |

表里最后两行要特别讲,因为它们最容易被误用。

**Wise 不是国内主体的结汇通道。** 很多人看到Wise的汇率好、体验好,就想拿它当主力。但Wise对中国大陆的人民币转入长期不支持或受限,而且它本身不办理中国的结汇与国际收支申报——**换句话说,即使钱能进来,这笔钱在你的名录里也是"没有身份"的**。Wise的正确位置是:**你有了海外主体之后,用它收美元/欧元/加元并把钱留在海外**,付海外的商标代理费、平台广告费、检测费,只把需要付工厂的部分汇回国内主体。(各家规则常变,以你实际开户当天的政策为准——这句话对本节所有通道都成立。)

**PayPal永远不是"划算"的选择,它是"能不能成交"的选择。**这句话第14章写过,这里补一条主体相关的:**PayPal提现进来的钱,在贸易外汇口径里同样没有身份**,你没法拿它去关联报关单、做货物贸易收汇申报。所以它只能待在"样品费"这个抽屉里。

**开户之前必须问清的三个问题**,一个都不能少——中介和地推不会主动说:

1. **这个账户是个人账户还是企业账户?** 只有企业账户才能把结汇款打进你公司的对公账户,才能做国际收支申报。个人账户开起来快,但它把公司收入变成了个人收入,你还要再解释一次(见25.2.3)。
2. **结汇后的人民币能不能直接打进对公户?** 有些通道只支持打法人个人卡,那等于绕了一圈又回到老问题。
3. **能不能关联报关单做货物贸易收汇申报?** 这决定这笔钱算不算进你的名录总量(见25.2.1)。

**再讲费率的真相,这一段能替你省掉每年几千块。**官网写着"提现费低至0.3%"的通道,你实际到手往往少了0.7%-1%——因为**提现费只是第一层,第二层是汇率加价**。做法和第14章测PayPal那两层是一样的:

```
实测方法(十分钟):
  同一时刻,记下中国银行外汇牌价的【加元现汇买入价】,比如 5.196
  再看平台给你的成交价,比如 5.171
  汇率加价 = (5.196 − 5.171) ÷ 5.196 ≈ 0.48%
  真实综合成本 = 0.3%(提现费) + 0.48%(加价) = 0.78%
```

拿Dana那960加元把三条路算完,你就知道该走哪条:

```
银行T/T:  中转扣费 CAD 15 ≈ ¥78 + 结汇点差0.35% × ¥4,992 ≈ ¥17
           合计 ¥95 = 1.90%   (客户端还要自己出CAD 45)
万里汇:    0.78% × ¥4,992 ≈ ¥39 = 0.78%   (客户端 0)
PayPal:    7.8% × ¥4,992 ≈ ¥389 = 7.80%
```

第14章给过一个临界点公式,用你自己实测的费率重算一遍:

```
CAD 15 = (0.78% − 0.35%) × A   →   A ≈ CAD 3,488
```

**低于约3,500加元走第三方收款,高于它走银行电汇。**注意这个数比第14章算出的2,500高了——因为那次是按0.9%估的第三方费率,而你实测下来是0.78%。**这就是为什么费率必须自己测:每降低0.1个百分点,临界点就往上推一大截,而临界点决定你每一单走哪条路。**

按阶段配通道,最后收成一张梯子:

> **阶段0(还没有主体)**:只能个人账户,把金额压在样品费和小单上,一年别超过等值几千美元,**绝不分拆**(见25.2.3)。
> **阶段1(有公司,名录未办)**:先办名录,别急着让客户打钱。
> **阶段2(公司+名录+一般纳税人)**:>CAD 3,500走银行电汇,<CAD 3,500走第三方**企业账户**,PayPal只留给样品费。
> **阶段3(有海外主体)**:美元收在海外(Wise/Mercury一类),海外开支就地付掉,只把要付工厂的部分汇回国内主体结汇——顺带天然对冲了汇率(见14.5.2)。

本节动作:去开一个第三方收款的**企业账户**(不是个人账户),开完做第14章那个实测动作——让Dana或任何一个海外朋友汇100加元进来,记下实到、扣了多少、几天到,把两层成本算出来,填进上面那张表的"你的综合成本"一栏。**官网的费率是广告,实测的费率才是你的成本表。**

### 25.2.3 个人账户收货款:风险在哪

十一月的一个晚上,你潜水的那个外贸群里,一个做汽配的群友发了一句话:

> "我卡被冻了。三张卡一起。"

后面的对话你截图存了下来,因为它比任何一段说教都管用。他一年做一百多万,三年来一直用个人卡收货款,走的是一个"换汇的"朋友:客户把美元打到对方指定的香港账户,对方按当天汇率把人民币打进他的工商银行卡。手续费比银行低,当天到账,三年没出过事。

这次出事是因为**上游**——那个"换汇的"手里有一笔钱牵进了一起电信诈骗案。他的卡被外地公安**先止付48小时,随后冻结**;卡里27万动不了,名下另外两张卡同步冻结,微信支付宝一起停。他飞了两趟去异地配合调查,最终认定他不知情,**但钱解冻用了五个月**——那五个月里,他的工厂货款、房贷、孩子学费,全靠借。

这一节把这条路的三层定性讲清楚,不吓唬人,也不替它遮掩。

**第一层:分拆结汇的法律定性。**

**分拆结汇**这个词第18章已经出场过(见18.2.2)。它的法律依据很明确:境内个人的年度结汇便利化额度是**等值5万美元**,超过额度要凭真实、合法的交易凭证逐笔办理;而《个人外汇管理办法实施细则》**明令禁止个人以分拆等方式规避额度管理和真实性管理**。找五个亲戚各用5万美元额度,凑出25万——**这不是"用足政策",这是政策条文里点名禁止的行为。**

后果不是罚款那么简单:违规个人会被列入**关注名单**,**当年及以后连续两年**不再享受便利化额度,所有结售汇业务都要逐笔提交证明材料。翻译成生意话:**你的收款通道被关掉两年。**一门外贸生意,通道关两年,等于关门。

**第二层:对敲与地下钱庄。**

那个群友用的"换汇的",在监管口径里有个专门的名字。注意看那笔钱的走法:**你的美元给了他在境外的账户,他的人民币给了你在境内的账户——两笔钱各在各自的境内流转,没有一分钱真正跨过国境。**这叫**对敲**,是地下钱庄最典型的作业方式,法律定性是**非法买卖外汇**。数额达到一定标准的,按《刑法》第225条以**非法经营罪**论处;司法解释里"情节严重"的量级,常被引用的是非法买卖外汇**20万美元以上**或违法所得5万元以上。

你可能会说:我又不是钱庄,我只是用了一下。对——你不是主犯。**但你是这条资金链上可查的一环,而办案机关追查资金流向时,追的就是链条。**

**第三层:冻卡的机制,这一层最反直觉。**

公安机关办理涉诈、涉赌、涉洗钱案件时,可以对涉案资金**流向的下游账户**采取止付(通常48小时)和冻结(通常六个月,到期可续冻)。判断你是不是"下游"的标准,**不是你有没有过错,而是你的账户里有没有那笔涉案资金的流转痕迹**。

请把这句话读两遍:**冻卡不需要你有过错。**你可以完全不知情、完全善意、货真价实地做了一单生意,只要打给你钱的那个人的钱来路有问题,你的卡就在名单上。而且现在是"一人一户全查",一张卡出事,名下其他卡、第三方支付账户一起停。

**第四层,顺手把税这条讲了:**个人账户收的货款,不申报就是偷税;可你真想申报,会发现你申报不了——没有主体、没有成本发票、没有报关单,你连"按什么口径、交多少"都算不出来。**这条路最荒谬的地方在于:它连让你合法交税的入口都没有留。**

那为什么这么多人走了很多年没出事?**因为这条路的风险不是线性的,是"概率 × 毁灭性"。**一年不出事的概率也许有九成五,但出一次事的代价是:六个月现金流冻结、两年通道关闭、外加一段没法向客户解释的失联。用第13章的语言说(见13.1.1),这是一个**赔付上限不封顶的敞口**——而你没有为它买任何保险。

**合规替代,三条真实可用的出路**,按你所处阶段挑:

1. **还没有主体、只收小额样品费**:用第三方收款的个人账户可以,但**每一笔都要留下合同或邮件、发货凭证、收款记录**;金额压在等值几千美元/年以内;**绝不拆单、绝不借他人额度**。
2. **有单但主体还没办下来的过渡期**:找**外贸综合服务企业**(见18.2.1路二)代收汇、代报关、代办退税。它以自己的名义收汇结汇,把人民币结算给你,**费率0.5%-1%或¥300-800/票**;贵,但合法、有票、有痕迹,而且它会顺手把退税也给你办了——这一项常常就把服务费赚回来了。
3. **主体办好之后**:一律对公(见25.2.1)。个人卡只留生活消费,**公私账户从此不混**。

三条硬规则,拿去当纪律:

> ① **永远不要为了省一点点差,把一笔货款拆成几个人的额度收。**
> ② **永远不要通过"换汇的"完成货款的最后一公里**——他省你的那0.5%,买的是你全部账户的安全。
> ③ **任何要你"先在国内收人民币、再把外汇打到境外某账户"的帮忙,都是对敲,一律拒绝**,哪怕对方是你最熟的同行。

本节动作:打开你的手机银行,把过去12个月里所有**来路是境外货款**的入账列出来,一笔一笔标注"有没有对应的合同/发货记录/报关单"。标不出来的那些,就是你此刻真实的敞口。然后给自己定一个日期——**在那之前,把所有新单的收款切到对公通道上**。这件事和第18章办抬头一样,**没有中间选项。**

采购:500 × ¥17.5(不含票)             ¥8,750,无进项票,退税 0
完全成本(见19.5)                      ¥16,640
──────────────────────────────
毛利                                    ¥9,100
税:0(这门生意在账面上不存在)
落袋                                    ¥9,100
```

**结构B:公司有票 + 退税(明年的做法)**

```
收入(出口免税,不含增值税)             ¥24,936
采购:500 × ¥18.9(含票价)              ¥9,450
退税:500 × ¥2.19                       −¥1,095
──────────────────────────────
净采购                                   ¥8,355   ← 比结构A还低 ¥395
完全成本 = 16,640 − 395                 ¥16,245
利润总额                                 ¥8,691
企业所得税(小微实际5%)                 −¥435
──────────────────────────────
税后留在公司                             ¥8,256
若全额分红,个税20%                      −¥1,651
到你个人手里                             ¥6,605
```

**先说结论里最难听的那一半:合规是要花钱的。**这一单,如果你把利润全额分红拿出来,比"个人无票"少了¥2,495;如果你不分红、把钱以工资形式发给自己(年薪不超过6万基本不缴个税,还能税前列支),差额缩到¥800上下。**这笔钱是真金白银,谁跟你说"办公司完全不吃亏",他没算过账。**

**但这道题真正的答案在下面,而且它是一个反转。**把出货额从¥2.5万放大到¥100万,再算一遍:

```
【结构A · 个人无票,做¥100万】
  境内个人年度结汇便利化额度 = 等值5万美元 ≈ ¥36万
  你根本收不进来。要收,只能分拆 → 违规(见25.2.3)
  → **这不是划不划算的问题,是物理天花板。**

【结构B · 公司有票,做¥100万】
  退税  = 1,000,000 ÷ 1.13 × 13% ≈ ¥115,000
  企业所得税(按利润¥20万,小微5%) ≈ ¥10,000
  → **退税是税负的 11 倍。**
```

请把最后那行读两遍。**在小额阶段,合规是净支出;过了某个规模,合规是净收益,而且收益是税负的十倍量级。**那个转折点大致落在**年出口货值¥30万-50万**——这就是第18章那条阈值(见18.2.1)背后的算术,它不是拍脑袋定的。

再补三条你早晚会问的:

**其一,附加税费为什么可以忽略?** 城建税、教育费附加、地方教育附加是以**实际缴纳的增值税**为基数征收的。做外贸出口,增值税走免抵退、实缴为0,这三项自然也趋近于0。你要交的实质上只有企业所得税(利润的5%)和印花税(合同额的万分之三,一份¥100万的合同=¥300,小微还减半)。**很多人以为"办公司要交一堆税",真正咬住你的其实只有一种。**

**其二,目的国那端你要不要交税?** 分两种情形。**你走DDP专线、货到门为止、在加拿大没有任何实体和库存**——那你在加拿大不构成纳税义务,进口环节的关税和GST由清关代理作为进口人处理(见18.4.1)。**但只要你在目的国持有库存**(比如做了海外仓或FBA备货,见22.1.1),情况立刻变化:你可能被认定为在当地有经营存在,需要注册GST/HST并按期申报;若要自己做进口人,还要以非居民身份申请BN15。**做海外仓的人最常漏的就是这一条,漏了不是罚款,是账号被平台停售。**

**其三,Mike的会计到底要什么?**回到章首那封邮件。她要两样:一张公司抬头的发票(结构B里你天然就有),和**进口凭证以便抵回GST**。第二样你今年给不了——因为进口人是清关代理,不是R&B(见18.4.1、18.5)。所以明年这一单的正确解法是把条款从"专线包税到门"改成**DAP/客户自行进口**,或者找能出正规清关文件的DDP服务商(见18.5那条判断规则:客户是要抵扣GST/VAT的注册商家 → 必须走正规报关)。**这句话你要写进给Mike的回信里,因为它意味着到门价要重新报一次。**

本节动作三条:① **找一个做过外贸客户的代账会计**,不是随便找的——面试时问她一句"免抵退和免退税有什么区别",答不上来就换;② 每一票单独建一个"**税务三件套**"文件夹:增值税专用发票、出口报关单、收汇申报回单(见25.2.1),这三样是退税申报的全部弹药;③ 每个季度自己核一次:**这一季的退税到账了没有?**退税是现金流游戏不是利润游戏(见18.3.1),晚到两个月,你的资金周转就少转一圈。

## 25.4 知识产权

### 25.4.1 接单侵权:代工也跑不掉的责任

十二月的一个早上,一封询盘落进邮箱。发件人是美国中西部一家运动酒吧,要**200顶帽子,前幅绣一个队徽**,附件里的PNG你一眼就认了出来——某职业球队的标。邮件最后一句写得特别体贴:

> "It's just for our staff, not for resale."

你的手指在回复键上停住了。三个月前的你会立刻报价,因为这是一单毛利两千多块的活儿;现在你想起了第16章那份授权书(见16.7),和Mike那句 "our trademark is registered in Canada, not in China"。

先把机制讲透:**一个侵权的logo,会在四个地方炸,而且是同一枚炸弹的四个引信。**

**引信一,中国出口端。**商标权利人可以把商标做**知识产权海关保护备案**(见16.7),备案之后海关在口岸主动拦截疑似侵权的进出口货物。报关单上有一栏"是否涉及知识产权",报关行会问你这批货带不带品牌、带谁的品牌。**注意,现在你有自己的抬头了——被扣的不再是"某个挂靠公司",是你的公司名字。**

**引信二,目的国进口端。**美国CBP有商标记录制度(e-Recordation),加拿大有权利人协助请求(Request for Assistance),欧盟有海关执法申请。货到港被认定假冒的,常见结局不是退运,是**扣留并销毁,费用由收货人承担**。

**引信三,平台端,最快也最疼。**亚马逊、Etsy、eBay都有品牌投诉通道,权利人一封投诉,链接下架、库存冻结、账户资金冻结,申诉周期以月计。你的客户如果是卖家,他会立刻把这笔账算到你头上。

**引信四,司法端。**美国《兰哈姆法》对假冒商标可选法定赔偿:每个商标每类商品 **USD 1,000-200,000**;认定为**故意假冒**的,上限**USD 2,000,000**。中国《商标法》第63条有惩罚性赔偿(一倍到五倍)和法定赔偿(最高500万元)。

现在讲这一节标题里那句最反直觉的话:**代工也跑不掉。**

行业里流传很久的一个说法是:**涉外定牌加工**(境外委托方提供商标、境内工厂加工后**全部出口**、不在中国境内销售)不构成商标使用,因而不侵权。这个说法曾经有判例支持。**但最高人民法院在2019年的"HONDA"案中改变了这一立场**,认定涉外定牌加工不能一概免责——贴附商标的行为本身就是商标使用,是否在国内销售不是免责的当然理由。

**所以"我只是代工的""货又不在中国卖"这两句话,今天不是免责牌。**更要命的是责任形态:商标侵权责任是**可以连带主张**的,权利人可以起诉委托方(你的客户)、加工方(工厂)、出口方(报关抬头)中的任何一个或全部。而在实务里,**最先被抓住的永远是货**——货在谁的报关单上,谁先出面解释。

**下单前的三个自保动作,一个都不能省:**

**动作一,要授权书(见16.7)。** R&B那份就是标准样子:权利人全称、商标名称与注册号及注册国、被授权方、授权范围(款号RB-DH-001、数量500顶、用途出口至加拿大)、有效期、签字人姓名职务、日期。规则是:**凡是帽子上有客户的logo,一律要;不要问"要不要",直接说"这是出口流程的标准文件,模板我发你"。**成本零,耗时一封邮件。

**动作二,合同里写保证与赔偿条款。**在PI或销售合同里固定一段,英文原文你可以直接抄:

```
INTELLECTUAL PROPERTY: The Buyer warrants that it owns, or is duly
licensed to use, all trademarks, logos, designs and artwork supplied to
the Seller, and that their reproduction on the Goods does not infringe
any third-party rights. The Buyer shall indemnify and hold the Seller
harmless against any claim, loss, cost or expense — including customs
detention, storage, legal fees and destruction costs — arising from such
infringement, and shall reimburse the Seller for any goods detained,
seized or destroyed on this ground.
```

翻译成人话:**客户保证他有权用这个图案;如果因此出事,损失由他赔,包括扣货、仓储、律师费和销毁费。**然后说一句实话:**这一条不能让你不被扣货,它只决定被扣之后钱由谁出。**但它有个隐藏作用——**一个心里有鬼的客户,读到这一段会自己消失。**这比你自己去判断真伪高效得多。

**动作三,可疑图案先查商标。**免费入口就三个:中国商标网(查中国是否已被注册或备案)、美国USPTO的商标检索、加拿大CIPO与欧盟EUIPO的检索。查三样:**文字**、**图形**(按维也纳分类查图形要素)、**第25类**(服装鞋帽)。查不出来不等于安全,还要过一遍**版权**——卡通、影视、游戏形象受著作权保护,不需要注册商标也能告你;美国的大学校名与校徽几乎都由统一的授权机构管理,没有授权一律不能碰。

**红线清单**,出现下列任何一项,先要授权、要不到就放单:

> 职业联赛与球队(NFL/NBA/MLB/NHL及各队队徽) · 大学校名与校徽 · 卡通与影视游戏形象 · 音乐人与巡演标识 · 名牌LOGO及其近似标 · 国旗国徽与奥运五环等特殊标志 · "改了一点但一眼认得出"的仿标

**一个具体的翻车,你在群里见过全过程。**一个同行接了300顶巡演帽,¥14/顶,客户自称是"乐队的粉丝俱乐部",没要授权书。货在青岛报关时被扣——该乐队的商标早就在中国海关做了备案。结果:扣货核查28天、认定侵权、货物销毁、罚款;更贵的是,他挂靠的那家出口公司因为这一票被降了信用等级,当场终止与他的合作。**他损失的货款¥4,200和工厂已投产的料工费¥2,800都还算小,真正的损失是他从此在那条出货通道上没了位置。**

判断规则,一句话拿走:**当一个logo让你犹豫超过十秒,它就值得你花十分钟去查;查不清就要授权;要不到授权就放单**——并且记进你的放单记录(见20.4)。

那封邮件你最后是这么回的,措辞值得抄:

> "Happy to quote — one thing first. Because the artwork is a registered team mark, I'll need a written authorization from the rights holder (or their licensing agent) before production. It's a standard export document: Chinese Customs asks whether a shipment carries third-party marks, and without the letter the goods can be held at the port. If you can get it, I'll have a quote to you the same day. If not, I'd suggest we do your own bar logo instead — same price, and it's yours forever."

**注意最后那半句。**拒绝一个侵权单不等于丢一个客户——**你顺手给了他一个更好的方案:做他自己的标。**这一单他后来做了,150顶,绣酒吧自己的名字。

### 25.4.2 自有商标:国内注册与海外路径

上一节讲的是别人的商标怎么别踩,这一节讲你自己的商标怎么立起来——**以及一件你早在八月就该替Mike做、拖到十二月才做的事。**

**先说为什么SOHO也要有自己的商标。**四条理由,一条比一条现实:

1. **平台的硬门槛。**亚马逊品牌备案(Brand Registry)要求你在**目标站点所在国**有已注册或申请中的商标;没有备案,你连自己listing的图文都保护不了(见22.1.1)。
2. **防止你的名字被别人注册。**中国是**申请在先**原则(注册主义):**谁先申请,谁就是权利人**,和谁先用没有关系。《商标法》第32条确实禁止抢先注册"他人已经使用并有一定影响"的商标,但"有一定影响"要你举证销售额、广告投放、媒体报道——一个做了一年的新人几乎举不出来。**所以别指望法律给你补救,先申请是唯一便宜的办法。**
3. **它是可交易的资产。**商标可以转让、可以许可收费、可以质押。你这门生意做到第五年要引资或转让时,买家买的不是你的客户微信,是你名下这几件资产。
4. **它是定价权的起点。**第5章讲过OEM/ODM/OBM三档的毛利差(见5.3.1):代工5%-15%,自有品牌40%+。那道门的钥匙,就是一件注册商标。

**中国注册,完整流程与真实费用:**

```
① 起名 + 检索(1天,免费)
      在中国商标网查:文字近似、图形近似、第25类是否已被占
      ↓
② 提交申请(网上申请 ¥270/类/10个商品项;超出部分每项加 ¥27)
      ↓
③ 形式审查(约1个月,下发《受理通知书》)
      ↓
④ 实质审查(约4-6个月)—— 驳回的主要原因:近似、缺乏显著性、通用名称
      ↓
⑤ 初步审定公告 → **3个月异议期**(任何人可以提异议)
      ↓
⑥ 注册公告,发电子注册证
      
合计约 9-12个月;有效期 10年,期满前12个月内续展(另有6个月宽展期)
自己申请:两类合计 ¥540;找代理:¥2,000-4,000(含两类)
```

**类别怎么选——这是新人最常出错、也最贵的一步。**商标按**尼斯分类**分45类,保护是分类别的,注册了第25类不代表你在第35类受保护。做帽子的最小配置是两类:

- **第25类**(服装、鞋、帽、袜、手套):**这是你的产品类**,必须有;
- **第35类**(广告、替他人推销、商业管理、为零售目的展示商品):**这是你的"招牌类"**——你的公司英文名、独立站名、亚马逊店铺名对外做生意,靠的是它。

预算宽裕再加**第40类**(材料处理、服装剪裁定制加工——你卖的是定制服务,这一类对得上)和**第18类**(箱包,以后扩品用)。

**海外路径,两条,选哪条有明确规则。**

**路径一:马德里体系。**全称"商标国际注册马德里体系",依据《马德里协定》及其《议定书》,通过世界知识产权组织(WIPO)**一次申请、一种语言、一次缴费、指定多个成员国**,成员覆盖110多个国家和地区。

- **前提**:必须先有中国的**基础申请或基础注册**——所以国内那一步不能跳。
- **费用**:基本注册费瑞士法郎653(黑白商标)/903(彩色),加上每个指定国的补充规费或单独规费(美国、日本等收单独规费),再加中国官费¥300/件。指定3-5国的总盘子大致在**¥8,000-20,000**。
- **周期**:各国自行审查,通常12-18个月。
- **最大的坑,必须知道:中心打击(central attack)。**国际注册之后**五年内**,如果你的中国基础申请被驳回或基础注册被撤销,**所有指定国的国际注册连带失效**。五年后才独立。

**路径二:单国注册。**

- **美国**(USPTO):官费约 **USD 350/类**,而且美国是**使用主义**——申请时要么提交实际使用证据(带商标的产品照、销售页面),要么先按"意向使用"申请、核准后再补交使用声明并另行缴费。审查约8-12个月。
- **加拿大**(CIPO):官费约 **CAD 458首类 + CAD 139/增类**,便宜,但**审查排队极久,拿证常要2-4年**。
- **欧盟**(EUTM):官费 **EUR 850(第一类)+ 50(第二类)+ 150/每增一类**,一次覆盖全部成员国,性价比最高。

**决策规则,四条,对号入座:**

> **只做代工、不打自己的牌** → 只注册中国25类+35类,保护公司名和店铺名,预算¥540-4,000,一次到位;
> **要上亚马逊做品牌** → **目标站点所在国单国注册**(美国站要美国商标才能做品牌备案),别走马德里,慢;
> **要覆盖3个及以上国家** → 走马德里,总费用通常比逐国申请省一半;
> **客户的商标** → 不是你的资产,但下面这件事,是你的责任。

**现在回到那件八月就该做的事。**

第16章那天,Mike发来授权书的同时说了一句 "our trademark is registered in Canada, not in China"。那一节留下了两层含义:好消息是海关不会主动拦你的货;**坏消息是,如果有人在中国抢注了"RIDGE & BARREL"或近似商标并做了海关知识产权保护备案,你这批货在青岛港就会被扣住**——而且被扣的时候,在中国境内,那个抢注人才是"权利人"(见16.7)。

当时你把这件事记在本子上,写了三个字:"以后说"。四个月过去了,R&B刚下了500顶的翻单,明年还要做四个SKU。**这条风险不再是Mike一个人的风险——它是你的供货通道风险。**十二月的一个晚上,你写了这封信:

```
Subject: One thing worth about CAD 400 — registering R&B in China

Mike,

Something I should have raised back in August.

China is a first-to-file country: whoever files a trademark first owns
it here, regardless of who used it first anywhere else. If someone files
"RIDGE & BARREL" in China before you do, they can record that mark with
Chinese Customs — and every shipment of your caps could then be held at
the port. It happens to small breweries more often than you'd think,
usually right after they start showing up on Instagram.

Filing costs roughly CAD 200-400 per class through a local agent. I'd
take class 25 (apparel and headwear) and class 32 (beer). It takes
9-12 months, so it's worth starting now — well before next year's run.

I can send you two agents to quote. I don't take a cut on this.

— [你]
```

**最后一句 "I don't take a cut" 是整封信的支点。**它把这件事从一次推销变成一条建议,而建议是顾问才给的东西(见第24章)。这封信花了你四十分钟、赚零元,解决的是**客户自己不知道自己有的问题**——这正是顾问式服务最标准的形态。

本节动作两条:① **今晚就去中国商标网查你自己**——查你公司的英文名、查你打算缝在帽内主标上的那个牌子,查第25类和第35类,截图存档。如果没被占,尽快申请;如果被占了,趁现在还没印一万张吊牌,改名比改命便宜。② 建一张"**客户商标状态表**",三列:客户名 / 商标在哪些国家注册 / 在中国有没有注册。每个带logo的客户填一行。**填到第三行你就会发现,你手上握着一份别人没有的、可以随时变成一封邮件的服务清单。**

## 25.5 产品合规:帽类目的国要求汇总表

十二月下旬的同一个上午,你的邮箱里躺着两封新询盘,并排放在一起,像一场专门为你安排的考试。

第一封来自美国一家童装电商,要**400顶儿童款渔夫帽**,末尾一句:"Please confirm you can provide a CPC."

第二封来自德国一家户外用品公司,只有两句话:"Can you provide a REACH test report? And who is your EU responsible person?"

你盯着"CPC"和"responsible person"看了很久,然后做了一件正确的事:没有立刻回"Yes, no problem"。**因为"合规"不是一个词,是一张表——而在你答应之前,你得先知道这张表上写着什么、多少钱、多少天。**

**帽类主要目的国要求汇总表(拿去贴墙上):**

| 目的国 | 强制标签 | 强制检测/认证 | 高风险点 | 谁是法定责任人 |
|---|---|---|---|---|
| **美国** | 永久产地标;TFPIA纤维成分+**RN号**;护理标签(见18.6) | 童品:**CPSIA**全套+**CPC**;加州:**Prop 65**警示、**AB 1817 PFAS禁令** | 金属件铅镉、印花涂层、防水整理PFAS | 进口商或制造商签发CPC |
| **加拿大** | 产地标;TLAR成分标**英法双语**+**CA号**(见18.6) | 童品:**CCPSA**(铅镉限量)、儿童拉绳规范 | 漏了法语=整批relabel | 进口商/经销商 |
| **欧盟** | 成分标(EU 1007/2011,按销售国语言);**GPSR**要求的追溯信息+**EU责任人名址** | **REACH**(附件XVII限制+SVHC);金属件**镍释放 EN 1811** | 无EU责任人=不能上架;金属扣镍超标 | **EU责任人**(必须在欧盟境内) |
| **英国** | 同欧盟成分标 | UK REACH;英国版产品安全要求 | 需英国境内责任人 | 英国进口商 |
| **日本** | 家庭用品品质表示法的品质表示 | **检针证明**(见20.3.2);有害物质含有量规制法(甲醛) | 断针;婴幼儿甲醛不得检出 | 进口商 |
| **韩国** | KC标示;纺织品品质表示 | 儿童用品**KC认证** | 童品准入 | 进口商 |
| **澳新** | 产地标;护理标签 | 童品拉绳 | 相对宽松 | 进口商 |

表里有五个词是第一次出场,现场定义清楚:

**REACH**,欧盟《化学品的注册、评估、授权和限制法规》。落到一顶帽子上就两处:**附件XVII的限制物质清单**——偶氮染料(能分解出24种致癌芳香胺的那些)、甲醛、邻苯二甲酸酯、镉与铅;以及 **SVHC(高度关注物质)候选清单**,目前已列入250余项,产品中任一项含量超过0.1%就有通报和告知义务。

**GPSR**,欧盟《通用产品安全条例》(EU 2023/988),**2024年12月13日起适用**。对中国卖家最要命的一条:**每一件在欧盟市场销售的产品,必须有一个设在欧盟境内的"责任人"**,其名称和地址要标注在产品、包装或随附文件上;没有欧盟主体的,必须购买授权代表服务,**年费大致 EUR 300-1,200**。这一条第20章点过(见20.3.2),这里是它的完整版:**没有EU责任人,你连包装都过不了关。**

**镍释放**,标准 EN 1811。与皮肤长期接触的金属件,镍释放量限值 **0.5 µg/cm²/week**。帽子上的金属滑扣、金属气眼、日字扣(见2.4)全在射程内。

**PFAS**,全氟和多氟烷基物质,俗称"永久化学品",用于防水防污整理。加州AB 1817自**2025年1月1日**起禁止有意添加PFAS的纺织品,并以**总有机氟100 ppm**作为判定线,**2027年收紧到50 ppm**;纽约州等有类似法案。**所以"这顶帽子要防泼水"这句需求,今天是一个合规问题,不只是一个工艺问题。**

**CPC**(儿童产品证书,见18.6)、**Prop 65**(见20.3.1)、**检针证明**(见20.3.2)、**RN号/CA号**(见18.6)——这四个前面已经定义过,直接用。

**检测费用与周期,一张能用来报价的表:**

| 项目 | 适用场景 | 费用(USD/款) | 周期 |
|---|---|---|---|
| 纤维成分定量 | 全部市场,基础项 | 30-60 | 2-3天 |
| 甲醛 | 欧盟、日本 | 40-80 | 3天 |
| 偶氮染料(24种芳香胺) | 欧盟 | 60-120 | 3-5天 |
| REACH SVHC筛查 | 欧盟 | 250-800(按项目数) | 5-10天 |
| 镍释放 EN 1811 | 欧盟,每个金属件单测 | 80-150/件 | 5天 |
| CPSIA全套(铅+邻苯+物理机械) | 美国童帽 | 200-500 | 7-14天 |
| Prop 65 铅镉 | 发加州 | 60-150 | 3-5天 |
| PFAS 总有机氟 | 加州/纽约,有防水整理 | 150-300 | 7-10天 |
| 检针(全检) | 日本 | ¥0.2-0.5/顶 | 随产线 |

实验室认准 SGS / BV / Intertek / TÜV / CTI 这几家,**童品的CPSIA检测必须由CPSC认可的实验室出具**,随便找一家出的报告不作数。

**带你把那400顶童帽算一遍,这一算你就知道该怎么报价:**

```
CPSIA全套按 USD 350 ≈ ¥2,485
摊到每顶  = 2,485 ÷ 400 ≈ **¥6.2/顶**

若这单报价 CAD 12/顶 ≈ ¥62.4
  检测费占售价                 ≈ 10%
  按定制单毛利率25%的下限算(见19.6.2),单顶毛利 ¥15.6
  检测费吃掉毛利的               ≈ 40%
```

结论非常明确:**检测费不能吞进单价里,必须单列。**行规有两种写法,任选其一写进报价单:客户指定的测试项目由客户承担;或者做成菜单里的加价项(见22.4.2)——"**Testing & certification: CAD 350 per style, charged on the first order, waived on repeat orders of the same style within 12 months**"。后一种写法漂亮在:它既收回了成本,又给了客户一个翻单的理由。

**什么单必须测、什么单可以免——决策规则:**

**必须测(命中任何一条):**
① 12岁及以下的**童帽**;
② 发**欧盟**,且有金属件直接接触皮肤,或有涂层、印花、烫画;
③ 客户是**零售连锁、上市品牌或平台大卖**——他们的供应商手册(vendor manual)会把测试项目写死,你不测他也会测,不如自己先测;
④ 做了**功能性整理**:防水防污(PFAS)、阻燃、抗菌;
⑤ 合同、采购订单或信用证里**写了**;
⑥ 你**换了辅料供应商**,而这个辅料接触皮肤——这一条最容易被忽略,下面那个事故就出在这里。

**可以免(必须同时满足):**成人款 + 常规棉/涤 + 无功能整理 + 终端客户自用或活动赠品 + 单量小 + 客户书面不要求。

**但有一条永远不能免:标签合规**(见18.6)。区别在于:**标是准入,测是抽查。**标错了是100%被拦,测没做只是有概率被抽到——可一旦抽到,代价是整批。

**事故,发生在一个和你同一年入行的人身上。**他给德国客户做200顶金属扣渔夫帽,€4.2/顶。货到德国,客户按内部流程抽检金属扣的镍释放:**1.4 µg/cm²/week,超限近三倍。**追根源:工厂中途换了一家电镀扣供应商,**每顶便宜¥0.3,200顶省了¥60**,新供应商没有任何检测报告,工厂也没告诉他。结果:整批不能上架,客户先按合同提出索赔€1,800,最后协商成"全额退款、货退回中国、退运费他自己出",那200顶帽子至今躺在他仓库里。

```
省下:            200 × ¥0.3        = ¥60
退还货款:        200 × €4.2 ≈ €840  ≈ ¥6,550(欧元按¥7.8折)
自付退运海运费:                       ¥3,200
已发生的料工成本(货成了库存):        ≈ ¥4,200
──────────────────────────────────────────
净损失                                ≈ ¥14,000
```

**辅料换供应商这件事,工厂根本不觉得需要通知你**——在他们眼里那只是"同规格换了一家扣子"。这就是为什么下面这个动作必须由你来做。

本节动作三条:

① **建"辅料合规档案"。**每一个**直接接触皮肤或带涂层**的辅料(金属扣、气眼、印花浆、烫画膜、水洗助剂),向工厂索取**最近12个月内**的第三方检测报告,存进供应商档案。写进合同一句:"**辅料供应商变更须书面通知并重新提供检测报告**"——换了供应商,旧报告作废。

② **在报价单上固定一栏**:"Testing & certification: quoted separately upon request." 把检测从一笔隐藏成本变成一个报价项。这一行字的作用是,当客户后来说"我们需要REACH报告"时,你不必吃这笔钱,也不必尴尬地重新谈价。

③ **每接一个新目的国,过两遍表。**先用第18章的"查—写—确认"三步法处理标签(见18.6),再用本节这张汇总表核一遍检测。**半小时,一次,用十年。**而在你查清楚之前,标准回复是:"I need two working days to confirm the compliance requirements for your market before I send a formal quote."——第20章说过,**在国际贸易里,承认自己需要查证的人,比什么都敢答应的人可信得多**(见20.3.2)。

# 第26章 第一单沙盘推演

**主线推进** —— 十二月的最后一个礼拜,你把屋里那张吃饭的桌子清空了。

材料是分几趟搬上来的。一台笔记本,屏幕上开着导出的邮件档案——从六月三日Mike那封"Hi, saw your cap at the market"到十一月底翻单的确认函,**五十九封**,成交前三十八封。一叠打印纸:规格表三个版本(v1.0、v1.1,加上第4章补完包装栏的那一版)、报价单、PI、CI、PL、报关委托书、品牌授权书。一只透明自封袋,里面是那条藏青底布的**签字样带**,背面还留着你手写的"金黄428"和日期。旁边是那顶封样帽,袋口的骑缝签字已经有点磨花。再往右,一张海派专线的账单、一张查验杂费的实报实销条、两张结汇水单,和两张你后来才想起来该留着的高铁票。

最后放上去的是手机。屏幕上是Mike十月发来的那张照片:吧台后面的木架,一排藏青帽子挂着,底下一行小字——"Sold 61 last night"。

桌上摆满了,你退开一步看。这些纸、这顶帽、这几张票据,加起来就是你人生的第一单外贸生意。半年,五百顶,两万五千七百四十块钱的收入。

今晚要做的事只有一件:**把它完整地复盘一遍。**不是怀旧。怀旧不产生结论,复盘产生结论。这一单里有三次事故、一张你直到第19章才敢诚实填完的成本表,和至少十个你现在才知道该在什么时候问的问题。全部摊开、逐条对账、写成文件——**目的只有一个:让下一单少犯错,并且少犯得起。**

台灯打开。第一件事,把这半年拆成三条线。

现在看三条线的**错位点**。这是整张图唯一的用处。

**错位一:纸比货早一个月,钱比纸晚半个月。**六月十三日报价单发出的时候,你手上一片布都没有;更要命的是,**你手上连一张工厂报价单都没有**——三家询价是六月十六日才开始打的(见第9章)。也就是说,你先向客户承诺了价格,两周后才知道成本。这不是失误,这是这门生意的常态:客户的耐心以天计,而工厂的报价以周计。你能做的只有一件事——**在报价单上写有效期**。你写了三十天,这三十天就是你为"先承诺、后核价"这个错位买的保险。

**错位二:资金的最低点,出现在一片布都没裁的时候。**余额线的谷底是**−¥900**,发生在六月中到七月初——那时候货这条线上只有几个样品,纸那条线上刚有一张报价单。九百块,是你这门生意的全部启动资金。**规律记住:任何一单的垫资峰值都出现在"钱已经开始花、货还没开始做"的那一段**,因为一次性费用(制版、打样、寄样)天生排在生产前面。所以判断一单能不能接,不看总账赚不赚,看**这一段有多深、有多长**。你这单是九百块、三周;换成客户定金20%、工厂要50%的结构,同样的生意能变成缺口两万九、持续三个月(见14.5.1)。

**错位三:货动的时候,纸是停的——事故就长在这段静默里。**看阶段三:七月十四日到七月二十八日整整两周,纸这条线上一个字都没有。就在这两周里,绣花厂的线用完了,十二个机头装上了偏橙和偏轻的替代线,绣了十轮,一百二十片。**没有任何一张纸记录了这件事,因为那两周本来就不产生纸。**这是全书最重要的一条机制:**风险不发生在流程节点上,风险发生在节点与节点之间的空档里**;而你能往空档里塞进去的唯一东西,就是主动索取的过程凭证——首件照片、上线日回执、外发回厂签收单(第8章那五颗星,说的就是往这段空白里钉钉子)。

**错位四:钱的终点比货的终点早了将近一个月。**尾款八月五日到账,货九月初才签收。你在货还漂在太平洋上的时候,就把全款收完、把工厂结清了。这不是运气,是"30%定金+70%见提单副本/款到交仓"这个错位规则的直接产物(见14.1.2)。它的价值在反面才看得清:如果Mike要一个"到货后30天付款",这条线就会往后挪一个多月,余额在付完工厂尾款那一刻转负¥4,085(见14.5.2)——同样一单生意,同样的毛利,一个你做得起,一个你做不起。**你手上余额线的形状,不取决于你赚多少,取决于两个时点的先后。**

**错位五,也是最狠的一条:三次事故,没有一次发生在某条线的中段,全部发生在两条线的交接处。**事故一是**纸与货的交接**——样带(纸)签了字,大货(货)换了线,而纸没有跟着变;事故二是**货与时间的交接**——绣花那一段的货在别人的排产表上,可你的时间表把它当成自家车间的三天;事故三是**货与纸的交接**——货走了,纸没跟着走,五个箱子里没有一个自封袋。三条线,三个接口,三次事故,一次不落。

所以这张图真正的读法不是"回顾我做过什么",而是:**把手指按在任意两条线的交接处,问一句"这里靠什么把它们锁在一起"。**样带靠什么锁住大货?一条"换线必须重签"的条款。你的时间表靠什么锁住外发厂?一个书面的回厂日。你的货靠什么锁住那几张纸?一个五分钟塞进一号箱内侧的自封袋。三个答案,加起来成本不到十块钱,而它们没到位的代价,后面三节会一分一分算给你看。

## 26.2 事故一:绣花色差

三条线的第一个接口,断在七月的最后一个星期。

**起因,要往回追一个多月。**三月不算,从logo转绣花那天算起(见3.1.8):金黄麦穗对不上PMS 7406C的正号,绣花厂拿两个候选线号试绣了一条样带,你在自然光下对着C卡圈定了"金黄428",在样带背面写下线号、线厂、日期,签字,一式两份。到这里,一切标准动作都做对了——**你有标准物,有签字,有留痕**。

问题出在这个标准物的**传递半径**。样带签在商务(老纪)和跟单(小周)那一层,而真正握着线架的那只手在邻镇的绣花外发厂。到达那只手的东西只有两样:一个.dst文件和一张色序表(见3.1.6)。色序表上确实写着"金黄428"——**但它写的是一个目标,不是一条禁令**。在绣花厂的作业习惯里,"最接近"从来是被允许的默认动作:线断了、线用完了、这个色号缺货,就从线架上挑一个最像的顶上,这是这个行业几十年跑下来的效率共识,不是坏心眼。而这一单,恰好撞上了那个共识最危险的时刻:旺季排队多吃了两天,428的备量是按刚好算的,等新线要一天,交期压在头上——挡车工在十二个机头上装了两种替代线,八轴偏橙、四轴偏轻,绣了十轮,一轮十二片,**一百二十片**。车间黄光LED下,三种金黄摆在一起才分得出,单看,都是金黄。

**发现,是一个动作救的。**验货第一天上午,你在窗口自然光下,把签字样带贴在前幅上——**贴,不是看**。贴上去的瞬间,三种黄就分家了。这里必须记住一条已经被证明过的物理规律:手机照片在自动白平衡、压缩、屏幕三重失真之后,**能证明"绣了",永远证明不了"绣对了颜色"**(见11.1.2)。一个多月前小周发来的麦穗近照你回了五个字"看着挺正常"——那五个字没有说谎,它只是回答了一个照片根本无法回答的问题。**颜色的远程确认只有两条路:实物寄到,或者标准参照物同框入镜。**

**处置,三步,共两天半。**第一步定量:五百顶按一般检验水平II抽样50顶,不合格13顶,远超AQL 2.5的判定数,判拒(见11.3.2);随即转全检——每顶贴一次样带,二十秒,一下午过完五百顶,分出三堆。第二步定方案:偏橙的80顶返工(拆绣刀贴着底线削断,一顶二十分钟,拆绣工价¥2/顶,拆坏2顶用损耗备片补),重绣前先用新到的428绣一片新样带、与签字样带并排拍照确认再开机;偏轻的40顶,Mike书面同意让步接受,折2加元/顶,帽内后中加缝一枚"R&B EVENT GIVEAWAY"印唛(¥0.05/枚)——**让步接受的货必须可识别、可隔离,这是铁律**。第三步定复验:返工批不抽样,全检。

**代价,一笔一笔摆出来。**

```
工厂承担:拆绣¥160 + 重绣线料机时约¥350 + 2顶备片重做 ≈ ¥600
          + 赠品印唛 40×¥0.05 = ¥2
你 承 担:让步折让 40顶 × 2加元 = 80加元 ≈ ¥416
时间成本:返工与复验 +2天
你的时间:全检一下午 + 取证 + 预演谈判 + 次日上午谈判 ≈ 15小时
未发生但差点发生的:120顶全部拆绣 ≈ ¥900 + 4天;
                    或者——货到温哥华由Mike自己发现(那是第28章的故事)
```

你承担的¥416占这一单账面毛利的3.0%。工厂承担的¥600,是**条款替你谈下来的**——PI里那句"返工与复验费用由卖方承担"写下时你觉得多余,那天它一分钱没让你花。老崔连争都没争,因为你桌上摆了五件东西:签字样带、产前样、订单条款、往来记录、验货记录。**证据链的最高境界不是吵赢,是让对方算出争下去的败率**(见11.6.1)。

**根因,连问五层,一层都别省。**为什么色差?换了线。为什么换线?428用完了。为什么用完?备量按刚好算,排队多吃了两天。为什么擅自换?因为"最接近"是这一行的默认动作。为什么默认动作没被挡住?——到这里才是真正的答案:

> **样带签字了,但没有任何一条规则规定"换线必须重签";而且那张签了字的纸,从来没有走到握着线架的那只手上。**

请注意这个结论里没有"工厂坏"三个字。**归因到人品,你什么都改不了;归因到流程缺口,你下一单就能补上。**这一单的流程缺口是一个接口:标准物签在A层,执行发生在C层,中间的B层(色序表)只传递了目标,没有传递约束。

**预防,三件事,总成本不到十块钱。**

第一件,把条款写死。抄走,中英各一份,直接进PI的Remarks:

## 26.3 事故二:交期延误

第二条接口,断在时间上。而这一节最反直觉的结论是:**这一单严格说来没有"延误",只有"交期算错了"。**

**先把账摆开。**PI签在七月六日,上面写的装运期是**定金到账后20天**。你在心里把这二十天拆过:定金到账1天 + 备料6天 + 生产15天 = 22天(从签PI起算),七月二十八日出货,一天不多一天不少。**这张计划表上没有一天是留给意外的。**

实际发生的是:

```
计划(签PI起算 22天 → 7/28 出货)
  定金到账 1  +  备料 6  +  生产 15  =  22天

实际(签PI起算 27天 → 8/2 出货)
  定金到账 2  +  备料 6  +  生产 15  +  绣花外发排队 2  +  返工重验 2  =  27天
        ↑晚1天      ↑运气           ↑没变      ↑事故二本体   ↑事故一的时间账
```

五天的缺口,三个来源:定金实际晚到一天、绣花外发在邻镇被压两天、事故一返工两天。备料那六天你还欠着运气一笔债:古铜色滑扣是定制电镀件,行规10-15天,你这520套四五天就到仓,因为工厂手上有现成模具、采购在打样阶段就提前压了单——**这一单的交期没崩在备料上,是运气,不是流程**(见4.7.2)。

**现在把交期起算条款套回去,你会出一身冷汗,然后笑出来。**标准条款是:交期自卖方收到定金**且**买方书面确认产前样之次日起算。你的定金到账在七月八日,Mike书面确认产前样在七月十一日,孰晚者是十一日。按条款,起算日的次日加二十二天——**PI上那个出货日本来就该是八月二日。而你实际出货,就是八月二日。**

一天不差。

所以这五天的"延误"到底是什么?它是**一条你没写进合同的条款,把工厂的两次真实意外,全部变成了你自己的违约**。工厂的排队和返工是真的,该有人为它负责;但因为PI上那个日期从签字那一刻起就是空头支票,你连"顺延"两个字都开不了口。**条款不是用来打官司的,条款是用来定义"什么叫准时"的。**定义错了,你后面所有的努力都在跟一个错误的基准线较劲。

**为什么没伤到客户?**这才是这一节真正值钱的地方。你给Mike的承诺是另一套数字:`30 days production + 28-32 days transit`,自定金到账日起算。定金七月八日到账,承诺到门就是九月上旬的一个区间。而你和工厂签的是二十天——**中间那十天,就是buffer,你留了,而且你把它留在了自己这一侧,没有告诉客户**(见17.4)。结果是:

> **对工厂,你迟了五天;对客户,你早了一天。**

差别就是那十天buffer,而它一分钱没花。

buffer之外还有第二层保护,它更隐蔽:**你选的运输方式,买的不是速度,是方差。**海派专线门到门28-32天,拼箱走整柜提单28-37天且尾段方差最大——快的时候差不多,慢的时候差出五天以上,而且那五天卡在目的港换单、清关代理、派送预约这些**你完全够不着的环节**上(见17.4)。你在生产端丢的五天,不是靠船开得快追回来的,是靠把一段方差极大的流程换成一条每周重复几十次的成熟流水线补回来的。**专线真正卖的东西是方差,不是速度**——这句话你现在才真正懂。

第三层保护是那个你算过却没用上的备胎:空派十到十五天,比海派贵¥1,160。**这¥1,160就是事故二的"未支付账单"**——如果buffer不够,你要么付它,要么向Mike解释为什么周年活动上没有帽子。一千一百六十块,和一封解释信,这道题不需要计算器。

**根因,一句话:你把外发环节当成了自有环节来估时间。**工厂给你的二十天里,绣花那三天是按"我们厂里的机器"的口径估的。可绣花机在邻镇,在别人的排产表上,你的五百顶排在人家两万片大单的后面;加急费顶格也就¥500,人家看不上(见4.7.3)。**凡是不在你能看见的那块白板上的环节,它的时间就不由工厂控制,自然更不由你控制。**行业里那条老规矩说得已经很明白了:**外发工序的历时不得低于三天**——它不是工艺时间,是排队时间。

**预防,四件事。**

第一,交期条款三句版,写进PI:

```
【交期条款】
① 起算:交货期自卖方收到定金 且 买方书面确认产前样(PP样)之次日
   起算,计 ___ 个日历天。因买方确认延迟或变更规格所致的时间,顺延。
② 分段:卖方应于起算日后第 ___ 日前将本单排入车缝生产(计划上线日);
   外发工序(绣花/水洗)应于开裁后 ___ 日内完成并回厂。任一节点逾期
   超过 2 日,卖方应在 24 小时内书面通知买方并给出新日期。
③ 责任:因卖方或其外发方原因逾期交货超过 ___ 日,买方有权改用空运,
   运费差额由卖方承担,上限为本单货款的 ___%。
```

第二,**把"计划上线日"这五个字写进PI**。它的作用不在追责,在于**提出这个要求本身,就把你从"随便排"的那一类客户里择出去了**。

第三,**外发环节的buffer单列,不与总buffer混用**。一张交期表上,自有工序按标准工时排,每一道外发工序单独加三天,不许挪用。

第四,**对客户报期时,在你自己算出的日期上再加两周**。两周不是拍脑袋,它正好覆盖"一次产前样返工7天 + 一次外发排队3天 + 一次订舱延误3天"。你这单只加了十天,五天被吃掉,剩五天;运气帮你补了一次。**下一单加十四天。**

本节动作:把你手上任何一单的交期,按"自有工序/外发工序/客户确认/订舱"四段拆开重排一遍,**在每一段外发后面画一个三天的空格**。排完对比你已经报出去的日期——如果排出来的比报出去的晚,现在就去跟客户重谈,而不是等到出货前一周。**延期不可怕,让客户从别处知道延期才可怕。**

## 26.4 事故三:清关查验

第三条接口,断在货和纸之间,断在一万公里外你睡着的时候。

**起因是两句话和一个字。**一个月前你在微信上问小林:"要不要办原产地证?"小林回:"加拿大不需要,双清包税那边我们代理包了,省一笔。"你回了一个字:"好。"

这就是全部起因。它太轻了,轻到你事后翻聊天记录都差点找不到——**这一单里最贵的一个决定,长得像一次闲聊。**

还有两个同样安静的错误跟在后面。第二个:**文件没有随货走**。封箱那天,五个牛皮纸箱摞成一垛,箱唛朝外,里面装的全是帽子——没有一个自封袋,没有一张纸。第三个:规格表上写着"大货随附成分检测报告",而五百顶的小单,你从来没让工厂做过那份报告。

**发现,是凌晨一点十七分的三条微信。**CBSA随机布控,查验场要两份东西:origin declaration 和 fibre content;加拿大那边是下午一点,要今天下班前给,否则压到下周。**"下周"这两个字才是真正的威胁**——不是三天,是加上周末和排期的五到七天,那会直接吃穿你剩下的全部buffer。

**处置,三个小时,三份文件。**盘点你手上到底有什么,是最先该做的动作:箱唛上印着MADE IN CHINA(有声明,但印在箱子外面,不是官方文件);洗水标上是英法双语的成分与产地(货上有,但海关要的是纸);CI和PL上有品名、材质、数量、重量;规格表上那行成分允差写着"随附检测报告"——**报告没有**;CO——**没有**。

然后是三小时内并行启动的三件事:

```
① Statement of Origin(原产地声明)
   外贸公司抬头纸,载明品名、款号 RB-DH-001、HS编码、数量500顶、
   原产国 CHINA、生产地址、签字人姓名职务与日期,盖章扫描
   → 成本 ¥0        耗时 1.5 小时
② Fabric Composition Statement(成分声明)+ 布厂第三方检测报告
   工厂出声明(100% Cotton,附面料批次号);同批次的第三方报告,
   档口老板手里正好有现成的,拍照发来;补拍洗水标特写与帽内标位
   → 成本 ¥0        当天到手
③ 后补一般 CO
   外贸公司当天申请,证书加注 ISSUED RETROSPECTIVELY
   → 成本 ¥200 加急  三天出证
```

第二天补一份布厂报告的英文摘要,第三天CO出证一并递交,第四天下午放行。

**代价:**

| 项目 | 金额 | 说明 |
|---|---|---|
| 查验场地费+掏箱搬运+三天仓储+清关行文件处理 | CAD 150 ≈ **¥780** | 货代垫付后实报实销 |
| 后补CO加急费 | **¥200** | 跟着外贸公司代办费一起结的 |
| 时间 | **+3天** | 从十天buffer里扣掉三天 |
| 你的时间 | 一个不眠夜 + 三小时并行处理 | — |

而这里有一件事必须点破,它是本章唯一一处**对账勘误**:19.5那张完全成本表的"海关查验备付"行,记的是¥780——**那¥200的CO加急费,因为金额小、走了别人的账,从头到尾没有出现在你的任何一张成本表上**。它有单据、真实发生、你真的付了,却在账上蒸发了。**这就是"漏项"的活标本:漏项从来不是因为钱大到你不敢记,是因为钱小到你懒得记。**本书后面所有算例仍沿用19.5的口径(完全成本¥16,640),但把这¥200留在这里当标本;补上它,这一单的完全成本是¥16,840、毛利¥8,900、34.6%。**下一单起,意外备付这一行从¥500-800提到¥1,000。**

**根因,不是"没办CO",是"把判断权交给了货代"。**三层拆开:

第一层,**你问错了人**。你问的是"要不要办",货代听见的问题是"这票货清关通不通得过"——他的答案基于经验、基于他这条线上百票的成功率,而且**他的利益函数里没有"你被查"这一项**:他优化的是报价单上的数字,和"这一票别出岔子"。更何况这条北美专线段他还转了一手给同行(见17.5.1),那一头到底是谁在申报、按什么口径申报,他自己也未必知道全貌。而海关的问题从来不是"通不通得过",是"**你能不能证明**"。这两个问题的答案完全不同。

第二层,**问对了人也该留痕**。行业里那条规矩你当时读过却没执行:货代说"不用办",**让他把这句话打在微信上**(见16.6)。这不是为了将来索赔——CAD150你也追不回来——是因为**一个人在打字之前会比说话之前多想三秒**。那三秒,常常就是答案的分水岭。

第三层,**最终判断权必须收回自己手里**,而收回的方式是把问题换一个问法:

> **"如果目的国海关明天开口要原产地文件,我三天之内能不能拿出来?"**

答案是"不能"就办。¥200 的CO,对四千八百七十加元的货值是万分之几;它挡的是¥980加三天,以及那个"压到下周"的尾巴。**这道题不需要计算器,只需要换一个问法。**

**预防:一张清单和一个动作。**

```
【出运文件包】——打印一份装1号箱内侧自封袋,电子版同时发客户与货代
 □ CI 商业发票(号、日期、货描四要素、贸易术语)
 □ PL 装箱单(件数/净重/毛重/材积,与箱唛完全一致)
 □ 原产地证 CO;来不及则先出 Statement of Origin
 □ Fabric Composition Statement + 布厂第三方成分检测报告
 □ 品牌授权书(货上有客户logo即必备,成本为零)
 □ 箱唛照片 + 过磅照片(封箱后实测,回头核对箱唛)
 □ 产品照片:帽内标位、洗水标特写(成分/产地/双语)
```

配一个动作:**封箱过磅之后,拿实测数回头核一遍箱唛。**这一票你侥幸——单箱毛重12.50公斤、合计62.50公斤,和开裁那周印下的箱唛正好对上;**那是运气,不是流程**。箱唛在开裁周按估算印、PL在封箱后按实测填,差个几百克没人回头改,这是行业里最常见的一颗雷。这次CBSA只问了产地和成分,下一次未必。

最后一件事,它不花钱,却是这三天里你做对的最重要的一件:**主动报忧。**查验当天早上,你给Mike发了一封邮件,写清楚"货没问题、他们要的是文件、我已经提交、预计延迟2-4天、你的活动是9月14日、我们还有九天buffer、我每天更新"。Mike当天回:"Thanks for telling me before I had to ask. Sept 14 — we're fine."

**"before I had to ask"——这六个词,是这一单里你收到的最高评价。**它的成本是五分钟。

这里插一条对账纪律,是新手最常犯的错:给Mike的折让80加元,**要么从收入里减,要么记进成本,只能记一次**。本书的选择是记进成本(¥416),收入保持¥25,740。你也可以反过来:收入按实际结算的4,870加元记¥25,324、成本里去掉那¥416变成¥16,224——**毛利同样是¥9,100,一分不差**,只是毛利率变成35.9%(分母小了)。两种都对,选一种,全书不许换。两边都记的话,你会平白多亏¥416,而这种重复计算在手工做的成本表里极其常见。

**再做一次交叉验算,这是本节最该被信任的地方。**从第14章那张资金流时间表的期末现金余额出发:

```
期末手上余额            ¥13,386   (已经净掉了给Mike的折让,因为实收就是4,870加元)
 − 差旅(两趟山东)      ¥ 3,500
 − 海关查验杂费          ¥   780

**现金流表和成本表,两条完全独立的路径,落在同一个数字上。**这就是对账的意义:不是为了算出一个数,是为了让两个数互相证明。任何一单,你都该有能力从"银行卡里最后剩多少"和"表上算出多少"两头夹逼,夹不拢就说明有一笔钱你没找到——比如那¥200的CO加急费。

| 事故 | 你付的现金 | 别人付的 | 时间 | 差点付的 |
|---|---|---|---|---|
| 一·绣花色差 | ¥416 | 工厂 ¥602 | +2天 | 120顶全拆 ¥900+4天;或货到温哥华才发现 |
| 二·交期延误 | ¥0 | — | +2天(排队) | 空运救急差价 ¥1,160 |
| 三·清关查验 | ¥980 | 货代垫付后实报实销 | +3天 | 压到下周,再延5-7天 |
| **合计** | **¥1,396** | **¥602** | **+7天** | **¥2,060 + 一场活动** |

三次事故的现金代价¥1,396,占完全成本口径毛利的15.3%。**七天延误,一天没落到客户身上**——全部被那十天buffer和专线的低方差吸收了。

**现在给这一单一个诚实的结论。**

你赚了**¥9,100**。这半年在这一单上花掉的时间是**170小时**(需求沟通与选料30、找厂询价打样40、驻厂验货与差旅60、单证物流收款25、事故处理15)。

```
9,100 ÷ 170 ≈ ¥54 / 小时
```

**五十四块钱一小时。**你上一份工作折算下来是一百块。也就是说,把这半年的业余时间拿去做任何一份计时的活儿,你赚的都比这个多——**而且不用凌晨一点被微信叫醒,不用在验货台上贴五百次样带,不用在旅馆房间里预演第二天怎么跟一个厂长谈判。**

这个数字必须写出来。任何一本告诉你"外贸毛利五十个点"的书,如果不把这一行写给你看,它就是在骗你。

那你买到了什么?五样,一样一样点清楚,每一样都给数字:

**第一,一套可复用的流程。**从需求翻译到规格表、从询价到PI、从验货到单证、从收款到复盘,你现在有一整套自己的模板和检查表。170小时里,至少**120小时是一次性的学习成本**——第一次看面料卡、第一次读报价单、第一次画AQL抽样表。这些时间不会再花第二次。

**第二,一个可复制的样板。**同一款、同一个客户,把这张表按翻单条件重算一遍:制版费¥200归零(版权归你,翻单免收),打样寄样¥700降到约¥350(无开发样、寄样减半),差旅¥3,500归零,折让按1.5%计提¥386,意外备付按¥500计:

```
翻单 500顶:8,750 + 500 + 0 + 350 + 1,400 + 400 + 386 + 500 + 6 = ¥12,292
毛 利:25,740 − 12,292 = ¥13,448   毛利率 52.2%
时 间:约50小时  →  ¥13,448 ÷ 50 ≈ ¥269 / 小时
```

**同一顶帽子、同一个客户、同一个价格,时薪从¥54跳到¥269,五倍。**变的不是生意,是你——你不用再重新学一遍。(R&B的翻单已经在十一月底发生,见第24章。)

**第三,一个真实的客户。**Mike不是一个订单,是一条现金流:吧台一晚卖出61顶、周年活动之后还有圣诞、还有明年的新酒标、还有他转介绍的Dana那80顶(见第22章)。终端小B的三年LTV量级是三到八万块(见20.1.3)——**第一单的利润是首付,LTV才是房子。**

**第四,一个可以拿出去讲的案例。**两千三百多张车间素材、一封Mike授权发布的邮件、一组"从裁床到吧台"的完整链路(见第23章)。你现在能对任何一个陌生买家说的不是"我可以做帽子",是"**这是我上一单,五百顶,九月中旬的活动,这是箱唛、这是验货记录、这是客户吧台的照片**"。这句话的获客价值,自己去比一比冷开发信1-3%的回复率。

**第五,也是最不像资产的一样:三次事故的肌肉记忆。**你现在看到"最接近"三个字会条件反射地要样带,看到外发工序会条件反射地加三天,看到"这个不用办"会条件反射地问一句"三天内拿得出吗"。**这三个条件反射,是这¥9,100里最贵的部分,而它们只在真的疼过之后才长得出来。**

本节动作:把这张四行台阶表照着填你自己的第一单(没有第一单就填你正在盘算的那一单),**四个毛利率必须全部填出来**。填完把最后一行的"完全成本口径毛利率"写在这单档案的封面上。以后再有人跟你说"这个生意毛利五十个点",你的第一反应会自动变成一个问题:**哪个口径的五十个点?**

## 26.6 复盘十问

表算完了,故事讲完了。最后剩下的,是把这一单压缩成一张可以带走的东西。

不是"经验",经验带不走;是**十个问题**。这十个问题不认帽子——换成T恤、水杯、蓝牙音箱、一柜子五金件,一个字都不用改。每个问题下面给你三样:为什么问它、R&B这一单的答案、和一个满分十分的自评。**打分请刻薄一点,复盘唯一的失败方式是给自己打高分。**

**① 规格锁死了吗?——8分**

问的是:交付标准是否已经完整落到一份双方都持有、有版本号的书面文件上,包括数字(尺寸、克重、针数、允差)和实物(封样、样带、色卡)。没有锁死的规格,后面所有的验货标准都是空的——**你拿什么判它不合格?**R&B这一单:规格表走到v1.1、三围与允差齐全、确认样两顶骑缝签字封袋、样带一式两份。丢两分在两处:包装栏一度悬着直到第4章才补,以及规格锁的是"结果"没有锁"变更路径"(见②)。

**② 每个"最接近"都书面确认了吗?——4分**

问的是:这一单里所有"没有正对号、只能取最接近"的地方——线色、辅料代用、面料同类替代、印刷色差——是否都有一份签字的实物标准,**以及一条"更换必须重新确认"的规则**。这是全书最贵的一条。R&B:样带签了,规则没写,签字的纸没走到执行层的手上,结果是¥416+2天+一个不眠之夜。**四分,是这十项里最低的第二名,也是最不该低的一名——因为补它的成本是一段条款、一行色序表批注,零元。**

**③ 交期的每一段都留了buffer吗?——6分**

问的是:交期是不是被拆成了"自有工序/外发工序/客户确认/订舱"四段分别估时,**每一段外发后面有没有单独的三天**,以及对客户的承诺是不是在自己算出的日期上再加了两周。R&B:对客户的总buffer留了十天(救了命,给满分),但分段buffer一天没留,外发环节按自有环节估,PI上的22天里没有一天是给意外的。**总buffer救了你,分段buffer的缺失差点害了你——这两件事必须分开打分。**

**④ 文件在货出发前齐了吗?——3分**

问的是:出运文件包(CI/PL/CO或原产地声明/成分声明/授权书/箱唛与过磅照片)是否在货离厂前就齐了、并且有一份纸质版跟着货走。R&B:CO没办、成分报告没做、五个箱子里没有一个自封袋,判断权还交给了货代。代价¥980+3天。**全章最低分。而这一项的补救成本是¥200和一个自封袋。**

**⑤ 钱的时点匹配吗?——10分**

问的是:画出这一单的资金流时间表,**有没有任何一行的余额是负的**;定金覆盖倍数够不够;垫资峰值多深、多长。R&B:垫资峰值¥900、持续三周、余额线全程为正、定金覆盖倍数2.84、临界定金比例13.7%——30%的定金,安全垫厚得像床褥子。**满分。而且要认清这个满分从哪来:不是你会安排,是你站在定制服务档、加价倍率接近3。换一个品类、一个加价倍率1.3的走量单,同样的条款会让你余额转负。**

**⑥ 事故发生时你是第一个知道的人吗?——7分**

问的是:坏消息到达你的顺序。第一个知道(自己发现)得10分,第二个知道(工厂主动报)得7分,最后一个知道(客户告诉你)得0分。R&B:色差是你在验货台上贴样带发现的——**第一个**;绣花排队被压两天,你是事后才知道的——**被动**;查验是货代凌晨叫醒你的,这一项客观上没法更早。七分。改法只有一条:**往"两条线之间的静默段"里钉钉子**——首件照片、上线日回执、外发回厂签收单。

**⑦ 客户是从你这里知道坏消息的吗?——10分**

问的是:三次事故,有没有任何一次是Mike先从别处(或者从货没到)知道的。R&B:色差在事故当晚带着三张同框照片和完整方案发出去;延误在出货前同步;查验在当天早上主动报忧,附上重新计算过的到门日和剩余buffer。Mike那句"Thanks for telling me before I had to ask"就是这一项的成绩单。**满分。而这十项里,唯有这一项完全不花钱、完全由你控制,所以它也是唯一一项"拿不到满分就说明态度有问题"的题。**

**⑧ 留痕够不够打官司?——9分**

问的是:如果今天要跟工厂对簿公堂,你能不能摆出一条完整的链:**标准是什么(签字样带、产前样)→ 规则是什么(订单条款)→ 过程发生了什么(未删改的往来记录)→ 结果是什么(验货记录与签字)**。R&B:五件齐全,老崔听到第三件就摆手认账。**链的价值在完整,不在单件的分量**——五件普通文件首尾相扣,胜过一件孤证。丢一分:货代那句"加拿大不需要CO"是口头的,没留。

**⑨ 这一单的知识沉淀成文件了吗?——5分**

问的是:半年里你学会的所有东西,现在有多少是**存在文件里而不是存在脑子里**的。存在脑子里的东西会以三个月为半衰期消失,而且没法交给第二个人。R&B:规格表、验货照片清单、AQL速查卡都沉淀下来了,但成本表拖到第19章才补完整、复盘拖到年底才做、条款模板到今晚才成型。**五分。这一项是今晚这张桌子存在的全部理由——你正在把它从5分往上抬。**

**⑩ 下一单能便宜多少、快多少?——8分**

问的是:你能不能用**数字**回答这个问题。答不出来,说明前面九问白问了——复盘的产出必须是下一单的输入。R&B:能答,而且答得很具体——成本从¥16,640降到¥12,292(省¥4,348),时间从170小时降到约50小时(省120小时),时薪从¥54跳到¥269;要省的钱里最大一块是差旅¥3,500,而它能省是因为你已经验过一次厂、建立了信任。丢两分:这套改进目前只对**同一个客户、同一款**成立,换客户还要重估。

**总分:8+4+6+3+10+7+10+9+5+8 = 70分。**

七十分。及格,不优秀。而这张成绩单最值得盯着看的不是总分,是它的**分布**:

> 拿满分的三项——⑤钱的时点、⑦主动报忧、⑧留痕——**全部来自书面纪律**。
> 丢分最惨的三项——④文件包3分、②换料重签4分、⑨知识沉淀5分——**也全部来自书面纪律的缺口**。

同一件事的两面。**这一单里,凡是你写下来的,都替你赚了钱;凡是你想过但没写下来的,都替你亏了钱。**没有第三种情况。

所以这十问最后收敛成一条,你可以只带走这一条:

> **把每一个"我记得""他答应了""应该没问题",换成一行有日期、有签字、有版本号的字。**

三条给下一单的硬改动,现在就写进模板,不许等:**一、线色与物料替换条款进PI,色序表加NO SUBSTITUTION;二、交期分段+外发单列三天buffer+计划上线日进PI;三、出运文件包清单,纸质版进1号箱内侧自封袋,意外备付从¥500-800提到¥1,000。**

本节动作:把这十问抄成一张卡,贴在你桌上。**每一单交付后的第七天,拿出来打一次分,分数记在这单的档案封面上。**你会发现一件事:总分会慢慢往上爬,但爬的方式不是每项都涨一点,而是**丢分项一个一个被条款堵死**——而这,就是"经验"这个词在生意里唯一可测量的含义。

# 第27章 三种开局路径的12个月路线图

**主线推进** —— 年后的一月,一个周六下午,你在家附近的咖啡馆坐了四个小时,对面轮流坐过三个人。

第一个是大学同学阿康。他家在东莞开帽厂,两条车缝线,做了十几年,接的全是国内批发和港澳的单,一顶帽子赚一块出头。他刷着你发的朋友圈——绣花机、五个纸箱、温哥华吧台上那张"Sold 61 last night"的照片——说了一句:"我家有厂,我怎么就做不成这个?"

第二个是小雅。英语专业毕业,做过三年笔译和留学文书,手上只有一台笔记本和一口很好的英语。她问得最直接:"我什么都没有,连布是什么都不知道。多少钱能开始?"

第三个是阿泰。他做亚马逊三年,卖过宠物垫和收纳箱,后台数据看得比你熟,但从来没进过工厂。他说他去年下过一批帽子,一千五百顶压在 FBA 仓里,到现在还剩四百多顶没卖完:"我不缺流量,我缺的是不知道货是怎么来的。"

同一个行业,同一本你刚讲完的经历,三个人的起点完全不一样。你摊开笔记本,给他们画了三张不同的图。

这一章就是那三张图:三条开局路径,各自的优势、陷阱、启动资金、12个月里程碑,以及最后一节——一年之后还剩下几个人的诚实答案。你在第0章开头对号入座过的那三种读者画像(见0.2),这一章是它的兑现。

## 27.1 路径A:有工厂资源(亲友厂)

### 27.1.1 海外前端模式:你管嘴和手,工厂管货

阿康带你去过他家的厂。两条车缝线,三十来个工人,车间尽头堆着半人高的白坯帽,墙上贴着一张手写的排产表,和第8章老崔那块白板(见8.3.1)是同一种东西,只是小一号。他爸六十多岁,坐在办公室里算一本纸质账,一顶帽子的加工费三块二,扣掉工缴、水电、房租、社保,一顶净剩八毛到一块五(见7.2.1的走量代工口径)。阿康指着车间对你说:"设备我们都有,二十台机器,你说我们缺什么?"

缺的是嘴和手。

**海外前端模式**——这是本章第一个新说法,现场定义:工厂负责"货",也就是产能、成本、品控和交期;你负责"嘴"和"手"。**嘴**是把海外客户那句"摸起来厚实、戴旧了好看"翻译成克重、纱支、水洗工艺,再把出厂价翻译成到门价、翻译成客户能听懂的价值(第一部整整四章教的就是这个);**手**是单证、物流、收款、售后、退税——货离开车间以后的一切(第四部七章教的就是这个)。工厂和你合起来是一家外贸公司,只是这家公司的两半分别姓两个姓。

为什么必须分成"嘴手"和"货"两半?因为它们卖的东西根本不是一个东西。**工厂卖的是产能,按顶算钱,越标准越好;你卖的是确定性,按单算钱,越麻烦越值钱。**阿康他爸的报价逻辑是一张 BOM 表(见9.1.1):面料多少、辅料多少、工缴多少、管理摊销多少,加一成毛利报出去。Mike 的采购逻辑完全不是这个,Mike 只问三件事:九月十四号之前能不能摆在我吧台上、logo 会不会绣歪、出了问题谁来跟我说话。这三件事在 BOM 表上一格都没有,而它们才是那 9.9 加元里真正值钱的部分。

把这个差别算成钱,你就懂路径A的全部理由了。

阿康家厂一年出货二十万顶,走代工,单顶净利按 ¥0.8-1.5 取中 ¥1.15,一年净利约 **¥23万**。现在换个算法:从这二十万顶产能里划出一万顶,走定制服务前端。按 R&B 的完全成本口径(见19.5),一单 500 顶、毛利 **¥9,100**;一万顶大约是 20 单,毛利 **¥18万**。也就是说,**同样一万顶产能,走代工赚 ¥1.15万,走海外前端赚 ¥18万,差 15 倍**;而这 15 倍不来自设备、不来自工人、不来自一分钱新投资,只来自嘴和手。这就是为什么产业带里做了二十年加工的老板,一听说"直接对海外客户"就眼睛发亮。

发亮之后,是四个陷阱,每一个都真实地埋掉过人。

**陷阱一:用工厂思维报价。**阿康第一次给一个美国客户报价,报的是 ¥17.5 出厂价折成的 $2.46。客户回了一句"太好了,那就 $2.46 到我仓库"。阿康傻了——运费、关税、GST、他自己的利润,一分没算(第19章那八块公式,他一格都没填)。这是路径A的头号死法:**你报的是货的价,客户理解的是事的价。**

**陷阱二:"自己人不算成本"。**你爸给你的 ¥17.5 到底是不是真成本?大概率不是——里面可能没算你占用的产能机会成本,也可能悄悄多算了一点"给外人也是这个价"的心理价。这个数字失真的后果要到第二年才炸:当你想把量做大、找第二家工厂配合(见12章的备份厂 8:2 分单),你会发现外厂报价比家里高 8%,而你的客户价是照家里的价报的,一旦分单出去就亏。**规则:第一天就让工厂给你一张和给外人一模一样的报价单,写清有效期和阶梯,你再自己在上面加毛利。**内部价可以低,但必须是明码,不能是人情。

**陷阱三:产能绑架。**客户是不按你家设备下单的。Mike 要 dad hat,你家能做;下一个客户要腈纶提花 beanie(见1.1.4),你家没有横机;再下一个要 trucker 后片双层网布,你家没做过。你只能说"我们不做"——说三次,客户就不问第四次了。**路径A的人最容易把自己活成一家单品工厂的销售,而不是一个贸易商。**破法:从第一天起就允许自己"外采",家里的厂是主力厂不是唯一厂,比例参照 8:2(见12章),自家占 8,但那个 2 必须真实存在。

**陷阱四:亲情账目不清。**这一条最贵,单独放到下一节讲。

最后说说这条路上你占的便宜有多大,好让你珍惜。纯 SOHO 起步的人做一单 500 顶,要垫工厂定金 ¥2,625(见14.5.1),打样一轮 ¥300 加七天(见10.7),想找备份厂小单还要贵 3-5%,验货得自己坐高铁去或者花 $200-350/人日请第三方(见11章)。这些成本你**全部为零**:样在自家版房,当天出;验货走两步就到;定金一分不用垫;客户临时加 50 顶,你打个电话就插进去了。**把这些换算成现金,路径A的起步优势大约是 ¥1.5-2万,和三到四个月的时间。**别浪费它。

那就落到十二个月的时间表上。路径A的核心矛盾是"资源现成、能力空白",所以整个节奏是**前慢后快**:前三个月不接单,补语言和素材;后九个月放量。

| 阶段 | 目标 | 关键动作 | 验收线 |
|---|---|---|---|
| 第1-3月 | 学产品语言,把工厂变成案例 | 通读第一部,把自家厂三年做过的款做成 8-12 个案例(照片+规格表+价格带);拍一轮车间素材(见23.2.1的三十条清单);做能力单 capabilities sheet(见20.1.2);做样品包(见22.5,成本约¥390) | 能不看资料口述任意一款的克重、纱支、针数、工期 |
| 第4-6月 | 首批客户,单子小无所谓 | 报价菜单化(见22.4.2三档);冷开发信 300 封(回复率1-3%,见21.3.2);本地/线上双线;第一单一定要走完整流程含单证与退税 | 成交 2-4 单,累计营业额 ¥5-15万,跑通一次完整出运 |
| 第7-9月 | 稳定复购,把首单变成老客 | 交付后30天复盘邮件(见24.1.1);建 ABC 分级维护节奏(见24.2);把工厂的快反能力做成卖点(100-300顶/款、7-15天,见6章) | 老客复购率 ≥40%,单客户占比 <40% |
| 第10-12月 | 扩 SKU,把客户从"买一顶帽子"变成"买一年周边" | 从主款扩到 4 SKU(夏季速干/beanie/trucker,见1.2);做年度 merch 日历式提案(见24.4);外采能力落地,至少完成 1 单非自家厂产品 | 年营业额 ¥60-150万,SKU ≥4,外采单 ≥1 |

本节动作只有一个,今晚就能做:**去找你家厂的会计,要一张最近三个月的真实成本表,再要一张给外部客户的正式报价单。**两张纸放在一起看——它们之间的差额,就是你未来一年要靠嘴和手挣的全部空间。看不清这个空间有多宽,你连该报多少钱都不知道。

### 27.1.2 12个月里程碑与亲友合作边界

上一节那张里程碑表,每一格背后都埋着同一颗雷。第4-6月你要报价,报价就要分利;第7-9月你要接翻单,翻单就会出质量事故;第10-12月你要外采,外采就动了工厂的奶酪。**里程碑是往前走的路,合作边界是路两边的护栏,没有护栏,越往前走越危险。**

先看一个画面。阿康做到第八个月,一切都很顺:营业额做到 ¥90万,客户三个,厂里为他单开了一条线。然后出事了——一批 3,000 顶帽子水洗后缩率超标,客户要求折让 8%,合 ¥21,000。晚饭桌上,他爸放下筷子说了一句:"这样样是你签的字。"阿康说:"洗水是厂里外发的。"两个人谁都没有再说话,那顿饭的剩下二十分钟,只有电视的声音。

这就是全部问题:**不是没有信任,是信任替代了定义。**亲友合作最不愿意做的事,恰恰是坐下来讨论"如果坏事发生怎么办";而合伙这件事的本质,就是事先约定坏结果怎么分。第28章那个完整的反目案例(见28.6),第一年也一样顺。

三条规则,必须在第一单之前说清,而且必须落在纸上。

**规则一:价格怎么定,分利怎么分。**两种结构,选一种,不要混着来。

第一种是**买断差价制**:工厂给你一个明码出厂价,你自负盈亏,赚的赔的都是你的。好处是干净——你报多少客户价、赚几个点,与工厂无关;坏处是原料涨价时你独自承压。所以买断制必须配一条**价格有效期**:出厂价锁 6 个月或锁到某个量,期满重议,与你给客户的报价有效期对齐(见9.7.1,R&B 那张报价单谈到的是 45 天;年度框架单就得锁一年,那你反过来也要向工厂锁一年)。少了这一条,就会出现阿康后来遇到的事:他给客户锁了一年 ¥17.5 的对应价,厂里第二年原料涨,改口 ¥19.2,中间 ¥1.7 ×36,000 顶 = **¥61,200**,凭空冒出来一笔没人认领的亏损。

第二种是**分成制**:工厂按成本加固定加工费出货,超出部分的净利按比例分,常见 6:4 或 7:3(前端拿大头,因为客户是前端带来的)。好处是同盈同亏;坏处是要对账,而对账要求成本透明——你必须能看到 BOM(见9.1.1),否则分成制就是分一个你算不清的数。**判据:你能不能拿到工厂真实的用料率和损耗率(见9.6.1,正常2-3%)?能,才谈分成;不能,只谈买断。**

**规则二:质量事故算谁的。**把责任按"谁的决定造成的"切,不是按"谁的人干的"切。写成三句话就够用:

```
① 与规格表不符(克重/纱支/尺寸/线色/针数)→ 工厂承担返工与折让;
② 规格表本身写错、或客户确认过的封样有问题 → 前端承担;
③ 外发工序(绣花/水洗/印花)出问题 → 谁选的外发厂谁担;
   若为工厂惯用外发厂,工厂担;若为前端指定,前端担。
   —— 上限:单批折让超过该批毛利的 50% 时,超出部分双方对半。
```

最后那句"上限"是保命条款。事故一那 120 顶(见11.6.2)如果发生在一单毛利只有 ¥6,000 的单子上,返工加折让能超过毛利本身,这时候不设上限,一方就会赖账,而赖账一次,合作就结束了。**给亏损设上限,不是为了少赔,是为了让人赔得起。**

**规则三:客户归属。**这一条最容易被跳过,也最容易致命。你带来的客户,厂里的业务员能不能直接联系?工厂自己开发的客户,你能不能收服务费?写清三点:客户名单归属方、联系口径(所有对外邮件署名与收款主体是谁)、以及**散伙条款**——如果哪天不做了,客户跟谁走、在多长时间内不得挖角(常见约定 12-24 个月)。第12章讲过"转厂"(见12章),那是客户绕过贸易商直接找工厂;亲友合作里的转厂更隐蔽,因为它发生在饭桌上。

那句最难说出口的话,给你一版可以直接抄的:

> "咱们把这几条写下来吧。不是不信你——是我俩谁也别指望三年后还记得今天说了啥,写下来将来不用凭记性吵架。而且客户和银行都要看主体、看合同,我们不签,后面正规化那一步(见25.1.1)也过不去。"

最后算一笔账,这笔账应该让所有嫌麻烦的人闭嘴:**一份三页的书面合作协议,自己起草成本为零,请律师审一遍 ¥2,000-5,000,通常一个下午能签完。**而没有它的代价,第28章那个案例里是 ¥10万以上的直接损失,外加一门亲戚。**¥5,000 对 ¥10万,再加上过年还能不能一起吃饭——这道题不需要算。**

本节动作:今天就把上面三条打成一份文档,标题写"××帽厂与××海外业务合作备忘",发给你的亲友,附一句"你看看有没有要改的"。**先发文档,再谈感情。**对方的第一反应,顺便还替你测出了这段合作值不值得开始。

## 27.2 路径B:纯贸易SOHO

### 27.2.1 一个人跑通全流程:最小配置清单

小雅的"办公室"是她卧室里那张一米二的书桌:一台用了四年的笔记本,一个台灯,一部手机。她问的问题非常具体:**"到底多少钱能开始?"**

这是全书最该被诚实回答的问题之一,因为网上的答案两极分化——一种说"零成本创业,一部手机就够",另一种说"没有二十万别碰外贸"。前一种漏掉了所有隐性成本,后一种把工厂的账套在了 SOHO 头上(见0.2的画像二,SOHO 指家庭办公的个体外贸人)。真实答案在中间,而且可以逐项拆开。

**第一块:产品判断工具,¥1,000-2,000。**这一块最容易被省,也最不该省——它是你在工厂面前唯一的底气。
潘通 C 卡一本几百块(见1.4.2);电子克重仪配圆刀取样器 ¥300-600(见1.3.1);软尺、拆线刀、放大镜、磁铁、火柴,合起来不到 ¥100,凑成第2章那套验货工具箱六件(第六件磁铁见9章)。**这一千多块钱的杠杆是全书最高的一笔:第28章那个 3 万美金的事故(见28.2),用的就是里面那把 ¥400 的克重仪。**

**第二块:样品与案例,¥1,500-3,000。**
样品包一套约 **¥390**(见22.5:面料小样卡、工艺对比小样、成品帽两顶、名片与菜单)。但一套不够,你要三到五套,因为它是要送出去的。再加一批自采现货帽做绣花案例:白沟或义乌拿现货帽 20 顶,批发价按 ¥8 算(见6章),成品帽绣花 ¥2.5-3.5/顶,合计约 **¥220**,你就有了 20 顶可以摆在任何客户面前的实物。想再厚一点,拿两个款去打样,开发样 ¥80-150/顶(见10.4.2),¥300 顶天。

**第三块:主体与合规,¥0-5,000/年。**这一块有两条路,岔口在第25章(见25.1.1)。第一年量小,可以先走买单出口 ¥200-800/票(见18.2.2)加个人结汇便利化额度(等值 5 万美元/年,见18章),现金支出接近零;等你越过阈值——**年出口额 ¥30万,或客户开始要正规单据和退税发票**——就必须注册自己的主体,个体户/公司注册加代账,一年约 **¥5,000**。建议:**做第一单之前不注册,做完第三单之前一定注册。**

**第四块:线上门面,¥0-4,000/年。**这里有一条最重要的省钱建议:**第一年不要买阿里国际站。**基础版一年近三万,对没有产品照片、没有案例、没有回复速度的新人是纯粹的浪费(第21章讲过它的运营逻辑,见21.1.2,那是给有供给能力和响应能力的人用的)。第一年的门面靠三样零成本的东西:一个能收表单的落地页或 Notion 页面、一套 Instagram/TikTok 车间内容(见23.3)、一个能发出去的 PDF 菜单(见22.4.2)。真要花钱,Shopify 每月约 ¥280,一年 ¥3,360,而且**要等到你有五个以上稳定 SKU 再开**。

**第五块:差旅,¥3,500。**这一块不能省,并且要花在正确的地方:**两趟产业带**。第一趟看厂和面料市场(第6章那张地图),第二趟盯第一单的生产和验货。¥3,500 是全书统一口径(见19.5第⑦项),高铁加住宿三天一趟。省掉这笔钱的人,第一单几乎必然在验货那一环出事。

**第六块:垫资,¥5,000-20,000。**这是唯一一块随你的接单方式变化的,也是最该提前想清的。
带你算两种极端。走**档一现货帽加成品绣花 50 顶**(见22.4.2的菜单):货款 50×(¥8+¥3)=¥550,快递 5.5kg 按 ¥70/kg 约 ¥385,合计成本约 ¥1,000;客户按 CAD 12.00 收 600 加元 ≈ ¥3,120,收 50% 定金就已经覆盖成本——**垫资峰值几乎为零**。走**档三标准定制 300 顶**:货款 300×¥17.5=¥5,250,工厂定金 30% 要 ¥1,575;客户价 CAD 10.90×300=3,270 加元 ≈ ¥17,004,定金 30% 收 ¥5,101——依然覆盖。**真正的垫资风险只出现在两种情况:客户只肯给 20% 定金,或工厂要 50% 定金。**两个条件同时出现在一单 1,000 顶的生意上,缺口就是 1,000×17.5×50% − 1,000×54.6×20% = 8,750 − 10,920,还好是正的;换成量再大一倍、客户账期再放 30 天,缺口就实实在在地出现了(见14.5.1的余额表和覆盖倍数)。**规则:第一年,任何需要你垫超过 ¥20,000 的单子,宁可不接。**

三档预算合起来:

```
极简版  ¥20,000  工具1,000 + 样品1,500 + 主体0(买单) + 门面0 + 差旅3,500 + 垫资14,000
标准版  ¥35,000  工具2,000 + 样品3,000 + 主体5,000 + 门面3,400 + 差旅3,500 + 垫资18,100
从容版  ¥50,000  标准版 + 备用金15,000(六个月零收入的生活缓冲不含在内)
```

最后,第一年的现实预期,不打折地说。按漏斗算:冷开发信回复率 1-3%(见21.3.2)、本地地推转化率 10-20%(见22.5的扫街漏斗 20→12→8→3→1),你全年真正能成交的,大约是 **8-15 单**;客单价在档一到档三之间,均值 ¥1.5-3万,**营业额 ¥15-30万**;按完全成本口径,定制服务的毛利率下限 25%(见19.6.2),做得好 35%,**毛利 ¥4-10万**;再扣掉上面那些固定投入约 ¥1.5万,**第一年净落 ¥2.5-8.5万**,折合月入两千到七千。

这个数字比大多数人打工少。**它必须被诚实地讲出来,因为它决定了你要准备多少个月的生活费,而生活费准备不够是路径B最常见的死因——不是生意做不成,是人先撑不住。**

本节动作:把上面六块抄成一张表,右边加一列"我已有的",把你已经拥有的东西(手机、电脑、英语、某个行业的人脉)填进去,**算出你真实的缺口。**多数人算完会发现,缺的不是三万块,是那趟去产业带的高铁票和六个月的耐心。

### 27.2.2 两头受气的风险与12个月里程碑

小雅第一次去胶州回来,给你打电话,声音有点闷。她照着你教的五问(见12章)打了七家工厂的电话,四家听到"500顶"就说"太少了不做",两家报了价但比你手里的价高两成,只有一家愿意接,条件是"先付全款"。她说:"我感觉自己在求人。"

她感觉对了。这就是路径B的结构性处境:**上游没量,下游没背书。**

**先说上游。**工厂内部给客户排序的指标,第12章讲过,叫回头率(见12章:>30%为好客户,<10%避开),但更底层的那个数是**年累计量**。一年给工厂十万顶的客户和一年三千顶的客户,拿到的是两套完全不同的待遇:报价单上的价差通常 3-8%,旺季插单排产的优先级差一整个星期,出了事故谁担的默契差一个量级。第8章那件事你还记得——老纪的报价"等了两天"才发出来(见8.2.1),那两天不是效率问题,是排序问题。你在名单的下半段。

再具体一点,新人会被这四件事反复摩擦:一是**旺季报价慢甚至不报**,你追问,对方说"业务在出差";二是**涨价没有缓冲**,大客户能拿到"下批生效"的口头承诺,你拿到的是"这批就按新价";三是**出事故工厂不认**,第11章老崔主动担下那 ¥600 返工费(见11.6),19.5 里已经点破——"这次是运气,不是制度";四是**账期你给不起**,工厂对你只有一个词:款到发货。

**再说下游。**客户会问三个问题,每一个你都答不硬气:"你们工厂在哪?能不能视频看看?"(厂不是你的);"做过哪些品牌?"(第一年没有);"能不能给我们 30 天账期?"(你给不起,而北美品牌单的常规账期是 30-90 天,见5.5.1)。第20章那张客户分类学表(见20.1.1)里,规模越大的客户,这三问越硬。

两头一挤,新人最容易做的动作是**降价**——用价格换工厂的接单意愿,再用价格换客户的信任。这是死路,因为你的成本天生比有厂的人高,价格战你必输;而且降过一次价的客户,第二单还会再问一次。

破局点只有一个方向,两个字:**深。**

**第一层深是垂直。**不要做"帽子供应商",要做"某一群人的帽子供应商"。第20章那个概念叫射程(见20.4:量、交期、定制深度、客户属性四个维度),把它收窄到一个具体人群:精酿酒厂、瑜伽馆、独立咖啡、社区球队、户外俱乐部——选一个,把它做到你比客户还懂。垂直带来三样东西:案例可复用(给 Mike 做过的方案,给下一家酒厂改个 logo 就能提案)、话术可复用、转介绍会自己发生(Dana 就是 Mike 转介绍来的,见22章)。

**第二层深是服务。**你没有量,但你有一样大厂和大贸易商永远给不了的东西:**麻烦**。24 小时内出 mockup(见22.4.1)、50 顶起做、代客户改 logo 文件、把报价做成一页 PDF 菜单(见22.4.2)、发货前拍一段开箱视频。这些事在一单 10 万顶的生意里是负担,在一单 80 顶的生意里是核心竞争力。

**看数字。**Dana 那一单 80 顶(见22章):收入 ¥4,992,成本 ¥1,961,毛利 **¥3,031,毛利率 60.7%**;R&B 那一单 500 顶,完全成本口径毛利率 35.4%。**量小的那一单,毛利率高出 25 个百分点。**这不是巧合:量越小,客户越买不到别人的服务,你的"麻烦"越值钱。**路径B的活法,就是在这个反比关系里往小的那一头站,直到你攒够量,再往大的那一头挪。**

那么什么时候你才算在工厂面前"有量"了?给一条可执行的阈值:**年累计出货 2 万顶,或连续三个月每月稳定 2,000 顶以上**——过了这条线,你才配和工厂谈二级报价、谈账期、谈优先排产。在那之前,你换优先级的筹码不是量,是这四条:**付款干净不拖、规格一次说清、不半夜打电话催、出事不甩锅。**这四条是免费的,而且会攒成尾声里说的那种复利。

十二个月怎么走,时间表和路径A完全不同——路径B的核心矛盾是"能力空白、资源空白、现金有限",所以节奏是**小步快跑,先跑通,再跑宽**。

| 阶段 | 目标 | 关键动作 | 验收线 |
|---|---|---|---|
| 第1-2月 | 补语言,建工具 | 读完第一部并做完四章作业;配齐验货工具箱;跑一趟面料市场和辅料市场;整理 30 个术语中英对照 | 能看懂一张陌生的工厂报价单,并指出三个可疑项 |
| 第3-4月 | 跑通一单最小闭环 | 选定垂直人群;做样品包和菜单;找一个本地小客户或朋友的店,**哪怕只做 50 顶、不赚钱也要做完整流程**:规格表→打样→下单→验货→发货→收款 | 完成 1 单,拿到 1 组实拍案例照,建立 1 家可用工厂 |
| 第5-8月 | 开客,熬过沉默期 | 每周 50 封开发信 + 每周 1 次本地扫街(20→12→8→3→1);内容账号开起来(见23.3);第一个海外单走完整单证与物流(第16-18章) | 成交 3-6 单,累计营业额 ¥8-20万,建立备份厂 |
| 第9-12月 | 提毛利,建复购 | 客户 ABC 分级(见24.2);翻单让利设计(见24.1.2);把报价从"成本加成"切到"市场锚定"(见19.6.1);跨过 ¥30万门槛后注册主体、开通退税 | 老客贡献 ≥40% 营业额,完全成本毛利率 ≥30%,主体与收款通道正规化 |

第5-8月那一格要单独说一句,它是路径B真正的生死关。**这四个月里,你的漏斗数字决定了你几乎必然经历一段"投入很多、成交为零"的沉默期**——每周 50 封信,按 2% 回复率是一周一个回复,一个回复到一单成交还要过报价、寄样、砍价三关。**很多人不是死在能力上,是死在第五个月的那个周日晚上。**提前知道它会来,你就能把它当成日程表上的一段路,而不是一个否定。

本节动作:现在就写下你的垂直人群,只准写一个,并列出你所在城市里属于这个人群的 20 个具体名字(店名、俱乐部名、公司名)。**列不出 20 个,换一个人群;列得出,你的第3-4月就有事干了。**

## 27.3 路径C:跨境电商起步

### 27.3.1 先C后B:用零售数据反哺定制

阿泰把笔记本转过来给你看后台。一张表,是他去年那批帽子的销售分色统计:navy 占 47%、black 占 31%、olive 占 14%、burgundy 占 8%。再点一张,是退货原因分布:尺寸不合 38%、颜色与图片不符 26%、质量问题 11%、其他 25%,整体退货率 6.4%(帽子类目常规区间 5-10%,见22章)。

你看着这两张表,忽然意识到一件事:**这两张表,你和小雅都没有,而且花钱也买不到。**

这就是路径C的核心资产,把它讲透:**你离消费者最近,你手里有真实成交数据。**纯贸易 SOHO 判断"什么颜色好卖",靠的是问工厂、看竞品、凭感觉;你判断,靠的是一年三千多个真实付款的人。这份数据在 B 端谈判桌上的价值,远超它在你自己店铺里的价值。

怎么反哺?三个具体用法,每一个都能直接变成钱。

**用法一:选品与提案的证据。**你去见一个客户,提案里可以写这样一句话:"藏青和黑色占我们零售端 78% 的销量,建议首批只做这两个色;olive 好看但零售占比 14%,建议第二批再上。"——这句话小雅说不出来,因为她没有那 78%。**在客户眼里,你从一个报价的变成了一个懂消费者的**,而顾问式提案(见24.4)正是把单笔订单变成年度生意的桥。

**用法二:定价的锚。**你知道 $19.99 和 $24.99 的转化率差多少,知道 $17 是这顶帽子的价格地板(见22.1.2),也知道退货率会怎么随价格带变化。所以当 B 端客户说"我们零售想卖 $29.99,你觉得行不行",你能给出的不是猜测,是一条曲线。第19章讲过定价的两种法子(见19.6.1),市场锚定法最缺的就是锚——你有现成的。

**用法三,也是最值钱的一个:用自己的库存做 MOQ 池。**这一条几乎所有人都想不到。你仓里那四百多顶滞销的帽子,在零售端是负债,在 B 端是**产能**:客户要 50 顶带 logo 的现货帽,交期 10 天——这正是菜单档一(见22.4.2:现货帽+成品绣花,MOQ 50,CAD 12.00/顶),纯定制路线做不到,因为从下单到到门至少 35 天。**你的滞销库存,是你的快反能力。**一批压手的货,换个渠道就成了别人给不了的服务。

那什么时候该从 C 转向 B?三个信号,同时出现两个就动手:

**信号一,链接活过了新品期。**净利率稳定在 12-18%(见22.1.2的类目口径),ACOS 长期低于 25%,不再靠烧钱维持。这说明你的现金流可以支撑另一件事的启动。
**信号二,B 端询盘自己冒出来了。**listing 的问答区或客服邮箱里出现 "Do you do bulk orders with our logo?" 这类问题,一个季度里超过三次。这些询盘是免费的,而且质量很高——对方已经看过你的实物。
**信号三,库存周转开始拖累你。**周转低于 3 次/年,现金越来越多地睡在货架上。B 端的意义就在这里:**它是不占库存、不花广告费、款到发货的现金流。**

转的时候做四个动作:在包装里放一张卡片,一面是复购码,一面写"Custom orders for your brand — 50 pcs minimum";把 listing 的 A+ 页面加一段车间内容(见23.1的流量洼地);把 Amazon 的好评里那些场景词(婚礼、球队、公司年会、开业活动)整理成 B 端案例库;把 Etsy 定制单当漏斗——Etsy 上买 3 顶伴娘帽的人,很可能明年要给公司订 200 顶。

最后把两条路的经济性并排放一次,这个对比会改变你对"哪个更赚钱"的直觉。

| | C 端(Amazon,$19.99) | B 端(定制 500 顶) |
|---|---|---|
| 单顶净利 | $4.93(24.7%,见22.1.2) | ¥18.2 ≈ $2.56(¥9,100÷500) |
| 单笔成交 | 1 顶 | 500 顶 |
| 单笔净利 | $4.93 ≈ ¥35 | ¥9,100 |
| 广告成本 | $2.50/顶,且逐年上涨 | 0 |
| 库存占用 | 45 天以上 | 0(款到生产) |
| 回款周期 | 平台账期 14 天 | 定金即时,尾款发货前 |
| 收入确定性 | 每天重新竞价 | 老客年度复购 |

**看清楚这张表的关键:B 端的单顶利润只有 C 端的一半,但一次成交顶 C 端 500 次。**一顶帽子在亚马逊上赚 $4.93,是你和几百个对手每天从零开始厮杀换来的;在 B 端赚 $2.56,是客户主动写邮件给你的。这就是为什么老卖家几乎都在往 B 端渗透:**C 端赚的是流量的钱,流量会涨价;B 端赚的是关系的钱,关系会增值。**

本节动作:导出你店铺过去 12 个月的分色销量、分尺码销量和退货原因分布,做成一页 PDF,标题就叫"我们的零售端数据"。**下一次见 B 端客户,把这一页放在报价单前面。**你会发现对话的重心从"你多少钱"变成"你觉得我们该做什么"——那一刻你的报价权就变了(见20.1.2)。

### 27.3.2 库存与广告黑洞:12个月现金流推演

现在做这一章最硬的一件事:把阿泰去年踩的坑,一个月一个月算出来。

设定说清楚,你可以照着换自己的数:一顶六片磨毛斜纹棒球帽,出厂价 ¥17.5;首批备货 1,500 顶,货款 ¥26,250;头程走海运,1,500 顶按嵌套装箱 15 箱 = 1.44 CBM(见4.6.2的箱规),海运到美西 FBA 仓按 ¥3,000/方算约 ¥4,320;**首批总投入 ¥30,570,取整 ¥3万**。售价 $19.99,走 FBA。广告预算 ¥2万。

先把"每卖一顶回多少现金"算清楚,注意口径:货值和头程在下单时已经付掉了,所以卖货阶段的现金回款不再扣它们,否则重复计算(19.5 提过这种重复计算是手工成本表里最常见的错)。

```
每单毛回款 = 19.99 − 佣金3.00 − FBA配送4.50 − 退货损耗0.80 − 仓储0.43 = $11.26
再减广告:
  新品期 ACOS 40%,广告 $8.00/单 → 每单回 $3.26
  成长期 ACOS 25%,广告 $5.00/单 → 每单回 $6.26
  成熟期 ACOS 12.5%,广告 $2.50/单 → 每单回 $8.76
```

三个数,要一个一个盯着看。

**第一个:回正在第9个月。**不是第3个月,不是第6个月——**第9个月**。而且这还是一条"做得不错"的链接:一年卖掉 3,060 顶,年末账上 ¥85,868 现金加 440 顶库存。**任何跟你说"跨境电商三个月回本"的人,要么在卖课,要么在算一本漏了库存的账。**

**第二个:第7-8月那个坑,是你自己挖的,而且必须挖。**看第 6 月末,累计缺口只剩 ¥9,329,眼看着第 7 月就要转正——然后你补了第二批货,累计现金一下被打回 −¥16,755,回正整整推后三个月。**如果你不补货,你会在第 7 个月回正,然后在第 8 个月断货,BSR 掉光,回来重新烧一遍新品期的广告。**这就是库存生意的宿命:**现金流永远在追着增长跑,长得越快,追得越狼狈。**能不能跨过这一关,和运营水平无关,只和你手上有没有那 ¥40,760 有关。

**第三个,最扎心的一个:广告预算 ¥2万,实际花了多少?**
380单×$8 + 1,030单×$5 + 1,650单×$2.5 = $12,315 ≈ **¥87,437**。
**那 ¥2万,在第五个月就见底了。**很多人到这里就下线关广告,而关广告的直接后果是排名下滑、自然位丢失,前面五个月的钱等于打水漂。**所以广告不是一笔预算,是一条必须连续供血的管子;算准它的正确方法,不是"我打算花多少",而是"每一单要花多少 × 我要卖多少单"。**

那什么情况下会死?三种,各给一个判据。

**死法一:卖不动。**月销卡在 60-80 不涨,ACOS 一直在 40% 下不来。一年销 800 顶,回款约 ¥18,500,库存剩 700 顶(成本 ¥14,280)压在仓里,还要交长期仓储费。累计仍是 −¥12,000,而那 700 顶最后大概率是打折清或者付费弃置。**这是最常见的死法,而且它死得很慢——慢到你会一直觉得"再投一点广告就起来了"。**

**死法二:卖太好。**第 6 月就断货。补货链条是:生产 12-18 天 + 海运 30 天 + 入仓上架 7 天 ≈ **60 天**(见4章与17章)。断货 45 天,排名清零。**在库存生意里,卖太好和卖不动的结局一样,只是死因写得体面一点。**

**死法三:价格带失控。**竞品降到 $16.99,你不跟就没单,跟了就击穿 $17 那条价格地板(见22.1.2),每卖一顶都在亏。这一条你无法靠努力解决,只能靠"不进这个价格带"来预防。

所以给你一条必须写死在纸上的**离场线**,请抄下来贴在显示器上:

> **第6个月末,如果累计现金缺口仍大于首批投入的 50%(即 −¥15,000 以下),且月销未过 200 单——停止补货,启动清仓。**

这条线的意义不是悲观,是把"我要不要放弃"这个情绪问题,提前变成一个数字问题。**做库存生意的人,进场之前必须先写好离场的条件;写不出来,就说明你没打算认真算这笔账。**

最后一句给路径C的人:**你的优势是数据和流量,你的死穴是现金全部变成了货。**所以最稳的走法从来不是"把店做大",而是上一节说的那条——**用 C 端养数据和现金流,用 B 端去掉库存和广告**。两条腿走路的人,活到第二年的概率,比只做一条腿的高得多。

## 27.4 横向对比表+一年存活率诚实评估

三张图画完了,咖啡馆的窗外已经黑了。阿康、小雅、阿泰三个人的问题最后汇成同一个:**"那到底哪条路最好?"**

没有最好的路,只有和你手上的牌匹配的路。所以先把三条路摆在一张表里,四个维度,一格不含糊。

| | 路径A 亲友厂前端 | 路径B 纯贸易SOHO | 路径C 跨境电商起步 |
|---|---|---|---|
| **启动资金** | ¥1-2万(工具+样品+差旅,不含垫资) | ¥2-5万 | ¥5-15万(首批库存+广告) |
| **最大成本项** | 机会成本(你不去帮家里管厂了) | 时间(六个月无收入的生活费) | 现金(全部变成货) |
| **跑通首单需要** | 2-3个月 | 3-5个月 | 3-4个月(含生产海运) |
| **12个月营业额量级** | ¥60-150万 | ¥15-30万 | ¥40-80万 |
| **12个月净落** | ¥10-30万 | ¥2.5-8.5万 | −¥3万 到 +¥10万 |
| **最缺的技能** | 外语、单证、客户语言 | 产品判断、供应链 | 供应链、成本核算 |
| **技能补齐周期** | 3-6个月(第一、四部) | 9-12个月(全书) | 4-6个月(第一、三部) |
| **主要风险** | 亲友边界、产能绑架 | 两头受气、沉默期弃疗 | 库存滞销、广告失控 |
| **风险性质** | 关系风险,不致命但难修 | 时间风险,慢性 | 现金风险,急性 |
| **失败的样子** | 回去帮家里管厂 | 第五个月去上班了 | 钱压在仓里出不来 |
| **三年天花板** | 年毛利 ¥50-150万(有产能背书) | 年毛利 ¥18-30万(见尾声的天花板数学) | 取决于能否转B或做品牌 |
| **可逆性** | 高 | 高 | 低(库存不可逆) |

表里那一行"风险性质"值得单独说一句,因为它决定了三种人该用什么姿势试错。**路径A和B的风险是慢性的——你可以随时停下,损失的是时间;路径C的风险是急性的——一旦下单,钱就变成了货,而货不能变回钱。**所以对完全没把握的人,顺序建议是:**先B后C**,先用不占库存的方式跑通供应链认知,再决定要不要压货。阿泰去年那四百顶,交的就是这个顺序的学费。

现在讲这一章最该讲、也最少有人愿意讲的一段:**一年之后,还剩几个人?**

先把"存活"定义清楚,不然这个数字没意义。**存活 = 12个月后仍在持续接单,且当年经营性现金净流为正(不含你自己的时间成本)。**注意这个定义很宽松:它不要求你赚到工资,只要求你没有净亏钱、并且还在做。

按这个定义,给一个量级判断——**这是从行业结构和漏斗数字推出来的量级,不是统计数据,请当成数量级直觉用,不要当成精确概率**:

- **路径A:十个里活下来五到六个。**最高。原因不是他们更能干,是**退出成本低而失败不致命**:接不到客户,人还在厂里,损失的只是这一年多花的精力。同样的原因,他们的失败也最没有痛感——不是"倒闭了",是"慢慢不做了"。
- **路径B:十个里活下来两到三个。**中间。死因高度集中在两处:一是生活费撑不到第五个月(前面算过,沉默期在第5-8月);二是第一单出事故赔进去,信心和现金一起断。
- **路径C:十个里活下来一到两个。**最低。**不是因为跨境电商难,是因为它的失败方式是急性的**——库存和广告两个黑洞,任何一个失控都在三个月内见分晓,而且钱拿不回来。上一节那张 12 个月现金流表,第 6 月末那条离场线,就是画给这一到两个人之外的那八个人看的。

依据是什么?三条,都在前面的章节里。

**第一条是行业结构。**第0章开头泼的三盆冷水(见0.1):成熟、分散、毛利薄。没有风口意味着没有系统性红利兜着你,你的每一单都得从别人碗里抢;门槛低意味着你能进,别人也能进,你的每一个方法很快会被人复制。**在这样的行业里,高存活率本身就是反常识的。**

**第二条是漏斗数字。**冷开发信回复率 1-3%(见21.3.2),地推扫街 20 家转化 1 单(见22.5),这两个数是全书前向承诺过的,它们决定了**前四个月几乎必然接近零成交**。而人对"投入四个月零回报"的耐受力,天生就不高。

**第三条是第一单的真相。**第19章那张三行表最后一行(见19.5):首单 170 小时,按机会成本折 ¥17,000,完全成本口径毛利 ¥9,100 —— 也就是说,**你第一单真实的实现时薪是 ¥54**。这个数字必须被看见:它不是失败,它是学费的另一种写法;**但一个不知道第一单只能挣到 ¥54/小时的人,会在算清这笔账的那天晚上放弃。**

再说三条**共同死因**,它们跨越路径,谁也躲不掉。

**其一,没有第二个客户。**首单成功的人,超过一半会把接下来三个月全部花在服务这一个客户上,然后在这个客户消失的那个月被打回原形。**规则:第一单交付的当周,必须开始找第二个客户;单客户营收占比长期不得超过 40%。**
**其二,现金断在补货或垫资上。**路径C断在补第二批货,路径B断在客户定金不够、工厂定金要得多,路径A断在替家里垫了原料款。**规则:任何时候,账上现金不得低于未来 60 天的固定支出加最大在途垫资。**
**其三,在第4-8个月放弃。**这不是意志力问题,是预期管理问题。**知道沉默期会来的人,把它当路;不知道的人,把它当判决。**

最后,回答"我该选哪条"。不要看哪条钱多,问自己三个问题,诚实回答。

**问题一:我最缺的是什么——资源,还是客户?**缺资源(不认识工厂、不懂产品)的人,别从库存生意开始;缺客户(有厂、有货、没销路)的人,所有的钱和时间都应该花在嘴和手上,而不是再添设备。**你最缺的那一样,就是你这一年唯一该补的那一样。**

**问题二:我能承受多久没有收入?**把这个数字算出来,精确到月。**低于 6 个月,三条路都不要全职开始,先用业余时间跑路径B的前四个月;有 6-12 个月,B 和 C 都可以;A 因为有厂里的现金流托着,门槛最低。**这道题不是关于勇气,是关于你能不能活到第九个月——上一节那张表已经告诉你,回正常常发生在第九个月。

**问题三:我更愿意把钱压在库存里,还是把时间压在人身上?**这是三条路最本质的分野。路径C是**用现金买增长**:你下单、你投广告,数据每天给你反馈,爽快,但错了就是钱没了。路径A和B是**用时间买信任**:你陪客户改十版 mockup、你去工厂盯三天、你在第五个月还在发第两百封开发信,慢,枯燥,但攒下来的东西不会一夜归零。**没有对错,只有性格。选和自己性格拧着的那条路,你会在第五个月自己劝退自己。**

三个问题答完,路就自己选出来了。剩下的十二个月,照着你那一格的里程碑表往前走——**先跑通一单,再跑宽十单,再跑深一个人群。**

# 第28章 风险总清单与五个死亡案例

**主线推进** —— 一月的一个深夜,你在手机上翻一个八百多人的外贸行业群。

这个群你去年三月进的,当时刚起步,靠它问过"胶州哪家厂能做小单""专线和空派差多少"。翻到最上面,你在群成员列表里找几个名字——那个去年一直在分享亚马逊帽子链接数据的人,最后一条发言停在九月;那个和你同一周问"O/A 账期敢不敢给"的人,十一月退了群;还有一个,你记得很清楚,五月的时候在群里发过一张三万美金的 PI 截图,配文"开张大吉",后来再没说过话。

八百多人里,像这样安静下去的,你数了数,不下二三十个。**做这门生意的人不是被打败的,是慢慢消失的。**

这一章不讲怎么成功。前面二十七章讲的全是怎么把一单做成、做好、做久;这一章只讲一件事:**怎么不死。**

五个案例,全部为教学虚构(第0章已统一声明),但每一个的数字、时间线和对话都按真实质感构造,因为模糊的教训记不住。看完你会发现,五个案例的死法完全不同,根因却是同一个。

## 28.1 风险矩阵:概率×损失四象限

先做一件事:找一张 A4 纸,横过来,画两条轴。

横轴是**概率**,刻度不要用"高/中/低"这种没法执行的词,用一个你能数的数:**每做十单,这件事发生几次。**纵轴是**损失**,刻度也不要用"严重/一般",用钱:**一次发生,吃掉这一单毛利的百分之多少,或者绝对金额多少。**

两条轴一画,平面被切成四块。现在把这一年你经历过、听说过、以及这本书里出现过的所有风险,一个一个往格子里扔。

**第Ⅰ象限:高概率、低损失。**判据:**每十单发生三次以上,单次损失低于该单毛利的 20%。**
往里扔:绣花线色偏差(事故一那 120 顶,见11.6.2)、交期延三到五天(事故二,见4.7.3)、尺寸在允差边缘(帽围±1cm,见2.5)、短装几顶、包装破损、快递延误两天、客户临时改 logo 位置、汇率小幅波动 1-2%、清关补一份文件(事故三那 CAD 150,见18.4.1)。
这一格的性格是:**它一定会发生,只是不知道发生在哪一单。**你去年做了三单半(R&B、Dana、R&B 翻单),三次事故全部落在这一格——这不是你运气差,这是这一格的定义。
**对策是流程,不是运气,也不是保险。**没有人会为"色差"买保险,因为它太常见了,保费必然高于损失。你能做的是把它变成动作:样带书面确认(见3.1.8)、封样双份骑缝签字(见10.6)、交期起算条款加两周 buffer(见15.5.1)、AQL 抽样与验货操六式(见第2章工具、第11章)、留痕点清单(见第4章)。**流程的本质,是用一次性的麻烦换掉重复发生的小损失。**
**并且,这一格要进报价。**19.5 那条规则说的就是它:报价时额外预留 5-8 个百分点,其中折让售后 1-1.5%、意外与查验 1%。**第Ⅰ象限的风险不是"避免"的,是"定价进去"的。**

**第Ⅱ象限:低概率、高损失。**判据:**每五十到一百单发生一次,单次损失等于或超过你一整年的利润。**
往里扔:侵权货被扣销毁(见25.4.1)、赊销坏账客户破产(见14.2)、整批大货与封样不符被退(见28.2)、无保险的海运货损(见17.7)、合伙反目(见27.1.2)、客户破产前的突击下单、工厂卷款跑路。
这一格的性格正好相反:**你可能做三年都碰不到一次,而碰到一次就出局。**它最危险的地方在于——**因为它从没发生过,你会越来越确信它不会发生。**做了两年顺风顺水的人,给新客户开 O/A 账期的手会越来越松,这就是第Ⅱ象限吃人的方式。
**对策是条款、保险和分散,而不是流程。**流程在这一格几乎没用,因为你无法通过"更仔细"来防止一个客户破产。能用的只有三样:**写进合同的条款**(知识产权保证与赔偿、逾期停发、责任上限)、**买来的转移**(出口信用保险、货运险,见17.7与14.2)、**结构性的分散**(单客户营收占比 <40%、单客户应收余额 < 年毛利的 30%)。
**并且,这一格不进报价。**你不可能在每单报价里加 5% 去覆盖一个可能吃掉全年利润的事件——那样你的价格没有竞争力。**第Ⅱ象限的正确做法是"要么转移出去,要么根本不接"。**

**第Ⅲ象限:高概率、高损失。**这一格理论上不该有东西。**如果你发现有,那不是风险,是你的生意模式坏了。**
真实会落进来的东西长这样:给没做过背调的新客户放 60 天 O/A;单一客户占你营收的 80%;没有书面规格表就开大货;接一个你没有能力生产的品类还答应了交期;用个人账户收一笔六位数的货款(见25.2.3)。
**对策不是管理,是不做,或者把它重构到别的象限去。**放 O/A 给新客户是第Ⅲ象限,给它加一份信保就掉到第Ⅱ象限;没有规格表开大货是第Ⅲ象限,补一张签字的规格表就掉到第Ⅰ象限。**这一格的价值就在于:它逼你承认某些事不是"小心一点就行"。**

**第Ⅳ象限:低概率、低损失。**判据:**很少发生,发生了也就几百块。**
往里扔:CO 后补加急费 ¥200(见16.6)、改单费 USD 50-100(见16.6)、一顶样品寄丢、客户临时要一份成分声明。
**对策是忽略。**这一格唯一的错误就是花力气管它——为一件三年发生一次、一次损失两百块的事写一套流程,流程本身的成本远高于风险。**新人常犯的毛病恰恰是在这一格里追求完美,而第Ⅱ象限门户大开。**

现在把四格串起来算一笔账,这笔账会颠覆你的直觉。用期望损失,也就是概率乘损失,折算成"每一单该为它准备多少钱":

```
绣花色差     30% × ¥600   = ¥180/单   ← 你花了最多精力防的
交期延误     30% × ¥400   = ¥120/单
清关查验      8% × ¥780   = ¥62/单
────────────────────────────────
第Ⅰ象限合计                ≈ ¥360/单

侵权扣货      1% × ¥50,000 = ¥500/单
赊销坏账      3% × ¥30,000 = ¥900/单  ← 你几乎没防的
大货整批不符  1% × ¥65,000 = ¥650/单
────────────────────────────────
第Ⅱ象限合计                ≈ ¥2,050/单
```

**第Ⅱ象限的期望损失,是第Ⅰ象限的五倍多。**而你去年一整年的注意力,九成花在第Ⅰ象限——盯色差、盯交期、盯箱唛。这不是你的问题,是所有人的问题:**第Ⅰ象限的风险会尖叫,第Ⅱ象限的风险很安静。**尖叫的那个抢走了你全部的注意力,安静的那个在等一个合适的年份。

本节动作:把上面那张 A4 纸画出来,把你自己手上正在跑的每一单、每一个客户、每一家工厂的风险都扔进格子。**扔完之后只做一件事:看第Ⅱ象限那一格,数一数里面有几条你已经用条款或保险处理过了。**一条都没有的人,后面五个案例请一个字不落地读完——它们全部来自这一格。

## 28.2 案例一:样品与大货不符(3万美金)

阿文做了两年 SOHO,第三年接到他职业生涯最大的一单。

客户是美国一家户外装备品牌的采购代理,订 12,000 顶五片帆布帽,单价 $2.55,货值 **$30,600**,折人民币约 ¥217,000。付款 30/70,定金到账那天他发了朋友圈。

样品是工厂版房打的,两轮,客户很满意——手感厚实、挺括、帽型饱满,签字封样寄回美国。规格表上写的是:"100% 棉,斜纹,磨毛,藏青。"就这一行。

三个月后货到洛杉矶。客户随机抽 20 顶送第三方实验室,报告回来:**克重 213 g/㎡,封样是 241 g/㎡;成分 100% 棉没错,但纱支从 21 支变成了 32 支**(见1.1.5,支数越大纱越细,布越薄)。翻译成人话:同样是全棉磨毛斜纹,大货比样品薄了整整一档,手一摸就知道不是同一块布。

**这件事是怎么发生的?**不是工厂故意骗人,这一点很重要。版房打样用的是货架上那卷"打样布"——精梳、克重足、手感好,版房永远留着好布打样,因为样品要好看(见1.3.2的同缸布头与打样布);大货是采购部按"100% 棉斜纹磨毛藏青"这个描述去市场上订的,订到了一款便宜两块钱一米的布,规格描述完全符合那一行字。**规格表上那一行字,把两块完全不同的布都包含进去了。**

客户的反应很职业,也很致命:一封索赔函,附实验室报告、开箱照、封样与大货的并排对比照,要求全额退款或 **40% 折让**。阿文飞了一趟美国,最后谈到 **30% 折让 = $9,180 ≈ ¥65,000**,外加空运补发 800 顶合格品的费用 ¥18,000。

算一下这一单的结局:原本毛利 $3,800 ≈ ¥27,000,现在变成 **净亏 ¥56,000**,相当于他前六个月的全部利润。工厂只肯担一半的布差价 ¥9,000,理由说得他没法反驳:"规格表是你给的,我们完全按规格表做的。"

**三条根因,一条都不复杂。**

**根因一:规格表没有写死物性参数。**"100% 棉斜纹磨毛藏青"不是规格,是形容词。真正的规格长这样(见2.5的规格表与1.3.1的允差口径):**克重 240 g/㎡ ±5%;纱支 21 支;经纬密度 108×58,允差 ±4 根;后整磨毛;色号 PMS 289C。**十几个字符的差别,就是 ¥65,000。

**根因二:封样没有留双份、没有骑缝签字。**阿文的封样只寄给了客户一份,自己手上没有;工厂那边也没有留封样袋(见10.6)。所以争议发生时,他连"当初到底是哪块布"都无法自证。**封样的铁律是一式两份、袋装骑缝签字、双方各执其一(见10.6);客户那边也要留一顶,就多打一顶,每一顶的吊牌上都写全签字、日期、订单号和规格表版本号。**

**根因三:验货只验了外观。**他请了第三方验货,报告写得很漂亮:AQL 抽样合格,疵点在标准内(见第11章)。**但 AQL 管的是疵点,不管物性。**没有人剪一片布下来称一称——而这件事只需要一把 ¥400 的克重仪、一个圆刀取样器和三十秒(见1.3.1)。

**最刺痛的部分在这里:防住它的总成本不到 ¥300。**封样多做两顶约 ¥160,规格表上多打十几个字符 ¥0,验货时剪三片布称克重 ¥0(工具已经在你包里了)。**¥300 换 ¥65,000,倍率两百多倍——这是全书投入产出比最高的三个动作。**

最后把那段关键对话还原出来,因为你迟早会遇到一模一样的版本。

阿文其实问过。下单之后他给工厂发过一句微信:

> **你**:"大货用的布,和样品是同一批吗?"
> **工厂**:"都是我们常做的那种布,放心。"

"我们常做的那种布"——**这是一句标准托辞,它听起来像保证,实际上什么都没承诺。**它的信息量等于零,但它成功地让阿文放下了心,这正是托辞的功能。

正确的问法是把它拆成四个无法含糊的问题,你可以直接抄走:

> "大货的布,①克重多少 g/㎡?②纱支和密度是多少?③哪家布厂、什么货号?④能不能寄一块大货布的同缸布头给我,我要和封样一起存档。"

四个问题都问完,对方要么给你四个具体答案(那你就安全了),要么开始绕——**而对方一开始绕,你就已经知道答案了。**

本节动作,现在就改你的验货清单:**把"剪一片布称克重"提到第一行,排在"看 logo"前面。**外观问题在验货时能看见,布的问题只有秤能看见;而外观赔的是几顶,布赔的是整批。

## 28.3 案例二:汇率吃掉全年利润

这个案例没有事故,没有翻车,没有一个人做错事。**所有人都尽职尽责,然后一年白干了三分之一。**

主角是一个做走量代工的贸易商,年营业额 **¥300万**,毛利率按完全成本口径 **15%**(走量代工的典型水平,比定制服务的 35.4% 低得多,见19.6.2的毛利率下限口径),全年毛利 **¥45万**。

二月,他签下一个年度框架单:USD 480,000,分四批交货,交期分布在当年 5 月到 11 月。报价用的内部汇率是 **1美元 = ¥7.10**(全书统一口径,见9.7.2的内部汇率与汇率buffer),这是他签约那天的市场价,报价单上没有写任何汇率条款。

然后人民币开始升值。到 8 月,汇率走到 6.85;到 11 月,6.75。**从 7.10 到 6.75,人民币升值 4.9%,每一美元少收 ¥0.35。**

带你算这笔账:

```
已交货并结汇金额       USD 340,000
每美元少收             ¥7.10 − ¥6.75 = ¥0.35
汇兑损失               340,000 × 0.35 = ¥119,000

全年毛利(按报价时算)  ¥450,000
实际到手               ¥450,000 − ¥119,000 = ¥331,000
毛利被吃掉             26.4%
```

如果汇率再往下走到 6.60(升值 7%),损失变成 ¥170,000,**吃掉全年毛利的 37.8%,接近四成**。而这一年他一顶帽子没做错,一次事故没出,一个客户没丢。

**机制必须讲透,因为这决定了你要不要在意它。**

外贸生意在汇率上是**全额暴露**的:你的收入 100% 是外币,你的成本(货款、运费、工资、房租)100% 是人民币,中间没有任何天然的抵消,这在财务上叫缺乏自然对冲(见14.5.2)。这一点和进口生意正好相反,也和有海外采购的企业不同——他们收外币也付外币,汇率一涨一跌互相抵消。**你没有这个奢侈。**

更关键的是下面这个公式,它是本节最该背下来的东西:

```
毛利变动率 = 汇率变动率 ÷ 毛利率
```

用三个真实口径验算一遍,你就明白为什么同一个 3% 的汇率波动,对不同的人是完全不同的事:

- **走量代工,毛利率 8%**(见19.6.2):汇率动 3% → 毛利动 **37.5%**。三个点的汇率,能把你的利润砍掉近四成。
- **定制服务,毛利率 35.4%**(R&B 口径,见19.5):汇率动 3% → 毛利动 **8.5%**。疼,但活得下来。
- **现货贴牌,毛利率 30%**(见19.6.2):汇率动 3% → 毛利动 10%。

**读懂这个公式,你会立刻明白第0章那句"毛利薄"的第二层含义:薄毛利不只是赚得少,是抗击打能力差。**同样一场汇率波动,定制服务的人皱皱眉,走量代工的人可能一年白干。**所以毛利率不只是赚多少的问题,它是你的安全边际。**

三层防线,从便宜到贵排:

**第一层,报价条款,成本为零,新人必做。**在报价单和 PI 里加一条汇率重议条款(见9.7.2)。可以直接抄:

> 本报价基于 USD/CNY = 7.10 的汇率基准。自本报价单出具之日起,若该汇率波动超过 ±2%,双方应就价格重新协商。
> This quotation is based on a reference rate of USD/CNY 7.10. Should the rate fluctuate by more than ±2% from the date hereof, both parties shall renegotiate the price accordingly.

注意 ±2% 这个数不是随便定的:它对应"毛利率 15% 的生意,毛利波动 13%"——**这是大多数人可以自己吸收的上限,超过它就该有人出来说话。**这条款客户未必答应,但它至少把汇率变成了一个可以谈的话题,而不是你一个人默默承担的事。

**第二层,锁汇,适合有量的人。**远期结汇(见14.5.2):和银行约定一个未来日期的固定汇率,到期按约定价结汇。代价是要么占用授信额度,要么交 3-5% 的保证金,单笔通常有起点(常见 USD 50,000 以上),另外还有点差成本。**判据:单笔或年度外币敞口超过 USD 100,000,或收款账期超过 90 天——必须锁;敞口在 USD 30,000 以下不值得,银行的手续和起点会把收益吃光。**

**第三层,自然对冲,免费但需要设计。**把一部分支出变成外币支出:海外仓租金、Amazon 广告费、海外展位费、给海外设计师的费用,都用美元付。收美元付美元,这部分敞口自动消失。做跨境电商的人天然有这个便利(广告费是美元),做纯贸易的人则可以用另一种方式:接一部分国内客户的人民币单子,做营收结构上的平衡。

最后一句提醒,也是本节最容易被忽略的一点:**账期越长,汇率暴露越大。**这也是为什么第14章那句"O/A 超 60 天无保险不接"(见5.5.3与14.2)其实有两层意思——你在赌客户不破产,同时也在赌汇率不动。**两个赌注叠在一起,而你只收了一次利润。**

本节动作:打开你上一单的报价单,看有没有汇率条款。没有的话,现在就把上面那两行中英文加进你的报价模板,以后每一份都带着。**这两行字的成本是复制粘贴,收益是一场你还没遇到的、但一定会遇到的汇率行情。**

## 28.4 案例三:侵权货被扣

先说这个案例最反直觉的一句话:**图是客户给的,货是客户要的,钱是客户付的——出了事,你一样跑不掉。**

案例的主角是一个做了一年半的 SOHO,客户是美国一家做活动策划的小公司,下单 3,000 顶棒球帽,前幅绣一个"看起来很像"某职业棒球队队徽的图案——队名字母被改成了一个近似的缩写,配色一模一样,轮廓改了两处。货值 ¥52,500,FOB 出运,30% 定金 ¥15,750 已收。

客户给图的时候说得很轻松:

> **客户**:"It's a parody design, we do this all the time. No problem."
> **你(当时)**:"OK, no problem then."

货到洛杉矶,美国海关(CBP)查获。原因很简单:**该球队的商标早已在海关备案**,海关有一份带图样的备案清单,查验时比对即可。流程是标准的——扣留、通知权利人、权利人确认侵权、进口人无法提供授权、货物**销毁**,进口人被罚,罚款通常按被侵权商品的建议零售价计,能达到货值的数倍。

对你这个供货方,结局是这样的:

```
已收定金                     +¥15,750
尾款(货没到,客户拒付)        ¥0
欠工厂的尾款(必须付)        −¥36,750
────────────────────────────────
直接净损失                    ¥36,750
另加:工厂关系、被权利人追责的可能、这个客户永远消失
```

**"我只是按图加工"为什么不能免责?**这是本节要讲透的机制,分三层:

**第一层,出口端。**中国海关有知识产权海关保护备案制度(见16.7),权利人备案后,海关在出口环节即可主动查扣涉嫌侵权货物。也就是说,这批货甚至可能走不出青岛港——那时候损失的是工厂的加工费和你的信誉。

**第二层,进口端。**CBP、CBSA 以及欧盟各国海关都有类似的备案清单,查获后货物通常直接销毁,不退运、不放行。**注意这里的关键:被销毁的货物,货款不会因为货没到而由谁补偿——它就是没了。**

**第三层,也是最要命的一层:民事责任。**在中国《商标法》和相关司法实践下,**受托加工方未尽合理审查义务的,同样构成侵权**,权利人可以直接向制造方和中间的贸易方主张赔偿。"客户让我做的"在法律上不是免责事由,它顶多是一个减轻情节。**所以第25章那句"接单侵权:代工也跑不掉的责任"(见25.4.1),字面意思就是它的全部意思。**

**本可以怎么防?三张纸,加起来不到一小时。**

**第一张,品牌授权书。**你已经做过一次了:第16章 Mike 发来的那份 R&B 抬头的授权书 PDF,注明品牌名、款号 RB-DH-001、授权用途和期限(见16.7)。**那不是走过场,那是你在这一格里唯一的护身符。**任何客供图案,一律要求授权书,并且要能看到完整的授权链条:**权利人 → 被授权方 → 你的客户**,缺一环就不做。客户说"我们是代理商",那就请他出示他和权利人之间的那份文件。

**第二张,合同里的知识产权条款。**写进 PI 或销售合同,可以直接抄:

> 买方保证其提供的所有图案、商标、文字享有合法权利或已获得完整授权,并就因此产生的任何第三方索赔、行政处罚、货物扣留或销毁,赔偿卖方的全部损失(含货款、运费、罚款与合理律师费)。
> The Buyer warrants that it owns or has obtained full authorization for all artwork, trademarks and wording supplied, and shall indemnify the Seller against any third-party claim, penalty, detention or destruction arising therefrom.

这一条不能保证你不被查,但它决定了事后你能不能向客户追偿。**没有它,你连追偿的依据都没有。**

**第三张,你自己的红线清单。**下面五类图,不管客户怎么解释,一律不接:

```
① 职业体育队徽与队名(NBA/NFL/MLB/NHL 及其欧洲对应物,授权体系极严)
② 动漫、游戏、影视角色与其"改编版"
③ 名人肖像、签名、专属字体
④ 知名品牌 logo 及其"变体""致敬版""联名感"设计
⑤ 大学校徽与吉祥物(北美的 NCAA 系统授权极严,比球队还严)
```

关于第④类,必须把那句外行话打掉:**"改一改就不算侵权"是彻底的误解。**商标侵权判定的核心是"混淆可能性"——普通消费者会不会以为这两个是同一家。**改得越像越危险,而不是越安全**;因为你改动的目的本身就是为了让人联想到原品牌,这个意图在法律上是加分项,加在权利人那一边。

那句 "It's just a parody, we do it all the time",给你一版可以直接发出去的回复:

> "We'd love to produce this. Before we start, we'll need a written authorization from the rights holder (or your licensing agreement). It's our standard requirement for any third-party artwork — customs in both countries check this, and detained goods are destroyed, not returned. Once we have the document, we can proceed."

**注意这封回复的写法:不说"你这是侵权",只说"这是我们的标准流程,两边海关都查"。**把拒绝变成流程,你既保住了单子的可能性,又不需要指控客户。真有授权的客户五分钟就把文件发过来了;没有授权的客户会开始绕——**和上一个案例一样,对方一开始绕,答案就已经出来了。**

本节动作:在你的报价单模板底部加一行小字:"**客供图案须提供权利证明或授权文件,否则不予生产。**"这一行字会替你挡掉的,不是订单,是那一到两个能让你出局的订单。

## 28.5 案例四:赊销坏账

这个案例的主角,是五个人里做得最好的一个。**这一点必须先说清楚,因为它是本节全部的教学价值:赊销坏账不吃新手,它专吃做了三年、正在起势的人。**

他做了三年,客户是加拿大一家中型帽子批发商,合作两年,累计八单,一次没出过问题。付款方式是这样一步一步松下来的:第一单 30/70 电汇(见14.1.1);第三单客户说"我们公司流程是见提单副本付款",他答应了;第五单客户说"能不能给我们 30 天账期,我们对所有长期供应商都是这样",他查了一下这家公司的官网和展会记录,觉得靠谱,答应了;第七单变成 **O/A 60 天**(见14.2:货到后 60 天付款,货权和款权同时交出去)。

第三年,事情开始变好——好得反常。

**四月**,客户下了第九单,¥180,000,是过去平均单值的两倍。理由很合理:"我们拿下了一个连锁客户。"
**六月**,第九单到期未付。客户来邮件:"Our biggest account is 45 days late on us. Can you give us another 30 days? We really appreciate your patience."——态度极好,解释具体,还附了一张他们下游客户的账单截图。
**同月**,第十单已经在生产了,货值 ¥200,000。他犹豫过,但转念一想:货已经做了,不发出去货砸在手里,发出去至少还有回款的希望。**他发了。**
**七月**,客户又下了第十一单,¥120,000,并且主动说"这单我们可以先付 30% 定金"。他收到了 ¥36,000 定金,心里踏实了不少,**又发了**。
**九月**,客户进入破产程序。他作为无担保债权人排队,一年后收到清偿,比例 **4%**。

```
第九单未收        ¥180,000
第十单未收        ¥200,000
第十一单未收      ¥120,000 − 定金36,000 = ¥84,000
应收合计          ¥464,000
清偿回收 4%       +¥18,560
────────────────────────────
净损失            ¥445,440   ≈ 他三年利润的总和
```

**这个案例最值得学的不是"别给账期",是那三个信号出现的顺序。**

第24章讲过坏客户识别的六个信号(见24.5),这里把最危险的一组挑出来,它是一个**组合信号**:

```
订单突然变大  +  账期突然要求延长  +  解释异常详细
= 红色警报,不是好消息
```

为什么?因为一家现金流断裂但还没死的公司,典型行为恰恰是**加大采购**:它需要新货去维持销售、去安抚它自己的客户、去撑住报表;而它付不出钱,所以要延长账期;而它知道你会起疑,所以解释得比平时详细得多,甚至主动附证据。**那张下游客户的账单截图,不是诚意的证明,是恐慌的证明。**

还有一个细节要单独点出来:**第十一单那 30% 定金,是整个骗局里最贵的一笔钱。**它让他放下了戒心,而它的金额(¥36,000)只有他因此又发出去的货值(¥120,000)的三成。**濒死的公司最会做的一件事,就是用小额付款换取继续供货。**看到一个已经逾期的客户主动付定金,你的第一反应应该是警觉,不是欣慰。

**工具:出口信用保险。**这件事本来有一个几乎免费的解法。出口信用保险(见14.2)的费率大致在保额的 **0.4-0.8%**(随国别、账期、买方资质浮动),赔付比例通常 **80-90%**。算这笔账:

```
投保保额  ¥464,000
保费      ¥464,000 × 0.6% ≈ ¥2,784
可赔      ¥464,000 × 85%  ≈ ¥394,400
```

**¥2,784 换 ¥394,400 的保障,相当于用一单毛利的百分之几,买回本金的八成半。**更关键的是,信保公司在承保前会对买方做资信调查并给出授信额度——**这个额度本身就是一个免费的风控信号:当信保公司把某个客户的额度调低或撤销时,那是比任何"感觉"都可靠的预警。**很多做久了的人用信保,一半是为了赔付,一半就是为了这条预警线。

**三条硬规则,写下来,不要例外。**

**规则一:任何账期的敞口上限 = 你三个月的毛利。**超过这个数,你亏了就活不下去,那就必须投保或要担保。这条规则会救你于"就这一次"。
**规则二:O/A 只给两种客户——已投保的,或有银行/母公司担保的。**其他一律不给。第5章那句"品牌单账期 30-90 天,超 60 天无保险不接"(见5.5.1与5.5.3)说的就是这个。
**规则三,也是最重要的:逾期第一天,停发在产和在途的一切货物。**理由极其冷酷,但你必须记住:**在途的货是你唯一的筹码。**货在你手上,客户还得跟你谈;货交出去了,你手上只剩一封律师函和一张跨国诉讼的账单。第十单那批 ¥200,000,他手上还有的时候,是筹码;发出去之后,是损失。

再补两条量化的天花板:**单客户应收余额上限 = 年毛利的 30%;单客户营收占比上限 = 40%**(与27.4的共同死因第一条同源)。这两条数字管的是同一件事——**不要让任何一个客户有能力决定你的生死。**

本节动作:做一张应收账龄表,五列就够:客户、单号、金额、到期日、逾期天数。**每周一早上更新一次,超 15 天标黄,超 30 天标红并自动触发"停发"。**这张表花你每周十分钟,而它管的是你三年的利润。

## 28.6 案例五:亲戚合作反目

第五个案例,和前四个都不一样:**没有海关、没有客户、没有汇率,亏的钱最少,失去的最多。**

主角就是第27章那个模式的另一个版本(见27.1.1的海外前端模式):表哥在河北开帽厂,他在外面跑客户。开始的时候什么都没写,只有饭桌上的一句话:

> **表哥**:"你负责接单,厂里给你出厂价,你赚差价。厂里赚加工费,咱们各挣各的,不用算那么细。"
> **他**:"行,那就这么定。"

**"不用算那么细"——这六个字,后来花了他大约 ¥12 万,和一门亲戚。**

第一年非常顺。营业额 ¥180 万,三个客户,厂里为他单独排产,过年一家人吃饭其乐融融。**问题全部在第二年爆发,一共四件,按时间顺序来。**

**第一件,价格。**第二年原料涨,厂里把出厂价从 ¥17.5 改到 ¥19.2。而他已经和一个客户签了一年期的年度价,锁死了。差额 **¥1.7 × 36,000 顶 = ¥61,200**,谁承担?表哥说:"原料涨了我也没办法,厂里已经很薄了。"他说:"我价是按去年的成本报的,你当时也知道我签了一年。"**两个人都对,因为没有人错——第一年谁也没说过"出厂价锁多久"。**

**第二件,质量事故。**一批 5,000 顶帽子洗水后缩率超标,客户折让 ¥48,000。表哥说:"确认样是你签的字。"他说:"洗水是厂里外发的,外发厂是你们找的。"**这场争论没有裁判,因为责任划分从来没有写下来过。**最后各担一半,但两个人都觉得自己吃了亏——**"各担一半"是所有没写协议的合作的默认结局,它同时让双方不满意。**

**第三件,钱。**两年下来账目互相咬着:他垫过工厂的原料款,厂里也帮他垫过运费和一次样品快递;有几笔是微信转的,有几笔是口头记的,有一笔他记得转过而对方记不清。到第二年底一对账,中间有大约 **¥7 万**说不清是谁欠谁。**没有一个人在撒谎,这是最难受的地方——两个诚实的人,因为没有账本,变成了互相怀疑的两个人。**

**第四件,人。**厂里的业务员开始直接联系他带来的客户,报价比他低 6%。他找表哥,表哥的原话是:"客户是拿厂里的产能接的,厂里当然也可以联系。"这就是第12章讲的转厂在亲友合作里的版本(见12章),只是它发生在自己家。

第三年,散伙。客户被分走一半,他重新开始找工厂;两家人从此过年不来往。**直接经济损失他自己算过,¥12 万上下;但真正的损失是——他在这个行业最信任的那个供应商,现在是他的竞争对手,而且知道他所有的客户和价格。**

**根因只有一句话:不是没有信任,是信任替代了定义。**

亲友合作的悖论在这里:**正因为关系好,才不好意思讨论坏结果;而合伙这件事的全部内容,恰恰就是事先约定坏结果怎么分。**陌生人合作会认真谈条款,因为不信任;亲人合作跳过条款,因为太信任——**于是陌生人的合作留下了协议,亲人的合作只留下记忆,而记忆会在利益面前自动向对自己有利的方向漂移。**这不是人品问题,这是人性。

**三张纸,合起来不到六页,必须在第一单之前签。**内容第27章已经给过(见27.1.2的三条规则),这里补上"怎么开口"和"值多少钱"。

**第一张,合作协议:**价格机制(买断还是分成、出厂价锁多久、原料涨跌怎么调)、责任划分(与规格表不符 / 规格表本身错 / 外发工序出问题,三种情形分别归谁,以及单批赔付上限)、客户归属(名单归谁、对外署名与收款主体、散伙后的 12-24 个月竞业约定)。
**第二张,内部结算价确认单:**每一次调价出一张,双方签字,标注生效日期和适用订单范围。**这张纸解决的是第一件事,成本是每次三分钟。**
**第三张,往来账目台账:**所有互相垫付的钱,当天记一行,月底对一次账签一次字。**这张纸解决的是第三件事,成本是每天三十秒。**

**成本对比,再说一遍,因为它值得说两遍:**自己起草 ¥0,请律师审一遍 **¥2,000-5,000**,一个下午签完。**对面是 ¥12 万和一门亲戚。**

最后是那句最难说出口的话。绝大多数人卡在这里——不是不知道该签,是不知道怎么开口。给你两句,任选:

> "咱们把这几条写下来吧。不是不信你,是我俩谁也别指望三年后还记得今天说的话。写下来,将来不用凭记性吵架。"

> "以后要开公司、要退税、要接品牌客户,人家都要看合同和主体(见25.1.1)。咱们现在不搭这个架子,后面正规化那一步就得推倒重来。"

第二句尤其好用,因为它把"签协议"从**信任问题**转移成了**业务需要**——对方不需要在"你是不是信我"上表态,只需要在"这事该不该办"上点头。**很多难开的口,换一个理由就好开了。**

本节动作:如果你正在或即将和亲友合作,今晚就把上面三条打成一份两页的文档,标题写"合作备忘(初稿)",发过去,附一句"你看看有没有要改的"。**先发文档,再谈感情。**对方看完的反应——是认真提修改意见,还是一句"跟你还签什么"——顺便替你测出了这段合作值不值得开始。

## 28.7 通用根因:书面化缺失

把五个案例排成一列,看最后一栏。

| 案例 | 直接损失 | 表面死因 | **真正缺的那张纸** |
|---|---|---|---|
| 一·样品与大货不符 | ¥56,000 | 工厂换了布 | 写死克重纱支密度的规格表 + 三份骑缝封样 |
| 二·汇率吃掉利润 | ¥119,000 | 人民币升值 | 报价单里的汇率 ±2% 重议条款 |
| 三·侵权货被扣 | ¥36,750 | 客户给的图有问题 | 品牌授权书 + 合同里的知识产权赔偿条款 |
| 四·赊销坏账 | ¥445,440 | 客户破产 | 信保保单 + 逾期停发条款 + 账龄表 |
| 五·亲戚合作反目 | ¥120,000 | 人心变了 | 合作协议 + 结算价确认单 + 往来台账 |

五种完全不同的死法,一个共同的根因:**该写下来的东西没有写下来。**

而且注意最后一栏那些东西的成本:一张规格表几行字、一份封样 ¥160、一段条款复制粘贴、一份保单 ¥2,784、一份协议一个下午。**五个案例合计损失 ¥778,190,五张纸合计成本不到 ¥1 万。**这个比例不是巧合,它是这门生意最深的结构:**贸易的本质是承诺的交换,而未被书面化的承诺,在出事的那一刻等于不存在。**

**为什么口头和微信不够?**三个层次,一层比一层重要。

**第一层,记忆层。**六个月后,没有人记得当时说的是"240 克"还是"230 克左右",是"三十天交货"还是"三十天左右"。**人的记忆不是坏了,是会自动向对自己有利的方向修补**——这是心理机制,不是道德问题,所以你不能靠"我们都是老实人"来解决它。案例五那 ¥7 万说不清的账,就是两个老实人的记忆各自修补的结果。

**第二层,证据层。**很多人以为"我有微信记录就行"。微信记录在法律上确实可以作为证据,但它常常**要件不全**:说话的人是谁(账号未必实名)、指向哪一批货(常常只说"这单")、承诺的具体内容(语音、表情、"行"字、一个"OK"手势)。真正管用的证据形态是**确认件**:一封主题明确的邮件,正文写清确认了什么、依据哪个版本号的附件,对方回复一个 "Confirmed"。**规格表 v1.1 这个版本号(见2.5的版本纪律),在争议里的分量顶一百条微信。**

**第三层,也是最被低估的一层:执行层。**书面化真正的价值,不是将来打官司——**跨国小额纠纷打官司在经济上几乎从不划算**。它的价值是:**签字这个动作本身,会逼所有人在事前认真想一遍。**

这一点值得展开。当你把"洗水缩率不得超过 3%"写进规格表要工厂签字时,工厂的跟单员会真的去问一句洗水厂能不能做到——而在口头沟通里,他只会说"没问题"。**书面化把一次含糊的应付,变成了一次真实的确认。**你会发现,很多风险在"要求对方签字"的那一刻就暴露了,压根轮不到发生。**这就是为什么书面化是投入产出比最高的风控:它在事前起作用,而不是在事后。**

由此得到全书最便宜、也最值钱的一条规则,请把它变成肌肉记忆:

> **任何一句会影响钱的话,说完 24 小时内必须变成一封确认邮件。**

格式三行,不用客气话:

```
主题:【确认】RB-DH-001 大货面料规格 / 2026-07-06

今天电话中我们确认了以下三点:
① 大货面料克重 240 g/㎡,允差 ±5%;纱支 21S,密度 108×58;
② 供应商为××布厂,货号××,大货布头随首件一并寄我方存档;
③ 因面料调整导致的交期变化,不迟于 7 月 10 日书面告知。

依据文件:规格表 v1.1(附件)。
如无异议,请回复"确认"。
```

**这封邮件写完三分钟,它把上面五个案例里的第一个直接消灭。**

最后,把全书所有该书面化的东西汇成一张总表。这张表是本章、也是整本书的风控底座——**你可以忘掉五个案例的所有细节,但这张表要贴在你桌上。**

十八项,没有一项需要花钱请人做,全部是你自己敲键盘就能完成的事。**这门生意里让人出局的,从来不是不够聪明,是嫌麻烦。**

本节动作,给你一个可以立刻执行的标准:**建一个"一单文件夹"模板**,里面预置十二个空文件名——询盘往来、报价单、规格表 vX、打样需求单、封样照片、PI、定金水单、验货报告、装箱单与箱唛照、CI/PL、提单或运单、尾款水单。每做完一单,照着点一遍名,**缺一个不归档**。这个动作每单花你十分钟,而它会在三年后的某一天,替你省下一场你现在还想象不到的麻烦。

# 尾声 从倒爷到品牌

## 代工天花板的数学

二月的一个晚上,你把去年一整年的单子列在一张表上。

R&B 那 500 顶、Dana 那 80 顶、R&B 的翻单、还有第四季度接的两个小单——加起来六位数的营业额,一张 A4 纸就写完了。你在最后一行敲了一个公式,想算算"如果明年满负荷做,能做到多少"。

**算出来的那个数,让你在椅子上坐了很久。**

先把单笔的毛利定住。按完全成本口径(见19.5),一单标准定制 300-800 顶的生意,毛利落在 **¥9,000-14,000** 这个区间——R&B 那单 500 顶是 ¥9,100,Dana 那单 80 顶是 ¥3,031(见22章),客单越大毛利额越高但毛利率越低,取中位数 **¥11,000/单**。

再把时间定住,这才是关键的一步。**这门生意里唯一不能扩展的资源,不是钱,不是工厂,是你的小时数。**

一年 250 个工作日,每天 8 小时,理论上 2,000 小时。但这 2,000 小时不能全用来做单——你要开发客户、要拍内容、要学新东西、要开票报税、要处理杂事。**真正能投在"把一单从询盘做到收款"上的,最多 60%,也就是 1,200 小时。**这个数你可以自己调,但它不会超过 1,500,因为人不是机器。

那么一单要花多少小时?第19章数过一遍(见19.5第⑦项):**首单 170 小时**——需求沟通与选料 30、找厂询价打样 40、驻厂验货与两趟差旅 60、单证物流收款 25、事故处理与售后 15。**翻单大约 50 小时**:不用再找厂、不用重新打样、不用制版、没有差旅、寄样减半,而且客户已经知道你怎么工作。

现在做那道让你坐了很久的除法:

```
全是新客首单:1,200 ÷ 170 ≈ 7 单   → 毛利 ¥63,000 - 98,000
全是老客翻单:1,200 ÷ 50  ≈ 24 单  → 毛利 ¥216,000 - 336,000
现实的混合(4个新客 + 12个翻单):
  4×170 + 12×50 = 680 + 600 = 1,280 小时(已经略微超载)
  16 单 × ¥11,000 ≈ ¥176,000
```

**结论:一个人做定制服务,年毛利的天花板大约在 ¥18-30 万。**

换个角度再算一遍,验证它。R&B 那一单,完全成本毛利 ¥9,100 ÷ 170 小时 = **¥54/小时**;同一单翻单,¥9,100 ÷ 50 小时 = **¥182/小时**。三年后你的客户结构成熟,老客占八成,加权时薪大约 **¥140/小时**;1,200 × 140 = **¥168,000**。**两个方向算出同一个数量级——说明这不是估算误差,是结构。**

这个数字要正着读一遍,也要反着读一遍。

**正着读,它是个好消息。**¥54/小时到 ¥182/小时,这中间三倍多的跃迁,不需要你变得更聪明、不需要新设备、不需要更多本钱,**它只需要客户回头**。这就是第0章那句"薄利行业唯一的正解是做熟客生意"(见0.1)的算术证明,也是第五部要用整整五章讲获客与复购的原因:**在这门生意里,一个老客户的价值不是多一笔订单,是把你的时薪乘以三。**

**反着读,它是个天花板。**¥18-30 万,是一个人的极限。它不取决于你多能干,取决于 1,200 这个数;而 1,200 是所有人都一样的。**你可以把每一单做得更好,但你不能把一年做得更长。**很多人在第三年撞上这堵墙:客户不缺了,单子接不完了,但收入不涨了,因为你已经满负荷了。

撞墙之后只有两条路,一条向外,一条向上。

**第一条,规模化——用毛利买时间。**逻辑很简单:170 小时里,有多少是必须你亲自做的?需求沟通、方案设计、报价谈判、事故谈判,这些是你;而单证 25 小时、跟单验货 60 小时,这 85 小时可以给别人。招一个跟单,月薪 5-8k(见8.2.2),加上社保杂项,一年成本约 **¥8-12 万**。他替你省下的时间,大约能让你多做 8-10 单,毛利 **¥9-11 万**——**看清楚,这笔账在第一年几乎是打平的**,这就是所有人第一次招人时的真实处境:招人不是为了当年赚钱,是为了把你的天花板从 1,200 小时变成 2,400 小时。
给一条判据:**当你连续三个月里,每周有超过 15 小时花在"可以被 ¥50/小时的人替代"的事情上,就该招人了。**早于这条线招人,你在为闲人付工资;晚于这条线,你在用 ¥182/小时的时间做 ¥50/小时的活。
规模化的下一堵墙在管理半径:三到五个人以内靠你盯,再往上必须有系统——SOP、ERP、责任分工。**那时候你就不再是一个做生意的人,而是一个管公司的人;这是两件不同的事,你要提前想清楚自己想不想。**

**第二条,品牌化——换一格站。**把这条链条摊开看一次,它比任何道理都直白:

```
工厂出厂     ¥17.5/顶     毛利率约 11%(见9.1.1的BOM)
你到门       9.9加元 ≈ ¥51.5   完全成本毛利率 35.4%
Mike吧台     30加元 ≈ ¥156     毛利率约 67%
```

同一顶帽子,三格,毛利率一格比一格高。第5章那三个词说的就是这个(见5.3.1):**OEM 5-15%、ODM 15-25%、OBM 40%+**。你现在站在中间那格,而 Mike 站在最后一格——他甚至不是帽子行业的人。
**品牌化的全部含义,就是往 Mike 那一格挪一步。**

哪一条更适合你?这里给一个不那么鸡汤的答案:**规模化是把你会的事做大,品牌化是重新学一门生意。**前者的风险是管理,后者的风险是全部。所以下一节要把品牌那扇门的宽度,老老实实量给你看。

## 品牌窄门

先说结论,免得你被后面的数字吓退之后忘了它:**自主品牌是这门生意里最高的那一格,也是最窄的那扇门;它不是"把帽子做好看",它是四门全新的生意叠在一起。**

**第一门,选品。**代工和定制的世界里,做什么是客户告诉你的——Mike 说他要 dad hat、藏青、绣前面,你只需要把它做对。品牌的世界里,做什么是你猜的,而**猜错的成本是一整批库存**。服饰类新品的成功率,行业里的量级是两三成:你上 5 到 8 个 SKU,能跑起来的通常只有 1 到 2 个。**这意味着品牌的第一年,你有七八成的动作注定是浪费的**,而你必须为这些浪费提前付钱。

**第二门,库存。**算给你看,这一笔是最硬的:

```
5 个 SKU × 3 个颜色 × 500 顶 = 7,500 顶
7,500 × ¥20(出厂+头程) ≈ ¥150,000 压在货上
库存周转 4 次/年是优秀,2 次是常态
→ 常年有 ¥75,000 - 150,000 睡在货架上
资金占用成本(年化 12%,见19.5第④项)= ¥9,000 - 18,000
再加上滞销打折、长期仓储费、弃置费
```

而定制生意的库存是**零**——客户下单你才生产,款到发货。**你从一个不占用资金的生意,跳进一个资金全部变成货的生意,这是品牌化最本质的那一步跳跃,也是最多人摔下去的地方**(第27章那条 12 个月现金流推演,见27.3.2,就是这一跳的月度分解)。

**第三门,流量。**DTC 的获客成本,行业量级是 **$10-14/单**(见7.2.3)。一顶帽子零售 $29.99,扣掉货值与履约,毛利大约 $20;减去 $12 的获客成本,**第一单剩 $8,还没算退货和平台费**。所以品牌的经济模型从第一天起就是这样的:**首单基本不赚钱,钱在第二单、第三单。**这句话翻译成运营语言就是——**复购率是品牌的生死指标,不是锦上添花的指标。**

**第四门,复购。**而这一门恰恰是帽子最弱的一门。**一个普通人一年买几顶帽子?一到两顶。**低频、耐用、不消耗——这是帽子作为品类的天然劣势。所以纯粹的"帽子品牌"LTV 天生偏低,活下来的只有两种走法:**要么扩品类**(帽子只是入口,后面接 T 恤、卫衣、包、周边),**要么绑定人群**(把帽子做成某个身份的标志,让人一年买三顶不是因为需要,是因为认同)。

**为什么大多数人过不去?**不是因为这四门有多难,是因为**它们必须同时过,而且顺序不能错**:选错品,再好的流量也是在推一堆卖不掉的货;库存备不足,流量起来了你断货;流量不会做,库存就成了坟墓;复购没有,前三门做对了你也是在给广告平台打工。

但更根本的原因在于**收入结构的反转**。做代工、做定制,你的现金流是**接单即回款**:客户先付定金,你再生产,风险前置给客户。做品牌,现金流变成**先投入后回款**:你先押货、先烧广告,几个月后才知道对不对。**一个人从代工那边养出来的所有现金流直觉,在品牌这边全部失效——而直觉失效比无知更危险,因为你会用错误的自信下大注。**

**那么什么样的人该走这条路?**三个条件,缺一条都建议再等。

**条件一:已经有一门赚钱的生意在养着它。**品牌的钱不能是唯一的钱。定制服务的现金流稳定、不占库存、回款快,它是最好的品牌孵化器——**用定制养品牌,而不是用积蓄养品牌。**
**条件二:你手上已经有一群人。**不是有产品要去找人,是**有人了再去找产品**。这群人可以是内容账号的几万粉丝(见第23章)、可以是一个社群、可以是你手上三十个老客户。
**条件三:你能接受 18-24 个月不赚钱。**不是"可能不赚钱",是按前面四门的账算下来,**大概率就是不赚钱**。

**帽子行业里,品牌化真实的机会在哪?**不是做"又一个棒球帽品牌"——那个赛道上你既没有设计能力也没有营销预算,是纯粹的送死。真实的机会只有一条:**垂直人群 + 内容 + 社群。**

选一个有强身份认同、有内容土壤、有线下场景的人群:攀岩、桨板、精酿、古着、复古摩托、飞盘、路亚钓鱼。这些人群的共同点是——**他们戴帽子不只是为了遮阳,是为了让同类认出自己。**这种需求下,复购不是靠"旧的坏了",是靠"出了新的"。

路径也很清楚,而且顺序不能倒:

```
先用内容养起一个几千到几万人的垂直账号(第23章那套,你已经有 2,300 张素材)
  ↓
再用快反小批量测款(100-300顶/款、7-15天,见第6章),单款成本可控在 ¥3,000-6,000
  ↓
哪一款卖爆了,再放量
```

**内容在前,库存在后。**这是新人唯一能走通的顺序,因为它把"猜错"的成本从 ¥15 万压到 ¥5,000,把选品这门生意从赌博变成了实验。

最后用 Mike 来收这一节,因为他就是活的答案。

**R&B 不是一个帽子品牌,但它卖帽子比很多帽子品牌卖得好。**500 顶,活动当晚吧台上卖掉 61 顶(见20章),获客成本为零,零售 30 加元。为什么?因为他不是在卖帽子,他是在卖"我是 Ridge & Barrel 的人"这件事,而这群人本来就存在——他们每周五晚上都来。

**这句话是这一节的全部:品牌不是把帽子做好看,是先有一群认你的人,帽子只是他们表达认同的载体。**

先有人,后有货。顺序反了,这扇门就永远推不开。

## 慢就是快

最后一节,讲这门生意里唯一真正值钱的东西:**复利。**

第0章说过,这个行业成熟、分散、毛利薄,没有风口(见0.1)。一个没有风口的行业里,不存在弯道超车这回事——**你能积累的所有优势,都是慢慢长出来的**。具体来说是四样东西,它们的共同点是:都需要时间,而且**都不能用钱买。**

**第一样,客户信任。**
看一遍时间线你就懂了:六月初市集偶遇,六月中报价,七月初签 PI,九月初交货,九月中活动,十月 Mike 转介绍了 Dana,十一月底 R&B 谈年度 merch 日历(见24.4)。**从"500 顶试试看"到"明年一整年的周边交给你",Mike 用了半年。**
这半年里没有捷径。你不能在第一次报价时就说"我们做年度方案吧"——那不叫顾问式销售,那叫推销。**信任的增长曲线是台阶式的,每一级台阶都必须有一次成功交付垫在下面**;而一次交付要走一遍生产、物流、清关的全程,物理上就是两三个月。这就是为什么这件事快不了。
它的复利也在数字里:一个小 B 客户的三年 LTV 是 **¥3-8 万**(见20.1.3),而你获得他的成本可能只是一套 ¥390 的样品包和二十次扫街(见22.5)。更重要的是转介绍——**Dana 是 Mike 带来的,而 Dana 明年会带来谁,你现在不知道,但它一定会发生。**满意的客户每年会带来 0.3-0.5 个新客户,三年下来,一个客户会变成两三个。**这就是复利的形状:前期慢得让人怀疑,后期你会发现自己已经不用发开发信了。**

**第二样,工厂关系。**
第一年,你在老崔眼里是"那个 500 顶的小单"。第二年旺季,他可能会把你的货插在别人前面。这个变化不写在任何合同里,也买不到——**它是四件小事攒出来的:付款干净不拖、规格一次说清、不半夜打电话催、出事不甩锅。**
事故一那次,80 顶拆绣重绣的 ¥600 返工费,老崔主动担了(见11.6)。19.5 站在成本表的角度必须把它记成"运气,不是制度"——这个态度是对的,做账不能靠运气。**但站在关系的角度,你和我都知道,那 ¥600 里至少有一半是你前面五十天攒出来的**:你没在验货现场发火、你带着样带一顶顶比对而不是甩一句"全部返工"、你的规格表让他无从推诿也无可挑剔。**工厂关系的复利就是这样:它不会让你少花钱,它会让你在出事的那一天,身边站着人。**

**第三样,行业认知。**
这本书二十八章,你读完了,但读完只是"知道"。知道和认知之间隔着的是手——是你真的摸过 240 克和 213 克的两块布、真的在自然光下对过一次色卡、真的看着一刀切下八十层布、真的在验货现场做过一次"返工还是让步"的决定。**这些都不能加速,因为它们必须一次一次地过手。**
给你一条判断自己"入行了没有"的标准,比任何证书都准:**当一个客户丢过来一句模糊的需求——比如"我想要那种复古的、有质感的帽子"——你脑子里的第一反应,不再是"我去问问工厂",而是三个具体的规格方案和它们之间的价差。**
到那一天,你就是这本书第一部里说的那种"会说帽子这门语言"的人了。这条路平均要走多久?**看得见的部分大约一年,看不见的部分大约三年。**

**第四样,内容资产。**
你手机里那 2,300 张照片和视频(见23章),是四样东西里最慢、也最陡的一条曲线:前六个月几乎零回报,你会怀疑自己在浪费时间;第十二个月开始有稳定询盘进来;第二十四个月,它会变成你**最便宜的获客渠道**——因为它一次生产,永久展示,而开发信每一封都要重新写。
而且它是唯一**不可被抄走**的资产。别人可以抄你的报价单、抄你的菜单、抄你的话术,甚至可以撬走你的客户和工厂;**但没有人能抄走你三年里一次次走进车间拍下的那些画面**,因为那些画面里有你的时间。

现在把这四样反过来看一次。什么是"快"?

**快是**:第一年就砸三万块上国际站,以为流量能买来;
**快是**:为了拿下一个大单,给一个只见过两次的客户 60 天账期;
**快是**:客户催得急,没有封样就开大货;
**快是**:压 15 万库存赌一个爆款,因为"数据显示这个色好卖";
**快是**:亲戚一句"不用算那么细",省掉了一个下午的协议。

**这一章的五个死亡案例,每一个的第一步,都是想快一点。**

这不是道德说教,是结构。在一个薄毛利、无风口、高度分散的行业里,**所有的快都是借来的——你从流程里借时间,从条款里借安全,从关系里借信任,而这三样东西都要连本带利地还。**慢的人不是在忍耐,是在攒;攒够了,后面的每一单都比前面轻松。**这就是"慢就是快"的全部含义:不是慢一点比较稳妥,是这门生意里唯一能复利的东西,恰好全部需要时间。**

---

写到这里,该回到开头了。

六月初的那个周六上午,温哥华一个社区市集。白色帐篷排成两列,一个啤酒摊,冰桶里插着试饮杯,酒标上一道山脊线压着一只橡木桶。一个四十来岁的高个子抬眼扫了一下你的头顶,问你那顶帽子哪儿买的。你摘下来递过去——一顶洗得发白的旧棉帽,帽檐边磨出了细细的毛边。

他捏着帽檐转了一圈,还给你,说了一句话:

> "就是这种。现在的新帽子都太……新了。"

那时候你以为这只是一句闲聊。现在你知道那是这本书的题眼。

这一年里,你追着那顶帽子跑了一圈:从面料市场那卷 240 克的磨毛斜纹,到裁床上一刀落下的八十层布,到绣花机十二个机头同时起落的 8,800 针,到那 120 顶偏橙的麦穗和一把拆绣刀,到五个纸箱、0.48 个立方、太平洋上的三十天,到加拿大海关那三天的查验,最后到九月中旬一个晚上的吧台——Sold 61 last night。

你也追着一笔钱跑了一圈:4,950 加元进来,货款、制版、快递、水洗、运费、手续费出去,再扣掉那些从来不进账本的差旅、折让、备付和 170 个小时,最后剩下 ¥9,100。三十五个点。

一顶帽子,一笔钱,一年。

而 Mike 当初要的东西,其实一句话就说完了:**摸起来厚实、戴旧了好看。**

前半句,这本书用了四章来翻译——纤维、织法、克重、水洗,那是这个行业的语言。后半句,这本书用了二十四章来解释,而且到最后你会发现,它讲的根本不是帽子:**戴旧了好看的东西,必须先经得起时间;而经得起时间的东西,做的时候就快不了。**

一块布要退浆、要预缩、要静置;一个色要在自然光下对三次;一根线要试绣了才敢定;一个客户要交付三次才肯把一年的生意交给你;一家工厂要五十天才愿意替你担那 ¥600。

**这本书讲的一切,其实就是那五个字:好东西要时间。**

你现在有了语言、有了地图、有了工厂、有了跨洋的路、有了找客户的办法,也有了一张写着五个死亡案例的清单。剩下的事,书里给不了——它在你手上,在你下一个周六的市集上,在你摘下帽子递过去的那个动作里。

去做第一单吧。

慢慢来。

## A2 单证模板索引

### A2.2 规格表完整栏目清单(15栏,照此逐栏填,不留白)

款号 · 帽型 · 结构 · 片数 · 面料(挂面料需求卡附件)· 颜色 · 气眼 · 顶扣 · 帽檐 · 汗带 · 沿条 · 调节扣 · 标类(主标/洗水标/印唛/吊牌四小项)· 尺寸(三围+允差+量法)· 工艺 · 包装 · 数量 · 版本号。

**三条使用铁律**(见2.5.2):①打样、报价、验货三程共用同一份;②逐栏不留白——不要的写"无",没定的写"待定",**空白等于授权工厂按最便宜的默认做**;③改动必升版本号,邮件确认后才生效。

### A2.3 PI 十三栏填写清单(见15章工具二)

1. 标题/编号/日期——PROFORMA INVOICE + 唯一编号 + 日期,改版加 -R1
2. 卖方/收款人——卖方名与**收款户名一致**
3. 买方/收货人/通知方——三行分开写
4. 品名规格——写到材质+结构+工艺,并声明规格表与trim sheet为附件且构成本PI一部分
5. 数量——数量 + ±3%允差,按实际发货数结算
6. 单价/总额——**币种写字母**,总额加英文大写 SAY…
7. 贸易术语——术语 + 具体地点 + 版本年份 + 一句人话注释
8. 交期——起算条件(whichever is later)+ 估计出货日 + 到门日标 estimate 并免责
9. 付款——定金触发点=签PI;尾款触发点=提单副本;+ before release of original documents
10. 包装唛头——件数/每箱数/箱数/箱规/唛头内容,与PL、CI、箱唛四者一致
11. 银行信息——全套信息 + 邮件通知改账号一律无效条款
12. 有效期——7-15天,短于报价单
13. 其他/签字——品质以签封样为准 + 验货权 + 不可抗力 + 争议解决 + 双方签字

**三段必抄条款**:交期(`whichever is later`)、银行(`Any change notified by email shall be deemed invalid…`)、数量(`Quantity tolerance ±3%, settled at actual shipped quantity.`)——原文见第15章章末。

### A2.4 CI 商业发票栏目清单(见16章工具二)

**抬头区**:EXPORTER(全称地址电话邮箱)· INVOICE NO. · DATE · S/C NO.(对应PI号)· CONSIGNEE(全称地址联系人,进口国税号如BN)· PAYMENT · TERMS(贸易术语+地点+Incoterms版本)· COUNTRY OF ORIGIN · PORT OF LOADING · DESTINATION。

**主体区**:MARKS & NUMBERS(唛头+PI号+箱号区间+MADE IN CHINA+HS CODE)· DESCRIPTION OF GOODS(材质+品名+结构+工艺+品牌+款号)· QTY · UNIT PRICE · AMOUNT · 折让单列行 · TOTAL · SAY大写 · 签字栏。

**六数字一致性核对卡**(出单前逐份点勾,见16章工具一):数量、件数、净重、毛重、材积、金额,横向对齐 CI / PL / 提单 / 报关单 / 箱唛。R&B这票的六个数是:**500 PCS · 5 CTNS · N.W. 55.00 KGS · G.W. 62.50 KGS · 0.48 CBM · CAD 4,870.00**。
