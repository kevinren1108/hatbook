# 第14章 付款方式

**主线推进** —— 八月初的上午,五箱货码在成品仓门口,箱唛朝外,装箱单刚从小周的打印机里吐出来,纸还是热的。返工的两天补完了,复验一顶不落(见11.6.2),这500顶帽子从此刻起在物理上已经不属于车间——它属于谁,取决于接下来两笔钱怎么走。你坐在办公室那把塑料椅上摊开笔记本,左边写一行:**收Mike尾款3,385加元**;右边写一行:**付工厂尾款¥6,125**。前一笔要跨太平洋飞过来,后一笔要在货交给货代之前落进老崔的对公账户。两行字看着简单,中间横着一样你从没认真算过的东西——**时间差**:Mike今天转账,钱要走两到五个工作日;工厂要的是"出货前付清",而货代的车定在四天后。这中间如果错开一天,垫钱的就是你;如果错开一周,你可能得去借。

老崔中午吃饭时随口问了一句:"尾款啥时候能到?"——那语气很随和,但你听懂了:这是全厂这个月的工资里的一块。你也想起两个多月前定金到账那天的事:Mike明明汇了1,485加元,你的账户只进来1,440,凭空少了45块,当时你以为是汇率算错了。

这一章讲的就是这条管道:钱在跨境的路上怎么走、走一趟被谁扣了几刀、什么条款让"钱货分离"这个外贸元问题(见13.1.1)有解、哪些付款方式是给什么客户的、以及最后一件对新人生死攸关的事——**把收进来的时点和付出去的时点排成一张表,让你永远不用垫自己的钱。**

## 14.1 T/T电汇

### 14.1.1 SWIFT与中转行:钱怎么跨境走、手续费谁出

先回到定金到账那天早上。你在银行App里刷新了七八次,终于跳出一条入账通知:**CAD 1,440.00**。你盯着这个数字愣了半分钟——PI上白纸黑字写着30%定金1,485加元,Mike前一天发来的转账截图上也是1,485。中间少了45加元,按¥5.2折合**¥234**。你第一反应是Mike少打了,幸好没直接问出口;第二反应是汇率问题,但这是加元入账、还没结汇,跟汇率无关。真正的答案藏在一个你当时还不知道的英文缩写里。

先把管道讲清楚。**T/T,全称Telegraphic Transfer,电汇**——名字是电报时代留下的,现在早没有电报了,但机制没变:钱不会"飞"过太平洋,飞过去的只有一条报文。加拿大的银行和中国的银行之间,靠一套叫 **SWIFT(环球银行金融电信协会)** 的报文网络对话——它是全球一万多家银行共用的加密电报局,只传指令、不传钱。指令长这样:"请从我行账上划CAD 1,485,贷记贵行XX账户,收款人某某。"钱的移动,是双方在各自账本上的一借一贷。

指令要送对地方,靠的是 **SWIFT Code(也叫BIC,银行识别码)**——8位或11位的字母数字串。拆开看你就永远不会填错:比如工商银行北京总行是 `ICBKCNBJ`,前4位 `ICBK` 是银行代码,第5-6位 `CN` 是国家代码,第7-8位 `BJ` 是城市代码;后面再加3位(如 `SHI`)就是具体分行。**它是银行的门牌号,不是你的账号**——新人最常见的错误就是把这两个填反。

真正吃掉那45块的,是路上的**中转行**(intermediary bank,也叫代理行correspondent bank)。道理不复杂:全世界的银行不可能两两互相开户。Mike的银行在温哥华,你的银行在青岛,两家彼此没有账户关系,那这条指令就得找一家跟双方都有账户关系的大行接力。加元和美元的跨境清算,通常要经过多伦多或纽约的清算行。路径画出来是这样:

```
Mike的账户 → 温哥华汇出行 → [中转行:多伦多/纽约清算行] → 你的收款行 → 你的账户
     ↓             ↓                    ↓                    ↓
   发起指令     收汇出手续费          收中转费           收入账手续费(可能)
```

每过一手,就有一次伸手的机会。**汇出行手续费CAD 30-50/笔**(各行不同),**中转行扣费USD 10-25/笔**(折加元约15-35),收款行的入账手续费国内多数银行对个人汇入免收或象征性收几十元。时效上,这一路要走 **2-5个工作日**——注意是工作日,周末不算,两国的节假日都不算;再叠上时差(温哥华比北京慢15小时),Mike周五下午在温哥华汇出,你这边常常要下周二才见到钱。这条时效对本章最后那张现金流表是硬约束。

现在讲那个吃掉45块的缩写。跨境汇款上有一栏叫**费用承担条款**,三选一,SWIFT报文里的代码就三个:

| 代码 | 全称 | 谁付费 | 收款人到账 | 谁爱用 |
|---|---|---|---|---|
| **OUR** | 全部由汇款人承担 | 汇款人付汇出行费+中转费(汇出行按固定"全额到账费"预收CAD 30-50) | **足额** | 收款人最想要 |
| **SHA** | 分摊(share) | 汇款人付汇出行费;中转行与收款行费用从款里扣 | 少CAD 15-35 | **银行默认档** |
| **BEN** | 全部由收款人承担 | 汇出行费也从汇款金额里先扣 | 少CAD 45-85 | 汇款人省事省钱 |

答案出来了:Mike去银行柜台汇这笔定金,柜员按最省事的方式默认勾了 **BEN**——汇出行的CAD 30和中转行的CAD 15,全从这1,485里先扣走,到你账上就剩1,440。**Mike没有少付一分,你实实在在少收了¥234。**这就是新人最容易莫名其妙掉钱的地方:它不写在合同里、不体现在汇率上、客户和你都没做错事,钱就是没了。

你当时的处理是对的:没有为¥234去找Mike麻烦(一笔生意的第一次收款就去追讨两百块,不值),但你做了三件事,后来那笔大得多的尾款,只丢了中转行的一道十几块。**第一,把费用条款写进PI**:付款栏后面加一句 `All bank charges outside the beneficiary's bank are for the buyer's account (charge option: OUR).`——中文口径是"收款行以外的一切银行费用由买方承担"。这里要给一句老实话,免得你日后失望:**OUR不是百分百的保险**——汇出行会按OUR预收一笔"全额到账费",但美元、加元清算链上的中转行有时照扣不误,事后再由汇出行去追偿,或者干脆就少了那十几块。所以正确的期待是:**写了OUR,你从"一笔汇款丢45块"降到"丢15块";没写OUR,你连丢多少都不知道。**降低损失是可控的,消灭损失不是。**第二,把收款信息做成一张固定的卡片**,以后每单原样发送,不再让客户凭截图和记忆去柜台填:

```
Beneficiary Name:      与账户户名完全一致的英文名(一字不差,不用简称)
Beneficiary Account:   账号 / IBAN
Beneficiary Address:   收款人地址(街道、城市、国家)
Bank Name:             开户银行英文全称
Bank Address:          开户支行英文地址(具体到支行,不是总行)
SWIFT/BIC:             8或11位银行识别码
Payment Reference:     PI号(例:PI-RB2506-01)
Charge Option:         OUR
```

**第三,学会一句催款和查账都用得上的话:"Could you please send me the MT103?"**——MT103是SWIFT电汇报文的格式代号,俗称水单;客户从他的银行拿一份给你,上面有金额、扣费条款和一串叫UETR的追踪号,凭它能查这笔钱此刻卡在哪一环。钱没到的时候,这一句比"到了吗?到了吗?"有用一百倍。

最后压一条纪律,它比省下的几百块重要得多。收款账户信息只在PI和正式合同里给一次,**此后任何形式的"我们换账户了"通知,一律先打电话或视频当面核实,不看邮件**。这不是小心过度:有一类专门盯着外贸邮箱的诈骗叫**BEC(商业邮件诈骗)**——骗子潜伏在买卖任一方的邮箱里,等你把账户信息发出去,随即伪造一封"财务通知:我司账户变更"的邮件跟进,格式、签名档、邮件线程全都以假乱真,买方转完账,双方隔一个月才发现。同样的逻辑,你付工厂货款时也成立——那正是8.1.2讲的"合同抬头、收款账户名、开票方三者必须同名",红灯规则在两个方向上一样硬。

本节动作:今天就把那张收款信息卡做出来存成一个文本文件——去网银或柜台查清你账户的**英文户名、支行英文地址、SWIFT Code**这三项(大多数人从没查过),按上面八行填满,最后一行永远写OUR。这张卡是你收到的每一笔外汇的入口,填错一个字母,钱会在路上打转十天再被退回来,退回还要再扣一次费。

### 14.1.2 30/70玩法:尾款与提单的联动设计

现在看PI上那行核心条款:`30% T/T in advance, 70% against copy of B/L.`——**30%定金电汇预付,70%尾款见提单副本支付**。这十几个词是整个外贸最经典的一道设计题的标准答案,值得把它拆到骨头。

题目就是13.1.1那个元问题:你和Mike隔着一万公里,谁先动谁吃亏。他先付全款,货没做出来他两手空空;你先发全货,他不付你满仓货运在半路。30/70把这道题切成了两半来解。

**前一半,30%定金解决的是"开工风险"。**工厂要备料,你要下单,这笔钱一分不到没人敢动手。定金的正确量级不是拍脑袋,9.7.2已经带你算过一遍:工厂的面辅料垫资是5.0×500=¥2,500,而30%定金是¥2,625——**定金刚好盖住不可回收的物料投入**,超出这条线的部分才是工厂的利润和工缴,那是它愿意用信用去博的。同时定金到账日还有一层身份:**它是交期起算日**(交期起算条款见4.7.2),PI上要写 `Production starts upon receipt of the deposit.`——不写这句,客户拖十天付定金却按签约日算交期,延期的锅扣在你头上。

**后一半,70%见提单副本,解决的是"钱货分离"的信任对撞**,靠的是一件东西的特殊性质:**提单(B/L)是物权凭证**(完整机制见16.4.1)——船公司只把货交给持正本提单的人,谁拿着正本,谁就是货主。这个性质造出了一个精妙的中间状态:货已经上船离港了(所以买方相信你真的发了货),但正本提单还在你手里(所以买方还提不了货)。你把提单**副本**——一张扫描件——发给买方,他看到船名、航次、提单号、目的港、件数,确认这批货真实存在、方向没错,于是付尾款;你收到尾款,再把正本快递给他,或者通知船公司**电放**(不签发正本、凭电子指令放货,见16.4.2)。

**买方不必为没发的货付钱,卖方不必为没收钱的货放货**——两句话,一个平衡点。这就是为什么这套条款在全球用了几十年还没被取代。

平衡不等于零风险,两头的残余风险要说清。买方那头:货是发了,但可能是垃圾货——所以第11章的验货是买方的解药,不是可选项。卖方那头:买方拒付,货堵在目的港,你面前两条路——退运(来回两趟运费加仓租,常常超过货值一半)或就地降价甩卖,行业里这种损失的量级是**货值的30%-50%**。所以"见提单副本"保的是"货没白发",不保"钱一定收到"。

**现在把R&B这一单的两组条款并排放,看错位怎么排。**你同时是两笔交易的当事人:对Mike你是卖方,对工厂你是买方。

| | 你收Mike(卖方) | 你付工厂(买方) |
|---|---|---|
| 首付 | 30% = 1,485加元,第五周(D35)到账 | 30% = ¥2,625,同日付出 |
| 尾款 | 70%见提单副本,第九周收到 | 70% = ¥6,125,出货前付清 |
| 顺序 | **先收** | **后付** |

三条规则从这张表里长出来,记牢它们,你这辈子的现金流都靠它:

**规则一,收在前、付在后。**每一个付款节点,你收客户的那一笔必须早于(至少同日于)你付工厂的那一笔。定金那天你是先看到Mike的钱进账,才给老崔转的¥2,625——顺序倒过来,你就是在拿自己的钱替客户开工。

**规则二,收得多、付得少。**定金比例一样是30%,但基数天差地别:1,485加元结汇后约¥7,465,工厂定金¥2,625,**盖了2.84倍**。这个倍数不是运气,是你的加价率(见7.3.2)在现金流上的投影,14.5.1会把它写成公式。

**规则三,中间要保留一段"你控制货"的时间。**付清工厂尾款那一刻,货权归你;收到客户尾款那一刻,你才能放货。这两件事之间必须留出正的时间间隔,**绝不能出现"货已经在去客户的路上、客户尾款还没到"的状态**。

规则三在这一单上差点出事,而它暴露出的问题值得每个走专线的人抄下来。你走的是海派专线双清包税到门(见17.4),而专线不签发可流转的正本海运提单——货代给你的是一份运单(HAWB性质的运输单据,不是物权凭证,同类逻辑见16.5)。**换句话说,你PI上写的"见提单副本"这个动作,在这条运输方式下根本没有对应的实物**;更要命的是,专线是包税到门直派,货一旦交进货代仓,后面全程没有任何一个环节需要你签字,你对这批货的控制在交仓那一刻就归零了。

你是在给Mike写尾款通知邮件时才想明白这层,于是把条款落地成了具体单据。邮件是这么写的:

> Hi Mike, all 500 caps are finished, inspected and packed — 5 cartons, 62.5 kg gross. Attached: packing list, carton photos, and the forwarder's cargo receipt. As agreed (70% against shipping documents), please arrange the balance of **CAD 3,385** (CAD 3,465 less the CAD 80 allowance we agreed on the 40 giveaway caps). The cartons will be handed to the line on receipt of the balance — ETA Vancouver 28-32 days.

三个细节都是有意的:**其一**,把"提单副本"替换成这条运输方式下真实存在的凭证——装箱单+装箱照片+货代收货凭证,并在括号里点明它替代的是哪一条条款,不留歧义;**其二**,把折让的80加元(40顶让步接受帽,见11.6.2)在这封信里直接扣清,不另开票、不留尾巴;**其三**,最后一句 `handed to the line on receipt of the balance` 是全信最硬的一句——**款到才交仓**,这就是规则三在专线场景下唯一的落地方式。

Mike的回信第二天早上到:"Sent this morning. Should land your side by Thursday."——温哥华周一汇出,青岛周四(第九周)入账,两个工作日多一点,比预估的还快些。

最后是你对工厂那一侧的谈判台词,同样一句话解决问题。当初签PI时你对老崔说的是:"**尾款出货当天付,验货合格、装箱单确认后一小时内到账。**"这句话把付款绑在验货上,而不是绑在日期上——绑日期,货没验完到期也得付;绑验货,验不过就名正言顺地不付,尾款作为筹码的效力(见11.6.2)才保得住。老崔认了,因为这句话同时给了他确定性:合格就一小时内到,不是"等我几天"。

本节动作:把你手上的每一单都做一次"错位三问"——**①每个节点,收在前还是付在后?②定金比例上,收的盖不盖得住付的?③从付清工厂尾款到收到客户尾款之间,货在谁手里?**第三问答不上"在我手里"或"款到才交仓",就回去改条款,别改运气。

## 14.2 风险光谱:前TT/后TT/O/A赊销

30/70不是唯一解,它只是一条长线上的一个刻度。把这条线画出来,你才知道自己站在哪、能往哪边挪、以及哪一段是新人的悬崖。

在纸上画一条横线,左端写"卖方零风险",右端写"卖方全裸"。从左到右,把行业里真正在用的付款方式一档一档钉上去——**注意,钱越往后收,卖方风险越大,而买方风险恰好反过来,这条线是一根跷跷板,没有两边都安全的档位,只有匹配不匹配。**

```
卖方风险: 低 ←—————————————————————————————————————————→ 高
        100%前T/T  50/50  30/70见提单  D/P  D/A  后T/T(货到付款)  O/A赊销
买方风险: 高 ←—————————————————————————————————————————→ 低
```

**第一档,100%前T/T(全款预付)。**货没做,买方先付清。卖方零风险零垫资,所以这一档是可以卖钱的:9.7.2算过,全款预付通常能换 **1-2%的价格优惠**。什么时候用它?你是卖方且金额小(3,000美元以下)、客户是散单或首单陌生买家、或者做的是彻底定制、买家一跑你手上的货一文不值(比如印满了对方logo的东西)——这些情况下要求全款预付不但不失礼,反而是行规。反过来,当**你是买方**时,这一档就是这条线上最危险的位置:1688上"全款预付发货"的小作坊,你付完钱,唯一的抓手只剩对方的良心。这里立刻钉一根桩:**新工厂的首单,永远不要用全款预付去换那1-2%**——尾款是你对品质的最后一颗牙(见11.6.2),为了一两百块把牙全部拔掉,是这本书里最不划算的交易。

**第二档,50/50。**50%定金开工,50%发货前或见单付。它是30/70的加强版,用在两种场合:一是定制辅料多、工厂垫资重的单(专用五金、定制彩盒、开模件);二是新客户但金额不小,你想在30%的行规和自身的安全之间折中。谈的时候要给理由,不能光说"我要50":"这单有520套定制电镀滑扣和定制织唛,专用物料占货值近三成,别的单用不掉。"——**把比例的要求锚在具体的不可回收成本上,对方就很难还价。**

**第三档,30/70见提单副本。**行业默认,上一节拆透了。这是你和绝大多数中小客户的常驻档位。

**第四、第五档,D/P与D/A,这两档是银行做的"中间人",不是银行做的担保,分清楚这一点能救你一次。** **D/P(Documents against Payment,付款交单)**:你发货后把全套单据交给自己的银行,银行寄给买方所在地的代收行,买方**付款**才能拿到单据、才能提货。它比"见提单副本"稳一点(单据不在买方手里,而在银行手里),但银行只负责传递单据,**不承担买方付不付款的责任**——买方翻脸不认,货照样堵在目的港。**D/A(Documents against Acceptance,承兑交单)**:买方只要在汇票上签字**承兑**(承诺X天后付款),就能拿走单据提货。到这一档,你其实已经把货白送出去了,拿到的只是一张欠条,风险接近下面的赊销。**记住一句话就够:D/P是"钱到给单",D/A是"签字给单",中间隔着一整个信用等级。**

**第六档,后T/T(货到付款/见货付款)。**货到目的港或买方仓库、验完货再付。卖方承担100%货值加全程运费。什么客户配这一档?合作两年以上、每年若干单、从没拖过款、并且他在你这的年采购额远大于单笔货值——他违约的代价大于赖账的收益,这才是信用的真实基础,不是感觉。

**第七档,O/A赊销(Open Account,记账交易)。**货发出,单据直接寄给买方,双方约定发票日或提单日后 **30/60/90天** 付款。卖方100%信用敞口,没有任何单据抓手。这是欧美大品牌和大型零售商的标准做法——不是他们坏,是他们的采购流程如此:收货、入库、对账、走付款周期。7.2.2说过的那条口径在这里成立:**账期超过60天且没有保险的单,不接**。

那些愿意做O/A的人靠什么活?靠把信用风险卖出去。**出口信用保险**(国内主要是中国出口信用保险公司,俗称中信保)对你的买方做资信评估、核定一个信用限额,在限额内发生买方破产或恶意拖欠,按约定比例赔付;小微企业统保产品的保费量级是**货值的0.3%-0.8%**,赔付比例常见 **80%-90%**。算一笔:一单¥100,000的O/A货,保费按0.5%是¥500,买了它,你把一笔可能血本无归的敞口换成了最多损失¥10,000-20,000的可控风险。**保险不是让你敢做赊销,是让你在必须做赊销时不至于一次出局。**

**现在把光谱翻译成一张给客户配档的表。**判断依据只有三样:关系深度、单笔金额、你亏得起多少。

| 客户画像 | 建议档位 | 理由 |
|---|---|---|
| 陌生询盘、首单、金额<$3,000 | 100%前T/T 或 50/50 | 你没有承受一次全损的余地 |
| 首单、$3,000-30,000、有实体经营可查 | **30/70见提单副本** | 行规档,双方都能接受 |
| 合作3单以上、从没拖款 | 30/70,可放宽到见提单+7天 | 用小让步换关系,风险可控 |
| 合作1年以上、量稳定 | 可给30天O/A,**额度=一单货值** | 敞口封顶在你亏得起的数 |
| 大品牌/上市公司/连锁零售 | O/A 30-60天 + 信用保险 | 不接受这条你就进不了他们的vendor list(见5.5.1) |
| 中东、南美、非洲部分市场大额单 | L/C(见14.3) | 外汇管制或商业信用不足 |

**一场翻车,数字给全。**一位做促销帽的同行,第三年接了个美国经销商,前两单30/70都很干脆,第三单对方开口:"我们要上系统走采购流程,以后统一net 60。"金额$28,000,他答应了——理由是"合作很好、对方是家二十年的老公司"。货发出后第45天,对方发邮件说下游客户的活动取消,要求退货或延期到120天;第80天电话开始没人接;最后走律师追,一年半后拿回$11,000。**他的错不在信任,在于三条同时踩了:第一,账期给在了单笔金额最大的那一单上(前两单¥小额30/70,第三单一步跨到28,000的全额敞口);第二,没买信用保险,0.5%就是$140,他省了;第三,没有额度概念——信用不是"给不给"的开关,是"给多少"的旋钮。**

三条红线,收尾时钉死,新人越过任何一条都是在赌:

- **红线一:新客户首单必须有定金,且定金金额 ≥ 你在这单上不可回收的投入**(打样、制版、专用物料、已付工厂定金)。定金不是诚意的象征,是止损位。
- **红线二:账期只给"你能承受其全额坏账"的客户和金额,并且一定要有额度上限**——写成"单一客户未清余额不超过X",X就是你一单毛利乘以三到五(赔一次,三五单赚回来)。超过60天无保险不接。
- **红线三:专线、快递、空运发出的货,尾款必须在货离开你控制之前收清。**因为这三种运输的单据都不是物权凭证(见16.5/17.4),货一出门,你手上一张牌都没有——上一节Mike那封邮件里的"款到交仓",就是这条红线的操作版。

本节动作:把这条光谱抄成一张卡片贴在电脑边,每来一个新客户,先在卡片上圈一个档位再谈价钱。顺序不能反——**先定档、再报价**;因为付款方式本身就是价格的一部分(前T/T可让1-2%,账期要加2-3%,见9.7.2),先报了价再谈条款,你就只剩让步的份。

## 14.3 L/C信用证

### 14.3.1 原理:用银行信用替代商业信用

半年后你会收到这样一封询盘,所以先把它放在这里当引子。一个迪拜的贸易商,要2,000顶素色棒球帽,邮件写得很规矩:规格清楚、数量明确、目标价合理,最后一行是——

> Our payment term is irrevocable L/C at sight. Please confirm your bank details for the credit.

("我方付款方式为不可撤销即期信用证,请提供开证所需的银行资料。")

你的心跳会快一下:2,000顶,货值一万多美金,是你当时最大的单。然后你会卡住——**信用证要怎么做?我要准备什么?我会不会做砸?**这一节和下一节,就是为了让你在这封邮件面前不慌:你得在三十秒内判断这单值不值得接,而这个判断需要你知道L/C到底在解决什么问题、代价是多少。

上一节那张配档表最后一行写着L/C,你大概率短期内用不上,但你必须看懂它。

回到13.1.1的元问题:隔着太平洋,凭什么信你。30/70的答案是"把风险切两半,各担一半";L/C给的是另一条路——**既然我们互不相信,就找一个双方都相信的人站中间。这个人是银行。**

**L/C(Letter of Credit,信用证)的定义要一字不落:它是开证行应买方申请、向卖方开出的一份有条件的付款承诺——只要卖方提交的单据与信用证条款相符,开证行就必须付款。**这句话里藏着两个杀伤力极大的字眼。

第一个是"**开证行必须付款**"。付款人从买方变成了银行。买方还有没有钱、公司还在不在、他是不是后悔了,统统与你无关——这就是本节标题那句"**用银行信用替代商业信用**"。买方的"我会付"变成了银行的"我付"。

第二个是"**与单据相符**"。银行不看货,只看纸。这条原则叫**独立抽象原则**——信用证独立于买卖合同,银行只处理单据,不管货物的实际状况。它是L/C的力量来源,也是它的全部陷阱,下一节专讲。

把角色链画出来,四个角色一次记住:

```
Mike(申请人applicant)
   ↓ 申请开证、交保证金或占用授信
温哥华某行(开证行issuing bank)——付款责任在它
   ↓ 通过SWIFT把信用证发出
青岛某行(通知行advising bank)——只负责核验真伪并转交给你
   ↓ 交到你手上
你(受益人beneficiary)——按证发货、制单、交单
```

链条上还有两个可能出现的角色,遇到时不至于懵:**议付行**(negotiating bank,愿意在开证行付款前先垫钱买下你的单据,收一道利息和费用)和**保兑行**(confirming bank,在开证行之外再加一层付款担保,用于开证行所在国政治经济风险高的场合,保兑费另收,通常买方出)。

**那么,为什么大额欧美单到今天还在用这个流程繁琐的老工具?**四个理由,每个都指向"金额大"这三个字:

**其一,金额到了商业信用扛不动的量级。**$5万的单,买方拒付你损失的是一单利润;$50万的单,拒付一次公司可能就没了。30/70的30%在$50万上是$15万——买方也不愿意把这么大一笔钱裸押在一个海外供应商手里。**双方都不敢裸,就都去找银行。**

**其二,L/C对买方同样是保护,不只是保护你。**没有单据,银行不付钱。买方要求什么单据就写什么单据:提单、发票、装箱单、产地证、保险单,甚至第三方检验证书。他没见到"货已按约定发出"的纸质证据,一分钱不会离开他的账户。这是L/C和"预付款"最大的区别——预付是买方全裸,L/C是双方都穿衣服。

**其三,它是买方的融资工具。**开一张**远期信用证**(usance L/C,如"提单日后90天付款"),买方开证时只需交部分保证金或占用银行授信额度,不用真金白银出账;货到手、卖掉、90天后再付钱。而你作为卖方也不必等90天——可以拿这张银行承兑去做**押汇/贴现**,提前拿到货款,银行按年化 **4%-6%** 扣掉利息。**一张纸同时给了买方账期和卖方现金,这是30/70做不到的。**

**其四,有些国家的外汇管制强制走L/C。**部分中东、南亚、非洲国家的进口商要付外汇,必须通过银行开立信用证才能拿到售汇批文——不是他想麻烦,是他没有别的通道。

**现在算代价,这才是你最该看的一节。**L/C是收费最贵的付款方式,而且贵在**固定费用**上,所以它对小单是毁灭性的。卖方这一侧的常见收费(以国内银行口径):

| 项目 | 量级 |
|---|---|
| 通知费(通知行收) | ¥200-400/笔 |
| 议付/交单手续费 | 0.1%-0.15%,最低$50-80 |
| 单据快递到开证行 | ¥150-250 |
| 电报/报文费 | ¥100-200 |
| 改证通知费 | ¥100-200/次 |
| **不符点费(重点,下节讲)** | **$50-100/次,直接从货款里扣** |
| 远期贴现 | 年化4%-6% |

固定部分加起来,**卖方一侧一套下来¥1,000-2,000**。把R&B这单代进去:货值4,950加元≈$3,625≈¥25,740,固定费用按¥1,500算,占货值 **5.8%**——而这一单走电汇的全部通道成本是¥388,占1.5%(算法见14.4)。**同一笔钱,换个收款方式,成本翻了近四倍,而毛利没多一分。**

由此得到一个可以当阈值背下来的数:**货值$30,000以下,不考虑L/C。**$30,000时,¥1,500的固定费用摊薄到0.7%,才开始合理;再往下,你付的是流程的税。

还有一笔更隐蔽的成本:**时间**。L/C的收款时间线是这样的——买方申请开证5-10天→通知行转交1-2天→你按证备货发货→制单3-5天→交单(必须在提单日后21天内)→银行寄单3-5天→开证行审单**5个银行工作日**→付款。即期L/C从**发货到收款要15-25天**;远期90天的,就是发货后105-115天。回头看30/70:你的尾款在**货交出去之前**就到账了。**L/C给了你银行的信用,拿走了你的现金流。**

本节动作:把三个数字记进脑子,以后客户一提L/C,你三十秒内能回话——**$30,000(值不值得用)、¥1,000-2,000(你要掏的固定成本)、15-25天(即期证发货到收款的时间)**。金额不够就大方地回一句:"For an order of this size, an L/C costs both of us more in bank charges than it protects. Could we do 30% deposit and 70% against shipping documents instead?"——用成本说话,比说"我不会做信用证"体面得多。

### 14.3.2 单证一致与不符点:新人为什么别碰

上一节留了一句没解释:银行只看纸不看货。这一节讲这句话的另一面——**纸只要有一个字不对,银行的付款承诺立刻作废。**这就是L/C的整个风险所在,也是"新人别碰"这个结论的全部依据。

先把两个术语立起来,它们是L/C世界的两条铁律:

**单单一致**:你提交的所有单据之间必须互相咬合。商业发票、装箱单、提单、产地证、保险单上的品名、数量、件数、毛净重、金额、唛头、日期,逐项对上,一个字不能差。这条纪律你其实已经见过了——8.1那位单证员的核心工作就是它(完整机制见第16章)。

**单证一致**:单据必须与**信用证条款字面一致**。注意是**字面**,不是意思。信用证上写货描 `NAVY BLUE COTTON BASEBALL CAP`,你发票上写 `Navy Cotton Baseball Cap`——意思完全一样,少一个 `BLUE`,就是不符点。信用证上把你公司名拼成了 `LTD.` 而营业执照是 `LTD`,你按执照写,也是不符点(正确做法是照抄信用证,哪怕它拼错了)。

**不符点(discrepancy)**,就是银行审单时发现的任何一处不一致。它的杀伤力不在那 **$50-100/次** 的罚款,而在下面这句话:

> **一旦出现不符点,开证行的独立付款责任就解除了,它有权拒付;这时候付不付款,回到由买方说了算。**

请把这句话读三遍。**有不符点的信用证,瞬间退化成商业信用**——而此刻你的货已经上船、单据已经交出、船正在开往对方的港口。买方在这个位置上可以做什么?他可以说"接受不符点,但价格降5%"。你答不答应?货在海上,退运要吃掉三成货值,你只能答应。**行业里大量的L/C压价,不是买方发现了品质问题,是他发现了你单据上的逗号。**

这套规则的成文依据叫 **UCP600**——国际商会颁布的《跟单信用证统一惯例》第600号出版物,全球银行审单的共同规则。里面几个硬期限记住:银行审单期 **5个银行工作日**;交单期 **不迟于提单日后21天,且不迟于信用证有效期**(两个条件同时满足,取先到者)。

**常见不符点,给你一份具体的清单**——注意每一条都不是"粗心",而是流程里真实的坑:

1. **逾期交单**:提单日后超过21天才把单据交到银行。返工、放假、单证员出差,一耽误就超。
2. **金额或数量超出容差**:信用证写 `500 PCS`,你出了510顶备品照实申报,超装即不符(除非证上写了 `about` 或允许±5%溢短装)。
3. **货描与信用证不字字相符**:上面举的 `NAVY BLUE` 的例子,最高发的一类。
4. **提单批注不符**:缺 `FREIGHT PREPAID`(运费预付)、缺 `CLEAN ON BOARD`(清洁已装船)、正本提单未按要求背书、提单上无船名航次。
5. **装运港/目的港/最迟装运期与证不符**:延期出运却没改证,这一条和交期事故直接联动。
6. **单据份数不对**:证上要 `3 originals + 3 copies`,你交了2份正本。
7. **受益人或申请人名称、地址与证不符**:少个后缀、多个空格。
8. **保险金额不足**:CIF条件下惯例要求投保 **发票金额的110%**,你按100%投保即不符。
9. **汇票的出票人、付款人、期限填错**。
10. **产地证签发机构与证要求不符**:证上要求贸促会签发,你交了海关签发的。

**这份清单看着都能避免,现实是什么样?行业里一个流传多年的数字:首次交单的不符点率在50%-70%。**也就是说,一多半的单据第一次交上去就被挑出毛病,要改单重交(改单还要赶21天的交单期),或者被开证行"表提"——发电报征询买方是否接受不符点。**做了十年的单证员都躲不过一半,这就是新人别碰的第一层意思。**

**新人别碰的三个理由,现在可以说全了。**

**理由一,成本高。**上一节算过:固定费用¥1,000-2,000,小单占比5%以上;加上15-25天的资金占用。你的单还没到$30,000这条线,L/C在经济上就是负的。

**理由二,专业门槛。**制单不是填表,是把UCP600的规则和信用证的条款逐条翻译成纸面动作。工厂里干这活的是专职**单证员**(见8.2.3),月薪五六千、干三五年才敢独立放单。你一个人身兼业务、跟单、验货、物流,再拿一半的精力去抠 `LTD` 有没有点,注定会漏。如果非做不可,市面上有单证代理,**代做一整套单据¥300-800**——这笔钱一定要花,别自己逞能。

**理由三,也是最阴的一层——软条款陷阱(soft clause)。**软条款是买方在信用证里埋进去的、**其达成与否由买方单方面控制**的条件。举三个真实形态:

- "须提交由申请人指定的检验人签署的检验证书,签字须与开证行留存样本一致" —— 检验人来不来、签不签,买方说了算。
- "货物须凭申请人发出的装船通知装运,该通知须以修改书形式加入本证" —— 他不发通知,你就不能装船;而你的交期已经在跑。
- "提单须由申请人指定的船公司签发" —— 指定的船公司什么时候有船、给不给你舱位,与你无关。

**识别口诀一句话:任何一份要求提交的单据,如果它的签发权或取得权不在你手里,就是软条款。**一旦证里有软条款,银行的"必须付款"就成了一句空话——因为你永远交不出相符的单据,而你的货已经生产完了。

**那什么时候不得不碰?**三种情况:客户所在国外汇管制强制走信用证(中东、南亚、非洲部分市场);单笔金额超过$50,000且买方坚决不接受30/70;招标或框架合同已经指定了结算方式。真到了这一天,四个动作按顺序做,一个都别省:

1. **收到信用证当天,逐条通读并核对**——重点核五项:金额与币种、最迟装运期与有效期、货描是否与你的PI一字不差、单据清单里有没有你交不出的东西、有没有软条款。
2. **有任何一条做不到,当场要求改证**,别想着"到时候再说"。**改证费由买方承担**,这是行规,写进合同。
3. **单据交给专业代理做**,¥300-800,买一个不符点的保险。
4. **能争取的四件事写进合同**:即期(不做远期)、允许±5%溢短装、货描简化(不要把整份规格表塞进货描里,越长越容易错)、不接受任何由买方控制的检验或通知条款。

本节动作:找一份信用证样本(网上大量公开样本,或问你合作的货代要一份脱敏的),打印出来,拿荧光笔把上面每一份"要求提交的单据"圈出来,逐个问自己一句:**这份纸,是我自己就能拿到,还是要看别人脸色?**这个动作只要做过一次,你这辈子看信用证的眼睛就不一样了。

## 14.4 小额工具:PayPal/信用卡/平台担保

L/C是大单的工具,电汇是中单的主力,那小单呢?一个客户要50顶帽子、货值$600,让他去银行填一张跨境电汇单、被扣掉CAD 45的手续费、等三天?他多半直接不买了。**成交是有摩擦的,小额工具的全部意义就是降低摩擦——但每降低一分摩擦,你都要付出费率。**这一节把常用的四类工具的费率、到账速度、适用金额和坑摆齐,最后回答一个主线问题:Mike这4,950加元,为什么你没让他刷PayPal。

**第一类,PayPal。**跨境小额收款的老大,买家端的信任度极高——很多欧美中小买家的心理是"能用PayPal付的就是正经卖家"。它的机制是买卖双方各自开户,买方从余额或绑定的信用卡付款,钱进你的PayPal余额,你再提现结汇到国内银行卡。

代价分两层,而**新人几乎只算第一层**。第一层是**收款费率:跨境交易约4.4% + 一笔固定费(按币种,加元约CAD 0.30)**。第二层是**提现时的货币转换加价**:PayPal换汇用的不是中间价,是它自己的报价,通常比中间价差 **3%-4%**。两层叠起来,**综合成本约7.5%-8%**。

7.3.2里那位算错加价率的同行,还记得吗——他"收款走PayPal,手续费吃掉营收的4.4%"。现在你知道了:他连自己亏了多少都没算全,4.4%只是第一层。

**PayPal真正的杀招是拒付(chargeback)。**买家在收款后 **180天** 内可以发起争议或拒付,理由从"货不符描述"到"我没收到"都行。平台的卖家保护要求你提供**可追踪的妥投证明**(带签收的物流记录),而定制品在争议中的卖家胜率明显偏低——因为"不符合描述"在定制品上几乎无法自证。想象一下:一单$4,000的定制帽,货已经在客户仓库,他发起拒付,PayPal先把钱从你账户里冻结划走,你去举证,来回一两个月。**这就是为什么PayPal适合小额:它的风险敞口是不封顶的,你只能靠把单笔金额压小来封顶。**

**第二类,信用卡。**通过Stripe、PayPal或第三方收单机构给客户开一个刷卡链接。费率结构:**本国卡2.9% + $0.30**,**跨境卡再加1%-1.5%**,货币转换再加约1%,综合 **4.4%-5.4%**。拒付窗口更长——各卡组织规则不同,常见 **120天,极端情形可达540天**;每笔拒付无论输赢,收单机构还要收 **$15-25的拒付处理费**。适用场景很窄但很有用:**$1,000以下的样品单、零散补货单、活动前的加急小单**——把它当成交润滑剂,不当主通道。

**第三类,平台担保:阿里国际站信保(Trade Assurance)。**机制值得单独说,因为它是这条光谱之外的第四种解法(见13.1.2)。买家不把钱打给你,打给平台托管;你按订单约定发货并上传物流单据,平台在约定条件满足后放款给你;出纠纷时平台介入,按订单条款和双方证据判定,可从卖方后续订单或保证金中扣划赔付。

**它的价值在破局**:一个陌生买家,他不敢先付钱给一个从没见过的中国供应商,你也不敢先发货——30/70在这里是死结,因为双方连"30%该给谁"都不信。信保把这30%放进第三方口袋,死结就解开了。费率上,**信保订单本身对卖家不单独收费**(成本已经打包在国际站的年费里,那笔账见21.1.1);买家如果用信用卡支付信保订单,通道费约 **2.95%**,通常由买家承担。

局限也要说透:**只保平台内的订单**——一旦你和客户说"下次直接微信联系、走线下转账",这层保护立刻归零(而平台上恰恰最流行这么干);放款周期比电汇慢,常见 **发货上传单据后7-30天**才到账,资金占用比30/70长;赔付以订单金额为上限,且受你的信保额度约束。

**第四类,第三方跨境收款:PingPong、万里汇(WorldFirst)、Wise等。**机制是给你一个**海外本地收款账户**——美国的ACH账号、欧洲的IBAN、加拿大的本地CAD账户;客户在他本国做一笔"本地转账"(对他来说零手续费、当天到),钱进入这个账户,你再提现结汇到国内的银行卡或对公账户。综合成本量级 **0.3%-1.0%**(提现费加汇率加价,各家差异不小,必须自己实测),**到账1-3个工作日**,没有固定手续费。它最大的优势是**免掉了客户端的麻烦**——客户不用去柜台填英文汇款单、不用担心OUR/SHA/BEN、不用等三五天。至于开户资质、结汇合规、能不能进对公,涉及你的经营主体,那一整套在25.2讲。

**现在做那道主线选择题:R&B这4,950加元,为什么走电汇?**把两个方案的钱算给你看。

**方案A,PayPal:**
- 收款费:4,950 × 4.4% + 0.30 = **CAD 218.1**
- 提现换汇加价:(4,950 − 218.1) × 3.5% ≈ **CAD 165.6**
- 合计 CAD 383.7,按¥5.2折 ≈ **¥1,995**

**方案B,银行电汇(实际走的,两笔):**
- 中转行扣费:CAD 15 × 2笔 = CAD 30
- 定金那笔因客户柜台勾了BEN,汇出行手续费也被扣走:再 **CAD 30**(见14.1.1;尾款那笔改OUR后没有这一项)
- 银行扣费小计 CAD 60,按¥5.2折 ≈ **¥312**
- 结汇点差约0.3%,基数约¥24,900 ≈ **¥75**
- 合计 ≈ **¥388**

**差额¥1,607。**这个数字换算成别的东西才有感觉:它是这一单毛利(约¥13,400,见14.5.1那张表)的 **12%**;它够付整批货的海派专线运费(¥1,400)还有富余;它相当于你白干了半个多月。**而且这还没算PayPal那个180天不封顶的拒付敞口——一个4,950加元的定制单被拒付,损失的不是手续费,是全部货款。**

**判断规则,一个可以直接用的临界点。**电汇的成本结构是"固定费用 + 极小比例"(CAD 15的中转费 + 0.3%点差),第三方收款是"纯比例、无固定费"(按0.9%算)。两者相等时:

```
15 = (0.9% − 0.3%) × A   →   A ≈ CAD 2,500(约¥13,000)
```

**单笔低于2,500加元(约1.3万人民币),用第三方收款更划算;高于它,银行电汇更划算。**注意这个临界点会随第三方的实际费率移动——如果你实测下来某家综合只要0.5%,临界点就推到CAD 7,500。**但无论怎么移,PayPal的7.5%-8%永远在最右边,它从来不是"划算"的选择,它是"能不能成交"的选择。**

最后给一张按金额配工具的表,贴在报价单模板旁边:

| 单笔金额 | 首选 | 理由 |
|---|---|---|
| < $500(样品、零散补货) | PayPal / 信用卡 | 费率高但成交摩擦最小,金额小到亏得起 |
| $500 - $2,000 | 第三方收款(PingPong/万里汇等) | 无固定费,0.3%-1%,客户端本地转账 |
| > $2,000 | **银行T/T电汇** | 固定成本摊薄,通道成本压到1%-1.5% |
| 平台来的陌生买家首单 | 阿里信保 | 用平台信用破"谁先动"的死结 |
| > $30,000 且买方要求 | L/C(见14.3) | 银行信用,固定成本才摊得薄 |

本节动作:去把你现在能用的收款渠道,**每一条都实测一笔小额**——让朋友或客户从海外汇100美元/加元进来,记下实到金额、扣了多少、几天到。费率表都是官网写的,实测才是你的。测完把结果填进上面那张表的最后一栏,那才是你自己的临界点。

## 14.5 现金流设计

### 14.5.1 定金匹配:客户的30%要盖住工厂的30%

前面四节讲的都是"钱怎么走",这一节讲"钱什么时候走"——而对一个手里没多少本钱的新人来说,**后者比前者重要十倍。利润是账面上的,现金流是能不能活下去的。**

先看主线。9.7.2留过一个悬念:工厂的30%定金¥2,625刚好盖住它的物料垫资¥2,500,那你呢?**你的30%盖不盖得住你要付出去的30%?**算给你看:

- **你收Mike**:4,950加元 × 30% = **1,485加元**,结汇后实到 **¥7,465**(扣费与结汇算法见14.1.1)
- **你付工厂**:¥8,750 × 30% = **¥2,625**
- **覆盖倍数**:7,465 ÷ 2,625 = **2.84倍**

盖得住,而且盖得很宽。付完工厂定金,你手上还剩 **¥4,840**——**这一单从头到尾,你没有从自己口袋里掏过一分货款。**

但2.84倍这个数字不能只当结果看,要看懂它从哪来。它等于**你的售价与采购价之比**(25,740 ÷ 8,750 ≈ 2.94,扣掉通道成本就是2.84)。也就是说:**只要收付双方的定金比例相同,覆盖倍数就等于你的加价倍率。**你之所以现金流轻松,不是因为你会安排,是因为你站在定制服务这一档、加价倍率接近3(见7.3.2)。这个认知很重要,因为它立刻推出了反面。

**把公式写出来。**设:

```
S = 你给客户的售价总额      a = 客户定金比例
C = 你给工厂的采购总额      b = 工厂定金比例
F = 定金到账前你已自掏的费用(打样、制版、寄样等)

不垫钱的条件:   a × S  ≥  b × C + F
临界定金比例:   a ≥ (b × C + F) ÷ S
```

代入R&B:定金到账前你自掏了多少?账要翻回打样期——绣花制版费¥200(见3.1.5)、第一箱寄样快递¥280、后面开发样与确认样的寄样约¥420,合计 **F = ¥900**。于是:

```
临界 a ≥ (0.3 × 8,750 + 900) ÷ 25,740 = 3,525 ÷ 25,740 = 13.7%
```

**结论惊人:以你的加价率,客户定金只要收到13.7%,你就不用垫一分钱。**你收了30%,安全垫厚得像床褥子。**这就是7.4说"定制服务档几乎不需要你垫钱"的算术依据**——不是感觉,是这个13.7%。

**现在看反例,一个把新人拖垮的经典组合:客户定金20%、工厂要50%。**

设想你接的是一单纯贸易走量代工(见7.3.1):从工厂拿货¥100,000,卖客户¥115,000(15个点毛利);打样寄样自掏F=¥2,000。客户是大经销商,只肯给20%定金;工厂因为要开模、备定制辅料,坚持50%定金。

```
你收进来:  0.2 × 115,000 = ¥23,000
你要付出:  0.5 × 100,000 + 2,000 = ¥52,000
缺口:      ¥29,000   ← 这笔钱必须从你自己口袋里出
临界 a =   52,000 ÷ 115,000 = 45.2%
```

**要不垫钱,客户定金得给到45%——而行规是30%,你连问都不好意思问。**所以这类单天生要垫钱,而且垫的是货值级别的钱。这不是谁做错了,这是**低加价率生意的结构性特征**:S/C只有1.15,定金比例上的任何错位都会被放大成现金缺口。7.4那句"钱少不是劣势,钱少却硬要站到吃库存的格子上才是",在这个公式里有了确切的形状。

**缺口出现时,谁补?四条路,按优先级排。**

**路一,改客户的比例**,最省事也最该先试。话术不是"我要多收",是给理由:"这单有开模费和专用辅料共¥18,000,是不可回收的专用投入,我们需要定金覆盖这部分,所以是35%。"——**把比例锚在具体的、对方能验证的不可回收成本上**(和14.2里50/50那套话术同源)。

**路二,改工厂的比例或节点。**跟老崔这种打过交道的厂谈,常见的可行方案是"定金30%、备料完成付20%、出货前付50%"——把工厂的50%拆成两段,你的现金压力就散开了。工厂愿意谈的前提是它信你,而信任来自前几单的准时付款(所以第一单永远要付得比约定还早半天,这是最便宜的信用投资)。

**路三,压缩F。**定金前自掏的每一分都是纯敞口:样品费该收就收(见10.4.1)、寄样用客户的到付账号(见10.4.2)、制版费在报价里向客户单列。R&B那¥900里,其实有¥700是可以要求Mike承担的,你当时为了促成第一单自己吃了——**吃可以,但要知道自己吃了什么,这是选择不是无知。**

**路四,自己垫。**只有当缺口小于"你亏得起的钱"时才走这条,并且要给它设一个上限,写在自己的纸上。

**最后把R&B这一单的完整资金流排成时间表**——这张表是本章的落点,也是14.5.2的起点:

| 时点 | 事项 | 进(¥) | 出(¥) | 手上余额(¥) |
|---|---|---|---|---|
| 第2周 | 绣花制版费200 + 第一箱寄样280 | | 480 | −480 |
| 第4-5周 | 开发样、确认样的打样与寄样 | | 420 | **−900**(垫资峰值) |
| 第5周 | Mike定金1,485加元入账并结汇 | 7,465 | | +6,565 |
| 第5周 | 付工厂定金30% | | 2,625 | +3,940 |
| 第8周 | 洗水厂轻酵素洗结算(见3.3.3) | | 500 | +3,440 |
| 第9周 | Mike尾款3,385加元入账并结汇 | 17,471 | | +20,911 |
| 第9周 | 付工厂尾款70% | | 6,125 | +14,786 |
| 第10周 | 海派专线运费(见17.4) | | 1,400 | **+13,386** |

三件事从这张表里跳出来:

**第一,你这一单的垫资峰值是¥900**,发生在第2周到第5周之间,持续三周多。**九百块,就是你启动这门生意的全部本金**——它比大多数人想象的少两个数量级,这是这本书想让你看到的最重要的一个数字之一。

**第二,余额线全程为正(除了开头那¥900)**,从来没有出现过负值。这不是运气,是14.1.2那三条错位规则每一条都执行到位的结果。

**第三,期末余额¥13,386,和7.3.2那张分账表咬得上。**那张表的成本合计¥11,950里有一项"收款与换汇手续费约¥400"——本章算出来的实际数是¥388(见14.4方案B);毛利¥13,790扣掉给Mike的让步折让80加元(¥416,见11.6.2),恰好落在¥13,374,与表上的¥13,386只差十几块的四舍五入。**一个数字,从第7章的估算走到第14章的实账,对上了。**

本节动作:拿一张纸,把你眼下手里(或计划中)的那一单,按上面这张表的六列画出来——**时点、事项、进、出、余额,一行都别省**。画完只看一件事:**有没有哪一行的余额是负的?**有,就回到公式 `a ≥ (b×C + F) ÷ S` 算出你需要的定金比例,拿这个数去跟客户或工厂重谈。谈不下来,这单要么改,要么不接——**接一单会让你余额变负的生意,你赚的不是钱,是风险。**

### 14.5.2 垫资三场景与锁汇初概念

上一节那张表是理想状态:客户定金给足、工厂节点配合、汇率没动。现实里会在三个地方漏,以及有一个变量全程在悄悄改数——这一节把四样都摆出来。

**垫资场景一,打样费。**这是最早发生、也最容易被忽略的一笔,因为它太小了。R&B这单的F=¥900:制版费¥200、三次国际寄样¥700。它发生在**客户还没下单的时候**——如果Mike最后没订呢?这¥900就是纯损失。行业行规给了你两把伞:**样品费¥100-300/顶,下单后冲抵**(见10.4.1),以及**寄样用客户的到付账号**(见10.4.2)。你这单两把伞都没撑,是为了拿下第一个客户的主动选择。

**给自己定一条阈值:单个客户在成交前的打样垫资超过¥1,000,必须收样品费或走到付。**为什么是1,000?因为打样阶段的客户流失是常态——一份询盘走到PI的转化率(第15章会拆)本来就低,你按"十个询盘成一单"倒推:十个客户各垫¥1,000,成一单赚一万三,光打样就吃掉近一万。**打样垫资的真正代价不是这一单的¥900,是你要为九个不成交的客户各付一次。**

**垫资场景二,专用辅料预付。**这一笔藏在生产链的中段。R&B这单里其实有一个:520套古铜滑扣套装(见2.4.2),¥1.2×520 = **¥624**,定制电镀、周期十来天(见8.4.1),是彻头彻尾的专用件——别的单用不上。这次它没成为你的问题,因为它包在工厂的¥17.5报价里,由工厂用你付的¥2,625定金去垫了。

但换个场景就成你的问题:客户要定制彩盒包装,500个×¥3.5 = **¥1,750**,包装厂不接小单、要求款到开机,工厂说"这是你指定的供应商,你自己付"。这时候如果客户定金还没到,¥1,750就是你的纯垫资。**规则一句话:任何"专用于本单、别的单用不掉"的物料,其预付款必须由客户定金覆盖。**落地成两个动作——**其一**,在报价阶段就把这类专用件单独列出来,让客户看见它;**其二**,在PI里写一句 `Procurement of order-specific materials starts upon receipt of the deposit.`(专用物料在定金到账后启动采购)。这句话同时保护两件事:你的钱,和你的交期起算口径(见4.7.2)。

**垫资场景三,尾款账期。**这是三个里金额最大的。假设Mike说"我们公司改了流程,以后要net 30"(收货后30天付款),你的表会变成什么样?

- 第9周,你不再有那笔¥17,471进账;
- 第9周仍要付工厂尾款¥6,125,第10周仍要付运费¥1,400;
- 此时手上余额:3,440 − 6,125 − 1,400 = **−¥4,085**;
- 这个负数要持续到第14周左右(货到温哥华再加30天),约 **35天**。

**算一下这35天的资金成本**:假设你去借这¥4,085,按民间小额资金年化8%算——

```
4,085 × 8% × 35 ÷ 365 ≈ ¥31
```

**三十一块钱。**这个数字小得让人意外,而它恰恰是本节最反直觉的一条结论:**账期的资金成本几乎可以忽略,账期真正的成本是两样别的东西——一是坏账风险**(那¥4,085如果收不回来,就是全损,不是利息问题,见14.2的红线二);**二是你根本没有那¥4,085**。对一个手上只有几千块周转的新人,"缺口4,085持续35天"不是一道利息题,是一道"这单还做不做得成"的存亡题。**所以拒绝账期的理由永远不是"我算过利息不划算",而是"我的余额线会转负"——理由说得准,谈判才站得住。**

**最后引入那个全程都在改数的变量:汇率。**

看时间跨度。你给Mike报9.9加元/顶是在第一周(见7.3.2);尾款到账在第九周;从定价到最后一分钱落袋,**中间隔了近两个月**。这两个月里,你的收入是加元计价的,你的成本几乎全是人民币计价的——**中间那道加元兑人民币的汇率,你完全没有保护。**这个状态有个名字叫**敞口**:一笔未来才发生的外币收支,在汇率上完全暴露。

算一下敞口有多大。本书统一口径1加元≈¥5.2(见0.3),合同总额扣掉折让后4,870加元,折¥25,324。

- 汇率动 **2%**(5.2 → 5.096):¥25,324 × 2% = **¥506**
- 汇率动 **5%**(5.2 → 4.94):**¥1,266**

对照这一单的毛利¥13,386:**2%的波动吃掉毛利的3.8%,5%吃掉9.5%。**而两个月里汇率走2%是家常便饭。9.7.2那位同行的故事就是这条的极端版——四个月汇率从7.2走到6.9,¥6,200,一口吃掉六成毛利(第28章还有一个更狠的版本:汇率吃掉全年利润)。

**对付敞口,有四招,从最轻到最重。**

**第一招,写条款。**报价单和PI里加一行:"汇率波动超过±2%,双方重新协商价格"(见9.7.2)。零成本、对双方公平、随时可用,新人的唯一必修招。

**第二招,缩短敞口时间。**敞口的大小是"金额 × 时间",金额你改不了,时间你能改:提高定金比例(把一部分收入提前锁定)、把尾款条款从"账期"改成"见单据",都是在给敞口做减法。R&B这单敞口只有两个月,已经是短的;如果给了net 30,敞口就变成三个月,风险自动涨50%。

**第三招,自然对冲。**收什么币种,就用什么币种付出去——你收加元、付人民币,天然没有对冲;但如果哪天你开始从东南亚采购、用美元付款,而收入也是美元,那部分就自动抵消了。这一招你现在用不上,但要知道它存在。

**第四招,锁汇。**这是真正的金融工具。最常用的一种叫**远期结汇**:今天就和银行签一份合约,约定三个月后按一个事先定死的价格(比如5.18)把一笔加元卖给银行,不管到时市价是5.30还是5.00,都按5.18执行。**它的本质不是让你赚汇率,是让你今天就把这一单的人民币收入变成一个确定的数**——对做生意的人来说,确定性比多赚那几百块值钱。代价是:你要有对公账户、要占用银行的授信额度或交保证金,个人身份基本做不了;而且合约到期必须履行,如果货款没按时收到,你还得去买外汇交割。所以它是"生意做起来之后"的工具,不是第一单的工具。

**给你现在的建议非常明确:第一招必做,第二招常做,第三、四招知道它在那儿就行。**当你的年收汇额到了几十万美元、有了自己的经营主体和对公账户,再回头认真学锁汇——那时候的账要连着到岸成本一起算(第19章教你把每一分钱都装进landed cost的公式),资金通道、结汇与远期工具的完整操作在25.2。

本节动作:在你的现金流表(14.5.1那张)最下面加两行——**第一行"汇率敞口":合同外币总额 × 单位汇率 × 2%,写出这个金额;第二行"敞口天数":从你报价那天到预计收到最后一笔款那天,数出来多少天。**这两个数每单都填一次。它们不会帮你赚钱,但填过十单之后,你对"报价有效期为什么要写45天"(见9.7.1)会有一种从骨头里长出来的理解。

**工具一:付款条款模板(对客户 / 对工厂,双向对照)**

*用法:两栏必须成对使用——先定"对客户"那一栏,再拿它去定"对工厂"那一栏,确保每个节点都是"先收后付"。*

**A. 对客户(你是卖方,写进PI/合同的Payment栏)**

```
Payment Terms:
  30% deposit by T/T in advance;

  [专线/快递单请改为:70% balance against packing list and

Production starts upon receipt of the deposit.
Procurement of order-specific materials starts upon receipt of the deposit.
All bank charges outside the beneficiary's bank are for the buyer's account
  (charge option: OUR).
If the exchange rate moves more than ±2%, both parties shall re-negotiate

Quotation validity: 45 days.
```

**B. 对工厂(你是买方,写进你签的PI/订货合同)**

```

  定金30%,合同签订后三个工作日内电汇至乙方对公账户;

交期自定金到账之日起算。
收款账户名须与合同抬头、开票方完全一致;账户变更须书面并经电话核实。
返工及复验产生的费用由乙方承担。
```

Beneficiary Name / Account / Address:  ______(与户名一字不差)
Bank Name / Bank Address / SWIFT(BIC): ______(支行地址,8或11位码)
Payment Reference:                     PI号
Charge Option:                         OUR
```

**D. 三句关键话术**

1. 催款查账:`Could you please send me the MT103 (payment advice)?`
2. 拒绝小额L/C:`For an order of this size, an L/C costs both of us more in bank charges than it protects. Could we do 30% deposit and 70% against shipping documents instead?`
3. 要求提高定金:"这单有开模/专用五金/定制包装共¥X的专用投入,别的单用不掉,所以定金需要X%来覆盖这部分。"

## 15.1 询盘甄别

### 15.1.1 真买家五特征:从邮件里读出预算和诚意

PDF 的第一页,就是那封邮件(全文见 0.4)。五十来个英文单词,你当时读了三遍,兴奋得手心出汗;今晚你第四遍读它,读法完全不同了——你不再读它的语气,你读它的**结构**。

把它逐句摊开:

> "我们想做 **500 顶**帽子" ——**特征一:有具体数量。**
> "要那种摸起来厚实、戴旧了好看的,**预算每顶 12 加元以内**" ——**特征二:有预算,而且是带边界的预算。**
> "**九月中旬我们有周年活动**,最好在那之前拿到货" ——**特征三:有用途场景;特征四:有时间点,而且是硬的。**
> "**logo 文件我让设计师发给你**" ——**特征五:有决策权。**

五个特征,一封五十词的邮件全中。这不是巧合,更不是 Mike 会写商务邮件——他连"贵司"这类客套都没有。这五句话之所以在,是因为**在他按下发送键之前,这五件事已经在他公司内部真实发生过了**。这才是"真买家五特征"的机制:每一个特征都不是一句话,而是一个已经完成的内部动作的痕迹。

- **有具体数量**,意味着他已经算过发放口径:活动送多少、吧台卖多少、员工留多少。凑不出这个数的人,给不出"500"这个数,只能给"少量试单"。
- **有预算**,意味着钱这一关他已经过了——12 加元是他心里已经批过的数,不是随口一说。注意他写的是"以内":给出上限的人,是在告诉你游戏规则,不是在讨价还价。
- **有用途场景**,意味着这批帽子在他公司里**有主人**。没有场景的采购需求是漂着的,谁都可以在任何一天说"这个先放放";有场景的需求钉在某个人的绩效上。
- **有时间点**,意味着倒推压力在**他**那边。九月中旬这个日子不是你提的,是他的活动定的——这一点在后面所有的谈判里都会替你说话。
- **有决策权**,证据不是他自称老板,而是那句"我让设计师发给你"——**他能调动别人**。一个能在一封邮件里指派同事干活的人,不需要回去请示。

再看一封反面标本。这是你后来在国际站上收到的第一批询盘里,最典型的一封,一字不改:

> **Subject:** Inquiry about caps
> Dear Sir/Madam,
> We are interested in your caps. Please send us your price list and catalog with best price.
> Looking forward to your reply.
> Best regards, David

数量:无。预算:无。用途:无。时间点:无。决策权:无——连公司名都没有。**五特征零命中。**这封信不是"不够详细",它是**内部什么都没发生过**的证明:没人算过量、没人批过钱、没人认领过这件事。你回它一份 PDF 目录只需要三分钟,回它一份定制方案要两个小时,而这两个小时的产出概率接近于零。

于是有了一张评分卡:**五个特征,每中一条 1 分。**

- **3 分及以上(真买家)**:当天回,而且回的是问题不是价格——4 小时内先回一封确认收到 + 三到五个关键问题,48 小时内出方案。
- **2 分(半熟)**:标准回复。给产品线介绍 + 价格区间(区间不是报价)+ 三个反问(见 15.1.2),看他接不接得住。
- **0–1 分(冷)**:模板回。一封通用产品册 + 一句"告诉我数量、用途和时间,我给你定制方案",然后忘掉它。

这张卡的价值要用时间算才看得出来。等你的获客通道跑起来(第20–23章),一个月收三十封询盘是常态,按 5 : 15 : 10 分布——5 封 3 分以上、15 封 2 分、10 封 0–1 分。一封定制方案的真实工时是 2 小时(拆需求、选面料、算价、排版、写信)。**只服务那 5 封,是 10 小时;三十封一视同仁,是 60 小时**——一个半工作周,而多出来的 50 小时几乎注定颗粒无收。新手做外贸最常见的死法不是接不到单,是**把时间平均分给了所有人**,结果给真买家的那份方案,是熬到凌晨两点、错字连篇、算错运费的那一版。

事故就长在这里。有人收到一封"send me your best price for 10,000 caps",数量大得心跳加速,连夜做了一版含五种面料的比价表,凌晨三点发出去,再无音讯——回头用评分卡一量:数量有(1 分),预算无、用途无、时间点无、决策权无,**总分 1 分**。大数量本身从来不是好信号;**大数量 + 无规格 + 无场景 + 无时间点**,是钓鱼比价的标准画像(下一节展开)。

最后钉一个术语。**询盘(inquiry)**:潜在买家主动发来的购买意向咨询——注意它和第9章的"询价"是相反方向的两件事:**询价是你去问工厂,询盘是客户来问你**;询价你是买方,询盘你是卖方,同一套话术不能直接搬。

本节动作:把五特征做成邮箱里的三个标签(A 真买家 / B 半熟 / C 冷),**收到任何一封询盘,先打分再动手**,不许在打分之前打开报价表。打完分你会发现一件反直觉的事:**得分最高的那封,往往写得最短。**因为内部动作全做完了的人,不需要用形容词来证明自己认真。

### 15.1.2 假询盘图鉴:骗样、钓鱼比价、钓鱼付款

评分卡筛掉的是"没用的",这一节筛掉的是"有害的"——它们通常分数不低,伪装得像真买家,而且每一种都精确地咬住你身上一块肉:样品、报价、货款。

**第一类:骗样。**画像非常固定:开口就要样品,规格问一句答半句,数量给得很大("先看样,好的话第一单 5,000 顶"),但一说到运费就开始拉扯——"我们公司规定不能付快递费""你们不是免费寄样吗""这点运费你都不出,诚意呢?"。收货地址往往是住宅、或者某个转运仓的编号地址,而不是公司。这一类人有的是同行采集样品,有的是做展会陈列,有的纯粹是薅羊毛的中间人。识别的钥匙第10章已经给过:**运费是全行业最便宜的诚意过滤器**(见 10.4.2)——样品可以免,运费不能免;愿意出一两百块运费的人,才可能掏几万块货款。算笔账你就不会心软:DHL 到北美一单 ¥200–250,一周被骗三单是 ¥700,一年五十周就是**三万多块**,而这三万块换回来的成交是零。

**第二类:钓鱼比价。**这一类最阴,因为它看起来最专业。特征有五个:①**只要价格,不谈规格**——你追问克重、针数、扣具,他说"你按你们标准的来";②**要求按他给的格式填**,甚至发来一张 Excel 让你填单价;③**催得非常急**,"今天下班前要";④**索要盖章版报价单 PDF**;⑤报价发过去之后,**彻底安静**。合起来的真相通常是:他手上已经有供应商了,采购部要走一个"三家比价"的内部流程,或者他要拿你的数字回去压现有供应商的价。你的报价单在他手里的用途,是一张**谈判道具**。

分辨它有一个很干脆的动作:**把价格和规格绑死**。回复里永远不给裸单价,只给"某个明确规格 + 某个明确数量 + 某个明确贸易术语"下的价格,并且加一句:"这个价格对应的是附件里这份规格;如果贵司现有供应商的规格不同,我们可以按您的规格重报一版——把他们的规格发我就行。"真买家会把规格发给你(他要的是可比的对比);钓鱼比价的人不会,因为**他要的恰恰是"不可比"**——一个脱离规格的低价数字,才好拿去压人。

**第三类:钓鱼付款。**这一类不咬你的样品也不咬你的报价,它直接咬货款,而且金额可以大到让你一年白干。两个常见变种:

**变种 A:超额付款诈骗(overpayment scam)。**剧本几乎一字不差:PI 金额 4,950 加元,对方"财务操作失误",汇来 8,000,然后发来一封很抱歉的邮件——"我们多付了 3,050,麻烦你退到这个账号"(注意:**另一个账号**,通常在第三国)。你一看银行流水,8,000 确实到账了,于是当天退款。三到七天后,原来那笔 8,000 被撤回——它是盗刷的信用卡、伪造的支票、或者被黑的账户资金。你退出去的 3,050 是真钱,收进来的 8,000 是幻觉,货还压在仓库。**红线一条,不容例外:任何"退款到第三方账号"的要求,一律拒绝,没有任何合理的商业场景需要这样做。**真的多付了怎么办?只有两个合规选项:原路退回付款账户;或者留在账上冲抵下一单,并出一份书面确认。

**变种 B:BEC 商业邮件诈骗。**这一种更可怕,因为它伪装成**你的真客户**。骗子注册一个和真域名差一个字符的域名——Mike 的真域名是 ridgeandbarrel.ca,他注册 ridgeandbarre**1**.ca(把字母 l 换成数字 1),或者 ridgeandbarrel.**co**。然后在你和客户的邮件线程里插进一封:"我们换了收款银行,尾款请打到新账号。"新手在临出货、满脑子交期的时候,十有八九不会去数那个字母。**疫苗有两针,必须都打**:第一针写进 PI——"**本 PI 所载银行信息为唯一有效账户;任何以邮件形式通知的银行信息变更均视为无效,变更须经电话/视频双方口头确认后另行签署书面附件**";第二针是习惯——**每次收到涉及钱的邮件,把发件人地址完整展开看一遍**,不看显示名,看 @ 后面那串字符。

**第四类:AI 群发询盘。**这是最近两年才有的新物种,值得单独立一条,因为它彻底废掉了老一辈"看语法判真假"的经验——过去英语通顺、格式工整就基本是真买家,现在这条判据完全失效。新特征有四个:①**语法完美、结构工整、礼貌得过分**,但通篇没有一个只有真买家才知道的细节;②**引用你网站或商铺上的原话,但张冠李戴**——夸你"在防水面料上的专长",而你根本没做过防水;③**规格数字自相矛盾**——"5,000 顶,预算 $1.2/顶,要求 100% 精梳棉重磅刺绣",这三个数在物理上凑不到一起;④**发件域名注册不到 90 天**,或者是免费邮箱配一个听起来很大的公司名。判断动作:把公司名丢进搜索引擎看有没有真实存在的门店/产品/社媒;域名用 whois 查注册日期;然后——**回一个只有真人能答的具体问题**(见下)。

**筛掉八成的三个反问。**上面四类图鉴看着复杂,落到操作上只有三句话,任何一封分数够高的询盘,回复里都带上它们:

1. **"这批帽子的用途是什么?什么时候要?"**——考的是场景和时间点。骗样的答不上具体活动,AI 群发的会给一段正确的废话,钓鱼比价的会绕开不答。
2. **"样品本身我们免费;国际运费按行规走到付,方便给一下贵司的 DHL 或 FedEx 账号吗?没有账号的话我们先垫付,计入首单冲抵。"**——考的是掏钱意愿(见 10.4.1、10.4.2)。这一句的杀伤力最大,骗样的当场消失。
3. **"麻烦给一下贵司完整公司名、地址和收货联系人——我们出正式报价单和 PI 需要完整抬头。"**——考的是身份。假的不敢给,给了也经不起查。

三个问题都答得上、答得具体的,基本就是真的;答上两个的,继续谈但不寄样;答不上的,归档,不删也不回。

本节动作:把上面的内容压成一张**五条红线卡**贴在显示器边上——①运费不肯出的,不寄样;②不给规格只要单价的,不出报价单;③要求退款到第三方账号的,一律拒绝并终止交易;④邮件通知改银行账号的,一律电话核对;⑤发件域名和抬头对不上的,先查再谈。这五条里,任何一条你破例一次,可能就是一年白干。

## 15.2 报价单制作:完整要素与有效期

六月中旬那个下午,你把第一版报价发出去之前,盯着屏幕犹豫了很久。屏幕上是一封写好的邮件,正文里孤零零一句话:"主款 500 顶,每顶 10.9 加元,含运含税到温哥华。"你差点就按了发送。

按下去会发生什么,你现在完全推得出来:Mike 回一句"含运费吗?"——你说含;他再问"含税吗?"——你说含;他第三问"那 10.9 是几月能到货?"——你开始算;第四问"要付多少定金?"……三个回合之内,你在他眼里就从"能帮我把这事办了的人"变成了"一个报价没写全的人"。而更贵的错误在后面:如果他默认这 10.9 是船上交货的价、你默认是送到门的价,一个"到门"和"离岸"的差,是**海派专线的 ¥1,400,摊到 500 顶是 ¥2.8/顶**(见第7章末的分账,详见 17.4),这笔钱不写清,就等着出货前撕破脸。

所以你没发。你花了两个小时,做了一份 PDF,文件名 **RB-QT-2026-001**。这一节讲的就是那份 PDF 里的东西。

**报价单(quotation / offer)不是价格表,它是"我们要谈的全部条件"的清单。**这句话是本节的骨。价格表(price list)是单向的、无期限的、对所有人一样的;报价单是**对一个具体客户、一个具体项目、在一个具体期限内、按一组具体条件给出的承诺**。法律上有个更锋利的说法:内容不完整、注明"仅供参考"的,通常只是**要约邀请**(邀请对方来谈);而条件完整、期限明确、你签了字的报价单,可能构成一个**要约**——对方在有效期内原样接受,合同就成立了。这不是吓唬人,而是提醒你:**报价单写得越完整,它离合同越近;而离合同越近的东西,越省事,也越危险。**省事在于,后面那张 PI 的九成内容就是把它换个格式重抄一遍;危险在于,你写下的每一行,后面都要用真金白银去兑现。

一份合格的报价单,**八个必填要素,一个都不能少**:

**一、报价方信息。**抬头、联系人、电话、邮箱,最好有个 logo。没有抬头的报价,是一张匿名纸条,客户拿去内部报批时会被财务打回来。这里有个新手常忽略的实务:你此时可能还没有公司主体(这件事第25章正面处理),那就用一个稳定的业务抬头 + 你的真名和真手机号——**宁可小,不可假**。

**二、买方与项目。**"To: Mike / Ridge & Barrel Brewing, Vancouver BC"、"Ref: R&B Anniversary Cap 2026"。写上项目名,是因为客户内部可能同时在推三件事,你要让他一眼知道这张纸对应哪一件。

**三、产品规格摘要。**注意是**摘要**,不是把规格表 v1.1 的十五栏全搬上来(见 2.5.2)。报价单上的规格摘要只有一个任务:**让双方在半年后还能确认"当时说的是这顶帽子"**。R&B 那份摘要是十行:6 片软顶 dad hat;100% 精梳棉磨毛斜纹 21 支 108×58、洗后 240g/㎡;藏青 PMS 289C;前幅平绣约 8,800 针、含金黄 PMS 7406C;古铜色金属滑扣 + 收尾环;绣花气眼;织唛主标 + 洗水标;轻酵素洗;单塑袋(含窒息警告)/8 顶一摞/100 顶一箱;成人可调 56–60cm。十行,每一行都是后面能吵架的地方。少写哪一行,哪一行就默认按对客户最有利的方式理解。

**四、单价与数量阶梯。**R&B 那份写了三档:500 顶 CAD 10.90、1,000 顶 CAD 10.20、3,000 顶 CAD 9.50。为什么明知他只要 500 顶,还要把 1,000 和 3,000 写上去?因为**阶梯是你在报价单上埋的第一个谈判筹码**:它提前告诉客户"价格是数量的函数",等到他开口砍价的那一天(下一节),你不必临时发明理由——理由早就写在他手上那张纸的第四行。**币种必须写全:CAD,不能只写 $。**加元、美元、澳元、新元共用一个符号,一个符号的误会就是 30% 的价差。

**五、贸易术语。**必须是"**术语 + 地点 + 版本**"三件套:DDP Vancouver, Canada (Incoterms 2020)。只写 DDP 不写地点等于没写(见 13.3)。R&B 这单在后面还加了一句大白话注释——"duty & tax included, delivered to your address"——因为 Mike 不是外贸从业者,他看不懂三个大写字母,他看得懂"税我不用管、送到我门口"。**给终端客户的报价单,专业术语后面永远跟一句人话。**

**六、交期,而且必须写起算点。**"20 days ex-factory after receipt of deposit and buyer's approval of the pre-production sample, **whichever is later**;plus 28–32 days door delivery."——最后那两个词是全行最值钱的两个词,后面 15.5.1 会讲透它救了你什么。绝不要写"9 月 10 日前发货"这种不带条件的绝对日期:客户的 logo 定稿晚给了五天,交期该不该顺延?没有起算点,答案永远是"不该"。

**七、有效期。**R&B 这份写的是"**自报价日起 30 天有效**"。三层意义,一层比一层实在:

- **第一层,汇率。**全书口径 1 加元 ≈ ¥5.2(见 0.3)。500 顶 × 10.9 = 5,450 加元。汇率若走弱 2%,你的人民币收入少 ¥567;走弱 5%,少 ¥1,417——对一单毛利一万三千多的生意(见第7章末的分账),5% 的汇率波动就能吃掉你**一成的利润**。所以报价单备注里还要跟一句第9章学来的条款:**"本报价基于 CAD/CNY 5.2,汇率变动超过 ±2% 双方重议"**(见 9.7.2)。
- **第二层,原材料与产能。**棉纱价、辅料价、旺季工价都在动;30 天之外的承诺,你兑现不了。
- **第三层,也是最实用的一层:有效期是最体面的催单器。**你不必说"你快点决定",你只需要在有效期还剩一周时发一封:"报价 7 月 13 日到期,面料那批现货色我先让工厂留着——需要的话我把有效期延到月底,你告诉我一声就行。"**既催了单,又送了人情,还顺手展示了你在替他盯着面料。**

**八、付款方式 + 样品政策 + 其他条款。**付款:30% 定金 / 70% 见提单副本(见第14章)。样品政策:样品免费、运费到付或垫付冲抵(下一节展开)。其他条款至少三条:数量允差 ±3%;报价不含目的国海关查验产生的费用(据实结算);颜色以确认样为准(见 10.6)。

最后是两条纪律,小,但每条都替人挡过刀。**第一,发 PDF,不发 Excel。**Excel 可以被改,而且改完看不出来——你不会想在争议时听到"你当时发的表里写的是 9.9"。**第二,文件名和编号带上客户代号和流水号**(RB-QT-2026-001),因为改版是必然的:第二版叫 -002,永远不要用"报价单最终版\_修改2\_确定.pdf"这种名字。

本节动作:把八要素做成一张空白模板存好(章末工具一是 R&B 的填好版),**从今往后,任何价格不许脱离这张模板单独发出去**——包括微信里那一句"多少钱?"。正确的回法是:"我做份报价发你邮箱,五分钟。"这一句话本身,就已经把你和 1688 上秒回整数报价的人区分开了。

## 15.3 样品规则:免费/到付/收费的行规话术

六月十五日下午,你在小区快递点填 DHL 面单。箱子里是一顶现成样、一条绣花样带、一块布头,加上一张打印的规格摘要。重量 1 公斤出头,面单上跳出来的数字是 **¥280**。你盯着那个数字愣了两秒——箱子里那顶帽子的出厂价是 ¥17.5,运费是它的十六倍。

这一节讲的就是这十六倍怎么处理:什么时候你出、什么时候客户出、什么时候谁都不用出。

**三档行规,先记住分档的逻辑再记数字。**

**第一档:样品免费 + 运费到付(客户出运费)。**这是外贸的绝对主流,适用于**规格清晰、意向明确的真买家**,以及所有现成样、库存样、通用样。**到付账号**(freight collect account,见 10.4.2)是这一档的技术底座:客户给你一串 DHL/FedEx/UPS 的月结账号,你在下单时填进去,运费直接记进他的月账单,你一分钱不掏。为什么行规是这样分的?因为这是一笔非常聪明的成本分摊:**样品的制作成本在你这边(你更懂怎么控制它),运费的支付能力在他那边(他要为自己的筛选付费)**。各出各的,谁也不欠谁,项目黄了两边都不心疼。

**第二档:样品费 + 运费都由客户出。**适用条件三条,和你自己去工厂打样时听到的完全一致,只是方向反过来(见 10.4.1):**要开模具的**(金属标、异形扣)、**要定织定染的**(起染量见 1.5.2)、**规格复杂到要走完整开发流程的**。这一档的关键不是收多少钱,而是那句行规话术:**样品费下单冲抵**。¥100–300/顶这个数字第10章已经立过,行规设计的精妙也讲过——真买家一分不亏,白嫖党自动出局。

**第三档:样品和运费你全出。**只有三种情况值得:**已成交客户的翻单确认样**(成本早摊进合作里)、**你主动争取的战略客户**(有明确的量级判断,当获客成本花)、以及**你自己出错要重做的样**(这个不用讨论)。

**新人最常犯的错,就是把第三档当成第一档用。**"免费寄样"四个字听起来是诚意,做起来是失血。带你算一遍:一年里,分数够高、值得寄样的询盘假设有 **20 封**。若全部样品免费 + 运费你出,按国际快递 ¥200–250/单算,一年 **¥4,000–5,000**,再加上样品本身(现成样 ¥17.5、开发样 ¥80–150,见 10.4.1),满打满算**五六千块**。

五六千块对一年做几十万流水的生意来说,不算灾难。真正的灾难在后面一层:**免费吸引来的,是"要样品的人",不是"要货的人"。**同样 20 单寄样,如果每一单都要求对方出运费,成交率通常能到两成——4 单;如果全免,来要样的人数会翻上去,但成交率会掉到半成以下——20 单里可能只成 1 单。同样五六千块,**一个买回 4 个客户,一个买回 1 个客户**。所以那句结论要再钉一遍,它是本节最贵的一句话:**运费不是成本,是过滤器。**你省下的不是钱,你省下的是给八个永远不会下单的人做方案的那八十个小时。

**标准话术,中英各一版,直接抄。**

中文(给国内客户/微信场景):

> "样品本身我们免费提供。国际快递按行规走到付,您给一个 DHL 或 FedEx 账号就行;没有账号的话我们先垫上,单价 ¥xx,计入首单从货款里扣回——您这边零支出。"

英文(邮件标准段,几乎可以一辈子不改):

> "The sample itself is free of charge. For the courier, we normally ship **freight collect** — could you share your DHL/FedEx/UPS account number? If you don't have one, we're happy to **prepay the freight (approx. CAD 40) and credit it against your first order**."

拆一下这段话为什么好使:①先给"免费"(建立诚意);②再讲"行规"两个字(不是我抠门,是全行业这么干);③最后给**一个不用他掏钱的台阶**——垫付 + 冲抵。三层下来,愿意做生意的人不会有任何不适,只想薅羊毛的人会在第三层消失,因为"冲抵"意味着他必须承诺下单。

Mike 走的就是第三层。他没有到付账号——一家精酿酒厂开国际快递月结账号干什么(见 10.4.2)。你垫了 ¥280,摊进报价。但你做对了一件事,而且这件事的价值远超过 280 块:**你告诉他你垫了。**邮件里那一句"Freight is on us for now; we'll credit it in the first order",不是索要感谢,是在做两件事——**把一次支出变成一次示好,同时把"first order"这四个字轻轻放进对话里**。这是整封信里唯一一处销售动作,而它藏在一句报销说明里。

**寄样这件事,寄出去只是一半。**另一半是三个动作,少做一个就白寄:

**动作一:寄出即发追踪号 + 内件清单照片。**面单和内件合影存档(见 10.4.2),邮件里写清"箱子里有四样东西:一顶现成样、一条绣花样带、一块 240 克布头、一页规格摘要"。为什么要写?因为客户收到一个箱子,只会拿出帽子看,那条最能说明问题的样带很可能被他当包装扔了。

**动作二:申报货值必须写实、且写对。**样品箱的报关申报值填 **¥50–100**,品名写清"cotton cap sample",并注明 **SAMPLE OF NO COMMERCIAL VALUE**。这一条是纯血泪:申报值写高了,客户在目的国被收关税和清关手续费——一顶帽子的样品让客户掏 30 加元的税和手续费,项目当场就凉,而且是那种"他不会告诉你为什么就不回你了"的凉。申报值写得离谱地低(比如 $1)也不行,海关会怀疑低报(见 16.2.2)。

**动作三:到货后 48 小时内主动问反馈,而且要问具体问题。**"请问样品收到了吗?"这种问法的回复率极低,因为它要求客户先自己组织语言。正确的问法是给他三个只需要回答"对/不对"的具体问题:

> "帽子应该到了。麻烦帮我看三件事:①**手感**——上手掂一下,是不是你说的那种'厚实'?②**logo 大小**——现在的比例放在帽子前面,你觉得偏大还是偏小?③**颜色**——在你们店里的灯光下看,这个藏青正不正?"

R&B 这一段的真实节奏:六月十五日寄出,六月十九日到,你在六月十九日发了上面这三个问题,**六月二十三日** Mike 回信确认手感——中间隔了八天,你在第四天问过一次,没有催第二次。这个分寸值得记:**问过一次之后,把下一次接触的理由换成"给他新东西"**(一张车间照片、一个改进建议),而不是重复问"考虑得怎么样了"。第二次催问会让你显得着急,而着急的人在谈判桌上要多让 5%。

本节动作:①做一张**寄样决策卡**——意向明确度、规格复杂度、关系深度三条线一过,自动落到三档中的一档(见 10.4.1 的三条线,反向使用);②把上面的中英文话术存进邮件模板;③固定**寄样五件套**:样品 + 样带 + 布头 + 规格摘要一页纸 + 一张手写便条。最后那张便条不值钱,但收到手写便条的客户,回复率明显高于只收到帽子的客户——**在一切都数字化的年代,一张纸片是最便宜的差异化。**

## 15.4 谈判

### 15.4.1 四维拉锯:价格、起订量、交期、付款互为筹码

六月二十四日,上午。Mike 的邮件比平时更短:

> "Love the sample. Board's fine with it. Can you do **10 all-in, delivered**? Round number makes my math easy."

你盯着屏幕,第一反应是松了口气——他预算是 12,你报的 10.9,他还价 10,离成交只差 0.9 加元一顶。第二反应是心跳加速——0.9 × 500 = 450 加元 = **¥2,340**,几乎是你毛利的两成。第三反应,也是你最后采取的那个,是把手从键盘上拿开,去泡了杯茶。

因为你想起了一件事:**价格是四个维度里唯一一个"降下去就永远回不来"的维度。**

谈判从来不是一根绳子上的拔河,它是**四根绳子**:**价格、起订量、交期、付款**。这四根绳子互为筹码——客户拉紧其中一根,你就去松另一根来换。新手谈判之所以永远在输,是因为他只认得第一根:客户说"贵",他就在单价上找答案;而单价一旦松口,后面三根绳子他一根都换不回来了。

先把四个维度各值多少钱**算出来**,你才有底气在谈判桌上调用它们。

**维度一:价格。**从 10.9 降到 10.0,是 8.3%,¥2,340。这笔钱的特殊性在于:它是**纯毛利的直接切除**,没有任何东西被换回来,而且**它会成为下一单的新起点**——第24章 R&B 翻单时,Mike 心里的锚不是 10.9,是你最后给的那个数。**降价的成本要按"这个客户未来五年的所有订单"来算,而不是这一单。**

**维度二:起订量。**这是你最有力、也最被新手忽视的一根绳。算给你看:500 顶这单,收入 4,950 加元 = ¥25,740(按 9.9 算),总成本 ¥11,950,毛利 **¥13,790**。现在把量抬到 1,000 顶、单价降到 9.5 加元——**单价降了 13%,毛利怎么变?**收入 9,500 加元 = ¥49,400;成本:货款 ¥17,500 + 轻酵素洗 ¥1,000 + 海派 ¥2,800(500 顶 ¥1,400,基本线性)+ 打样寄样 ¥700(**已经花掉的,不随量增加**)+ 换汇约 ¥740 = **¥22,740**;毛利 **¥26,660**。

**单价降 13%,毛利涨了将近一倍。**这就是起订量这根绳子的物理性质——固定成本(制版、打样、寄样、沟通工时)不随数量增加,量一翻,它们的摊薄就是白捡的利润。所以**"加量换价"永远是你在被砍价时的第一张牌**,哪怕你明知道客户吃不下这个量。

**维度三:交期。**交期的价值最隐蔽,因为它平时是零,一旦紧张就是天价。R&B 这单如果 Mike 坚持"八月中旬必须到门",会发生什么?工厂要插单——旺季插队的行规加价是 **5–8%**(见 9.7.1),¥17.5 × 500 × 6% ≈ **¥525**,还欠工厂一个人情(人情尺度见 8.7.2);如果时间压到只能改空运,500 顶连箱毛重六十多公斤,空运到温哥华一公斤四五十块起,运费 **¥2,800–3,800**,是海派 ¥1,400 的两倍多,一口吃掉两千多毛利。反过来,**客户在交期上给你的每一天弹性,都是可以折成钱的真实资产**——所以你必须学会开口要它,而且要在客户砍价的时候要。

**维度四:付款。**很多人以为付款条款是财务问题,其实**付款条款是交期条款**。看这条链:定金到账 → 工厂开备料 → 滑扣定制电镀要四五天到仓(见 8.4.1)、织唛交期 7–10 天(见 8.4.1) → 备料齐了才能上裁床。**定金晚到一周,备料晚一周,出货晚一周,到门晚一周**——你给 Mike 留的那两周半到货缓冲,就被压成一周半。定金早到一周值多少利息?¥7,700 按年化 10% 算,一周是 ¥15,少得可笑。但它值的不是利息,**它值的是把"风险"换成了"时间"**,而时间在九月中旬那个硬日子面前,比钱贵得多。

四个维度算完,茶也凉了,你开始写回信。你没有直接答应 10.0,也没有说"不行"。你给了**三个方案**:

**方案 A|加量换价**:1,000 顶,**9.50 加元/顶**,总额 9,500 加元。
**方案 B|减配换价**:500 顶,**10.00 加元/顶**(正是他要的数),但取消轻酵素洗、金属滑扣改塑料排扣、织唛主标改印唛。
**方案 C|换条件不换配置**:500 顶,**9.90 加元/顶**——**比他要的还低 0.1**——配置一分不动,但附四个条件:①30% 定金一周内到账;②交期按常规档排,以活动前两周到门为准,不走加急;③尾款见提单副本后三个工作日内付清;④允许我们把这单的成品照片和制作过程用作案例。

这三个方案的设计,每一个都在干一件不同的活:

**A 的作用不是让他买 1,000 顶——他吃不下。A 的作用是把"价格是数量的函数"这件事从报价单第四行搬到谈判桌上**,让他从此不再问"能不能又少又便宜"。

**B 的作用是把"降价 = 减配"的因果链摆到他眼前,让他自己否决它。**注意 B 给的是**精确的 10.00**——他要的那个整数,你一分不差地给了他,然后让他看见这个数字长什么样:一顶没有做旧手感、扣具是塑料的、内标是印上去的帽子。这里有个反直觉的账,你当时算过:B 方案取消轻酵素洗省 ¥500、滑扣改排扣省 ¥550、织唛改印唛省 ¥50,成本降到 ¥10,900,收入 ¥26,000,毛利 **¥15,100**——**B 方案比 C 方案多赚 ¥1,310。**你明明可以推 B,却在邮件里明确写了不推荐它。理由不是道德,是算术:Mike 要的原话是"摸起来厚实、戴旧了好看"(见 0.4),B 方案把这句话里的两个词都砍掉了;一顶手感垮掉的帽子会在他吧台上摆一年,**而第24章那笔翻单和年度 merch 日历,值的钱是这 ¥1,310 的十倍以上。**减配换来的利润是一次性的,配置守住换来的复购是复利的。

**C 是你真正想成交的方案,而它的精髓在那个 9.90。**低于对方开价的还价,在谈判里是一记重手:它同时传递三个信号——①**这是算出来的数,不是让出来的数**(整数 10.0 读起来像随口给的,9.90 读起来像有人拿计算器算过);②**到此为止**(比你要的还低,你还好意思再砍吗);③**我不是在退让,我是在交换**——后面那四个条件,才是这封信的正文。

四个条件里,第①③条锁付款(把风险换成时间),第②条锁交期(省下 ¥525 的插单费和一个人情),第④条锁的是钱以外的东西——**内容授权**,它在当时看起来最不值钱,却是你后来做获客时手上唯一的真实案例素材(第20–23章)。

Mike 的回信第二天就到了,一共四个字:"C works."

本节动作:**任何一次砍价,回复里必须至少出现两个维度。**做法极简:客户拉价格,你就在另外三根绳子里挑一根松开的去拉紧——加量、松交期、改付款。**永远不要用一个维度回答一个维度的问题**;单维度的谈判只有一个终点,就是你的成本线。

### 15.4.2 让步次序:先给什么、死守什么

上一节讲的是"用什么换",这一节讲更难的一件事:**按什么顺序给。**

顺序为什么要紧?因为在客户眼里,**你让步的顺序,就是你诚意的排序,也是你底线的地图。**你第一个抛出去的东西,他会认为是最不值钱的;你最后才松口的东西,他会认为是你的命根。如果你一上来就降价,你就等于告诉他:价格是我这里最不值钱的东西,而且我这个人一压就动。

所以有**让步阶梯**,从最先给到最后给,五级:

**第一级:信息与关注(成本≈0,最先给,而且要给得慷慨)。**更详细的方案、更多角度的照片、更快的回复速度、一段车间的视频、一条他没问但用得上的建议("你们吧台零售的话,建议留 50 顶不打活动 logo,活动结束还能继续卖")。这一级要**主动给、大量给、不换任何东西地给**——因为它不花钱,而它建立的是"这个人真的在替我想事"的印象,这个印象是你后面所有让步的定价基础。

**第二级:交期弹性与付款便利(低成本,可逆)。**提前排产、分批发货、定金比例微调、尾款宽限三天。这一级的关键词是**可逆**——这次给了,下次可以不给,不构成先例伤害。

**第三级:赠品、样品费与运费(小钱,但要换东西)。**多寄一顶样;给他的团队免费加做 5 顶试戴(成本 ¥17.5 × 5 = ¥87.5 + 运费,不到两百块,却是能被他拿到员工面前炫耀的实物);免样品费;免垫付运费。到这一级开始,**必须开始换东西了**。

**第四级:服务打包(中等成本)。**免费改一次版、logo 微调不另收、包装升级、包一次第三方验货。

**第五级:单价(最后,且绝不单独给出)。**

对应的,是一张**死守清单**——下面四样,任何阶段、任何理由都不让:

1. **核心配置。**克重、纱支密度、绣花针数、扣具材质——这四项一动,做出来就不是那顶帽子了,而客户当初点头的是那顶帽子。上一节 B 方案多赚 ¥1,310 却被你自己否决,就是这条规矩的执行现场。
2. **定金。**比例可以谈(30% 能谈到 25%),但**"有没有定金"不能谈**。没有定金的订单不是订单,是一个口头意向加你的全部风险(见第14章)。
3. **品质标准与验货权。**"以确认样为准"(见 10.6)和你上门验货的权利,一个字都不能松——事故一那 120 顶错线帽,就是靠这两条追回的(见第11章)。
4. **知识产权。**制版归属(见 3.1.6)、你的规格文件、你的工厂信息。

**核心句式:"我可以……如果你……"**

这是本节唯一需要背下来的东西。所有让步必须以条件句的形式出口,永远不要用陈述句:

> "单价我可以做到 9.9,**如果**定金能在这周内到账。"
> "交期我可以提前三天,**如果** logo 终稿本周五前定下来。"
> "样品费我可以全免,**如果**这个项目在本月内确认。"
> "包装可以升级成牛皮纸盒,**如果**这单我们能做到 800 顶。"

为什么必须换?因为**单方面让步会引发三个后果,而且一个比一个致命**:

第一,**对方会认定还有空间**。这是人的本能,不是恶意:你上一秒还是 10.9,这一秒变成 9.9,他凭什么相信 9.9 是底?他下一封信一定会试探 9.5。

第二,**它追溯性地摧毁你之前所有报价的可信度**。客户心里会冒出那句最伤人的话:"原来 9.9 也能做,那 10.9 是想坑我?"——**一次无条件的降价,买单的是你整套报价体系的信誉。**

第三,**它把关系的性质从"合作"改成"博弈"**。合作关系里,他会告诉你他的真实预算和真实活动日期;博弈关系里,他会开始虚报——虚报预算、虚报交期、虚报竞争对手的报价。而你后面所有的判断,都建立在他给的信息上。

**让步幅度必须递减,这是第二条铁律。**幅度本身在说话:第一次让 5%,第二次 2%,第三次 0.5%——递减的曲线在传达一件不用嘴说的事:**到底了。**反过来,每次都让差不多的幅度,等于在告诉对方"这口井还有水"。用 R&B 这单验算一遍:10.9 → 9.9 是 **9.2%**,幅度不小,但它是**一次性给足并绑定四个条件**的。如果你当时的处理是先降到 10.4(4.6%),Mike 一定再问 10.0;你再降到 10.0(3.8%),他会试 9.5——**每一次幅度没有明显收窄,谈判就不会结束。**

最后是一个新手最容易掉进去的坑,附解法。客户说:"太贵了。"新手的条件反射是:"那您觉得多少合适?"——这一句话把定价权拱手送人,而且从此再也要不回来了,因为对方报的那个数会变成新的天花板。正确的回法有两种,都是反问:

**拆解型反问:**"贵多少?跟谁比?"——逼他把参照系亮出来。九成的"太贵了"是没有参照系的口头禅;真有参照系的,他一说出规格你就能拆(见 9.8 的"问 why"),而对方的规格往往比你的低一档。

**转移型反问:**"我们一起看看是哪一项撑高了成本——是绣花针数、是那颗古铜滑扣,还是那道水洗?"——把话题从"价格"移到"配置",这是本节整个方法论的落点:**你不是在拒绝降价,你是在邀请他一起选择放弃什么。**

本节动作:从这一单开始,每个客户建一张**让步账**,三列——"我让了什么 / 我换回了什么 / 他手上还剩几个筹码"。R&B 这一张上写着:让了 1 加元/顶(¥2,340),换回了定金一周内到账、交期常规档(约 ¥525)、尾款三日内付清、案例授权。等到第24章他来翻单的时候,这张账就是你的底牌——**你会清清楚楚记得,上一次是他先给了四个条件,你才给的那 0.1。**

## 15.5 PI精讲

### 15.5.1 逐栏讲解:PI的每一行都是条款

七月六日,你把那份文件命名为 **RB-PI-2026-001**,导出 PDF,签上字,扫描,发出去。整个动作十分钟。而这十分钟里定下来的东西,后面八十天都在按它执行——出多少货、什么时候出、钱怎么付、出了问题谁担,全在那一张纸上。

先把术语钉死。**PI,proforma invoice,中文叫"形式发票"**——这个中文名极具误导性,以至于每年都有新人栽在上面。**PI 不是发票。**它不是财务凭证,不能入账,不能用来退税,不能拿去报关(报关用的是 CI 商业发票,见 16.2)。proforma 这个拉丁词的意思是"作为一种形式",它的原始用途是让买方拿去申请进口许可、申请开证、或者走公司内部付款审批——**"长得像发票,好让对方的财务系统接受它"**,如此而已。

但在中小额外贸的实务里,PI 承担的是另一个角色,而且是最重要的那个角色:**它是双方签字确认的销售合同。**买卖双方签字盖章之后,它具备合同效力——要约与承诺齐备、标的与对价明确。第9章末提过一句"询价拿到的每一个承诺,不进 PI 就等于没发生"(见 9.8),现在可以给出完整版:**PI 的每一行都是条款,每一个没写的栏位,都是一条默认对你不利的条款。**

下面逐栏拆,共十三栏。每栏说清三件事:写什么、法律含义是什么、坑在哪。

**第一栏|标题、编号与日期。**顶上写 PROFORMA INVOICE,右上角 No.: RB-PI-2026-001,Date: Jul 6, 2026。编号是**全套单证的主键**——后面的 CI、PL、提单、报关单都会引用它(见第16章),编号乱了,单证对不上,清关就卡。日期决定有效期起算。**坑:同一单改了三版却始终是同一个编号。**改版必须带版本后缀:-R1、-R2,并在邮件里写明"本版取代 7 月 4 日发出的 R0 版"。

**第二栏|卖方 Seller / Beneficiary。**公司名(或个人名)、地址、联系人、电话、邮箱。**核心规则一条:卖方名称必须与收款账户的户名完全一致**,一个字母都不能差,否则银行会以"名实不符"退汇,而国际退汇一趟走两三周、扣两三百块手续费。你首单的特殊情况值得单说:那时你还没有自己的公司主体(第25章正面处理这件事),用的是个人抬头 + 第三方收款平台,**PI 上的 Seller 是你的英文名,而 Beneficiary(收款人)是平台生成的账户名——两者不一致**。这种情况必须在 PI 上加一行说明:"Payment to be made to the beneficiary account stated below, which is our designated collection account." 不加这一行,客户财务八成会卡住付款,而你要花三封邮件解释,还显得可疑。那笔 1.5%、约 ¥400 的换汇手续费(见第7章分账),买的就是这个便利。

**第三栏|买方 Buyer,以及 Consignee / Notify Party。**完整公司名 + 地址 + 联系人 + 电话。**坑:买方和实际收货人不是同一个。**跨国集团采购、或者货代要求发到某个仓库时,买方(付钱的)、收货人(提货的)、通知方(到货通知发给谁)可能是三个不同的实体,PI 上必须分开写,否则提单做不出来(见 16.4)。R&B 这单三者同一,但你还是分三行写了——**格式的完整度本身就是专业度的信号。**

**第四栏|品名与规格 Description。**这一栏干两份活:对内它是**合同标的**,对外它是**报关品名的来源**——海关按它归 HS 编码,归错了税率就错(见第18章)。**坑:写两个字 "cap"。**必须写到这个颗粒度:"100% cotton brushed twill 6-panel unstructured cap with front embroidery, navy, adult adjustable"。R&B 这栏后面还挂了一句:"Full specification as per Spec Sheet v1.1 dated Jun 9, attached hereto and forming part of this PI."——**把规格表作为附件并声明"构成本 PI 的一部分"**,这一句让十五栏规格全部获得合同效力,而 PI 正文只需一行。

**第五栏|数量与数量允差。**500 PCS。然后必须跟一行:**Quantity tolerance: ±3%, settled at actual shipped quantity.** 为什么?因为生产必然有损耗(2–3%,见 9.6.1),做出来 497 顶是常态。**不写允差,少一顶都构成违约**,而且理论上客户可以拒收整批。±3% 意味着 485–515 顶都算履约,按实际发货数结算货款——多退少补写清楚。

**第六栏|单价、总额与币种。**Unit price: CAD 9.90 / Amount: CAD 4,950.00。两条硬规矩:**币种写字母不写符号**(CAD,不是 $);**总额加一行英文大写**——SAY CANADIAN DOLLARS FOUR THOUSAND NINE HUNDRED AND FIFTY ONLY。大写金额是防篡改的老办法,数字可以被涂改,一整行英文不能。

**第七栏|贸易术语。**必须"术语 + 地点 + 版本"三件套:**DDP Vancouver, Canada (Incoterms 2020)**(见 13.3)。R&B 这栏后面加了一句人话注释:"duty and taxes paid by seller, delivered to buyer's address"。这里有个从业者才知道的细节,现在说清楚:你实际走的是海派专线双清包税到门(见 17.4),这是**货代的产品**,不是 Incoterms 的法定术语;它的结果和 DDP 一致(税和清关都不用客户管),但**责任链不同**——法定 DDP 下进口清关的法律责任人是卖方,而专线模式下这件事由货代以自己的渠道完成。对小客户小金额,写 DDP 是通行做法且不会出事;但你心里要清楚这两者不是同一个东西,遇到金额大、客户有正规报关团队的单子,要按 13.3 的方法重新选术语。

**第八栏|交期 Delivery time——全 PI 最该逐字抄的一栏。**R&B 这栏的原文:

> "Ex-factory within **20 days** after (a) receipt of the 30% deposit and (b) buyer's written approval of the pre-production sample, **whichever is later**. Estimated ex-factory: Jul 28, 2026. Estimated door delivery: 28–32 days after ex-factory (est. Aug 25–29, 2026). **The door-delivery date is an estimate; seller's obligation is limited to the ex-factory date.**"

三个设计,每一个都在挡一把刀。**第一,起算点是条件不是日期**——"定金到账"和"产前样批准"两个条件里较晚的那个,才是第 1 天。客户 logo 终稿晚给五天、产前样批复晚给三天,交期自动顺延,不用吵。这就是事故二的疫苗(见第4章埋点):后来大货实际延到八月二日出货,比 PI 上的估计日晚了五天,而你之所以没有违约,靠的正是这一句。**第二,把出货日和到门日分开写,并且只对出货日承担责任。**DDP 条件下客户关心的是到门日,但海运时效和目的国清关你控制不了(事故三:加拿大海关随机查验又延了三天,见第18章)——**把不可控的部分标成 estimate,是唯一诚实且安全的写法。**第三,给了具体的估计日期,而不是只有条件——客户要的是能写进日历的东西,只给条件不给日期是把不确定性全推给他,不professional。

**第九栏|付款条件 Payment terms。**原文:"30% deposit by T/T upon signing of this PI; 70% balance by T/T against copy of B/L, before release of original documents." 三个要点:**定金支付的触发点是"签署本 PI"**,不是"收到货"也不是"排产后";**尾款的触发点是"提单副本"**——货已经上船、有单据为证,但正本单据还在你手里,客户没付尾款就提不了货(第14章、16.4.1 会讲透这个"物权凭证"的妙处);**"before release of original documents"这半句不能省**,它是你手里那把锁。**坑:写"货到付款"。**跨国交易里的货到付款,等于你把货和钱同时交给了对方的信用。

**第十栏|包装与唛头 Packing & Shipping marks。**"1 pc/polybag with suffocation warning, 8 pcs/stack, 100 pcs/carton, 5 cartons, carton size 60×40×40cm." 唛头内容照抄一遍。**这一栏的唯一使命是:和后面的装箱单、商业发票、箱唛三者的件数、毛重、净重完全一致**——事故三的教训原文就是这一句(见第18章)。PI 是这四份文件的源头,源头写错,后面三份一起错。

**第十一栏|银行信息 Bank details。**户名、账号、开户行名称与地址、SWIFT CODE。必须紧跟一条:

> "The bank details stated above are the only valid account. **Any change of bank details notified by email shall be deemed invalid** and must be confirmed by phone/video call between both parties and signed as a written amendment."

这就是 15.1.2 里那支 BEC 疫苗的第一针,写在这里。**一行字,防的是整笔货款。**

**第十二栏|有效期 Validity。**"This PI is valid for **7 days** from the date hereof." 注意它比报价单的 30 天短得多,原因很实在:**PI 一签,你就要去锁工厂产能、锁面料、下辅料订单**——这些东西不可能给客户留一个月。7–15 天是行规区间。

**第十三栏|其他条款与签字栏。**质量标准("Quality as per the approved counter sample sealed on Jul 6, 2026",见 10.6)、验货权、不可抗力、争议解决(约定适用法与仲裁/诉讼地)。最后是双方签字盖章栏。**坑:只有你签了字,客户回一句"OK, go ahead",你就开工。**记住第14章那句话:**签字是意向,定金到账才是订单开始。**七月六日 PI 签回,七月八日定金到账,你是七月八日才给工厂下的生产通知单——中间那两天,你什么都没订。

本节动作:把这十三栏做成一张**填写卡**(章末工具二),每次开 PI 照着走一遍。另外,今晚就把第八栏那句 "whichever is later"、第十一栏那段银行条款、第五栏那句数量允差,单独存成三段可粘贴的文本——**这三段话加起来不到八十个英文单词,而它们分别挡住的是交期索赔、货款诈骗和整批拒收。**这是本书里投入产出比最高的三分钟。

看完整张表,有六个地方值得单独拎出来说一遍——它们是这张 PI 上"看起来平平无奇、实际救过命"的部分。

**一、定金和尾款把加元金额写出来了。**很多人只写百分比。写死金额的好处是客户财务不用自己算,而且不会出现"30% 是按货款算还是按含税总额算"的扯皮。1,485 + 3,465 = 4,950,一分不差。

**二、规格没有塞进正文,而是"以附件为准并构成本 PI 的一部分"。**PI 正文里只有十行摘要,而真正的十五栏规格表 v1.1(见 2.5.2)和 trim sheet(见 9.3.1)以附件形式获得同等效力。这样做的好处是 PI 保持一页纸的可读性,而争议时可以拿出附件逐栏对照。**"forming an integral part of this PI" 这七个英文单词,是把两份技术文件升格为合同文本的开关。**

**三、品质标准锚定在"七月六日双方签封的确认样"上,而不是任何文字描述。**"厚实""正的藏青""好看"这类词在合同里全部无效,只有那两顶签了骑缝的封样是有效的(见 10.6)。事故一里那 120 顶错线帽之所以能判拒、能让工厂全额担责,靠的就是这一行(证据链的留法见 11.6.1)——**争议的最高裁判永远是封样,而封样能不能上法庭,取决于 PI 上有没有这一行。**

**四、验货权写进去了。**"buyer or buyer's agent entitled to inspect at factory"——注意这句话在这张 PI 上是 Mike 对你的权利,但你在给工厂的采购单上原样复制了它,于是你才能名正言顺地在七月末进厂验货——把品质标准写进合同的完整写法见 11.2.2。

**五、目的地查验费"据实结算、凭票报销"。**这一行是给事故三准备的:加拿大海关随机查验,产生约 CAD 150 的费用(见第18章)。有这一行,这笔钱怎么算是清楚的;没有这一行,你和客户会为一百五十加元花掉三封邮件和一点信任。

**六、最后说说另一张 PI——你和工厂之间的那一张,和这张是背靠背的。**同一天,你把胶州那边的采购确认单也签了,内容对照如下:

| 对照项 | 给 Mike 的 PI(卖方=你) | 给工厂的采购单(买方=你) |
|---|---|---|
| 单价 | CAD 9.90/顶 到门 | **¥17.5/顶**(行内折算口径 FOB 青岛约 $2.45) |
| 交货条件 | DDP Vancouver | **工厂仓库交货,货代上门提货**(青岛港,胶州拖车约 1 小时,见 6.2.1) |
| 交期 | 定金 + 产前样批准后 20 天出货,估 7/28 | 同上,**同一起算点、同一出货日** |
| 付款 | 30% 签 PI / 70% 见提单副本 | **30% 定金 / 70% 验货合格、发货前付清** |
| 品质标准 | 以 7/6 签封确认样为准 | **同一顶封样,同一句话** |
| 制版 | —— | **版客供,制版费免收**(见 9.8) |

背靠背这三个字不是形容,是**三条必须逐项对齐的硬规则**:

**规则一,规格文字逐字相同。**你给 Mike 的品名描述和你给工厂的品名描述,如果一个写 "240gsm after wash"、另一个写 "240 克左右",中间那点差,最后要由你自己掏钱填平。**你是夹在中间的人,任何两份文件之间的缝隙,都是你的成本。**

**规则二,交期必须留出你的缓冲,且缓冲在客户那一侧。**工厂给你的出货日是七月二十八日,你给 Mike 的估计出货日也是七月二十八日——**看起来没留缓冲,缓冲留在了哪里?留在"到门日只是估计值"这句话里,以及九月中旬活动与八月底到门之间那两周半。**这是新手最容易做反的一件事:很多人对客户承诺一个漂亮的到门日期,却对工厂只要一个模糊的"月底吧"。正确的做法永远相反——**对工厂要死日期,对客户给区间加免责。**

**规则三,现金流必须是"先收后付"。**七月八日 Mike 的定金到账,你才在同一天给工厂付定金;尾款也一样,先收 Mike 的、再付工厂的。这条规则在生意小的时候是生死线:**你没有资金垫付的能力,你的全部本钱就是这个顺序。**倒过来一次——先垫钱给工厂,客户那边黄了——你这一年就白干了。

本节动作:把这张表另存为你自己的 PI 模板(章末工具二给了骨架),然后做一件更重要的事:**新建一个文件夹叫"背靠背",每接一单,把"给客户的 PI"和"给工厂的采购单"两份文件放进去并排打开,逐行对照一遍。**六个对照项全部对齐了,才允许给工厂付定金。这个动作五分钟,它防的是这门生意里最典型的一种死法——**卖出去的和买回来的,不是同一顶帽子。**

## 15.6 主线案例:R&B订单往来邮件全文复盘

回到那份 59 封的 PDF。凌晨快一点,你把它翻到底,然后做了一件事:按日期给它分了段,数了数。

```
6/3 → 6/15   需求翻译与方案        18封
6/15 → 6/23  寄样与手感确认         9封
6/23 → 7/6   谈判与PI              11封
──────────────────────────────────────
成交前合计                        38封
7/6 → 8/3    生产、验货、事故、收款  21封
```

**38 封信,换来一张 4,950 加元的 PI。**平均每封信 130 加元的合同额。这个数字本身没什么用,但它能治一种病:很多人以为成交是某一封"神来之笔"的邮件促成的,于是把力气全花在打磨那一封上。真相是**成交是 38 封信的累积效应**,而其中真正决定走向的,只有下面五封。今晚,你把它们一封封调出来,在旁边写批注。

**第一封|六月三日,Mike 的询盘。**(全文见 0.4)

> "我们想做 500 顶帽子,要那种摸起来厚实、戴旧了好看的,预算每顶 12 加元以内,logo 绣前面。你能做吗?九月中旬我们有周年活动……logo 文件我让设计师发给你。"

**批注——这一封你做对了什么:**你没有当天回。你花了两天,先去搞明白"厚实"是什么(第1章),再回信。**收到高分询盘时,最贵的资源不是速度,是第一封回信的质量。**四小时内回一封"收到,我这两天给你出方案"是必要的;但真正的回复,值得让它慢两天。

**差点做错什么:**你的第一版草稿里写了一句——"12 加元完全没问题,我们能做。"这句话如果发出去,后面所有事都会变形:**你把他的预算上限变成了你的价格天花板**(他会认为 12 是你的目标价,任何低于 12 的报价都是理所当然),同时**你把自己从"能解决问题的人"降格成了"能干活的人"**。删掉它,是这一单里你做的最有价值的一次删除。

**第二封|六月五日,你的第一次专业回复。**这是全程最关键的一封,原文照录:

> Hi Mike,
>
> 很高兴收到你的邮件——那顶旧棉帽的手感我知道你说的是什么,我们能做出来。
>
> 在给你出方案之前,有七个问题想确认一下,大部分你只要回"是/否"或者选一个就行,**没想好的我给了默认建议**:
>
> **关于用途**
> 1. 这 500 顶主要是活动当天送人,还是也要放在吧台常年零售?(**建议:两者兼顾——我按能卖得掉的品质做**)
> 2. 收帽子的人主要是男性、女性还是都有?(影响颜色和尺码策略)
>
> **关于帽子本身**
> 3. "厚实"这个手感,我理解成 240 克左右的磨毛全棉斜纹——比常见促销帽厚一档,戴一季会越戴越服帖。可以吗?(**建议:可以,这是最接近你那顶旧帽的路子**)
> 4. 颜色:你们酒标是深色系,我建议做藏青,配古铜色金属扣。(**建议:藏青 + 古铜**)
> 5. 帽型:硬挺的棒球帽、软顶弯檐的 dad hat、平檐 snapback——三选一。(**建议:dad hat,和"戴旧了好看"最搭**)
>
> **关于时间和商务**
> 6. 九月中旬活动的具体日期是哪天?我按这个日子倒推排期。
> 7. logo 文件什么时候能给我?这个决定我们什么时候能开始打样。
>
> 我这周内给你一份完整方案 + 报价,包含面料、帽型、绣花和交期倒推表。
>
> ——[你]

**批注——做对了三件事。**

**其一,问的是问题,不是价格。**新手回询盘的标准动作是"我们的帽子多少钱一顶",而这封信从头到尾一个数字都没有。**在你不知道他要什么之前给出的价格,不是报价,是猜价。**

**其二,每个问题都带默认建议。**这是这封信最要命的设计,也是新手与老手的分水岭。开放式问题("你想要什么面料?")是让客户替你做作业——而客户不懂面料,他做不了,于是他不回你,项目就死在这里。**带默认选项的问题只要求客户点头或摇头**,而每一次点头,都在把决策权交给你,同时把他自己往这个项目里绑深一层。回复率的差距不是百分之几,是数倍。

**其三,给了时间承诺。**"我这周内给你一份完整方案"——一句话把下一次接触的时间点定死,不用再找借口开口。

**差点做错什么:**第一版草稿里你列了 11 个问题,包括尺码分布、包装形式、是否要吊牌、要不要环保面料。发出前你砍到 7 个。**问题超过七个,回复率断崖式下跌**——因为它从"确认几件事"变成了"填一张表",而没有人愿意给一个还没成交的供应商填表。被砍掉的那四个问题不是不重要,是**放错了时间**:它们后来分散在第三封和寄样之后的邮件里,一次一两个,全部拿到了答案。

**第三封|六月十三日,方案与报价。**结构是五段:

```
① 一句话总结 → ② 四个SKU方案(主推一个) → ③ 主款规格摘要十行
→ ④ 报价单PDF附件(见15.2) → ⑤ 时间线倒推表 + 下一步动作(寄样)
```

其中第 ⑤ 段是这封信的杀手锏,原样贴出:

> 从你们九月中旬的活动往回推:
> 活动日 → **提前两周到门**(留缓冲) → 八月底到门 → **海运约 30 天** → **七月底出货** → **生产 20 天** → **七月上旬付定金** → **六月底前定案(帽型/颜色/logo)**
> 也就是说:**我们大约还有两周半时间做决定。**

**批注——做对了什么:**倒推表把"什么时候必须决定"这个问题,从你嘴里的催促变成了他自己算出来的结论。**deadline 是他的,压力就该在他那边;你只负责把箭头画出来。**这一张五行的倒推表,后来直接决定了他在六月二十三日就回了确认手感,而不是拖到七月。

**差点做错什么:**方案第一稿里,四个 SKU 是平铺的——四张图、四段介绍、四个价格,让客户挑。改稿时你把它改成了"**主推一个 + 备选三个**",主款占八成篇幅,另外三个各两句话("夏天活动可以考虑速干款""冬天做提花 beanie")。**平铺四个选项,客户的决策成本是四倍,而选择困难的终点通常是不选。**主推一个,他只需要判断"这个行不行",而另外三个的作用是让他看见你不是只会做一款——**它们是能力展示,不是选项。**这个改动的价值在第24章会兑现:年度 merch 日历的雏形,就是那三个备选。

**第四封|六月二十四日,砍价与三方案。**Mike 的原文只有两行(见 15.4.1):"Can you do 10 all-in, delivered? Round number makes my math easy."

你的回信结构(完整逻辑见 15.4.1):先谢,再给三个方案 A/B/C,每个方案配一句话说明它牺牲了什么,最后一句:"我推荐 C——配置一分不动,而且比你要的数还低一毛;我需要的是那四个条件,尤其是定金的时间,因为那颗古铜滑扣是定制电镀,要提前四五天备。"

**批注——做对了三件事:**其一,**没有问"那你觉得多少合适"**;其二,**B 方案精确地给了他要的 10.00**,让他自己看见那个整数长什么样;其三,**给出理由时用的是具体的物理约束**("滑扣定制电镀要四五天")而不是抽象的商务话术("尽快确认以便我们安排生产")。**具体的理由让人配合,抽象的理由让人拖延。**

**差点做错什么:**你的第一稿是这样开头的——"9.9 可以做,你看行吗?"没有条件,没有方案,一句话就把 1 加元让掉了。发出前你全删重写。今晚回头看,那一稿如果发出去,大概率的走向是:Mike 回"能不能 9.5",因为**一个没有条件的让步,等于宣告后面还有空间**(见 15.4.2)。

**第五封|七月六日,确认下单。**中间隔了十天:他在六月二十五日选了 C,你们随即走完打样(打样需求单、样带、开发样、logo 上移 5mm、两顶确认样签封,全过程见第10章)。七月六日这封,是签封照片发过去之后他的回信:

> "Photos look right. We're good to go — send me the PI and I'll get the deposit out this week."

你的回信,四行:

> 好的,PI 附在下面(RB-PI-2026-001),麻烦签字回传。
> 定金 **CAD 1,485.00**,汇款请务必在附言里注明 **RB-PI-2026-001**。
> 定金到账当天我给工厂下生产通知单,那天开始算交期第 1 天;滑扣和织唛我先让工厂预排,**面料的档期我已经让他们留到本周五**。
> 产前样做出来我拍照片发你确认,大约这周末前。

**批注——做对了什么:**这四行里没有一句寒暄,每一行都是一个**可执行的下一步**:签什么、付多少、附言写什么、到账后第一件事是什么、下一次接触是什么时候因为什么事。**成交邮件的唯一任务,是让客户合上邮件就知道自己该干什么。**"面料档期留到周五"那句,是最后一次温和的推力,而且它是真的——不是话术。

**差点做错什么:**PI 的交期栏,你第一稿写的是"九月十日前到门"。签字前你改成了"定金 + 产前样批准后 20 天出货 + 到门为估计值"(见 15.5.1)。这一改,四周后救了你一次:大货因为绣花外发排队和事故一返工,延到八月二日才出货,比 PI 上的估计日晚五天——**如果当初写的是"九月十日前到门"这种不带条件的绝对承诺,你在验货现场面对那 120 顶错线帽时,就不敢判拒了。**你会因为怕误交期而放行,而放行的后果是 Mike 收到一批麦穗发橙的帽子。一句合同措辞,保住了一批货的品质——这是本书里最不像"技术"、却最技术的一件事。

**最后,回答今晚那个问题:这一单,哪些能复制?**

不能复制的只有开头:那顶洗白的旧棉帽、那个周六上午、那个正好在想做周边的人。**运气全部集中在第一封邮件到达之前。**

从第一封邮件到达的那一刻起,后面 38 封信里的每一步都是可以拆下来重复使用的:五特征打分 → 三个反问筛真假 → 带默认建议的七个问题 → 主推一个 + 备选三个的方案 → 八要素报价单 → 倒推时间线 → 三方案应对砍价 → 让步必换条件 → 十三栏 PI → 背靠背核对。**十个动作,一个流程。**

你在文档最后一行敲下一句话,关了电脑:

> 这一单我赢在了运气上一次,赢在了流程上十次。下一单没有运气,就把流程跑十一次。

至于运气本身能不能被制造——**能,那叫获客**,是第20章到第23章的事。

**工具三:询盘分诊卡**——五特征各 1 分(具体数量 / 有预算 / 有用途场景 / 有时间点 / 有决策权):**≥3 分**当天回问题、48 小时出方案;**2 分**给区间价 + 三个反问;**0–1 分**模板回。**三个反问**:①用途是什么、什么时候要?②运费走到付,账号给一下?(无账号则垫付冲抵)③完整公司名地址,出 PI 要用。**五条红线**:运费不肯出不寄样;不给规格不出报价单;退款到第三方账号一律拒绝;邮件通知改账号一律电话核对;域名与抬头对不上先查再谈。

**工具四:让步次序卡**——从先给到后给:**①信息与关注(白给)→ ②交期弹性与付款便利 → ③赠品/样品费/运费 → ④服务打包 → ⑤单价(最后,且必换条件)**。死守四项:核心配置、定金存在、品质标准与验货权、知识产权。幅度递减:**5% → 2% → 0.5%**。唯一句式:**"我可以……如果你……"**。听到"太贵了",只用两种反问:"贵多少?跟谁比?" / "我们看看是哪一项撑高了成本?"

**工具五:背靠背核对表**——给客户的 PI 与给工厂的采购单,六项逐行对齐才可付定金:①规格文字逐字相同 ②交货条件与地点 ③**同一起算点、同一出货日** ④付款节奏**先收后付** ⑤同一顶签封样、同一句品质标准 ⑥制版与知识产权归属。

> **本章作业**:找三封你能拿到的真实询盘——没有的话,就去 1688 或国际站上把**你自己**当卖家,给三个不同的商家发三封询盘,一封写成 5 分的(数量、预算、用途、时间点、决策权全给),一封写成 2 分的,一封写成 0 分的("请发报价单和目录"),然后**观察他们分别怎么回你、回得多快、有没有问你问题**。你会亲眼看到本章讲的一切在别人身上上演:5 分那封会收到有人问你问题,0 分那封会收到一份 PDF 目录或者什么都收不到。
> 第二步,挑其中回复最好的那家,把它的报价按**八要素自检表**逐项打勾——数一数它漏了几项(多数会漏交期起算点、有效期和数量允差)。
> 第三步,拿你自己的一个真实或假想产品,用工具一的模板做一份完整报价单 PDF、用工具二做一份完整 PI,**两份文件的规格文字必须逐字一致**。做完把它们并排打开检查一遍。这套动作做完,你手上就有了一整套可以复用一辈子的成交模板——而且你会发现,写出它们花的两个小时,比读完这一章更有用。

# 第16章 单证

**主线推进** —— 尾款到账的第二天早上(见14.1.2),货代小林在微信里甩过来一个压缩包和一句话:"这三份单子你填,明天中午前给我。"你解压,里面躺着三个文件:COMMERCIAL INVOICE.xlsx、PACKING LIST.xlsx,还有一份 PDF——《代理报关委托书》,你从没见过这东西。前两份你至少认得英文字面意思:发票、装箱单。你把三张表并排铺在屏幕上,发现同一批帽子被要求写三遍:品名写三遍、数量写三遍、唛头写三遍。第一反应是"重复劳动",第二反应才对:**这不是重复,是同一批货在不同人眼里的三个证明**。货现在躺在胶州的成品仓里,五个箱子摞成一垛,贴着你在第4章定过的箱唛(见4.6.3);从明天起,它要经过报关行、海关、货代、船公司、加拿大海关,最后落到Mike的仓库。这一路上没有一个人见过这批货,他们唯一能"看见"它的方式,就是这几张纸。货在海上走三十天,一套**纸上的货**必须同步走完,而且两套货的每一个数字都要严丝合缝地对上。接下来的两天,你要做的不只是填表:你还要向Mike讨一份你从没想过要的文件,你也会漏掉一件事——这件事会安安静静地等在一个月后的温哥华。

## 16.1 单证体系总览:哪张单在哪个环节给谁看

先把三张表推到一边,画一张更大的图。

你现在坐在旅馆桌前,面前是笔记本、一杯凉了的速溶咖啡,和货代发来的模板包。窗外是胶州傍晚的车流。你的货在两公里外的成品仓里,五个牛皮纸箱,总共六十多公斤,你伸手能摸到。但从明天上午货车开走的那一刻起,**你就再也摸不到它了**,直到三十天后它出现在温哥华一间啤酒厂的后门。在这三十天里,至少有七拨人要对这批货作出判断:中国海关决定它能不能出境、船公司决定它上哪条船、银行决定这笔外汇收得合不合规、加拿大海关决定它交多少税能不能放行、Mike决定这批货是不是他订的那批、保险公司(如果出事)决定赔不赔、还有你自己——一年后报税或者被人问起时,你得能翻出证据。

这七拨人,没有一个会去成品仓看一眼。**单证的本质,就是让不在场的人相信货的存在与属性。** 把这句话钉死,后面所有的填表动作都能自己推导出来:一个不在场的人凭什么相信?凭一张有人签字、有人盖章、能被追责的纸,纸上写着这批货是什么、多少、多重、多大、值多少钱、从哪来、到哪去。信息一旦上了纸并签了字,它就不再是"你说的",而是"你承诺的"。

先记住术语。**单证**,在外贸里特指围绕一票货产生的全部书面凭证的总称;行业里说"做单""出单""单证员"(见8.2.3),指的都是这件事。单证分**正本**(original,有签字盖章、法律效力最强的那一份)和**副本**(copy,扫描件或标注 COPY 的打印件);还有一个词叫**随附单据**,指报关时随报关单一起提交给海关的那几张。

这一票货要产生的单证,按环节排队,长这样:

```
工厂交货、五箱封箱贴唛
        │
        ├─→ 你出 CI(商业发票)+ PL(装箱单)  ← 全套单证的源头,所有数字从这两张长出去
        │
        ├─→ CI+PL+合同+报关委托书 → 报关行 → 中国海关(出口报关,见18.2.1)
        │                                        └→ 报关单 → 退税依据(见18.3)
        ├─→ CI+PL → 货代订舱 → 船公司 → 提单 B/L(海运)或运单 AWB(空运)
        │                                  └→ 提单副本 → Mike → 付尾款(见14.1.2)
        ├─→ CI+提单 → 银行(收汇申报与结汇,见14.1.1)
        │
        ├─→ CI+PL(+原产地证 CO) → 加拿大海关(进口清关,见18.4.1)
        │
        └─→ CI+PL+提单副本 → Mike 存档(入账、报税、日后追溯)
```

同一张CI要面对四拨人,同一张PL要面对三拨人。这就带出全章最重要的一条规矩,也是本章唯一一条"违反了必定出事"的规矩:

**单证一致性原则:所有单据上的数量、金额、品名、唛头、重量、件数,必须一字不差。**

行内把它拆成两句话:**单单一致**(各张单据之间互相对得上)和**单货一致**(单据与实际货物对得上)。第一句管的是纸与纸,第二句管的是纸与货。前者靠核对,后者靠称量。

为什么这么严?因为这些不在场的人是**互相交叉验证**的。加拿大海关手上有CI(你出的)、PL(你出的)、提单(船公司出的)、还有他们自己在码头点的箱数和过的磅。这四个来源里只要有一个对不上,你的货就从"绿灯放行"掉进"人工查验"。海关不需要证明你有问题,他只需要发现你"说不清"——说不清的代价是查验、开箱、延误和杂费,而且这一票的记录会跟着你的收货人走,下一票继续红灯。

给你一个具体的翻车。同行老张,去年发一票文具到鹿特丹,原计划8箱,装箱时车间临时多出一点尾数,现场并成了第9箱,箱唛也顺手打了9张贴上。装箱单没改——因为PL早在三天前就发给货代订舱了,他觉得"多一箱是好事,客户不会有意见"。船公司按PL出的提单,件数8箱。到港查验,码头点出9件,提单8件。结果:全票扣查、开箱核对、滞港五天,查验费加滞箱费合计约400欧元,客户的促销活动错过了。老张事后说了一句话,你可以直接抄进笔记本:"**多一箱和少一箱,在海关眼里是同一件事——你的单据和你的货不是一回事。**"

回到你自己这票。R&B这单要在所有纸上保持完全一致的数字,一共六个:

| 口径 | 数值 | 出现在哪些单据上 |
|---|---|---|
| 数量 | 500 PCS | CI、PL、报关单、提单、箱唛 |
| 件数 | 5 CTNS | CI、PL、报关单、提单、箱唛 |
| 净重 | 55.00 KGS | PL、报关单 |
| 毛重 | 62.50 KGS | PL、报关单、提单、箱唛 |
| 材积 | 0.48 CBM | PL、提单 |
| 金额 | CAD 4,870.00 | CI、报关单(折算后)、收汇 |

(这几个数字怎么来的,下面16.3 带你亲手算一遍;唛头内容见4.6.3。)

本节动作,两条,现在就写进你的工作习惯。第一,**一改全改**:任何一个数字变动——多一箱、少五顶、重了两公斤——立刻回头把已经发出去的每一份单据重发一遍,并且在微信/邮件里明确写"以此版为准,前一版作废"。改单在开船前是免费或几百块的事,开船后就是几百美元加时间。第二,**建一张"六数字核对卡"**:每次出单前,把上表这六行抄在一张纸上,拿着它逐份单据点过去,点一份画一个勾。这个动作花你三分钟,能挡掉外贸新人八成的单证事故。

## 16.2 CI商业发票

### 16.2.1 逐栏讲解与填好的样本

你把 COMMERCIAL INVOICE.xlsx 双击打开。是一张Excel,顶上一行大写加粗 COMMERCIAL INVOICE,下面十几个空格子,英文标签,一半你认识一半你不认识。你在第一个格子上停了两分钟——因为它叫 Exporter,而你还没有公司。

**CI(Commercial Invoice,商业发票)**,定义钉死:**卖方开给买方的、说明这批货是什么、有多少、按什么条件成交、总价多少的正式凭证**。注意它跟中国国内那张"增值税发票"不是一回事:国内发票是税务机关监制的票据,CI是卖方自己出的商业文件,自己排版、自己签字。但它有三重身份,每一重都咬着你的钱:

- **结算凭证**:Mike拿它入账付款,他的会计凭它做账。
- **报关计税依据**:两头海关都拿它上面的金额算税。
- **合规留痕**:你的收汇金额将来要和它对得上(见16.2.2)。

下面逐栏拆。每一栏我只说三件事:填什么、为什么、坑在哪。

**① Exporter / Shipper(出口方)。** 填卖方全称、地址、电话、邮箱。坑在你身上:你没有公司主体,填什么?主线的实情是——你填了自己的名字、地址、手机和邮箱,底下签自己的名。这在商业上完全成立:Mike的会计要的是一张能入账的、抬头清楚的invoice,他不关心你是公司还是个人。但你要清楚这是**过渡态**:没有公司抬头,你办不了原产地证(见16.6)、开不了自己的报关单、拿不到退税(见18.3)。这笔账在第25章一起算。

**② Consignee(收货人)。** 填Mike公司的完整法定名称、完整地址、联系人、电话。两个细节:第一,名称必须是营业执照上的全称(Ridge & Barrel Brewing Ltd.),不能用招牌名或缩写——提单、清关、放货全靠它对人;第二,加拿大进口商有一个 **BN号(Business Number,企业税号)**,写上去,Mike的会计才能凭这张发票抵扣进口环节的GST(详18.4.1)。主线里Mike收到你发的草稿后回了一句:"Add our BN on the invoice — our bookkeeper needs it for the GST credit." 这就是那句话的来历。

**③ Invoice No. 与 Date(发票号与日期)。** 发票号自己编,规则自己定,但一定要有规则。你定的是 `RB-CI-2026-001`:客户代号+单据类型+年份+流水,和那份PI的编号规则同源(见15.5.1)。为什么要有规则?因为一年后你要在几十票货里凭一个号找回全套单据。日期有硬约束:**发票日期不得晚于提单日**(货都上船了发票还没开,时间线自相矛盾),也不应早于合同/PI日期。

**④ S/C No. 或 P/I No.(合同号)。** 填你和Mike签的那份形式发票编号 RB-PI-2026-001(见15.5.1)。海关抽单时,这是"成交价格从哪来"的证明链条起点。

**⑤ Marks & Nos.(唛头与箱号)。** 抄箱唛(见4.6.3),一字不改,包括 C/NO. 1-5。

**⑥ Description of Goods(货描)。** **全场最重要的一栏,没有之一。** 新人最容易在这里写两个字母:CAP。这是不合格的。合格的货描要同时满足三个人的需求:海关要判税号(见18.1.1)、客户要核对是不是自己订的货、你要在出事时自证。所以货描 = **品名 + 材质成分 + 结构特征 + 客户款号**。

对照着看:

```
✗ 不合格:  CAP  /  HAT  /  PROMOTIONAL ITEMS
△ 勉强:    BASEBALL CAP
✓ 合格:    100% COTTON TWILL BASEBALL CAP, 6-PANEL,
           EMBROIDERED LOGO, ADJUSTABLE METAL BUCKLE
           BRAND: RIDGE & BARREL   ART NO.: RB-DH-001
```

请特别记住 **"100% COTTON"** 这五个字符。成分写进货描,成本是零,而它是目的国海关问"这是什么做的"时你手上唯一的即时答案(成分从哪来?从你在2.3.4定的洗水标上抄)。这一栏写全了,能替你省下的麻烦,第18章会让你刻骨铭心。

**⑦ HS Code。** 帽子归在第6505品目下,六位数 6505.00;具体到八位十位怎么定、归错什么后果,详18.1.1。CI上写六位即可,报关单上的完整税号由报关行确定。

**⑧ Quantity(数量与单位)。** 500 PCS。单位要和报关单的计量单位一致(帽子的法定计量单位是"个"/PCS),别一会儿写 PCS 一会儿写 SETS。

**⑨⑩ Unit Price / Amount / Currency(单价、总额、币种)。** CAD 9.90 × 500 = CAD 4,950.00。币种写全称代码 CAD,不要只写 $——美元、加元、澳元、港币都是 $,一个符号引发的争议每年都有。

这里有一笔你必须处理干净的尾巴:那40顶让步接受的帽子折让了 80 加元(见11.6.2、14.1.2),Mike实际付给你的是 1,485 + 3,385 = **4,870 加元**,不是 4,950。折让**不能不写**,也不该另开一张票——正确做法是在发票上单列一行 `LESS: AGREED ALLOWANCE ON 40 PCS  −80.00`,总额落到 CAD 4,870.00。为什么较真?因为下一节整节都在讲一件事:**发票上的钱必须等于账上进来的钱**。你自己给自己留一个80加元的缺口,就等于给外汇端的总量核查留了一个解释不清的口子。

**⑪ Trade Terms(贸易术语)。** 写 **DDP VANCOUVER**(见13.3.2),后面按惯例带上版本 Incoterms® 2020。这一栏不是装饰:它告诉海关这个价格里包含了什么。你报给Mike的9.9加元是**含运含税到门**的价,里面裹着国际运费和目的国税费;而加拿大海关计税用的完税价格要把这些扣出来(详18.4.1)。**同一批货的"成交价"和"完税价"口径不同,这是正当的价格构成差异,不是低报**——这个区别下一节讲透。

**⑫ Country of Origin(原产国)。** MADE IN CHINA。别嫌它显然,它是16.6整节的内容。

**⑬ Terms of Payment(付款条件)。** 抄PI:30% T/T deposit, 70% balance against copy of B/L(见14.1.2)。为什么发票上要写付款条件?因为发票是Mike的会计入账依据,他要知道这笔钱付没付、付了多少。

**⑭ Port of Loading / Destination。** QINGDAO, CHINA → VANCOUVER, CANADA。

**⑮ 签字。** 打印出来手签,盖章(有章盖章,没章手签),扫描成PDF。**没有签字的CI在海关眼里是草稿。**

填好的完整样本见本章"工具二",可以直接抄格式。

本节动作:**CI自查七问**,发出去前问自己一遍——① 卖方买方名称是不是法定全称?② 发票号唯一、日期在提单日之前?③ 货描含不含材质成分?④ 数量单位与件数和PL一致?⑤ 币种写全了吗?⑥ 贸易术语和PI一致吗?⑦ 签字了吗?七问过完再点发送。

### 16.2.2 货值申报:低报的诱惑与红线

CI草稿发过去的当天夜里,Mike回了封短邮件,语气还是他那个随和的样子:

> "Quick question — a friend who imports coffee gear told me if the invoice shows a lower value, I pay less duty at the border. Could you put 2,000 on it? Just asking."

他不是在教你作弊,他是真的不知道。**外贸里绝大多数低报请求,都是从客户这样一句轻飘飘的问话开始的。** 你怎么回,决定了这单生意的性质。

先算清楚他到底想省多少。货值 4,870 加元(发票总额4,950减去那80加元折让)。加拿大对纺织制帽按最惠国税率征关税(具体税号与税率详18.4.1),量级在十几个百分点,再叠加 5% 的 GST。取一个保守的合计 21% 来算:

```
如实申报:4,870 × 21% ≈ 1,020 加元
低报到2,000:2,000 × 21% ≈  420 加元
Mike 能省:               约 600 加元 ≈ ¥3,120
```

600 加元。为了这 600 加元,你要付出什么?四笔账,一笔比一笔重。

**第一笔,中国出口端。** 你申报 2,000 加元、实收 4,870 加元,这在法律上叫申报不实/伪报价格,属于走私行为的一种表现形式,不是"技巧"。行政层面是罚款,严重的没收货物;偷逃税款达到刑事门槛(实务上常说的量级是十万元,以现行司法解释为准)就不是罚款的事了。有人会说"帽子出口本来就没有出口关税,低报能偷谁的税?"——问题在于低报的是**出口货值**,牵动的是出口退税和外汇:你申报2,000却收了4,870,那多出来的2,870加元在外汇口径上是一笔无来源的收入。

**第二笔,外汇端,这是最容易被新人忽略、也是最先炸的一环。** 你的收汇金额和你的出口报关金额是**在同一个监测系统里对账的**。国家外汇管理局的货物贸易外汇监测做的就是总量核查:一段时间里你的收汇总额和出口报关总额如果长期对不上,差异率超过一定幅度(实务口径通常说两成),你会被约谈、被分类为重点监管对象,后续的收汇、结汇、退税全部变慢甚至受限。所以那句最有力的话术是这么来的:

> "申报价必须和你实际付给我的钱一致——**银行的收款数据和海关的报关数据是打通的**,对不上账,受影响的是我的收汇和退税,也是你在加拿大海关的查验记录。"

**第三笔,目的国端。** 加拿大海关有独立的**估价权**:他们如果认为申报价明显偏离市场,可以用同类货物的成交价重新估定完税价格。一顶带绣花的全棉棒球帽申报 4 加元,数据库里同类货物的价位一目了然。重估的结果是补税加罚金,更贵的是——**你的收货人会被打上标签**,Mike以后每一票进口货都要多过一道人工。他省了600加元,换来的是往后每票都延误三五天。

**第四笔,保险。** 货物保险的赔付上限就是申报货值。真出了全损,按 2,000 加元赔——那 2,870 的差额,是你自己吃还是Mike吃?这个问题一旦发生,这单生意和这个客户就一起没了。

那怎么回?不要只说"不行",**只说不行的人在客户眼里是麻烦制造者;给出替代方案的人才是专业顾问**(这套逻辑第24章会展开成一门生意)。你的回信是这么写的:

> "I can't do that — the declared value has to match what you actually pay me, because customs and banking data are linked on my side. But there are three legitimate ways to lower your landed cost, and I'll do all three for you:
> 1) Make sure we use the correct HS code — classification matters more than value.
> 2) Our price is DDP, which includes international freight. Freight and insurance are not part of the value for duty, so they come out before duty is calculated.
> 3) If you're GST-registered, the 5% GST is an input tax credit — you get it back. Put your BN on the invoice."

第三条其实才是Mike真正想要的东西:他以为要"省"的那 5% GST,作为注册商家本来就能抵扣回来。你花了十分钟查清楚这件事,替他解决了真问题,同时守住了红线。Mike回了三个字:"Fair enough."

**反向操作也是红线。** 有人高报货值,目的是多骗出口退税或者把资金弄出境——性质更重。记住一句判据:**任何让"纸上的钱"和"账上的钱"对不上的操作,都在红线以内还是以外,取决于差的那部分能不能解释;解释不了,就是红线以外。**

本节动作,三个:① 在你的报价单和PI模板里,加一句英文条款——"All customs declarations shall be made at the actual transaction value.";② 客户提出低报要求时,**永远用邮件回复,永远不在电话或微信语音里松口**——这封邮件是你将来的免责证据;③ 把上面那套"三条合法路径"的话术存成模板,以后每个客户都会问一次。低报的完整稽查后果,详18.5。

## 16.3 PL装箱单:逐栏+样本、毛净重材积

第二天上午九点,你站在成品仓的水泥地上。五个牛皮纸箱摞成一垛,箱唛朝外,C/NO. 1 到 5(见4.6.3)。小周前几天打印的那份车间装箱单就压在最上面那只箱子上——那是工厂内部用的,数字是从上一票单子的模板里带过来的,你现在要做的是出口用的正式PL,**每一个数字都得你自己拿到**。仓管从墙角拖来一台电子地磅,又递给你一把卷尺。你要做的事很土:**称一个,量一个,乘五。**

这就是 **PL(Packing List,装箱单)** 的全部秘密。定义:**说明这批货怎么装、装了几件、每件里装了什么、多重多大的单据**。它和CI的关系,一句话记住——**同一批货的两张脸:CI说钱,PL说物**。CI回答"值多少",PL回答"是多少、多重、多大"。船公司算运费看PL,码头点货看PL,海关查验看PL,Mike收货清点看PL。

先把三个重量术语钉死,顺序不能乱:

- **净重(N.W., Net Weight)**:货物本身的重量,**含单件销售包装**(比如每顶帽子外面那个单塑袋),**不含外箱**。
- **皮重(Tare Weight)**:外包装的重量——纸箱、胶带、内衬隔板、干燥剂。
- **毛重(G.W., Gross Weight)**:净重 + 皮重,也就是你把整箱抬上磅秤读出来的那个数。
- **材积(MEAS., Measurement)**:体积,单位 **CBM(Cubic Meter,立方米)**,长×宽×高,以**外箱外径**计,单位统一换算成米。

现在带着你把 R&B 这票的数算一遍。

**第一步,称一顶。** 你从箱里抽出三顶,连塑袋一起上电子秤:107g、112g、109g。取整,按 **110g/顶** 计——正好落在第4章给过的dad hat单顶重量区间里(105-115克,见4.6.2)。这个数合不合理?自己拆一遍:面料 0.17㎡ × 240g/㎡ ≈ 41g(见1.3.1的克重口径),檐芯PE硬片约20g,古铜滑扣套装约15g,前幅衬加泡棉约10g,汗带约8g,8800针绣花线约5g,织唛加洗水标约3g,缝线约3g,单塑袋约3g,合计约 108g。称出来107-112g,对得上。**能自己把一顶帽子的重量拆出来,你就不会被工厂随手沿用上一票的数字骗到。**

> 一个方向性的判断规则:净重宁可如实或略高,不可虚低。虚低的净重会在码头过磅时穿帮,而"实际重于申报"永远比"实际轻于申报"更招海关的眼。

**第二步,算每箱净重。** 100顶/箱(嵌套装法见4.6.2)× 110g = **11.00 kg/箱**。

**第三步,称一箱毛重。** 整箱上磅:12.5 kg。倒推皮重 = 12.5 − 11.0 = **1.5 kg**——纸箱本身(60×40×40cm 五层瓦楞,表面积约1.3㎡,五层板约800g/㎡)约1.3kg,加胶带、腰封和一包干燥剂约0.2kg,对得上。

**第四步,量一箱材积。** 卷尺量外径:60cm × 40cm × 40cm = 0.60 × 0.40 × 0.40 = **0.096 CBM/箱**。

**第五步,乘箱数。**

```
数量      500 PCS  ÷ 100 PCS/CTN = 5 CTNS
净重 N.W. 11.00 kg × 5 = 55.00 KGS
毛重 G.W. 12.50 kg × 5 = 62.50 KGS
材积 MEAS 0.096 CBM × 5 = 0.48 CBM   (60×40×40cm × 5)
```

这四行数字,就是本章从头到尾要保持一致的那几个口径。顺手再多算两笔,后面两章要用:

- **空运/快递的体积重**:60×40×40 ÷ 6000 = 16 kg/箱,五箱 80 kg,大于实际毛重62.5kg——所以帽子是典型的**抛货**,空运按80kg计费而不是62.5kg(计费重的完整算法见17.3.1)。这一笔差 17.5 kg,按空运价一公斤四十块算,就是七百块的差别。
- **海运拼箱的计费**:0.48 CBM,但拼箱普遍有最低消费,不足1个立方按1个立方起算(见17.2.1)。你这票"半个方"和"一个方"付一样的钱。

PL 的栏位,大部分和CI重复(抬头、收货人、发票号、唛头、货描),PL独有的是下半张表:

| 栏位 | R&B这票怎么填 | 注意 |
|---|---|---|
| Carton No. | 1-5 | 与箱唛 C/NO. 完全一致 |
| Description | 同CI货描,一字不改 | 含 100% COTTON |
| Qty per Carton | 100 PCS | 若有尾箱,单独列一行 |
| Total Qty | 500 PCS | 与CI一致 |
| N.W. | 11.00 / 55.00 KGS | 每箱/合计 |
| G.W. | 12.50 / 62.50 KGS | 每箱/合计 |
| MEAS. | 60×40×40 CM / 0.48 CBM | 每箱尺寸+合计材积 |
| Total Packages | 5 CTNS | 与CI、提单、箱唛一致 |

**若有尾箱,一定单独列行。** 比如520顶,就是"5箱×100 + 1箱×20",PL上写成两行,合计6箱520顶。把20顶那箱混在里面写"6箱520顶"是新人最爱犯的错——查验一开箱,数量对不上箱数,你就得现场解释。

一个真实质感的翻车,小到你根本不会防它。一位做家纺的同行,PL上 N.W. 和 G.W. 两栏填反了——把净重填进了毛重栏,少报了七公斤多。货代按错的重量订舱报价,货到仓库一过磅,专线按实际计费重补收差额,还收了一笔改单费。这票货多付了六百多块,金额不大,恶心在后面:提单上的毛重是按PL出的那个错数,而码头的实际过磅对不上,目的港系统自动比对不符,货被拉去查验,又是三天。他自己复盘的原话:"我以为填错一个格子最多是丢人,结果是丢时间。"

本节动作,四条:① **PL三步作业法**——称一箱、量一箱、乘箱数,数据自己拿到,不抄工厂发来的Excel(工厂的数常年沿用上一票的模板);② 称重必须在**封箱、贴唛之后**,因为胶带和唛头也是重量;③ 让工厂在装箱当天拍三张照片:整垛货带箱唛的全景、一箱货上磅秤的读数特写、卷尺贴着箱子量尺寸的特写——**存进你的出货文件夹**,货一旦在目的港被质疑件数或重量,这三张照片是你唯一能立刻甩出去的证据;④ PL填完,拿16.1的六数字核对卡和CI对一遍再发。

## 16.4 提单B/L

### 16.4.1 三位一体:收据、合同证明、物权凭证

下午三点,你给小林发了条微信:"我这票的提单什么时候给我?"他回得干脆:"专线没有提单,给你一个运单号,货到门。"你愣了两秒——PI上白纸黑字写着 `70% against copy of B/L`(见14.1.2),而那份本该拿去换尾款的提单副本,压根不存在。小林大概看惯了新人这种愣,顺手甩过来一张PDF:"这是我另一票整柜货的提单,你先看看它长什么样,以后你走拼箱、走整柜,天天要跟它打交道。"你点开,一张排版古板的表格,右上角一行灰色水印:ORIGINAL,表头写着 BILL OF LADING,底下密密麻麻的英文小字占了半页。这一节讲的就是这张纸——**你这一单用不上它,但你必须懂它,因为整个外贸的收款安全都建在它的性质上**(你这单为什么用不上、又拿什么替代,16.4.2结尾和14.1.2给了答案)。

**B/L(Bill of Lading,提单)**,定义:**承运人(船公司或货代)签发的、证明已收到货物并承诺按约定运至目的地交付的单据**。它是外贸单证里唯一一份"既是证据、又是合同、还是财产"的纸,行内管这个叫**三位一体**。三重身份逐条讲透,第三重是重头。

**第一重:货物收据。** 它证明承运人在某年某月某日、在某个港口,从托运人手里收到了多少件、多重、多大的货——换成你这票的口径就是 5 件、毛重 62.5 公斤、材积 0.48 立方。两个专业细节要懂:

其一,**"已装船"和"备运"的区别**。提单上如果印着 SHIPPED ON BOARD 并带装船日期,叫已装船提单,证明货已经在船上;如果只写 RECEIVED FOR SHIPMENT,叫备运提单,只证明承运人收到了货,还没上船。差别在于——银行、客户和保险都认已装船提单,备运提单在信用证项下(见14.3)会被直接拒收。

其二,**清洁提单**。承运人收货时如果发现外包装有问题,会在提单上加批注,比如 "3 cartons wet stained"(3箱水渍)、"cartons crushed"(纸箱压瘪)。带这种批注的叫不清洁提单,它的含义是:**承运人当着你的面声明"货交给我的时候就已经这样了"**,后面出问题他不负责。所以你在16.3让工厂拍的那三张照片,和封箱质量,在这一刻兑现价值。

**第二重:运输合同的证明。** 提单背面那几百行小字,就是你和承运人之间的运输合同条款——承运人的责任范围、免责事由、责任限额、争议管辖地。注意措辞是"证明"而非"合同本身":合同在你订舱、承运人接受的那一刻就成立了,提单是事后签发的书面证明。

责任限额这一条,必须带你算一遍,因为它决定了货丢了你能拿回多少。国际海运普遍适用的赔偿限额规则是:**每件 666.67 SDR,或每公斤 2 SDR,两者取高**(SDR是特别提款权,一种记账单位,近似 1 SDR ≈ 1.35 美元,随行就市)。套进你这票:

```
按件算:5 件 × 666.67 SDR = 3,333 SDR ≈ 4,500 美元
按重算:62.5 kg × 2 SDR  =   125 SDR ≈   169 美元
取高    → 3,333 SDR ≈ 4,500 美元
你的货值:CAD 4,870 ≈ 3,566 美元  <  4,500 美元
```

结论:**理论上全损可以赔足。** 但这个"理论上"含三个陷阱:一是你得证明是承运人的责任;二是走拼箱或专线时,你手里拿的是货代出的提单(HBL),索赔要沿着货代→船公司往上追,链条长、耗时以月计;三是很多损失(比如延误导致Mike错过周年活动)根本不在赔偿范围内。所以真正的解法不是指望赔偿限额,是**买货运险**(见17.7)——保费千分之几,而上面这一整套算术你可以省掉。

**第三重:物权凭证(Document of Title)——把这一条讲透,它是你收款安全的法理地基。**

**提单在谁手里,货就是谁的。** 承运人在目的港放货,**认单不认人**:谁拿着正本提单来换提货单(D/O),承运人就把货交给谁。哪怕来的人不是收货人本人,只要提单背书转让链条完整,承运人照放不误;反过来,哪怕来的人就是提单上写明的收货人,拿不出正本,承运人也不放。

正因为这个特性,提单成了一张**可以转让的"货物钥匙"**。收货人栏怎么填,决定了这把钥匙归谁:

- **记名提单**:Consignee 栏直接写 "RIDGE & BARREL BREWING LTD."。钥匙已经交到Mike手上,只有他能提货,不可转让给别人。
- **指示提单**:Consignee 栏写 "TO ORDER" 或 "TO ORDER OF SHIPPER"。这把钥匙暂时握在你(托运人)手里,你要在提单背面签字(叫**背书**,endorsement)才能把货权转给下一个人。空白背书(只签名不写受让人)之后,提单等于不记名的钥匙,谁拿着谁提货——这也是它在信用证和转卖贸易里流通的原理。

现在,把第14章那条你当时只是照做的条款拿回来看:**"70%尾款,见提单副本支付"**(见14.1.2)。它为什么安全?就在这里:

```
你发给 Mike 的是【副本】—— 一张扫描件、一张照片
     Mike 看到:货真的上船了、船名航次真实、收货人写的是他
     Mike 拿不到:货
【正本】还在你手里 —— 钱不到,钥匙不给
     尾款到账 → 你寄正本 / 办电放 → 钥匙交出去
```

一句话总结:**提单副本是"给你看的照片",正本才是"钥匙"。** 整个国际贸易的钱货分离难题(见13.1.1),在海运这一环靠这张纸解决了一半。

最后是提单草单怎么核。小林在电话里补了一句,是说给你以后听的:"哪天你走拼箱、走整柜,货代会先发一份草单给你确认。Consignee 那栏有两种写法,选哪个不看交情,看你钱收了没——收齐了就写客户公司全称,省事;没收齐就写 TO ORDER OF SHIPPER,货权攥在你自己手上。" 这就是决策规则本身,抄下来:**款收齐→记名提单;款没收齐→指示提单。** 你这一单在交仓前已经收到全款(见14.1.2),真要出提单的话,写记名。

本节动作:**草单核对六栏**——① Shipper(你)② Consignee(Mike公司全称+地址,或TO ORDER)③ Notify Party(通知方,通常同收货人或目的港代理)④ 货描(与CI/PL一字不差)⑤ 件数/毛重/材积(5 CTNS / 62.50 KGS / 0.48 CBM)⑥ 唛头。**24小时内回复**,开船前改单一般免费或几百块,**开船后改单费用量级是 50-100 美元/票,已放行的还可能要重出提单**。核对时打印出来对着六数字核对卡逐格点,不要在手机上扫一眼回"OK"。

### 16.4.2 正本、电放、海运单:放货方式怎么选

草单确认完,小林又问了一句:"这票出正本还是电放?"

这句话看着是操作细节,实际上问的是:**你打算什么时候把货权交出去。** 三种放货方式,本质是三种交钥匙的时点。先上对照表,再逐条讲清风险和适用场景。

| 方式 | 承运人凭什么放货 | 单据怎么走 | 能不能转让 | 卖方风险 | 典型适用 |
|---|---|---|---|---|---|
| **正本提单** | 凭正本换D/O | 快递正本给买家(3-5天) | 可背书转让 | 最低 | 新客户、大额、款未收齐 |
| **电放** | 凭收货人身份 | 无需寄单,一封电放通知 | 不可转让 | 高(不可撤销) | 老客户、款已收齐、近洋急货 |
| **海运单SWB** | 凭收货人身份 | 从一开始就不出物权凭证 | 不可转让 | 高 | 关联方、总分公司、100%预付 |

**正本提单。** 船公司通常签发一套三份正本(加若干副本),三份任意一份被用于提货,其余自动失效。流程是:你收到全套正本 → 用国际快递寄给Mike(温哥华三到五天,首0.5公斤 ¥150-250,见10.4.2)→ Mike凭正本去船公司目的港代理换提货单。它最安全,因为在寄出之前,货权百分之百在你手上。代价是慢和有丢件风险,而且——**近洋航线的经典事故**:发日韩越,船三天就到了,快递单据还在路上,货到了没人能提,港口每天算滞港费。所以正本适合远洋长航程(比如你这票三十天的太平洋航线,寄单绰绰有余),不适合三五天的近洋。

**电放(telex release,也叫 surrendered B/L)。** 定义:**发货人把全套正本提单交回起运港的承运人(或干脆不打印正本,签一份电放保函),承运人以电子通知的方式指示目的港代理,凭收货人身份直接放货。** 好处一目了然:不用寄单、不怕丢单、货到就能提,费用 ¥100-200/票甚至免费。

但请把下面这句话背下来:**电放是不可撤销的。**

你一旦签了电放保函,那把钥匙就不存在了——货到港,Mike报个公司名、出示身份,货就拉走。你手上什么都没有,只剩一份运输合同。所以新人只需要记住一条默认规则,不需要记例外:

> **钱没到齐,不电放。**

带你算一次违反它的代价。假设你当初答应了"30%定金、70%到付"并且电放:敞口就是那笔尾款 **3,385 加元 ≈ ¥17,602**(见14.1.2)。而你这单辛苦两个多月的毛利是 ¥13,790(见第7章末台灯下那笔分账)。**一次电放失误,吃掉的不是这一单的利润,是这一单利润的1.28倍。** 你不但白干,还倒贴三千八。

一个具体的事故。做礼品的同行小林,合作两年的老客户,四月的单十八万人民币,客户来电话:"这批赶展会,先电放,货到我马上付。" 关系确实好,前面六单都很干脆。他电放了。客户提货后回邮件说"部分产品与样品有色差",要求折价三成。小林手上没有货、没有提单、没有第三方验货报告,只有一份电放保函和一堆聊天记录。最后谈到折价一成八收场,损失三万二。他后来的总结特别精准:"不是他变坏了,是**我把唯一能谈判的筹码提前送出去了**——手上有货的时候叫协商,手上没货的时候叫求人。"

**海运单(SWB,Sea Waybill)。** 它和电放的效果相似,但性质不同:电放是"有物权凭证但主动放弃",海运单是**从设计上就不是物权凭证**,记名收货人凭身份提货,天生不可转让。用在两种地方:关联公司之间(总公司发给海外分公司)、以及百分之百预付款的成熟客户。它的价值是省掉整套单据流转,缺点是你完全没有回旋余地。

三者怎么选?一棵三步决策树,直接抄进笔记本:

```
款收齐了吗?
├─ 没有 ──→ 出正本提单,写 TO ORDER OF SHIPPER,单据攥在自己手里
└─ 收齐了
    ├─ 老客户/关联方/长期合作 ──→ 海运单或电放(省时省钱)
    └─ 新客户 ──────────────→ 仍出正本(便宜的保险,养成习惯)
```

最后要拐回主线,因为你这票其实**三种都不是**。R&B这单走的是海派专线双清包税到门(见7.3.2,完整机制见17.4),这类模式下通常不出可流通的正本提单,货代给你的是一份货代提单或干脆只有一个运单号,货物在目的港由专线的清关代理统一操作、直送到门。也就是说——**在专线模式下,那把"钥匙"根本不在你手上。**

这句话值得停下来想三秒:你在14.1.2设计的"见提单副本付尾款",在整柜正本提单模式下是一道保险;在专线模式下,它更像一个**时点安排**而不是担保。所以你这单真正的风险控制点只有一个,而且你在14.1.2那封尾款邮件里已经把它写死了:**款到齐,才交仓。** 记住这条规则,它比提单知识本身更重要:

> **走专线/快递/空运,没有物权凭证可以攥,唯一的风控就是发货前收全款。**

## 16.5 空运单AWB:非物权凭证→先收款

单证做到第二天下午,你忽然想到一个"万一"。事故一的返工把交期推了五天(见第11章),Mike的周年活动定在九月中旬,海派28-32天,算下来还有十来天余量——但万一路上再出点什么呢?你在微信上问小林:"要是海运赶不及,空运来得及吗?贵多少?"

小林的报价来得很快:"你这票 0.48 方、62.5 公斤,空运不按你那个实重算,按体积重 80 公斤算(算法见17.3.1),到温哥华现在三十五到四十八一公斤,含燃油安检,落地**两千八到三千八**。时效5-8天。"

你在纸上一算就凉了:**海派全程 ¥1,400,合 ¥2.8/顶(见13.5);空运取中间数 ¥3,300,合 ¥6.6/顶。** 单顶物流成本贵 ¥3.8,吃掉你 ¥27.6/顶毛利的一成半——这也正是你在15.4.1跟Mike谈交期弹性时,心里那个"改空运要多掏两三千"的估数的来历。但这不是本节的重点。重点是小林接着补的那句:"真要空运,你可得先把钱收齐了——空运没提单。"

**AWB(Air Waybill,航空运单)**,定义:**承运人签发的、证明已收到货物并作为运输合同证明的航空运输单据**。它和B/L一比,少了最关键的一重身份:

> **AWB 不是物权凭证。**

这不是行业惯例,是印在单子上的:AWB正面明明白白写着 **NOT NEGOTIABLE**(不可转让)。为什么这样设计?**因为空运太快了,单据追不上货。** 海运三十天,你有充足的时间寄正本;空运五天,单据快递过去也要三天,还要清关——如果非要凭单放货,货到了单没到,机场天天算仓储费,整个航空货运体系会瘫掉。所以国际航协的体系从一开始就选了另一条路:**记名收货人凭身份提货。**

具体怎么走的?AWB一式三份正本:第1份给承运人存档,第2份**随货一起飞**(塞在货物的文件袋里),第3份交给托运人(你)。货落地,目的地代理发出**到货通知(Arrival Notice)**,AWB上写明的收货人带着公司证件、缴清费用,就能把货提走。**全程没有任何一个环节需要出示你手里那第3份。**

于是结论只有一个,而且没有例外:

> **空运走的那一刻,你就失去了对货物的控制权。所以空运必须先收全款。**

有人会说,我用货代分单不就能控货了吗?这里把两个概念分清:航空公司出给货代的叫**主运单(MAWB)**,货代再出给你的叫**分运单(HAWB)**。走货代分单时,MAWB上的收货人写的是货代的目的地代理,理论上代理可以"压着不放"。**但这依赖的是货代的操作与信誉,不是法律上的物权。** 出了纠纷,你能起诉的是货代违约,不是主张对货物的所有权——两者的追偿难度差着一个数量级。所以听到货代说"我可以帮你控货"时,把它当成一个善意的便利,**不要当成保险用**。(唯一真正有效的做法是把收货人做成银行,那是信用证项下的操作,见14.3;T/T散单没人这么干。)

一个翻车,数字给全。深圳做促销礼品的同行老陈,美国客户是一家活动执行公司,订单 12,000 美元的定制帆布袋和挂绳,收 30% 定金 3,600 美元,合同写明"尾款到货后三日内电汇"。客户的活动在展会前一周,海运肯定来不及,老陈自掏差价改空运,58 公斤的货计费重96公斤,运费一万一千多人民币,他咬牙认了——想着"服务到位客户会记着"。货5天到洛杉矶,客户凭到货通知提走,展会顺利办完。然后尾款 8,400 美元开始拖:第一个月说财务在走流程,第二个月说"有部分挂绳颜色和样品有差异,我们客户投诉了",要求折价。老陈手上有什么?一张AWB——一张只能证明"我把货交给了航空公司"的纸。最后收了 4,000 美元结案。

```
应收尾款  USD 8,400 × 7.1 = ¥59,640
实收      USD 4,000 × 7.1 = ¥28,400
净损失                     ¥31,240 (还没算他自掏的空运差价一万一)
```

老陈的三句教训,一句比一句值钱:"第一,**空运和海运不是同一种生意**,海运我还能扣着提单谈,空运我从交货那天起就在裸奔。第二,**急的是客户不是我**——他赶展会,凭什么让我承担全部风险?第三,当时只要我回一句'空运可以,款到起飞',这三万块就在我口袋里。"

本节动作,三条铁律加一个折中方案:

1. **空运/快递出货,款到齐才交货给承运人。** 这条写进PI:"For air shipment or express delivery, 100% of the payment shall be received before cargo handover."
2. **急单的成本由急的一方承担。** 客户要空运,差价客户出;客户不愿出差价,说明这个"急"没那么急。
3. **AWB 的收货人栏一旦填了客户,就等于把货送出去了。** 填之前问自己一句:钱在账上吗?
4. **折中方案(客户确实急、款确实没齐时用)**:把收货人做成你在目的国的合作清关行或第三方仓,货权名义上仍在你这边,客户付款后你再指示放行。成本几十到一两百美元,值这个钱。

## 16.6 原产地证:一般CO与优惠证书

单证清单快过完了,你想起一件事,在微信上问小林:"要不要办个原产地证?"

小林回得很快:"加拿大不需要,咱们走的是双清包税专线,那边我们代理包了,省一笔。"

你说"好"。这一节剩下的所有内容,都是为了让你在读到第18章的时候,能想起自己在这一刻回的这个"好"字——**它是你这两天里唯一做错的一件事**,而它的代价是三天的延误和一笔加拿大海关那头的杂费。现在把机制补上。

**原产地证(Certificate of Origin,简称 CO)**,定义:**由官方或授权机构签发的、证明货物原产于某一特定国家或地区的书面文件**。它证明的不是货好不好,是货**从哪来**——而"从哪来"直接决定目的国按哪一档税率征税。

原产地证分两大类,新人最容易混:

**第一类,一般原产地证(CO)。** 只证明产地,不带任何关税优惠属性。用途有四:目的国确认原产地以适用相应税率、银行结汇时的单据要求、目的国进口配额与统计、以及招标投标场合的资质证明。

**第二类,优惠性原产地证书。** 凭它可以在目的国享受自由贸易协定项下的**协定税率**,通常比最惠国税率低,不少是零。常见的有:**FORM E**(中国-东盟自贸协定)、**RCEP原产地证明书**(区域全面经济伙伴关系协定,覆盖东盟十国加日韩澳新)、以及中韩、中澳、中瑞、中智等双边协定项下的各类证书。它们的共同点是:**含金量高,但只在特定国家之间有效。**

现在回到加拿大。这里是本节的核心机制,请慢读:

**中国和加拿大之间没有自由贸易协定。** 所以不存在任何一种能让Mike少缴关税的优惠证书——小林说的"加拿大不需要",这半句是对的。但他漏掉的是加拿大关税体系的另一半:

```
加拿大对进口货物的税率档位(简化):
  ① 协定税率(CUSMA/CPTPP等)  → 中国货不适用
  ② MFN 最惠国税率            → 中国货正常适用,纺织制帽在十几个百分点量级
  ③ General Tariff 普通税率   → 量级 35%
              ↑
        证明不了原产地的货,落到这一档
```

**MFN 不是自动给的,是"你能证明你是谁"才给的。** 加拿大海关有权要求进口商提供原产地证明;提供不了,他有权按普通税率征税。这就是为什么"不需要优惠证书"和"不需要原产地证"完全是两回事——你不需要一张让你少缴税的证书,但你可能需要一张证明你有资格适用MFN的证书。

带你算这张纸值多少钱:

```
如实适用 MFN(按16%量级):4,870 × 16% ≈ 779 加元
落到普通税率 35%:        4,870 × 35% ≈ 1,705 加元
差额:                              926 加元 ≈ ¥4,815
一张一般原产地证的成本:            ¥100-200
```

**一张两百块的纸,保的是四千八的敞口。** 这个性价比不需要犹豫。

**原产地怎么判定?** 两条规则:一是**完全获得**(整个产品全部在一国获得,比如矿产、农产品);二是**实质性改变**——产品在某国经过加工,发生了税则归类改变,或者当地增值达到一定比例(常用门槛是40%)。你这批帽子:布是中国织的、中国染的,在胶州裁剪、绣花、车缝、后整、包装,**毫无疑问是中国原产**。哪怕布是进口的,裁剪车缝这道工序也足以构成实质性改变——从"面料"变成"帽子",税则归类从第52/55章跳到第65章,标准的实质性改变。

**去哪办、怎么办、多少钱?** 两个渠道:**中国国际贸易促进委员会(CCPIT,贸促会)** 和**海关**,两家都能签发一般原产地证,优惠性证书主要走海关。现在流程已经完全线上化:在"中国国际贸易单一窗口"或对应的原产地证书签证系统里提交申请,通过后**自助打印**,快的当天出证。费用量级:一般CO 每份约 ¥100-200(会员与非会员价不同),找货代或代理代办 ¥150-300,加急另计。相对于你 4,870 加元的货值,这是万分之几的成本。

**但这里有一道你当时跨不过去的坎——办证需要企业先备案。** 备案要营业执照、备案登记表、企业印章和签字人手签样本。**你没有公司。** 所以在那个下午,你实际上面对的是三个选项:① 请工厂以工厂名义办(工厂有进出口权和备案),代价是CO上的出口商写的是工厂全称,Mike会直接看到你的供应商是谁——这个信息暴露的后果,第25章会讲透;② 通过外贸代理或货代以代理抬头代办,加一两百块服务费;③ 注册自己的公司(第25章)。

你当时的心理活动很诚实:货代都说不用了,而且办不办都要多绕一圈,那就算了吧。这就是这一节要留给你的教训:**"要不要办证"这个问题,不该问货代,该问自己一个更准确的问题——"如果目的国海关开口要原产地文件,我三天之内能不能拿出来?"** 答案如果是"不能",那就办。

最后补一个救命知识,你在一个月后会用上它:**原产地证可以后补。** 货已经出运、甚至已经到港,仍然可以申请补办,但证书上会加注 **"ISSUED RETROSPECTIVELY"**(后发证书)字样,多数国家认可,但审核更严、耗时更长——**从申请到拿到手,现实里是三到五天**。记住这个时长,它和第18章那三天的延误是同一回事。

本节动作,**原产地证决策三问**:① 目的国和中国有没有自贸协定?有 → 一定办优惠证书(能省的关税远大于证费)。② 没有协定 → 目的国是否可能要求原产地证明才给最惠国待遇?加拿大、欧盟、部分中东与南美国家都可能要 → **办一般CO**。③ 走的是双清包税专线、货代说"不用"?→ **让他把这句话打在微信上**,然后你自己再判断一次:两百块 vs 三天延误加高税率,该选哪个不用算。

## 16.7 出口报关资料清单

现在打开那个你从没见过的第三份文件——《代理报关委托书》。它是本章最后一块拼图,也是通往第18章的门。

先把出口报关这一环要交的东西列全。逐条讲,每条都告诉你"谁出、干什么用、坑在哪":

**① 出口货物报关单。** 这是向海关申报的正式单据,不是你填,是报关行或货代在"单一窗口"系统里录入的。但你要知道:**报关单上每一个字段的数据源都是你提供的CI和PL。** 报关单还是你日后退税的凭证(见18.3),完整流程详18.2.1。

**② 商业发票 CI + ③ 装箱单 PL。** 见前面三节。海关看它们确认品名、数量、价格、重量。

**④ 购销合同或PI。** 你和Mike签的那份形式发票(见15.5)。海关抽单核查时,它是"这个成交价格从哪来"的源头证明。平时不一定交,被要求时必须拿得出。

**⑤ 代理报关委托书。** 定义钉死:**货物收发货人委托有报关资质的企业,以委托人名义办理报关手续的书面授权文件。** 现在主流是在"单一窗口"里签订电子委托协议,但纸质盖章扫描件在很多场合仍然要。两个坑:一是"逐票委托"和"长期委托"的勾选,长期委托省事,但意味着这家报关行可以持续以你的名义申报,换代理时记得终止;二是**责任条款**——报关行是按你提供的数据申报的,**数据错了,责任在委托人**。所以"我让报关行报的,不关我事"这句话,在海关面前一秒钟都站不住。

**⑥ 核注清单。** 你在货代和报关行嘴里会听到这个词,先别慌:**它属于加工贸易和保税监管业务的单证**(海关特殊监管区域、保税物流、加工贸易手册核销那一套),一般贸易出口用不到。你这票、以及你未来几年做的绝大多数单,都不需要它。知道它是什么、知道它不是给你用的,就够了。

**⑦ 检验检疫相关。** 帽子(第6505品目)一般不在出口法定检验目录内,常规不需要商检。但三种情况要留心:一是**材质特殊**——含动物毛、皮草、羽毛的帽子涉及动物检疫;二是**目的国要求**——某些国家要求装运前检验(PSI)或特定证书;三是**儿童产品**——出口北美的童帽涉及CPSIA等合规要求(详18.6)。判断规则:材质普通、成人款、发欧美,基本免检;有一条不满足就提前问报关行。

**⑧ 品牌授权书——这一票里最便宜、也最容易漏的一份文件。**

定义:**商标权利人出具的、授权指定的生产商或出口商生产、出口带有其商标的货物的书面文件**,英文常写作 Letter of Authorization 或 Trademark Authorization Letter。

为什么出口带logo的货必须备着它?机制在于中国有**知识产权海关保护备案**制度:商标权利人可以把自己的商标备案到海关总署,备案之后,海关在口岸会主动拦截疑似侵权的进出口货物。与此同时,**出口货物报关单上有一栏是"是否涉及知识产权"**,报关行会问你这批货带不带品牌、带谁的品牌。你出口500顶印着别人商标的帽子,如果拿不出授权文件,轻则被要求补充说明、延误通关,重则按侵权嫌疑扣货核查。

主线是这么走的。第二天上午你给Mike写了封邮件,标题 "Small paperwork request — trademark authorization"。Mike当天回:

> "Sure. But our trademark is registered in Canada, not in China. Does that still work?"

这个问题问得非常好,你为了回答它临时补了半小时的课。答案是:

**海关关心的不是你的商标在哪注册,而是"你有没有权利使用这个标"。** 授权链条要能自证:R&B 是商标权利人(附加拿大注册号)→ R&B 书面授权你/工厂为这批500顶帽子生产并出口。这条链完整,你就有交代。

至于"R&B的商标没在中国备案"这件事,它有两层含义,你必须两层都懂:

- **好消息**:没在中国海关备案,意味着海关不会主动把你的货拦下来做侵权核查,被查扣的概率低。
- **坏消息,而且是要命的那种**:**如果有人在中国抢注了 "RIDGE & BARREL" 或者一个近似的商标,并且做了海关知识产权备案,那么你这批货在青岛港就会被扣住**——而且被扣的时候,你连"我是被合法授权的"都很难三言两语说清,因为在中国境内,那个抢注人才是"权利人"。这不是危言耸听,这是很多外贸人真正被上过的一课。这条线,第25章会完整展开。

Mike当天下午发来一份PDF:R&B的抬头纸,写明商标名称与加拿大注册号、被授权方、授权范围(款式 RB-DH-001、数量500顶、用途出口至加拿大)、有效期、签字人姓名职务和日期。

**成本:零。耗时:一封邮件加一个下午。** 这是本章性价比最高的一份文件——一份不要钱的纸,挡的是整票货被扣在港口的风险。所以规则简单粗暴:**只要帽子上有客户的logo,就向客户要一份授权书,不要问要不要,直接说"这是出口流程需要的标准文件,模板我发你"。** 客户几乎不会拒绝,因为对他没有任何成本;而你一旦开口,他反而会觉得你专业。

**⑨ 自备的非官方材料。** 装箱过磅照片、卷尺量尺寸照片、整垛货带箱唛的照片(见16.3的动作)、封样照片(见10.6)。这些没有一份是海关要求的,但它们在任何一次"说不清"的场合里,是你最快能甩出去的证据。

第三天下午,你把 CI、PL、盖章签字的报关委托书扫描件、Mike的授权书PDF,还有Mike签回的那份 RB-PI-2026-001,一起打包压缩,文件名 `RB-2026-001-DOC-PACK.zip`,发给小林,又给自己邮箱抄送了一份。你在备忘录里打了一行字:"单证齐了。"

齐了吗?你少了一张纸,而且你把这套文件的**纸质版没有放进货里**——五个箱子封得严严实实,里面只有帽子。三十天后,在温哥华的一个海关查验场,有人会打开其中一箱,然后提出两个问题:这是什么做的?哪儿产的。(第18章见。)

本节动作:**建一个"出货文件袋",电子一份、纸质一份。** 电子版按 `客户-数量-DOC-日期` 命名归档;纸质版把 CI、PL、原产地证(如有)、成分说明各一份装进自封袋,**贴在1号箱内侧或随货文件袋里发走**。这个动作成本是五分钟和一个自封袋,它是三次事故里最便宜的一次预防。
