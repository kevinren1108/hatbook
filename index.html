# 第10章 打样的艺术

**主线推进** —— 车缝开线的第五天中午,午休铃一响,几百台平车同时安静下来,车间里只剩风扇的声音。你端着盒饭蹲在裁台边,小周抱着一个纸箱走过来:"样品架要腾地方,你这单的样品,给你收着。"你把箱子里的东西在裁台上一字排开:最左边是一顶市场上买来的藏青磨毛帽,颜色和细节其实都对不上;往右,一顶logo位置低了半厘米的样;再往右,吊牌上有两个签名的那顶;然后是一顶和此刻流水线上正在过检的大货一模一样的帽子;最右边,两块绣着金色麦穗的藏青布片(样带,见3.1.8)。一字排开,像个小型博物馆——每一件展品,都比前一件更接近今天线上的500顶。小周顺手拿起中间那顶:"这顶当时改了一版吧?"你点头,想起一个月前那来回折腾的十天——那十天没有一台机器为你转,却决定了现在每一台机器转出来的东西对不对。这一章把那十天拆开:五种样、一张打样需求单、行规、隔着太平洋的远程确认,以及封样两个字为什么值一整批货款。

## 10.1 样品体系

### 10.1.1 五种样各锁什么:现成样/开发样/确认样(封样)/产前样/船头样

小周把五件展品重新排了个顺序,说了句行内人才会说的话:"样品不是越多越好——**每一顶样,只负责锁一件事**。锁错了对象,打十轮也白打。"这句话就是样品体系的总纲。行业里的样,按出场顺序分五种,每种的目的、付钱方式、锁死的东西各不相同,逐个认。

**现成样**(stock sample,也叫现货样):供应商或市场上已经存在的成品,不为你做任何修改。它锁的是**方向**——手感、档次感、帽型气质这些文字说不清的东西;它明确不锁颜色、尺寸、辅料、logo,因为那是别人的帽子。钱:免费或成本价十来块,运费你出(运费的规矩10.4.2细说)。它的最大价值是**快**:零等待,当天就能寄。R&B的第一步走的就是它——D12你寄给Mike的那顶市场上买的藏青磨毛dad hat(见3.1.8末尾那次寄样),连同样带和布头一起,锁的是"摸起来厚实、戴旧了好看"这十个字的手感方向;八天后Mike回邮件"这个手感对了",方向从此不再是变量。**开发样**(development sample):工厂第一次照你的规格从头做一顶。它锁的是**结构与工艺可行性**——版型开不开得出来、六片跨缝绣行不行、这个弧度定不定得出来。行规允许开发样的辅料"就近替代":滑扣用库存里颜色接近的、织唛先用空白唛顶着——因为它验证的是"做法",不是"材料"。钱:样品费的主战场(见10.4.1)。**确认样**(approval sample):开发样修改到与规格表(见2.5.2)完全一致的那一顶;双方签字封存之后,它改名叫**封样**(sealed sample)——大货的实物仲裁标准,锁的是**一切**(封样管理整节展开,见10.6)。**产前样**(pre-production sample,行内叫**PP样**):大货面辅料到齐后、裁床开裁前,用**大货同缸布**(见1.3.2)加**大货批次辅料**做的样。很多新人以为它和确认样重复——不重复:确认样用的可能是打样那两米布和辅料库存件,产前样才是"今晚就要上裁床的这批料"的预演,它锁的是**大货材料没问题**。**船头样**(shipment sample):大货完工后从货堆里随机抽出的成品,出货前寄客户,锁的是**大货与封样一致的最后证明**——"船头"就是字面意思,货上船之前的最后一眼。

R&B这单实际走了四种:现成样(D12)→开发样→确认样→产前样。船头样没做——500顶小单、手感早在D12锁死、验货用远程照片方案(见10.5)顶上,而且海派临出货再等一轮国际快递,9月中旬的周年活动等不起。但什么单必须做船头样,你要有谱:新客户的首个大单(信任还没建立)、信用证单(单据条款里常明列shipment sample)、商超百货单(对方品控流程的硬性要求)。速查表如下:

| 样 | 锁什么 | 谁付钱 | R&B这单 |
|---|---|---|---|
| 现成样 | 方向:手感/档次/气质 | 免费或成本价,运费买方 | D12寄Mike,锁手感 |
| 开发样 | 结构与工艺可行性 | 样品费¥100-300(可返) | D30,提改一处 |
| 确认样(封样) | 一切,签字即仲裁标准 | 同上,常与开发样打包 | D33签封,一式两份 |
| 产前样 | 大货材料没问题 | 通常免费(算入大货) | D38确认 |
| 船头样 | 大货与封样一致 | 免费,运费买方 | 未做(小单+远程验货) |

本节动作:接单先画**样品路线图**——这单走哪几种样、每种几顶、各锁什么,写进打样需求单(10.2.1);别默认全套,每多走一轮样,交期就多吃一周。

### 10.1.2 样品阶段与风险转移:哪一步之后改动要加钱

回忆拨回D30。开发样的照片发到温哥华,Mike很满意,只提了一处:"logo能不能再往上一点?"你在电话里转给老纪,老纪答得干脆:"上移五毫米,开发样阶段,免费改。"你顺口多问了一句:"要是确认样签了字之后再改呢?"电话那头笑了:"那就得重新打样——**三百块起,一个星期**。签字之前你是客户,签字之后你是标准。"这句半开玩笑的话,是打样体系里最值钱的一条行规,值得整整一节讲透。

机制是一个逐级升高的台阶:**每往前走一步,已投入的沉没成本和已锁定的采购就多一层,改动的代价跟着上一层。**逐级算给你看。**现成样阶段**:改=动嘴,零成本——什么都还没为你投入,你说换个帽型,对方从货架上换一顶就是。**开发样阶段**:一轮修改免费是行规——改的是版型文件和做法,物料损失就是一顶帽子几十块,工厂把它当获客成本消化;但"免费一轮"四个字要记牢,反复横跳三四轮,再好脾气的版房(见6.3.1)也会开始收钱、开始把你的样往后排。**确认样签字之后**:改帽型、改结构=前一轮签字作废、版型重开、封样重立——重新打样费**¥300/轮起、工期+7天起**;哪怕只改线色这种"小事",也必须重出样带(见3.1.8)、重新封样,因为封样锁的是"一切",动一处就不再是原来那个标准。**产前样之后**:改动开始伤到料。布已买、辅料已按批开订——改颜色,60米布砸在手里,¥700说没就没;改调节扣,500套古铜滑扣作废¥600,而且金属件电镀按批走(见2.4.2),重订交期两周起。**大货上线之后**:改=返工(见10.7)或报废,损失以千计,还搭上交期和人心。

这个台阶的法理内核,你在1.4.3的lab dip签样时已经见过一次:**拍板权和责任是同一枚硬币**——每一次签字,被签的那一项的风险就从工厂转移到签字人身上。工厂照封样做出来的货,你说"我不喜欢"=你的问题;你没签过字的项出了偏差=工厂的问题。所以确认要慢、签字要疼:签之前多看一天不丢人,签之后想反悔才丢钱。这个逻辑对你的客户端同样成立,而且必须**提前写成条款**。一场事故说明代价:一位同行的客户在产前样确认后,微信甩来一句"帽围放大1厘米吧,上次那顶我爸戴着紧"。他觉得"就改个数字",没提加价照办——结果汗带全部重裁、定型模具换号、已裁的500片帽身报废三分之一,自吞两千多块还延了一周;客户至今不知道那句话值多少钱。**改动没有大小,只有阶段。**同一个"改1厘米",在开发样阶段是一句话,在产前样之后是一次小型事故。

本节动作:两句条款,一句对工厂、一句对客户,抄进你的单据模板——对工厂(打样需求单):"确认样双方签字后,任何改动须书面确认,重新打样费¥300/轮起、工期+7天起,由提出方承担";对客户(报价单/PI):"Changes after sample approval are subject to re-sampling cost and lead time extension."(样品确认后的改动,另计打样费与工期)。把台阶明码标价地摆出来,不是防客户,是防"没人知道这一步很贵"。

## 10.2 打样需求单

### 10.2.1 完整要素:从帽型到线色,一张不留白的单子

回忆再往前拨,D25深夜。询价刚收官(见9.8),工厂定了胶州这家,打样是第二天要发出去的第一件正事。你把桌面清空,摊开三样东西:规格表v1.1(见2.5.2)、面料需求卡(第1章工具)、绣花那套文件(.dst加色序表,见3.1.6)——然后开始拼一份此前没写过的文件:**打样需求单**。它的定义一句话:**规格表v1.1作主表,加上一页打样专属的附加信息**。还记得2.5.2那棵"主表+附件"的树吗——规格表是树干,面料需求卡是第一根枝;今晚你亲手长出第二根枝(第三根是辅料清单,见9.3.1)。规格表回答"帽子是什么",附加页回答"这次打样怎么打"——两个问题,一个都不能靠工厂猜。

附加页的完整要素,六项,逐项有主儿:**①样品路线图与数量**:走哪几种样(见10.1.1)、每种几顶——确认样必须写**2顶**,为什么是2,10.6揭晓;**②参照样清单**:随单寄出什么实物、各自"参照什么、不参照什么"(10.2.3整节讲这个命门);**③logo文件包**:AI源文件+.dst+色序表+线号书面(金黄428,见3.1.8)——四件套一件不缺(10.2.2细讲);**④费用与运费约定**:样品费多少、下单返不返、快递到付还是垫付(10.4两节的落点);**⑤回传与确认方式**:照片视频按什么清单拍(10.5.1)、寄到哪个地址、**谁有权确认什么**——对色授权(10.5.2)就挂在这一栏;**⑥期限**:开发样几个工作日、修改一轮几天、逾期怎么沟通。六项写完,这张单子才配得上"需求"两个字。

为什么必须"一张不留白"?2.5.2教过空栏审查法——"这栏空着,工厂会怎么做?答案永远是按最便宜的默认做"。在打样这个环节,留白的代价还要再加一层:**留白一项=多一轮往返**。打样的往返一轮就是2-3天加一次快递,来回三轮,交期无声无息吃掉一周多——而你连"工厂做错了"都说不出口,因为你根本没说过要什么。一场典型事故:同行的需求单上写了logo尺寸、写了工艺,唯独没写**定位基准**,工厂按老师傅目测居中,logo下缘距檐口缝线5.5厘米——他心里想的是4厘米,低半档的logo让整顶帽子"抬头纹"全无。样品重打,来回八天;他的客户要赶展会,大货最后改空运,多花六千运费。定位这种东西,必须写成**可测量的语句**:"logo下缘距前檐接缝4厘米,以前中缝为中线,左右对称"——一把软尺就能裁判的句子,才叫锁定;"绣在前面正中"不叫。

R&B的这一单是正面样本,数字摆出来:D25晚发出,主表v1.1加附加页共两页;D26老纪回邮件"确认按v1.1打样"(2.5.2的版本纪律,在打样处的第一次执行);D28绣花厂样带回传(见10.3),D30开发样照片到,只改一处,D33确认样签封——**两轮走完,八天收口**。快不是靠运气,也不是靠催,是那张单子上没有留给"猜"的地方:工厂每做一个决定,都能在纸上找到依据。本节动作:打样需求单完整模板在本章工具,R&B实例已填好,换掉参数就是你的;发出前做一遍空栏审查——逐栏自问"这栏空着工厂会怎么做",答不出"无所谓"三个字的栏,今晚就补上。

### 10.2.2 logo文件规范:矢量图、最小字高与"这个绣不出来"

版房师傅收到打样需求单,第一件事不是看帽子,是点开logo文件——文件格式对不对,直接决定这单打样是三天还是三个星期。这一节把文件的规矩讲清,免得你死在起跑线上。

机制先行:**矢量图与位图是两个物种**。矢量文件(AI、PDF、EPS)里存的不是图,是轮廓的数学描述——每条曲线的锚点和弧度;放大到一面墙,边缘照样锋利如刀。制版师(见3.1.6)拿到矢量图,是沿着确定的轮廓布针。位图(JPG、PNG、微信截图)存的是像素格子,放大即糊;制版师只能贴着一圈模糊的毛边"猜"轮廓——猜出来的版,圆不正、角不尖、字距忽宽忽窄,而且**猜错的责任说不清**:客户说"这不是我的logo",制版师说"你给的图就长这样"。所以行规是:**绣花打样,矢量文件是及格线**。字高红线随文件一起复查:最小字高5毫米(见3.1.6),打样阶段要**再查一遍**——别以为第3章过了关就一劳永逸,设计师后来微调过文件、客户临时换了标语的事,天天发生;版是按最终文件打的,红线要按最终文件量。

理想案例长什么样,R&B给你打了样。设计师发来的文件名是 RB-logo-embroidery-v2.ai——注意"for embroidery"这个后缀的含金量:这一版专为绣花而作,投影和渐变已删、麦芒加粗到1毫米(3.1.6那场谈判的成果)、字样标注8毫米、PMS 289C和7406C两个色号(见1.4.2)标在画板边上,还附了一版黑白线稿供制版比对。版房师傅看完只说了一句:"这文件省我半小时,也省你一轮样。"——设计文件的专业度,就是打样周期的第一块压舱石。

反面情况你迟早遇到:**客户只有一张微信截图**。三条路,按优先级走。第一,**要源文件**——话术直接给你:"你们当初做logo设计、印T恤、做招牌的那家,手里一定有AI或PDF,找他们要一份。"九成客户能要到,只是没人提醒过他。顺手教你一个三秒鉴别法:拿到所谓"矢量文件",放大到百分之四百看边缘——依然锋利的是真矢量;一放大就起马赛克毛边的,是把截图塞进PDF里冒充的"假矢量",行里天天见。第二,要不到就**重描**:淘宝找矢量描图,¥50-150,一天交件——但有一条铁律:**描完的矢量稿必须发回客户书面确认**。描图是再创作,弧度、字体、间距都可能与原稿微差;你不确认就发厂,等于把"猜"的责任从制版师手里接到了自己手里。第三,客户既没有源文件也不在乎细节("差不多就行"),那就把丑话写在纸上:"以截图为准,细节以工厂制版效果为准,由此产生的差异不作为索赔依据"——丑话说在前面的生意才走得远,这句免责不是推责,是把"差不多"三个字的边界画出来。

本节动作:把**发厂文件四件套**写成固定清单钉在需求单里——①AI源文件(或确认过的重描稿);②.dst针迹文件;③色序表(第几号针杆配什么线,见3.1.6);④线号书面(线厂+线号,样带条款见3.1.8)。四件齐了,"文件对了、颜色错了"这个3.1.6埋过的口子就焊上了一半——另一半在验货桌上,第11章见。

### 10.2.3 参照样:一顶旧帽子胜过一页文字

打样需求单发出之前,你做了一件表格之外的事:又去成品档口把那顶现成样的同款买了一顶,寄给工厂。为什么规格表都写到15栏了,还要寄一顶别人家的帽子?答案要从你自己头上那顶说起——市集那天让Mike停下脚步的那顶洗白旧棉帽(见0.4)。整单生意的源头不是邮件,是Mike指着它说的那句"就要这种感觉"。它其实就是这单最早的**参照样**:随需求文件一起交给对方的实物,用来传达文字与数字锁不住的东西。

机制在"数字量"与"模拟量"的分界上。规格表锁得住一切可量化的参数:帽围58、檐长7、檐面线6行、克重240——软尺和秤能裁判的,纸面就能锁死。但一顶帽子里还有一批**量不出来的属性**:手感的软硬糯脆、前幅那一点"塌"与"挺"之间的弧度、磨毛绒面的深浅、旧化的味道。这些东西你写三段形容词,工厂读出来还是两可;一顶帽子递过去,双手一摸,十秒钟达成的共识比三页纸牢固。**手感的最终仲裁,从来不是文字,是实物**——D12寄给Mike的现成样干的就是这件事,把"厚实"从形容词变成一顶攥得住的帽子;现在你寄工厂的这顶,让胶州的版房和温哥华的Mike摸着同一个标准干活。三地三顶:Mike手里一顶、工厂一顶、你桌上那顶元祖旧帽——一个"手感",三处对齐。

但参照样有一个足以翻车的命门:**它身上每一个属性都可能被"参照"**。你不划范围,工厂的逻辑很朴素——你寄来的就是你要的:它的颜色、它的尺寸、它的辅料,统统照抄。事故给你看一单:同行拿客户的一顶旧帽子当参照寄厂,只说了句"照这个感觉做",工厂连汗带宽度带那顶旧帽上的塑料排扣一起抄了——而他的规格表上明明写着金属滑扣。他质问工厂,对方理直气壮:"你寄的样上就是排扣啊。"规格表一个标准、参照样一个标准,两个标准打架,谁也说服不了谁——这是2.5.2"三版对不上"的实物翻版:**两个标准并存的地方,一定长得出纠纷**。重做样,来回十天,谁的责任都算不清。

防御动作三条,全部落在一张吊牌上。第一,凡参照样,挂牌写明**参照范围**,R&B那顶的原文照录:"参照:帽身手感、磨毛绒面、前幅弧度与软硬;**不参照**:颜色(按v1.1之PMS 289C)、尺寸(按v1.1三围)、辅料与标类(按v1.1)。"第二,加一句仲裁序位:"**参照样与规格表冲突之处,以规格表为准**"——把两个标准变回一个。第三,写明归还:"样品完成后,参照样随样寄回"——尤其当参照样是客户的旧帽子时,那是人家的情感财产,丢了不是钱能赔的;寄出前给参照样拍一组照片存档,有借有还。做完这三条,一顶旧帽子才真正胜过一页文字——否则它只是多寄了一个纠纷源。最后把参照样的三个来源认全:客户的旧物(情感与手感的原点,必须归还)、市场买的现成品(几十块,最常用)、以及上一单的封样(见10.6)——翻单时拿它当参照样,是"和上一批一模一样"最省话的写法。

## 10.3 绣花打样:样带确认看什么

回忆里的D28,小周发来九张照片:邻镇绣花厂用你的.dst,在你随需求单寄去的布头上,试绣出了工厂版的样带。你可能会问:档口那块样带(见3.1.8)不是已经双候选定了"金黄428"吗,怎么又来一块?这正是3.1.8末尾按下的那句"它在打样体系里的正式位置见10.3"——现在兑现:**样带是绣花工序自己的确认样**;档口那块定的是**方案**(线号、配色、效果方向),工厂这块锁的是**执行**。换一台机器、换一家线厂、换一个师傅,同一个.dst跑出来的东西都会有微差——大货绣花厂必须用它自己的机器、它库存里的那轴线、在与大货同批的底布上绣给你看,这一块才有资格进封样袋,大货绣花以它为仲裁。

样带到手(或照片到手),看什么?六看,逐条给你"怎么看"和"不合格长什么样"。**一看密度盖底**:把填充区域正对光源,不许透出藏青底布——露底,要么密度不足、要么底针(见3.1.1)被偷了层;打样时就露底的,大货过一遍酵素洗(见3.3.3)只会更稀。**二看边缘利落**:包针的边应该像刀切过,出现锯齿、毛边、波浪,说明拉力补偿没做够(见3.1.6)或上绷绷松了(见4.3.2)。**三看字母闭口**:R、B、&、e、a 这些带孔洞的字符,孔要透亮、不糊死——"RIDGE & BARREL"8毫米字高,逐个字母看过去,小写字母的封口处是死穴,糊一个字,整行变毛毛虫。**四看线色对卡**:自然光下、C卡并排,比色四姿势(见1.4.2)走一遍;同时核对样带背书的线号——必须是**金黄428**(见3.1.8)三个字白纸黑字,不许"看着一样"。**五看拉扯回弹**:两拇指绷住绣区左右撑一撑,线迹要跟着布回弹,不裂缝隙、不松浮线;再看绣区四周的布面平不平——起皱是拉力过大的信号,平放着都皱,绷到头上会更难看。**六看背面浮线**:翻过来,色块之间的渡线要剪净、底线要整洁;背面凌乱的样带,预示着大货的剪线工时失控(见4.5.2),而帽子前幅背面是贴额头的,浮线多一根,客户戴一天痒一天。看完六条,顺手把针数核了:.dst里的数字对上样带(自查工具见3.1.9)——R&B这块数出来与8800针的定稿版对得严丝合缝。

R&B的确认过程,十分钟走完流程,留下三样东西:第四看那一步,你拍了"样带+C卡同框、自然光"的照片发Mike存档(凭的是什么授权,10.5.2讲);给小周回消息只有一句话:"样带确认,线号金黄428,请写进封样。"然后这块布片被钉在确认样的吊牌旁边,D33一起进了封样袋(见10.6)。本节动作:六看做成检查卡随身带,样带不过六看,开发样都不必往下做——绣花是这顶帽子最贵的一道工艺(¥4/顶,见3.1.5),它的关要设在最前面;条款一句抄走:"**大货绣花以双方确认之样带为准,样带随封样存档;更换线号、线厂或外发厂,须重出样带并书面确认**(见3.1.8)。"这句条款后来在这单里值多少钱,第11章的验货桌上有答案。

## 10.4 打样行规

### 10.4.1 样品费与周期:什么情况免、什么情况必收

回忆里还有一段对话值得存档。D24,询价收尾,你问老纪:"打样怎么收费?"老纪答:"你这单不收。"你没有见好就收,追了一句为什么——这一追,追出了打样行规的整套逻辑,比省下的几百块值钱得多。

先算工厂的账,你才懂"收费"收的是什么。打一顶开发样的真实成本:版房师傅(见8.3.2)半天到一天的工,工资摊下来¥100-200;单件材料要开小灶领料;绣花上机,为你一顶样换线、穿线、调机半小时——一顶样的硬成本¥80-150,还不算版房档期的机会成本。所以**样品费收的不是钱,是筛子**:市面上永远漂着一批"画图党"和"比价党",拿了你的样去压别家的价、或者纯粹收集样品,工厂每年为这类人烧掉的打样费以万计。样品费的行规设计因此很精妙:**¥100-300/顶,下单后返还(冲抵货款)**——真买家一分不亏,工厂不吃亏,白嫖党自动出局。三方博弈,一个数字解决。

免与收的分界,三条线。**第一条:订单意向的明确度**。带着完整规格表、数量、交期来的询价,工厂看得出你是真的——免;开口就是"先做个样我看看"、规格问一句答半句的——收,而且该收。老纪免你的费,免的不是人情,是你那份v1.1规格表和"500顶、9月前交"八个字。**第二条:规格复杂度**。要开模的(金属标模具、异形扣)、要定织定染面料的——必收且不返,因为模具费和起染量(见1.5.2)是真金白银沉进去的,你不下单它们变废铁。**第三条:关系深度**。翻单客户、年走量客户——免,打样费早摊在合作里了。你自己给客户打样时(见15.3),照这三条反着用即可。

周期的行规数字:**常规打样5-7个工作日**——拆开是版房排队1-2天、备料1-2天、做样1天、绣花外发1-2天;加急压到3天,要加急费¥100-200,还得版房肯给你插队(插队的人情账,见4.7.3的逻辑)。修改一轮,3-4天。R&B的实际走速:D25单出、D30开发样、D33确认样签封——八天两轮,比行规还快,快在**你的材料自备**:布头是随单寄的、版带是自己那¥200买断的(见3.1.6)——版权归己的那笔小钱,在这里第二次付利息。

对话样本,防的是糊涂账。工厂报"样品费800",别急着砍,先问构成:"含几顶?含制版费吗?下单返吗?"若答"两顶、含制版300、不返",真实样品费250/顶——偏高,但可谈成"下单全返";若对方连构成都答不上来,这800是随口要的,换厂。反向也有红旗:**样品费一分不收、国际运费也包的工厂**,别急着高兴——要么饿单饿得反常,要么样品线闲得反常,多问一句为什么,答案往往决定你敢不敢把500顶交给它。本节动作:一句话术抄走,下次打样原样用——"规格表和数量都给你了,样品费我照付,下单冲抵——你给我排最快的版房档期。"把钱付成催化剂,比把钱省成障碍高明得多。

### 10.4.2 寄样与到付账号:运费谁出的规矩

D33下午,确认样签封,其中一顶要飞温哥华。你在货代的小程序里填单,重量那栏跳出计费结果的瞬间,你对"寄样"两个字有了体感:一顶帽子,运费比帽子本身贵十倍。这一节把寄样的钱和规矩讲透。

先钉一个新术语:**到付账号**(freight collect account)——DHL、FedEx、UPS的月结账号。寄件人下单时不付钱,填上**收件方**的账号,运费直接记进对方的月度账单。外贸样品件的标准玩法就是它:供应商出样品,买家出运费,各自的钱各自付,谁也不欠谁。为什么"**运费你出**"是行规、而且是铁的行规?把10.4.1的筛子逻辑往前推一步:样品费几十上百块,工厂咬咬牙能免;国际快递一单一两百,工厂给十个"意向客户"寄样就是两千块——而其中八个永远不会下单。**运费是全行业公认的、最便宜的诚意过滤器**:连一两百运费都不肯出的买家,几乎不可能掏几万块货款。这条规矩双向适用——你对工厂:国内寄样顺丰到付,十几二十块,没有工厂会有意见;你的客户对你:同理,话术到15.3展开。

数字锚点,按R&B的路线算。DHL到温哥华,首0.5公斤,通过货代拿折扣价约**¥150-250**(直接走官网牌价,翻倍还多——所以先注册一个货代账号,这是本节最实惠的一个动作)。一顶帽子带内衬纸和纸盒,实重约300克,但盒子把体积撑起来了,快递按实重与体积重取大计费(体积重的数学见17.3.1),常落在0.5-1公斤档。所以有一条省钱小规矩:**能并箱就并箱**——两顶一箱寄,比分两次寄省将近一半。R&B这单的寄样总账:D12那一箱(现成样+样带+布头,约1公斤)¥280;D33确认样一顶¥220;加上国内几轮布头、版带、样品往返的快递和打样杂费——合计约**¥700**。这个数你不陌生:第7章末那晚台灯下的分账表里,"打样寄样"一栏写的就是它,摊到500顶=¥1.4/顶,早已长在9.9加元的报价里。**寄样的钱从来不该被"省掉",只该被"摊进"。**

那Mike怎么没走到付?因为他没有账号——到付账号是有稳定进口量的公司才会开的东西,精酿酒厂开它干什么。对小客户,行规要活用:**你垫付、摊入报价**,比教客户开账号顺滑十倍;真遇到有账号的大客户,不用你问,对方第一封邮件就会甩过来"our DHL account: xxxx"。反过来,有一种买家要警惕:样品要免费、运费也要你出、收件地址还是某个转运仓——三条凑齐,基本就是骗样画像(完整图鉴见15.1.2)。回复模板一句话:"样品费全免,运费到付或您预付都配合。"对方就此消失的话,恭喜,你用一句话省了¥250。本节动作:①注册货代快递账号,拿折扣价;②凡寄样,发货前拍一张"**面单+内件合影**"存档——箱子里到底装了什么、寄给了谁,争议时这张照片就是证据;③样品运费单独记账,月底看一眼总数,再按单摊进报价——它是成本,不是杂费。

## 10.5 远程确认

### 10.5.1 照片清单与视频动作:让工厂的手机替你跑腿

D30早上,小周发来开发样的第一组照片:九张,张张能用——正面是正面、尺寸有读数、内里翻得干干净净。同一天,同行群里有人在吐槽他的工厂:"要了三次照片,发来的全是废片。"点开一看你就笑了:昏黄库房灯下斜四十五度一张、开着美颜的自拍镜头一张、手指挡住半个帽檐一张。两家工厂的手机没有区别,区别在**你有没有把'拍什么、怎么拍'写成清单**——远程确认的本质,是用标准化拍摄替代你的眼睛和手;工厂的手机愿意替你跑腿,前提是你把腿该怎么迈写清楚。

先分清照片能验什么、不能验什么。照片验得动**数字量**:尺寸、檐面线行数、logo位置、标位——凡是尺子能裁判的,读数入镜就能远程锁定;视频补一部分**模拟量**:回弹、顺滑度、翻折;唯独**手感**,任何镜头都传不过去——所以样品路线图里现成样先行(见10.1.1),手感在D12就用实物锁死了,后续的远程确认只盯"变化项",这套组合拳才成立。指望一组照片从零确认一顶帽子的全部,是远程确认最常见的误用。

固定机位照片清单,八张,原文可抄:**①正面平视**(帽檐微微朝下对镜头,看logo位置与檐形);**②左侧**、**③右侧**(两张对照看对称性,单拍一侧等于没拍);**④背面**(扣具、后弧、缝线);**⑤内里俯拍**(汗带、缝份、沿条、标位一览,见2.2.2);**⑥尺寸照**:软尺贴汗带内圈绕量帽围、读数入镜(量法见2.5.1),直尺量檐长和"logo下缘距檐口"的定位数、读数入镜——**没有读数的尺寸照等于风景照**;**⑦细节微距**:绣花正面+背面各一张(对着10.3的六看);**⑧称重照**:整帽上电子秤、读数入镜——克重和用料的粗验,同款样前后两轮相差超过10克就要问。拍摄纪律三条,写给工厂:白纸或灰底、靠窗自然光、**同一机位**——尤其"同一机位":开发样、确认样、产前样、直到大货抽检,全按同一张清单同一个角度拍,前后并排才可比对(1.4.2灰底与自然光的道理,在这里从比色扩展到了比一切)。

视频三动作,各拍10秒:**①捏前幅**——拇指把前幅按下去、松开,看软顶的回弹和磨毛绒面的光泽变化,这是"摸"的最大程度的镜头替代;**②扣具开合**——古铜滑扣拉合三次,听顺滑、看收尾环处的走线(见2.4.2);**③内里翻拍**——把帽子整个翻过来,镜头绕一圈,毛边和浮线无处可藏。数字账:这套清单,工厂拍一遍10分钟;没有清单,一轮"补图—追问—再补"来回,轻松拖掉三天。而且清单还有一层隐形价值:D38产前样,照片是刚接手你订单的跟单员(见8.2.2)小周发来的——人换了,照片的角度、底色、读数一张不差,**清单让交接零损耗**。本节动作:清单卡在本章工具,直接作为附件钉进打样需求单,并加一句:"回传照片视频按附件清单执行,缺项视为未交样。"话硬一点没关系,这句话省下的每一轮往返都是2-3天。

### 10.5.2 对色的坑:屏幕、灯光、色温

1.4.3留过一句话:"远程确认颜色的完整做法,到10.5.2展开。"现在兑现。回忆里的D31,Mike的邮件一如既往地省事:"颜色拍照发我确认就行。"——如果你真的照办,这一单大概率要在颜色上翻一次车。你回了一封长邮件,把道理讲给他,然后请他签了一份东西。先讲道理,再看那份东西。

对色的三个坑,机制逐个拆。**坑一,屏幕**:1.4.2讲过,屏幕是发光体,色域、亮度、白平衡台台不同——同一张照片,十块屏十个颜色,Mike的手机和你的手机之间隔着两次失真(你的镜头一次、他的屏幕一次)。**坑二,灯光色温**:光源不同,照在布上的光谱成分就不同——4000K的冷白办公灯让藏青发黑发灰,3000K的暖黄吊灯能把金黄烧成橙色;1.4.2说过的同色异谱,在照片里会被镜头再放大一轮。**坑三,手机自动白平衡**:相机看到大面积深蓝,会自作聪明地"纠偏",把藏青拍浅、拍紫——最坑的是它每张纠得还不一样,你连"固定偏差"都拿不到。三个坑叠加,结论只有一个,也是1.4.2的老结论加强版:**照片传色,只能传方向,不能传"对不对版"**。

解法就是1.4.3预告过的那个折中:**书面授权代确认**。操作细节四步,这次给全。**第一步,授权邮件怎么写**——Mike签的那份,模板送你:"I authorize you to approve fabric and thread colors on my behalf, against Pantone 289C and 7406C (coated guide), evaluated under natural daylight. Photos are for record only. Valid for order RB-001."五个要素一个不缺:授权谁、对什么色号、用什么方法评判(C卡+自然光)、照片仅作存档、限定哪张订单——范围画得越窄,授权越有效。**第二步,你怎么确认**:实物与C卡同框、北窗自然光、按1.4.2的比色四姿势;镜头里再放**一张白纸**——白纸是天然的白平衡参照物,照片偏了多少色,看白纸变没变色,一眼可判。**第三步,留痕**:每次确认拍两张(带卡、不带卡)发Mike存档,邮件补一句"confirmed against 289C on [日期]"——授权代确认的"代"字,靠的就是每一次都可回溯。**第四步,认清边界**:授权盖住的是"**对不对卡**",盖不住"**喜不喜欢**"。颜色对了卡、客户看了成品说不喜欢——那是**选色**问题,不是**对色**问题;而选色的拍板早在更上游就该由客户完成:定制色在lab dip签样时(见1.4.3),现货色在布头确认时(见1.5.2)。R&B两头都干净:289C是Mike品牌手册自带的,布头按现货色流程确认过——争议空间为零。上游把选色关死,你的授权才敢接。

最后埋一根刺,请你记住它的形状。远程对色守得住"方向",守不住"**替换**"——照片里,一轴偏橙的金黄和金黄428几乎无法分辨,尤其当没有人告诉你"线换过了"的时候。前些天小周随手发来的那张麦穗近照,你不就看着挺正常(第6章绣花厂排队那几天的事)——"看着挺正常"五个字,正是替换最好的掩体。所以3.1.8的第三句条款(换线号须书面确认新样带)、10.3的样带封存,才是颜色真正的保险;照片只是保险柜外面那层玻璃。第11章,你会亲眼看到玻璃和保险柜的区别。本节动作:授权邮件模板抄进你的话术库;再给自己立一条口径纪律——凡颜色,回复只说"**对卡结果**"("自然光对289C,目视一致"),永远不说"我看着挺好"。前者是测量,后者是感想;测量能签字,感想只能背锅。

## 10.6 封样管理:签字留底的合同意义

回忆里最有仪式感的一幕在D33下午。视频接通,老纪那头桌上摆着两顶一模一样的确认样,你这头摊着规格表v1.1。逐栏核完,老纪把两顶帽子的吊牌凑到镜头前,签上名、写日期;你在你这边的打印件上签字回拍;随后其中一顶装袋封口,另一顶第二天进了DHL的纸箱。从这一刻起,这两顶帽子不再是"样品",它们改叫**封样**——签字封存的确认样(10.1.1点过名,这里把它讲透),这个身份将一直管到500顶大货验收完的那一天。

封样的形制,三件套。**其一,吊牌四要素**:签字+日期+订单号(RB-001)+**版本号(v1.1)**。前三项是常识,第四项是命门:封样是规格表的**实物版本**——2.5.2立过的版本纪律,在这里补上另一半:纸面v1.1说"应该是什么",封样v1.1证明"长什么样",两者必须**同版同步**。哪天规格升到v1.2而封样没重立,或者封样换了纸面没升版,2.5.2那场"三个标准各执一词"的事故就会原样重演,只是这次多了一个实物版本来搅局。**其二,封样袋**:透明自封袋,封口处贴纸质封条、双方签字**骑缝**——袋子几毛钱,骑缝签字让"事后调包"在物理上不可行;车间的规矩是隔袋比对,谁也不许把封样拆出来上手盘。**其三,一式两份**——10.2.1埋的那个"确认样必须2顶"在此回收:工厂那顶进车间,班组长和质检对着它做、照着它查;你那顶进存档箱,验货那天它是你的"原器",大货的好坏以它为仲裁(封样怎么在验货桌上执法,见11.2)。为什么必须两份?只有一顶时,封样在谁手里,谁就同时身兼"保管人"和"举证人"两个角色——对方永远可以质疑"你保管的样被你动过";两份互为镜像,谁也做不了手脚。工序级的封样一并归档:样带(10.3)、扣样(见2.4.2)、水洗封样(见3.3.3),统统袋装钉在主封样旁,一单一袋归齐。

现在讲清标题里"合同意义"四个字。买卖争议里最常见的四个字是"货不对样"——但这四个字要在谈判桌乃至法庭上成立,前提是"样"有一个**唯一的、双方确认过的、不可篡改的**定义。封样就是这个定义,它的法律地位约等于合同附件。没有封样:你说样品是软的,工厂说样品从来就这么硬,各执一词,举证等于零,最后比的是嗓门和耐心;有封样:开袋、并排、五分钟出结论。一场真事帮你记住细节:同行的工厂把封样当"参考帽"在车间传着看,三个月摸得发亮、檐都盘弯了;验货起争议,工厂举着这顶油光水滑的帽子说"当初就这样"——幸亏他自己那顶封样在办公室的袋子里安睡,两顶一对,当场赢下返工判定。若他当初只打了一顶样呢?这个问题的答案,就是"一式两份"四个字的全部分量。算一笔账收尾:两顶确认样加两个封样袋,成本不到¥300;它仲裁的对象,是货款的5%折让到100%拒收之间的任何数字。**全书性价比最高的保险,第1章是lab dip,本章就是封样。**

条款三句,抄进打样需求单和PI:"①确认样一式两份,双方签字封存,各执其一;②封样毁损、遗失,须24小时内书面通知对方并重立;③大货验收以封样及规格表v1.1为准,**两者冲突之处以规格表为准**,并须书面澄清后方可继续生产。"本节动作:今天建立你的**封样档案盒**——一单一盒:封样、样带、扣样、同缸布头(见1.3.2)、签字页照片;同步建电子档:每件实物拍照,与当日色卡同框(实物会褪色、会晒黄,照片配色卡才可追溯,见1.4.2)。档案盒不大,一个鞋盒足够——你未来某天从里面翻出证据的时候,会想请今天的自己喝一杯。

## 10.7 返工Top5及预防

午休快结束,你把样品逐顶收回纸箱,顺口问小周:"样都封了、锁都上了,大货还能出什么幺蛾子?"小周朝车间西头努努嘴——窗边一张长条台,摆着拆线刀、锥子和一个小烫台,台面磨得发白:"返工台。能出的幺蛾子多了,不过常年霸榜的,就那五样。"这一节把返工Top5摆开,每一条都倒推回打样阶段——**返工的每一种病,打样时都有一把便宜的锁;锁上不能保证贼不来,但能保证贼来了说得清是谁放进来的。**

**第一名:logo位置偏。**现象:高了、低了、歪了半厘米,单顶看不出、一排看全歪。根因:定位靠目测,或绷架定位磨损(上绷与定位的机制见4.3.2)。预防三道:需求单写**可测量定位语句**(10.2.1那句"logo下缘距前檐接缝4厘米、前中缝为中线");产前样复测同一个数;条款加一句"**大货首件确认**"——头三顶下机,先量定位再放行整批,这个动作花五分钟,拦的是几百顶的拆绣花。**第二名:颜色不对版。**现象:帽身色差、或绣线不是那个颜色。根因两路:布的缸差(见1.4.1)、线的**擅自替换**(见3.1.8)。预防:同缸条款+大货附缸号(1.4.1)、样带封存+换线书面确认(10.3)——并且认清10.5.2的结论:这一条,远程照片防不住,只有条款和封样防得住。**第三名:尺寸缩水。**现象:客户说帽围紧了,一量,小了1.5厘米。根因:洗前洗后口径没锁(1.1.1的老雷)、或定型收缩没算进去。预防:规格表尺寸栏写明"洗后+允差"(见2.5.1);带水洗工艺的单(R&B的轻酵素洗,见3.3.3),产前样**过一次水洗再复量三围**,并做水洗封样。**第四名:辅料错档。**现象:滑扣镀层色不对、檐芯发软、织唛字距走样。根因:辅料按批采购,大货批次与样品批次不同源(2.3.2讲过的回料檐芯、2.4.2讲过的电镀批次)。预防:辅料清单逐项锁定(见9.3.1)、扣样"同批电镀"条款(2.4.2)——以及,这正是**产前样存在的全部意义**(10.1.1):用大货辅料做一顶,错档在开裁前现形。**第五名:帽型不对。**现象:前幅塌、檐形不正,"照片里没问题,上头就不对"。根因:定型模具号不对或定型时间被省(定型的机制见4.5.1)。预防:参照样锁弧度(10.2.3)+封样随线比对(10.6)——弧度是模拟量,只有实物防得住实物。

| 返工榜 | 病灶 | 打样期的锁 | 出处 |
|---|---|---|---|
| ①logo位置偏 | 定位靠目测 | 可测量定位语句+产前样复测+首件确认 | 10.2.1 |
| ②颜色不对版 | 缸差/线被替换 | 同缸附缸号+样带封存+换线书面确认 | 1.4.1/10.3 |
| ③尺寸缩水 | 洗前后口径未锁 | 洗后尺寸+允差+产前样水洗复量 | 2.5.1/3.3.3 |
| ④辅料错档 | 批次不同源 | 辅料清单+同批电镀+产前样用大货辅料 | 9.3.1/10.1.1 |
| ⑤帽型不对 | 定型偷步 | 参照样锁弧度+封样随线比对 | 10.2.3/10.6 |

为什么这五条值得在打样章而不是验货章讲?算一笔返工账:拆一顶绣花、重定型、二次质检,单顶返工成本¥3-5起,超过车缝工缴的一半,还要搭上交期——**打样期的锁,成本以百元计;大货期的拆,成本以千元计**。这就是"打样的艺术"五个字的真正含义:艺术不在样打得多漂亮,在每一顶样都把一类未来的返工提前锁死。你对着表格数了数自己的单:定位语句、样带封存、洗后口径、扣样同批、参照样加封样——五把锁,一把不缺。小周把纸箱码到你脚边:"该锁的都锁了。"午休铃再响,几百台平车重新轰起来。你想起自己在10.5.2写下的那句话:照片守得住方向,守不住替换。锁了五道门的房子,贼有时候会试第六扇窗——上锁的意义从来不是保证事故不发生,而是保证事故发生那天,责任清楚、证据在手。这句话的分量,很快就会称给你看。本节动作:把上表右边一列抄成"**下单五锁**"检查卡,今后每一单,PI签订前逐条打钩——缺一把锁,就回打样阶段补,别带病进大货。

**工具一:打样需求单完整模板(R&B实例)**——主表+附加页结构(见2.5.2的"主表+附件"树)。主表直接引用规格表v1.1与面料需求卡,附加页十栏,下表即R&B订单的实际写法,换掉参数就是你的:

| 样品路线图 | 开发样1顶 → 确认样2顶(签字封存、一式两份)→ 产前样2顶;船头样:本单免 | 10.1.1 |

| 样品费 | 免(订单意向明确、版带与布头自备);如收:¥100-300/顶,下单冲抵 | 10.4.1 |

| 确认与封样 | 确认样吊牌:签字+日期+订单号+版本号;封样袋骑缝签字;签字后改动:重新打样¥300/轮起、工期+7天起,提出方承担 | 10.6 / 10.1.2 |
| 期限 | 开发样5个工作日内;修改一轮3个工作日;逾期当日书面说明原因 | 10.4.1 |

**工具二:远程确认拍摄清单卡(发工厂用)**——8照:①正面平视 ②左侧 ③右侧 ④背面 ⑤内里俯拍 ⑥尺寸照(帽围/檐长/logo定位,读数入镜)⑦绣花微距正+背 ⑧称重照(读数入镜);3视频(各10秒):①捏前幅回弹 ②扣具开合三次 ③内里翻拍绕一圈;纪律三条:白纸或灰底、靠窗自然光、每轮同一机位(见10.5.1)。

**工具三:下单五锁检查卡**——①可测量定位语句+首件确认;②同缸附缸号+样带封存+换线书面确认;③洗后尺寸允差+产前样水洗复量;④辅料清单+扣样同批电镀;⑤参照样锁弧度+封样随线比对(见10.7)。PI签订前逐条打钩,缺锁补锁。

> **本章作业**:两步,成本不超过一顿饭钱。第一步,拿你手边任意一顶帽子,按工具二的清单拍全套8照3视频,发给一位没见过这顶帽子的朋友,请他只凭照片写出一份规格表(帽型、尺寸、辅料、工艺,能写多细写多细);拿他写的和实物对——他写不出来或写错的每一项,就是"远程确认"的真实边界,也是你清单还要补的项。第二步,用工具一的模板,给这顶帽子写一份完整的打样需求单(参照样就写它自己),发给1688上一家帽厂询打样:记下对方要不要样品费、要多少、返不返、周期几天——再对照10.4.1的行规三条线,判断这家厂把你归进了哪一类询价。两步做完,"打样"对你就不再是等工厂寄东西,而是一套你说了算的流程。

*样品的小型博物馆已经装箱归档,五把锁也都上齐了。但样品说到底只是承诺——大货才是兑现。明天,车缝线上最后一批就要下线,500顶帽子将一顶不少地摆到你面前:抽多少、怎么查、什么算过、什么算不过,查出问题又拿什么说话?下一章,进验货房:[第11章 品质与验货](chapters/ch11.md)*

# 第11章 品质与验货

**主线推进** —— 七月末的一个清晨,后整车间的蒸汽味还没散透,第一箱成品刚刚封口下线——你的500顶,做完了。老崔路过,难得话多:"先装了一箱,你过过目。"你拿起文件袋往那摞崭新的纸箱走,袋里两样东西:签封的产前样(见10.1.1),和那块绣着两支金麦穗的样带(见3.1.8)。开箱,揭开单塑袋,第一顶帽子躺进手心:藏青磨毛斜纹泛着均匀的绒光,弯檐弧度正是规格表上那道7厘米,古铜滑扣压手——这帽子,很漂亮。你按一路养成的习惯,把样带贴上前幅,举向窗口的自然光。就在那一秒,胃沉了下去:**麦穗的黄,不对。**样带上的金黄428是带着麦芽糖暖意的金,帽子上的黄却往橙里偏了半档。再比一遍——不是错觉。日历上红笔圈着的出货日就是这两天;身后,是没开封的四箱半货。第3章结尾埋的那句话——"大货开机那天,如果这个线号恰好断了货"——此刻就躺在你手里。这一章,从这只开错颜色的箱子讲起:帽子会坏在哪里、坏到什么程度算不合格、五百顶怎么科学地查、查出来之后怎么办。

## 11.1 疵点图鉴

### 11.1.1 车缝类:跳线、驳线、缝歪、爆缝

发现麦穗那一刻,你的第一冲动是冲去找老崔。但你按住了自己:验货有验货的章法——单独一个问题是"一顶帽子的事",一场完整的验货才能回答"这批货的事"。你把那顶帽子单独搁开,让小周把包装先停了,搬一张裁剪台到窗边,摆开规格表、产前样、样带、软尺、克重仪:从现在起,这里是验货台。先立一个全章的地基术语:**疵点(defect)**——成品上任何偏离规格书、封样(见10.6)或正常工艺水准的缺陷。注意这个定义的三个参照物:规格书、封样、工艺常识,顺序也是判定时的优先级——书面的先于默认的。而帽子的疵点,九成落在三个族群里:车缝、绣花、外观部件。先从工作量最大的车缝说起——一顶dad hat身上,帽身六条竖缝、六条沿条包缝、帽围汗带一圈、檐面线六行、扣具车缝收尾,机缝线迹总长四米上下,500顶就是两公里的线迹,疵点就藏在这两公里里。

**跳线**。正常的平车线迹是面线和底线在布层中间交织成的连续锁扣;跳线是某几针没勾上——机针带着面线扎下去,旋梭没能勾住线环,那几针的面线就浮在布面上,像一段虚线。识别:顺着缝线对光看,连续针迹中断两三针,指甲一挑能挑起一小段浮线。成因排前三的:机针钝了或弯了、面线张力失调、以及帽子这个品类特有的——**厚度突变**:后中缝、汗带接口这些位置,斜纹布加沿条加汗带能叠到六八层,机针穿过厚区的瞬间线环变形,最容易勾空(这也是为什么这几处是你抽查的第一站)。判级的逻辑看部位:受力缝(帽围一圈、扣具固定处)上的跳线,洗两次就从那里开线,算严重;檐面线这类装饰线迹上偶发一两针,算轻微——"严重""轻微"两个词的正式定义在11.2.1,这里你先按直觉分堆。

**驳线**。车到一半断线或梭芯线用完,工人重新起针续缝,正规做法是回针三五针把新旧线头压住;驳线痕就是接头处线迹重叠加厚的一小段——或者更糟,不回针,两个线头翘着。它最扎眼的舞台是**檐面线**:六行线明晃晃排在帽檐正面,一个接头等于长在脸上,所以行规是驳线必须藏在帽檐两端插进帽身的位置,正面一整段不许接。你在第三顶上就抓到一个:右数第二行,正面偏左有个米粒大的线结。小周凑过来看了看:"这个不影响戴。"你说:"影响卖。"——这五个字的官司,留到11.2.1打。**缝歪**。线迹没走直、缝份吃布宽窄不一,表现为檐面线行距忽宽忽窄、后中缝上下错位、六片帽六条缝在顶扣下交汇的那个点错开。给你两个肉眼阈值:行距或对缝错位超过2毫米,一臂距离可见;前幅中缝歪则问题升级——R&B的logo是跨缝绣(见2.2.1),中缝歪半度,整支麦穗跟着斜。成因不复杂:计件工资(见4.4.3)之下,一条缝一分钟和一分半的差别就是钱,手快出歪线。**爆缝**。缝合处受拉后线断布开,帽子上最常发生在帽围缝。检法是主动施力:两手拇指插进帽围,撑到布面绷紧——大约成人戴帽的拉力再加半分——沿一圈听有没有"嘣"的线断声。成因:针距过大(拿软尺量3厘米数针数,10针上下正常,低于8针爆缝风险陡增)、缝线强度不够、缝份吃布太少。爆缝判级从严重起步;同一批里连着出,那不是单顶的事,是机器针距调错了,要按批查。

本节动作,把车缝检查收成四个动词,编进你手上的流程:**一看**(对光看主要缝线连续性,重点后中、汗带口)、**二拉**(受力缝轻拉听声)、**三翻**(翻内里看沿条毛边与线头)、**四数**(3厘米针距数针数对阈值)。一顶帽子四十秒,这就是车缝疵点的完整巡检。你带着小周把第一箱验完车缝项:一个正面驳线、两处轻微行距不匀——都是小账。真正的大账,在下一节等你。

### 11.1.2 绣花类:绣偏、露底布、断线痕、和一场正在发生的线色事故

现在,回到那团黄。但按图鉴的顺序,先把绣花类的三个常规成员认完——它们和你手里的事故共用同一个检查动作,一趟就能全查。**绣偏**:图案位置或角度偏离规格,根子在上绷与定位(见4.3.2)。检法是量,不是看:软尺量logo中心到檐口上沿、到前中缝的距离,对规格表,位置允差±3毫米;跨缝绣还要看两片拼合处图案接得齐不齐——中缝两侧的山脊线错开1毫米,一臂之外就是一道断崖。**露底布**:平绣区域覆盖不足,底布颜色从针脚缝隙里透出来,藏青底透进金黄麦穗里,像麦子没长熟。成因八成是制版密度被抽稀——8800针的版偷到7500针,千针单价一乘省¥0.6/顶(针数与密度的账见3.1.2,反算核针数见3.1.9),代价就是这一脸斑驳。检法:45度斜对光看绣花区,指腹顺针脚方向轻推——密度够的绣面推不动,稀的会露出底色沟。**断线痕**:绣花机断线自动停车,挡车工穿线续绣,正规操作要退回几针压线;续绣错位或线头没剪净,正面就留一个疙瘩或一根翘线。翻到背面看更清楚:底线走线乱、跳段,就是断线频发的痕迹——背面的整洁度,是绣花厂管理水平的指纹。

然后是第四种,教科书上排不进前三、这两天却要吃掉你全部精力的:**错线**——绣花线色不对版。上午你做的三件事,值得原样记下来,因为它就是错线疵点的标准处置开头。第一,不嚷。情绪没有证据力。第二,取证:把帽子拿到窗口自然光下,样带贴上前幅拍同框照;再取产前样三方并排——产前样上的麦穗与样带一致,大货帽与两者都不一致。**标准+实物+偏离,一张照片里齐了,这叫证据,别的都叫感受。**第三,才是打电话。小周赶过来,第一句:"不会吧?我给你发过近照的,你也说看着挺正常。"——一个多月前你回的那五个字,此刻原样飞了回来。你没接这一茬,只说:"你来窗口看一眼。"小周把三样东西看了十秒,没再说话,掏出手机拨绣花厂。

半小时后,事情的原貌拼出来了。大货绣到最后一个班,金黄428用完了——绣花厂旺季排队,排单比计划多吃了两天(见4.3.4),线的备量却是按刚好算的;等新线要一天,交期在头上,挡车工从线架上把颜色最近的金黄凑了十二轴顶上:八轴是偏橙的一种,四轴是另一家线厂偏得轻的一种,十二个机头(见3.1.4)装满,又绣了十轮才收工——一轮十二片,整整120片。没人上报,因为在车间的黄光LED灯下,三种金黄摆在一起才分得出,单独看,都是"金黄"。

这里必须把一个机制讲透,它是这颗雷能埋一个多月的全部原因:**为什么手机照片看不出线色差**。三重失真,层层叠加。第一重,**自动白平衡**:手机每按一次快门,都在猜"照亮这个场景的光是什么颜色",然后把整幅画面往它认为的"中性"方向校——车间的黄光灯会被它当成需要修正的偏色,一把拉回去;而金黄428和替代线的差别,本质上是色相往橙偏了几度、饱和度高了一线,恰好落在白平衡"自由裁量"的量级之内,校正黄光的那只手,顺便把线色的黄也"校"没了。第二重,**压缩**:微信传图默认压缩,而图像压缩的原理是"人眼对明暗敏感、对颜色迟钝",所以最先被扔掉的就是颜色细节。第三重,**屏幕**:每块屏的色温、色域各不相同——1.4.2那三块把navy显成三个蓝的屏幕,你早就领教过。三重滤镜之后,结论只有一句:**照片能证明"绣了",永远证明不了"绣对了颜色"**;颜色的远程确认只有两条路——实物寄到,或者标准参照物同框入镜(样带、色卡与货并排拍)。而当时那张近照里,一样参照物都没有。"看着挺正常"没有说谎,它只是回答了一个照片根本无法回答的问题。这不是你的错,也不全是小周的错——但它是一堂你俩各交了一半学费的课。

判级收尾:错线单顶看是严重疵点(正面、一眼可比、终端会退货);但它真正的身份是**系统性疵点**——同一原因、成批出现的疵点。系统性疵点不按"顶"论,按"批"处理:一旦确认成因是换线,你要问的就不再是"这顶怎么办",而是"换线之后绣的每一顶在哪"——这个问题的科学答法,是11.3的抽样与全检。本节动作,验绣花四步,配着三个常规疵点和一个事故一起记:**一贴**(样带贴绣花,自然光)、**二量**(logo位置对规格表)、**三照**(斜光找露底)、**四翻**(背面看底线与线头)。四步走完,一顶帽子的绣花再没有藏身处。

### 11.1.3 外观与部件类:色差、污渍、檐形不正、扣具失灵

错线的追查先按住——在决定怎么处理之前,你得先知道这批货还有没有别的窟窿,不能头痛医头。下午,你和小周把验货台上的检查扩到第三个族群:外观与部件。这一类疵点的特点是"不用懂工艺也看得见"——恰恰因为谁都看得见,它是终端客户投诉率最高的一类;也恰恰因为第2章你已经把帽子拆解过一遍,这一类你几乎全有工具:**第2章章末那套验货操六式,就是外观部件类疵点的完整巡检路线**——捏前幅、翻内里、查顶扣气眼、冻檐芯、搓汗带、抽量三围,六式今天全部上岗。

**色差**(定义与来源见1.4.1),验的是四层比对,一层都不能省。第一层,**片与片**:同一顶帽子的六片帽身加帽檐面布互相比——若有混缸,帽子自己会招供(1.4.1你记下的那个动作,今天正式归队);第二层,**顶与顶**:同一箱里抽的几顶并排;第三层,**箱与箱**:头箱和尾箱各抽一顶对看——裁剪若跨了缸(见4.2.5扎号防的就是这个),差异会按装箱顺序分布;第四层,**货与封样**:大货整体和签封的产前样比。四层全部在自然光下做,姿势按1.4.2的比色四姿势。R&B这批的藏青四层全过——同缸采购(见1.5.1)的红利此刻兑现。**污渍**分几路来头,处置完全不同:车缝机油(压脚滴油,黑色点状,多在缝线附近)、划粉印(裁剪定位的粉痕没除净)、熨烫水渍亮印、包装工的手汗印。检法:斜对光看正面反光面,深色布看"亮斑"、浅色布看"暗斑"。判级看两条:位置(正面还是内里)和可除性——后整的除污台(见4.5.3)能擦掉的是返工项,擦不掉的正面污渍是严重疵点。给你一个真实质感的反面案例:一位同行做300顶米白渔夫帽,裁剪划粉用了蓝粉,水洗没洗透,车间灯下看不见,客户在自然光下一看,前幅一道淡蓝弧线,300顶折价三成——¥1,300的学费,买"浅色货必须自然光验"一句话。

**檐形不正**有三种长法。其一,弯檐弧度左右不对称:把帽檐正对眼睛水平端平,两端翘度目测差超过5毫米即算;其二,檐芯折痕:运输或装箱压折后回弹不了——原生PE芯掰得动弹得回,回料芯一折一道死痕(2.3.2的冰箱测试,验大货时对可疑批抽两顶做);其三,檐插歪:帽檐中线与前幅中缝不垂直,logo正、帽檐斜,整顶帽子看着"表情不对"。**扣具失灵**是精品款的重灾区,R&B的古铜滑扣挨个过:开合十次,织带回拉看咬不咬得住(咬不住=滑扣冲压公差超了,判严重);电镀面找划痕和氧化斑——水洗做旧的货,行规是洗后装扣(3.3.3写给工厂的那句),没执行的话扣面全是洗水机磕的麻点;收尾环捏一捏有没有松脱。顺手把小件扫完:气眼孔口线圈有无脱线、顶扣转一圈看包布色差、汗带接缝是否在后中、织唛主标车得正不正——都是2.3的知识变成的检查动作。

节奏与数字:外观部件全项,熟手一顶45-60秒;加上车缝四查、绣花四步、抽量三围,一顶帽子完整过一遍2-3分钟——记住这个数,下一节算"要不要全检"的账时,它是基数。本节动作:给自己立一个**三光源习惯**——车间顶灯下初筛(效率),窗口自然光下定论(颜色与污渍),手机手电筒斜打补刀(绒面布的露底与划痕)。三种光各管一摊,只用一种光验货的人,永远有一类疵点看不见——今天这批货,就是被车间灯光和手机屏幕联手瞒了一个月的。

## 11.2 品质标准

### 11.2.1 疵点分级:致命/严重/轻微怎么判

傍晚,验货台上摆开了白天的收获:一顶正面驳线的、两顶行距不匀的、一顶檐面有淡淡机油点的,和那一摞谁都不愿多看一眼的错线帽。小周搓着手:"哪些算数?总不能有根线头就叫不合格吧。"——他问到了点子上。"不合格"不是一个开关,是一把有刻度的尺,这把尺行业里叫**疵点分级**:把疵点按后果分成三级,每级配不同的容忍度。三级的定义,一次钉死。

**致命疵点(critical)**:可能伤害使用者,或违反目的国法规的缺陷。帽子上的致命疵点清单很短但每条都要命:**断针残留**——车缝或绣花的机针断在帽子夹层里(正规厂成品要过**检针机**:一台带传送带的金属探测门,有断针就报警停带,出口订单的标配工序);金属件毛刺锐边;单塑袋上窒息警告语缺失(见4.6.1);成分、产地标错标漏(法规问题,18.6展开)。致命疵点的容忍度是**零**——抽样里出现一个,整批不合格,没有讨价还价。**严重疵点(major)**:明显影响外观或功能、会导致客户拒收或终端退货的缺陷——错线、明显色差、爆缝、绣偏出允差、露底布、扣具失灵、正面明显污渍、檐插歪。**轻微疵点(minor)**:偏离工艺标准但不影响使用、正常使用距离不易察觉的缺陷——线头未剪净(见4.5.2)、隐蔽处小驳线、行距轻微不匀、内里少量浮线。

定义好背,难的是现场判定——同一个疵点,判级会随位置和程度滑动:线头在内里是轻微,一根线头卡在麦穗正中就是严重;5毫米的油点在帽檐底面是轻微,在前幅正面就是严重。给你一套现场用的**三问法**,按顺序问,问到哪级算哪级:**一问,会不会伤人、犯不犯法?**是,致命。**二问,一个正常买家在货架前看到它,会不会把帽子放回去;收到货,会不会退?**会,严重。**三问,是不是只有验货员贴着看才找得到?**是,轻微。三问法的精髓在第二问的视角切换:你验货时是拿着放大镜的人,但判级要退回到一臂之外的买家眼睛里——**验货标准不是"完美",是"可售"**。

那灰色地带谁说了算?小周此刻就站在灰色地带里,指着错线帽:"这也是金色系啊,单看挺好看的,顶多算轻微吧?"注意他这句话的判定基准——"好不好看"。你把样带和产前样往帽子上一贴:"分级的基准不是好不好看,是**对不对版**。"这就是答案:**灰色地带的最高裁判,是封样**(签字封存的确认样,其合同意义见10.6)。与封样一致,是合格的起点;偏离封样的,按偏离的可见度和位置套三问法。错线这一项:偏离签字样带、长在正面C位、成批出现、Mike的顾客拿两顶不同的黄一并排就能看出来——第二问直接命中,严重,没有商量。小周不吭声了。判级从来不是审美之争,是文件之争;文件在谁手里,谁的判定才立得住——这个道理,11.6.1还要替你打一场硬仗。

三级配的容忍度,行业有一套通行数字,先记下,下一节展开:**致命0、严重2.5、轻微4.0**——后两个数叫AQL,是11.3的主角。本节动作两件:第一,把三级定义+帽子疵点对号表做成一张**疵点分级卡**(章末工具三已替你做好),验货时摆在台上,和工厂争议时指着卡说话,不凭嘴;第二,立一条现场规矩:**先拍照,后争论**——每一顶问题帽,疵点旁摆软尺或色卡拍照、编号、登记,当场让小周签个字。你今天登记的这一册,四十八小时后会变成谈判桌上的弹药。

### 11.2.2 把标准写进合同:验货条款的写法

夜里回到旅馆,你翻出自己那份PI,找到签约那晚多加的一段"Inspection(验货)"条款,逐句重读——一个多月前写下时像例行公事的几行字,此刻每个字都在替你干活。这一节把这段条款拆开讲透,因为**验货的一切权力都不是天赋的,是合同给的**:没写进合同,你连"验货不合格"这五个字都说不出口——工厂可以反问一句"按什么标准不合格?"你就哑了。1.3.1那条铁律第三次应验:没写进书面的参数,纠纷里等于不存在。验货条款的完整写法,四个要素,缺一个就漏风。

**要素一:标准与级别**——回答"按什么判"。条款写法:"成品按 ANSI/ASQ Z1.4(等效 GB/T 2828.1)一般检验水平II、单次抽样进行终验;AQL:致命疵点0、严重疵点2.5、轻微疵点4.0;工艺、颜色与外观以双方签字确认之封样、样带及规格表v1.1为准。"两个抓手缺一不可:**标准号**(Z1.4和GB/T 2828.1是同源的国际/国标抽样标准,写哪个都行,查表实操见11.3.2)管"怎么抽、抽多少、几个判死";**封样**管"长什么样才算对"。只写"质量合格、双方认可"之类的软话,等于没写——"合格"没有刻度,吵起来各说各话。**要素二:验货时点**——回答"什么时候验"。写法:"买方或其指定第三方有权在货物100%完工、至少80%装箱、发运之前实施终验;卖方须提前3个工作日书面通知完工时间。"三个时间锚各有机关:100%完工——半成品验货是白验,后整包装还会新增疵点;80%装箱——留两成敞着方便抽,也证明不是特意备好的"样品箱";**发运之前**——这四个字最值钱:货在厂里,理在你手里;货上了船,理就跟着上了船,你连围观的资格都没有。**要素三:费用承担**——写法:"首次验货费用由买方自理,卖方免费配合并提供场地与人手;若因质量不合格导致返工后复验,复验费用(含第三方验货费)由卖方承担。"复验费条款是这一段的牙齿:工厂对"返工还要过重验、重验的钱我出"极其敏感,它会倒逼车间第一遍就做对——比罚款条款管用,因为罚款是事后的痛,复验费是马上要掏的钱。**要素四:不合格处置**——写法:"终验不合格,卖方须于5个工作日内完成返工并接受复验;无法返工恢复的,按疵点分级协商换货或折价;**让步接受**(买方明知货物存在不合格项、书面同意按约定折让接收)须以买方书面确认为准;因返工产生的交期延误,按本PI交期条款处理。"这一条是明天谈判的剧本——返工、折价、让步接受三个词的实战用法,11.6.2整节展开。

一个没写条款的反面剧本,让你看看漏风的代价。一位同行的真事:600顶货完工当天,工厂"好心"直接送进了港区仓库——"帮你省两天仓储"。他要验货,得自己去港仓预约,开箱费自理;翻出两箱压变形的帽檐时,货已经报关,改单要交改单费、赶不上船期要空舱费——算下来验出问题反而更亏,含泪放行。整场被动,根子就是合同里没有"发运之前"四个字:工厂没有违约,只是替他做了一个他无权反对的决定。再给你一段签约时会遇到的对话。工厂:"我们出去的货都是验过的,这条就别写了吧,显得不信任。"你的回法:"写了对你也是保护——我验完签了字,货到那边再有外观争议,就与你无关了;不写,货到温哥华出任何问题都能倒回来找你。"这是实话:**验货报告是双向的闸——拦住不合格的货,也拦住事后翻旧账的客户**。多数工厂听完这句就签了。本节动作:把四要素条款原文抄进你的PI模板,标准号、AQL数字、封样版本号三处按单填空;从此你的每一单,验货的权力在货出厂之前就已经写好了。

## 11.3 AQL抽样

### 11.3.1 原理:为什么不全检、抽样凭什么服人

第二天一早,包装重新开动,中午前500顶全部完工装箱:五个纸箱,60×40×40厘米,每箱100顶,码在成品区像一堵矮墙。现在到了动真格的时刻——昨天你只看了第一箱的一部分,今天要对"这一批"下判决。第一个岔路口:**全检,还是抽检?**新手的直觉永远是全检——"都查一遍还能有错?"先把全检的账算给你看,三笔。第一笔,时间:按11.1.3的基数,完整验一顶2-3分钟,500顶就是1,000-1,500分钟,合17-25个小时——两个人查一整天,而你的出货日就在眼前;第二笔,破坏:每顶帽子已封单塑袋、按8顶一摞嵌套装箱,全检等于500次拆袋、揉皱、重新套袋装箱,包装工时另计,还添一道二次污染(手汗、桌灰)的风险——**检验本身是有损耗的**,这在开箱即卖的电商件上尤其真实;第三笔,也是最反直觉的一笔,**疲劳**:检验是纯注意力劳动,人的漏检率随连续工作时间陡升——问你自己一句:全检查到第四百顶的那双眼睛,和抽检第五十顶的那双眼睛,哪双更可靠?行业里做过的对比结论很扎心:状态好的抽检,比疲惫的全检抓出的问题更多。**全检不等于零漏网,它只是听起来安全。**

那抽检凭什么服人?凭统计,而统计可以讲成人话。一锅汤,尝一勺就知道咸淡——前提是先搅匀。"搅匀"对应的术语是**随机**:样本必须从整批中随机抽取,每一顶被抽中的机会均等,一勺才能代表一锅(这个前提值钱到什么程度,11.5的抽箱原则会给你看反面)。带着你算一遍抽样的威力:假设500顶里混了5%的不良——25顶,你随机抽50顶,一顶不良都抽不到的概率是0.95的50次方,约等于**7.7%**——也就是说,九成二的把握,坏帽子至少落网一顶;如果批的问题更大,不良率10%,漏网概率跌到0.9的50次方,约**0.5%**——问题越大越藏不住。抽样不是"少查点省事",是给整批货做的一次**统计体检**:它不承诺看见每一顶,它承诺的是"批有病,大概率查得出"。

体检得有判读标准,这就是 **AQL(Acceptable Quality Limit,可接受质量限)**:买卖双方事先约定的、抽样方案围绕它设计的"可容忍的过程平均不良水平"。这个定义绕,拆成人话分两层。第一层,先纠正一个害死人的误解:**AQL 2.5不是"允许2.5%的坏帽子"的通行证**——它不豁免任何一顶具体的不良品(单顶疵点照样按11.2.2的处置条款走),它只是抽样判定规则的设计参数:批的真实质量明显好于2.5%时,这套规则大概率放行;明显差于时,大概率拦下。第二层,为什么不设计成"零容忍"?因为抽样世界里没有免费的确定性:判定线卡得越死,把**好批误拦**的概率(行话叫生产方风险,标准设计约压在5%)就越高,工厂为对冲这个风险只会加价;判定线放得越松,**坏批误放**的概率(使用方风险,约10%)越高,吃亏的是你。AQL就是双方在这两头风险之间谈定的均衡点。所以不同货值配不同的数:中等价值消费品(帽子、T恤这一档)的行规是**严重2.5/轻微4.0**;高单价或品牌旗舰货收紧到1.0/2.5;促销赠品放宽到4.0/6.5——数字越小,尺越紧,验货成本和工厂报价越高。**AQL的本质,是把"质量"从形容词变成一个可以写进合同、可以算钱的数。**

本节动作,两句话刻进脑子,它们决定你后面每一单的验货姿势:第一句,**批合格≠只只合格**——所以合同里抽样条款(管批)和疵点处置条款(管单顶)必须同时存在,11.2.2的要素一和要素四,一个都不能省;第二句,**抽样的全部效力建立在随机上**——谁控制了"抽哪里",谁就控制了结论,所以箱号永远你来指定。明白了原理,下一节把表摆开,拿你自己的500顶,一格一格查给你看。

### 11.3.2 查表实操:500顶按AQL 2.5抽多少、判定数怎么读(主线算例)

你把打印好的两张表铺在纸箱堆上——字码表和主表,Z1.4标准的全部家当就这两张纸。小周和厂里的QC围过来。查表五步,现在拿R&B这批走一遍,你跟着指头走。**第一步,定批量N。**"批"的定义:同一订单、同一次交验的全部数量——今天码在这里的是500顶,N=500。**第二步,选检验水平。**检验水平定的是"样本量相对批量的大小档位",分两族:特殊检验水平S-1到S-4,样本极小,专用于费时、费钱或破坏性的项目(剪布称克重、烧毛验成分这类,一批剪三五顶就够);一般检验水平I、II、III,样本依次翻倍——**II是默认档**,没有特殊约定就用它;I是省力档,给历史清白的翻单;III是加严档,给出过事故的厂(这个词你记住,过完这两天它会变得很具体)。R&B首单,按II。**第三步,查字码表。**字码表是一张"批量段×检验水平"的对照表:批量281-500那一行,对到一般水平II那一列,交叉格里是字母 **H**——这个字母叫样本量字码,是进主表的门票。**第四步,进主表拿样本量。**主表最左列找到H,对应样本量 **50**——500顶抽50顶,十分之一。**第五步,沿H行找你的AQL列,读判定数。**AQL 2.5那一列写着"3,4",AQL 4.0那一列写着"5,6"——这两对数就是 **Ac/Re(Accept/Reject,接收数/拒收数)**:抽出的50顶里,严重疵点不良品**≤3顶,批接收;≥4顶,批拒收**;轻微疵点≤5收、≥6拒;致命疵点按Ac=0——见一拒全批。两个补充规则一并记牢:一顶帽子身上有几个疵点,按最重的那一个计,数的是"不良品的顶数"不是"疵点的处数";严重和轻微分开计数、分开判,两道门都过才算批合格。

规则清了,开抽。你按装箱单指定第1、3、5箱——头、中、尾(为什么必须你指定、必须头中尾,11.5展开成完整原则)——三箱各抽17、17、16顶,50顶铺满两张裁剪台。四个人,规格表、封样、样带各就各位,按11.1的全套动作过:车缝四查、绣花四步、外观六式、三围抽量。台面上很快出现一道令人心口发紧的风景:错线的帽子被一顶顶挑出来,单独站成一排——数到最后,**13顶**。13比4,Re线被冲得干干净净,连争议的余地都没有:**批,不合格。**你在验货记录上写下判定,让小周和QC签字。注意此刻抽样的使命已经结束——**抽样只回答"这批放不放行",不回答"到底有多少顶是坏的"**;判拒之后,第二个问题登场,答案叫**全检(100%检验)**:逐顶检验,把不良品全部挑出——抽样判拒后的标准动作,而且此刻它的成本该谁出,11.2.2要素三早写好了:卖方。

全检怎么组织,也是学问:只为"错线"一个项目全检,就不要拖着全项目——厂里出四个人加你和小周,两张裁剪台,每人手边一段样带(你把样带剪成了六小段,这块布片今天身价千金),一顶帽子只做一件事:贴样带、看麦穗、分堆,顺手把跳出来的其他疵点登记,一顶20秒,500顶一个下午见底。结果出来了:错线**120顶**,不多不少——和绣花厂"十二个机头换线、又绣了十轮"的交代严丝合缝:一轮12片,十轮120片。而且120顶自己分成了两堆:贴上样带一眼就跳出来的**偏橙80顶**——正是那八轴偏橙线的机头出品;要贴着样带仔细辨才看出偏浅的**40顶**——那四轴偏轻的线。8:4的机头配比,乘以十轮,80和40,连零头都对得上。机制、数量、成因,三点闭环——**一场合格的验货,终点不是"发现问题",是把问题还原到它的生产原因,数字对上的那一刻才算查完**。判拒之后的三个规定动作,今晚全部做完:**隔离**——120顶单独码放、箱外贴红色标签,与合格品物理分开;**书面**——全检结果写成分拣清单,双方签字(此刻它还不叫索赔函,叫事实确认,火候在11.6);**然后才是谈判**。本节动作:查表五步抄成口诀——**定批量、选水平、查字码、拿样本、读判定**;再送你一句报给工厂的行话,下次电话里原样说:"500顶,一般水平II,严重2.5轻微4.0,按Z1.4单次正常抽样——你们QC应该熟。"这句话出口,对面对你的报价和态度,都会调档。

## 11.4 验货三方式

### 11.4.1 自验与信任放行:省钱的边界在哪

全检那个下午,你一边贴样带一边后怕:这一切成立的前提,是你人在胶州。如果你在温哥华、在杭州,谁来把样带贴上第一顶帽子?把这个问题展开,就是验货的三种方式:**自验**——自己到场,今天你干的这个;**第三方验货**——花钱雇专业机构的眼睛(下一节);**信任放行**——不安排独立验货,凭工厂自检报告加照片放行出货。三种方式不是三个道德等级,是三个成本档位——所以"怎么选"是一道经济题,先把各自的价签挂出来:自验,一趟差旅,外地过来机票高铁加两晚住宿,¥1,500-2,500;第三方,¥1,500-2,500一次(下一节细算);信任放行,零。对照你这单的货值:500顶货款¥8,750——验一次货的成本占到货值的两成上下。**这就是小单验货的真实处境:验,贵;不验,赌。**这道题不能用"反正要认真"糊弄过去,得有规则。

规则的名字叫**放行决策树**,三层往下问。第一层:**首单吗?**是——到场或第三方,永远,没有例外。首单的"首"不只指第一次合作的厂,还包括老厂的第一次新款、第一次新工艺:因为首单没有历史数据,信任没有落脚点。你手边就躺着最有说服力的论据:这批120顶错线,恰恰出在一切文件都齐全的首单上——如果今天验货的不是你而是"信任",这120顶此刻已经在去港口的路上。第二层:**这单和上一单比,有没有任何一样东西变了?**改版、换季、换面料批次、换辅料供应商、换外发厂——任何一环变过,降级回"验"。这一问防的是翻单里最阴的坑,给你一个真实质感的案例:一位同行的帽子翻到第六单,前五单干干净净,他放行放得心安理得;第六单到客户手里,古铜滑扣亮得像黄金——工厂的扣具供应商换了电镀批次(2.4.2埋过的雷),工厂自己都不知道。整批返工换扣,来回海运两个月,客户流失。**翻单最大的风险不是工厂变坏,是供应链在你看不见的地方换了零件**;所以"没变"两个字要工厂书面确认——你在翻单PI里加一句"本单面辅料、绣线、外发安排与上单(单号)一致,如有变更须事先书面告知",这句话成本为零,把"我不知道"从工厂的借口清单里删掉了。第三层:**上一单干净吗?**近三单零严重疵点、封样在手、同厂同款——三个条件齐了,才允许信任放行;而且"信任放行"不等于闭眼:远程照片SOP(见11.5)照走,快检样照寄,只是省掉到场和第三方的钱。任何一单出过严重疵点,回到加严档——检验水平III(见11.3.2),连验两单干净才降回II:这套"加严-正常-放宽"的升降级逻辑,Z1.4标准里本来就有,你把它用在人身上而已。

回到主线对个账:R&B这单是首单,按决策树本该"到场或第三方"——你恰好从驻厂盯单(第8章)起就在,自验的边际成本约等于零,这是命好,不是方法;真正的方法是下一单:三个月后R&B翻单时,封样在手、首单已清、但要加做秋冬beanie新款——决策树第一层就把你拦住:新款,仍要验。那时你人在哪、钱怎么花,11.5的远程SOP就是为那一天写的。本节动作:把三层决策树抄成三行字贴在订单看板上——**首单吗?变了吗?上单干净吗?**——三问全过才谈放行;并给"信任"补一句定义:**信任放行信的从来不是工厂的人品,是"供应链一切未变"这个可验证的假设**——每次放行前,让工厂书面回答第二问,是你唯一要做也必须做的动作。

### 11.4.2 第三方验货:SGS/BV/QIMA流程与费用

夜里你把"如果我不在胶州"的剧本又推演了一遍,顺手打开了几家验货机构的网站。这一节把第三方验货一次讲透:它是什么、怎么走流程、多少钱、报告怎么读——以及它替代不了什么。**第三方验货机构**卖的商品是"独立的眼睛":与买卖双方都无利益关系的检验公司,按你指定的标准到厂执行检验、出具报告。行业里你会反复听到的名字:SGS(瑞士通标)、BV(法国必维)、Intertek(天祥)——百年老牌,报告在银行、大客户、争议仲裁里公信力最高;QIMA(前身AsiaInspection)一类互联网化的后起之秀——线上下单、报价透明、排期快,是中小卖家用得最多的。对你这个量级的生意,结论先给:**用哪家的眼睛差别不大,差别在你给眼睛的说明书写得好不好**——这句话的分量,读到本节最后你就懂。

流程五步,以一次典型的出货前终验(行话叫 FRI,Final Random Inspection)为例:①**下单预约**——货好前3-5个工作日在线预约(旺季提前一周),填工厂地址、货描、批量、要执行的AQL;②**提交资料包**——PO/PI、规格表、封样或样带的实物或高清照、装箱单,外加一份你自己写的检查重点;③**派员**——机构从驻本地的验货员池里派人(住青岛的验胶州,交通含在费用里),你不知道派谁,工厂也不知道——随机派员本身就是防串通的设计;④**现场执行**,大半天:核数量(点箱数对装箱单)、自主抽箱、按Z1.4抽样做外观全项、现场测试(三围、扣具开合、缝线拉力,你要求的话加克重取样)、全程拍照;⑤**出报告**——当天口头通报结果,24-48小时出正式PDF。费用:**$200-350/人日**,按人日计——一个验货员一个工作日;500顶帽子标准终验就是1人日,折人民币¥1,400-2,500;偏远地区、加急、周末各有加价。对照上一节的账:和你亲自飞一趟的差旅差不多钱,但省的是你两天的命——当你同时盯着三张订单时,这$300就从"贵"变成了"便宜"。

报告怎么读,是多数新手栽跟头的地方。第一页结论栏只有三种字:**Pass / Fail / Pending**——而你会发现大量报告写的是Pending(留待买方决定)。这不是机构和稀泥,是行规:**验货员只记录,不裁决**——抽样结果超了Ac但情节有争议、或有你checklist之外的发现,他如实记下,把拍板权还给你,因为裁决意味着担责。所以正确的读法顺序是倒着来:**先翻疵点照片页**——每个疵点一张照片、一个分级、一个数量,这是报告的肉;**再看AQL统计表**——实抽多少、各级不良几顶、对照Ac/Re落在哪边;**再看实测数据页**——三围、克重逐项对允差;**最后才瞟结论**。只看首页Pass/Fail的人,等于花三百美金买了一个字。

现在说局限——用你自己的事故说。把时钟拨回三天前,假设到场的不是你,是一位第三方验货员:他今天验帽子,昨天可能在验蓝牙耳机,他对你这单的全部认知来自资料包;如果你给的只是PO和一张logo截图,他走到绣花项,对一眼——"金黄色麦穗,有,绣工整齐,OK"——**120顶错线,Pass**。不是他失职,是他的checklist里没有"麦穗线色以样带自然光比对为准"这一行,而样带还锁在你的文件袋里。这就是第三方的能力边界,他们的委托合同里写得明明白白:抽样检验、报告仅反映检验时点抽取样本之状况、不承担全检义务。**第三方卖的是执行力,不是判断力;判断力——知道哪里会出事、什么必须查——只能长在你自己身上**,这也是这本书存在的理由。所以委托第三方的正确姿势是三件套,一件都不能少:①规格表(带允差版);②**封样或样带实物寄到**(寄给机构转交或寄工厂由验货员当场启封);③一页纸的**自定义checklist**——把你最怕出事的三件事写成三行大字,这一单该写的第一行就是:"前幅麦穗线色:自然光下与随附样带比对,目视有差即记严重疵点"。本节动作:把三件套做成委托模板存好;再记一条使用节奏——小生意的品质预算不必单单都用第三方,**翻单常态走远程SOP,每年抽一两单花钱请第三方校准一次**,像给自己的验货体系做年检。

## 11.5 远程验货SOP:照片清单与抽箱原则

把"如果我不在"的推演落成一份能直接用的文件——这一节就是那份文件,连同它背后的道理。先立总纲:远程验货的头号敌人,不是工厂造假——多数工厂不屑于造假——而是**样本被挑过**。让工厂"拍几张验货照来",对方一定拍最好的一箱、最挺的一顶:不是骗你,是人性,谁不想把体面的一面给客户看?但11.3.1讲过,抽样的全部效力建立在随机上——**挑过的样本,统计意义是零**,你看到的不是这批货,是这批货的宣传照。所以远程SOP的三条原则,每条都是冲着"随机性"和"可验证"去的:**①箱号你指定;②参照物同框;③过程连续不剪辑。**

先讲**抽箱原则**,它是三原则的第一条落地。步骤:让工厂先把装箱单(每箱箱号、数量、净毛重,见4.6)发你——注意,是先发装箱单、后开视频,顺序反了等于让工厂先知道你要抽哪箱;你从**头、中、尾**各指定一箱:5箱的指1、3、5,20箱的指2、11、19——头中尾覆盖装箱时序,而生产问题往往按时序分布(裁剪跨缸在头尾箱现形、赶工疵点堆在尾箱,你自己这批错线就集中在绣花末段);但别每次都指第一和最后一箱,规律固定了,工厂下次就有准备——**随机这件事,本身也要随机**。视频开机后的第一个镜头必须是箱唛(见4.6.3):核箱号与装箱单一致、封箱胶带原封,然后当镜头面拆封。做到这一步,你隔着四千公里拿到的样本,才和自己到场抽的是同一种东西。

然后是**照片与视频清单**,十项,每项都写明"怎么拍、对照什么"——这份清单的完整表格版在章末工具一,这里把几处机关讲透。前四项是基本盘:外箱四面加箱唛加电子秤称重(对装箱单毛重,差超0.5公斤要问);开箱俯拍顶层原始状态(帽子的嵌套摆法对不对,见4.6.2);抽任一顶拍单塑袋完好加窒息警告语(见4.6.1)入镜;整帽六视图——正、左、右、后、内、顶,外加檐底一张。第五项是全清单的心脏,颜色项:**样带贴前幅、潘通卡入镜、窗口自然光下同框拍摄**——这是11.1.2那三重失真机制的唯一解法:白平衡会把整幅画面一起拉偏,但它拉不开"同一画面里两个颜色的相对差"——样带和麦穗在同一张照片里,偏没偏,隔着屏幕也看得出。引申出一条纪律:阴天、夜里、车间灯下拍的颜色照,一律作废重拍,不迁就——颜色项宁可等一个上午,不能将就一张照片。第六到九项:软尺量三围、读数与帽子同框(帽围56-60、帽深9.5、檐长7,对允差,见2.5.1);扣具视频开合十次加织带回拉;内里拍沿条、汗带后中接缝、织唛主标;绣花翻背面拍底线。第十项是点睛之笔,**彩蛋顶**:你临时报一个坐标——"第3箱,从上往下数第17顶"——这一顶拍全套六视图。彩蛋顶未必能抽中问题,它的价值在威慑:让工厂知道**任何一顶都可能被点名**,挑箱备箱的动力就瓦解了——这和11.3.1"谁控制抽哪里,谁就控制结论"是同一个原理的攻防两面。

最后补一块手机永远补不上的短板:**快检样**。再规范的照片也隔着一层镜头,颜色、手感、克重三样,实物才有最终发言权——让工厂从你指定的箱里**当场取3顶**(头中尾箱各一,取的过程在视频里),连同一块同缸布头(见1.3.2)顺丰寄你,¥25-30、两天到;收到后按验货操六式加克重复称走一遍。快检样要在PI里给身份:"大货放行以买方收到快检样并复核通过为前提"——一句话,把"寄三顶帽子"从人情变成程序。整套远程SOP的成本算给你:工厂一小时人工配合,快递三十块,你一小时视频连线——对比第三方一次¥2,000、差旅一趟¥2,000,这就是翻单常态验货该有的价格。反面案例收尾:一位同行验货只收工厂发的照片包,货到手一半帽檐压变形——回头翻那批照片,张张精神;再细看,所有照片背景里是同一张桌角、同一卷胶带,拍摄时间集中在同一个十分钟——**工厂拍了一箱样板箱,他验了一场幻觉**。所以第三条原则"过程连续"落地成两个土办法:视频通话代替照片包,或者要求单条连续录像、开头口播当天日期和箱号。本节动作:把十项清单加三原则做成一页PDF存进手机,命名"远程验货SOP v1.0"——三个月后R&B翻单加beanie新款那天(见24章),它会第一次实战。

## 11.6 品质事故处理

### 11.6.1 责任判定:证据链怎么留

全检结束的那个晚上,和老崔的谈判约在次日上午。你在旅馆房间把桌子清空,像摆牌一样把手里的东西一件件码开——这个动作本身就是本节的主题:**证据链**——能把"谁、在哪一步、偏离了哪条书面约定"钉死的一组文件。记住它的第一性质:**链的价值在完整,不在单件的分量**——五件普通文件首尾相扣,胜过一件孤证。你桌上的五件:**第一件,签字样带**(见3.1.8):藏青底布上两支金麦穗,背面你手写的"金黄428"、线厂名、日期、签名;当时拍的"样带+色卡同框自然光"照片还躺在给Mike的邮件附件里——连云端备份都是现成的。**第二件,产前样**(见10.1.1):签封确认的那顶,麦穗用的正是428线——它证明直到产前,工厂完全知道对版的颜色长什么样。**第三件,订单条款**:3.1.8写进订单的三句话,尤其第三句——"大货如需替换线号或线厂,须提前书面确认新样带"。写下它的那天你自己都觉得多余;今晚,它是整场谈判的地基。**第四件,过程记录**:从询价到今天的微信与邮件,时间线连续、原始、未删改。**第五件,验货记录**:抽样13/50超Re判拒的记录、全检120顶的分拣清单——都有小周和QC的签字——加上每一级疵点的同框照片册。五件东西横着一摆,一条链就成型了:标准是什么(一、二件)→规则是什么(三件)→过程发生了什么(四件)→结果是什么(五件)。

牌好,还要预演对方的出牌。你把工厂可能打的三张牌各拆了一遍。**牌一,也是最扎心的一张:"你自己看过近照,说'看着挺正常'。"**这句话为什么不构成确认,三层,层层递进。第一层,**知情是确认的前提**:你被告知的是"进度照片",没有任何人告诉你"428用完了、我们换了线,请确认"——对一个被隐瞒的变更,任何表态都不可能构成对该变更的同意;你确认的对象根本不存在。第二层,**载体不合格**:合同白纸黑字约定,线色确认的唯一载体是书面签字样带,换线须"书面确认新样带"——照片观感不在约定载体之内。1.3.1那句老话,这次是反着应验的:没写进书面的,纠纷里等于不存在;**写进了书面的,纠纷里就是铁**。第三层,"看着挺正常"五个字是**描述,不是意思表示**——它陈述了一张照片给你的观感,不含"同意按此生产"的任何内容;何况11.1.2已经讲透,那张照片在物理上就不可能传递线色真值。三层拆完你也要自省一秒:假如当时你手一快,回的是"就按这个颜色绣"七个字呢?法理上仍站得住(变更未告知),但扯皮的口子就撕开了。所以给自己立一条**远程沟通纪律**:对照片永远只做过程性评价、永远带限定语——"照片上看没问题,颜色以签字样带为准"——把这句设成输入法的快捷短语,每一次都用它回。**牌二:"绣花是外发厂干的,你去找他们。"**这张牌用一个概念就拍死:**合同相对性**——讲成人话:你的合同签给谁,你就只找谁;工厂把绣花外发,是它的供应链内务(4.3.4"品控的转手"说的正是今天),它对你承担全部责任,再自己回头找绣花厂算账。你永远不接"转介绍去谈"的话头——接了,你就从"债主"变成了"调解员"。**牌三:"就差这么一点点,不影响戴。"**——11.2.1已在自己的地盘上判过:偏离封样、正面C位、成批、终端可辨,严重疵点;且批已按双方合同引用的Z1.4判拒,程序正义齐全。三张牌,三个答案,全部来自你三个月里一点点写下的纸。

第二天上午的谈判,比你预演的短得多。你把五件东西在老崔办公桌上依次摆开,刚讲到第三件,老崔摆了摆手,掏出烟,点上,又想起什么似的掐了:"不用念了。是我们的责任,绣花厂那边的账我去算。说吧,你想怎么处理。"——**证据链的最高境界不是吵赢,是让对方放弃吵**:当每一环都有签字和日期,对面第一眼就能算出争下去的败率,认账反而成了他成本最低的选项。你后来算过这条链的造价:一块布片、几张快照、三句条款、几个签字——加起来不到一杯咖啡钱;而它今天对面站着的,是120顶×¥17.5=¥2,100的返工盘子,和一单生意的走向。本节动作:从现在这一单起,每张订单建一个固定结构的**证据文件夹**:01规格表与封样照/02样带与色样/03PI与条款/04往来记录(按月归档)/05验货与签收记录——五个子目录,单单如此,张张如此;愿你永远用不上它,但它必须永远在。

### 11.6.2 返工、折价、索赔:尾款是最后的筹码

老崔那句"你想怎么处理",不是客气,是把定价权递到了你手上——接得住,靠的是你昨晚已经把方案做完了。品质事故的处置是一把有顺序的阶梯,先把梯子立起来:**返工**(把货恢复到合格,双方总损失最小,永远优先)→**折价**(货照收、钱打折,用于返工不经济或来不及)→**换货重做**(损失最大,极端情况)→**索赔**(赔偿返工之外的衍生损失:延误、差旅、客户罚金——关系的核按钮,最后才碰)。阶梯的道理一句话:**处置的目标是止损,不是出气**——每往下走一级,总损失变大一圈,能在高一级解决就不往下走。现在,把桌上三堆帽子逐堆过。

**第一堆,偏橙的80顶:返工。**技术路径要说得出口,谈判才不会被"返不了工"糊弄:拆绣不是把帽子拆了,是把绣花从帽上剥掉——翻到背面,拆绣刀贴着底线一排排削断,正面整片挑起,8800针的图案,熟手一顶20分钟,**拆绣工价¥2/顶**——比车缝工价看着高,因为费眼、费手、还担着拆破的责任。风险要摊开:8800个针眼,磨毛斜纹的绒面加上重绣原位覆盖(同一.dst文件、同一定位重新上绷,见3.1.6/4.3.2)能遮住绝大多数,但拆破是概率事件——这80顶最后拆坏了2顶,用工厂投料时按损耗率多裁的备片重做补齐(损耗的行规见9.6.1)。重绣要等真的金黄428:线厂有现货,发货一天到——这里你多说了一句让小周记在本子上的话:"**新线到了,先绣一片新样带,和签字样带并排拍照确认,再开机。**"同一线号不同批次也可能有批差——缸差的逻辑(见1.4.1),在线上一样成立;摔过一跤的人,要摔出方法论来。时间账:拆绣80顶约27个工时,两人一天半;重绣七轮机加定位半天——合计**交期+2天**。钱的账:拆绣¥160+重绣线料机时约¥350+2顶备片重做——**¥600上下,全部厂担**,依据就是11.2.2要素三、四:返工与复验费用,卖方承担;你一分不掏,连讨价还价都没有发生,因为条款替你谈完了。

**第二堆,偏得轻的40顶:让步接受。**先想清楚为什么不拆:这40顶一臂距离与主批混着看分不出,贴样带细辨才现形;对它们而言,拆绣的针孔风险是确定的,收益却是微小的——**返工的收益必须大于返工的风险,否则返工本身就是新的损伤**。但让步接受(定义见11.2.2)的拍板权不在你、更不在工厂——货是Mike的,品牌是Mike的。你当晚给Mike发了邮件:三张自然光同框照(偏橙的、偏轻的、签字样带),完整交代成因、已定的80顶返工方案,和对40顶的两个选项:拆绣返工(风险照实写),或折价让步。温哥华的清晨,Mike的回信到了,四句话:"谢谢你把这个盯出来了——说实话,照片里我得放大才看得出差别。主款一顶都不能将就,返工。偏得轻的那40顶别拆了:九月活动我们本来就要备赠品,就让它们当赠品发,每顶折2加元吧。工厂师傅的麦穗绣得是真漂亮,替我带一句。"——把这封信读两遍。**通情理的客户不是运气,是修出来的**:你在事故发酵前主动坦白、带着完整方案和照片去,换来的才是这种回信;同样这批帽子,若是货到温哥华被他自己发现,就是另一个故事的开头(第28章那个3万美金的案例,就是那个故事)。落地两件事:其一,40顶帽内后中加缝一枚**赠品标**——一条印着"R&B EVENT GIVEAWAY"的印唛(见2.3.4),¥0.05/枚,工厂顺手做;别小看这枚标,**让步接受的货必须可识别、可隔离**,否则混进零售渠道,今天的让步就是明天的投诉,这是让步接受的铁律。其二,折让40×2=**80加元(约¥416)**,从给Mike的发票里直接减。

这¥416谁消化?这里就到了本节标题那半句——**尾款是最后的筹码**——该怎么用的时刻。你手里的牌面:给工厂的70%尾款¥6,125还没付(30%定金¥2,625签约后已付),此刻开口让工厂把这¥416也吞下,老崔多半会认。但你把账放大了算:工厂已吞下全部返工成本约¥600,绣花厂那头的损失老崔自己去追;你这一单毛利约¥13,790(见7.3.2的分账表),¥416占3个点;而为四百块钱把一个刚刚痛快认账的合作方按在地上摩擦,下一单的报价、排期、插单的人情(见4.7.3),会连本带利还给你。所以你的决定:这¥416自己消化,一个字不提。**尾款是牙齿:亮出来是威慑,咬下去是终局**——未付的70%,让你这两天说的每一句话都有人认真听,让返工没有讨价还价、让复验没有拖延,这就是它的全部使命;真正咬下去的场景只有一种:对方拒不返工、拒不认账——那时的路径也要清楚:书面索赔函(附证据链)→按PI仲裁条款走→平台投诉留痕→这家厂永久出局,而你之所以敢走到那一步,是因为第12章教你备份的第二家厂还在名单上。**筹码的价值,在于没用掉的时候。**

结局比你预想的还多出一段。你说完方案——80顶返工厂担、40顶让步折让我自己消化、交期顺延两天——老崔沉默了两秒,主动开口:"返工的钱不用你说,我们担。另外,你下一单,送你200个织唛贴布(见3.3.1)——算我们赔个不是。"两百个贴布,百来块钱的东西,但这句话的分量你收到了:**处理事故的水平,决定的不是这一单的损益,是下一单的存在**——三个月后R&B翻单时你拿到的排期和报价(第24章见),都记着这个上午。第二天傍晚,80顶重绣完毕——拆绣与重绣排成流水,拆下一批就上一批;返工批不抽样,**全检**——数量小,且这个环节已经失信过一次,你和小周一顶一顶贴着样带过完,全部合格,归垛、封箱、贴唛。出货最终比PI晚了五天——绣花排队吃掉的,加上这次返工的两天;这笔延误为什么最后没有伤到Mike的九月活动,是另一场惊险的故事(第17章的时效账里埋着答案,第26章连同今天这一场一起复盘)。本节动作,把处置收成五步SOP:**定级**(按分级卡)→**定量**(抽样加全检,数字签字)→**定方案**(返工/折价/索赔,沿阶梯从上往下)→**定钱与时限**(书面,含谁承担、几个工作日)→**定复验**(返工批全检,复验费厂担);外加一条纪律压轴:**让步接受必须"客户书面同意+货物加标识"双件齐全**——缺任何一样,那不叫让步接受,叫蒙混过关。

**工具二:AQL速查卡**(一般检验水平II,单次正常抽样;帽子常用批量段)

| 批量 | 字码 | 样本量 | AQL 2.5(Ac/Re) | AQL 4.0(Ac/Re) |
|---|---|---|---|---|
| 91-150 | F | 20 | 1 / 2 | 2 / 3 |
| 151-280 | G | 32 | 2 / 3 | 3 / 4 |

用法三句:致命疵点一律Ac=0,见一拒批;严重与轻微分开计数、分开判;一顶多个疵点按最重的计一顶。口诀:**定批量、选水平、查字码、拿样本、读判定**(见11.3.2)。

**工具三:疵点分级卡**(AQL配置:致命0/严重2.5/轻微4.0)

| 级别 | 一句话定义 | 帽子常见项 |
|---|---|---|
| 致命 critical | 伤人或违法,零容忍 | 断针残留(过检针机)、金属毛刺、窒息警告缺失、成分产地标错 |
| 严重 major | 买家会放回货架或退货 | 错线/明显色差、爆缝、绣偏出允差、露底布、扣具失灵、正面污渍、檐插歪 |
| 轻微 minor | 只有验货员贴着才看得见 | 线头未剪、隐蔽处驳线、行距轻微不匀、内里浮线 |

判定用三问法:①伤人违法吗?→致命;②货架前会被放回去吗?→严重;③贴着看才见吗?→轻微。灰色地带的最高裁判:**封样**(见10.6)。争议纪律:先拍照(疵点+软尺/色卡同框),后争论。

> **本章作业**:凑10顶帽子当一个"批"——自己的、家人的、1688买的样品都行。第一步,拿疵点分级卡逐顶做全检:车缝四查、绣花四步(有绣花的话)、验货操六式,每顶登记疵点、位置、级别和"三问法命中哪一问";第二步,假设这10顶就是你的抽样样本,按严重2.5/轻微4.0的精神判一判这个"批"放不放行,写下你的Ac/Re理由。第三步,验证11.1.2的机制:挑一顶有颜色细节的帽子,拍两张照片——一张随手拍,一张按SOP拍(自然光+一件颜色参照物同框),发给朋友问哪张更接近实物。三步做完,你就有了第一份自己签名的验货记录——和一双再也不会轻信屏幕的眼睛。

## 12.1 找厂渠道

### 12.1.1 1688信号解读:回头率、详情页与行话试探

把时间拨回一个半月前。产业带功课做完的第二天早上(见6.7),你在1688的搜索框里敲下"棒球帽 定制",结果数以万计;把发货地筛到山东青岛一带,还剩几百家。几百家的首图长得几乎一样:金灿灿的"源头工厂"角标、"支持一件定制"、同款精修样帽图。你的任务,是从这几百张一模一样的脸里,筛出三四家值得打电话的——靠的不是眼缘,是四层信号。

第一层信号:**回头率**——平台公示的经营数据里,近90天下过单的买家中重复购买者的占比,这个词在这里第一次出场,钉死它。它为什么是头号信号?因为定制帽是复购生意:客户第一单满意才有翻单,工厂的老客户会一个月一个月地持续回来下单。刷单能刷出漂亮的成交笔数,但**刷不出几个月里持续发生的复购结构**——回头率是所有公示数据里造假成本最高的一个。给你阈值:定制类目回头率超过30%,可进备选;15-30%属正常;低于10%的店要警惕——流量可能是买的,客户是一次性的。配合看90天成交笔数:笔数巨大而回头率很低,是零售店逻辑,卖的是现货不是定制。

第二层:**详情页的行话密度**。详情页是工厂自己写的简历,行话密度暴露的是写简历的人离车间有多近。往下拉,看参数表里有没有"21支108×58""240g/㎡"这样的硬数字(这串数字的读法,见1.1.5、1.3.1),看车间实拍里有没有裁床、绣花机、挂着流转卡(见4.1.1)的裁片——还是满屏"加厚优质面料""高端大气"的形容词配棚拍图。机制在于:贸易公司盗产品图易如反掌,但"自家车间+自家参数+自家打包发货视频"这套连贯证据,盗不齐。

第三层:**两个标签的读法**。"源头工厂"是平台的付费认证服务:第三方上门核验过生产场地才给挂标,有门槛,但也是花钱买的——它值半分信任,剩下半分自己验:上天眼查输入店铺认证的公司名,看经营范围里有没有"制造、加工"字样,看注册地址在不在李哥庄这类产业带镇上(完整验法下一节展开)。另一个标签是起订量,有的店赫然写着"1顶起订"——定制帽厂的起订量物理下限是几百顶(染缸和排产的现实,见1.5.2、6.2.2),写1顶的只有三种可能:现货代发的零售逻辑、做成品帽绣花的二次加工商(见4.3.3、6.5.1),或者纯引流——点进去一聊,"1顶也发,logo定制300顶起"。看价格阶梯就现形:1顶29.9元、500顶17.5元,这两个价差出来的不是数量折扣,是**两盘不同的生意**。

第四层,也是你当年真用出效果的一招:**行话试探**。给过了前三层的店各发同一句话:"21支108×58磨毛斜纹240克,有现货色吗?"然后看两样——回复速度和回复内容。好答案长这样,几分钟内:"藏青、黑、卡其常备现货,别的色要凑缸(见1.5.2),你要多少顶?有潘通号吗?"——接住了每个数字,还反问到点子上。坏答案:"亲,都可以做的哦,详情看主页"——客服话术,问什么都"可以",等于什么都没答。更坏的是隔天才回:连询盘都接不住的店,接单后你的催问只会更慢。这句话是接头暗号,能接住的店,后台坐着的是懂布的人。

那天你的漏斗是这样收窄的:几百家→回头率加成交结构,剩三十来家→详情页行话密度,剩十二家→行话试探发出去,当天有下文的八家,答得像人话的四家——进电话名单。总共花了半天。本节动作:把这四层筛法抄成你的1688海选清单,顺序固定:**先看回头率,再读详情页,后查标签,最后发那句试探**——顺序不能反,行话试探是子弹,只打给值得打的目标。

### 12.1.2 国际站、展会、熟人介绍:三条路的成本与命中率

1688不是唯一的入口,只是首单预算下效率最高的那个。找厂的路一共四条,先摆一张对照表,再逐条讲另外三条的用法和暗坑:

| 渠道 | 前期成本 | 一次接触量 | 真工厂比例 | 报价水位 | 正确用法 |
|---|---|---|---|---|---|
| 1688海选 | 零 | 半天筛几百家 | 鱼龙混杂,靠信号自筛 | 最贴出厂价 | 首单起步、日常补名单 |
| 国际站(alibaba.com) | 零 | 一晚看几十家 | 有外贸班子的厂+贸易公司 | 高一到两成(外贸口径) | 当照妖镜,不当下单口 |
| 展会(广交会/帽类展) | 差旅两三千 | 两天四五十家 | 最高 | 现场只给区间 | 每年攒一次名单、摸样品 |
| 熟人介绍 | 零 | 一次一家 | 高,知根知底 | 看似优惠,实则难验证 | 当渠道,不当免检 |

**国际站**是中国供应商面向海外买家的橱窗,你要反着用:搜"custom baseball cap manufacturer",看谁常年在做美单、英文案例齐不齐、响应速度如何。上面的报价是FOB美元价,含外贸服务与溢价,比内贸口径高一到两成——所以它不是你的下单地(你说中文,直接走1688和电话拿内贸价),它的价值是**交叉验证**:在国际站和1688同时开店、两边参数口径一致的,大概率是真做出口的厂;只在国际站有精美英文店铺、1688查无此人的,先按贸易公司对待。

**展会**的账算给你:差旅两三千块,两天走下来能和四五十家供应商说上话——接触密度不如1688,但质量完全不同:摊位费几万块起,皮包公司算不过这笔账,所以摊位后面站着的大多是真厂;更要紧的是,**样品能上手**——克重压不压手、磨毛的绒面正不正、帽檐弧度顺不顺,隔着屏幕永远摸不到的东西,展台上三秒钟见分晓。局限也有:现场报价只给区间,大厂扎堆、对你500顶未必热情。所以展会的正确姿势不是当场下单,是攒名单加对标样品,回来再走电话十问(逛展的完整打法,第21章讲获客时一起展开——那时你是摆摊的一方)。

**熟人介绍**看着命中率最高——跑得了和尚跑不了庙,却藏着三笔隐性代价。第一,**不好意思砍价**:你手里那把基准价的尺(见6.2.1)在人情面前掏不出来,别家报价压过去等于当面说"我不信你"。第二,**不好意思验货**:验货(第11章)的每个动作本质上都在说"我要亲自核实",对熟人厂,你会一次一次地"算了吧"。第三,**出了事故难追责**:中间夹着介绍人,索赔追到一半就变成"给个面子"。算一笔:熟人厂报¥18.5,市场基准¥17.5,你不好意思比价,一单500顶多付500块;一年翻四单就是两千——这笔钱行内叫人情税,最贵的地方在于它是隐形的,你可能三年都不知道自己在交。解法不是不用熟人——熟人介绍的厂往往真不差——而是**熟人厂照全流程走**:十问照问、验厂照验、条款照签,开场只补一句话:"亲兄弟明算账,规矩摆前头,关系才长久。"对方要是连这句都接不住,这个熟人厂本身就是答案。

回看主线:你当初只走了1688一条路。这不算错——首单预算下它效率最高;错的是走完就停了:名单里只有一个产业带筛出的四家店,没有一张展会名片、没有一家实地看过的厂,连国际站的交叉验证都没做。**单一渠道等于单一视角,而单一视角里的"最优解",只是矮子里的将军。**本节动作:把四条路写成你的渠道组合规则——1688海选打底,国际站照妖,展会每年赶一次补名单,熟人当渠道不当免检;名单永远保持"两个渠道以上来源、五家以上活跃候选",这句话在12.5还会用到。

## 12.2 工厂vs贸易公司

### 12.2.1 五个分辨法:执照、视频、专业度、报价速度、地址

电话名单上四家店,你当时默认它们都是工厂——这个默认很危险:1688上挂着"工厂"两个字的店,相当比例其实是贸易公司(珠三角尤甚,见6.3.2)。先说清楚立场:贸易公司不是骗子,下一节还要专门为它正名;但你必须知道对面到底是谁——按工厂的价格预期去谈贸易公司,或者按工厂的品控预期去托付贸易公司,两头都会踩空。五个分辨法,按成本从低到高排。

**第一法,执照。**国家企业信用信息公示系统或天眼查,输入店铺认证的公司全名,看三样。一看经营范围:生产型企业写着"帽子制造""针纺织品加工"这类字样;只有"服装服饰批发零售、货物进出口"的,是贸易公司——注意有些老板两块牌子都有(双主体结构,见8.1),那就看店铺认证挂的是哪一块。二看**社保参保人数**,这是最难装的数字:8条车缝线的中型厂,车工加辅助岗上百人,参保怎么也有几十人;挂着"源头工厂"招牌、参保人数却只有三五个的,直接按贸易公司对待——工厂给工人上社保未必全覆盖,但几乎不可能是个位数。三看成立年限;注册资本是认缴的,不用当真。三分钟,免费。

**第二法,视频验厂。**"验厂"这个词在这里正式出场,先钉死定义:**到工厂现场(或通过实时视频)核查其生产能力、管理水平与合规状况的动作**——本章后半部整个在教它,视频版是它的低成本前哨。三条铁律:必须实时连线,不收提前录好的"车间宣传片";连线中出三个随机指令——"走到裁床边,拍一下今天在裁什么布""把排产白板给我看看""拍一台绣花机的铭牌",录像应付不了随机指令;竖起耳朵听背景音——车缝车间是一片连续的哒哒声浪,安静得能听清对方喘气的"车间",多半是展厅。十分钟视频,贸易公司的现形率极高。

**第三法,专业度试探。**问一个只有生产端才答得上的细节:"上帽檐这道的计件工价现在多少?"真工厂的业务员多半张口就来:"五毛上下,旺季加一毛。"(计件工价表的机制见4.4.3;上帽檐是最难的单道工序,行情¥0.4-0.6/顶。)贸易商的典型反应:"我们报的是整帽价,你问这个干嘛?"同类试探还有"裁床一次拉多少层?"(见4.2.4)"绣花机几台、几头的?"——答案精确与否不是重点,重点是答得出答不出、答的时候顺不顺。

**第四法,报价速度悖论。**你规格还没给全,对方已经报出一个漂亮的整数——"这种帽子我们13块全包"——这不是效率,是背价目表:只有卖标准现货的人才有价目表可背,非标定制的价必须现算,面料、辅料、针数、工缴一栏一栏地算(第9章拆过的那些栏)。真工厂的"快"长另一个样子:老纪当年接你电话,听完规格沉默了十几秒——在按计算器——然后报出"17块5",带零头、附交期,还追了一句"潘通号发我"(见6.7)。判别标准一句话:**快而不问的是背价,问齐再算的才是报价。**

**第五法,地址。**帽厂长在产业带的镇上——李哥庄和周边村镇的工业园(见6.1.1);地址写着"XX区XX路XX大厦1208室"的"工厂",是贸易公司的办公室。地图软件的卫星图和街景看一眼:厂房是大跨度的平房或标准厂房,写字楼是写字楼,一秒分明。

一场现成的事故给你垫底:一位做电商的同行,在一家挂"源头工厂"的深圳店下了800顶,对方以"车间管理严格不让拍"拒绝视频连线,他嫌麻烦没坚持。货出了问题上门理论,导航把他带到写字楼十二层——货被转到潮州一家作坊做,中间隔了两手,"240克磨毛斜纹"传到第三手嘴里已经变成了"加厚面料"。五个分辨法他一个没用,而每一法的成本都不超过十分钟。本节动作:按成本顺序执行五法——执照三分钟、地址一分钟、报价方式留心听、专业度一句话、视频十分钟;前四法全过再约视频,视频过了,才配进"当面拜访"的名单。

### 12.2.2 贸易公司不一定差:什么时候反而该用它

上一节教你把贸易公司认出来,不是教你把它拉黑。第7章讲过,贸易商赚的那10-20个点里,正当的部分叫翻译、整合、担责(见7.2.2)——当时你站在"我也是个贸易商"的位置上理解它,现在换到采购者的位置,把同一句话展开:有三种单,贸易公司比工厂好用。

第一种,**多品类拼单**。客户要帽子500顶、T恤300件、帆布袋200个——促销品客户的常态(见5.5.2)。你直连工厂,意味着找三个厂、过三道起订量、盯三条产线、验三次货、拼三批物流;贸易公司一站整合,多付的那一成服务费,买的是你自己跑断腿的那部分。带你算:自己整合的隐性成本——两三趟差旅几千块、三个MOQ凑不齐时的妥协、三头沟通的时间——多数时候超过贸易公司的加价。这时候用它,不是妥协,是划算。

第二种,**小单没人接**。50顶的精做样单、100顶的高要求小单:中型厂嫌小(门当户对的机制,见6.2.2),现货贴牌(见6.5.1)又达不到品质要求——市场出现真空。好的贸易公司手里攒着好几个客户的小单,拼成一张工厂愿意接的大单压下去,这是它的独门本事:你买的是它"拼"的能力,这个能力你单枪匹马永远复制不了。

第三种,**生品类**。你第一次接beanie、第一次做贴布绣潮款,供应链两眼一抹黑——借贸易公司蹚第一单,学费比自己踩坑便宜得多;等品类做熟,再回工厂直连。

用贸易公司,三条规矩立在前头。规矩一,**知情权**:问清"我的货在哪个厂做",写进合同——它可以不让你绕过它直连工厂,但必须告诉你货在哪里生产,出了事能追到实体。规矩二,**别拿贸易公司价当行情**:它的价等于工厂价加10-20%,你的基准价坐标系(见6.2.1)必须建在工厂报价上,否则整个价格感觉都会漂移。规矩三,**品类熟了就毕业**:贸易公司是新品类的渡船,不是常住的家;单一大宗、品类熟、量稳定的单回到工厂直连,省下的一成多就是你的毛利。

怎么分辨贸易公司的成色?一句话试金。你问:"你们是工厂吗?"好的贸易公司答:"我们是贸易公司,帽子主要在胶州两家合作厂做,量大的话我可以带你去看厂。"——坦白、开放、给验证路径。坏的答:"我们就是工厂"——而执照一查是纯贸易。**判贸易公司,不看它是不是中间商,看它瞒不瞒你。**在"自己是谁"这件事上就撒谎的中间商,后面每一环都会替你"优化"信息:品质问题传到你耳朵里会变轻,你的要求传到工厂耳朵里会变形。

回看主线,有个细节当时你没意识到:名单四家里有一家其实就是贸易公司——行话试探它答得并不差,好贸易公司里也有懂布的人。你是在1688的聊天框里追问"绣花自己做还是外发"时看出破绽的:对方答"我们有合作的绣花厂",你再问车缝线几条,对方停顿半天,回了句"这个要问下厂里"。它没进最终名单,不是因为它是贸易公司,而是因为它装成工厂。那一次你做对了,但属于误打误撞——现在你知道,这个判断本可以在打电话之前,用三分钟执照查询就完成。本节动作:把决策规则写进笔记——**单品类、量达标、品类熟,工厂直连;多品类、微量、生品类,用贸易公司,执行三规矩;无论用谁,"装工厂的贸易公司"一票否决。**

## 12.3 评估50问

### 12.3.1 电话十问:三分钟筛掉一半

电话筛选的目标要先校准:筛的不是"好厂",是"值得你花一天时间当面去看的厂"。一通电话三五分钟,一天能打完整张名单;一次当面拜访连路程要一整天——**十问的本质,是用三分钟的成本守住一整天的成本**。第6章末你已经攒下了八个问题(见6.7的选厂八问),现在升级成正式的十问,并且给每一问配上"好答案和坏答案的形状"。

设计原理有三条。其一,**只问开放题和数字题,不问是非题**:"你们质量好不好"这种问题,全中国的答案都是"好";"去年接过最小的单是多少顶"才有信息量。其二,好答案的判据不是"答对",是**具体**——具体到数字、地名、人名的答案很难现编。其三,顺序由浅入深,最扎心的留在最后,对方前面聊开了,后面才不设防。

| 问题 | 好答案的形状 | 坏答案的形状 |
|---|---|---|
| 1. 几条车缝线、多少人?主做哪个市场? | "8条线,一百三四十人,美单为主" | "大厂,什么单都能做" |
| 2. 单款起订量?去年最小接过多大的单? | "现货色300顶起,最小就接过300" | "多少都能做"(或报出劝退价,见6.4.2) |
| 3. 我这规格(报三件套+针数),什么价位? | 问齐规格、现算、报价带零头 | 规格没听全就报漂亮整数 |
| 4. 绣花自做还是外发?多远?缺线断料怎么办? | "外发邻镇,当天来回;缺线先停机拍照问客户" | "外省合作厂,来回一周,不耽误的" |
| 5. 车间现在在产什么单?我500顶何时能排上? | 说得出在产的款和下个空档 | "随时能排"(8条线的厂随时有空,更可疑) |
| 6. 上帽檐谁做的、做了几年?单道工价多少? | "老师傅十来年,五毛上下" | 支吾,或"这个要问车间" |
| 7. 打样几天?样品费多少、下单退不退? | "五到七天,三五百,下单抵货款" | "免费免费"或"半个月吧" |
| 8. 面辅料多久齐料?滑扣、织唛从哪进? | "镇上档口,常规两三天齐" | 说不清来源,或"外地调" |
| 9. 最大客户是什么类型、占产能几成? | 说得出类型,占比三成以下 | "一个大客户占了七八成",或答不出 |
| 10. 会不会外发转厂?能写进合同吗?能随时视频看线吗? | "帽身不外发,绣花外发某厂;可以写" | "都是我们自己做"却不肯写进合同 |

筛选阈值:十问里**六问以上答得具体**,进当面名单;三问以下,挂了电话直接画叉;答得流利但全在吹的,回到12.2.1的执照和视频去查证。这套问题的威力,你其实已经见过一次:功课阶段那家报价比胶州低5%的内陆厂(见6.1.1),就是被第4问筛出去的——"外省绣花来回一周"七个字,暴露了它交期承诺里的整颗雷。

最后是诚实的复盘。你的三通电话,其实只有一通打给了胶州候选——另外两通是打给东莞和义乌当价格参照的(见6.7);电话名单上剩下那几家胶州厂,你一通都没打,理由是"老纪这家答得最好"——用一次行话试探的成绩,免掉了所有对照组。再翻出打给老纪的那通录音数一数:你只问了五问——线数、起订量、价格、交期、绣花。十问里的另外五问,一问都没出口;尤其是第4问的后半句"缺线断料怎么办"——事故一的雷,本可以在那通电话里就被扫出来(为什么这么说,下一节给你看那段对话)。三通电话定终身,你赌赢了,但赢的是概率,不是方法。本节动作:把十问打印成卡片贴在电话边,给名单上每家都完整问一遍——**包括那家你感觉最好的**;感觉最好的那家,恰恰是你最容易只问五问的那家。

### 12.3.2 当面四十问:把话题引到车间里去

当面拜访那天,工厂会把你往会议室里领:茶泡上,样品帽摆一排,荣誉证书挂一墙。你的第一个动作是把这个局拆掉,一句话就够:"边走边聊吧,我对车间更感兴趣。"机制很简单:**会议室里人人都是演员,车间里的设备和裁片不会演戏**。四十问的"四十"不是流程,是弹药库——没人真的掰着指头问满四十个,但四类问题一类都不能缺,而且每一问都要问在场景里:站在绣花机边问绣花,站在裁床边问验布——因为答案可以当场核对,他说验布用四分制(见4.2.1),你低头看验布机边上有没有在用的记录表。

四类问题,每类背后验的东西不同。**第一类问设备**:"这排平车什么型号、几成新?""绣花机几台、几头的?""裁床多长、一次拉多少层?"(见4.2.4)设备问题验的是产能的真实性和资产的归属——自家买的设备,老板和业务员说得出型号、年份、当年花了多少钱;支支吾吾的,要么是租来撑场面的,要么这根本不是他的厂。顺手用4.4.4教过的方法验算:8条线、每线12个人,他吹的"日产两万顶"成立不成立,当场心算。

**第二类问在产订单**:"这条线上跑的是谁的单?发哪个市场?""这批和我那款像不像?"在产单验的是客户结构和你的位置——线上全是美单绣花帽,说明它的工人和流程被你这类订单训练了十年;线上全是内贸低价货,它嘴上说"美单我们也做过",手上的肌肉记忆会诚实。同时看你在它客户序列里的分量:第9问(电话十问)问过最大客户占比,现在到白板和流转卡上核对答案。

**第三类问工价**:"上帽檐现在计件多少?""难款加价怎么算?""旺季工人流失多不多?"工价验的是成本底细和管理成色——敢让你看工价表(见4.4.3)的厂,报价单里的工缴栏就没法骗你(呼应9.5:工缴是最不该砍、也最难藏水分的一栏);工价水平和工人工龄(见6.1.2的工人池)决定了它旺季留不留得住人,留不住人的厂,交期承诺全是纸。

**第四类问最大客户和事故**:"合作最久的客户几年了?""被验货验得最狠的一次是谁验的?""有没有砸过的单,怎么处理的?"这一类验品质的天花板和担当的下限。被狠客户验过货的厂,验货标准长在流程里,不用你从头教;而"我们从来没出过问题"是全场最坏的答案——做了十年帽子不可能没出过事,**要么在撒谎,要么出了事故从不复盘**,两种都危险。反过来,能坦然讲出"前年有批货绣偏了,我们怎么赔的"的老板,比荣誉墙上所有奖牌都可信。

一段真实对话,让你看看这类问题能挖出什么。事故一返工期间,你在车间里问老纪:"绣花厂要是缺线,一般怎么处理?"老纪答得很实在:"常规是拿最接近的线先绣,回头补个信息说一声——这回是他们新来的排机员没报,赶上你这个金黄又是特调的。"你后背一凉。你在打样时明明确认过样带、定了"金黄428"(见3.1.8和第10章),但"外发厂缺线找替代"是人家的行业日常,**替代之前要不要先停机问客户,靠的是两家厂之间的默契,而这个默契你从没验证过**。"缺线断料怎么处理"这一问,当面问、电话问都只要十秒钟——你付出的代价是80顶拆绣返工、交期多两天。四十问里没有一问是闲的,每一问背后都站着一场已经发生在别人身上的事故。

本节动作:拜访前把章末工具里的四十问通读一遍,挑出这家厂你最不放心的十五问,写在手机备忘录里;进车间按"设备→在产单→工价→客户与事故"的顺序走完,全程约两小时。问不完不要紧,**问在车间里的十五问,比问在会议室里的四十问值钱**。

## 12.4 验厂

### 12.4.1 自己看什么:设备、在产单、车间状态的八个细节

四十问是耳朵的活,这一节是眼睛的活。工厂领你走的一定是"参观动线":大门口的荣誉墙、窗明几净的样品间、绣花车间最气派的那排新机器。你要看的,是动线之外的八个角落——每一个都是没法为你临时布置的,这正是它们可信的原因。

**细节一,裁床边有没有松布。**裁剪区找一找:有没有成卷的布摊开搭在架子上静置——那是松布(见4.2.2),布在退掉张力、泄掉"脾气"。有松布区、且布卷挂着标签写明日期的,说明这家厂尊重布的物理规律;布进门直接上裁床的,帽子的缩水命运在第一刀就定了。**细节二,流转卡挂不挂。**随手拿起一摞裁片,看有没有跟着流转卡(见4.1.1)、卡上的工序栏有没有真在逐项填写——空白卡挂着做样子的厂不少,真填写的卡上有不同工序、不同笔迹的签字和数字。**细节三,剪线头勤不勤。**站在车缝线边看三分钟:车工完成一道往下传之前,顺不顺手剪线头?后整区有没有专门的剪线修整台(见4.5.2)?线头是纪律的探针——每一根线头都要在某个环节被某个人剪掉,越早剪成本越低,车位上就剪的厂,管理是渗进日常的。**细节四,样品间乱不乱。**样品间是工厂的记忆:样帽有没有挂牌(客户、款号、日期)、按客户归档,还是堆成小山?乱的样品间意味着版房失控——你的封样(见10.6)将来就存在这里,今天的乱,就是明天"封样找不到了"的伏笔。**细节五,白板排产表。**车间或办公室墙上的排产白板,是工厂唯一不对外表演的文件:核对三样——在产的单和业务员说的对不对得上;你被承诺的那个排产空档存不存在;客户栏里都是什么名字(全是同一个客户,回到电话第9问的风险)。**细节六,消防通道。**通道和安全门有没有被布卷、纸箱堵死。这不只关乎安全:消防通道是典型的"不出事就没人在乎"的事,**连看得见的风险都懒得管的管理者,不会认真管你看不见的品质**。这一项一票否决。**细节七,工人年龄结构。**扫一眼车间:全是五十岁往上的面孔,说明这厂在工人池(见6.1.2)里没有竞争力,年轻人招不进来——三五年后它连线都开不满,旺季最先流失的就是它的人;二十到四十五岁的梯队齐整,才是家健康的厂。**细节八,厕所。**参观到一半借用一次厕所——这是管理水平的终极探针,因为它是全厂唯一没人会为参观者专门准备、又天天暴露管理真实水位的地方。厕所干净的厂,车间地面、仓库码放、单据填写,不会差到哪里去——**管理是同一只手,不会只在一个房间勤快**。

八个细节看完约四十分钟,配上四十问正好一次两小时的拜访。给你判定规则:八项逐项打"过/不过",**六项以上过关进备选;消防通道堵死一票出局**。一场事故说明白代价:一位同行验厂只看了设备和样品间——两样都体面——下了8000顶的年度单;他没留意消防通道堆满纸箱、车间里几乎没有四十岁以下的工人。旺季一到,那家厂车工流失三成,他的货延了三个星期,空运补救的运费吃掉整单利润。设备是钱买的,样品间是可以打扫的,**工人结构和管理习惯,才是一家厂装不出来的底色**。

本节动作:把八细节做成手机里的打分卡(章末工具有现成版),每次进厂按顺序打一遍;另外记住一个动作——参观中途,主动去一趟厕所。

### 12.4.2 认证报告怎么读:BSCI/Sedex的含金量与局限

当面拜访快结束时,常有这一幕:老板从抽屉里抽出一份复印件推过来,封面上是几个蓝色字母——"我们是过了BSCI的厂。"多数新人接过来会肃然起敬,然后犯下本节要拆的头号误区:**把社会责任审核当成了品质认证**。

先把两个名字钉死。**BSCI**(现称amfori BSCI)是欧洲买家主导的**社会责任审核**体系:第三方审核机构进厂查工时、工资、童工、强迫劳动、消防安全、歧视——查的是"这家厂怎么对待工人",结果分**A到E五档**。**Sedex**是英国起家的供应链数据平台,工厂做一次**SMETA**审核(查劳工、健康安全、环境、商业道德四个板块),报告挂在平台上供买家调阅。把误区讲透:这两样东西,**从头到尾没有一个字在讲你的帽子缝得直不直、色差大不大、克重够不够**。它们回答的是品牌客户的另一个恐惧——"我的供应商会不会因为血汗工厂上新闻"。所以一家BSCI拿A的厂,完全可能给你做出一批绣偏的货;一家没做过任何认证的镇上小厂,也完全可能是全镇手艺最好的。**社会责任审核证明的是"这家厂不会让你的客户丢脸",不证明"它能让你的客户满意"——品质,永远只能靠规格书、封样和验货(第2、10、11章)来锁。**

那这份报告对你有没有用?有,两个用处。第一,**它是管理水平的旁证**:能把工时记录、工资表、消防演练做到可审核程度的厂,管理下限不会太低——和上一节的厕所探针互为印证。第二,**它是你未来接大客户的入场券**:北美连锁、大型促销品公司(见5.5.2)的供应商门槛清单里几乎都有它——哪天你要接这类客户的单,手里有没有一家带有效认证的厂,决定你能不能报名。所以本节教的不是"要不要信",是"怎么读"。四步:**一看等级**,A、B是好成绩,C是及格常态,D、E视同不合格;**二看日期和有效期**,A、B级两年一审,C级要求一年内跟进复审——过期的报告就是废纸,而抽屉里的复印件十有三四是过期的;**三看审核机构**,SGS、BV、TÜV、ITS这些第三方签发的才算数,没听过名字的"认证公司"出的证书,防伪价值约等于打印店;**四验真**,报告都有编号,BSCI体系里工厂有唯一的DBID号——让工厂当场登录平台后台给你看状态,或授权你的客户在系统里调取;只肯给复印件、不肯碰后台的,按无证处理。

代价用一场真事故标价:一位同行拿着合作厂"两年前过的BSCI"复印件去投一家美国促销品公司的标,对方采购在平台一查,DBID状态早已失效——更糟的是,这一查让对方对他报价单里的其他数字也全部起了疑,单没了,拉黑了。**一份过期证书的杀伤力,大于没有证书**:没有只是资格问题,过期还硬递,是诚信问题。顺手把成本账也交代了:一次BSCI审核加前期整改,工厂要花几万块,之后年年维护——这笔钱最终摊在报价里,所以带证的厂同规格贵几毛钱,合理;但反过来,如果一家厂拿认证当涨价的主要理由——"我们是过BSCI的,所以贵两块"——你现在知道怎么回它:"BSCI审的是社会责任,咱这单的品质标准,还是按封样和AQL来(见11.3)。"

本节动作:把"四步读法"存进手机;当面拜访的问题清单里加一问:"认证是哪家机构审的、什么时候到期?"——问法本身就是威慑,让对方知道你不是看见蓝色字母就点头的人。

## 12.5 供应商组合:主力+备份的分单艺术

返工重验收尾的这个晚上,你在旅馆里新建了一个文档,标题敲了三个字:备份厂。这个决定是返工桌边想通的。事故一最后有惊无险:80顶拆绣返工、40顶让步接受、交期多两天——但你在车间等待复验的时候,把"如果"往下多推了两步:如果绣坏的不是120顶而是400顶呢?如果这家厂旺季踢单、或者干脆出个大事停产呢?答案让你出了一身冷汗:**你没有任何一张备用的牌**。尾款是筹码(见11.6),但筹码只能用来谈赔偿,救不了Mike九月中旬那个死线。你所有的鸡蛋,在同一只篮子里,而你一个半月前甚至没有认真挑过这只篮子。

行话把解法叫**分单**:把你的订单流按比例分给两家以上供应商,常年保持多于一家的活跃供应关系。其中吃大头的叫**主力厂**,吃小头、保持热身状态的叫**备份厂**。行之有效的比例是**8:2**——主力厂吃八成,量换价、攒翻单红利(见4.4.2);备份厂常年吃两成。为什么必须给备份真实的订单?因为**不下单的备份不是备份,是通讯录里的陌生人**:没有做过你的款,就没有你的纸样、绣花版带和封样;没有活跃的合作,你的插单请求(见4.7.3)在它的排产表上排最后。两成的单量,买的是"随时能顶上"的热状态。

备份厂的价值有两笔,都能算成钱。第一笔,**报价锚定**:每次翻单,你手里同时有两家的真实报价,主力厂想涨价,得涨得有名有姓——"棉纱涨了"就摊开算棉纱(见9.2.1的反算),涨不出道理的部分自己会缩回去。没有备份的买家,收到涨价通知只有吞下这一个动作;有备份的买家,连"我问问另一家"这句话都不用说出口,对方报价时自然收敛。第二笔,**事故顶班**:主力厂塌方时,备份厂是做过你的款、有你封样的热备,一周内能接手;临时抓瞎的替代方案什么价?看现成的对比——你这款如果事故后临时改走东莞快反(见6.3),单顶贵¥3.5,500顶就是¥1750,还要加急费,还要从头打样、从头验厂,时间根本来不及。再算养备份的成本:备份厂单量小,报价通常贵3-5%;假设明年你的订单流是2000顶,按8:2分给备份400顶、单顶贵¥0.7,一年的"保费"不到¥300——**一份比运费险还便宜的供应链保险**,赔付额却以千计、以客户关系计。

分单还有一层意思,要对着第6章的旧知识讲:**转厂(见6.1.2)的本质就是分单——由工厂替你做的、失控的分单**。工厂产能吃紧时,它自有一套备份网络:外发相熟的小厂、裂变出去的老班组长(那天你问小周"返工要是来不及厂里怎么办",小周答得轻描淡写:"外发呗,老板有相熟的厂"——工厂有备份网络,你却没有,这句话就是压垮你的最后一根稻草)。你在合同里写"未经书面同意不得转厂"(见6.3.2),堵的是失控的分单;你自己养备份厂,建的是受控的分单——**同一个动作,主动权在谁手里,天壤之别**。

备份厂怎么挑,三条规则。其一,**同产业带**:备份厂选在胶州同一个配套圈里(见6.1.1),共享面辅料商和绣花资源,顶班时齐料最快,报价也天然可比。其二,**厂型相当**:主力8条线,备份选5-10条线的同级中型厂——拿作坊当备份,顶班那天你会发现它顶不动(门当户对,见6.2.2、6.4.2)。其三,也是最容易漏的:**别选主力厂的关联厂**。产业带里裂变(见6.1.2)出来的厂,老板可能就是主力厂的前班组长、老板的表亲——两家共用信息池,你的分单意图第二天就传回主力厂;真出事故时,两家是一伙的,你的"备份"会跟主力一起给你摆困难。查法:天眼查看股东和高管有无交叉,再借信息池反向打听——档口老板、货代,都比你清楚谁和谁是一家人。最后一条纪律,防的是分单的反噬:**分的是订单流,不是同一张订单**——同一个客户的同一个款,别拆成250+250两家做,两家的缸差(见1.4.1)、版型手势差会让Mike收到"两批不一样的帽子";R&B的翻单里,主款继续留在主力厂,beanie款、trucker款(见1.1.4、1.2.4的四SKU方案)拿去喂备份厂,既养了关系,又天然隔离了一致性风险。

今晚文档里的第一行动作清单,你是这么写的:用12.1的漏斗筛出三家候选;明天开始每家过一遍电话十问;下周离开胶州前,顺路当面看一家——四十问加八细节,两小时。这一次,方法在前,运气靠边。本节动作,给你的版本:**从此你的供应商名单永远保持"1家主力+1家热备份+3家电话名单"的纵深**;每半年用十问刷新一次电话名单,每年至少当面验一次备份厂——供应链的安全感,从来不是找到一家好厂,而是**你随时找得到下一家**。

这一章就是那个词的说明书。

## 13.1 钱货分离:外贸的元问题

### 13.1.1 隔着太平洋,凭什么信你:风险的来源

填那一栏之前,先往回退一步,退到六月初。你翻出Mike的第二封邮件,那句你当时看了一遍就过去的话:"OK, 30% deposit — where do I send it?"

现在再读,后背有点凉。一个在社区市集上跟你聊了二十分钟的加拿大人,凭什么把1,485加元打给一个他没见过的中国账户?反过来问同样值钱:你凭什么在只收到三成的情况下,把¥11,950的成本一分不少地垫下去——布买了、版制了、工缴给了、洗水厂的钱也付了?**这个"谁先动、谁就裸奔一段"的困境,是外贸所有制度设计的起点,行内一句话概括:钱货分离。**国内一手交钱一手交货,时间差是零;跨境交易,这个时间差被拉成了三个月,而且中间横着一万公里。

分离到底分在哪四处,拆开看:

**一是时间分离。**这一单的节奏你现在闭眼都能背:D33签PI、D35付定金、D41上裁床、D55验货、D60装车、D62开船、D88到门。在这条线上的任何一个时刻,总有一方处在"已经付出、还没拿到"的状态。没有任何一个瞬间是两清的。

**二是空间分离。**货一旦出了胶州,你连它长什么样都看不见。Mike也一样——他不能开车来仓库把五个箱子拉走抵账,你也不能飞到温哥华去他的酒吧搬桌子。**在国内你至少还能上门,跨境连"上门"这个动作都不存在。**

**三是法律分离。**合同适用中国法还是加拿大法?判决在哪儿执行?把成本算一遍你就死心了:请一位加拿大律师发第一封催告函,几百到一千多加元;真要走完不列颠哥伦比亚省的小额索偿程序,时间以月计,人得到场。而这一单的货值是4,950加元。**诉讼成本逼近甚至超过标的本身,这就是"小额跨境订单基本没有司法救济"的真实含义**——不是法律不管你,是这笔账算下来不值得管。

**四是信息分离。**他看不见你的车间,所以你才要拍视频、寄确认样、发验货照片(第10、11章做的所有事,本质上都是在给这道缝填土);你也看不见他的银行流水和生意状况,所以你只能靠"他有一家实体酒厂、有官网、九月中旬有一场周年活动"这些外部证据去推断他跑不掉。

把这四处分离画成一条时间轴,你的处境就清楚了:

```
D33签PI   D35定金30%      D55-58验货   D60装车   D62开船      D88到门    尾款
   |          |               |           |         |            |         |
Mike的敞口 → ¥7,722(1,485加元)已付、货未到 ─────────────────────→ 收到货为止
你的敞口   →        垫料垫工 ─→ ¥11,950成本已投 ──────────────────────→ 尾款到账为止
```

带你把两个敞口都算出来。**Mike的最大敞口**:1,485加元,即他能亏掉的全部,时点从D35一直挂到D88。**你的最大敞口**:总成本¥11,950减去已收的定金¥7,722(按1加元≈¥5.2,见0.3),等于**¥4,228**——这是D60前后你身上真实的现金缺口。但现金缺口不是全部损失,还有更狠的一层:这500顶帽子的前幅上绣着"RIDGE & BARREL"。**定制品的残值是零。**Mike不要了,你既卖不掉也退不回工厂,五个箱子就是五个箱子的废布。通货可以打五折清掉,定制单不行——这是定制生意和贸易生意最根本的风险差别,你选的赛道(见7.3.2)天生带着它。

所以30/70这个比例不是行规摆设,它是一个旋钮:**把双方在任何一个时点上的最大敞口,都调到"输得起"的量级。**你输得起¥4,228,Mike输得起1,485加元,这单才做得成。

一场翻车让你看清旋钮拧错的后果。一位同行第一单做欧洲,3,000顶,货值USD 21,000,合同写"70%见提单副本付款"。他扫描提单副本发过去,客户回"银行在处理,周五到账",他货已开船。第三周,客户改口:市场变了,降价15%否则弃货。他算了一遍:货在鹿特丹,回运运费加滞港费USD 4,000起,定制帽转卖残值为零。最后降12%成交,USD 2,520的利润全没了,还倒赔了一部分。**他的错不在"信错人",在敞口设计**——"见提单副本付款"这句话里,提单副本是一张纸,而放货的钥匙是正本提单(见16.4.2)。他把纸给了对方,钥匙也没攥住。真正的做法是尾款到账后再放单,这一段的机制第14章整章讲。

本节动作,三条,从今天起用在每一单上:①**每接一单,先画敞口时间轴**,在纸上标出"我最多可能损失多少现金"和"这个数出现在哪一天";②**定制品残值按零计,通货按五折计**,别用货值安慰自己;③立一条铁律:**任何时点的敞口,不超过你能一次性亏掉且不影响继续做生意的金额。**新人的这个数往往是几千到一两万人民币——所以你第一单接500顶而不是5,000顶,不只是工厂起订量的问题(见6.4.2),更是你自己的敞口在替你做决定。

### 13.1.2 四种解法总览:定金、信用证、平台担保、保险

你在笔记本上写下"钱货分离"四个字,画了一条横线,底下列了四行。这四行是整个外贸金融的地图,第14章会逐个走进去;今晚先看清它们各自的形状——因为**这四种解法的区别只有一个:把风险塞给谁。**

**解法一:分期付款(T/T电汇,即telegraphic transfer银行电汇,详14.1)。**风险没有转移给任何人,只是被切成两三块,双方各含一半。常见结构:30/70(定金/见提单)、50/50、30/40/30(定金/装船前/到货后)。成本几乎为零,只有一笔电汇手续费,几十到一两百美元一笔(详14.1.1)。它的核心设计原则一句话——**你收进来的定金,必须盖得住你付出去的定金**(14.5.1详讲)。拿R&B核对一遍:客户定金30%=1,485加元≈¥7,722;你要付工厂的定金是30%×¥8,750=¥2,625,加制版费¥200、打样寄样¥700,合计¥3,525。盖得住,还剩¥4,197当周转金。**这一步验算通不过的单子,不管毛利多好看,都不能接**——它意味着你要用自己的钱替客户垫生产。

**解法二:信用证(L/C,letter of credit,详14.3)。**把商业信用换成银行信用:买方向自己的银行申请开立信用证,银行书面承诺"只要卖方交来完全符合信用证要求的单据,银行就付钱"。风险被转移给了开证行。代价有三条,每条都很实在:①**费用不随金额缩小**——开证费通常按货值的0.15%左右收,但有最低收费,加上通知费、议付费、改证费,一单折腾下来常常几百美元;②**单证严格到变态**,单据上一个字母、一个日期对不上(行话叫"不符点"),银行就有权拒付;③周期长,来回改证一两周是常事。算给你看:R&B这单货值4,950加元,假设银行费用合计USD 300≈¥2,130,占货值8.3%——而这单的全部毛利是¥13,790,一刀切掉一大块;更现实的是,Mike一个开精酿酒厂的小老板,去银行开证要押保证金、要填一堆表,他多半直接掉头去找本地供应商了。**小单不用L/C,不是因为L/C不好,是因为它的固定成本不随金额缩小。**

信用证的翻车长这样:一位同行第一次做L/C,金额USD 42,000。信用证要求提单注明"CLEAN ON BOARD"和"FREIGHT PREPAID",货代出的提单漏了"CLEAN"字样;另外装箱单写"200 CTNS",发票写"200 cartons"。银行认定两个不符点,拒付。这时货已经到港,买方顺势提出降价8%换他同意付款——USD 3,360,加上改单和滞期,一单白做。**教训:L/C是单据的游戏,不是货物的游戏**(单证体系见16.1)。你货做得再好,单子上少一个词,银行照样不认。

**解法三:平台担保(详14.4、21.1.1)。**阿里国际站的信保、PayPal、各类第三方托管(escrow),原理相同:买方把钱付给平台,货发出/确认收货后平台再放款给卖方。风险转移给了平台规则。代价:①**费率**,平台按成交额抽1-3%不等,PayPal这类收款工具的综合费率(含跨境费和货币转换)更高,4%上下(详14.4);②**限额与账期**,放款有周期,资金不是即时到手;③**判罚权在平台**,纠纷时按平台自己的证据规则判——你未必吃亏,但你不控制。适用场景很清楚:第一次成交、中小金额、双方互相不信任,且客户本来就来自这个平台。

**解法四:保险。**这里有个新人最容易混的分岔,现在钉死:
- **货运险(详17.7)**:保的是货在运输途中的物理损失——沉船、碰撞、火灾、水湿、偷窃。它**不保买方赖账**。
- **出口信用保险(详14.2)**:保的是买方不付钱——破产、拖欠、无理拒收。费率通常在货值的0.5%-1.5%,按买方资信和账期定。它是做账期(O/A赊销)生意的前提,但门槛不低:要做买方资信评估、要有一定业务规模,单笔几千美金的小单基本用不上。

**两种保险合起来,才盖住"货"和"钱"两条腿**——这也是为什么它们不能互相替代。

四种解法摆在一张表上,你就有了全局:

| 解法 | 风险塞给谁 | 成本 | 适用订单 | 新人建议 |
|---|---|---|---|---|
| 分期付款T/T | 谁也不给,双方对半含着 | 电汇费几十至一两百美元/笔 | 小额、客户可验证、有复购预期 | 首选,首单必用 |
| 信用证L/C | 开证行 | 合计常数百美元,不随金额缩小 | 货值5万美元以上、新客户、陌生市场 | 前两年别碰,要碰先请人过单 |
| 平台担保 | 平台规则 | 成交额1-3%,收款工具4%上下 | 平台来的中小额首单 | 第一次成交的缓冲带 |
| 保险(货运/信用) | 保险公司 | 货运险万分之几;信用险0.5-1.5% | 货运险人人该买;信用险给账期单 | 货运险按票买,信用险等有量再说 |

回到主线,你的选择是**30/70的T/T**,理由三条,每条都可复用:客户是当面认识的(D0市集那二十分钟,是你手里最硬的资信证据);货值只有4,950加元,任何金融工具的固定成本都吃不消;最关键的一条——**他有九月中旬的周年活动死线,他比你更急。**买方的时间压力,是比任何合同都好用的履约保证,这一条以后每一单都值得先问一句:"他要这批货干什么用,几号要?"

本节动作,一张决策规则贴在案头:货值**低于1万美元**且客户可验证(官网、社媒、实体地址、当面见过其中两项)→ T/T 30/70;**1万至5万美元**或纯陌生客户 → 定金提到40-50%,或走平台担保,首单绝不给账期;**5万美元以上**或客户开口要账期 → L/C,或T/T加出口信用保险;任何金额,都不接受"货到付款"。

最后留一句,它正好是下一节的门:上面四种解法,没有一种能解决"货在半路上没了"这件事。那是货运险的活——**而货运险由谁买、保到哪一段、风险在哪一刻从你身上滑到客户身上,全部写在你即将填进那一栏的三个字母里。**

## 13.2 Incoterms:是什么、谁定的、2020版

你回微信问小林:"Trade Terms这栏我填什么?"

小林回得很快:"你跟客户谈的是什么条款就填什么。FOB还是DDP?"

"我跟客户没谈过条款啊,我就报了个到门价。"

那边发来一条语音,四十几秒,大意是:"那你就是DDP的意思了。不过合同里得写清楚,不然出了事没依据。还有——别光写'FOB'两个字,要写全:FOB Qingdao Incoterms 2020。写不全,以后扯皮你一点理都没有。"

**Incoterms**(International Commercial Terms,国际贸易术语解释通则):由**国际商会(ICC,总部巴黎)**制定的一套三字母代码,每个代码规定买卖双方在货物交付上各自的义务边界。1936年首版,大致每十年修订一次,现行版本是 **Incoterms® 2020**,2020年1月1日起施行。你在报价单、PI、合同、提单、报关单上见到的FOB、CIF、DDP,全部出自这本册子。

先讲最容易被误解的一层:**它管什么,不管什么。**

它只管四件事:①卖方在哪里、以什么方式完成交货;②运输和相关费用怎么在两边分摊;③**风险在哪一点从卖方转到买方**;④谁办出口清关、谁办进口清关、谁向谁提供什么单据和信息。

它不管的至少有五件:①货物**所有权**什么时候转移(那由合同准据法和提单这类物权凭证决定,见16.4.1);②货款怎么付、什么时候付(第14章);③违约救济、赔偿上限;④价格本身;⑤产品合规、不可抗力。

一句话记住:**Incoterms只回答"货怎么交",不回答"钱怎么收"。**新人最常见的误会就是把它当成一整套合同——它不是,它是合同里的一行字。你还需要另外一行写付款方式,再一行写品质标准(见11.2.2),它们各管各的。

第二层机制更要紧:**Incoterms不是法律,是惯例。**它本身没有强制力,只有被写进合同才对双方产生约束;写进去之后,它以合同条款的身份生效。正因为如此,**版本年份必须写**——2010版和2020版对同一个代码的规定并不完全一样,不写年份,吵起来双方各引一个版本,谁也说服不了谁。

第三层,认全11个术语。深讲只讲四个,但你得知道全貌,因为客户随时可能甩来一个你没见过的:

**组一:适用任何运输方式(含多式联运),7个**——EXW(工厂交货)、FCA(货交承运人)、CPT(运费付至)、CIP(运费保险费付至)、DAP(目的地交货)、DPU(目的地卸货交货)、DDP(完税后交货)。

**组二:仅适用海运及内河运输,4个**——FAS(装运港船边交货)、FOB(船上交货)、CFR(成本加运费)、CIF(成本加保险费加运费)。

这里有一个行内人才会提醒你的细节:**组二这四个是给散货、大宗、传统海运设计的;严格讲,集装箱货应该用FCA/CPT/CIP/DAP。**为什么?因为集装箱货在装船前好几天就已经交进了码头堆场或货代仓库,货离开你手的那一刻,和"装上船"那一刻,中间隔着三五天;按FOB的规定,这几天的风险还在卖方身上,而货早就不由你控制了。ICC自己一直在建议集装箱货改用FCA。但现实是——**中国出口九成以上的报价还是写FOB,银行、货代、海关全都习惯了它。**所以你要同时知道两件事:理论上FCA更准确;实务上FOB是通用语,你按FOB报价没有任何问题,但要清楚那道三五天的缝在哪(13.3.1收尾会给你堵法)。

第四层,2020版相对2010版改了什么。三处,面对老客户翻出来的旧合同时用得上:

1. **DAT改名为DPU**(Delivered at Place Unloaded,目的地卸货交货),并且不再限定必须在"终端";
2. **FCA下新增"已装船提单"机制**:买方可以指示承运人给卖方出具带on board批注的提单,解决了FCA项下卖方拿不到已装船提单、在信用证下没法交单的老麻烦(这也是ICC推FCA的诚意);
3. **保险级别分了家**:CIP要求投保ICC(A)一切险,而**CIF仍然只要求最低的ICC(C)**——这一条会在13.4要你的命,记住它。

现在给你完整写法。一个规范的条款,**三要素缺一不可:代码 + 具体地点 + 版本年份。**

```
✓ FOB Qingdao, China (Incoterms® 2020)
✓ CIF Vancouver, Canada (Incoterms® 2020)
✓ DDP 1234 Industrial Way, Vancouver, BC V6A 1A1, Canada (Incoterms® 2020)

✗ FOB                 ← 哪个港?哪一版?
✗ CIF Canada          ← 加拿大东西横跨四千公里,内陆运费差出一个订单的利润
✗ 到门价 / delivered  ← 中文口语,合同里不算数
```

地点精度有讲究:FOB、CIF这类港口术语写**港口名**;DAP、DDP这类到门术语写**完整地址,写到门牌**。写"DDP Canada"等于什么都没写。

现在讲一个能让你多掏两千多美元的事故,它专杀那些"FOB我懂"的人。一位同行接到美国客户询价,邮件写着:"Please quote FOB our warehouse in Los Angeles."他按中国习惯理解,以为对方笔误,回了个"FOB Shenzhen USD 3.20/pc"。客户下单,PI上条款栏只写了"FOB USD 3.20"。货到洛杉矶港,客户不肯付海运费和清关费,理由是"我说的是FOB我的仓库"。

谁错?**两个人说的都是"FOB",但用的是两套体系。**美国国内贸易沿用《美国统一商法典》(UCC)的FOB,分 FOB origin(发货地交货)和 FOB destination(目的地交货),后者的意思就是"送到我仓库为止,费用和风险都归卖方"。同一个三字母,一个指船上,一个指仓库,中间隔着整个太平洋。这单他最后掏了:海运USD 1,450 + 目的港费用与清关USD 900 + 内陆派送USD 380,合计 **USD 2,730**,吃掉全部利润还倒贴。

防这一刀只要两个动作,加起来不到一分钟:**第一,术语后面永远缀上"(Incoterms® 2020)"这几个字**,写上去的那一刻,美式FOB就被排除了;**第二,看到美国客户写"FOB + 一个内陆地名"时,立刻回一封确认邮件**——"To confirm: do you mean Incoterms 2020 FOB (port of loading, Qingdao), or delivered to your LA warehouse (DAP/DDP)?"对方一回,一切清楚。

最后把数字锚打在你自己这单上,让你对"条款值多少钱"有量感:同一顶帽子,FOB青岛的成本是¥17.5/顶;双清包税到门的成本是¥17.5+¥2.8=**¥20.3/顶**,差16%;如果是几十顶的小批量走国际快递,这个差能拉到50%以上。**两个数都是诚实的报价,差别只在那一行字里。**所以下面这句话值得你背下来:**离开条款的价格不是价格,是一个还没说完的句子。**

本节动作三件:①报价单、PI、合同三处的条款栏,一律按"代码+具体地点+版本年份"三要素写全,一个字不省;②养成习惯——**任何收到的报价,第一眼先看条款栏**,没写条款的一律回信问清楚,绝不自己猜;③把11个术语抄成一张小纸条贴在显示器边上,分成两组,前半年不用背定义,只要能一眼认出"这个是港到港的,还是门到门的"。

## 13.3 四大术语精讲

### 13.3.1 EXW与FOB:工厂门口和船舷的分界

下午你给小林打了个电话,想把那一栏彻底搞明白。他在车上,背景一片喇叭声,说话很快:"你这单啊,工厂给你的是FOB,你给客户的是到门,中间这段是你的活。"

你顺口问:"那EXW呢?我在1688上看有些工厂报EXW,便宜一截。"

他笑了一声:"EXW便宜是因为它什么都不干。你接了EXW,拖车、报关、退税,全归你自己想办法——你有报关行吗?"

先把这条物理链摆出来,后面三节都用它:

```
① 工厂仓 → ② 装车 → ③ 内陆拖车 → ④ 出口报关 → ⑤ 装 船
   ══════ 海 运 28-32天 ══════
⑥ 卸货 → ⑦ 目的港杂费 → ⑧ 进口清关/关税 → ⑨ 内陆派送 → ⑩ 客户仓库
```

**EXW(Ex Works,工厂交货)**:卖方在自己厂房或仓库把货备妥、通知买方来提,交货就算完成。理论上连装车都不是卖方的义务(实务中通常帮你装,但装车过程的风险仍在买方)。它是11个术语里**卖方义务最轻、买方义务最重**的一个,分界点就在上图的①。

新人为什么别碰EXW,三个机制层面的理由:

**一是报关资质错位。**中国出口报关必须由境内具备进出口经营权的主体办理(见18.2.1),一个加拿大买家在中国办不了这件事。所以EXW下真实发生的永远是"卖方协助报关"——合同上写着这是买方的责任,实际操作的是卖方的人,义务和责任对不上号。一旦报关出问题,追责时双方都能找到理由。

**二是退税断链。**出口退税跟着出口报关单和增值税专用发票走(见9.7.3,详18.3),帽子的退税率约13%。EXW下如果不以工厂名义报关,这13%就拿不回来。工厂比谁都清楚这笔账——所以它报EXW给你的价,通常已经把丢掉的退税加回去了,**你以为省了一段物流费,实际上买回来的是一个更贵的价加一堆麻烦。**

**三是内陆段你干不了。**胶州到青岛港拖车一小时(见6.2.1),听着简单,实际要有车队资源、要懂装柜、要有报关行、要处理港区预约和排队。新人接EXW,等于把自己最不熟的一段揽下来,却省不到几毛钱。

EXW真正合理的场景只有三个:同城或国内交易;买方在中国有采购办事处或指定的第三方物流(大买家的中国办通常自带报关能力);以及寄样——样品走DHL,本质上就是EXW加一张快递面单(见10.4.2)。

**FOB(Free On Board,船上交货,仅限海运及内河)**:卖方负责把货运至指定装运港、办妥出口清关,并把货**装上买方指定的船**;从货物装上船那一刻起,费用和风险同时转给买方。分界点在上图的⑤。

一个值得知道的历史细节:**2010版之前,FOB的分界是"货物越过船舷"(over the ship's rail)**,行内有个老笑话说风险"在船舷上晃来晃去"——吊钩下的货掉在码头还是掉在船上,责任归属不同,真打过官司。2010版起改成"装上船(on board)",船舷这个说法正式退休。你以后在老合同、老教材里读到"船舷",知道它说的是同一件事就行。

FOB下的活,分给谁,具体到你能对着工厂点名:**卖方**——内陆拖车(②③)、出口报关与商检(④)、港区码头操作费THC、装船(⑤)、提供出提单所需的资料;**买方**——**订舱**(booking,向船公司或货代订下这一票货的舱位与船期,订妥后拿到的那份确认件就是你今天收到的订舱确认,详17.5.1)、海运费、保险、目的港的一切费用、进口清关、内陆派送。

注意这里埋着一个后面要用的关键:**FOB下"订舱权"在买方手里。**这就是"FOB指定货代"这个行话的来源,也是13.5那条策略的根基。

拿R&B算一遍。老纪报的是FOB青岛USD 2.45/顶(见9.1.1),折¥17.5。这个价里工厂承担了拖车、报关、港杂;而你这500顶只有5箱、0.48个立方(见4.6.2口径),是拼箱货,进的是货代的集货仓,这几段费用摊到每顶只有几毛钱——所以老纪没有单列,直接揉进了单价。**但你要知道它在里面**,因为这决定了你下次问工厂要EXW价时,合理的差额是几毛,不是几块。给你一句验证话术,原样可用:"纪哥,你这个FOB青岛,含不含THC和报关单证费?我要是自己拉货,EXW能便宜多少?"——答"五毛以内"的是诚实的;答"能便宜两块"的,要么FOB里塞了水,要么它准备把退税的损失甩到你头上,两种都要追问。

事故讲一个FOB特有的、每年都在发生的坑。一位同行做FOB,买方指定了目的港一家货代。货装船之后,那家货代扣着提单不放,要卖方先支付一笔"文件费+订舱费"USD 380,理由是"这是在装运港产生的费用,归卖方"。他不给,提单出不来,货到港客户提不到货,反过来怪他耽误事。最后他掏了。**机制在这里:FOB下买方指定货代,这家货代的商业关系在买方那一边,它对你没有服务义务,却握着单据的控制权。**两条防法:①在PI里把边界写死——"装运港产生的一切费用由卖方承担;承运人或其代理在装运港收取的与订舱、放单相关的费用由买方承担";②能争取到CIF/CFR或用自己的货代就争取,这一条13.5会展开成一条策略。

本节动作:把**FOB三问**写进你的询价模板,每次问工厂都过一遍——①**谁订舱**?②**装运港具体是哪个港**(青岛/上海/宁波,写全名,别写"中国港口")?③**FOB价含哪些港杂费、不含哪些,超期堆存怎么算**?这三问的价值不在省钱,在于把那道"我以为你办了"的缝提前填上。

### 13.3.2 CIF与DDP:从港到港,与送到家门口

小林的报价单晚上发过来了,三行:

```
① FOB Qingdao                         ¥0(货在工厂,你自提到我仓)
② CIF Vancouver(0.48CBM拼箱,含保险) 约 ¥900
③ 海派专线 双清包税 到门(28-32天)   ¥1,400
```

你盯着②和③的差看了很久:一样是去温哥华,差¥500。差在哪?差在②只到温哥华港的码头,③一直到Mike酒厂的后门——而这中间那一小段,恰恰是Mike最不想碰的一段。

**CIF(Cost, Insurance and Freight,成本加保险费加运费,仅限海运)**:卖方在FOB的全部义务之上,再加两件——订舱并支付到指定**目的港**的海运费,以及为货物投保并支付保险费。目的港卸货之后的一切(目的港杂费、进口清关、关税与税金、内陆派送)归买方。**但请把这句话划出来:CIF的风险转移点没有动,仍然在装运港"装上船"那一刻。**这就是下一节整节要讲的反直觉点。顺便认一个近亲:**CFR(成本加运费)**,就是CIF去掉保险,其余完全相同;不少客户会直接问你报CFR,意思是"运费你出,保险我自己买"。

**DDP(Delivered Duty Paid,完税后交货)**:卖方负责把货送到买方指定地点、交由买方处置,承担全程费用,**包括进口清关、关税和进口环节税**(加拿大是GST,见18.4.1),风险直到货送达那个地点才转移。它是11个术语里卖方义务最重的一个。它有两个近亲要一起认:**DAP(Delivered at Place,目的地交货)**——送到门,但进口清关和税费归买方;**DPU(Delivered at Place Unloaded)**——送到并卸下。**DDP和DAP之间只差一件事:进口清关和税谁负担。**这一个字母的差别,在有些国家能差出货值的两三成。

现在讲DDP的真实难点,这是新人最容易在报价时踩空的地方:**很多国家要求"进口人"(importer of record)必须是本地有税号的实体**——加拿大要有BN号并注册CARM账户(见18.4.1),美国要有IOR资格或买进口保证金。一个中国卖家没有本地税号,**严格意义上的DDP根本做不了**;硬做,通常是借用清关行或买方的税号,一旦被查验、被追税,责任归属会非常难看。

所以真实世界里,中小额跨境订单的"到门",绝大多数不是标准DDP,而是——

**双清包税**(概念在7.2.3点过,物流形态详17.4):专线物流商把"出口清关 + 国际运输 + 进口清关 + 关税税金 + 末端派送"整个打包成一个按公斤或按方计价的运价,**以它自己或它的合作清关行作为进口人报关**。你付一个数,货到门,不再有任何后续账单。

它和标准DDP的三个实质差别,必须讲透:

**一,进口人不是你,也不是客户,是服务商。**合规责任、申报口径都在它那里,你对"这批货按什么品名、什么货值报进去"没有控制权,通常也看不到。

**二,税费不是按你的实际货值单独计缴的,它被平均进了运价里。**后果很具体:**你和客户都拿不到进口完税凭证。**加拿大的GST对注册企业来说是可以做进项抵扣的(见18.4.1),Mike是有公司的,他年底做账时如果想抵这笔税,会发现没有凭证。**这一点必须在报价前问客户一句**,不然到时候他回头找你,你才是真的没话说。

**三,风险不是法律意义上的"卖方承担到门",而是服务商用一份商业承诺(包税、包赔)把它吸收掉。**赔多少、怎么赔,全看它合同里那一行——通常是按运费的若干倍封顶,或按声明价值赔,**极少按货值全赔**。

所以最严谨的说法是:**双清包税是DDP的商业替身。**客户的体验完全等同于DDP(货到门、不再掏一分钱),法律结构却不是。你对客户可以说"delivered duty paid",但你心里要清楚:替你扛这一段的,是一家物流公司的承诺,不是一套完整的报关合规链。

现在把R&B这单的两条路都算给你看,你会明白你的钱赚在哪。

**路线A(工厂FOB,客户自理)**:Mike按FOB青岛买,单价USD 2.45≈¥17.4/顶。然后他自己要处理:找一家肯接0.48CBM拼箱的货代;付目的港杂费(拼箱的目的港杂费是出了名的坑,见17.2.2,一票常在CAD 200-400);付报关代理费(加拿大一票约CAD 75-125,见18.4.1);缴关税和GST(税率见18.4.1);安排温哥华港到酒厂的内陆派送(同城几十公里,CAD 100上下)。合计几百加元,摊到500顶就是**0.8-1.2加元/顶**;更要命的是,他得亲自去注册CARM、跟加拿大海关打交道。对一个每天要盯糖化锅和酒标的小老板,这不是钱的问题,是"这事我根本不想碰"。

**路线B(你实际选的)**:海派专线双清包税,**¥1,400/500顶 = ¥2.8/顶**(约0.54加元/顶),28-32天到门。按方折算,¥1,400÷0.48方 ≈ **¥2,900/方**——**把这个单价记下来**,它是你以后向第二家、第三家专线询价时唯一有用的标尺;只记"¥1,400"是没用的,货量一变就作废。

两条路一比,你的位置就清楚了:**不是你运得比Mike便宜多少,是你把一件他做不成的事,变成了报价单上的一行字。**这句话的完整算账留到13.5。

事故讲一个"包税"翻车的完整下场。一位同行走双清包税出2,000顶帽子到美国,运费按包税报价,货值和品名申报由服务商全权处理。柜子被美国海关查验,发现服务商把绣花棒球帽报成了"针织配件"以压低税率,整柜扣了三周,补税加罚款。他回头向服务商索赔,合同里"包税"的赔付上限是**运费的三倍**——他运费USD 3,600,拿到USD 10,800。而他的实际损失是:客户的活动错过、2,000顶货折价处理、后续订单终止,自估超过 **USD 30,000**。**包税不是免责,它只是把税务风险从"你不知道"变成"你不知道,而且你也管不着"。**选专线,别只看谁便宜,要看它的申报是不是老实、赔付条款怎么写。

本节动作,**走包税到门之前的四问一确认**,原样抄去问:①报关的进口人抬头是谁?②申报品名和HS编码(见18.1.1)按什么报,能不能给我看申报口径?③被查验产生的费用和延误算谁的,有没有上限?④货损货丢的赔付上限是多少、按什么计?最后一问是问客户的:⑤**你需不需要进口完税凭证做抵扣?**——需要,就不能走包税,得走正规DDP或DAP由他自己清关。这五句话,能挡掉这门生意里最难缠的一类纠纷。

### 13.3.3 三线图:责任、费用、风险分开画才不乱

小林那句"中间这段是你的活"你记在了本子上,晚上想把它画清楚:这段到底从哪儿到哪儿。第一次,你画了一条横线,在上面标出四个术语的分界点——画完就卡住了:**CIF的运费明明是卖方付的,可小林说"CIF下货沉了买方还得付钱"。**这两件事没法画在同一条线上。

于是你把它拆成了三条。这三条线,是本章最值钱的一页纸。

- **责任线(义务线)**:哪一段由谁去"办"——订舱、报关、装柜、投保,谁跑腿、谁签合同、谁挨罚。
- **费用线**:哪一段的钱由谁掏。
- **风险线**:货物在哪一点之后灭失或损坏,由谁**承担**——注意"承担"两个字的分量,它的意思是:**货没了,买方照样得付货款。**

用13.3.1那条十节点物理链,把四个术语的三条线画出来:

```
节点:  ① 工厂仓 ② 装车 ③ 拖车 ④ 报关 ⑤ 装船 ══海运══ ⑥ 卸货 ⑦ 港杂 ⑧ 清关税 ⑨ 派送 ⑩ 客户仓

EXW  责任  卖①┃买 ②③④⑤⑥⑦⑧⑨⑩
     费用  卖①┃买 ②③④⑤⑥⑦⑧⑨⑩
     风险  卖①┃买 ②③④⑤⑥⑦⑧⑨⑩          ← 三线重合于①(工厂门口)

FOB  责任  卖①②③④⑤┃买 ⑥⑦⑧⑨⑩
     费用  卖①②③④⑤┃买 ⑥⑦⑧⑨⑩
     风险  卖①②③④⑤┃买 ⑥⑦⑧⑨⑩          ← 三线重合于⑤(装上船)

CIF  责任  卖①②③④⑤+订舱+投保┃买 ⑦⑧⑨⑩
     费用  卖①②③④⑤⑥(海运费+保费)┃买 ⑦⑧⑨⑩
     风险  卖①②③④⑤┃━━━买 ⑥⑦⑧⑨⑩      ← 费用线走到⑥,风险线停在⑤,不重合!

DDP  责任  卖①……⑨┃买 ⑩(卸货)
     费用  卖①……⑨⑩(含关税与进口环节税)┃
     风险  卖①……⑨┃买 ⑩                   ← 三线重合于⑨(送达指定地点)
```

看出来了吗:**四个术语里,只有CIF那一组的三条线不重合。**

为什么会这样?因为人的直觉全部来自国内买卖:淘宝包邮,快递丢了商家补发,天经地义——谁付运费谁负责送到。跨境不是这样,原因藏在这套规则的出身里。海上贸易时代,货一旦上船,卖方在岸上就再也管不着它了(船是承运人的,海是老天的),而买方在遥远的另一头同样管不着。于是国际贸易演化出了两类合同:

- **装运合同(shipment contract)**:卖方的义务是"在装运港把货装上船、并交出合格单据"。**EXW、FCA、FOB、CFR、CIF、CPT、CIP 全属这一类**,风险一律在起运地转移。卖方付不付运费是另一码事——那只是价格里包了多少的问题。
- **到达合同(arrival contract)**:卖方的义务是"把货送到目的地"。**DAP、DPU、DDP 属这一类**,风险在目的地转移。

一句话记牢,能替你挡掉外贸新人最贵的一个误会:**C开头的四个术语(CFR/CIF/CPT/CIP),是唯一一组费用线和风险线分家的;E组、F组、D组三线都重合。看到C,先问风险在哪。**

带你做三道判断题,答案就是这一节的全部用处:

**问一:CIF Vancouver,船在途中一个箱子进水,20顶帽子报废。谁承担?**——买方。风险在青岛装船时就转移了,他仍须支付全部货款,损失由他凭保单向保险公司索赔(保单由卖方投保、并背书转让给买方)。**你看,这一件事上,责任、费用、风险落在了三个不同的人身上:保险是你办的、保费是你出的、损失是他扛的、赔款是保险公司出的。**

**问二:同样的事故,发生在DDP下呢?**——卖方。货还没送到,风险没转移,你得补做20顶或退款,而且你还得自己去和保险公司或物流商掰扯。

**问三:FOB下,货已经进了港区堆场,还没装船,一场台风把堆场淹了。谁承担?**——卖方,风险还没走到⑤。**而这正是13.3.1提过的集装箱时代FOB的那道缝**:货进堆场到实际装船,常常隔三五天,这几天风险还在你身上,货却已经不在你手里。堵法很简单:投保时把保险起讫写成**"仓至仓"(warehouse to warehouse,见17.7)**,别只保海上那一程。

最后给一个算账的视角,把三条线和你的报价挂上钩。同一批货,你报FOB USD 2.45,或者报CIF USD 2.63(海运加保险摊到每顶约¥1.3)。多出的这¥1.3是什么?**是你替客户买了一段运输服务,而你没有因此多承担一分钱的风险。**反过来说也成立:如果你报的是CIF,却按DDP的心态整天操心货有没有平安到岸、到了主动补偿——**你就是在免费提供一份没人付钱的担保。**记住这条纪律:**报价里的每一分钱,都要对应一段明确的责任;对不上的,不叫慷慨,叫漏洞。**

本节动作:做一张**三问自查表**,任何条款到手,对着那十个节点问三遍——①这一段谁去办?②这一段谁掏钱?③货此刻坏了谁认?三个答案填成三行,**不一致的地方,就是你必须在合同里额外写清楚的地方**。另外给PI加一行,很多新人从来没写过:在条款栏之外补一句 **"Risk of loss passes to Buyer upon..."**(风险转移条款),把那个点用大白话再说一遍。一句话,省掉一场官司。

## 13.4 CIF的反直觉点:运费卖方付、风险早转移

三条线画完,你还是有点不服。躺下前你又翻了会儿资料,翻到一句话:"CIF是装运合同,不是到达合同。"

不服的根源在哪?在于你脑子里那套国内经验:**我出的运费,货没到就是我的事。**跨境为什么反过来?这一节把机制彻底讲透,因为它是三线不重合最好的例证,也是这门生意里最贵的一个误会。

**第一层:国际货物买卖在法律构造上是"单据买卖"。**行内的说法叫象征性交货(symbolic delivery)。卖方交付的不是货,是一整套代表货的单据:提单(物权凭证,凭它在目的港提货,见16.4.1)、商业发票、保险单、装箱单。买方付款换单据,凭单据提货。**只要单据合格、装船在期限内,卖方的合同义务就完成了——哪怕在他交单的那一刻,船正沉在太平洋底。**

这听起来霸道,但换个角度就通了:**第二层,这不是霸道,是分工。**货在海上的这28-32天,买卖双方谁都控制不了它。制度如果非要去追问"谁的错",结果只能是每一次海损都变成一场跨国官司。于是国际贸易的解法是:不追问过错,直接安排一个专业的第三方来承担——**保险公司**。所以CIF才会强制卖方买保险,并把保单交到买方手上。整套设计的逻辑是一句话:**风险归买方,但补偿工具由卖方买好、交到买方手里。**

理解到这一层,你就抓住了要害:**CIF下真正该较真的,从来不是"风险几时转移",而是"那份保单够不够用"。**

于是这一节的干货全在保险的三个细节上:

**保额:惯例是发票金额的110%。**多出来的10%代表买方的预期利润和相关费用——这是CIF/CIP条款里明文规定的,不是随手加的。为什么是买方的利润?因为风险归他,货没了他损失的不只是货款,还有他本来能赚的那一笔。

**险别:Incoterms 2020下,CIF的最低要求是《协会货物条款》ICC(C);CIP的最低要求已经提高到ICC(A)。**这两个字母的差别是这一节的核心:
- **ICC(C)**保什么:船舶搁浅、沉没、触礁、火灾、爆炸,陆上运输工具倾覆或出轨,共同海损牺牲,抛货——都是重大事故。
- **ICC(C)不保什么**:偷窃提货不着、雨淋淡水浸湿、短量、破损、受潮受热、包装不当。
- **看清楚了吗?后面这一串,恰恰是帽子这种纺织品最常出的事。**
- **ICC(A)** 是一切险(除外责任清单之外全保);**ICC(B)** 在C的基础上加了地震洪水、水湿、整件落海等。

**费率:普通纺织品海运,ICC(C)大约在万分之三到万分之八,ICC(A)在万分之八到千分之一点五**(详17.7)。注意一个新人常搞错的点:**保费是按保额算的,不是按运费算的。**

现在用R&B这单把账算实。货值CAD 4,950 ≈ ¥25,740(汇率见0.3),保额按110%=**¥28,314**。
- 按ICC(C),费率取0.05%:保费 ≈ **¥14**。
- 按ICC(A),费率取0.12%:保费 ≈ **¥34**。
- **差额:¥20。**

用¥20,换掉"整批货被雨淋报废却一分钱赔不到"的敞口。这大概是全书里性价比最高的一笔支出。顺带推出一个很实用的结论:**你这单走的是双清包税,运输责任名义上在服务商身上(见13.3.2),但它的赔付上限通常远低于货值——所以哪怕走包税,只要货值上了一两万人民币,都值得自己另外买一份货运险**(见17.7)。花几十块,买断整批货的物理风险。

现在讲那个把机制钉死的事故,数字都给你留着。

一位同行做CIF Los Angeles,2,000顶棉质渔夫帽,发票金额USD 9,800(CIF价)。投保时货代问他"保哪个险别",他说"按最低的来吧",于是投了ICC(C),保费USD 6.5——他当时还觉得"保险真便宜"。

货走拼箱,他的三个纸箱靠近柜门。船到长滩港开柜,发现集装箱门的密封条老化,一路海上湿气加雨水渗进去,靠门的两箱受潮长霉,清点下来**612顶报废,按货值折USD 3,000**。

他的第一反应是:"我买的保险,我来处理。"这句话里有两个错,每个都值钱:

**第一个错:这批货的风险早在青岛装船那一刻就转给买方了。**买方仍须支付全部货款,他在法律上其实没有赔偿义务。他不知道这一点,一开口就把自己放到了赔付方的位置上。

**第二个错:即使他想帮客户去索赔,ICC(C)不保雨淋受潮。**保险公司拒赔,一分钱没有。

最后为了保住这个客户,他自掏腰包补做612顶(成本USD 1,830)+ 空运补货USD 1,620,合计 **USD 3,450**。这单的毛利是USD 1,400,赔完还倒贴USD 2,000。**而如果当初多花USD 8 投ICC(A),这3,450美元该由保险公司出。**

三条教训,一条比一条重要:①**CIF下你花钱买的保险,受益人是买方不是你**——你保的是"客户不至于血本无归",从而保住客户关系,这笔钱的性质要想明白;②**"最低险别"是Incoterms给的地板,不是给你用的标准**,纺织品至少ICC(A),退一步也要ICC(B)加淡水雨淋险;③保单必须写明**保险起讫"仓至仓"**,并按合同货币投保——保额币种和发票币种不一致,索赔时汇率的差要自己吃。

再送你一个同源的反直觉推论,它能解释一个你早晚会遇到的现象:**CIF下船期延误、货晚到,买方不能因此拒付货款**(除非合同另有约定)——延误的后果同样归他。这就是为什么**大买家几乎清一色坚持FOB**:他们要自己控制船公司、控制船期、控制运价;而中小买家更喜欢CIF和到门价,因为他们既没有能力也没有意愿去控制。**你的客户属于哪一类,直接决定你该报什么条款**——这正是下一节要给你的策略。

本节动作:如果客户坚持要CIF,三件事必须做,一件都不能省。①**把保险条款写进合同,不接受任何默认**,原文可以直接抄:"Insurance: ICC(A), 110% of invoice value, in contract currency, warehouse-to-warehouse, policy endorsed to Buyer." ②交单时把保单一并**背书转让**给买方(单证顺序见16.1),自己留一份副本。③如果你自己也想有保障,要么另买一份以自己为受益人的卖方利益险,要么干脆报CFR、让买方自己去投保。**要么保得足,要么明确说不保——最怕的就是"我买了个便宜的,以为够了"。**

## 13.5 报价策略:对工厂FOB、对客户DDP

夜里十点,你把小林那张三行报价和老纪那张报价单并排铺在小旅馆的桌上,忽然看懂了自己在这条链上的位置:**左手一份FOB,右手一份到门价,中间那一段太平洋,就是你的生意。**

这一节讲的不是技巧,是结构。你两头用不同的条款,不是投机取巧,是你这个角色的天然形状。

**先说对工厂谈FOB,三个理由。**

**理由一:FOB是工厂能力的边界,也是它报价最诚实的边界。**工厂懂帽子、懂胶州到青岛港那一小时(见6.2.1)、懂报关和退税(见8.1.1);它不懂温哥华的内陆派送费。你逼它报到门价,它只会去问一家相熟的货代,再加一道自保的系数报给你——**你付的是它的无知溢价。**这笔钱通常比你自己找货代多花20%以上,而且看不见。

**理由二:货代选择权就是成本控制权和信息权。**你自己找货代(见17.5),才能拿到三家报价、才能知道行情、才能在下一单谈判时说出"上一票0.48方到温哥华¥1,400,合¥2,900一方"这种话。工厂安排,你连运费到底多少都不知道——而运费是全链条上波动最大的一项,把这一项交出去,等于把你成本表上最不稳的那一格锁进了别人的抽屉。

**理由三:FOB价干净,可比。**三家工厂报FOB,你比的是帽子;三家工厂报CIF或到门价,你比的是三家不同货代的报价加三个不同的加价,**帽子的差异被运费的噪音淹没了**。第9章教你把一口价拆成八层(见9.1.1),同样的道理:**条款也是一层**,不同条款的报价根本不能直接比大小。

顺带回答一个必然会冒出来的念头:那能不能对工厂谈EXW,把拖车报关这一段也吃下来?对新人不建议,理由13.3.1已经说透——省几毛钱,搭进去退税和报关资质两个大麻烦。等你有了自己的报关行和稳定货量,这道题再拿出来做。

**再说对客户报到门价。**

客户要的从来不是条款,是两个答案:**到我手上多少钱、什么时候到。**Mike是开精酿酒厂的,他熟悉的是麦芽多少钱一吨、送到酒厂门口卸在哪。他不知道FOB是什么,也不需要知道。你要是报他一个"FOB Qingdao USD 2.45",他脑子里会立刻冒出七个他答不上来的问题:谁订舱?运费多少?我要不要注册CARM?关税几个点?清关谁办?——**每一个问题都是一次让他放弃的机会。**你报9.9加元到门,他只需要做一个决定:9.9乘500等于4,950,值不值。

更深一层,承接7.3.2那句"定制服务=翻译+整合+担责":**到门价把比价从"帽子多少钱"变成了"这件事多少钱"。**Mike拿9.9去比什么?去比本地促销品经销商的12-16加元(见5.5.2),你赢;他没办法拿9.9去比中国工厂的USD 2.45,因为那两个数根本不在一个口径上。**条款的选择,本身就是一种竞争策略。**

现在把R&B这一单的每一段钱摊开,这张表是本章的落点:

| 段 | 内容 | 金额(¥) | 折合¥/顶 |
|---|---|---|---|
| ① 工厂段(FOB青岛) | 货款 500×¥17.5(USD 2.45) | 8,750 | 17.50 |
| 一次性 | 制版费(版权归己,见9.4.2) | 200 | 0.40 |
| 一次性 | 打样与寄样快递(见10.4.2) | 700 | 1.40 |
| 加工 | 轻酵素洗,货款外单列(见3.3.3) | 500 | 1.00 |
| ② 出运段 | 海派专线双清包税到门,0.48方 | 1,400 | 2.80 |
| ③ 收款段 | 收款与换汇手续费约1.5%(见14.1.1) | 400 | 0.80 |
| **成本合计** |  | **11,950** | **23.90** |
| 售价 | CAD 9.90×500=4,950,按1加元≈¥5.2 | 25,740 | 51.48 |
| **毛利** |  | **13,790** | **27.60(约54%)** |

带你看这张表的两处要害。

**要害一:出运段只占成本的11.7%(1,400÷11,950),却承载了你几乎全部的"到门"承诺。**你收Mike的钱里,没有任何一行写着"运费",但你替他扛下了运输、清关、缴税、派送四件事。所以"物流服务空间"这个词的真实含义,不是你在¥2.8上面加价加了多少——**是你用¥2.8买断了一件他自己花几百加元也未必办得成的事。**算给你听:他自己走FOB,目的港杂费加报关代理加派送,保守估计CAD 400-600,摊到500顶就是0.8-1.2加元/顶,还要搭上他注册CARM、跟海关打交道的时间;而你的¥2.8/顶=0.54加元/顶,比他自己干便宜一半以上。**这个差价的来源不是你比他会砍价,是"你一年走几十票,他一年走一票"。**规模效应长在频次上,不在货值上。

**要害二:到门价的风险,一寸不剩全在你身上。**运价上涨、货被查验、税率调整、派送二次上门、地址写错重派——统统吃你的毛利。所以到门报价必须留buffer,两条规则:

- **规则一:物流段按货代报价的1.15-1.2倍计入成本**(小票、旺季取上限)。这单¥1,400×1.2=¥1,680,多出的¥280就是你的运费准备金,没用掉是利润,用掉了不心疼。
- **规则二:报价单上写明"运价随市场波动,本报价有效期30天"**(有效期口径见9.7.1),并在PI里加一句"因目的国海关查验产生的费用由买方承担",或至少设一个金额上限。**你承诺的是"包税到门",不是"无限兜底"——免费不等于无限。**

**最后讲报价单必须写清条款的三个理由**,这三条也是章末工具的骨架:

**理由一:没有条款的价格不是价格。**同一顶帽子,FOB青岛成本¥17.5、双清到门成本¥20.3,差16%;小批量走快递能差50%以上。对方看到一个数,却不知道它含到哪一段,这场谈判从第一秒就是错位的——13.2里那位赔了USD 2,730的同行,就死在这里。

**理由二:条款是出事时唯一的裁判。**货在海上进水、在港口被扣、在派送途中丢失——所有这些时刻,双方翻开合同先看的就是那一行。没有那行字,就只能各说各话,而各说各话的结果,永远是着急要货的那一方让步。

**理由三:条款决定单证责任和退税归属。**谁去报关、报关单抬头写谁,直接决定那13%的退税进谁的口袋(见9.7.3,详18.3);同样,它也决定谁能拿到进口完税凭证(见13.3.2)。这两笔真金白银,都在那一行字里定了。

收尾给你看一个对比,是这一章最实用的一课。你当初给Mike的报价邮件是这么写的:

> "CAD 9.90 per cap, delivered to your brewery in Vancouver — freight, duties and taxes included. Lead time: 30 days production + 28-32 days transit."

全文没有出现"DDP"这三个字母。而同一天你发给货代的询价是这么写的:"5箱/0.48CBM/毛重约62.5公斤,胶州提货,双清包税到温哥华门,按方报价,要28-32天时效的。"至于那份PI的条款栏,写的是:"DDP Buyer's address, Vancouver, BC, Canada (Incoterms® 2020), via air-sea consolidated service."

**对客户说人话,对供应商说术语,对合同说标准。**三张嘴,一件事,三种语言——这就是你在这条链中间的位置,也是你凭什么赚那¥27.6一顶的原因。

现在你可以回去填那一栏了。

## 本章工具

**工具一:四术语三线对照表**(打印出来贴在桌上,每次报价前扫一眼)

| 术语 | 交货点 | 责任线到哪 | 费用线到哪 | **风险线到哪** | 出口/进口清关 | 一句话适用 |
|---|---|---|---|---|---|---|
| **EXW** 工厂交货 | 卖方厂房 | ① 工厂门口 | ① 工厂门口 | ① 工厂门口 | 均买方(中国实务上办不了) | 同城、买方有中国办、寄样;新人别碰 |
| **FOB** 船上交货 | 装运港船上 | ⑤ 装上船 | ⑤ 装上船 | ⑤ 装上船 | 出口:卖方 / 进口:买方 | 中国出口主流;**你向工厂采购的标准口径** |
| **CFR** 成本加运费 | 装运港船上 | ⑤ + 订舱 | ⑥ 目的港卸货 | **⑤ 装上船** | 出口:卖方 / 进口:买方 | 客户自己买保险时用 |
| **CIF** 成本加保险费加运费 | 装运港船上 | ⑤ + 订舱 + 投保 | ⑥ 目的港卸货 | **⑤ 装上船** | 出口:卖方 / 进口:买方 | 客户要港到港;**注意三线不重合** |
| **DAP** 目的地交货 | 指定地点(未卸) | ⑨ 送达 | ⑨ 送达(不含税) | ⑨ 送达 | 出口:卖方 / 进口:买方 | 客户有税号、愿自己清关缴税 |
| **DDP** 完税后交货 | 指定地点(未卸) | ⑨ 送达 | ⑨ 送达 + 关税税金 | ⑨ 送达 | 均卖方 | **你向客户报价的标准口径**;实务多由双清包税承接 |

节点编号对照:① 工厂仓 ② 装车 ③ 拖车 ④ 报关 ⑤ 装船 ⑥ 卸货 ⑦ 目的港杂费 ⑧ 进口清关/关税 ⑨ 内陆派送 ⑩ 客户仓库。

**记忆口诀**:E组一点交(工厂门口)、F组港口交(装上船)、**C组费用远、风险近(唯一分家的一组)**、D组送到才交。

**工具二:报价口径话术卡**(三张嘴,原样可抄)

| 对谁 | 说什么 | 为什么这么说 |
|---|---|---|
| 对工厂 | "报FOB青岛,含THC和报关单证费,不含海运。装运港写青岛港全称。谁订舱我来定。" | 锁住可比性,保住货代选择权与退税链 |
| 对货代 | "5箱/0.48CBM/毛重约62.5kg,胶州提货,双清包税到温哥华门,**按方报价**,时效要求28-32天。查验费和赔付上限先说清。" | 按方报价才能横向比价;先问赔付,后谈价格 |
| 对客户 | "CAD 9.90 per cap, delivered to your address — freight, duties and taxes included. Lead time 30 days production + 28-32 days transit." | 客户只关心到手价和到货日,不需要术语 |
| 写进PI/合同 | "DDP [完整地址,写到门牌] (Incoterms® 2020)" + 另起一行 "Risk of loss passes to Buyer upon delivery at the above address." | 术语一个字不省;风险转移点用大白话再写一遍 |

**工具三:条款书写三要素与反面清单**

```
✓ 代码 + 具体地点 + 版本年份
   FOB Qingdao, China (Incoterms® 2020)
   DDP 1234 Industrial Way, Vancouver, BC V6A 1A1, Canada (Incoterms® 2020)

✗ 只写 FOB / CIF        —— 哪个港?哪一版?
✗ CIF Canada / DDP USA  —— 内陆运费差能吃掉整单利润
✗ "到门价""包税价"     —— 中文口语,合同里不算数
✗ 美国客户写 FOB + 内陆地名 —— 那是UCC口径,必须回信确认(见13.2)
```

**工具四:包税到门四问一确认**——①进口人抬头是谁?②申报品名与HS编码按什么报,能否看到申报口径?③查验产生的费用与延误算谁的、有无上限?④货损货丢赔付上限多少、按什么计?⑤(问客户)你需不需要进口完税凭证做抵扣?——需要就不能走包税。

**工具五:保险最低配置**——ICC(A)、保额=发票金额×110%、币种与合同一致、保险起讫"仓至仓"、保单背书给买方。合同原文:`Insurance: ICC(A), 110% of invoice value, in contract currency, warehouse-to-warehouse, policy endorsed to Buyer.`

> **本章作业**:找一票真实的货来问价——你手上的样品箱、1688买的一箱现货帽,甚至就假设是5箱0.5方从你所在城市发到温哥华。找**同一家货代**,要三个报价:①FOB本地港;②CIF Vancouver;③双清包税到门。拿到后做三件事:第一,把三个数填进本章的十节点物理链上,标出每一段的钱是谁出的、多出来的钱买到了哪几段服务;第二,算出**按方单价**(总价÷立方数),这才是你以后能横向比价的那个数;第三,用工具三的三要素,把这三个报价各写成一行规范条款,再挑其中一个写成完整的PI条款栏,后面补上那句"Risk of loss passes to Buyer upon..."。做完这三步,你会发现一件事:三个报价里最便宜的那个,通常是把最多的活留给了你——**而看懂"留给谁"这件事,就是这一章全部的价值。**

*条款填完了,订舱确认也签回给了小林。可紧接着的问题比条款更硬:货一装船,那70%的尾款该在哪一天、以什么方式、凭什么单据到你的账上?定金是三成还是五成才算安全?收美元还是加元,汇率的那两个点谁来吃?这一章讲的是"货怎么交",下一章讲"钱怎么收"——两件事各管一半,合起来才是一单完整的外贸。下一章:[第14章 付款方式](chapters/ch14.md)*
