| **真实净剩** | **4.93** | **净利率 24.7%** |

两个数字要单独拎出来讲,因为它们解释了这门生意的全部性格。

**第一个:广告摊销为什么是 $2.50。**服饰类目的点击单价常在 **$0.6-1.2**,页面转化率 **8-12%**。你随手一算:一次转化要点十次,单次点击八毛,一单广告成本 $8——那上面那张表岂不是全崩?这里有个几乎所有新手都算错的地方:**广告费要除以"总订单",不是除以"广告带来的订单"**。一条成熟链接,自然搜索位和类目推荐会白送你六到七成的单,广告只负责剩下的三成。三成订单每单花 $8,摊到全部订单上就是 $2.4——差不多就是表里那个 $2.50。这个比值有个行业名字叫 **ACOS(广告花费占销售额的比例)**,这里是 2.50÷19.99 ≈ **12.5%**,是一条健康成熟链接的典型水平。

反过来读这句话,你就懂了新品期为什么必死:新链接没有自然位,**100%的订单都得靠广告买**,单单成本 $8,ACOS 冲到 40%——表里那个 $2.50 变成 $8.00,净剩直接变成 **−$0.57,每卖一顶亏五毛七**。这不是运营水平差,这是结构性的:你在花钱买评论、买排名、买自然位。**亚马逊卖帽子,前三个月本来就该亏,能不能活取决于你有没有算准要亏多久、亏多少。**

**第二个:头程为什么是 $1.20。**上一节给了两条路——海运 $0.55、空派 $1.5 上下。这里取 $1.20,是"首批空派抢上架、后续海运补仓"的混合口径。而这一格恰好是全表里**你最容易自己动手改掉的一格**:如果你有耐心提前四十天备货、全部走海运,这一格从 1.20 降到 0.55,**每顶净利立刻多出 $0.65**。$0.65 是什么概念?它等于你的广告预算可以多出 26%——在一个所有人都在拼广告的类目里,这可能就是你比对手多活一年的原因。**供应链的从容,最后都会变成广告位上的火力。**

现在做敏感性测试,这是本节真正的价值。表里其它格不动,只动一格:

| 情形 | 广告摊销 | 真实净剩 | 净利率 |
|---|---|---|---|
| 成熟链接(基准) | 2.50 | 4.93 | 24.7% |
| 竞争加剧,ACOS 20% | 4.00 | 3.43 | 17.2% |
| 旺季混战,ACOS 30% | 6.00 | 1.43 | 7.2% |
| 新品期,ACOS 40% | 8.00 | −0.57 | 亏损 |

看清楚这条曲线的斜率:广告费从 $2.50 涨到 $4.00,只多花一块五,净利就掉三成;涨到 $6.00,净利掉七成一。**广告费是这张表里唯一一个不受你控制、且长期只会上涨的变量**——它由竞争对手的出价决定,而你的对手在变多。7.2.3 说过"广告费就是新房租,而且这个房东天天涨价",这张表就是那句话的账面证据。

由此得到**第一条生死线**:令净剩为零,反解广告费 = 2.50 + 4.93 = **$7.43**,对应 ACOS = 7.43÷19.99 ≈ **37%**。背下来:**你的 ACOS 一旦长期站在 35% 以上,你就是在给平台和竞价对手打工**,卖得越多亏得越多。这条线要贴在你显示器边上。

**第二条生死线关于价格带**,它比第一条更狠。很多新人的第一反应是"我降价冲量",那我们把售价降到 $14.99 试试:佣金随价下降到 2.25,退货损耗降到 0.60,**但配送费、头程、货值、仓储、广告这五项一分钱都不会变**——它们是按件按方按点击收的,不看你卖多少钱。算下来:14.99 − 2.25 − 4.50 − 1.20 − 2.50 − 2.50 − 0.60 − 0.43 = **$1.01**,净利率 6.7%。**售价降了 25%,净利掉了 80%。**再往下,$12.99 那一档直接为负。所以结论是反直觉的:**亚马逊帽子类目最惨烈的 $12.99-14.99 价格带,不是"薄利多销"的战场,是一台绞肉机**;能常年待在那里还活着的,只有自有工厂(货值 $1.5 以下)或者根本不打算赚钱只想清库存的人。对你这个从中国供货的人来说,**$17 是这顶帽子的价格地板**,低于它就不要进场。

最后把整个类目的口径给你,便于以后判断任何一个卖家客户跟你说的话是真是假:**做得好的亚马逊帽子卖家,净利率 20-25%;正常水平 12-18%;大量卖家常年在 5-8% 挣扎;新品期前三个月普遍在 −20% 到 0 之间。**谁跟你说"我们帽子链接净利四十个点",你可以微笑,然后请他把配送费和头程那两格填给你看。

本节动作,把这张表做成 Excel,并且**只锁死三格**:货值、头程、配送费——这三格是供应链决定的,是你(作为供货方)能替客户改善的部分;其余各格交给运营。以后任何一个亚马逊卖家来问你价格,你不要只报 ¥17.5,你把这张表填给他看,然后指着头程那一格说:"你现在这个包装方案,配送费在大号标准件档;我改一版包装方案,有机会压到小号标准件,每顶给你省一块二——比我在出厂价上让你五毛管用。"这句话说出来,你就不再是一个报价的,你是一个懂他生死线的人。

## 22.2 Etsy:定制单履约

换一个完全不同的地方。你在 Etsy 上搜 "personalized embroidered hat",页面的气质立刻变了:没有整齐划一的白底图,取而代之的是木桌上的实拍、手写体的标题、"Custom Name Hat, Gift for Her, Bridesmaid Proposal"这样的一长串场景词。价格也变了——同样一顶六片棒球帽,亚马逊那边 $19.99 挤破头,这里挂 **$28-45**,而且卖得动。

差别的根源只有一句话:**亚马逊卖的是"一顶帽子",Etsy 卖的是"绣着你名字的那一顶帽子"**。前者是标品,买家会横向比价,所以价格必然被压到成本线;后者是唯一品,没有第二个链接可以比,买家付的是"独一无二"的溢价。这也是为什么 Etsy 平台调性天然反工业化:它的用户来这里就是为了买"不是流水线上下来的东西",你若把亚马逊那套主图和文案原样搬过来,转化率会低得让你怀疑人生。

先把它的费用算清,免得被高客单价迷惑。**上架费 $0.20/listing,有效期四个月**;**交易费 6.5%**;**支付处理费约 3% + $0.25**;还有一项容易被忽略的 **offsite ads(站外广告分成)**:平台替你在站外投放带来的成交要抽 **12-15%**,而对年销超过一定门槛的卖家这项是**强制参加不能关闭的**。以一顶 $34.99 的定制帽为例:交易费 2.27 + 支付处理 1.30 + 上架摊销 0.05,平台常规抽走约 **$3.62,约 10.3%**——比亚马逊的 15% 低不少;但若这一单来自 offsite ads,再加 $4.55,综合成本一下跳到 **23%**。所以你的平台成本不是一个数,是一个区间:**10%-23%,取决于订单从哪来**,而这个来源你控制不了。

**listing 怎么做**(listing见22.1.1),三件事和亚马逊完全不同。**第一,标题写场景不写参数。**亚马逊标题堆的是"6 Panel Cotton Twill Adjustable",Etsy 的标题公式是"品类词 + 个性化词 + 场景词 + 受众词":Custom Embroidered Dad Hat, Personalized Name Cap, Bridesmaid Gift, Gift for Golfer。搜索词的战场在"送礼场景",不在"面料克重"。**第二,图片必须让买家看见"我的字"。**主图之后的第2-4张,一定要是不同名字、不同字体、不同线色的实拍或效果图(mockup 怎么做见22.4.1)——买家买的是想象力,你得把想象成本降到零。**第三,开个性化选项(personalization)。**这是 Etsy 独有的一栏:买家在下单时直接填文字。你要在这一栏里设死三件事:字符数上限(常规刺绣一行文字建议 ≤12 个字符,平台栏位可放到45,别放这么宽)、可用字符范围(明确写"仅支持 A-Z、0-9 与空格")、字体与线色选项。最后设好 **processing time(备货期)**,这是 Etsy 卖家对买家做出的发货承诺天数,定制帽通常设 3-5 个工作日——设短了你天天赶工,设长了转化率掉。

现在讲这一节真正的难题:**一顶起,怎么做?**

Etsy 的订单形态就是一顶、两顶、偶尔一顶送闺蜜的十顶。而你在第6章学到的所有路子都是几百顶起步的——国内工厂没有任何一家会为一顶帽子开机。这个矛盾有三条解法,各有各的账。

**解法一:现货帽 + 成品绣花(见4.3.3、6.5.1),中国直发。**从义乌拿一批白帽压在手上(¥8/顶),收到订单当天上帽绣机绣(成品帽绣花 ¥2.5-3.5/顶,取 ¥3),塑袋装,走邮政小包或专线小包发出去,**$3-5/件,15-25天**。算一遍:$34.99 − 平台费 3.62 − 帽子 1.13(¥8) − 绣花 0.42(¥3) − 包装 0.10 − 尾程 4.00 = **$25.72**。数字漂亮得吓人。但它有两颗雷,而且都是致命的。第一颗是**时效**:Etsy 买家的心理预期是三到七天到货,你交15-25天,评价区会写满 "took forever";而定制品按平台规则通常不支持无理由退货,买家不能退,就只能给你一星。第二颗是**关税与报关**:小包过去靠的是各国的 **de minimis**——低值小包的免税免报门槛(见18.4.2)。这道门这几年在快速关闭:美国已在2025年终止了对全球来源小包的 de minimis 待遇,每一个小包都要走报关、缴税;加拿大的门槛本来就低得可怜(邮政渠道 CAD 20)。**"从中国一顶一顶直发"这个模式,已经被时效和关税一起压垮了**,今天还在这么干的人,大部分是在用差评和退款补贴运费。

**解法二:海外备货 + 本地绣花履约。**把无 logo 白帽(blank cap,见5.4.1)整批海运到目的国的自有小仓或第三方仓,收到订单后在本地绣、本地发。本地采购 blank cap 是 $3-8/顶(见5.4.1),而你从中国海运过去,单顶落地成本约 ¥8 + 头程 ¥3 = ¥11 ≈ **$1.55**——**这就是你相对本地卖家的全部优势所在**,一顶省下两到六美元。本地绣花如果外包,北美行价 $2-4/位置;若自己置一台单头帽绣机(二手一两万人民币),边际成本降到线材加电费。尾程用本地小包 $4.5-6,**三天到货**。这条路的账:34.99 − 3.62 − 1.55 − 3.00 − 0.50 − 5.00 = **$21.32**,比解法一少赚四块多,但它是**唯一能长期活下去的结构**。

**解法三:接单后批量攒单发。**攒够一周的订单一起从中国空派到本地再分发。它是解法一到解法二之间的过渡姿势,适合月单量二三十的起步期,不展开。

一段对话,记住它能省你一次退款。一位买家在个性化栏里填了 "Sarah ❤️ 2026",还有一位填了一整句祝福语外加两个表情。刺绣机绣不出 emoji,长句超出可绣区(见3.1.2:六片帽前幅可绣区约高5.5×宽10cm)。更麻烦的是第三位:她把自己的名字拼成了 "Jenn",而她其实想要 "Jen"——你照填的字绣了,她收到货说"你绣错了"。这三件事的解法是同一个动作,行内叫**回读确认**:订单进来后两小时内,系统邮件或人工发一封,正文只有一行,大写、加粗、单独成段:

```
Your hat will be embroidered exactly as: SARAH
Font: Block  |  Thread: Cream #1001  |  Position: Front center
Please reply CONFIRM within 24 hours. We start stitching after your reply.
```

这一封信同时解决了三个问题:拼写责任转移给买家、不可绣内容当场发现、买家收到一封"有人在为我干活"的信(这封信本身就在拉高好评率)。

本节动作,把 Etsy 定制单的三道闸口写进你的 SOP:**一闸**,个性化栏加字符上限与字符集说明,把不可能的需求挡在下单前;**二闸**,下单后24小时内发回读确认信,不回复不开工,开工时间从回复起算;**三闸**,发货前拍一张实物照连同物流号一起发给买家。三道闸口全部是零成本的,而它们挡掉的是这条业务线上90%的纠纷。

## 22.3 TikTok Shop与独立站:流量逻辑差异

把三个地方摆在一张桌上,你会发现它们的差别根本不在"平台功能",在**流量从哪来**。

**亚马逊是搜索意图流量。**打开 App 的人,已经决定要买帽子了,他只是在选哪一顶。你不需要说服他"帽子是个好东西",你只需要让他在众多帽子里选中你——所以那里的竞争全部发生在"被看见"和"比价"上,而平台把这两件事都做成了拍卖(见22.1.1)。

**TikTok 是兴趣流量,行话叫"内容找人"。**刷视频的人根本没打算买任何东西。他刷到一段十五秒的画面:十二个绣花机头同时下针,金黄的线在藏青布上一点点长出一支麦穗;他看完,才产生"我也想要一顶"的念头。**需求是被内容创造出来的,不是被搜索栏承接的。**这是一种完全不同的生意物理学:在亚马逊你要打赢竞价,在 TikTok 你要打赢注意力。

**独立站是零流量,叫"人找内容"。**你自己搭的网站,上线的第一天访客是零,第二天还是零,直到你从别处把人带过来。这是新人最大的认知误区,值得用一句话钉死:**独立站不是渠道,是容器。它不产生流量,它只承接流量。**

三者的成本结构也因此完全不同,拿一顶 $29.99 的帽子对比着看:

| | 平台抽成 | 流量成本 | 固定成本 | 流量归谁 |
|---|---|---|---|---|
| 亚马逊 | 佣金15% + 配送费约22% | 广告 12-25%(ACOS) | 月租 $39.99 | 平台 |
| TikTok Shop | 佣金约 6-8% | 达人佣金 10-20% 或投流 | 低 | 平台 |
| 独立站 | 支付 2.9%+$0.30 | 广告 CAC $10-14/单(见7.2.3) | Shopify $39/月起 | 你 |

读这张表要看两层。表面上 TikTok 的抽成最低——只有 6-8%,比亚马逊的 15% 便宜一半还多;但它的流量成本换了个形式:你要么给达人佣金(带货抽成 10-20%),要么自己投流,要么自己拍——**自己拍是唯一一条"成本可能趋近于零"的路,代价是它吃你的时间,而且没有任何投入产出的确定性**。第二层更要紧:最后那一栏。亚马逊和 TikTok 的买家不是你的买家,他们是平台的买家,平台随时可以不把他们给你;只有独立站上留下的邮箱和复购记录,才是你自己的资产。**平台省事,但你租的是别人的地;独立站辛苦,但地是你的。**

**帽子在 TikTok 上到底该发什么内容?**答案已经在你身上了:**工厂过程视频最吃香**——绣花机同时下针的特写、裁床上一层层铺开的布和自动刀走过的那一下、蒸汽定型时帽子被撑起来的那三秒、成品从流水线尽头一顶顶落进箱子。海外用户对"中国工厂内部"的兴趣远超你的想象,这背后的原理和完整的选题库是第23章整章的内容,这里只给你结论和一条纪律:**你手里有一样99%的海外卖家没有的东西——你能站在车间里**。这不是你的额外技能,这是你的地理红利。

但 TikTok 卖定制帽有一个硬冲突,必须提前想明白:**短视频的转化是即时的,定制的交付是滞后的。**观众看完视频那一刻的购买冲动只有几十秒的窗口期,而你的定制单要打样、要生产、要跨洋,交期以周计。这个冲突有个标准解法:**用现货款承接冲动,用定制单承接需求。**橱窗里挂的是可以立刻发货的现货款(纯色帽、已有图案的款),它负责把流量变成第一批订单和粉丝;而真正的定制业务藏在主页链接和私信里——视频结尾那句 "We do custom logos for gyms and breweries — link in bio" 才是你真正的钩子。一条视频同时喂两条业务线,这是帽子这个品类在内容平台上最合理的姿势。

**独立站什么时候该建?**三个条件,缺一个都别动手:第一,你已经有稳定的流量来源(内容账号在涨、或已有客户名单);第二,你的产品有复购逻辑;第三,你有能力在时差里承接客服和售后。三条都满足才建站。先算它的账:Shopify 基础版 **$39/月**,主题 $0-350 一次性,必装插件(表单、评价、邮件)月付 **$50-150**,域名年费几十块,再加建站的时间——**起步年成本 $600-1,500**。如果你月销做不到 $3,000,这些固定成本摊到每一单就超过 3 美元,比亚马逊的月租摊销还贵。

一个典型的翻车,行业里每个月都在发生:有人一入行先花 ¥8,000 找人做了一个精美的独立站,产品页、购物车、多语言、支付网关全齐,上线三个月,**总访客 217 人,订单 0**。他做错的不是站,是顺序——**他给一个还没有流量的生意建了一个只能承接流量的容器**。正确顺序永远是:先在有流量的地方(平台或内容)证明产品能卖,再建站把流量沉淀成自己的资产。

最后一层反转,是这一节留给做定制的你最有用的东西:**做定制业务的独立站,根本不需要购物车。**你的客户不会在网上直接下单买500顶帽子,他会先问价。所以你需要的不是一个电商站,是一个**询价站**:一页纸,四个板块——你是谁(两句话+一张车间照)、作品集(十二张实拍,每张标客户类型和数量)、价格菜单(22.4.2那张表直接贴上去)、询价表单(22.4.1讲怎么设计)。这样一个站,用免费建站工具一个下午能做完,成本是一个域名钱,而它的转化能力远超那个 ¥8,000 的购物车。

本节动作,按顺序做两件事,别跳:第一,今天就去把你未来那一页询价站的四个板块内容准备好——**先准备内容,后选工具**,因为卡住所有人的从来不是工具;第二,给自己定一条纪律并写下来:**在内容账号带来第一个真实询盘之前,建站预算是零。** 

## 22.4 定制业务流程设计

### 22.4.1 询价到交付动线与mockup工具

Dana 那封邮件已经在收件箱里躺了两个小时,你还没回。不是不想回,是不知道从哪句话开始:先问数量?先报价?先问 logo 文件?这种卡壳感每个新人都有,而它的根源是——**你没有动线**。

**动线**,指一笔询盘从进来到交付要走的固定路径,每一步做什么、谁做、多久、交付什么,全部预先定死。有动线的人回邮件从不卡壳,因为他不是在"想怎么办",他是在"执行下一步"。定制帽业务的标准动线长这样:

```
询价表单 ──→ 需求确认 ──→ mockup效果图 ──→ 报价
   2h内         24h内          24h内         随mockup同发
    │
    └──→ 打样(可选) ──→ 下单收定金 ──→ 生产 ──→ 交付 ──→ 7日回访
           5-7天             即时          见交期      拍照      转介绍钩子
```

逐段讲,重点在前四段——**成交与否在前四段就决定了,后面全是执行。**

**第一段,询价表单。**别让客户"随便说说",让他填表。表单只设七项,一项都不能多:数量、要货日期、logo文件上传、帽型(配图三选一)、颜色、预算区间、用途(活动/员工/零售)。为什么是这七项?因为你报价所需的全部输入就是这七项,少一项你就得多来回一封邮件。为什么不能更多?因为**表单每多一个必填项,提交率掉一截**,而"用途"这一项看着最没用,其实最值钱——它告诉你这单的价格敏感度和翻单可能性(员工帽年年做,活动帽一次性)。表单放在你那一页询价站上(见22.3),也放在你所有账号的主页链接里。

**第二段,需求确认,两小时内回。**时限不是客气,是竞争:定制帽客户几乎从不只问一家,**首回速度直接决定你在他心里的位次**(时差与首回速度的完整打法见23.4.2)。这一封回信只做三件事:确认收到、指出一个他没想到的问题、承诺下一步的时间。比如给 Dana 的回信里,那个"他没想到的问题"就是——"你说80顶,我想确认一下:这80顶是发给已经报名的会员,还是要留一些给之后新入会的?如果是后者,我建议留出10顶余量,因为这个款是市场现货,三个月后不一定还有同一批。"这句话的作用不是问信息,是**当场证明你懂这件事而对方不懂**。

**第三段,mockup,24小时内出,这是整条动线上转化率最高的一环。**

**mockup**(效果图/套图),指把客户的 logo 合成到帽子照片上,做出"仿佛已经做好了"的成品图。它为什么这么有效?两层机制。第一层是**想象成本**:客户脑子里没有"我的 logo 在一顶炭灰色帽子上"的画面,而人不会为自己想象不出来的东西付钱;你替他把这张图生成出来,决策难度从"要不要做"降到"选哪个"。第二层更微妙,是**互惠信号**:你还没收他一分钱,就已经为他干了活——收到一张为自己定制的效果图,对方会自然产生一点亏欠感,这一点亏欠感就是你的报价能守住的原因。

行业里的经验口径:**只发文字报价的询盘,转化率大致 10-15%;附一张 mockup 的,能到 30-40%**。同样是十个询盘,一个成交一个半,另一个成交三个半——而做那张图,只要十五分钟。

**怎么做,零成本。**你需要的只有三样:一张你自己拍的白帽平铺照(拿一顶白帽子平铺在纯色台面上,自然光,手机拍,这就是你永久的模板)、客户的 logo 文件、任何一个能做图层混合的工具。步骤四步:①把 logo 图层叠到帽子前幅位置;②图层混合模式改成"正片叠底"(multiply),这一步让 logo 跟着帽子表面的明暗走,不再像贴纸;③沿帽子弧面轻微变形(专业做法是用置换贴图,免费替代是手动拉一点透视);④加一点点噪点或纹理,模拟绣线的质感。会 Photoshop 的用置换贴图三分钟,不会的用免费在线工具堆图层十五分钟。**十五分钟,换转化率翻倍,这是这本书里投入产出比最高的一个动作。**

再给你一条**三张图法则**:永远发三张,不发一张。同一个 logo,做三个版本——比如给 Dana 的三张是:炭灰帽+白线、藏青帽+米色线、炭灰帽+logo 缩小两成放高一点。三张图把邮件的性质变了:一张图问的是"你要不要",三张图问的是"你选哪个"。人对"要不要"的默认答案是"再想想",对"选哪个"的默认答案是伸手指一张。

**第四段,报价随 mockup 同发。**不要先发图再等他问价——那是白白多耗一个来回。报价怎么组织,下一节整节讲。

一个必须防的事故。有人把 mockup 做得极其精致:高精度渲染、绣线纤毫毕现、光影完美。客户看得两眼放光,当场下单;货到手,他把实物和那张图并排一放,脸就沉了——真实的平绣是有针脚、有轻微起伏、颜色也不可能和屏幕上分毫不差的(同色异谱的原理见1.4.2)。这一单最后以退货和一条差评收场。**mockup 的职责是帮客户看懂,不是让客户惊艳。**所以定一条硬规矩:每一张 mockup 的角落必须带一行小字,英文原句抄走——

```
For visual reference only. Actual embroidery colour and detail may vary.
Final thread colours to be confirmed by physical thread card / PMS reference.
```

并且在邮件正文里跟一句:"线色以我寄给你的样带为准"(样带与"最接近"线色逻辑见3.1.8)。这两句话花不了你十秒,它挡掉的是整单的钱。

本节动作三件:第一,今晚拍一张你自己的白帽平铺模板照,存进一个叫"mockup模板"的文件夹,以后每一单都从它开始;第二,把上面那七项询价表单做出来,今天就上线;第三,给自己立一条时限纪律并贴在桌上——**询盘2小时内回,mockup 24小时内出**。这条纪律不需要任何天赋,它只需要你比对手勤快一点,而它带来的成交差距,比你降价一加元大得多。

### 22.4.2 规则产品化:起订量、加价、交期写成菜单

回到 Dana 的80顶。你现在有动线了,但还有一个更根本的问题没解决:**你到底能接多少顶起的单?**

这个问题你至今回答不了,因为你一直是"看情况"——客户来了,你去问工厂,工厂说不行,你再去想办法。三个月下来你会发现,你80%的时间花在了三个永远重复的问题上:"最少多少顶?""多久能拿到?""多少钱一顶?"每一个新询盘都要从头再答一遍。

解法叫**产品化(productize)**:**把每次都要谈的东西,写死成公开的规格与价格。**它的对象不是帽子,是**你的服务本身**——把"接单"变成一件有型号、有价目、有交付标准的商品。做完这件事,上面那三个问题会在客户点开你链接的第一秒被回答完毕,而你的邮件量会掉八成。

先把菜单做出来。核心洞察是:**不同的量,对应的根本不是不同的价格,是不同的生产路线**——路线不同,起订量、交期、能定制的深度全都不同。所以菜单必须**按路线分档**,而不是按数量打折。

**定制帽服务菜单(到门价,加元/顶)**

| | 档一 · 快单 | 档二 · 快反定制 | 档三 · 标准定制 |
|---|---|---|---|
| 做法 | 市场现货帽 + 成品绣花 | 快反厂现货色布定制生产 | 中型厂正规定制生产 |
| 起订量 | **50顶** | **100顶** | **300顶** |
| 交期(到门) | 10-12天 | 25-30天 | 40-45天 |
| 可定制 | logo、帽色(限现货色) | logo、帽型、辅料、包装 | 全部,含面料与版型 |
| 50-99顶 | **12.00** | — | — |
| 100-199顶 | **10.90** | **15.90** | — |
| 200-299顶 | **10.20** | **13.90** | — |
| 300-499顶 | **9.50** | 13.00 | **10.90** |
| 500-999顶 | — | — | **9.90** |
| 1000顶+ | — | — | **8.90** |

**加价项(add-on)**

| 项 | 价格 | 说明 |
|---|---|---|
| 制版费 | CAD 40 一次性 | 首单收,翻单免,版权归客户(见3.1.5) |
| 增加一个绣花位置 | +1.20/顶 | 侧幅或后幅 |
| 3D立体绣 | +1.80/顶 | 见3.1.7,需 logo 笔画≥3mm |
| 定制织唛主标 | +0.35/顶(或一次性 90) | MOQ 1000枚,见2.3 |
| 定制吊牌 | +0.30/顶 | |
| 单顶独立塑袋 + 贴条码 | +0.25/顶 | 电商客户必选,见4.6.4 |
| 打样 | CAD 60/顶 | 满100顶下单冲抵 |
| 加急插单 | 订单额 +10% | 压缩交期约30%,见4.7.3 |
| 空运升级 | 按实际报,50-100顶档约 +2.5-3.5/顶 | |

这张表有几处设计,不是随手写的,逐个说破。

**第一,档二比档三贵,而且贵得多。**100顶的快反定制报 15.90,300顶的标准定制才报 10.90——量少了三分之二,单价却高出五块。新人常以为这是"欺负小客户",恰恰相反,这是**把成本结构诚实地翻译给客户看**:一次开机、一次调机、一次头程运费,摊在100顶上就是摊在100顶上。而这张表的销售效果是自动发生的:客户看着 200顶13.90 和 300顶10.90 这两行,会自己算出"多订100顶,总价只多一点点,单价便宜三块",然后自己把量加上去。**好的菜单会替你做加单这件事,你一句话都不用说。**

**第二,档一在300顶的价格(9.50)低于档三(10.90),这不是错。**现货帽本来就便宜——它的货值是 ¥8,标准定制是 ¥17.5(见9.1.1),差一倍多。价格差反映的是货本身的差别,而不是你的良心差别。这一点必须在菜单上写清楚,4.3.3 那句话直接搬过来当作档位说明:"档一的帽子是市场通货,克重、辅料、版型以当期现货为准,我们不作规格承诺;档二档三的帽子是按你的规格做的。**两个价对应两种货。**"

**第三,报的是标准价,不是最低价。**每一档都要留出让步空间,因为客户砍价是必然动作(让步阶梯见15.4.2)。菜单价当作阶梯的第一级,你手里始终留着"数量上一档""免制版费""免空运升级"这三张不动价格的牌。

**第四,交期从"确认之日"起算,并且写在表上。**交期条款的起算点是全书反复强调的雷区(见4.7.3、15.5.1),菜单上那一栏必须加一行小字:"交期自定金到账与效果图确认孰晚之日起算。"

现在讲**为什么明码标价能省掉八成沟通**,这里有三层效果,一层比一层值钱。

**第一层,前置。**三个必答问题(多少起、多久、多少钱)在客户点开链接的第一秒就被答完了,你的第一封回信不用再写这些,可以直接写 mockup 和方案。粗算:一个询盘原本要来回5-6封才进入实质讨论,有菜单后是2封。

**第二层,筛客。**这一层是新人最想不到的:**菜单会让你的询盘量下降,同时让成交率上升。**预算只有5加元的客户看到12.00 那一行,自己就走了——他没有浪费你的时间,你也没有浪费他的。**你要的从来不是询盘数,是询盘质量。**

**第三层,守价。**这一层最值钱。当客户砍价时,没有菜单的你只能说"这个价真的很低了"——软弱、可疑、可以继续砍;有菜单的你说的是:"这是我们的公开价目,任何客户同样数量都是这个价。您要是能到300顶,我马上按 9.50 那一档给您重开报价单。"**同一句拒绝,一个听起来像讨价还价,一个听起来像制度。**制度是砍不动的,而这份"砍不动"是你自己写出来的。

**现在回到 Dana 的80顶。**答案在菜单上,一目了然:**档一,50顶起,CAD 12.00/顶,10-12天到门。**

把账算完整(汇率口径 1加元≈¥5.2,见0.3):

| 项 | 金额 | 说明 |
|---|---|---|
| 现货帽 | ¥640 | ¥8 × 80顶(见6.5.1) |
| 成品绣花 | ¥240 | ¥3 × 80顶,logo 约6000针 |
| 制版费 | ¥200 | 一次性,翻单免(见3.1.5) |
| 塑袋 + 外箱 | ¥16 | 80顶,一箱(见4.6.1) |
| 空运到温哥华 | ¥800 | 一箱0.096方,计费重16kg,约¥50/kg |
| 收款换汇成本 | ¥75 | 约1.5%(见14.4) |
| **成本合计** | **¥1,961** | |
| 收入 | ¥4,992 | CAD 12.00 × 80 = CAD 960 |
| **毛利** | **¥3,031** | **单顶 ¥37.9,毛利率 60.7%** |

现在把这一单和 R&B 那一单摆在一起看,你会看到两个完全不同的故事:

| | R&B 500顶 | Cedar Room 80顶 |
|---|---|---|
| 单顶毛利 | ¥27.6 | **¥37.9** |
| 毛利率 | 约54% | **60.7%** |
| 总毛利 | **¥13,790** | ¥3,031 |
| 你投入的时间 | 两个多月,含驻厂一周 | 约10个工时 |
| 按小时算 | 低 | **高得多** |
| 你能承诺的规格 | 全部 | 几乎没有 |

**单顶更肥、总额只有五分之一、时间效率高得多、可控性低得多**——这就是"故事不同"的全部含义。别急着下结论说哪个更好,先看懂这单真正的价值在哪:它不在这 ¥3,031。它在三处。**其一**,Cedar Room 有四百多个会员,这80顶帽子会戴在四百个人里最活跃的那八十个身上,而瑜伽馆的会员群体和"想要定制帽的小商家"高度重合——这是一个入口。**其二**,它证明了"50顶起"这句话是真的,而这句话是你菜单上最贵的一行,是你和所有只做大单的同行之间的护城河。**其三**,Dana 是 Mike 转介绍来的;你把这单做漂亮,Mike 会继续转介绍——这条链条怎么系统地经营,是第24章的事。

最后必须处理一个尴尬,不处理迟早出事:**Dana 付 12.00,Mike 付 9.90,而他们认识。**没有菜单的话,这是一颗随时会炸的雷;有了菜单,它连雷都不是——公开价目上白纸黑字写着 500顶档 9.90、50-99顶档 12.00,量价对应关系人人可见。Mike 看到只会点头。**产品化真正的作用,是让你不需要对任何一个客户隐瞒你给另一个客户的价格。**

本节动作,今天就把你自己的那张菜单填出来,一页 A4,三档表加一张加价项表,存成 PDF,发到你的询价站和所有账号主页。再加一条纪律:**菜单价一年一调,调价前给所有老客户提前30天邮件通知**(涨价话术见24.3)。菜单一旦公开,它就不只是价目表了——它是你的产品说明书,也是你守价的挡箭牌。

## 22.5 本地化打法:样品包、上门SOP、交付体验

前面四节全在讲屏幕里的生意。这一节讲街上的。

先破一个误会:"本地"不是指温哥华。你在中国,你的"本地"就是你现在住的这座城市——而中国的定制帽需求一点不比北美少:健身房、精酿酒吧、剧本杀店、机车俱乐部、宠物医院、公司行政部、学校社团、婚庆、露营装备店。这些客户的共同点是:量小(几十到几百顶)、决策快、付款爽、对价格不那么敏感,而且**没有一个会出现在阿里国际站的询盘里**(见21.1)。你要走出门去找他们。

**为什么定制帽是极少数适合"扫街"的外贸/贸易品类?**五个条件同时成立,而这五条同时成立的品类真的不多:

**其一,客户可见。**你的目标客户是"有 logo 的实体店",而 logo 就印在他的门头上、杯子上、玻璃门上——**你的潜在客户把他的需求写在了脸上**,你走在街上就是在做客户名单调研。你卖轴承、卖化工原料、卖注塑件,没有任何一条街可以扫。

**其二,决策人在场。**小店老板通常就在店里,一顶帽子几千块钱的单,他不需要走采购流程、不需要三家比价、不需要报预算——他当场就能拍板。这一条决定了扫街的转化周期是"周"而不是"季度"。

**其三,单值适中。**一单 ¥3,000-10,000:大到值得你专门跑一趟,小到老板不用请示任何人。

**其四,样品可携带。**你的整条产品线可以装进一个帆布袋背在肩上。这是帽子的物理特权。

**其五,可即时演示。**现场用手机拍下他的门头 logo,当晚做出 mockup(见22.4.1)发过去——**从"陌生人"到"已经为你干过活的人",只需要一个晚上。**

好,开始动手。第一件事是**样品包**。

样品包不是"随便带两顶帽子",它是一件精心设计的产品,配置如下:**6-8顶不同帽型**——六片棒球帽、dad hat、trucker、渔夫帽、beanie、visor 各一顶(帽型定义见2.1.2),让老板一次看完全部可能性;**一张面料卡**——把你手里的布头剪成 8×12cm 的小片,订在硬卡纸上,标注成分、克重、单价档(面料卡见1.3.1);**一张价目卡**——就是22.4.2那张菜单,印成一张对折卡;**一张 mockup 示例图**;全部装进一个帆布收纳袋。

算它的成本:现货帽 ¥8×8 = ¥64;八顶各绣一个 logo,¥3×8 = ¥24;制版 ¥200(一次性,而且你以后每一顶样品都用它);面料卡的布头是问档口要的,近乎零成本,卡纸 ¥10;价目卡印刷 ¥30;帆布袋 ¥25;再加两顶特色工艺款(一顶3D立体绣、一顶贴布绣)¥40。**合计约 ¥390,一次性投入,能用两年。**

这里有一个设计要点,九成的人做错:**样品帽上绣的必须是你自己的 logo,不是随便找的图案。**为什么?因为这样一来,你送出去的每一顶样品同时是三样东西——产品样、名片、和一顶会被人戴出去的广告。再加一个细节:在每顶样品帽的内侧汗带上缝一张小标,写"档一 / CAD 12 / 50顶起"或者对应的人民币价——**让样品自己报价**,老板翻帽子的那一下,价格就进了他脑子,而你一个字都不用说。

第二件事是**上门 SOP**,分三段。

**预约与时机。**最优解是不预约,直接进店——但要挑对时间:餐饮避开 11:30-13:30 和 17:30-20:00;健身房避开晚上7-9点;瑜伽馆挑课与课之间的空档;酒吧下午2-4点最松。进门第一句话决定成败,记住一条原则:**先给,再要。**错误示范:"你好,我是做定制帽子的,想问一下你们有没有需求?"——这句话在对方耳朵里等同于推销,大脑自动关门。正确示范:"你好,我路过好几次了,你们门头这个 logo 做得真好看。我是做定制帽的,这顶送你,不用还。能占你三分钟吗?"两句话的差别在于:前者索取,后者给予;前者要他做决定,后者不要他做任何决定。

**十五分钟里讲什么。**其实三分钟就够,四个动作,顺序不能乱:

① **先递帽子,不递名片。**让他上手摸——摸帽子是个下意识动作,一旦他接过去翻看,谈话就已经开始了。名片放最后。

② **问一句,然后闭嘴。**"你们平时给会员/员工发点什么?"——这一问的价值在于**让他说**。他会告诉你他去年做过什么、花了多少、哪里不满意,而这些正是你报价的全部依据。新人最大的毛病是进门就开始讲自己的工厂和工艺;老板不关心你的工厂,他关心他的会员。

③ **当场拍 logo,当场承诺。**手机拍下门头或杯子上的 logo,说:"今晚我做一张效果图发你,看看绣在帽子上什么样,免费的。"——这一步是整个扫街动作里唯一真正重要的一步,理由在22.4.1讲透了。

④ **指着价目卡说一个具体的数,然后不谈成交。**"最少50顶,一顶大概××,两周内到你手上。"给完数字就收尾,**不要问"你考虑一下吧"这种把球踢给对方的话**,那会逼他现在就给你一个"不"。

**离店前必做三件事:**拍下门头 logo(已做)、记下老板的名字和微信/联系方式、问一句"你们下一次做活动大概什么时候?"——最后这句问的是你下次上门的理由。

**留下什么:**一顶帽子(送出去,不回收)、一张价目卡(背面印你的联系方式和询价站网址)、以及那句"今晚给你发效果图"的承诺。**承诺是最好的二次联络理由**——你不需要找借口再联系他,他在等你的图。

**扫街的漏斗,给你真实的量级,别抱幻想:**一天走20家店,能说上话的约12家,愿意留下样品和价目卡的约8家,一周内有回复的约3家,三个月内下单的约**1家**。**20:1。**单日成本:送出去的两顶样品帽约 ¥22,价目卡几块钱,交通和一顿饭 ¥40,**合计约 ¥60-70/天**。而成交一单的毛利是 ¥3,000 起——即使按20:1 算,单日投入产出比也是压倒性的。更关键的是复利:那8家留下了价目卡的店不会消失,他们会在半年到两年之间陆续冒出来,而那时候你已经不记得自己什么时候去过。**扫街的收益是延迟兑现的,这是它最反直觉、也是九成人半路放弃的原因。**

一段对话,让你提前把心理准备做好。你进门,话还没说完,老板头也不抬:"我们不需要。"——三个字,你走还是不走?正确的回法是:"没关系,这顶帽子送您,不用还。您留着戴,哪天要做活动衫或者帽子,卡片背面有我的联系方式。"然后**真的转身走,不纠缠**。这段对话的关键认知是:**你把它当成一次成交,它就失败了;你把它当成一次投放,它就成功了。**那顶帽子放在他店里,每天被他和他的顾客看见;半年后他要做周年活动,第一个想起的是抽屉里那张卡片。地推不是销售动作,是**低成本、长半衰期的广告投放**。

最后是**交付体验**,四个动作,总成本不到订单额的 3%,但它决定了这个客户会不会有第二单和转介绍:

**一、手写卡片。**一张卡,手写两三句,中英文都可以。它的成本是零,但在一个所有沟通都发生在屏幕上的年代,手写字的分量高得离谱。

**二、多送两顶。**80顶的单交82顶,多出来的两顶成本 ¥22。这两顶的作用不是"占便宜",是给对方一个**可以对别人说的故事**:"我订80顶,他给我发了82顶,说怕有瑕疵备用。"这句话会在老板圈子里被复述,而复述就是转介绍。

**三、拍现场照。**帽子摆在瑜伽馆前台的那张照片,是三样东西:你的作品集素材(挂到询价站上,见22.3)、你的内容素材(第23章)、以及对方的社交货币(他会自己发朋友圈)。**记得开口要授权**,一句"这张照片我能用在我的作品集里吗"就够,别偷偷用。

**四、交付后第7天发一封回访。**内容只有两句:"戴了一周感觉怎么样?有没有人问在哪买的?"——第二句是钩子,它引导对方回忆"有人问过",而这个回忆直接通向转介绍。回访和复购的完整体系是第24章的内容,这里你只需要先养成**第7天必发**这个动作。

本节动作:今晚做两件事。第一,列出你住处步行20分钟内、门头有 logo 的所有店铺,能列多少列多少——**你会惊讶于这个数字有多大**,那是一份你从来没看见过的客户名单。第二,按上面的配置单去义乌或本地批发市场把样品包配齐,预算 ¥400 封顶。这两件事做完,你就有了一条不依赖任何平台、不花一分广告费的获客通道。

# 第23章 内容获客

**主线推进** —— 十一月的一个晚上,你在手机上翻相册,想找一张裁床的照片发给一个刚认识的加拿大买家。翻着翻着停住了——从六月到现在,这部手机里躺着**两千三百多张照片和视频**。

你一屏一屏往回滑:一刀切下八十层藏青斜纹的裁床、十二个机头同时起落的绣花机、剪线师傅七秒剪完一顶帽子、返工那个下午桌上的八十顶偏橙麦穗和一把拆绣刀、封箱前俯拍的箱内嵌套、五个纸箱贴着箱唛摞在成品仓角落。

当初按下快门的动机只有一个:**留证**。第4章那份"四留痕点清单"逼着你在每个节点拍照,你人不在现场,这些照片就是你的眼睛;验货那天,一片绣花首件的自然光照片让老崔连争都没争。

可就在刚才,你把那条四十秒的绣花机视频顺手发给那个加拿大买家,对方隔了两分钟回过来一句:

> "This is fascinating. Do you have more?"

**Fascinating**——迷人的。一台绣花机而已,李哥庄一带几万人天天在这种声音里上班,没有一个人觉得它迷人。

你忽然想明白:这两千三百多张素材在中国一文不值,因为人人都看得到;在温哥华、波特兰、曼彻斯特,它们是**几乎没有人见过的画面**。而且——他们很想看。

这一章讲的就是这件事:怎么把你本来就要走一遍的车间,变成一条不花钱的获客渠道。

## 23.1 流量洼地原理:海外用户为什么爱看中国工厂

先做一个对照实验,你其实已经无意中做过了。

同一条视频——绣花机十二个机头齐落,四十秒,你连剪都没剪。第一次,你发到自己的微信朋友圈,收获三个赞,其中两个是家里人;第二次,你发给那个加拿大买家,换来一句"fascinating"和一句"do you have more"。同一份内容,同样的四十秒,两侧的反应差了一个数量级。

这个差价有名字,叫**流量洼地**:同一份内容在不同的受众池里,获取单位注意力的成本相差一个数量级;差价的来源不是你的内容更好,是**这一侧司空见惯的信息,在另一侧极度稀缺**。洼地不是靠创意挖出来的,是靠你所处的位置天然存在的。你人在中国的帽子产业带里(见6.1.1),这个位置本身就是资产。

洼地为什么在这里,有三条机制,值得一条一条讲透。

**第一条,信息不对称。** 供应链在消费端是一个黑箱。第7章那张加价表你还记得:一顶帽子出厂价¥15,到北美货架上卖$29.99,中间大约十四倍(见7.1.1)。消费者一辈子买过几十顶帽子,他见过的只有货架、吊牌和退货政策;那十四倍加价里的每一手——面料商行的档口、裁床、绣花机、纸箱厂、集装箱——全都在幕布后面。而你手里的,恰好是幕布后面的第一手画面,不是纪录片团队进厂拍三天的画面,是当事人举着手机随手录的画面。

**第二条,过程消费。** 这是内容行业的一个底层规律,值得给它一个正式的名字:**过程消费**(process consumption)——观众消费的不是结果,是"从A变成B"的**转变过程本身**。修复类、清洗类、制造类、烘焙类内容全靠它吃饭。这类内容不需要剧情、不需要语言、不需要认识你,只需要在十几秒里让人看见一样东西变成了另一样东西。

帽子天生适配过程消费,而且适配得罕见地好。你想想定型这道工序(见4.5.1):一个软塌塌的、看着像块布的半成品进定型机,几十秒后出来是一个规整挺立的球冠。**转变剧烈、肉眼可见、十秒讲得完、而且结果好看**。这四个条件同时满足的行业没有那么多——卖软件的、做咨询的、开贸易公司的,他们的价值创造过程根本没有可拍的画面,所以他们只能拍人讲话。你不用讲话。

**第三条,去魅。** 这一条最重要,也最容易被做成宣传片而失效。

"Made in China"这个标签在西方消费端背了很多年的贬义:廉价、劣质、看不见的血汗车间。**但请注意这个贬义的来源——它来自"看不见",不是来自"看见了不好"。** 一个从来没被展示过的东西,在别人的想象里会自动填充成最坏的版本。所以改写这个标签的方法,不是辩解,不是拿认证证书出来晃,是**去魅**:让镜头老老实实地对着现场,把那个想象中的黑箱换成一个具体的、可看的、乏味的真实。

这几年这个标签正在从贬义滑向中性——评论区里"I had no idea"和"this looks way more skilled than I thought"这类话越来越多。而拍的人还太少。这就是洼地还没被填平的原因。

去魅的关键在于**平实**。干净的水磨石地面、一位戴老花镜的师傅低头剪线、白板上用红蓝笔写着的排产表(见8.3.1)、墙角摞着的空纸箱——这些没有一样是"好看"的,但它们全都是不可伪造的。反过来,打光、运镜、企业宣传片配乐、穿工装的模特摆拍,越精致越像营销,越像营销越唤不回信任。**你要的效果是"被允许进来看一眼",不是"被推销"。**

讲到这里可以回答本节最实际的问题:**为什么一条工厂视频比一张成品图有效十倍?**

十倍不是播放量的十倍,是**一条内容顶三条渠道**。一张成品图只完成一件事:产品展示。而且它零可信度——任何人都能从1688上抠一张图,买家也都知道这一点。一条工厂视频同时完成三件事:

- **信任建立**。画面里有厂、有正在动的机器、有你自己的声音和手。这是最难伪造的凭证——一个中间商拍不出裁床。买家不需要懂帽子,他只需要判断"这个人到底有没有摸过货",而这个判断三秒钟就能做完。
- **专业证明**。你在视频里顺口一句"这是21支108×58的磨毛斜纹,240克"(见1.1.5/1.3.1),对面立刻知道自己遇到的是懂行的人,而不是又一个搬运图片的账号。**行话是最短的简历。**
- **产品展示**。帽子本身还是在画面里的,一样没少。

而这三件事,在传统渠道里要分别花钱买:信任靠飞去展会握手(见21.2),专业靠寄样品来回一周(见15.3),展示靠拍产品图。一条视频把三笔钱一起省了。

现在带你算一遍这笔账,因为这是决定你要不要投入的唯一依据。

内容获客的成本不是钱,是**时间**。一套可持续的最小投入:每周拍摄2小时(而且这2小时你本来就在车间)、剪辑4小时、回评论和私信2小时,合计8小时/周。三个月大约100小时。假设这100小时换来5条有效询盘、成交1单——按R&B这种量级的单子算,毛利约¥13,790(见7.3.2的分账表)——折合每小时约¥138。

拿它去比另外两条渠道:北美DTC品牌的线上获客成本是$10-14一个订单(见7.2.3),那是纯现金,而且停投停量;阿里国际站是年费加P4P竞价(见21.1.1),同样是停投停量。内容的特点是**前期极慢、后期不停**——一条被搜到的视频三年后还在带询盘。

再给你一条判断阈值,省得你三个月后不知道该坚持还是该放弃:**如果一百条内容下来,一个有效询盘都没有,不要怪平台,回头检查你的内容里有没有出现过一个具体数字、一个具体工艺名。** 十有八九没有——你拍的是"好看的帽子",不是"别人不知道的事"。

一个真实质感的反面例子。有位同行做了三个月账号,发了六十多条,清一色是成品帽在白背景上转圈配音乐,零询盘。他来问是不是该投流。答案是:你发的是产品图册,而**产品图册在任何平台都不算内容,因为它不携带对方没有的信息**。他后来改拍车间,第一条就是绣花机十二个机头齐动的四十秒,什么文案都没写,只加了一行字幕"8,800 stitches per cap"。

本节动作,三条。第一,今晚就把手机相册按**工序节点**重建:裁/绣/车/整/包/发六个相册,把这半年的素材倒进去——你会立刻看见自己缺哪几个节点。第二,从下次进车间起,改一个顺序:**先拍工作,再拍产品**;帽子什么时候都能拍,机器在动只在那一刻。第三,把选题的筛子定死成一句话——**"我拍得到,而全世界99%的人拍不到"**;凡是通不过这一句的,别拍。

## 23.2 选题库

### 23.2.1 过程类:车间的一天怎么拆成三十条视频

早上七点半,车间刚开机,你站在门口做了一个决定:今天什么都不干,只跟着一块布走一遍(见4.1.1),手机不放下。

这一天结束后你会发现一件事:**你不需要想选题,第4章那张流程图就是现成的选题目录。** 一块布从进厂到一顶帽子出厂,中间的每一个节点都是一条视频;流程图上有多少个框,你就有多少条内容。而且这个目录会自己续命——每来一个新单,同样的三十条可以用不同的颜色、不同的logo、不同的帽型再拍一遍,观众不但不烦,还会因为"又是这台机器"而认出你。

先给一条拆解法则,它决定一个节点值不值得拍:**如果这个环节能拍出"前后不一样",它就是一条视频;如果拍不出变化,它只是一张照片。** 定型能拍出软塌变球冠,是视频;成品仓码着的帽子不会变,是照片。照片也有用,但它撑不起过程消费(见23.1)。

然后是核心问题:**过程类里,拍什么最有效?** 四类,按有效程度排序。

**第一类,机器动作。** 裁刀压下去、十二个机头齐落、四针六线包缝机把沿条一口吃住(见2.2.2)。拍法有讲究:**固定机位、贴近、拍全一个完整循环**(一起一落算一个循环),12到20秒。手持晃动是这类镜头的头号杀手,一个五十块钱的手机支架能解决。针尖、刀口这种极快的动作用120帧慢动作拍,回放时肉眼才跟得上。机器动作是流量的入口——它不需要观众懂任何东西。

**第二类,手工细节。** 剪线师傅七秒钟处理完一顶帽子的十几个线头(见4.5.2);拆绣工把拆绣刀贴着底线一排排削断8800针的绣花(见11.6.2);车工用两根手指把硬檐芯的弧度"喂"进帽口。拍法:镜头贴到二十厘米以内,**手是主角,脸不必入镜**。手工细节的作用是**技艺的证据**——观众判断"这不是流水线糊弄事",全靠这一类。机器动作让人停下来,手工细节让人相信你。

**第三类,数量感。** 五百顶装满五个箱子(见4.6.2)、一垛八十层的裁片、成品仓里码到天花板的纸箱。拍法两个要点:**必须有参照物**——一只手、一个人、一扇门,否则观众判断不出尺度;**用推拉镜头**,从一顶帽子的特写慢慢拉开到整垛。数量感解决的是买家心里那个不好意思问的问题:"你到底是不是工厂?"——因为**没有人能在自己家里摆出三千顶帽子**。

**第四类,对比。** 这一类信息密度最高。偏橙的麦穗和金黄428的麦穗贴着样带并排(见11.6.2);水洗前和轻酵素洗后的两顶帽子(见3.3.3);有衬布和没衬布的两个前幅,手一捏,一个挺一个塌(见2.1.1)。拍法就一条:**两个东西必须同框**。对比镜头的威力在于它不需要一句解说词——观众自己得出结论的信息,他会当成自己的知识,而不是你的广告。

下面精讲八条,每一条给你可以照着拍的镜头。剩下的二十二条在本章工具里。

**① 验布。** 布匹在验布机上滚过灯箱,验布员在四分制记录纸上打点(见4.2.1)。镜头:从灯箱背面逆光穿过布面推进去,布纹的经纬在背光下透出来,15秒。这一条讲的事情买家从没想过——**一块布在变成帽子之前,先被人从头到尾看了一遍**。

**② 排料。** 电脑屏幕上,唛架把六片帽身、帽檐、里衬像拼图一样嵌进门幅,右上角的用料率从77%跳到85%(见4.2.3)。镜头:录屏加屏幕特写,**数字的变化本身就是钩子**。这一条是给懂成本的买家看的。

**③ 一刀下去几百顶。** 八十层布叠齐拉平,裁刀落下(见4.2.4)。镜头:低角度平视刀口,慢动作120帧。这是全车间最像"重工业"的十秒。

**④ 扎号。** 一捆裁片挂着流转卡,卡上写着单号、部位、层号段、片数(见4.2.5)。镜头:手翻卡片的特写,加捆扎动作。这一条是纯粹的**信任内容**,标题方向:"这就是我们保证同一顶帽子的六片来自同一缸布的方法。"

**⑤ 绣花上绷与首件。** 绷架撑上前幅、十二头齐落、8800针跑十二到十五分钟(见3.1.4)。镜头三段:俯拍全景10秒 + 单个针尖微距慢动作8秒 + 绣完的一片和签字样带并排3秒。这一条是帽厂内容的"万能款",发一百次都有人看。

**⑥ 上帽檐。** 把一条硬檐芯均匀地"吃"进圆弧里,快了起皱、慢了歪斜(见4.4.1/6.1.2)。镜头:俯拍车工的手,一顶完整走完不切。这一条能拍出"三到六个月才上手"是什么意思。

**⑦ 定型。** 软塌的帽身进定型机,出来是规整球冠(见4.5.1)。前面说过,这是全车间转变最剧烈的十秒,**几乎不需要任何解释**。

**⑧ 封箱。** 8顶一摞嵌套、100顶一箱、俯拍箱内层次,最后贴箱唛(见4.6.2/4.6.3)。这一条是整条内容线的结尾,也是最容易被买家在心里代入"我的货"的一条。

接下来讲一件反直觉的事:**事故也是内容,而且是最值钱的那一批。**

那一百二十顶错线的下午,你手机拍下来的东西:全检时你和小周一顶一顶贴着样带过,每顶二十秒,过了一下午;八十顶拆绣重绣,拆绣刀贴着底线削断8800针;拆坏两顶,用备片补上。当时按快门只是为了留证。

现在回头看,这批素材回答了买家心里最不敢问、也最想问的那个问题:**"你们出问题的时候会怎么办?"** 任何人都能说"我们质量很好",这句话零成本、零可信度;**只有真出过事的人,拍得出返工桌。** 一条讲"我们发现了色差、我们怎么拆的、我们后来加了什么规矩"的视频,比一百条讲"我们品控严格"的视频更有说服力,因为它把结论的产生过程交给观众。

但发事故内容有两条红线,越线一次就再没有下一次:**第一,不出现任何客户可识别信息**——logo、款号、公司名、订单金额,一律不出现,必要时把logo部位打码或者干脆拍背面;**第二,不甩锅给具体供应商**。讲成"我们发现了、我们怎么修的、后来定了什么新规矩",不要讲成"某某绣花厂坑了我"。前者显示的是你的能力,后者显示的是你的人品——而买家看内容的时候,一直在同时评估这两样。

最后算一笔账,这笔账是内容获客对做实业的人最大的红利。

一次进车间两小时,按工序走一圈,每个节点拍三到四个镜头,你能带走**六十到八十个可用片段**。按一条成片用两到三个片段算,是**二十到三十条成片**。以每天发一条的节奏,**一次拍摄够你发三到四周**。

换句话说:**你不是在额外做内容,你是在把本来就要走一遍的车间录下来。** 你去车间是为了盯单、验货、跟工序,这些事一件不少地照做;唯一的增量成本是把手机举起来,和晚上回旅馆多花的那两小时剪辑。这就是为什么这条渠道对你成立,而对一个坐在写字楼里的贸易公司不成立。

本节动作,三条。第一,进车间前在手机备忘录里写死"今天补哪五个节点",没有清单的拍摄一定会变成拍一堆成品帽。第二,**每个镜头拍两遍**——一遍全景一遍特写;补拍的成本是三十秒,回去发现少了一个角度的成本是重跑一趟胶州。第三,当天回旅馆就按节点归档并且删废片;**不归档的素材,三个月后等于没拍**——你现在相册里那两千三百张,大半就是这么废掉的。

### 23.2.2 知识类与案例类:把专业翻译成15秒

评论区里出现了一条正经问题:"why do hats lose shape after a few months?"

你很认真地打了三百多字回复过去:讲前幅衬布、讲结构化和软顶的区别、讲无纺衬和树脂衬的差别。发出去之后,那条回复收获了一个赞,来自提问者本人。

第二天你把同样的话拍成了一条二十二秒的视频:左手一顶塌了的旧帽,右手一顶挺的;剪刀剪开前幅,把里面那块衬布抽出来举到镜头前,两块并排,一块薄软一块硬挺,手指捏给镜头看。字幕两行:"It's not the fabric. It's the fusing inside."

这条视频后来带来了这个账号的第一条真询盘。

**这就是知识类内容的定义:把一个行业内部人默认、行业外部人完全不知道的因果关系,用一个可以看见的对比讲完。** 注意定义里的两个限定词——"因果关系"和"可以看见"。只有因果没有画面,那是讲课,没人看;只有画面没有因果,那是前一节的过程类,好看但不筛人。

知识类内容最大的价值不是流量,是**它天然带来精准询盘**。机制说透:成品视频吸引的是"想买一顶帽子"的人;知识视频吸引的是"正在为一批帽子做决定"的人。因为只有后者才会为"衬布"这两个字停下来——一个普通消费者不关心帽子为什么会塌,他直接扔了买新的;一个正准备给自己酒厂订五百顶的老板会关心,因为他怕的正是"五百顶发到手,半年全塌了"。

所以有一条判断可以钉死:**内容的专业度就是询盘的过滤网。门槛越高,进来的人越少,但越对。** 一条讲衬布的视频哪怕只有几千次播放,它带来的询盘质量会高于一条几十万播放的成品展示——你要的是买家,不是观众。

**15秒的结构公式**,三段,照着套:

```
0-3秒   痛点问句 / 反常识画面   ← 观众在这三秒决定划不划走
3-12秒  可见的证据             ← 剪开、并排、捏、量、称
12-15秒 一句结论 + 一个动作      ← 让他下次买东西时能用上
```

前三秒行内叫**钩子**(hook)——它的唯一任务是让手指停下来。钩子只有两种做法有效:一个和他有关的问句("你的帽子为什么半年就塌了"),或者一个反常识的画面(一把剪刀正在剪开一顶新帽子)。用logo开场、用公司名开场、用"大家好"开场,是三种最贵的自杀方式。

结尾那个"动作"经常被忽略,但它是知识类内容和纯科普的分水岭:**给观众一个他明天就能用的判断动作**。"下次买帽子,用两根手指捏一下前幅"——这句话让他记住你,因为他真的会去捏。

下面给四条精讲,每条标出知识出处和镜头。

**① "Why does your hat go flat after six months?"** 讲衬布(见2.1.1)。镜头:剪开两顶帽子的前幅,抽出两块衬并排,手捏。结论:决定帽型的是里面那块衬,不是外面那块布。这一条永远有效,因为它对应一个人人经历过的挫败。

**② "Embroidery vs. print — which one should you actually pay for?"** 讲工艺选型(见3.2.4)。镜头:同一个logo,一半绣花一半丝印,并排放在自然光下,手指划过去让观众看到绣花的立体感和印花的平面感;再拿一顶洗过三十次的印花帽,印面已经龟裂(热转印耐洗30-50次,见3.2.2)。结论:绣花贵在制版和针数,但它跟着帽子活到最后。

**③ "Why 500 caps cost more per piece than 5,000."** 讲摊销(见9.7.1)。镜头:白板上手写三行数字——制版费¥200摊到500顶是¥0.4,摊到5,000顶是¥0.04;开缸染色500米起(见1.5.2);换款上线的调机损耗(见4.4.2)。结论:小单不是被宰,是固定成本没人替你分摊。这一条会直接筛出懂预算的B端买家,而且它顺手解决了你后面报价时最难解释的一件事。

**④ "This is what 8,800 stitches actually looks like."** 讲千针计价(见3.1.5)。镜头:绣花机跑完一个完整logo,机器屏幕上针数在跳;字幕换算¥0.45/千针 ≈ $0.56/cap。结论:你的logo越复杂,针数越多,成本越高——所以简化一根麦芒能省的钱是可以算出来的(见3.1.6)。

现在讲**案例类**。

**案例类内容的定义:把一个真实订单从图到货的全过程,剪成一条线。** 它的价值和知识类完全不同——它是**唯一能让买家预演"和你合作是什么体验"的内容形态**。买家看知识类是在评估你懂不懂;看案例类是在评估**跟你做一单会经历什么**。

结构固定,五到八个镜头,45到90秒;或者做成图集,一张一步:

```
客户发来的原始图稿 → 制版/打样 → 确认样签封 → 大货生产 → 装箱贴唛 → 客户收到货
```

最后那一帧最重要:客户戴着帽子、或者举着帽子站在自己店里的照片。R&B这一单你有——Mike在九月活动上发来的那张吧台照片。**这一帧的说服力超过前面所有画面之和**,因为前面所有画面证明的是"你能做",这一帧证明的是"已经有人这么做过,而且拿到了货"。

案例类有一道必须过的关:**客户隐私与授权**。这一节的硬规矩,三层。

**第一层,能不能发。** 任何带客户logo、款号、品牌名的画面,**发布前必须拿到书面同意**——不是口头,不是"他应该不介意",是一封邮件里的一个"yes",截图存档。这不是法律洁癖:客户的新款没上市就出现在你的账号里,是可以让你赔掉一整段关系的事。一句话邮件模板,照抄:

> "Would you be okay if I share a short behind-the-scenes clip of your caps in production? No order details, no pricing, no specs — just the process. Happy to tag you, or keep it unbranded if you prefer."

注意这句话的写法:先说明**发什么**,再明确**不发什么**(三个"no"),最后给一个**不同意也不尴尬的退路**。对方回"yes"的概率因此高得多。

**第二层,发什么不发什么。** 永远不出现的四样,记死:**报价与订单金额、客户方联系人姓名与邮箱、规格表全文与款号、客户尚未发布的新款**。前两样泄露的是商业信息,后两样泄露的是竞争优势——你的买家可以接受被展示,不能接受被复制。

**第三层,不同意怎么办。** 两条替代路径:把logo部位打码或只拍反面;或者干脆用你自己的样品帽把同一套流程重拍一遍。记住这句话:**流程本身不涉密,涉密的是"这是谁的单"。** 你把logo换成自己的,内容的教学价值一分不少。

主线这边你走了正规流程。你给Mike发了上面那封邮件,他回的是:

> "Go for it — send me the link when it's up, I'll put it on our Instagram too. People here love that stuff."

这句回复里藏着案例类内容的第二重红利:**做得好的案例内容,客户会帮你转发。** 他转发的动机不是帮你,是他自己也想要那个故事——"我们的帽子是这么做出来的",这句话对他的顾客同样有价值。他转发一次,你就免费出现在他那一圈同类客户面前(精酿圈的老板们互相认识),而这批人正是你最想要的下一个Mike。这条线在第24章还会展开(见24.4)。

本节动作,两条,外加一条纪律。

第一条动作,建**知识选题池**,取材法只有一句:**你每回答一次客户的问题,就把这个问题原样抄进池子。** 不要自己想选题——你想出来的选题永远是你觉得重要的,客户问出来的选题才是他觉得重要的。规则:同一个问题被不同的人问过两次以上,一定是好选题,立刻排进拍摄清单。

第二条动作,把知识类和案例类**配对发布**:一条知识类("为什么小单更贵")后面跟一条案例类(一个小单的完整过程),前者建立道理,后者兑现道理。

纪律一条,压轴:**知识类内容里出现的每一个数字,必须是你真的算过或查过的。** 这本书前十九章的数字口径表就是你的弹药库,不要在评论区凭印象报价。原因很直接——**一条被行家在评论区指出错误的知识视频,毁掉的信任比十条内容建立起来的还多**,而且那条评论会一直挂在下面,谁都看得见。

## 23.3 账号矩阵:TikTok/IG/YouTube分工

三个账号注册完,你坐在旅馆桌前,发现最难的不是拍,是一个特别笨的问题:**同一条视频,要发三遍吗?**

答案是:要发三遍,但不能是同一条。

先把概念定住。**账号矩阵**不是"多开几个号",而是:**用同一批素材,按三个平台各自的流量逻辑做三种剪法,让它们各自承担获客漏斗的一段。** 判断你的矩阵搭得对不对,只有一个标准——你能说清每个平台在替你做哪一件事。说不清,那就不是矩阵,是三份重复劳动。

三个平台的分工,一个一个讲。

**TikTok:冷启动最快的那一个,负责漏斗最上层。**

先定义**冷启动**——一个新账号在没有任何粉丝基础的情况下,靠平台推荐拿到第一批曝光的过程。TikTok在这件事上的机制和传统社交平台根本不同:它的推荐流不看你有多少粉丝,看的是完播率、互动率这类内容本身的表现,所以一个零粉账号的第一条视频也可能被推给几万人。对一个刚起步、什么都没有的人来说,这一条就足以让它成为首选。

它适配**过程类**内容(见23.2.1):机器动作、数量感、手工细节。这些东西不需要语言、不需要背景知识、不需要认识你——**这正是冷启动需要的"零门槛"**。形态:9:16竖屏,15到40秒,一条讲一个动作。

它在漏斗里的位置:**让一个完全不认识你的人,第一次看见中国的帽子车间。**

**Instagram:B端买家在这里,负责漏斗中层。**

这一条是很多人搞反的。做外贸的人常常把IG当成"给年轻人看的",但你想想你的客户是谁:品牌主理人、设计师、促销品经销商(见5.5.2)、精酿酒厂老板、乐队经纪、健身房老板——**这些人自己就在经营IG账号**,因为他们的品牌需要它。Mike的IG就挂在R&B官网的页脚上。一个每天都在用IG经营自己品牌的人,他找供应商的时候会顺手在IG上搜一圈,这是自然行为。

它适配**案例展示**:Reels发过程片段,carousel图集发完整案例(第一张放成品照片抓住手指,中间几张走过程,最后一张放规格与工艺说明)。图集在这里有一个独特优势——**它可以被一页一页翻,翻完就是一次完整的能力展示**,而视频只能被动地播。

它在漏斗里的位置:**让看过你的人认出你是"做帽子的那个",并且能在你主页上把你当名片看完。**

**YouTube:搜索流量,负责漏斗底层。**

它的机制和前两个有本质区别,这个区别值得你记一辈子:**TikTok和IG是推荐驱动的——平台决定谁看见你;YouTube是搜索加推荐双驱动——用户主动来找你。** 由此推出一条对你极其重要的结论:

**推荐流的内容有保质期,搜索流的内容是资产。**

一条TikTok的生命周期通常以天计,过了就过了;一条标题写着"How custom embroidered caps are made in a Chinese factory"的YouTube视频,三年后还在被人搜到、还在带询盘。你在第一年做的一百条TikTok,到第三年基本归零;你做的二十条YouTube长视频,到第三年还在替你工作。

它适配**知识类**:5到12分钟的长视频,把一个话题讲透——比如"从图稿到8800针:一顶绣花帽的完整制版过程"、"我们是怎么发现120顶帽子绣错了颜色的"。这里的观众和前两个平台完全不同:**他已经在认真考虑下单了,他来这里是做尽职调查的。** 所以长、慢、细都不是缺点。

三个平台放在一张表里对照:

| 平台 | 流量机制 | 承担内容 | 形态与时长 | 漏斗位置 | 发布节奏 |
|---|---|---|---|---|---|
| TikTok | 推荐流,不看粉丝基数,冷启动最快 | 过程类:机器动作、数量感 | 9:16竖屏,15-40秒 | 最上层:第一次被看见 | 每天1条 |
| Instagram | 推荐+关注混合,B端买家自带账号 | 案例类:Reels + carousel图集 | 竖屏视频 + 6-8张图集 | 中层:被认出、被当名片翻 | 每周3-4条 |
| YouTube | 搜索+推荐,内容长期有效 | 知识类:讲透一个话题 | 16:9横屏,5-12分钟 | 底层:被尽调、被验证 | 每周1条或两周1条 |

接下来是本节的核心:**一个人怎么把这三件事同时做完。**

方案的名字叫**一次拍摄,三种剪法**。

**拍摄阶段,只做一件事,但这件事必须做对:一律横屏拍。** 4K或1080p,60帧(慢动作镜头120帧)。理由是纯技术的——**横屏可以裁成竖屏,竖屏永远变不回横屏**。这是新手最常犯、代价最高的错误:兴冲冲拍了两百个竖屏素材,后来想做YouTube长视频,发现全都用不了,只能重跑一趟车间。多这一个动作,你的素材库对三个平台通用。

**剪法一(TikTok / IG Reels)**:从素材里挑一个完整动作,裁成9:16竖屏,20秒左右,加烧录字幕。一条素材一条成片,不贪心。

**剪法二(IG carousel)**:从视频里直接截帧,选6到8张,第一张放最好看的成品,后面按工序排。截帧比重新拍照快十倍,而且画面风格天然统一。

**剪法三(YouTube)**:把同一次拍摄的所有片段按工序顺序串起来,补几段口播或者纯字幕说明,做成8分钟左右的一条。这一条的素材利用率最高——那些不够格单独成片的边角料,在长视频里全都是有用的过渡。

**时间预算**要算清楚,因为不可持续的方案等于没有方案:

- 拍摄:2小时(本来就在车间)
- 竖屏条剪辑:一条5-8分钟 × 20条 ≈ 2小时
- 长视频剪辑:约2小时
- 每天回评论和私信:20分钟 × 7 ≈ 2.5小时

合计**每周约8小时**。超过这个数,你会在第六周放弃——这不是意志力问题,是你还有验货、报价、跟单、单证要做。**8小时是这套方案的真实成本,也是它的上限。**

**发布节奏**,三个平台的数字上面表里有了,这里补两条为什么。

第一,节奏本身是信号:平台把"稳定更新"当作账号质量的一部分,断更两周再回来,推荐量通常要重新爬。第二,也是更重要的一条——**60到90条是你自己找到手感的最低样本量**。给你一个阈值,请当成纪律:**冷启动期连续发满60到90条再做任何判断。** 发了十几条就说"这条路走不通",是外行话:你连自己的哪类内容有效都还没测出来。

**语言与字幕**,三条实操,专治"我英语不好"。

**第一,不出声就是最好的方案。** 过程类视频用环境音——裁刀落下的闷响、绣花机的哒哒声、剪线的咔嚓——加烧录字幕,效果好过蹩脚的配音。环境音是真实感的一部分,而口音明显的配音会把观众的注意力从帽子转移到你的英语上。

**第二,字幕必须烧录进画面**(burn-in,即字幕作为像素直接压进视频,而不是平台的可关闭字幕层)。两个理由:很多人在通勤和会议里静音刷手机;平台的自动字幕对中式口音识别率很差,会把你的话翻成笑话。

**第三,文案写不出来就写最短的一句:名词加数字。** "21s combed cotton twill, 240 gsm." "8,800 stitches, 12 minutes per cap." "500 caps, 5 cartons, 0.48 CBM." **行话本身就是文案,不需要形容词。** 你不会写英文抒情句,但你写得出这些——而这些恰恰比抒情句管用十倍,因为它们只有内行才写得出来。

补一条:车间里出现的中文标识——白板上的排产表、生产通知单、墙上的标语——**不用遮,它们是真实感的一部分**。观众看不懂反而更好,那是"我在看别人的世界"的证据。

一个反面案例,常见到几乎每个新人都犯一次。有位同行三个平台同一条视频原样发三遍:竖屏视频丢进YouTube的长视频位、横屏视频发到TikTok两边留黑边、IG上发的是没有裁切的16:9。三个平台都不推。原因不神秘:**平台推的是"像本平台内容的内容"**,而尺寸和时长是平台判断你是不是"自己人"的第一道信号,这道信号连算法都不用动脑子就能读出来。

本节动作,三条,今天就能做完。第一,**三个平台的用户名统一成同一个**——方便交叉导流,也方便别人在A平台看到你之后能在B平台搜到你;这件事以后改成本很高,现在改成本为零。第二,主页简介写成一句话回答"你是谁、做什么、起订量多少"(具体写法下一节展开)。第三,建立素材库的文件夹结构:`原始素材/按工序节点` 和 `成片/按平台`,两层就够;第三个月你会有几千个文件,没有结构的素材库等于没有素材库。

## 23.4 转化链路

### 23.4.1 从评论区到询价表单:链路搭建

绣花机那条视频下面,出现了这个账号的第一条有商业价值的评论:

> "Do you do custom? 100 pcs?"

你很快回了三个字:"Yes, DM me."

然后……什么都没发生。他没有私信你。

复盘一下他要做什么才能真的联系上你:点你的头像 → 进主页 → 找联系方式 → 发现只有一个邮箱 → 切换到邮件app → 用英文组织一段"我是谁我要什么" → 发送。**六步。** 而他当时正躺在沙发上刷手机,刚刚被一台绣花机吸引了四十秒。

这就引出本节唯一要解决的问题。先给定义:**内容转化链路**——从"看见内容"到"成为一条可跟进的询盘"之间的全部步骤。链路设计的唯一目标不是漂亮,不是专业,是**减少步数**。

用一个粗糙但直觉正确的算法感受一下:假设每一步的留存率是50%(对一个陌生人、跨语言、非紧急的行为来说,这已经是乐观估计),那么六步走完,一百个有意向的人最后只剩下**一个半**。而如果你把六步压到三步,同样一百个人剩下**十二个半**。

**每砍掉一步,产出翻倍。** 这句话请当成本节的中心思想。

一条设计合格的链路长这样:

```
看到视频
   │
   ├─→ 评论区(公开回复,带具体信息)──┐
   │                                  ├─→ link in bio 落地页 ─→ 询价表单(五问)─→ 你的邮箱
   └─→ 私信(关键词自动回复)────────┘        └─→ WhatsApp 按钮(预填第一句话)
```

逐环节拆。

**① 评论区回复:公开回复比私信重要。**

这一条反直觉。多数人的本能是"有生意就赶紧私聊",但**一条公开回复是给所有后来的人看的**——那条视频未来一年里每一个刷到它的人,都会看到你在评论区怎么回答问题。评论区是你的第二个主页,而且它自带社会证明:一个有人认真提问、你认真回答的评论区,本身就是"这个账号是真的在做生意"的证据。

回复的写法:**先给一个具体数字,再引导下一步。** 照抄这句:

> "Yes — minimum 100 pcs for custom embroidery. Price depends on fabric and stitch count; the form in my bio takes 30 seconds and I'll quote within 24 hours."

三个动作藏在里面:给了起订量(筛人)、给了价格由什么决定(专业)、给了下一步和时间承诺(降低行动成本)。

两种反面写法:"Please DM"——不给任何信息,对方凭什么多走一步;直接报一个价——**没有规格的报价一定是错的**(见15.2),而错的报价会在成交时反噬你,那时你要么亏钱要么反悔,两条路都难看。

**② 主页简介:三行,回答三个问题。**

模板,直接改数字用:

```
Custom cap manufacturing · Qingdao, China
Embroidery & print · MOQ 100 pcs · Samples in 7 days
👇 Get a quote in 30 seconds
```

第一行回答"你是谁、在哪";第二行回答"你能做什么、门槛是什么、多快";第三行是行动指令。

**硬规则:简介里必须写起订量。** 这一行字替你挡掉的东西,比它带来的多得多——"我想要一顶"、"能不能做五个"这类消息,在他点开你主页的那一秒就自己消失了。你可能觉得写MOQ会赶跑客户,事实相反:**门槛是筛子,不是墙**;真正要做五百顶的人看到"MOQ 100",第一反应是"那我够了",信心反而增加。

**③ link in bio:把唯一的一个链接位扩成一个入口。**

定义:多数社交平台的正文和评论里不允许放可点击的链接,只有个人主页的简介栏允许放一个。**link in bio** 就是行业对这个位置的叫法,以及围绕它衍生出的做法——用一个"聚合落地页"把这唯一的位置扩展成多个入口。

两种做法:用现成的免费聚合页工具(五分钟搞定,适合起步);或者用建站工具自己做一个单页(更好,因为它是**你自己的资产**,平台封号、改规则都带不走,而且可以放案例图和表单)。建议路径:先用工具跑通,第二个月换成自己的单页。

落地页只放四块东西,多一块都是负担:

- 三张过程图或一段20秒的车间视频(证明你是真的)
- 一句话能力说明:帽型 / 工艺 / 起订量 / 打样与生产周期
- 询价表单(下面详讲)
- WhatsApp 按钮

**不要放价格表。** 理由:帽子的价格是规格的函数(见9.1.1)——面料、克重、针数、辅料、数量,任何一项变了价格就变了。挂一个死价,你会同时得罪两端:嫌贵的人直接走了,而愿意付更多的人被你自己压了价。

**④ 询价表单五问。** 这是本节最实用的工具,一个一个讲为什么。

**第一问:数量。** 这一问决定这单**走哪条路径**:低于100顶,礼貌引导到现货贴牌(见6.5.1);100到500顶,是你的主战场(见7.3.2);超过3,000顶,可以谈数量阶梯(见9.7.1)。数量放第一位还有一个心理作用——它让对方立刻意识到这是一笔"批量生意",而不是买一顶帽子。

**第二问:用途/场景。** 员工工服、球队活动、品牌零售、婚礼赠品、酒厂周年——用途决定帽型和档次(见2.1.3),也决定他愿意花多少钱。更重要的是,**用途是你后面做顾问式销售的钩子**(见24.4):知道他是酒厂周年活动,你就能顺口提一句"活动之后你可能还需要一批夏季款",这句话是Mike那单后来翻单的起点。

**第三问:时间——什么时候要拿到货。** 这一问是**真实性探针**里最灵的一个:有明确硬日期的("March 14, our anniversary")几乎都是真需求;写"asap"的多半是在比价。同时它直接决定物流方案——海运28-32天还是空运(见17章),而这个差价可能有¥2,500(见19章的到岸成本表)。

**第四问:预算——每顶目标价。** 多数新人不敢问这一问,怕唐突。要问,但**要用范围选项而不是填空**:

```
Under $5  /  $5-8  /  $8-12  /  $12+  /  Not sure yet
```

两个原因:**给选项的填写率远高于给空格**——填空要思考,勾选只要一秒;更妙的是,**这四个选项本身就在教育对方价格带**。一个原本以为帽子应该三美元的人,看到选项里最低一档是"Under $5",心里的锚已经被你调整过了。最后那个"Not sure yet"必须留着,它接住了那些真的不懂但很真诚的客户——而内容渠道来的客户,一半是这种人。

**第五问:logo文件。** 要求上传,并注明可接受格式:AI/EPS/PDF矢量优先,PNG需300dpi以上(见3.1.6制版对文件的要求)。这一问是**诚意探针**——去找出自己的logo源文件、上传,这个动作要花掉他五到十分钟;**一个愿意为你花十分钟找文件的人,已经在心里下过单了**。

再加两个可选字段:公司/品牌名(便于你搜他、判断规模)、所在国家(定运费和合规要求,见25.5)。

**表单字段总数不要超过七个。** 这是一条经验阈值:超过七个,填写率断崖式下跌。你想要的所有其他信息——帽型、颜色、包装、付款——都留到你回复他的第一封邮件里去问,那时他已经投入了,回答长问题的意愿完全不同。

**⑤ 自动回复与WhatsApp引流。**

平台私信支持关键词自动回复的,设三个关键词:**quote / price / MOQ**,对应同一段固定回复:一句问候 + 起订量 + 落地页链接 + "I'm in China (GMT+8), I'll reply personally within 24 hours."

为什么必须有自动回复?因为下一节要讲的时差决定了**你有一半以上的询盘发生在你睡觉的时候**。自动回复不是为了成交,是为了**在你醒来之前不让人凉掉**——那句"I'm in China (GMT+8)"尤其重要,它把"没人理我"改写成"他在睡觉",这是两种完全不同的印象。

WhatsApp在欧美、中东、拉美的B端沟通里是默认工具(见20.3.2),按钮用 `wa.me/你的号码?text=...` 的形式,**把第一句话预填进去**:

> "Hi, I saw your caps video — I need a quote for ___ pcs."

**这一句预填就是又砍掉了一步**:对方不用组织语言、不用介绍自己,点开就是一条写好的消息,他只要填一个数字然后按发送。对一个英语流利的人这没什么,但你的客户里有德国人、日本人、巴西人——替他们把第一句话写好,转化率的差别是实实在在的。

现在带你把整条链路算一遍,看看优化到底值多少钱。

假设一条视频带来20条评论,其中5条是真的在问价。按五步链路、每步50%留存:5 → 2.5 → 1.2 → 0.6,**一条视频产出0.6个表单**。

现在把步数压到三步:评论区直接给落地页链接(省掉"进主页找链接")、落地页首屏就是表单(省掉"再点一次")、表单五问三十秒填完(省掉"要写一封英文邮件")。同样5个人:5 → 2.5 → 1.9,**一条视频产出1.9个表单**。

**三倍多。而你没有多拍一条视频,没有多花一分钱,只是把六步改成了三步。** 内容做得好不好靠运气,链路做得好不好靠设计——这是两件事,而后者是你完全能控制的那一件。

本节动作,今天做三件:写主页简介三行;建落地页,把五问表单放在首屏;设置三个关键词自动回复。外加一条纪律,从第一条询盘就开始执行:**每条询盘进来先记来源**——哪个平台、哪条视频。一个月后你会发现一件很有价值的事:**带来播放的内容和带来询盘的内容,往往不是同一批**。播放量最高的那条可能是裁刀慢动作,而带来询盘的那条可能是讲小单为什么贵的白板视频。不记来源,你会一直优化错的东西。

### 23.4.2 询盘接待:时差、首回速度与筛选

早上七点,你还没起床,手机里已经躺着三条昨夜进来的消息:一条WhatsApp、一条IG私信、一条表单提交的邮件通知。

此刻温哥华是下午四点(冬令时,差16小时),那边的人正在下班前处理杂事;多伦多是上午十点(差13小时),正是一天里最能做决定的时段。**你睡觉的时候,你的客户在上班。** 这不是麻烦,这是你必须先算清楚的第一笔账。

**时差账**,把数字定死(以冬令时为准,夏令时各减1小时):

| 客户所在地 | 北京时间快多少 | 他的上午9点 = 北京时间 | 他晚上7点刷手机 = 北京时间 |
|---|---|---|---|
| 温哥华、洛杉矶(太平洋) | 16小时 | 次日凌晨1点 | 次日上午11点 |
| 多伦多、纽约(东部) | 13小时 | 当天晚上10点 | 次日上午8点 |
| 伦敦 | 8小时 | 当天下午5点 | 次日凌晨3点 |
| 迪拜 | 4小时 | 当天下午1点 | 当天晚上11点 |

从这张表能直接读出两条可执行的结论:

**结论一,发布时间选北京时间上午8点到中午。** 这个窗口覆盖北美东部的晚间黄金刷机时段和西部的傍晚,一次覆盖两个海岸。

**结论二,真人回复时间守住北京时间晚上9点到11点。** 这两个小时是你和北美东部客户唯一的**实时重叠窗口**——他在上午上班,你在晚上没睡。在这个窗口里,一来一回的对话可以在十分钟内完成三个来回,而错开窗口的话,同样三个来回要三天。**一天两小时,是你作为一个人能给出的最高效的两小时。**

再给一条纪律:**不要熬夜等。** 不可持续的勤奋在第三周就会崩塌,而且崩塌之后的响应速度比一开始就设定节奏还差。用自动回复兜底(见23.4.1),把真人的两小时用在刀刃上。

**首回速度**,讲机制,不讲玄学。

为什么第一次回复的速度对转化影响这么大?三个原因,每一个都能推导:

**第一,你多半不是唯一被问的那个。** 一条询盘发出去时,对方常常同时发给了三五家(见15.1.2里的钓鱼比价)。**第一个回的人定义了后面所有人的比较基准**——他会拿你的报价结构、你问的问题、你给的时间承诺去衡量后面每一家。这个位置的价值,远大于报价低两毛。

**第二,内容带来的询盘是冲动驱动的。** 他是刚看完你的绣花机视频、情绪在高点上填的表单。这种冲动的半衰期以小时计,隔一天热度就散了,隔三天他已经忘了你是谁。这一点和展会、开发信来的询盘完全不同——那些是计划性的,可以慢慢来。

**第三,回复速度是你交付能力的样本。** 这是最狠的一条:在下单之前,对方**唯一能观察到的、关于你靠不靠谱的证据,就是你回消息的样子**。他没见过你的厂、没摸过你的货、不认识你的人;你回得快、答得有条理,他心里那个"这单交给他会不会出事"的问号就会小一点。**你怎么回消息,他就假设你怎么做货。**

给一条可执行阈值:**目标是在对方所在时区的当天之内回复。** 超过24小时的询盘,转化率不是下降,是基本归零——不是因为他生气,是因为他已经在跟别人聊了。

首回**不需要给报价**(没有规格的报价一定错,见15.2),但必须有三样东西:一句确认收到并归因到内容、两三个专业问题、一个明确的下一步时间承诺。

**内容来的询盘,有它自己的脾气。** 和阿里国际站、展会、开发信来的询盘比,两个特点,一好一坏。

**好的一面:更信任。** 他在联系你之前,已经看过你的车间、你的机器、你的师傅的手,信任在见面之前就建立了一半。表现出来是:砍价力度明显小、更愿意接受你的专业建议、更在意故事和过程而不是每顶差两毛钱。R&B那单Mike的态度就是这个类型的样板——他在乎的是"厚实、戴旧了好看"和麦穗绣得漂亮,不是把¥17.5砍到¥17.2。

**坏的一面:更不专业。** 他大概率不是采购员,是酒厂老板、乐队主唱、健身房教练、社区球队的家长。他不知道起订量、不知道绣花按千针计价、不知道运费和关税要另算、更不知道打样要一周、生产要半个月、海运要一个月。三种典型开口你会反复遇到:

- **"How much for a hat?"** ——没有任何规格。他不是在为难你,他真的以为帽子有一个价格。
- **"Can I get 20?"** ——远低于起订量。他把你当成本地的绣花店。
- **"Can you make it look exactly like this?"**(附一张耐克或者某支球队的帽子照片)——这是侵权,而且他完全不知道这是侵权(见25.4.1)。

所以内容渠道的询盘**必须教育**。但教育不能靠你每次打八百字——**教育是可以产品化的**。

做一份两页的PDF,名字就叫 **Custom Cap Starter Guide**,内容五块:

1. 帽型六选一,配图:baseball / dad hat / snapback / trucker / bucket / beanie(见2.1.2)
2. 装饰工艺三选一与差价:embroidery / print / patch(见3.4)
3. 起订量与数量阶梯:100 / 500 / 1,000 / 3,000 分别意味着什么(见9.7.1)
4. 时间表:打样7天 + 生产15-18天 + 海运28-32天 ≈ 到手8-9周,空运可压到4-5周(见4.7.2/17章)
5. 你需要他提供的三样东西:矢量logo文件、数量、到货日期

首回的时候把它当附件甩过去。这份PDF一次做完,用三年,**每用一次省你四十分钟**;而且它本身就是专业度的证明——一个能拿出标准资料包的人,和一个每次现打字解释的人,在买家眼里是两个量级。

**筛选**,把第15章那张评分卡搬过来用,但要改三处权重——因为内容渠道的客户画像和邮件渠道不一样,原样照搬会把好客户误杀。

原五特征(见15.1.1)在这里的调整:

**① "具体规格"这一项要降权。** 他不懂规格,不等于他不真。一个说不出克重和帽型的酒厂老板,可能三周后就付了定金;而一个规格写得头头是道的,倒可能是同行来套价。

**② "具体日期与场景"这一项升到第一位。** 一个说得出 "March 14, our brewery's 5th anniversary" 的人,比一个说得出 "1,000 pcs" 的人真得多。**日期是没法凭空编的**——他要么真有这个活动,要么没有。这一项在内容渠道里是最强的真实性信号。

**③ 新增一项内容渠道特有的信号:他看过你哪条视频。** 能在消息里说出"the one where you cut through 80 layers"或者"the embroidery machine video"的人,是真的花了时间在你身上。你可以在首回里直接问一句"How did you find us?"——回答得出来的,标记为高优先级。

最后给一条止损线,它比任何技巧都省时间:**低于50顶,不接。**

不接不等于甩掉。正确的做法是礼貌地把他推到对的地方去:引导到现货贴牌(见6.5.1),或者直接告诉他北美本地的解法——买blank cap($3-8/顶,见5.4.1)再找本地绣花店($2-4/位置,见7.1.1),二十顶帽子这样做比从中国进口便宜也快得多。

为什么要花时间做这件不赚钱的事?**因为把小客户推给正确的人,是你能留下的最好印象。** 他今天要二十顶,是给自己的咖啡馆员工;他明年做五百顶周边的时候,会想起那个"没赚我的钱、还告诉我该去哪"的中国人。这不是情怀,这是成本极低的长期投资——一封五句话的邮件而已。

给你一段完整的首回,照抄改数字:

> **询盘**:"Hi! Love your videos. I run a coffee roastery in Portland. Need hats with our logo. How much?"
>
> **你的首回**:"Thanks for reaching out — glad the videos were useful. To quote accurately I need three things: 1) quantity (our minimum for custom embroidery is 100 pcs); 2) your logo file (AI / EPS / PDF preferred — it decides the stitch count, which is the main cost driver); 3) the date you need them in hand. I've attached a 2-page starter guide with cap styles, decoration options and lead times. Once I have those three, you'll get a full quote within 24 hours."

逐句拆一遍它为什么这么写:

- **第一句归因到内容**——"glad the videos were useful",强化他的选择,也提醒他你们之间已经有过接触,不是陌生推销。
- **MOQ放在括号里**,不单独成句。同样一句"最少100顶",单独成段像拒绝,放在"我需要知道数量"的括号里像说明。这是一个字都不用多写的技巧。
- **三个问题从易到难**:数量(他脑子里就有)→ logo文件(要去找)→ 日期(要去确认)。顺序反过来,他会卡在第一问上直接不回。
- **括号里塞了一句专业解释**("it decides the stitch count, which is the main cost driver")——这一句是免费的专业展示,而且它顺便让"为什么我不能马上报价"变得合理。
- **附件替代长篇解释**,把八百字的教育变成一个点击。
- **最后一句是时间承诺**,而且是**条件式的**("once I have those three")——把球干净地踢回给他,同时告诉他配合的回报是什么。

本节动作,建一份**询盘接待SOP**,五步:

```
收到 → 24小时内首回(模板 + starter guide)
     → 对方回三样(数量/logo/日期)
     → 按15.2出正式报价单
     → 录进客户表:来源/国家/数量/用途/日期/状态
     → 每条询盘必须有一个结局状态
```

最后一条是纪律,也是本节的收尾:**所有询盘都要有一个结局状态——成交、搁置、淘汰,三选一。** 没有结局的询盘会一直占着你的脑子,而且会让你产生"我手上有很多机会"的幻觉。给"搁置"设一个自动到期:三个月没动静的,发一封两句话的跟进信,还没动静,归到"淘汰",清出脑子。**空的名单比假的名单值钱。**

## 23.5 案例拆解:三个起量账号

在拆之前,把话说在前面。

本书所有案例均为教学虚构(见0.4),这一节尤其要强调:**下面拆的不是三个具体账号,是三种类型。** 我把这个行业里反复出现的三种做法抽象成三个模型,而且**一个播放量数字都不给**。两个原因:任何人报给你的播放量你都无法验证;更重要的是,爆款是幸存者偏差——你能看见的都是成了的,你看不见的一万个用同样方法没成的,才是概率的真相。

所以这一节只拆**可复制的结构**,四个维度:**内容公式、更新频率、转化路径、可复制难度**。这四样是你明天就能照着做的东西,播放量不是。

**类型一:工厂老板娘型**(真人出镜 + 车间日常 + 英语不好反而真实)

**内容公式**:一个固定的真人 + 一个固定的场景 + 每天一件小事。

```
真人开场三秒(挥手 / 指着身后的机器)
   → 今天车间发生的一件具体的事(赶单、新到的布、机器坏了、订单发走了)
   → 一句不太标准的英文结论
```

**为什么英语不好反而有效**——这一条值得讲透,因为它反常识。观众的判断模型里,"流利英文 + 精美剪辑 + 统一配色"约等于"这是一个营销团队做的号";而口音、卡壳、同一句话说三遍、镜头晃、背景里有人喊,这些在观众眼里是**不可伪造的成本**。一家有营销预算的公司请得起流利的人,但**请不到一个真的每天在车间里的人**。

把这句话记住:**真实感的来源不是完美,是不可伪造。** 这也解释了23.1里那条"平实优于精致"的原则为什么成立。

**更新频率**:每天1条,一年三百多条。这类账号的护城河就是频率——**观众关注的是"人",而人必须天天在**。断更两周,人设就凉了,重新起来比新开一个号还难。

**转化路径**:评论区 → 私信 → WhatsApp。极少用表单。因为她的客户是被"人"吸引来的,他们要的是聊天,不是填表——你让一个因为喜欢你而来的人先填七个字段,是拿冷流程去接热情绪。

**可复制难度:高。** 注意难在哪:不是技术难,是**心理难和体力难**——每天出镜、被评论区嘲笑口音、连续做满一年。对读者的判断很直接:**如果你不是真的每天在车间,别选这条路**,你撑不过第二个月。

**类型二:工艺科普型**(微距镜头 + 知识密度)

**内容公式**:

```
一个反常识问句(0-3秒)
   → 微距证据(剪开 / 并排 / 捏 / 称 / 量)
   → 数字结论
```

人不出镜,画面里只有手和机器。

**为什么有效**:知识类内容的观众留存靠**信息密度**——一条硬指标:**每15秒至少给出一个新事实**(一个数字、一个术语、一个对比)。密度够,观众就会有"这条我得存下来"的冲动,而收藏和分享是各平台推荐系统最看重的信号之一;密度不够,再好的画面也是划走。

**更新频率**:每周2-3条。做不快——一条要摆微距、要查数据、要确认自己没说错。这是它的成本,也是它的门槛。

**转化路径**:短视频 → YouTube长视频 → 落地页表单。这条路径最长,所以**询盘数量最少,但质量最高**——走完这条路径的人已经被教育过一整轮,他来的时候通常已经知道自己要什么帽型、什么工艺、大概什么价位。这类客户的成交周期短、砍价少、返单率高。

**可复制难度:中。** 门槛只有一个,但是硬门槛:**你必须真的懂。** 不懂的人只能翻译别人的知识,而翻译出来的东西经不起评论区里一个行家的追问——"你说的240gsm是坯布还是成品?"这种问题,答不上来就当场破功。

对读者:**这一条对读完本书的你最友好**。前十九章就是你的选题库,数字口径表就是你的弹药库,每一节的"本章工具"都是一条现成的视频脚本。别人做这类内容要从头学,你只是把已经会的东西对着镜头再说一遍。

**设备预算**:一部能拍微距的手机 + 一盏补光灯(¥100-300)+ 一个桌面支架(¥50-150)+ 一个手机三脚架(¥80-200),**总预算¥500以内**。这是全章唯一需要你花钱的地方,而且是一次性的。

**类型三:定制过程型**(客户下单到收货的全流程记录)

**内容公式**:

```
客户的原始需求(一张图稿截图 / 一句引用)
   → 打样 → 确认样签封 → 大货生产 → 装箱贴唛
   → 客户收到货的照片或视频
```

一单一条,或者一单剪成一个三到五条的系列。

**为什么有效**:它是**社会证明**(social proof)的最强形态。它不说"我们很好",它展示"别人已经选了我们,而且真的拿到了货"。最后那一帧——客户戴着帽子、或者把帽子摆在自己吧台上的照片——**说服力超过前面所有画面之和**,因为它是唯一一个不是你自己产出的证据。

**更新频率**:随单走,每月2-4条,取决于你有几单。这也是它最大的局限:**没有单就没有内容**。新人最初三个月手上没单,拍不出这一类。两条解法:一,把自己的样品当"客户单"完整拍一遍(流程一模一样,只是logo是你自己的);二,用第一单免费或半价去换一个愿意配合拍摄的本地客户(见22.5本地化打法)——**这一单你不赚钱,你赚的是内容资产**。

**转化路径**:主页案例集(IG carousel)→ 落地页 → 表单。这类内容的转化**不是即时的,是被翻到的**:一个正在犹豫要不要给你打定金的买家,会把你的主页从头翻到尾,他要找的就是这些案例。所以这类内容的正确摆放位置不是首页流,是**精选和置顶**——它是给已经在考虑你的人准备的。

**可复制难度:低到中**,但强依赖客户授权(见23.2.2)。

三种类型放一起对照:

| | 类型一 老板娘型 | 类型二 工艺科普型 | 类型三 定制过程型 |
|---|---|---|---|
| 内容公式 | 真人 + 固定场景 + 每天一件小事 | 反常识问句 + 微距证据 + 数字结论 | 图稿 → 打样 → 大货 → 收货 |
| 更新频率 | 每天1条 | 每周2-3条 | 随单走,每月2-4条 |
| 转化路径 | 评论 → 私信 → WhatsApp | 短视频 → 长视频 → 表单 | 案例集 → 落地页 → 表单 |
| 询盘量 / 质量 | 量大 / 质量参差 | 量小 / 质量最高 | 量中 / 意向最明确 |
| 可复制难度 | 高(心理与体力) | 中(必须真懂) | 低到中(依赖授权) |
| 适合谁 | 常驻车间的厂方人 | 懂工艺的贸易人 | 已经有单在跑的人 |

三种类型有三个共同点。**这三条才是本节真正要交付的东西**,因为它们比任何一种类型都更长寿。

**第一,三种都建立在"你有别人没有的现场"之上。** 老板娘的现场是车间,科普型的现场是工艺细节,过程型的现场是真实订单。**没有现场的账号,做的都是二手信息,而二手信息在任何平台都不值钱**——因为它可以被任何人复制,包括被AI批量复制。你的护城河从来不是剪辑技巧,是你站的位置。

**第二,三种都有一个固定结构,观众第二次看见就认得出来。** 做内容最容易犯的错是每条都换风格、换字幕样式、换开场方式。请把这句话记住:**风格不是审美,是识别码。** 观众在信息流里滑过你的第二条视频时,他不会读你的账号名,他靠的是"这个开场我见过"。固定的开场三秒、固定的字幕位置、固定的收尾句,比任何创意都值钱。

**第三,三种的转化都发生在内容之外。** 评论区、私信、落地页、表单——**内容负责让人认识你,链路负责把认识变成询盘**(见23.4.1)。这两件事缺任何一件,另一件就白做:有内容没链路,你会看着播放量涨而账上没钱;有链路没内容,你的落地页永远没人访问。

最后,给你一条选择规则,以及一个关于工厂的现实提醒。

**选择规则:按你的现场选,不按你的喜好选。**

盘点你现在的现场:一个**不属于你的工厂**(你是客人,不是老板,不常驻)、半年积累的**两千三百多张素材**、以及**一单从图到货完整走完的R&B**——包括那场事故和返工。

对应的最优解很清楚:**类型二为主,类型三为辅。** 工艺科普你有全书的知识做弹药,而且你刚好处在"学完但还记得自己不懂时是什么感觉"的黄金期——这个状态写出来的科普最好懂,过两年你就写不出来了;定制过程你有R&B这条完整时间线,从Mike那封五十词的邮件到吧台上的那张照片,一条不缺。

类型一暂时不适合你,因为你不常驻车间。等哪天你有了稳定的合作车间和长期的拍摄许可,再考虑。

**现实提醒:你拍的是别人的厂。**

这件事必须处理在前面。开拍前拿到厂长的同意,并且守住三条:

**一,不拍其他客户的货与款式。** 车间里同时在跑好几单,别人的帽子入镜是常事,后期要么打码要么不用。
**二,不拍报价单、不拍白板上的客户名。** 排产白板(见8.3.1)上写着所有在产订单的客户简称和交期,那是工厂最敏感的信息之一。
**三,不在视频里点出工厂全称和地址。** 说"山东青岛的一家帽厂"就够了,说全称等于把你自己的供应链交出去,也等于让工厂的老客户看见自己的货在别人的账号里。

为什么工厂会同意?因为你替他免费宣传,而他一分钱不花。为什么要守这三条?因为**他怕的从来不是被拍,是被抢客**。老崔当时听完你的请求,只说了一句:

> "拍吧。别拍别人的单子。"

七个字,把边界划得清清楚楚。这七个字你可以直接用在任何一家工厂身上——**先说清你不拍什么,你想拍的才拍得成**。

# 第24章 客户经营与复购

**主线推进** —— 十一月的最后一个星期四,晚上十一点多,你正准备关电脑,收件箱跳出一封新邮件。发件人是 Mike,主题栏只有两个词:

> **Round 2**

你愣了两秒才点开。心里已经替他把内容写好了:再来500顶,同款,同价,老规矩。

正文第一行确实是这个意思——"We're down to about 40 caps behind the bar. Same ones, 500 again."(吧台后面只剩四十来顶了。还是那个款,再来500。)但第二行开始就不是了:

> "Also — I sat down with my partner last weekend and mapped out next year. Attached. Can you tell me when I need to place these?"
>
> (另外,上周末我跟合伙人坐下来把明年整个排了一遍,见附件。你能告诉我这些各自该什么时候下单吗?)

附件是一张手打的表,四行,没有格式,连表格都不是,就是四行字:春季新酒发布,四月初;夏季啤酒节,八月中,要做赠品,得便宜;周年,九月十一号,和今年一样;节日礼盒,十二月,想要点保暖的。

你把这四行看了三遍,然后从椅子上站起来,在屋里走了一圈。

半年前,你的问题是"怎么让这个人下第一单"。现在,这个人把他明年一整年的日历交到你手上,问你他该什么时候找你。

**这两件事之间隔着的,不是运气,是这一章要讲的东西。**第一单交付之后你做了什么、没做什么;返单的窗口开在哪几天;折扣该给在什么地方才不伤价格;哪些客户值得你每个月花半小时,哪些必须果断放手。第五部前面四章讲的都是"把人带到门口",这一章讲的是门里面的事——**怎么让一个客户不用再被你找一次。**

## 24.1 首单后动作

### 24.1.1 复盘邮件与返单窗口:交付后30天黄金期

把镜头倒回十月初的那个上午。

你在整理 R&B 那单的结案文件夹:PI、CI、装箱单、验货报告、那张后补的CO、货代的对账单、事故一的返工照片、还有 Mike 发来的十四张活动现场照。全部归档、压缩、命名"R&B-2026-CLOSED"。鼠标停在文件夹上,你正准备把它拖进"已完成"那一层——

**这个动作,是绝大多数新人把一个客户丢掉的那一刻。**

不是因为你做错了什么。恰恰相反,货交了、钱收了、客户满意,一切完美。问题在于:**"完美地结束"和"开始下一次"之间,没有任何自动连接。**你不主动做点什么,这个客户就静静地躺在那个文件夹里,直到某一天他自己想起你——或者想起别人。

所以那个上午你没有拖动那个文件夹,你新建了一封邮件。

**为什么必须是30天**

这个窗口不是拍脑袋定的,它由三件同时成立、且同时会消失的事情撑起来。

**第一,他对交付体验的记忆还是热的。**九月初收货、九月中活动,到十月初刚好一个月。这时候他脑子里还留着"箱子打开时的样子""帽子摸起来的手感""查验延了三天但你提前告诉了他"这些细节。再过两个月,这些全部褪成一句模糊的"挺好的"。**而复购的决定,是靠细节做出来的,不是靠"挺好的"。**

**第二,活动效果的数据刚出来,而且还在他手上。**"Sold 61 last night"这句话是九月中发的,到十月初他手里已经有了完整的一个月零售数据:卖了多少顶、什么时候卖得快、有没有人问能不能换个颜色。这些数字在他脑子里是活的,你现在问,他随口就答;三个月后你问,他得去翻账。**你要的从来不是他的心情,是他的数据——数据会替你说服他自己。**

**第三,也是最要紧的一条:他的下一个决定还没做。**十月初,R&B 的明年预算还没排、活动表还没定、周边的钱还没分给别人。你这时候出现,是参与决策;你等到明年二月再出现,是打断决策。**同样一封邮件,早四个月发是顾问,晚四个月发是推销。**

给你两组可以拿去对表的经验数字,来自定制类小B业务的普遍规律:**交付后30天内发出的复盘邮件,回复率通常在七到八成**——因为客户觉得你还"在场";**拖到90天以后再发,回复率掉到三成以下**,而且回来的多半是一句客气的"Thanks, we'll be in touch"。再往后看一年:**首单之后认真做过复盘的小B客户,12个月内复购率大致落在50-60%;什么都没做、等客户自己回头的,落在20-30%。**这两个区间中间那三十个点,就是一封邮件的价值。而这封邮件的成本是四十分钟。

**复盘邮件写什么:三段,一段都不能少**

新人写这封信最容易写成两种废信:一种是"感谢您的信任,期待再次合作"——零信息量;另一种是"请问最近还有需求吗"——把自己降格成了催单的。正确的结构是三段,顺序不能换。

**第一段:数据回顾。**不是问候,是把你手上的事实摆出来。你要写的是"这一单实际发生了什么",用数字,包括不好看的数字。交期承诺多少天、实际多少天、延了几天、延的原因是什么;验货抽了多少顶、判了什么、返工多少顶、让步接受多少顶;清关花了几天、延的三天是什么原因。**为什么要主动写自己的黑历史?**因为这些事他本来就知道——事故一的80顶返工是他签字同意的,清关延三天是你自己写信告诉他的。你重新摆一遍,不是在提醒他你出过错,是在证明**你的账本对他是敞开的**。一个愿意把自己的差错写进复盘的人,和一个只报喜的人,在客户心里是两个物种。

**第二段:这次学到什么。**这一段最反直觉,也最有效——**你必须承认一件自己做得不够好的事,并且说出你改了什么规矩。**你写的是那张 CO:货代说加拿大不需要,你信了,结果 CBSA 布控要原产地文件,后补加急三天(见18.4.1)。你在信里写:从下一单起,不管客户在哪个国家,CO 在装箱前就办出来随货走。这句话对 Mike 的价值不在于道歉,在于——**他现在知道,和你合作,错误只会犯一次。**这是任何"我们品控严格"的话术都换不来的东西。

**第三段:下次可以怎么优化。**这一段必须给日期,不能给愿望。不写"期待下次合作",写"如果明年九月还有周年,四月中旬之前给我数量,就不用像今年这样赶,也不用留那两周的 buffer 去赌海关"。**这一句是整封信的钩子,而它伪装成了一句关心。**

把三段拼起来,就是你那个上午写的信。原文照抄给你,可以直接改数字用:

```
Subject: R&B 500 caps — what actually happened, and what I'd change

Hi Mike,

Now that the caps have been on the shelf for a month, here's the
full debrief — including the parts that didn't go to plan.

WHAT HAPPENED
· Quoted 35 days, shipped in 40. Five days late — embroidery was

  final inspection.
· 500 pcs / 5 cartons / 0.48 CBM, sea express, door to door.
· Held 3 days at CBSA for a random exam. Origin and fibre content
  documents were requested; cleared on the third day.
· In your hands 10 days before the event. That margin was the
  buffer doing its job, not us being fast.

WHAT I GOT WRONG
I was told a Certificate of Origin wasn't needed for Canada, and I
took that at face value. It cost us three days. New rule on my side:

WHAT I'D DO DIFFERENTLY NEXT TIME

注意最后那一问的写法:**"how are they moving"**(卖得怎么样),不是 "do you need more"(还要不要)。前者他会认真答,答案里全是你要的情报;后者他只会答"还没到时候"。

**返单窗口开了没有:六个信号**

复盘邮件发出去之后,你要做的不是等,是**观察**。返单窗口——客户从上一次交付到下一次采购决策之间,最可能被推动的那一段时间——不是一个日期,是一组信号。看到下面任何两条同时出现,就该主动出手了:

**一,他开始主动发使用场景的内容。**照片、视频、客人戴着帽子的抓拍。他发这些不是为了让你高兴,是因为**这批货在他的生意里正在产生反馈**,而人只会分享正在起作用的东西。

**二,他开始问"下一次"性质的问题。**"能不能做别的颜色""这个款有没有冬天戴的版本""你们做不做T恤"。这类问题在客户嘴里是随口一问,在你耳朵里应该是一声警报——**他的脑子已经在做下一次的方案了。**

**三,他的库存见底。**这一条最硬,而且你可以直接问,不用绕:"How many are left behind the bar?"(吧台还剩多少顶?)——这句话没有任何冒犯,因为你是供货的人,你问库存天经地义。剩三成以下,窗口就开了。Mike 那封 Round 2 的第一句话是什么?"We're down to about 40 caps."**四十顶,剩8%。**他自己把这个信号送上门了,但那是因为你在十月已经问过一次,把"剩多少"这件事装进了他的脑子。

**四,他的下一个活动日期公布了。**社媒、官网、邮件列表——他一旦对外宣布日期,采购决策就必然发生在那之前的某一天。你的任务是**在那一天到来之前先到**。

**五,他把你介绍给了别人。**这是最强的信号,强过任何一句夸奖。因为转介绍是有社交成本的:他把自己的信誉押在你身上。一个愿意押信誉的人,自己一定会复购。Mike 回复你那封复盘邮件时,数据后面跟了一句:"By the way, I gave your email to a friend who runs a yoga studio — hope that's okay."(顺便,我把你邮箱给了一个开瑜伽馆的朋友,希望你不介意。)——那就是 Dana(见22.4.2),而她是从复盘邮件的回信里走出来的。

**六,他在社媒上主动提到你或转发你的内容。**第23章那条案例内容,Mike 不但授权了,还转到了 R&B 自己的账号上。一个客户愿意在他自己的主页上承认"这是我的供应商",等于把你写进了他的品牌叙事里。**这种客户不会跑,除非你自己把他弄丢。**

本节动作,一件事,今天就做:打开你的订单表,给每一个已交付的订单加一列——**"复盘日"=交付日+30天**,然后把这些日期一次性全部设成日历提醒,提醒内容写死三个字:"写复盘"。这个动作花不了十分钟,但它把复购从"看客户什么时候想起我",变成了"我什么时候必须出现一次"。**这是你和这门生意之间,第一个不靠记性运转的机制。**

### 24.1.2 翻单的让利设计:折扣给在哪才有效

回到 Round 2 那封邮件。第三行还有一句你刚才跳过去了:

> "Same as last time, I assume the price holds?"
>
> (跟上次一样,价格没变吧?)

你的手放在键盘上,第一反应几乎是本能的:老客户、第二单、这么爽快,给他便宜五毛钱吧,9.40,显得有诚意。

**停在这里。这五毛钱是这一节的全部主题。**

**为什么单价一降就回不去**

单价是**棘轮**——只能往下转,转不回来。这不是心理学,是三条结构性原因。

**第一,单价是客户唯一会记住的数字。**规格表他不记、条款他不记、你为这单半夜起来盯过几次货他更不记,但"9块9"这三个字他会记一辈子。你降到9.40,从那一秒起,9.40 就是他心里的"正常价",9.90 变成了"上次多收的"。

**第二,单价是会传播的。**Mike 和 Dana 认识,Dana 背后是四百多个会员,会员里有开咖啡馆的、有开攀岩馆的。22.4.2 那张公开菜单之所以能立住,靠的就是"任何人同样数量都是这个价"这一条制度。你私下给 Mike 降五毛,菜单当场失效——不是因为会被发现,是因为**你自己知道它是假的,你下一次守价时手就抖了**。

**第三,单价里含着你唯一的抗风险缓冲。**500顶降0.50加元 = ¥1,300,而这一单的全部毛利是一万四。看上去只让了9%的毛利?再看19.5那张完全成本表:折让计提、意外备付、汇率波动、一次小返工,任何一样跳出来都是几百上千。**你降的不是利润,是明年出事时你还能不能笑着处理的余地。**

所以第一条纪律,写死:**翻单可以让利,但单价一分不动。**

**折扣的四种形态,按"可回收性"排序**

让利不是不能给,是要给在**用完就消失、不进入价格记忆**的地方。四种形态,从最优到最差:

| 形态 | 例子 | 客户感知价值 | 你的真实成本 | 明年还能收回吗 |
|---|---|---|---|---|
| ① 一次性费用减免 | 免制版费、免打样费 | 高(有明码标价) | **接近零**(版自有、规格未变) | 不需要收回,本来就该免 |
| ② 数量阶梯 | 400顶→500顶降一档 | 高(他自己算出来的) | 零(单价基准没动) | 不适用 |
| ③ 赠品与加值 | 赠装饰位、赠备用帽、免加急费 | 中高 | 低且可控 | **能**,下次不给就是不给 |
| ④ 单价直降 | 9.90→9.40 | 低(第二次就麻木) | 全额、永久 | **不能** |

第四行是唯一一个"你的成本永久发生、而客户第二次就感觉不到"的选项——**它是四种里最贵的一种,也是新人唯一想得到的一种。**

**关键技巧:把免费的东西,先报出价来,再划掉**

这是本节最值钱的一个动作,只有一句话,但绝大多数人不做:**你要免的那些费用,必须在报价单上先出现,标上标准价,然后在旁边写"WAIVED"。**

制版费翻单免收是行规(见9.4.2),你的版还是自购自有的,工厂连提都不会提。但如果你的报价单上根本没有这一行,Mike 就永远不知道他省了一笔钱——**你送出去的东西,客户没看见,等于没送。**

于是你给 Round 2 的报价单长这样:

```
RIDGE & BARREL — QUOTATION RB-QT-2026-002
Repeat order, style RB-DH-001, 500 pcs, DDP Vancouver

Unit price (500 pcs)  ........................  CAD  9.90   (unchanged)
                                                 ─────────
Setup / digitizing fee .......  CAD  40.00  ...  WAIVED   repeat order
Pre-production sample ........  CAD  60.00  ...  WAIVED   spec unchanged
Woven patch, back panel,
  200 pcs incl. attaching ....  CAD 240.00  ...  COMPLIMENTARY
                                                 ─────────
Order value ....... CAD 4,950.00
Value waived ...... CAD 340.00
Terms: 30% deposit / 70% before shipment. Lead time 35 days from
deposit. Price valid 30 days.
```

Mike 看到的是 **CAD 340 的让利**,单价那一行写着 unchanged。

现在算你的真实成本。制版费:版是你自己花¥200买断的、文件在你手机里(见9.4.2),成本 **¥0**。产前样:规格一个字没改,大货首件确认走照片流程即可(见10.7),成本 **¥0**。那200个织唛贴布(见3.3.1)——

**这里要兑现一件旧账。**你给老崔打了个电话。事故一那天,他在验货现场拍着桌子担了责,还说了一句"下次下单我送你200个织唛贴布"(见11.6.2)。你本来都快忘了,拨过去随口一提,老崔在电话那头笑:

> "早做好了,在我这儿放着呢。你那个山脊标,尺寸我按你上回给的图走的。缝工你也别算了,算我头上。"

200个织唛贴布,市价按¥0.5/枚算 **¥100**;后幅缝合工缴¥0.3/顶×200 = **¥60**,老崔全担。**你的成本:¥0。**

**CAD 340 的让利,人民币成本零。**这就是让利设计的全部技术含量——不是慷慨,是**知道哪些东西对客户有明码标价、对你没有成本**。

而那200顶带贴布的帽子,你在报价单下面加了一句:"这200顶可以当成限量版,吧台标个别的价试试。"Mike 后来把它标到了 $35。**一个零成本的赠品,变成了客户的一条新收入线**——让利做到这一层,它就不是折扣了,是服务。

**R&B 翻单实算:带你把两单摆在一起**

而最狠的一栏还没算:**时间**。第19章给过首单的工时——约170小时(见19.5)。翻单呢?数一遍你实际要做的事:确认数量、发一版报价单、收定金、给工厂下生产通知单、盯三次进度、验一次货、订一次舱、做一次单证、收尾款。**12到15个小时,一个周末就干完了。**

时薪对比,把这两个数并排放,你会记一辈子:

**十四倍。**

这就是4.4.2 里那个词的真正含义——**翻单红利**。在车间里,它是唛架现成、版带现成、工价谈好、工人手熟,爬坡损耗归零;在你这一侧,它是制版不用再买、样不用再打、厂不用再找、规格不用再谈、客户不用再教。**工厂那边的翻单红利是省了几天调机,你这边的翻单红利是省了一百五十七个小时。**

这也顺带解释了老纪当初那句"你这单我是当种子接的"(见8.2.1):他赌的从来不是这一单的八十几块提成,是第二单第三单不用再爬那条坡。**你现在和他站在同一边了。**

本节动作,三条纪律加一个模板:

**纪律一:翻单报价单必须有 WAIVED 行。**免掉的每一项,标准价照写,后面画横线写免。客户没看见的让利等于没让。

## 24.2 分级管理:ABC客户维护节奏

十二月的第一个上午,你打开那个从九月起就一直在长的 Excel,文件名叫"客户表"。

**四十七行。**

阿里国际站的询盘线索、展会上换来的名片、开发信回过的几个、LinkedIn上加上的采购、内容渠道的询价表单进来的——第五部四章滚了三个月,滚出来这么多。你从上往下拉了一遍,拉到底的时候,一个很不舒服的事实浮出来:

**这四十七个人里,你只在认真对待两个。**

Mike 和 Dana。剩下四十五行,躺在表里,像一层落了灰的名单。不是你懒——是你每天只有那么多小时,而这四十五个人每一个看起来都"值得跟进"。于是你的做法变成了最坏的那一种:**想起谁就发一封,谁回信就跟谁多聊两句。**结果是所有人都被平均地敷衍了一遍。

这一节要解决的就是这件事。**分级不是为了区别对待客户,是为了不欺骗你自己。**你的时间是这门生意里唯一不能增发的东西,不分级的结果不是"公平",是"全部不够"。

**四维评分:两维决定他值多少,两维决定他花你多少**

四个维度,每维1到5分,满分20:

| 维度 | 1分 | 3分 | 5分 |
|---|---|---|---|
| **年采购额** | <CAD 1,000 | CAD 3,000-8,000 | >CAD 15,000 |
| **复购频率** | 一次性,无下次 | 每年一次 | **一年3次以上** |
| **沟通成本** | 成交前往返>25封,反复改规格 | 往返10-15封,规格基本稳定 | **往返<8封,给需求给日期给预算** |
| **付款信用** | 追三次以上,曾拖过尾款 | 提醒后按期 | **定金当周到账,不用催** |

为什么偏偏是这四维?**前两维决定这个客户值多少钱,后两维决定他要花你多少成本。**这是20.2那条"毛利额÷垫资额"的第二次应用——上一次除的是钱,这一次除的是时间。同一种思维:**永远不要孤立地看收益,要看收益除以你投进去的那个稀缺资源。**

分档线,三档:

- **A级 ≥16分**,人数上限 **5个**。上限是硬的——超过5个,月度维护你做不动,做不动就会退化成群发,群发就等于没有A级。
- **B级 11-15分**,10到20个。
- **C级 ≤10分**,其余全部。

- 年采购额:明年日历合计 CAD 21,010(24.4会算给你看)→ **5分**
- 复购频率:一年5次 → **5分**
- 沟通成本:Round 2 那封邮件,他一次性给了数量、给了日历、给了问题 → **5分**
- 付款信用:首单定金D35到账、尾款D63到账,一次没催过(见14.1.1)→ **5分**

**20分,A级,而且是A级里的第一个。**再加一条评分表装不下的东西:他是你唯一的**转介绍源头**——Dana 是他给的,第23章那条案例内容是他授权并转发的。**一个愿意用自己的信誉给你背书的客户,价值不在他的采购额里。**

**Dana / Cedar Room Yoga:**

- 年采购额:CAD 960(80顶×12.00,见22.4.2)→ **1分**
- 复购频率:首单十一月中刚交付,下一次未知,五周年是一次性事件 → **2分**
- 沟通成本:她问得多,但每一问都在点上(会员数、余量、颜色),往返约12封 → **4分**
- 付款信用:全款预付,一次到账 → **5分**

**12分,B级。**

按规矩,B级是季度维护。但你在她那一行后面加了一个手写批注,把她**升到A级维护节奏,试三个月**,理由写了两条:①她自己就是转介绍来的,说明她所在的那个圈子里"定制帽"这件事正在传播;②Cedar Room 有四百多个会员,而瑜伽馆会员和"想做定制帽的小商家"高度重合(见22.4.2)——她不是一个80顶的客户,她是一个**入口**。

这里要立一条规矩,否则分级表会烂掉:**越级可以,但必须写理由,而且必须写复评日期。**"我觉得她有潜力"不是理由,"她的会员池和我的目标客户重合、三个月内若无第二个线索则降回B级"才是。**分级表的价值不在于分得准,在于它逼你把"我感觉"变成"我为什么"。**

**一个必须讲的翻车:热情不是维度**

九月底展会上你换到一张名片,多伦多一家做团队服饰的公司,聊得极好——对方主动加了 LinkedIn,你发消息他半小时内必回,发新品图他必点赞,回邮件的开头永远是 "Great to hear from you!"。你把他当A级维护了整整三个月,月月发信息,写了大概十七八封。

十二月你填评分表,填到他那一行,笔停住了:**年采购额栏空的,付款信用栏空的——因为他一单都没下过。**

四维里他只在"沟通成本"上得了高分,而那高分是假的:**回信快不等于沟通成本低,回信快而不下单,是最贵的沟通成本。**填完总分6分,C级。

这件事的教训写成一句:**热情不是维度,数字才是。**一个客户对你的态度和他给你的订单之间,没有必然关系;而人的本能会把"对我好的人"误判成"重要的人"。**评分表存在的全部意义,就是在你的本能犯这个错的时候,拦一下。**

**维护节奏与动作:节日问候不算维护**

先破一个最普遍的自我欺骗。很多人所谓的"客户维护",是这么几样:圣诞新年群发一封 Happy Holidays;隔两个月发一句 "How are things?";再隔两个月发一句 "Any new projects coming up?"

**这三样一样都不算维护。**理由很简单:**它们对客户没有用。**客户收到它们的时候,大脑处理的信息量是零,唯一的结论是"这个人想让我下单"。发得越勤,这个结论越牢固。

维护的定义,一句话立死:**每一次接触,必须带一条对方用得上的信息。**用得上的意思是:他读完之后,可以据此做点什么,或者知道了一件他原本不知道的事。

有效动作,六条,可以循环用:

**一,行业信息预警。**"棉纱那边一月要涨,你们如果明年春天有计划,十二月下单能锁住今年的价"——这条信息对他有直接的钱的意义。
**二,新SKU实拍,不带推销。**"我们上了个提花beanie的新工艺,拍了两张,你那个山脊线织出来大概是这个效果",附图,结尾不加任何一句"有需要请联系"。**不推销这件事本身,就是这封信最有力的部分。**
**三,同行用法。**"温哥华另一家酒厂把帽子做成了会员年卡的赠品,续卡率据说涨了不少"——你在给他递生意点子,而不是递报价单。
**四,日历提醒。**"你们四月初那个发布会,三月二十号前给我数量就能走海运"——这一条是本章下一节的核心,它是维护动作里唯一能直接变成订单的一种。
**五,生产现场。**他的货在跑的时候,拍一张裁床、一张绣花首件发过去。成本三十秒,效果抵十封邮件。
**六,互动他的内容。**他发新酒你点赞,他转发你的案例你也转他的——这是唯一不用写字的维护动作。

无效动作,四条,列出来是为了让你戒掉:节日群发问候、"最近怎么样"、"有没有新订单"、转发和他业务无关的公司动态。

维护节奏表:

| 级别 | 人数 | 频率 | 每次时长 | 主要动作 |
|---|---|---|---|---|
| **A** | ≤5 | 月度主动 | 30分钟 | 日历提醒 + 行业预警 + 一对一定制内容 |
| **B** | 10-20 | 季度主动 | 20分钟 | 季度新品邮件 + 一次一对一 |
| **C** | 其余 | 被动响应 | — | 年度菜单更新群发2次 |

算一下这套节奏的年度时间预算:A级5人×30分钟×12月 = **30小时**;B级15人×20分钟×4次 = **20小时**;C级两次群发各2小时 = **4小时**。**合计54小时/年,平均每周一小时零几分钟。**

每周一小时,换来的是什么?24.4 会告诉你:**光 Mike 一个A级客户,明年就是六万四的毛利。**

**降级、清理与归档**

每季度重评一次,三条硬规则:

**一,A级降级不留情面。**连续两个季度没有采购、也没有明确的下次计划,自动降B。不是惩罚他,是把你那五个A级名额腾出来给真正在下单的人。
**二,C级里12个月零回应的,移入"归档",不删除。**不删的原因很实际:第21章那封老客唤醒信是一年周期的武器,归档名单就是它的射击目标。
**三,任何越级和降级,都在备注栏写一行日期加理由。**半年后回看这一列,你会看到自己的判断力在什么地方系统性地偏了。

本节动作:把你的客户表重建成八列,今天填完——**客户名 / 所在地 / 类型(照20.2那张五类表填)/ 累计采购额 / 四维总分 / 级别 / 下次接触日 / 上次接触带了什么信息**。最后一列是全表的良心:**如果连续三次都填不出"带了什么信息",那不是维护,那是骚扰。**

## 24.3 价格变动:涨价话术与守价策略

十二月的第二个星期一,下午三点,老纪的电话打进来,开门见山:

> "跟你说个事,一月一号起,棉纱那边动了,17.5我做不了了。同款同规格,18.3。"
> 你问:"涨多少能有个说法吗?"
> "21支的坯布这一个月从11块2走到14块,布厂的调价函我扫给你。绣花线也跟着石油走,涤纶线一筒涨了两成。里衬檐芯、外箱纸,零零碎碎再加一毛五。工缴我一分没动,电镀那边铜价也涨了,滑扣套装我给你按老价再走一个季度。"

放下电话,你先做的是一件半年前不会做的事:**反算一遍**(见9.2.1)。坯布涨¥2.8/米,单顶用布连损耗按0.12米,**面料 +¥0.34**;8,800针的涤纶线按线耗折 **+¥0.25**;里衬檐芯加外箱纸他自己报的 **+¥0.15**。加起来 **¥0.74**,他报 ¥0.80。**差六分钱。**你在草稿纸上把这个数圈了一下,没打第二个电话——**六分钱不值得为它去损耗一个愿意提前一个月通知你涨价的业务员**;但他要是报一块二,这通电话就得打回去。**反算的价值不在于每次都去争,在于你永远知道自己在被要多少。**

算完成本,你才打开自己那张公开菜单的PDF(见22.4.2)。它挂在你的询价站上、账号主页上、能力单里,已经三个月了。**22.4.2 结尾那条纪律你自己写的:菜单价一年一调,调价前给所有老客户提前30天邮件通知。今天,这条纪律到期了。**

**涨价只有三个能说出口的理由**

先把不能说的排掉。"今年想多赚一点""大家都在涨""你上次那个价我亏了"——这三句话有一个共同点:**它们全都是关于你的,而客户凭什么为你的处境买单?**

能说出口的只有三个,每一个都必须**可举证**:

**一,原料涨。**举证物是工厂的书面调价函、布厂的调价通知、公开的原料价格指数。这个理由最硬,因为它在客户的常识范围内——他自己做精酿,大麦和啤酒花涨价他每年都遇到。
**二,汇率变。**你的报价用加元,成本用人民币,加元贬值就等于你降价。规则要写死:**波动在±2%以内用汇率buffer吸收(见9.7.2),超过±3%才动价**,并且动的时候要给出计价基准,不能含糊。
**三,规格升级。**你把标配提高了——比如标配从4行檐面线升到6行(见2.3.2)、标配加入独立塑袋和条码(见4.6.4)。**这是三个理由里唯一"客户拿到了更多"的一种,所以也是最好用的一种。**能把涨价包装成升级的时候,永远优先用它。

**什么时候该涨,什么时候该忍:一条阈值**

新人有两个极端:要么一分不敢涨,自己吃掉所有成本波动;要么成本一动就发涨价函,把客户当自动售货机。中间那条线,用**毛利率的变动**来划:

```
毛利率掉 <3 个点  ──→  自己吸收,不涨,不提
毛利率掉 3-6 个点 ──→  调菜单(新客户生效),老客户给锁价窗口
毛利率掉 >6 个点  ──→  一单一议,老客户也必须谈
```

带你算 R&B 这一单,看看老纪这次涨价到底该不该转嫁。

工厂出厂价 ¥17.5 → ¥18.3,**+¥0.80/顶**;同时旺季海派运价从¥2,900/方走到¥3,200/方(见17.4口径),500顶0.48方,¥1,400 → ¥1,536,**+¥0.27/顶**。合计成本 **+¥1.07/顶,500顶 +¥535**。

| | 涨价前 | 涨价后 |
|---|---|---|
| 收入 | ¥25,740 | ¥25,740 |
| 成本 | 11,050 | 11,586 |
| 毛利 | 14,690 | **14,154** |
| 毛利率 | 57.1% | **55.0%** |

**掉2.1个点。**按阈值,**R&B这一单不涨,你自己吸收。**

这个结论值得多说一句,因为它揭示了定制服务这一档最被低估的一个优点:**57%的毛利率本身就是一层缓冲。**同样是成本涨¥1.07/顶,如果你做的是7个点的批发单(见20.1.1),这一块钱直接把你从7个点打到不到3个点,你除了涨价没有第二条路。**厚毛利买到的不只是利润,是"不必每次成本一动就去骚扰客户"的自由。**这也是为什么老客户会觉得你"价格很稳"——不是你大方,是你的结构撑得住。

**但菜单必须涨。**为什么单一订单不涨、菜单要涨?因为**菜单价要覆盖的不是这一单,是未来一整年的所有新客户,和其中最坏的那个成本情形。**R&B这单的成本你已经知道了,新客户明年三月下的单,你现在什么都不知道。

调价方案:

| 档 | 旧价 | 新价 | 幅度 |
|---|---|---|---|
| 档一 · 快单 50-99顶 | 12.00 | **12.60** | +5.0% |
| 档三 · 标准定制 500-999顶 | 9.90 | **10.40** | +5.1% |
| 档三 · 标准定制 1,000顶+ | 8.90 | **9.30** | +4.5% |
| 加价项(制版CAD40、加位1.20、3D绣1.80…) | — | **全部不动** | 0 |

最后一行是有讲究的:**涨价涨在主价上,加价项一分不动。**因为加价项是客户对"这家会不会乱收费"最敏感的地方——主价涨5%他理解成成本,加价项涨5%他理解成你在抠他。

**锁价窗口:三个参数,一个都不能少**

**锁价窗口(price lock window)**——在新价生效之前,给老客户留出的一段"按旧价下单仍然有效"的时间。它不是人情,是一个有三个参数的条款,少写一条就会被钻空子:

**参数一,窗口长度:30天。**短了显得敷衍,长了你自己的成本会先扛不住。30天也刚好是报价单有效期的通行数(见15.2),口径统一。
**参数二,锁定条件:定金到账,不是口头确认。**这一条不写,你会在明年三月听到这句话——"我十二月就跟你说过我要订的呀"。**锁价锁的是行为,不是意向。**
**参数三,锁定期限:旧价适用于窗口内付定金、且交货在次年6月30日之前的订单。**这一条不写,你会在明年十一月还在按今年的价发货。

三条写成一句英文,直接进邮件:"Orders with a deposit received on or before Dec 31 will be produced at the current price, for delivery up to June 30."

**涨价通知邮件全文**

这封信要群发给所有老客户和活跃询盘。写法上有五个必须有的部件,标在右边:

```

Hi [Name],

Short notice, sent 30 days ahead so nothing catches you out.     ← ①提前

custom tier moves from CAD 9.90 to CAD 10.40.                    ← ②具体数

WHY

since October — my factory's written adjustment notice is
attached. Ocean freight for the season is up about 10% as well.
Nothing else has changed: same mill, same weight, same
construction.                                                    ← ③可举证

WHAT ISN'T CHANGING
Setup fees, extra-position embroidery, 3D and label add-ons stay
exactly where they are. Repeat orders still pay no setup fee, and
your embroidery file stays yours.                                ← ④给定心丸

第⑥个部件最容易被漏掉,而它是整封信里防守力最强的一句:**永远给一条降配的出路。**因为对预算卡死的客户来说,"涨价"和"我买不起了"是同一件事,而你给他的替代方案能把这件事变回"我买哪一版"。**给选择,永远比给解释有效。**

至于 Mike,他收到的是另一封,只有三句话。标准锁价窗口的期限是"次年6月30日前交货",而 R&B 拿到的是一个**破格**:因为他把明年五个节点的日期和SKU都定下来了(见24.4),**价格锁到明年十二月三十一日,新价从后年起。**破格要说清代价对等——你锁给他的是价,他锁给你的是明年一整年的排产确定性,这笔交换你不吃亏。这一下,涨价函从一个坏消息变成了年度日历的价值证明——**同一件事,对没规划的客户是涨价,对做了规划的客户是奖励。**

**守价三步:客户拿别家的低价来压你**

十二月中,一个从询价表单进来的客户,维多利亚的一家攀岩馆,500顶,你报 **CAD 10.00 DDP Victoria**。三天后回信:

> "I've got a quote from another Chinese supplier at USD 4.20 FOB Ningbo. That's a big gap. Can you do better?"

先算一遍表面差:USD 4.20 = CAD 5.73(1美元≈¥7.1,1加元≈¥5.2,见0.3)。**你的10.00 比他的5.73 贵75%。**这个数字会让新人当场慌掉,然后做出这门生意里最亏的那个动作:降价。

正确动作是三步,一步都不能跳。

**第一步,核规格。**这是 20.1.1 那句 "Happy to match the spec first" 的深化版:**在你知道对方的规格之前,任何比价都是无效的。**你回信要三样东西:克重、扣具、针数。他把对方的报价单转了过来:**180g、塑料排扣、6,000针、4行檐面线、无水洗。**

而你的是:240g、铜滑扣套装、8,800针、6行檐面线、轻酵素洗。

逐项换算差价,用第9章的BOM口径(见9.1.1):

| 项 | 他的 | 你的 | 差(¥/顶) |
|---|---|---|---|
| 面料克重 | 180g | 240g | 0.40 |
| 里衬檐芯 | 降配 | 原生PE 2.5-3mm | 0.30 |
| 扣具 | 塑料排扣 | 铜滑扣套装 | 1.10 |
| 绣花 | 6,000针 | 8,800针 | 1.26 |
| 檐面线 | 4行 | 6行 | 0.10 |
| 水洗 | 无 | 轻酵素洗 | 1.00 |
| | | **合计** | **¥4.16 = CAD 0.80** |

**第二步,算差价来源——把 FOB 和 DDP 之间那六项摆给他看。**

这一步是全节的杀招,因为**绝大多数拿 FOB 报价来压你的客户,根本不知道 FOB 之后还有六笔钱**。第13章那个词在这里第二次显形:**无知溢价**(见13.5)——只不过这一回,不知道的是他。

你把这张表附在回信里,一行不加评论:

| 货款 USD 4.20 × 500 | 2,867 |

**表面差 CAD 4.27/顶,真实差 CAD 0.73/顶。**500顶合 CAD 365。

注意这里的诚实——**你没有算出"其实我更便宜"。**你确实贵 365 加元,而这本身就是最有说服力的地方:一份把自己算到只剩 365 块差价的对照表,可信度远高于任何一份声称"我们性价比最高"的说辞。

那 365 加元买的是什么?你在信里写了四行:一个联系人;DDP 到门口卸货,他不用找报关行、不用开 BN 号、不用应付 CBSA 布控;出问题在中国这边解决——**80顶绣错线的时候,拆绣返工花了¥600 和两天;如果货已经躺在维多利亚,同样一件事就是把80顶全部寄回来,或者报废**;还有一句,他自己去看:R&B 那批帽子做成什么样,照片和视频都在。

**第三步,给选择题,不给让步。**你没有降价,你给了三个选项:

```
A  原规格,CAD 10.00 DDP Victoria
   240g / 铜滑扣 / 8,800针 / 6行檐面线 / 轻酵素洗
   一个联系人,门口卸货,出问题我担。

B  按对方规格,CAD 9.20 DDP Victoria
   180g / 塑料排扣 / 6,000针 / 4行檐面线 / 免水洗
   货和他那份一样,交付和担责还是我。

C  FOB 青岛,USD 4.05
   你自己订舱、自己清关、自己交关税与GST。
   上面那张到门测算表你拿去核,数字我一个没藏。
```

三个选项的设计有一层新人看不见的算计:**B 的毛利率比 A 还高。**算给你看——B的货款降到¥13.34/顶(减掉上表那¥4.16),500顶货款¥6,670,免水洗省¥500,成本合计约¥9,215,收入 500×9.20×5.2 = ¥23,920,**毛利¥14,705,毛利率61.5%**;A 的毛利率是 55% 上下。**因为你降的是货值,不是服务费。**这条规律记住:**降配报价往往比原规格更赚,前提是客户清楚地知道他降的是什么。**

结果:他选了A,但提了个条件——"送点贴纸,再多给三顶备用的。"你答应了。三顶帽 ¥52.5 + 一叠贴纸 ¥30 + 随箱不占运费,合计 **¥83,占这一单毛利的0.6%**。

**这就是24.1.2 那条纪律在守价现场的样子:他要的是"我砍下来了点东西"的感觉,而你给的是一样不进价格记忆的东西。**

最后立一条纪律,它比上面所有话术都重要:**永远不要说"我们的质量更好"。**这句话零成本、零信息量,任何人都能说,而且客户已经从三十家供应商那里听过三十遍。要说的是——"你那份是180克,我这份是240克;你那份是6,000针,我这份是8,800针;差在哪我给你一张对照表。"**能把差价拆成条目的人,才有资格谈价格。**

## 24.4 顾问式销售:R&B年度merch日历案例

现在回到章首那封邮件的附件。

Mike 的表就四行,没有格式,连表格都算不上,是他和合伙人周末坐在酒厂后院里手打的:

```
Spring release        — early April       — ~400 caps?
Beer fest             — mid August        — giveaway, need cheap
Anniversary           — Sept 11           — same as this year
Holiday gift boxes    — December          — something warm?

Can you tell me when I need to place these?
```

**最后那一句话,是这本书里最重要的一句客户台词。**

请把它慢慢读一遍。他没有问"多少钱一顶",没有问"你们做不做beanie",没有说"我再考虑考虑"。他问的是:**我该什么时候找你。**

这句话里藏着三层已经默认掉的东西:供应商是你,这件事没有再讨论;价格是可以接受的,不需要重新谈;他不知道怎么排,而他愿意让你替他排。**当一个客户开始向你要日期的时候,你已经不是在卖帽子了。**

**顾问式销售是什么:三个层次**

**顾问式销售(consultative selling)**——不围绕"我有什么"组织对话,而是围绕"你明年要做什么"组织对话,先把客户的计划弄清楚,再从中反推出产品与时间表。

三个层次,你可以拿它给自己定位:

| 层次 | 你的位置 | 对话由谁发起 | 客户怎么称呼你 |
|---|---|---|---|
| **响应型** | 你要什么我做什么 | 客户 | "那个报价的" |
| **方案型** | 你要什么,我给你两三个做法 | 客户 | "我的供应商" |
| **顾问型** | **我知道你明年要什么** | **你** | "我们做周边的人" |

从响应型爬到方案型,靠的是专业度——第1到4章那些面料、帽型、工艺的知识,就是这一级台阶。从方案型爬到顾问型,靠的不是知识,是**日历**:**你必须比客户更早知道他的截止日期。**

为什么帽子生意天然适合走到顾问型?因为20.1.3 已经说破了这类客户的本质——**帽子对小B是耗材,不是项目。**周年年年有,新酒季季出,啤酒节夏天必然办,冬天必然冷。耗材有节律,**有节律的东西就可以排进日历**。你卖注塑模具、卖工业设备,客户三年才买一次,你排不出日历;你卖帽子,客户一年买四次。

**把活动表翻译成帽子日历:倒推公式**

Mike 给的是活动日,你要给的是下单日。中间隔着一条完整的链条,每一段的天数第4章、第17章都给过口径:

```
活动日
 ├─ 减 到货缓冲            2周   ← 事故三教你的:buffer 是救命的那一段(见18.4.1)
 ├─ 减 海派专线到门     28-32天  ≈ 4.5周(见17.4)
 ├─ 减 生产周期         12-18天  ≈ 2周(见4.7.2)
 └─ 减 打样与确认(仅新款)      2-3周(见10.1.1)
 ═══════════════════════════════════════
 老款(免打样):活动日 − 9周     ≈ 提前两个半月
 新款(要打样):活动日 − 12周    ≈ 提前三个月
```

记成一句口诀:**老款提前两个半月,新款提前三个月。赶不上就得加钱——而加急插单费(订单额+10%,见4.7.3)和空运升级这两笔钱,是你不该赚、他不该付的钱。**

还有一条约束,它是整张日历上唯一一个不讲道理的东西:**中国春节。**节前一周到节后两周工厂基本停摆,恢复满产要到正月十五之后,前后**2到4周**没有产能;而节前一个月所有人抢船抢柜,交期和运价一起失控。规则写死:**任何要在春节后一个月内交货的订单,必须在春节前6周下定金。**2027年春节在2月6日,倒推——**12月26日是明年上半年第一批货的下单死线。**

Mike 的 Round 2 为什么是十一月底下的?**因为你在十月那封复盘邮件里提过一句春节。**他不知道什么是正月十五,但他知道"中国二月有三周不生产"。

**R&B 明年的帽子日历**

四SKU 方案是你在第1章给 Mike 的那份面料方案里埋下的(见1.1.2、1.1.4、1.2.4),那时候是"一句话成本为零的备注"。**十七个月之后,四个SKU在这张表上全部兑现。**

400顶×10.90 = CAD 4,360;500顶×9.90 = CAD 4,950。多100顶,多付590加元,单价省1.00——他自己会算这笔账,而且会加。**这就是22.4.2 那张菜单说过的话:好的菜单会替你做加单这件事,你一句话都不用说。**你在这里只做了一件事:把菜单那两行摆到他眼前。

这张表里有三处值得停下来看。

```
首单(2026):  ¥13,790 ÷ 170 小时  =  ¥81 / 小时
日历年(2027): ¥64,645 ÷ 113 小时  =  ¥572 / 小时
```

**七倍。**而这还是最差的一年——第三年,这四个SKU全部变成老款,不用打样、不用选料,全年工时会掉到65小时上下,时薪逼近一千。

**第三处:LTV 要重估了。**20.1.3 给过小B的客户终身价值区间:三年¥3-8万。那个区间没有错,它算的是**被动等翻单**的情形:每年一次、400顶上下、单顶毛利¥30,一年一万二,三年加首单大约五万,正好落在区间里。

现在把顾问式经营的数字放进去:首单¥13,790 + 第二年¥64,645 + 第三年保守持平¥65,000,**三年 LTV 约 ¥14.3万。**

**同一个客户,同一家酒厂,同一个 Mike。差的近十万块,不是客户变了,是你的经营方式变了。**

顺带修正一条获客纪律:20.1.3 说可承受获客成本 = LTV×20% = ¥6,000-16,000。这条不改——**因为你不知道哪个新客户能做成年度日历。**正确的表述是:**按¥3-8万的 LTV 去获客,按¥15万的标准去经营已经拿到手的客户。**新客户的价值是概率,老客户的价值是你自己的手艺。

**还有一笔不在表里的账:你在工厂面前的分量变了**

拿着这张日历,你可以做一件半年前做不了的事——**去跟老纪谈年度框架。**

你手里现在有的不是"下个月可能有500顶",是"明年二月500、三月300、五月600、六月500、九月400,一共2,300顶,SKU和月份都定了"。这个东西对老纪的意义,是8.3.1 那块白板上明年提前被占掉的五个格子。你可以谈的东西至少有三样:年度总量阶梯价(2,300顶按9.7.1 的阶梯,单价该往下走一档)、旺季排产的优先级、以及新SKU的免打样或半价打样。

第4章那句话现在有了下半段:工厂讨厌频繁换款、大厂拒绝小单,**是因为他们付的是爬坡曲线的钱;而一张能提前一年看到的日历,让爬坡曲线变成了可以预排的东西。**你从"一个小单客户"变成了"一个能报明年计划的人"——这两种人在老纪的排产表上,不是一个待遇。

**顾问式销售的三个动作(可复制到任何客户)**

**动作一,交付时就问下一个日期。**20.1.3 那条铁律的第三款——每单交付后30天回访,只问一句"下一个活动大概什么时候"——今天兑现了。**这个问题的答案不是情报,是明年的订单本身。**

**动作二,把他的日历做成你的日历,提前一个月发提醒。**注意措辞:不是"最近要不要下单",是——"你们四月初那个发布会,3月20日之前给我数量,就能走海运;过了这个点要走空运,一顶多两块多加元。"**前者是催单,后者是提醒。同一封邮件,一个让人厌烦,一个让人感激。**

**动作三,每个活动配一个SKU,并且给出物理理由。**理由必须能落到纤维、织法或结构上,不能落到"流行"或"好卖"。这是你和"卖帽子的"之间那条线。

最后是一条风险提醒,不写会出事:**年度日历不是合同,数量一定会变。**规则三条:**日历只锁时间和SKU,不锁数量;数量在每个下单死线前30天书面确认;永远不要为任何客户的日历提前备货**(20.1.1 那条"不为任何客户免费备库存"在这里同样成立——日历给你的是排产的确定性,不是让你替客户扛库存的许可)。日历的价值是让你和客户都不再被时间追着跑,**不是让你把风险从他那边搬到自己这边。**

## 24.5 坏客户识别:六信号与止损

Round 2 那封邮件进来的同一个星期,你的收件箱里还躺着另一封信。

发信人是新泽西一家做团队服饰的小店,十一月刚给他做完200顶。信的开头是这样的:

> "The caps arrived. The colour is off. I'm going to have to leave feedback about this unless we sort it out today."
>
> (帽子到了。颜色不对。今天要是解决不了,我只能去留个评价了。)

你把这封信读完,没有生气,只是把它和 Round 2 那封并排放在屏幕上看了很久。**同一个星期,同一个你,同样的工厂、同样的流程,两个客户。一个把明年一整年交给你,一个用差评威胁你。**

这一节讲的是:第二种人,怎么在他成为你的客户之前就认出来。

**六个信号**

先说一句总纲,它解释了为什么下面六条会成套出现:**这六个信号同源,它们全都指向同一个认知——这个客户认为你提供的服务不值钱,他付的钱只买了一顶帽子。**这个认知一旦形成不会因为你多让一步而改变,只会加强(见15.4.2:无条件让步只招来更多要求)。所以识别它们不是为了防小人,是为了**判断一段关系的基础是不是从一开始就错了**。

**信号一:压价压到没有毛利。**判断阈值不靠感觉,靠19.5 那条完全成本口径的下限:**定制服务这一档,完全成本毛利率低于25%就是红线。**典型台词:"Your competitor does 8.00. Match it and the order is yours." 注意它的形态——**只给一个数字,不给规格**;24.3 守价第一步(核规格)在这里就是一张筛子:**肯给你规格让你比的是买家,只肯给你一个数字的是压价的。**

**信号二:频繁改规格,而且不认账。**改一次两次是正常的,新客户都这样。危险的形态有两个:**改的是已经签封的东西**(确认样签封后再改,行规是重新打样¥300一轮加7天,见10.1.1);**以及口头改、拒绝书面确认**。典型台词:"I thought we agreed on charcoal, not navy."——而你翻遍往来邮件,只有他一句语音留言。

**信号三:付款拖延。**阈值写死:**定金超过7天不到账,一切生产准备停止。**不是威胁他,是保护你自己——你为他排的产、备的料、锁的舱位,全是真金白银。首单尾款需要你追三次以上的客户,第二单一定还会追三次。

**信号四:拿小单要大单的服务。**60顶要三轮实物打样、要工厂的验厂报告、要独立设计的包装、要你陪着开三次视频会。这一条最容易被新人误判成"这个客户很认真"。**不是。认真的客户会问你成本从哪来,他不问,他只是默认你的时间免费。**判断动作很简单:把他要的服务按第10章、第12章的口径报个价给他看("三轮实物打样是CAD 180,下单可冲抵"),他的反应会立刻把答案交出来。

**信号五:拿竞品报价要挟。**和信号一是同一件事的两个面,但这一条的标志是**"要挟"的语法**:不是"能不能帮我看看这个差价从哪来",而是"你不做这个价我就找别人"。前者在邀请你当顾问,后者在通知你你是备胎。

**信号六:出问题第一封信里就出现威胁词。**"leave feedback""PayPal dispute""report to the platform""charge back"——正常客户的第一封投诉信是描述问题("这个颜色和我在样品上看到的不一样,我拍了照片"),因为他真正想要的是解决;**上来就亮武器的人,想要的是筹码。**上面那封新泽西的信,第一句是问题,第二句就是威胁,中间没有任何一句"能不能帮我看看"。

**算一笔账:这一单到底花了你什么**

现在把这个客户的全过程摊开算。这是本节最该抄进笔记本的一张表,因为**坏客户的代价从来不在毛利表上,在工时表上。**

先看毛利。菜单档二(快反定制)200-299顶是 CAD 13.90(见22.4.2),他一路砍到 **CAD 10.50**,你当时想着"先接一单,攒个美东的案例",接了。

| 项 | 金额¥ |
|---|---|
| 收入 200顶 × CAD 10.50 | 10,920 |
| 快反厂货款(小单¥19/顶) | 3,800 |
| 制版费 | 200 |
| 打样2轮(他改了规格)+ 国际快递 | 1,100 |
| 空运(他要快,2箱抛货计费重32kg×¥35) | 1,120 |
| 换汇1.5% | 164 |
| 成本合计 | 6,384 |
| 账面毛利 | 4,536 |
| 售后折让5% | −546 |
| 补发10顶(货款+国际快递) | −490 |
| **实得毛利** | **¥3,500** |

再看工时,这一栏才是要命的:

| 环节 | 小时 |
|---|---|
| 报价往返18封 | 3.6 |
| 效果图4版 | 2.7 |
| 规格反复(3次改色、2次改帽型)+ 重新报价 | 5.0 |
| 催定金6封 + 3次跨时差电话 | 3.0 |
| 生产跟单(与正常单相同) | 8.0 |
| 到货争议:12封往返 + 拍照对色 + 调工厂档案 | 14.0 |
| 售后处理:折让谈判 + 补发安排 | 6.0 |
| 事后三天的效率损耗(保守折算) | 6.0 |
| **合计** | **约48小时** |

**时薪 ¥3,500 ÷ 48 = ¥73/小时。**

现在做那个减法。一个 R&B 翻单是13小时、毛利¥14,690。**48小时 = 3.7个翻单 = 毛利 ¥54,353。**

```
这一单实得       ¥3,500
同样时间的替代    ¥54,353
─────────────────────────
机会成本         约 ¥50,850
```

**这一单没有让你亏钱,它让你少赚了五万。**

而账面上永远看不到这五万——你的利润表会显示"新泽西单,毛利3,500,盈利"。**坏客户的杀伤力,全部藏在这张表看不见的那一栏里。**

那最后一栏"效率损耗6小时"不是煽情,是可观察的:一封威胁信之后的两三天里,你回所有邮件的速度会变慢,报价会不自觉地报保守,遇到需要拍板的事会想再等等。**它污染的不是心情,是判断。**

给你三条可以直接用的预警阈值:

- **时薪红线**:一单做完,毛利÷投入工时 **低于¥300/小时**,复盘时必须回答一个问题——同类的下一单,还接不接。
- **沟通量红线**:成交之前往返超过 **15封**、而订单额低于 **CAD 3,000** 的,自动进观察名单。
- **改规格红线**:确认样签封后的第一次修改免费但交期顺延7天,**第二次起 CAD 60/次并重开交期**(见10.1.1口径)。这条写进你的报价单备注,它本身就是一道筛子。

**止损三法**

**方法一,劝退报价(deterrent pricing)。**不是拒绝,是**把价格报到你真心愿意做的水平**——通常在正常价上加30-50%,并且附上完整的收紧条款:全款前付、规格锁定、改一次收费、交期不承诺加急。这个方法的妙处在于**三种结果都是好结果**:他接受了,你赚够了这份麻烦钱;他走了,你省下48小时;他还价了——那说明他其实没那么急,你对他的真实需求也就有数了。**注意用词:这里说的"劝退报价"和19.6 里的保本价/地板价(walk-away)是两回事**——后者是你的成本底线,前者是你主动往上抬的门槛。

**方法二,要求全款前付。**关键不在于这句话本身,在于**它必须以制度形式出现,不能针对人**:

> "For first orders under 300 pcs we work on full payment before production — it's the same for everyone, and it's why we can hold the 100-piece minimum."
>
> (300顶以下的首单我们统一全款前付,所有客户一样;也正因为这样,我们才守得住100顶起订这一条。)

后半句是灵魂:**你把一条对客户不利的条款,解释成了另一条对客户有利的条款的代价。**这是22.4.2 那套产品化逻辑的直接延伸——**制度是砍不动的,而这份"砍不动"是你自己写出来的。**

**方法三,明确拒绝。**拒绝的三条原则:**给理由,理由必须是结构性的、不可谈判的;不解释你的处境;给一个替代出口。**三段话术,按场景分:

```
① 量太小 / 服务要求超配
"Your quantity is below our production minimum, so anything I quote
you would be a bad deal for you. Two local decorators in your area
do this well: [A], [B]. If you ever get to 300 pieces, come back —
your artwork stays on file with me either way."

② 价格差得太远
"At 8.00 I'd be building a cap I wouldn't want my name on, so I'll
pass on this one rather than cut the spec quietly. If the budget is
fixed, here's the spec that genuinely lands at 8.00 — decide which
matters more and I'll quote whichever you pick."

③ 已经出现威胁语言
"Happy to sort this out — send me a photo of the cap next to the
approved sample in daylight and I'll pull the production records
today. If it's on us, I'll fix it at my cost. I'd rather solve it
than debate where it gets posted."
```

第③条要单独说一句。**面对威胁,唯一有效的动作是把对话拽回事实。**"拍一张自然光下和签封样并排的照片"这句话做了三件事:它给出了具体可执行的下一步;它调用了你们双方都签过字的那份客观标准(见10.6 骑缝签字);它不动声色地表明了你有完整的生产记录(见11.6.1 的证据链)。**而最后那半句——"我更想解决它,而不是讨论它会被发在哪里"——把威胁摆到了桌面上,同时没有升级冲突。**新泽西那一单,你回的就是这封信;对方后来发来的照片里,颜色和签封样一致,他改口说是"店里灯光的问题"。但这不重要——**重要的是,你在下一单来临之前,已经知道了他是谁。**

**放单记录:半年后它会告诉你两件事**

20.4 让你建过一个表,叫**放单记录**:每放掉一个单,写一行——日期、客户、为什么放。现在给它加第四列:**六信号里中了哪几条。**

半年后拿出来看,你会看到两件事,而且两件都很难受。**第一件:你放掉的单里,有一部分其实该接**——它们只是当时超出了你的射程,而你的射程这半年已经长了,这是扩边界的信号。**第二件更难受:你没放掉的那些让你后悔的单,信号在成交之前就全部出现过,而你当时装作没看见。**

新泽西那一单,回头翻邮件,信号一(只给数字不给规格)出现在第三封,信号四(200顶要三轮打样)出现在第六封,信号二(口头改色不认账)出现在第十一封。**三个信号,都在你收定金之前。**

本节动作,也是这一章、这一部的收尾动作:把你现在手上所有正在谈的询盘拉出来,对着六信号过一遍,每条打勾。**中两条的,把付款条件改成全款前付;中三条以上的,今天就用上面第①或第②条话术回掉,并在放单记录里写清楚原因。**

这个动作会让你的在谈数量当场少掉一截,而这正是它的目的。第五部花了四章教你怎么把人带到门口,**这一章最后要教的却是关门——因为你的时间只有那么多,给了错的人,就给不了 Mike。**

## 本章工具

**工具一:复购日历模板**

*倒推公式(照抄,改活动日即可)*

```
下单死线 = 活动日 − 到货缓冲2周 − 海运4.5周 − 生产2周 − 打样2.5周(仅新款)

  老款(免打样)…… 活动日 − 9周   ≈ 提前两个半月
  新款(要打样)…… 活动日 − 12周  ≈ 提前三个月
  走空运可压缩约4周,代价:500顶档约 +¥1,900(≈ +0.73加元/顶)
  加急插单可压缩生产约30%,代价:订单额 +10%(见4.7.3)

硬约束:中国春节前后2-4周无产能。
  春节后一个月内交货的订单 ──→ 春节前6周必须付定金。
```

*客户年度日历表(每个A/B级客户一张)*

| 活动 | 日期 | SKU | 数量 | 单价 | 打样死线 | 下单死线 | 出货 | 到货 | 状态 |
|---|---|---|---|---|---|---|---|---|---|
| | | | | | | | | | 待确认/已确认/已下单 |

*三条纪律*:①日历只锁时间和SKU,不锁数量;②数量在下单死线前30天书面确认;③永远不为客户的日历提前备货。

*提醒信模板(下单死线前30天发)*

```
Subject: [活动名] — your order date is [具体日期]

Hi [Name],

Your [活动] is on [日期]. To get the caps to you two weeks early
and go by sea instead of air, I need the quantity by [下单死线].

Same style as last time, so nothing else is needed — no sample,
no setup fee, no artwork. Just a number.

After that date it still works, but it goes by air: about
+CAD [X] per cap.
```

**工具二:涨价话术卡**

*三个能说出口的理由*:原料涨(附调价函)、汇率变(超±3%才动,见9.7.2)、规格升级(唯一"客户拿到更多"的一种,优先用)。

*涨不涨的阈值*

```
毛利率掉 <3 点  ──→ 自己吸收,不涨不提
毛利率掉 3-6 点 ──→ 调菜单(对新客户生效)+ 老客户锁价窗口
毛利率掉 >6 点  ──→ 一单一议
涨价涨在主价上,加价项一分不动。
```

*锁价窗口三参数*(缺一条就会被钻空子)

| 参数 | 写法 |
|---|---|
| 窗口长度 | 30天(与报价单有效期同口径,见15.2) |
| 锁定条件 | **定金到账**,不是口头确认 |
| 锁定期限 | 旧价适用于窗口内付定金、且交货在次年6月30日前的订单 |

*守价三步*

```
① 核规格 ── 拿不到克重/扣具/针数三个数,不谈价
② 算差价 ── 把 FOB→DDP 六项摆出来:货款/海运/目的港费/关税GST/内陆/规格差
              (见17.2.2、18.4.1;绝大多数客户不知道后四项存在)
③ 给选择 ── A原规格原价 / B按他的规格重报 / C给他FOB价,清关他自己扛
              永远给三选一,不给"再便宜点"
```

*一条禁令*:**永远不要说"我们的质量更好"。**要说"你那份180克,我这份240克;你那份6,000针,我这份8,800针"——把差价拆成条目。

*规格对照表(比价时随信附上)*

| 项 | 对方 | 我方 | 差(¥/顶) |
|---|---|---|---|
| 克重 / 里衬檐芯 / 扣具 / 针数 / 檐面线 / 水洗 | | | |

**工具三:客户分级维护表**

*四维评分(每维1-5分,满分20)*

| 维度 | 1分 | 3分 | 5分 |
|---|---|---|---|
| 年采购额 | <CAD 1,000 | CAD 3,000-8,000 | >CAD 15,000 |
| 复购频率 | 一次性 | 每年一次 | 一年3次以上 |
| 沟通成本 | 往返>25封、反复改规格 | 往返10-15封 | 往返<8封,给需求给日期给预算 |
| 付款信用 | 追三次以上/曾拖尾款 | 提醒后按期 | 定金当周到账 |

**A ≥16分(上限5个)· B 11-15分(10-20个)· C ≤10分(其余)**

*维护节奏*:A月度主动30分钟 · B季度主动20分钟 · C被动响应+年度群发2次。年度总时间预算约54小时。

*有效动作六条*:行业信息预警 / 新SKU实拍不推销 / 同行用法 / 日历提醒 / 生产现场照 / 互动他的内容。
*无效动作四条*:节日群发问候 / "最近怎么样" / "有没有新订单" / 转发无关的公司动态。
*一句定义*:**维护 = 每一次接触都带一条对方用得上的信息。**

*客户表八列*:客户名 / 所在地 / 类型(见20.2)/ 累计采购额 / 四维总分 / 级别 / 下次接触日 / **上次接触带了什么信息**。最后一列连续三次填不出来,那不是维护,是骚扰。

**工具四:坏客户六信号自查卡**

```
□ ① 压价到完全成本毛利率<25%,且只给数字不给规格
□ ② 签封后改规格、口头改、拒绝书面确认
□ ③ 定金超7天不到 / 尾款要追三次以上
□ ④ 小单要大单服务:60顶要三轮实物打样、要验厂报告
□ ⑤ 拿竞品报价要挟(语法是"你不做我就找别人",不是"帮我看看差价")
□ ⑥ 第一封投诉信里出现 feedback / dispute / chargeback / report

中2条 ──→ 付款条件改全款前付
中3条 ──→ 劝退报价(正常价+30-50%,全款前付,改一次收费)或直接回绝
放单后,在放单记录里写清楚:日期 / 客户 / 为什么放 / 中了哪几条
```

*三条预警阈值*:时薪<¥300/小时的单,复盘时必须回答"下一单还接不接";成交前往返>15封且订单额<CAD 3,000,进观察名单;签封后第二次改规格起,CAD 60/次并重开交期。

> **本章作业**:三件事,一个下午做完,全部落在纸上。
>
> **第一件,写一封复盘邮件。** 找出你手上最近的一次"交付"——真的订单最好,没有的话,就用你最近替别人完成的任何一件事(帮朋友装了台电脑、给亲戚办完一件手续、交付了一份工作报告都算)。按24.1.1的三段结构写:**第一段只写事实和数字**(承诺了什么、实际做到了什么、差了几天、差在哪);**第二段必须写一件你自己做得不够好的事,并且写出你改了什么规矩**;**第三段给一个具体日期**,而不是一句"下次继续合作"。写完先别发,读一遍,把所有"感谢您的信任""期待再次合作"这类句子划掉——划完还剩多少字,就是这封信的真实价值。
>
> **第二件,给一个真实的对象排一张年度日历。** 用20.4 那张画像卡里你填过的三个潜在客户之一,去他的官网、Instagram、Google Maps 评论区里翻,把他今年办过的所有活动和季节性节点找出来(周年、开业纪念、节日、赛季、市集、发布会),按月份排成一列。然后给每个节点配一个SKU,并且**在旁边写下物理理由**——不许写"这个好卖",要写"这个场景出汗所以用涤纶""这个月份温哥华在下雨所以用腈纶"。最后用工具一的倒推公式,把每个活动的下单死线算出来。**排完你会发现一件事:你现在比这个客户自己更清楚他明年要做什么。这就是顾问式销售的全部秘密。**
>
> **第三件,给自己算一次坏客户的机会成本。** 回想过去一年里最消耗你的那一件事(任何工作、任何合作、任何一段关系都行),诚实地估算它占掉了你多少小时——**包括事后那几天你心不在焉的时间**。然后估算你在这段时间里的实际所得。最后做那个减法:同样的小时数,如果全部投在你手上最顺、最赚钱的那件事上,会是多少。**把这三个数字写在同一张纸上,贴在你桌前。**下次再遇到六信号里的前三条,你不需要犹豫,那张纸会替你回答。

*客户能自己回来了,日历能排到明年年底了,毛利率在57%上下站住了——到这一步,你手里的已经不是"一单生意",是一门生意。而一门生意到了这个体量,前面五部一直被你绕开的那些问题会同时找上门:钱该收进谁的账户、生意用谁的名义做、超过多少要开票报税、客户的商标在中国被人抢注了怎么办、你和工厂之间那份从来没签过的东西要不要补上。第六部从这里开始,它不再教你怎么赚钱,教你怎么把已经赚到的钱和已经攒下的关系,放在一个不会突然塌掉的结构里。下一章:[第25章 主体、税务与合规](chapters/ch25.md)*

这一章要办的,就是把"你"从一个收邮件的人,变成一个能签合同、能开发票、能收汇、能退税、能对自己出的货负法律责任的**主体**。

## 25.1 经营主体

### 25.1.1 国内三选一:个体户/公司/SOHO挂靠

先把这三个词摆在同一张桌子上,它们不是三种"公司形式",是三种**你在这门生意里的法律位置**。

**个体工商户**:自然人经工商登记后从事经营活动的形态。它有营业执照、有名称、能开对公户、能开发票,但它**不是法人**——法律上它就是"你"这个自然人在做生意,所以经营中的债务由你以**个人全部财产**承担,这叫无限责任。

**有限责任公司**:独立法人,股东以其**认缴的出资额**为限对公司债务承担责任。你写认缴50万,最坏情形下你赔50万;公司欠了200万,债权人追不到你名下的房。注意2024年新《公司法》施行后,认缴出资有**五年实缴期限**的要求——所以"认缴额随便写大"的时代过去了,写多少你就得在五年内掏多少。

**SOHO挂靠**:你没有主体,借别人的正规抬头出口(见18.2.1路一路二),或者干脆买单(见18.2.2)。它不是一种主体,是**没有主体的一种活法**。

三条路的完整对照,这张表你可以直接拿去做决定:

| | 个体工商户 | 有限责任公司 | SOHO挂靠/代理 |
|---|---|---|---|
| 注册成本 | ¥0-500(自办免费,代办300-500) | ¥0-2,000(核名+刻章+开户) | ¥0 |
| 注册周期 | 3-7个工作日 | 5-15个工作日 | — |
| 年固定成本 | 代账¥1,500-3,000 | 代账¥3,000-6,000,地址挂靠¥1,000-3,000 | ¥0 |
| 每票成本 | ¥0(自己报关) | ¥0 | **¥300-800/票**或货值0.5%-1% |
| 责任 | **无限责任**,个人财产兜底 | **有限责任**,以认缴出资为限 | 你既不是责任人,也不是权利人 |
| 主要税种 | 增值税+**经营所得**个税(5%-35%五级累进) | 增值税+企业所得税+分红个税 | 账面上不存在,所以"不交税" |
| 能否办进出口权 | **能**,六件事完全适用(见18.2.1) | **能** | 不适用 |
| 能否退税 | 能,但前提是登记为**一般纳税人**;小规模纳税人出口只**免税、不退税** | 同左 | **一分拿不到** |
| 对公收汇 | 能(可开外汇结算账户+名录登记) | 能 | 个人卡,灰(见25.2.3) |
| 客户观感 | 英文抬头不好写,尽调查不到 | 正规,可签英文合同、开CI、进供应商库 | 你的名字不在任何单据上 |
| 退出成本 | 简易注销,快 | 注销要清税,3-6个月 | — |

表里有两行是新人从来不看、事后最疼的,单独讲透。

**第一行是"责任"。** 你可能觉得帽子这门生意能出多大事——那就代入一次:你接了一单3,000顶童帽,发到美国,客户抽检铅超标(见25.5),整批召回,索赔USD 25,000。如果你是个体工商户,这笔钱追到你个人名下的存款和房产;如果你是有限公司且认缴10万,债权人拿到的上限就是那10万加公司账上的钱。**注册一家有限公司比注册个体户多花的那一天时间和几百块钱,买的就是这道墙。**

**第二行是"能否退税",而且坑在括号里。** 很多人以为"办了公司就能退13%",错。退税的完整前提是三件事(见18.3.1):有进出口权、办了退(免)税备案、**并且你能拿到并抵扣增值税专用发票**。最后这一条要求你是**一般纳税人**——年应征增值税销售额超过500万元的必须登记,没超过的可以自愿申请登记。而**小规模纳税人**出口货物适用的是"免税不退税":出口环节免征增值税,但那13%也别想拿回来。所以对一个想吃退税的外贸主体,标准动作是:**注册有限公司 → 主动申请登记为一般纳税人 → 办退(免)税备案**,三步一步都不能省。反过来,如果你的模式是"从1688拿现货贴牌、供应商根本开不出专票"(见6.5.1),那你留在小规模、按免税走,反而账更简单、成本更低。

给你**明确的推荐路径**,不打太极:

```
阶段0(还没有稳定客户,前3-5票,年出货 < ¥10万)
   → 借正规抬头/找代理出口,每票必须要回报关单副本存档
   → 不要买单(见18.2.2)
阶段1(命中下面任一触发条件)
   → 直接注册【有限责任公司】,同步办六件事 + 一般纳税人 + 退税备案
   → 不要走"先注册个体户,做大了再转公司"这条弯路:
     个体户不能变更为公司,只能注销重来,你的客户档案、
     银行流水、海关信用、名录分类全部清零重算
阶段2(年利润稳定 > ¥30万,且北美客户要本地合同/要上独立站)
   → 加一个海外主体,组成双主体(见25.1.2)
```

**触发时机四条,命中任何一条就到点了**,不是"两条都满足":

1. **年出口货值超过¥30万**(见18.2.1);
2. **客户开始要正规单据**——发票抬头是公司、要报关单、要CO、要进口凭证抵税;
3. **出现第一次翻单或第二个客户**——这句话的意思是:这不再是一锤子买卖,而是一门要活三年的生意;
4. **你要上平台**——阿里国际站、亚马逊、独立站收款,开店那一步就卡主体。

你今年命中了第2条和第3条。Mike的会计要发票、R&B翻单了500顶并排出了明年2,300顶的年度计划、Dana介绍来了第二个客户——**三个信号同时亮,只是第一条数字没到而已。而阈值是"或"不是"且"。**

最后给你办证那天真正会卡住的四个细节,别人不会告诉你:

**其一,经营范围必须写对。** 一定要有"**货物进出口;技术进出口**"这两项,漏了后面备案办不了,变更还要跑一趟。顺手把"服装、鞋帽、纺织品销售""服装辅料销售""广告设计"一起写进去,反正不要钱。

**其二,注册地址。** 没有实际办公场地就用园区挂靠地址,行价¥1,000-3,000/年,有些园区还返税。但要知道风险:**税务和市场监管会做实地核查,联系不上就被列入经营异常名录**,而经营异常会直接影响你的海关信用和银行开户。所以挂靠地址一定要选能代收公文、能配合核查的。

**其三,认缴出资写多少。** 结论:**写¥10万-50万**。写太小(比如1万)客户尽调时不好看;写太大(有人一冲动写1,000万)是给自己五年内挖了个1,000万的坑。

**其四,银行基本户。** 开户是整个流程里最慢的一环,银行要做尽职调查,可能要你提供办公场地照片、上下游合同。**带上你和Mike的PI去**——有真实业务的账户,银行开得快得多。
