# 第3章 装饰工艺:logo怎么上帽子

**主线推进** —— 规格表(见2.5.2)定稿后的第三天,Mike 的邮件带着三个附件到了:酒标的矢量原图、一张官网用的png,和一版标着"for embroidery"的新文件。你点开第三个,愣了一下——设计师在山脊线、橡木桶和 RIDGE & BARREL 字样的酒标基础上,去掉了背景底纹,在桶的两侧各添了一支金黄色的麦穗,穗粒饱满、麦芒根根分明。Mike 的附言一如既往地短:"设计师说这版是专门给绣花做的,麦子代表原料。能绣出来吗?多少钱?"你把图片放大到全屏:每支麦穗十几粒麦粒,最细的麦芒比铅笔线还细;字样、山脊、桶身,粗细完全不是一个量级。能绣出来吗——你意识到自己连"绣一针"是什么都答不上来,更别提这个logo要多少针、一针多少钱、什么样的线能绣出品牌手册上那个金黄 PMS 7406C(见1.4.2)。布料的语言你已经会说了,帽子的零件也认全了,现在轮到定制生意真正的核心:**客户买定制帽,买的就是把logo放上去——这一章,学会判断一个logo怎么上帽子、上得好不好、要花多少钱。**

## 3.1 绣花(Embroidery):行业主流

绣花是帽子装饰的默认答案——为什么是默认,3.2.4会给你完整的机制;先把这门工艺本身学透,从最小的单位开始。

### 3.1.1 一针是什么:绣花的像素

去把你衣柜里那顶戴得最久的帽子再拿出来——1.1.1的作业用过它,这次看的不是布,是前幅那块logo。拿到窗边自然光下,手机开微距,或者用一个十倍放大镜凑上去:肉眼里浑然一体的"绣出来的图案",在放大镜下当场解体——它是一排排并列的短线段,每段一两毫米长,一根挨一根,像犁过的田垄。**每一段线迹,就是一针(stitch)**:绣花机的机针带着面线扎穿布面一次,在布的背面与底线绞合,拉出一段线迹,机器的计数器加一。一个logo,就是几千到几万个这样的线段,按精确的顺序和方向排出来的。

这就是本节标题那个比喻的全部含义:**针是绣花世界的像素**。屏幕上的图像放大到头是一个个色块,绣出来的logo放大到头是一根根线迹;图像的清晰度看像素密度,绣花的精细度看针迹密度。但绣花的"像素"比屏幕的高级一层——像素是方的、无方向的,线迹是有方向的:一片区域里线迹统一朝一个方向铺,光线打上去整片同时反光,换个角度整片同时变暗,这种缎面般的光泽流动,是印刷永远模仿不出来的质感,也是"绣花显档次"的物理来源。

放大镜下你还能认出三种基本"笔画",全行业的绣花都由它们构成。**走针**(running stitch):单根线迹首尾相连往前走,像缝纫的明线,用来勾细轮廓、绣极细的线条——酒标上那条山脊线的棱,多半就得靠它。**包针**(satin stitch,也叫缎纹针):线迹左右来回摆动,把一条笔画整个"包"起来,表面是连续的缎面,文字笔画、边框、粗线条的主角——RIDGE & BARREL 那十几个字母,每一笔都是包针。**榻榻米针**(tatami,填充针):线迹一行压一行地把大面积铺满,表面有细密的织纹感——橡木桶的桶身填色就是它的活。你在自己帽子的logo上找找,三种针法几乎一定都在。

带你算第一笔针数账,以后无数笔账都从它长出来。包针的针距——相邻两针落点的间隔——标准约**0.4毫米**:一条1厘米长的笔画,线要来回摆约25个来回,一来一回是两针,就是50针。一个8毫米高的无衬线大写字母,笔画总长约3.5厘米,折下来**约180针**;还没算你看不见的一层——正式盖面针之前,机器会先在底下打一层稀疏的**底针**(underlay),把布面绷稳、把绒毛压平,再往上盖面针,底针占总针数一成上下,藏在logo底下,却实实在在计入针数、计入钱。

面料市场二楼有几家绣花加工档口,做现货帽的二次加工生意。你揣着 Mike 的logo上去问,老师傅接过手机看了两眼,你问:"这个大概多少针?"他把手机还给你:"猜它干嘛,机器数得比谁都清楚——**针数就是钱数**,你先搞明白一针是什么,回头我教你看文件。"这句"针数就是钱数",就是往后三节的全部主题。

本节动作:在你自己的帽子上完成三件事——①用手机微距找一段包针,数1厘米里有多少个来回,验证0.4毫米针距这个数;②把走针、包针、榻榻米各认出一处,拍照标注;③目测估一下整个logo的针数量级,把数字写下来——学完3.1.3回来对答案,误差之内,这一节就长在你眼睛里了。

### 3.1.2 针数三因素:面积、密度、工艺

回到 Mike 的附件。你把绣花版logo铺满屏幕,忽然发现一个此前完全没想过的问题:**这个logo该多大?**设计师的文件是矢量图,要多大有多大;可绣在帽子上,大一分和小一分,针数和钱完全是两回事。针数由三个因素决定,面积排第一。

**因素一:面积。**填充类针法的针数近似与面积成正比——铺满1平方厘米要多少针是基本恒定的(具体系数下一节给你),所以面积翻倍,针数跟着翻倍。这里藏着一个新手必踩的陷阱:**尺寸是按边长说的,针数是按面积长的**。带你算:一个6厘米宽的logo放大到7.5厘米,边长只放大了1.25倍,听起来"就大一点点",但面积是1.25的平方——**1.56倍**,填充针数跟着涨五成多。客户一句"再大一点点更醒目",翻译成钱是绣花费贵一半。顺手把画布边界也钉住:六片dad hat的前幅(见2.1.2、2.2.1),帽檐上沿到接近顶扣的可绣区大约高5.5厘米、宽10厘米出头,常规logo做到**宽6-8厘米、高3-5厘米**最稳——再宽,图案两端开始爬上前幅的弧面,变形风险陡增(弧面这件事3.2.4还有大用)。至于前幅正中那条中缝——绣花机根本不在乎,针照样扎、线照样盖,logo骑着缝绣过去毫无痕迹,这是绣花统治六片帽的第一个结构性原因,先记下。

**因素二:密度。**同样的面积,"绣多满"是另一个维度。只用走针勾一圈轮廓的山脊线,几百针就下来了;同一座山用榻榻米填满,几千针起步——**线稿和满绣之间,针数差三到五倍**。密度还有更细的一层:同是满绣,针距0.4毫米是标准密度,加密到0.3毫米,布面更厚实、盖底更严,针数再涨两三成;工厂报价时说的"我们绣得密、用料足",指的就是它——密度是真实的成本,也是真实的效果,但必须写进文件而不是停在嘴上,否则大货悄悄放稀,你肉眼未必看得出。

**因素三:工艺。**同一个图,平绣是基准;改3D立体绣,要先垫泡棉再用加密包针把泡棉整个包住,针数上浮30-50%;改贴布绣,大面积填充换成一块布,针数反而省一大截——这三兄弟的完整对比放在3.1.7,此处你先建立一个总公式:**针数 = 面积 × 密度 × 工艺系数**,三个旋钮,每个都连着钱。

一场翻车让你记住"尺寸必须写死"。一位做团队单的同行,logo签样时6厘米宽,客户临下大货前微信一句"放大10%,气势一点",他顺手答应了——边长+10%,面积+21%,针数从9000涨到近11000,绣花费每顶贵出八毛,500顶就是四百块。工厂按新文件做完找他补差价,他找客户,客户说"放大一点点也要加钱?"——三方僵住,最后他自己吞了。病根不在放大,在**他答应时不知道自己答应的是什么**:没有"面积-针数-钱"这根链条,客户的每一句"小改"你都在盲签。

本节动作,两条。第一,回复设计师的邮件里写死尺寸:"**logo成品尺寸:宽75毫米×高45毫米,以毫米标注为准**"——尺寸从此是文件的一部分,不是聊天记录里的一句话。第二,把一条规则抄进你的报价习惯:**"logo尺寸、密度、工艺任一变更,针数与价格重新核算"**——一句话写在报价单备注栏,上面那四百块就永远轮不到你出。

### 3.1.3 常见针数区间:建立数量级直觉(9000针锚点)

三个因素认全了,现在把它们拧成一个能揣在兜里的数。行业里谈绣花,开口闭口"这个logo一万二""那个六千"——针数是绣花世界的报价语言,而新手和老手的区别,就是听到一个针数,心里有没有一杆秤:这个数正常吗?贵了还是虚了?这一节给你铸这杆秤。

先给系数,3.1.2那个公式的具体数值:**标准密度的满绣,每平方厘米约300针**(含底针和收边)。这是个粗糙但极好用的数——有了它,任何logo你都能三步心算:量出满绣部分的面积,乘300;数出文字,按8毫米高的字母每个约180针(3.1.1算过)加上去;有走针细线条,按每厘米约20针补个零头。心算结果和制版后的真实针数,误差通常在两成以内——足够你判断报价、拦住离谱的数。

用这杆秤,先称出全行业的针数地图:

| logo类型 | 针数量级 |
|---|---|
| 小文字/细线条logo(宽3-4厘米,只勾轮廓) | 3,000-6,000针 |
| 常规前幅logo(宽6-8厘米,图形+文字,部分满绣) | 6,000-12,000针 |
| 大面积满绣/多色复杂图案 | 15,000-25,000针 |

**常规前幅logo落在6000-12000针**,这是你该背下来的第一个区间。区间的正中,给你钉一个全书反复使用的锚点:**9000针 ≈ 一个直径6厘米的实心圆满绣**。验算给你看:直径6厘米的圆,面积约28平方厘米,×300针=8400针,加上包针收边一圈,正好9000上下。以后任何针数报到你面前,先跟这个锚点比:比"一个直径6厘米的实心圆"料多还是料少?针数比9000高还是低?两头对不上,必有一头在说谎。

拿 Mike 的logo当场练。你把矢量图按75×45毫米(3.1.2定的尺寸)量了一遍:橡木桶加山脊的满绣部分约14平方厘米,×300≈4200针;RIDGE & BARREL 十三个字符,×180≈2300针;两支麦穗,穗粒是密集的小包针、麦芒是走针,你按半满绣估了约1600针;再加轮廓收边的零头——合计**8500-9000针**。你把"约9000针,常规量级中位"写进笔记。这个数后面每一节都要用:算时间、算钱、核制版文件,一路用到第9章的报价单上。

二楼那位师傅给你看了他的日常:客户微信发来logo图,他手指放大看两眼,回一个数——"这个一万一""这个五千绣不满,六千五"。你问他怎么算的,他说:"哪有算,看了二十年。"你现在有系数、有锚点、有心算三步,**用三分钟到达他二十年的毛估能力的八成**——剩下两成是制版细节,下一节的事。但先记住这杆秤的第二个用途:**拦虚报**。同行圈里流传的一类事:logo实际7000针出头,工厂报"12000针",按千针计价每顶多收两块多,客户不懂针数,单单照付——你懂了区间和锚点,这类数字到你面前活不过十秒。给你两个警报阈值:**前幅logo报价超过15000针**,要么logo该简化,要么针数掺水,先要文件核(3.1.9教你核);**低于3000针的"满绣"**,密度必然被抽稀,绣出来盖不住底布。

本节动作:打开手机相册或电商页面,找三个知名品牌的帽子正面图——比如一个纯字母logo、一个小图形logo、一个大满绣——用三步心算法各估一遍针数,写下来。然后把"9000针=直径6厘米实心圆"这句话抄进你的报价笔记首页:它是你在绣花世界里的第一件度量衡。

### 3.1.4 时间与机器:转速、多头机、9000针实际耗时

二楼绣花档口的门帘一掀开,声音先扑过来:"哒哒哒哒——"密集、高频、带着金属的脆劲,像一排缝纫机在弹快板。屋里两台机器,靠窗那台六个机头一字排开,每个机头下面用一个弧形的金属框卡着一顶成品帽,六根机针同时起落,六顶帽子上同时长出同一个logo,针头快得只剩残影。师傅站在机器侧面,眼睛盯着线,手里的茶缸子稳稳的。你凑近看那个卡帽子的弧形框——这是**帽绣机**的筒形绷框,专绣做好的成品帽(它的完整用途见4.3.3);而工厂里走大货的主流做法是**平绣裁片**:帽片还是一块平布的时候就把logo绣好,再送去车缝——为什么绣花排在车缝前面,4.3.1会给你机制,这里先记住:**你那500顶,绣的是布片,不是帽子。**

机器的核心参数是**转速**:每分钟扎多少针,写作 rpm。现代绣花机标称800-1200rpm,但实际生产不会开满——线的张力、布的厚度、图案里急转弯的密度都会逼着降速,帽用面料偏厚,**实际有效转速按800针/分钟**算是靠谱口径。带你算9000针的账:9000 ÷ 800 ≈ **11分钟净绣时间**。但净绣不是全部——Mike 的logo三个线色(米白的字样和山脊、栗棕的桶、麦金的麦穗),机器每换一个色要剪线、换针杆、重新起针,一次十几秒;再加上下料(取下绣好的绷框、装上新的)、开头结尾的锁针、绣完剪跳线,一轮下来的真实耗时是**12-15分钟**。这个"一轮"概念马上值钱。

因为工厂的机器不是一头一头绣的。大货用**多头机**:一台机器12个或15个机头共用一套程序,同步动作——**一台12头机,一轮同时绣出12片**。现在把500顶的时间账整个算穿:500片 ÷ 12头 ≈ 42轮,×13分钟 ≈ **9小时**——一台12头机,一个工作日,你整单的绣花就完了。摊到单片,机时才1分钟出头,这就是为什么绣花按顶算并不贵(下一节算钱你会看到)。这笔账还有一个更重要的用途:**验证工厂的话**。你问师傅:"500顶要绣几天?"师傅头也不抬:"机器上就一天。什么时候排到机器上,那是另一回事——旺季前面排一个星期的单,天天有。"记住这句话的结构:**绣花的耗时=机时+排队,机时是物理,排队是江湖**——交期被"绣花厂压着"的真实含义,九成是后者(这件事第4章讲生产时你会正面撞上)。

多头机还解释了两件此前你想不通的事。第一,**为什么小单单价高**:一轮12片是机器的最小节拍,你只绣30顶,机器上一样要占三轮,换线、调机、对位的固定功夫一分不少,摊下来自然贵——起订量的逻辑(见1.5.2)在绣花机上原样重演。第二,**为什么多色比单色贵的不只是线**:每多一个色,每一轮多一次换色停顿,42轮就是42次;色数从3涨到6,一轮从13分钟拖到16分钟,一天绣不完还影响排机——工厂对超过6色的logo加价甚至劝退,底层是机时账,不是线的钱。

本节动作:把两句话存进你的问厂话术库。第一句问产能:"**绣花是自己车间还是外发?几台机、几头的?**"——台数×12头×每小时4轮,当场心算出对方的日产能,再对照你的订单量,他说"绣花要一周"时你就知道是机时还是排队。第二句写进交期沟通:"**绣花机时按500顶一个台班核,排期请提前锁定**"——让对方知道你会算这笔账,排期的水分就不敢太大。

### 3.1.5 计价:千针单价与制版费(打带费)

现在把针数换成钱。绣花的行业计价单位不是"个"也不是"顶",是**千针**:每一千针多少钱,针数乘上去就是单顶绣花费。当前的行情区间:**¥0.35-0.55/千针**——量大取低、色多工艺复杂取高,本书算例统一用**¥0.45**。这个单价是个"全包价":线钱、机时、上下料人工、断线返修的损耗,全在里面;你在3.1.4算过机时摊到单片才一分多钟,在3.1.8会算到线钱一顶只有几毛——**千针单价的大头其实是人工和管理**,这决定了它的谈判空间不大,也决定了低得离谱的报价必有蹊跷。

拿主线算完整的一笔。你按9000针预估:9000 × ¥0.45 = ¥4.05/顶。几天后制版师出了正式文件(下一节的故事),定稿针数**8800针**:8800 × ¥0.45 ≈ **¥3.96,四舍五入,¥4/顶**——你的预估误差2%,这杆秤(3.1.3)铸得值。500顶总绣花费:**¥2000上下**。把这个数和第1章的面料账并排放:主面料500顶才¥684(见1.5.1)——**绣花是这顶帽子上比布还贵的单项**,一顶¥17上下的出厂成本盘里,它一项占掉近四分之一。谁跟你说"logo就是顺手绣一下",把这两个数摆给他看。

绣花账上还有第二笔钱,和针数无关:**制版费**,行内叫**打带费**——把logo图片转成机器能执行的针迹文件,要制版师人工做(整个过程下一节展开),这是一次性的技术服务费,行情**¥150-300一个logo**,复杂图案取高。它的行规是:**首单收,翻单不再收**——版做出来是现成的,翻单直接调文件。你在 R&B 的成本盘里按¥200预留了这笔——这笔钱最终花给了谁、为什么反而成了你手里的一张牌,下一节见分晓;报价单上怎么核"翻单免收",第9章拆报价单时(9.4.2)再算总账,包括版的归属权这个隐藏问题。摊到500顶,制版费每顶4毛;若翻单2000顶,这笔钱就摊没了——**制版费是入场费,不是流水费**,记账时别把它算进单顶成本去吓自己。

两个警报阈值,配一段对话。阈值一:**千针单价高于¥0.6**,先问为什么——小单、急单、金属线(见3.1.8)、3D绣(见3.1.7)都可以解释,解释不出来就是虚;阈值二:**低于¥0.30**,别高兴,警惕两件事:密度被抽稀(绣出来露底布),或者对方接单后转包给更便宜的外发厂,品质没人管。对话是你在1688上问价的实录:一家报"绣花包干¥5一顶,啥logo都这个价"。你回:"我的logo约8800针、3个色、平绣,麻烦按千针报,制版费单列。"对方沉默了一会儿,回:"那……千针0.5,制版250。"——8800×0.5=¥4.4,比"包干¥5"低了6毛,500顶差300块。**"包干价"的本质是赌你不懂针数**:logo小的客户多付,logo大的单他不接——让报价回到千针,就是让双方回到同一杆秤上。

本节动作:把这句询价话术存成模板,以后每一单换个针数就能用:"**logo约XX针、X色、平绣,成品宽XX毫米;请报千针单价;制版费单列,注明翻单是否免收。**"三个要素——针数、单价口径、制版费归属——一句话锁死,绣花报价里九成的模糊空间就没了。

### 3.1.6 制版(digitizing):从图片到.dst,什么logo绣不出来

二楼师傅看你问得认真,给你推了个微信名片:"找他制版,做了十五年,手稳。"你把 Mike 的矢量图发过去,备注了尺寸75×45毫米、平绣。对方回得很快,但不是报价,是一句判断:"麦芒不行。最细的地方0.3毫米,线都比它粗。"——这句判断值多少钱,这一节讲完你就知道了。

先补上流程里缺的一环。logo图片——不管多高清的png还是多标准的矢量图——**都不能直接进绣花机**:机器不认识"图",只认识"针",一条一条的:第几针落在哪个坐标、什么针法、什么时候换色。把图翻译成针的过程叫**制版(digitizing)**,行内老话叫**打带**——早年程序打在纸带、磁带上带进车间,名字留下来了,干活的人叫**制版师**(打带工)。他在制版软件里对着你的图,手工决定每一块区域用走针、包针还是榻榻米(见3.1.1),线迹朝什么方向铺(方向决定光泽,见3.1.1),先绣哪块后绣哪块(顺序不好,机头在图案上空跳来跳去,跳线满天飞),密度给多少,底针打几层——还有一件外行完全想不到的事:**拉力补偿**。几千针把线绷进布里,布会被拉着变形,正圆会绣成竖椭圆、细缝会被挤开——好的制版师会预先把图形反向变形,让"绣完被拉正"。所以**制版是手艺不是转换**:市面上有一键自动转版软件,转出来的文件针数虚高两三成、方向乱、该补偿的不补,绣出来的东西一眼廉价。同一个logo,两个制版师做出来针数能差10-20%、效果差一个档次——这就是8.3.2要讲的"绣花制版师是样品质量的源头"的原因,你先在这里记住这个岗位。

制版的产出物是一个针迹文件,行业通用格式是 **.dst**(田岛格式,以绣花机大厂Tajima命名)。关于它记三件事:①它是绣花世界的通用交换格式,任何品牌的绣花机都认,你拿着.dst换工厂,logo不用重新制版;②它**只记录针迹和动作指令,不含颜色**——线色靠随文件附的色序表(第几号针杆配什么线),所以"文件对了、颜色错了"是完全可能的事故(3.1.8的伏笔在这里就埋下了);③文件里的针数是精确值,机器照着它一针不差地执行——这让它成为你核账的铁证,3.1.9教你打开它。

现在回答本节标题的后半句:**什么logo绣不出来**。制版师的翻译能力有物理边界,三条红线:第一,**渐变**——线是实色的,一根线从蓝渐变到白不存在;制版师最多用两种线交错疏密模拟过渡,效果糊且贵,照片级图像更是完全无解。第二,**过细的文字**——**最小字高约5毫米**(无衬线粗体;带衬线的字再加两毫米),再小,笔画之间的空隙被线一挤就糊成一团,"RIDGE & BARREL"绣成一条毛毛虫。第三,**细于1毫米的线条**——包针最窄包到1毫米,再细只能换单走针,绣出来是断续的虚线感。对照这三条,你重新看 Mike 的logo:字样8毫米高,过关;渐变,没有;麦芒——0.3毫米,踩死了第三条红线。制版师给了两个方案:"要么加粗到1毫米,我用细包针,有实感;要么减根数,留三四根,走针挑出来,是那种手绘的虚劲儿。别又细又密,绣出来是一团金色的雾。"你把原话翻译成设计语言转给设计师,第二天设计师回了修改版:每支麦穗的麦芒从七根减到四根、加粗到1毫米。制版师报价:"制版二百,今晚出带。"——3.1.5预留的那笔制版费,原来花在这里;你当场转账,当晚收到文件:**定稿8800针,三色**。版是你出钱做的,文件在你手里、归你——这个细节的价值,3.1.9马上兑现。

不沟通会怎样,给你看一单。同行接过一个咖啡品牌的单,logo带一圈淡淡的投影渐变,他没看出问题直接发厂;工厂制版师一看渐变绣不了,**默默删掉**,没人通知任何人;八百顶货到客户仓库,客户第一句话:"这不是我的logo。"退不了、赔了三成货款——三方每一方都觉得自己没错:客户给的是官方文件,工厂"按可绣版本做",他"原样转发"。**红线不会自己开口,谁先看出来,谁才配收专业的钱。**

本节动作:建一张"发制版前三查"卡,每单必过——①有没有渐变、投影、照片元素?②最小字高够不够5毫米?③最细线条够不够1毫米?任何一条不过,先拿本节制版师那两个方案的句式去找设计师谈,**改定了再发厂**;顺手在打样需求单里写上:"**制版后请回传.dst文件与色序表**"——这句话的分量,3.1.9见。

### 3.1.7 平绣/3D立体绣/贴布绣:效果、价差、适用

二楼档口靠墙钉着一块样品板,师傅拍拍它:"客户挑花眼就带到这儿来。"板上三顶黑帽子并排:第一顶,logo服帖地"长"在布面上,缎面反着光;第二顶,同样的字母鼓起来小半个指节,圆滚滚的,像充了气;第三顶,前幅是一大块毛毡布拼上去的图案,边缘一圈密实的锁边线,大学校队的味道。师傅说:"平绣、泡绣、贴布——绣花就这三张脸,认清了,客户要什么你一秒对号。"

**平绣(flat embroidery)**是基准工艺,前面六节讲的全部默认是它:线平铺在布面,针法齐全、细节还原度最高,是唯一能忠实呈现细线条和小文字的选项。行业里九成的帽绣是平绣,你的报价基准、千针单价(见3.1.5)也都以它为原点。

**3D立体绣**,行内叫**泡绣**(puff embroidery):绣之前先在图案位置垫一块约3毫米厚的EVA泡棉,再用加密的包针把泡棉整个包住、扎断边缘,绣完撕掉多余的泡棉——logo便鼓起两三毫米,立体饱满,street感十足,北美球队帽、潮牌帽的大字母几乎都是它。代价两层:一是钱——泡棉要包严,针距加密、针数上浮30-50%,再加泡棉料和更慢的机速,**单顶比平绣贵¥1.5-3**;二是脾气——泡棉是靠密针"雕"出形状的,**笔画宽度3毫米以下别碰3D**:细线条包不住泡棉,绣出来是一条塌陷的软虫,细节多的图案更是全糊。所以3D绣的适用画像非常窄而清晰:**粗壮、简洁、大——大写粗体字母、极简图形**,配结构化前幅(见2.1.1)效果最挺。拿这个画像照 R&B:软顶dad hat、带麦芒细节和8毫米字样——**两条都不沾,3D出局,平绣定案**。你把这行判断写进方案,后面跟一句给 Mike 的解释:"3D绣适合粗字母,你的logo细节会全部丢掉。"——**替客户否掉一个听起来更炫的选项,并说清为什么,是比接单更快的建立信任的方式。**

**贴布绣(applique)**:先把一块裁好形状的布片固定在帽面上,再沿边缘用包针锁一圈——图案的"面"由布提供,针只负责边。它的账极有意思:**大面积图案的省钱利器**。带你算:一个10厘米宽的满绣图案,面积约50平方厘米,×300针/平方厘米(见3.1.3)=约15000针,单绣花费¥6.8;改贴布绣,填充针全免,只剩锁边和细节,约6000针=¥2.7,加布片和激光切片费约¥0.5/顶——**净省近¥3.6,大logo省三到四成**。附赠的还有质感:毛毡、灯芯绒(见1.2.3)的布片自带材质层次,复古感、校队感是平绣给不了的。它的边界同样清楚:小图案不省反贵(切片、对位的固定功夫摊不掉),细节还是要靠绣——贴布绣的主场是**宽8厘米以上的大图形**。

三张脸的价差和适用,合成一张速查表:

| 工艺 | 效果关键词 | 单顶成本(对比平绣) | 适用 | 禁区 |
|---|---|---|---|---|
| 平绣 | 服帖、细节忠实 | 基准(约¥0.45/千针) | 一切常规logo | 渐变、照片(见3.1.6) |
| 3D泡绣 | 鼓起、街头感 | +¥1.5-3 | 粗体字母、极简图形、结构化前幅 | 笔画<3毫米、细节多 |
| 贴布绣 | 拼布、复古校队感 | 大图省30-40%,小图反贵 | 宽8厘米以上大图形 | 小logo、细文字 |

一段对话把禁区钉死。有客户拿着一个带细花体字的logo指名要3D绣,"隔壁品牌就是鼓的"。老实的工厂会劝,想赚钱的工厂会照做——照做的结果师傅样品板背面就钉着一顶:花体字母泡绣,笔画互相挤成一团发面馒头,客户拒收,工厂说"你自己指定的工艺",各赔一半。你要学会的是那句拦在前面的话:"**3D绣的最小笔画是3毫米,你这个logo上机就糊;要street感,可以只把主字母做3D、细节留平绣——混绣,加一块钱。**"——混绣(同一logo里3D与平绣并用)是真实存在的常规操作,也是你从"传话的"变成"出方案的"的标志。

本节动作:把三行决策规则抄进工艺笔记——**细节多、有小字:只能平绣;粗体简洁图形、要立体:3D绣,笔画≥3毫米;大于8厘米的大图:先算贴布绣的账**。下次逛街看到帽子,先判断它用的哪张脸、为什么——三顶之内,这套规则就是你的了。

### 3.1.8 绣花线:涤纶线/人造丝/金属线,线色与潘通的"最接近"逻辑

二楼档口最好看的一面墙是线架:从地面顶到天花板,几百个线轴按色系排开,红一列、蓝一列、从柠檬黄到土金色能数出十几阶。你是带着任务来的——品牌手册上那个麦穗金黄 **PMS 7406C**,1.4.2就说过它"上不了布,是绣花线的任务",今天到了交作业的时候。但先把线本身认全,三种线,三种脾气。

**涤纶绣花线**是绝对主流,常见规格120D/2(两股120D长丝合捻,旦数见1.1.2)。它继承了涤纶纤维的全部性格:强度高、耐磨、耐晒、耐水洗甚至耐氯漂,颜色是原液或高温染进丝里的,色牢度极好——而帽子恰恰是暴晒、淋雨、汗浸、机洗的重灾区,所以**帽绣默认涤纶线**,没有之一。**人造丝线**(rayon,粘胶丝)是另一派:光泽比涤纶更亮、更柔润,绣出来有丝绸的贵气,高档服装刺绣、礼服徽章爱用它;但它强度低、湿态更弱,机器上断线率高,耐晒色牢度也差——帽子这种户外品用它,一个夏天光泽和颜色一起衰减,所以帽子行业里它是少数派,除非客户指名要那种"亮"。**金属线**(金葱银葱)效果最炸,金是真的金光;但它是出了名的难伺候:丝硬易断,机器得把转速降到一半,断线频停频接,千针单价上浮五成到一倍,绣出来还刮手——贴近皮肤的位置(比如靠近帽檐下沿)要慎用。你对着线架把 Mike 的logo过了一遍:户外、要洗、要经年——三色全用涤纶线,金属线的"真金"诱惑留给某个圣诞限定款再说。

然后是这一节真正的主题:**线色怎么对上潘通**。你以为的流程是"报7406C,拿7406C的线"——线架前站三分钟你就会发现这不存在:**每家线厂有自己的色号体系**,几百到上千个色,编号和潘通没有官方对应关系。染一批专色线倒是可以,但起染量以公斤计,小单想都别想。所以行业的真实逻辑,和1.5.2现货色的逻辑一模一样:**在现成的线色里找"最接近"**。你把C卡翻到7406C,举到线架金黄那一列前面——没有一个线号正好是它:一个偏柠檬,亮而发青;一个偏土,沉而发暗;中间那个最像,但隔着卡纸和线轴的弧面,你不敢拍板。师傅见惯了这个场面:"别对着线轴看,**线要绣出来才是它的颜色**——绣出来有针脚的反光,底布深浅还会衬它。拿你的布来。"你从1.5.1采购的60米布上剪的布头里拿出一块藏青磨毛斜纹,师傅把两个候选线号各绣了一支麦穗在上面,前后十分钟。这块绣着两支金色麦穗的藏青布片,行内叫**样带**——在与大货相同的底布上试绣出来的确认小样,是绣花世界里与 lab dip(见1.4.3)完全对位的存在(它在打样体系里的正式位置见10.3)。你把样带拿到楼道窗口的自然光下,C卡并排:藏青的深底果然把两个金黄都衬深了半档,偏柠檬那个反而更贴7406C的暖度。你圈了它——线卡编号金黄428——拍下"样带+色卡同框、自然光"的照片发 Mike 备案,又在样带背面写上线号、日期,收进文件袋。**这就是"最接近"逻辑的完整闭环:潘通号定方向,线卡缩小范围,同底布样带定生死,签字照片留证据。**

顺手把线的账算了,你会发现一个漂亮的事实。千针大约耗面线6-7米:8800针≈55-60米/顶;绣花线5000米一轴、十几块钱,一轴够绣80多顶,500顶三个色合计也就七八轴,**单顶线钱不到三毛**——占绣花费(¥4,见3.1.5)不足一成。这就是1.5.2那句"品牌专色交给绣花线去实现"的底气所在:**线色几乎没有起订门槛,一轴就是一缸**——布做不到的颜色自由,线轻松给你。麦穗的金黄之所以能一分不少地上帽子,靠的就是这条通道。

不过,把样带收进文件袋的时候,有一件事你此刻还想不到:你确认的,是"这一个线号、这一轴线"绣出来的颜色——大货开机那天,如果工厂手里这个线号恰好断了货,拿一轴"看着差不多"的金黄顶上去、又没人吱声,会发生什么?这句话先放在这里,第11章验货那天,你会亲眼看到答案。

本节动作:把线色条款写进你的订单模板,三句话——"**绣花线:涤纶线120D/2;线色以双方签字确认之样带为准(样带背书线厂与线号);大货如需替换线号或线厂,须提前书面确认新样带**"。第三句现在看着多余,总有一天你会庆幸它在。

### 3.1.9 自查工具:免费查看器核针数

制版师发来的那个 .dst 文件躺在你的微信里,你盯着它突然意识到一个问题:8800针这个数,是他说的。他没必要骗你——版是按针数之外的固定价收的——但往后呢?针数是绣花计价的乘数(见3.1.5),而它长在一个你打不开的文件里,**工厂报多少是多少**?这一节把这个死角焊死:.dst 不是黑盒,免费工具就能打开它,而且你今天就该装一个。

做法给你三条路,由重到轻。第一,**桌面软件的免费版**:绣花软件厂商大多提供免费或试用版本——比如 Embird 的试用版、Wilcom 出的免费查看器 TrueSizer——下载安装,把 .dst 拖进去。第二,**在线查看器**:浏览器搜"dst viewer online",好几个免费网页工具,文件拖进浏览器窗口即看,不用装任何东西,手机上也能用——这是你在外面谈事时的应急方案。第三,**让对方开屏**:实在拿不到文件时,要求工厂视频或截图打开文件给你看,针数栏、尺寸栏入镜——下策,但聊胜于无。打开文件后看四样东西:**针数**(精确到个位,机器就按这个数扎)、**成品尺寸**(和你写死的75×45毫米对得上吗)、**色序与换色次数**(三个色、换色两三次,对应3.1.4的机时账)、**模拟渲染图**(软件会把针迹画出来,线迹方向乱不乱、密度匀不匀、有没有大段跳线,外行看两分钟也能看出个七七八八)。你把制版师的文件拖进查看器:8,792针,四舍五入8800,尺寸75.2×45.1——数字对上的那一刻,你和这门工艺之间最后一层雾散了。

这个技能值多少钱,给你看一单。同行做礼品帽,工厂报"logo 12000针",按千针¥0.5计价;他做了半年后偶然学会开 .dst,翻出旧文件一看:**8,200针**。每顶多付了¥1.9,那款帽子前后做过1200顶——两千三百块,就藏在一个他"打不开"的文件里。他拿着截图找工厂,对方轻描淡写:"哦,当时报错了。"退了尾单的差价,前账不认。**针数虚报是绣花计价里最隐蔽的一刀,因为它披着"技术参数"的外衣**——而破解它的全部成本,是一个免费软件加三分钟。配套给你核账的允差口径:不同软件和机型对跳线、锁针的计数细节略有差异,**文件针数与工厂报数差5%以内属正常,超过10%必须要说法**。

要文件时你会遇到一句标准回复:"版是我们做的,文件是公司资产,不外发。"——这话有它的道理:制版是真实的技术投入,免费送文件等于送手艺(制版费谁出、版权归谁的完整行规,9.4.2专门讲)。你的应对分三档:能接受的,按上面第三条路让对方开屏验针数,针数是计价依据,**验数的权利和文件归属是两回事**,这个理站得住;想主动的,谈判时直接说"制版费我出,文件归我"——两三百块买断,从此翻单、换厂、比价全部自由;而你这一单,已经站在最舒服的位置上:版是你找制版师做的、钱是你出的、文件在你手机里——**发给任何一家工厂询价,针数都是你说了算**,谁也没法在这个乘数上做文章。花¥200买一个"谁也骗不了你"的位置,这笔账怎么算怎么值。

本节动作,今天做完三件事:①下载一个 .dst 查看器(桌面或收藏一个在线工具);②把制版师的文件打开,核针数、尺寸、色序,截图存进 R&B 的订单文件夹;③在你的询价话术(3.1.5那条)后面补一句:"**请提供 .dst 文件或针数界面截图供核对**"——从此针数这个乘数,永远摊在阳光下。

## 3.2 印花家族

绣花学完,再认它的对家。印花在T恤世界是绝对的王,在帽子世界却是配角——但配角你也必须认识:一是有些logo只有印花做得出来,二是你得能讲清"为什么不用印花",这句话本身就是专业度。

### 3.2.1 丝网印:按色数计价的原理

面料市场一楼拐角有两家印花档口,你顺路进去,先闻到的是油墨的溶剂味,再看到的是靠墙一摞铝框——每个框上绷着一层细密的网纱,像一扇扇纱窗;有的网纱上糊着一层暗红色的胶,中间镂出一个图案的形状。老板正在干活:一块裁好的帽片压在台板上,铝框往上一扣,倒一坨白色油墨,橡胶刮刀"唰"地刮过去,抬框——帽片上一个干净的白logo,前后两秒钟。这就是**丝网印**(丝印):图案在哪,网纱就在哪镂空,油墨只从镂空处透下去;**一张版,只能透一个颜色**。

这最后一句话,就是丝印全部计价逻辑的来源。你的logo有三个颜色?那就要做三张版,帽片在台板上印完第一色、等位、套上第二张版印第二色、再套第三张——**每个颜色一张版、一道工序、一次对位**,所以丝印天生**按色数计价**:版费按色收,常规帽logo尺寸**每色¥50-80**;印工也按色算,**每色每顶¥0.3-0.5**。带你算 R&B 的账(假设它走丝印):三个色,版费约¥200,印工约¥1.2/顶,500顶合计约¥800——**单顶摊下来约¥1.6,不到绣花(¥4,见3.1.5)的一半**。便宜这么多,为什么帽子行业还是绣花的天下?这个问题先挂着,3.2.4统一清算;本节先把丝印自己的门道摸完。

第一个门道是**浆料**,丝印世界的"线材选择"。**水浆**:油墨渗进布纤维,印完布面几乎没手感、透气如初,但遮盖力弱——只能浅色布印深色图。**胶浆**:油墨盖在布面成膜,遮盖力强,深色布上印白印亮色全靠它,代价是图案区一层胶质手感、大面积会闷。还有厚板浆、丝光浆、发泡浆一族特殊浆,做立体和光泽效果。规则一句话:**浅底用水浆,深底用胶浆,深底印浅色还要先打一层白底再上色**——白底算不算一个色?算,版费印工照收,这是新手询价时最常漏算的一色。第二个门道是**对位**:多色图案每一版必须严丝合缝地套在前几版上,帽logo就几厘米大,套位偏0.5毫米,轮廓线就"跑"出一道彩边——所以**色数越多,丝印越贵也越险**,超过4个色,老板自己都会劝你换工艺(换什么,下两节就到)。

一场典型翻车,发生在浆料上。同行给酒吧印300顶深蓝帽,白色logo,工厂图省事用了水浆——印完当场看还行,油墨一干,深蓝的底色从半透明的白里泛上来,logo成了灰蓝色,像洗褪了色的旧货。返工无门:水浆渗进纤维,洗不掉、盖不住,300顶帽片全废。病根一句话:**深底浅印必须胶浆加白底**,而他连"水浆胶浆"这两个词都没听过,自然问不出这一句。

丝印在帽子上的真实主场,记三个:**帽檐底印花**——帽檐(见2.3.2)是平面,丝印最舒服的地形,檐底印满花是snapback的经典玩法;**渔夫帽大图**——平纹布面平整(见1.2.1)、图案大色块少,丝印划算;**裁片印**——车缝前在平整的裁片上印,规避成品帽的弧面(这个词3.2.4要挑大梁)。本节动作:把丝印询价三要素记成口诀——"**几个色(含白底)、什么浆、印裁片还是印成品**"——三个问题出口,印花档口老板就知道来的不是外行;再把一个阈值写进工艺笔记:**色数≤3、大色块、平面部位,丝印才有性价比**。

### 3.2.2 热转印与烫画:全彩的代价

印花档口老板见你问得细,从抽屉里拿出一张A4大小的膜片:上面印着十几个花花绿绿的logo,渐变、照片、金属光泽俱全。他把一张膜放在帽片上,推进旁边一台像大号三明治机的**热压机**,压下手柄——"滋"的一声,160度,12秒,抬起,撕掉底膜:一个全彩渐变的logo严严实实地贴在了布面上。"你那个绣不了印不了的渐变?"老板一摊手,"到我这儿,没有印不了的。"

这就是**热转印**:图案先用数码打印的方式印在**转印膜**上,再靠温度和压力把图案连同背面的热熔胶层一起"焊"到布面。它的能力边界和丝印、绣花完全互补:**全彩、渐变、照片,来者不拒**——3.1.6那三条绣花红线,在它面前一条都不存在;色数不影响成本,因为膜是打印出来的,印一个色和印一百个色一个价。计价也因此极其简单:**没有版费**,膜按面积算,一张前幅尺寸的膜¥0.5-1.5,加压烫人工几毛,**单顶约¥1-2**。顺带认识它的近亲**烫画**:现成的通用图案批量印好的烫画纸,论张买、买来就压,几毛钱一张——地摊帽、游乐园纪念帽上那些卡通图就是它。近几年的新主流是 **DTF膜**(数码直喷膜):白墨打底、彩墨成像、撒热熔粉,弹性和耐洗性比老式转印膜好一截,现在你在档口拿到的"热转印"大多已经是它。

但"没有印不了的"的另一半是代价,而且代价恰好扎在帽子的命门上。第一,**手感**:热转印的图案是"贴"上去的一层膜,摸上去是胶皮感,和布是两张皮——绣花的线、丝印水浆的墨都"长"在布里,膜永远浮在布上。第二,**耐久**:热熔胶层经不住反复水洗和暴晒,几十次水洗后边缘起翘、图案龟裂、成片剥落是它的标准死法;DTF把这个上限抬高了,但"膜的宿命"没变。第三,**气质**:消费者的手比眼睛诚实,一摸是膜,心里的标签自动贴上"促销赠品"——这层心理定价,3.2.4还要正式算它一笔。所以热转印的适用画像是:**全彩复杂图案+小批量+短寿命预期**——展会帽、活动帽、赠品帽,戴一季就完成使命的产品,它是性价比之王;要卖钱、要经年的品牌款,它上不了台面。

事故照例有,而且极其高发。同行接了个音乐节的单,主办方的logo是七彩渐变,300顶,预算低、工期急,热转印完美对口——货交得漂亮,钱也顺利结了。三个月后对方市场部的人找上门:员工把帽子机洗了几次,logo边角翘起、中间裂纹,照片发在群里,"你们的质量就这样?"他赔了口舌赔了折扣,委屈在于:这本是工艺的天性,不是他的手艺问题——**但客户不知道的天性,出了事就是你的问题**。防御动作一句话:接热转印订单时,把丑话印在纸上——"**热转印工艺适用于短期活动场景,常规机洗约30-50次后可能出现边缘起翘,如需长期使用建议改绣花或丝印**"——这行字放在报价单备注里,三个月后的那通电话就变成了"当初你说过"。

本节动作:去印花档口(或网购)要两片热转印样品压在旧帽子上,一片原样留档,一片扔进洗衣机按你客户的真实使用方式洗五次——**把"膜的宿命"亲手洗出来一次**,你对这门工艺的推荐边界就再也不会含糊;顺手把上面那句免责条款抄进你的报价单模板。

### 3.2.3 数码直喷:小批量全彩解法

印花档口的最里间还有一台安静的机器:外形像放大版的办公喷墨打印机,台板上卡着一顶成品帽,打印头在帽子前幅上方来回扫,一个全彩logo一层层"显影"出来——没有版,没有膜,墨水直接喷在布面上。这就是**数码直喷**(DTG,direct to garment):纺织墨水经打印喷头直接上布,渗进布面浅层;深色布先喷一层白墨打底,再喷彩墨成像。手感比热转印好一个档次——墨在布里,不是膜在布上——耐洗性也居中:好过热转印,不及绣花和胶浆丝印。

它解决的是一个前两节都留下的空档,你把三种印花的成本结构摆在一起就看清了。丝印(3.2.1):版费¥200一次性,单顶¥1.2——**量越大越便宜,但起步要摊版费**;热转印(3.2.2):单顶¥1-2,无版费,但寿命短;数码直喷:**无版费,单顶¥3-6,量大也几乎不降价**——数码的天性,第一顶和第五百顶的成本一样,没有规模效应,但也没有起步门槛。给你算那个决策平衡点:同样一个三色图案,丝印=200+1.2×N,直喷=4×N,解出 N≈71——**七十顶左右是分水岭:百顶以内直喷划算,几百顶以上丝印碾压**。这个公式本身比结论值钱:版费 ÷(直喷单价−丝印单件价)= 平衡顶数,以后任何两种"有版费工艺vs无版费工艺"的对比,套进去就出答案(第19章算大账时这个思维还要反复用)。

所以数码直喷的主场画像是:**小批量+全彩+要手感**。三个典型场景:一,**几十顶的全彩活动单**——渐变logo、30顶,丝印版费摊不起、热转印手感拿不出手,直喷是唯一体面的解;二,**电商一件定制**——海外定制平台上"上传你的照片印在帽子上"的生意,背后全是直喷机,一件起做、当天出货(这条路线怎么变成你的生意,第22章展开);三,**给客户看效果的提案样**——正式打样(第10章)之前,直喷一顶效果样寄过去,几十块钱让客户"看到"成品,成交率的提升远超这几十块——这是把工艺当销售工具用,记住这个用法。它的短板也要说全:色牢度依赖布面预处理液,处理不到位,洗几次就发花;深色布的白墨打底费墨,成本里白墨常占一半;喷墨色域再广,那种缎面反光的"绣花档次感"它给不了。

对话样本来自你自己的疑惑。你问老板:"网上那种一顶起订、印照片的帽子,怎么做到的?"老板朝直喷机努努嘴:"就它。一顶的墨水成本几块钱,卖你六十九包邮,人家赚的是定制的钱,不是帽子的钱。"——这句话值得咂摸:**数码直喷把"起订量"这个行业铁门槛(见1.5.2)从印花环节直接抹掉了**,单件利润因此可以高到离谱;它赚不了大货的钱,却是小生意起步阶段现金流最友好的工艺。

本节动作:把印花家族三兄弟的选择规则合成三行,抄进工艺笔记——**大批量、色少、图案大:丝网印;小批量、全彩、短寿命:热转印;小批量、全彩、要手感或一件起做:数码直喷**。再把平衡点公式(版费÷单价差=平衡顶数)记在旁边——下次客户拿着全彩logo问"一百顶怎么印最划算",你能当场算给他看。

### 3.2.4 为什么帽子绣花多印花少

现在清算3.2.1挂着的那个问题。丝印单顶¥1.6,绣花单顶¥4,便宜一倍还多——按理说工厂和客户都该用脚投票,可你随便走进一家帽店数一数:货架上八成的logo是绣的;再看T恤区,九成的图案是印的。**同样是布,同样是logo,两个品类的答案完全倒挂**——这不是习惯,是四个机制叠出来的必然,每一个你都已经在前面见过零件,这一节拼成整机。

**第一,弧面。**印刷的物理前提是"平":丝印要刮刀平刮(见3.2.1),热转印要热板平压(见3.2.2)——而帽子前幅是一个双向弯曲的弧面,成品帽上印花要靠专用弧形夹具硬撑,压力不匀、图案边缘发虚是常态。T恤铺开就是一张平面,帽子却生来拒绝印刷。你会说:那在裁片上印、印完再缝(3.2.1的裁片印)——可以,于是撞上第二堵墙。**第二,缝线。**六片帽的中缝从前幅正中穿过(见2.2.1):裁片印花意味着logo被劈成两半、分别印在两块裁片上,车缝拼合时要毫米级对花——车间里做不到,差一毫米,山脊线就错成断崖;就算是压过缝的整体印,缝份处凸起一道埂,油墨在埂上积墨、断墨。而绣花机根本不在乎这道缝——前幅两片先拼合再绣,几千针把缝直接盖进图案里(3.1.2你已经见过),**中缝是印花的天堑、绣花的坦途**。这也顺手解释了一个货架现象:凡是大面积印花的帽子,多半是无缝前幅的五片帽或平纹渔夫帽——帽型迁就工艺。**第三,耐久。**帽子是纺织品里使用环境最狠的品类之一:暴晒、雨淋、汗浸、揉搓、机洗,全套都来。绣花线的颜色是染进涤纶丝里的(见3.1.8),晒不褪、洗不掉;油墨和膜浮在布的表层,紫外线和洗涤剂一层层剥它——一顶戴三年的帽子,绣花还是绣花,印花已经是一片斑驳。**第四,档次感。**消费者的心智里有一条根深蒂固的等式:绣花=立体=有工艺=贵。这条等式反映在零售价上极其诚实:同款帽子,绣花版比印花版零售价高5-10美元还更好卖。把账算穿给你看:绣花的成本只比丝印高¥2.4(约0.35美元),零售端却能多卖5美元——**十几倍的溢价杠杆,这才是工厂和品牌都拥抱绣花的商业底牌**,前三个机制是理由,这一个是动力。

反过来,T恤为什么印花为主?零件也全在你手里:T恤是大平面(无弧面无跨缝)、针织薄布——薄布吃不住几千针,大面积绣花会把布拽得起皱发硬(1.2.1讲平纹落选时你就见过这个机制),而且贴身穿的衣服,绣花背面的线迹磨皮肤。**工艺没有高低,只有和载体的匹配**——帽子厚布、弧面、跨缝、糙环境,四个特征把它推给了绣花;T恤四个特征全反过来,把它推给了印花。能把这个"倒挂"讲清楚,你在客户面前就是半个工艺顾问了。

对话样本,你迟早会用上。精打细算的客户拿着报价单问:"印花便宜一半多,为什么不给我报印花?"你的回答分三步:"三个原因——你的帽型前幅有中缝,印花跨不过去;帽子要暴晒水洗,印花一年就花了,绣花五年还在;零售端绣花版能多卖5块钱,省下的2块4成本,会在售价上亏回来十倍。**如果你做的是一次性活动帽,我马上给你改印花报价,能省不少**。"——前三句是机制,最后一句是姿态:你不是在推销贵的,是在按场景配工艺。

本节动作:把帽子装饰的默认规则写进工艺笔记,两行——"**帽子默认绣花;选印花必须有明确理由:全彩渐变(3.1.6红线)、超小批量(3.2.3)、帽檐底等平面部位(3.2.1)、短寿命促销品(3.2.2)——四个理由之外,回到绣花**。"从此"绣还是印"对你不再是选择题,是核对题。

## 3.3 其他装饰与做旧

绣与印之外,还有第三类武器:不改布面,往帽子上"加东西"或"做旧"。它们单独不成主角,组合起来却决定一顶帽子的档次上限。

### 3.3.1 皮标/金属标/PVC胶章/织唛贴布

辅料市场的标牌档口像个珠宝柜:玻璃格子里一盒盒码着小方块——压着花体字的棕色皮块、亮闪闪的金属牌、五颜六色的软胶徽章、织着字母的小布片。老板娘一句话概括了整个柜台:"绣不了印不了的,或者想显贵的,都来我这儿。"这是logo上帽子的第三条路:**标类装饰**——logo先做在一个独立的"标"上,再把标钉上帽子。四大金刚逐个认。

**皮标**:真皮或PU(人造革)裁成小块,加热的铜模往上一压,logo凹陷下去、边缘带一圈焦糖色的烙印——workwear和精品dad hat的经典配件,常钉在前幅或后幅调节扣上方。价:**¥0.8-2/个**(PU取低,真皮取高),压印铜模一次性**¥100-200**。真皮标还有个隐藏加分项:会随使用氧化变深、磨出包浆——和棉的做旧美学(1.1.1)是同一路语言。**金属标**:锌合金压铸出logo,电镀古铜、枪色或亮镍,爪脚或缝孔固定——高尔夫帽和轻奢款的心头好,自重带来的"坠手感"就是它的档次感。价:**¥1-3/个**,但开压铸模**¥300-800**,四大金刚里模具最贵——量小慎入。**PVC胶章**:软胶滴塑或模压成立体徽章,颜色鲜艳、层次分明,户外机能风和潮牌的标配,防水耐造。价:**¥0.6-1.5/个**,模具¥150-300。**织唛贴布**:用织唛工艺(见2.3.4)织出的小布标,四边折光缝到帽子上——trucker帽前幅那种长方形小布标就是它,复古味最正,也最便宜:**¥0.3-0.8/个**,织唛版费¥100上下。四样的共同点:标是辅料厂做的,帽厂只负责"缝/钉上去",另加几毛钱工费;**共同的门槛是模具费和起订量**——辅料厂起订常见500-1000个,你的500顶恰好踩线,再小的单就要么接受高单价库存标,要么放弃。

标类的正确用法不是替代绣花,是**和绣花做组合**:前幅绣花是主角,侧片加一枚小织唛、后幅调节扣上方钉一块皮标——一顶帽子上两三个层次的品牌触点,精品感立刻和"光板绣花帽"拉开距离,而成本只加一两块钱。你对着 R&B 的方案动了心思:后幅加一枚压着桶形logo的PU皮标?成本盘一盘:标¥1.2+模具摊¥0.3+缝工¥0.3,约**+¥1.8/顶**——可绣花¥4、做旧还要一笔(下下节的事),12加元的预算已经吃得半饱。你把皮标做成方案里的"选配项",标注价格,发给 Mike。他的回复带着他一贯的利落:"喜欢,但首单先把主意集中在绣花和手感上。这个留给第二批——**给回头客留点新东西**。"——这句话你存了下来,它比订单还值钱:客户自己说出了翻单的理由(第24章你会知道这有多难得)。

模具的坑单独讲一个。同行订金属标,模具费¥600照付,翻单时想换一家便宜的辅料厂,找原厂要模具——对方两手一摊:"模具费是开模的工钱,模是我们的资产。"重新开模,再来¥600。**模具的归属和制版文件的归属(见3.1.9)是同一个问题的两张脸**,行规默认归厂,想带走必须谈在前头。本节动作:凡涉及模具的辅料,订单里加一句——"**模具费单列;模具归属:付费方所有/厂方保管,翻单直接调用,不得重复收费**";并且任何标类下单前,**要实物标样在手里过一遍**:摸边缘利不利、抠电镀掉不掉、闻胶章刺不刺鼻(儿童品还有更硬的合规要求,见18.6)。

### 3.3.2 激光穿孔

运动品店里拿起一顶高尔夫帽,侧后方那几片规则的小孔阵——密密的圆孔排成放射状图案,孔缘光滑得像模压出来的——不是冲的,不是钻的,是**激光穿孔**:激光头按文件路径在布面上逐个"烧"出孔来。它是装饰,也是功能:一片孔阵的透气量顶得上好几个气眼(见2.3.1),而且能排成任意图形——logo镂空、渐变孔阵、流线纹样,运动感和科技感是这门工艺的气质底色。

它的机制里藏着一条硬边界,而这条边界你在第1章就埋下了钥匙。激光的本质是烧:**涤纶是热塑性纤维(见1.1.2)**,激光扫过,孔缘瞬间熔化又凝固,熔结的边把纱线锁死——孔不脱散、不抽丝,边缘光滑圆润,这是激光孔"像模压"的原因;而**棉是纤维素,不熔化,只碳化**——激光烧过去,孔缘是一圈焦黄的碳化边,发黑掉渣,水洗后更难看,而且没有熔边锁纱,孔会越洗越毛。所以记死这条规则:**激光穿孔是化纤专属工艺**,涤纶、尼龙面料(见1.1.4)随便玩,全棉和高棉混纺基本出局。有人不信邪:同行给全棉帽下单激光logo镂空,样品回来孔缘一圈焦黄,工厂说"棉的都这样,正常"——工厂没说错,错的是工艺配错了料,这单最后改成了绣花,白搭一轮打样时间。

成本结构是它的第二个亮点:激光按文件走,**没有模具、没有版费**,改图零成本,加工费**¥0.5-1/顶**(孔数面积大取高)——小单友好度在所有装饰工艺里名列前茅,和数码直喷(3.2.3)同属"无固定成本"阵营。参数上有三件事要在下单时说清:孔径(常见0.5-1.5毫米,大孔风格粗犷、小孔细腻)、孔距与图形文件(矢量文件,和绣花共用一套源文件即可)、**避开缝份**——孔阵边缘离缝线至少留8-10毫米,不然车缝时缝份吃进孔阵,针脚从孔里穿过,强度和外观双输。还有一条强度阈值:孔阵面积别贪大,**开孔率(孔面积占区域面积)超过三成,布片强度明显下降**,帽子一撑就是撕裂风险——工厂打样时你拿到孔阵样片,双手撑一撑、指甲抠一抠孔缘,就是最直接的验收动作。

回到主线对个账:R&B 主款是全棉磨毛斜纹——**激光穿孔直接出局**,连纠结都不用。但你的方案四SKU里躺着一个完美对象:**夏季速干款,100%涤纶150D(1.1.2埋下的那个SKU)**——侧片来一组放射状激光透气孔阵,运动感和跑步俱乐部的场景严丝合缝,成本+¥0.8/顶。你把这行写进速干款的方案备注里:工艺知识的复利就是这样滚起来的——**每学会一门工艺,先回头扫一遍自己手里所有的SKU,看它能落在哪**。

本节动作:两条入笔记。规则:"**激光穿孔=化纤专属;全棉帽想要孔,回到金属气眼或绣眼(见2.3.1)**";动作:"**凡下激光穿孔订单,先要同料打孔样——看孔缘熔边、撑拉测强度、水洗一次看毛边**,样品过了再谈大货"。

### 3.3.3 水洗做旧与酵素洗:vintage感的来源与成本

把你那顶洗白的旧棉帽再翻出来——就是市集那天 Mike 一眼注意到、这门生意的起点的那顶。它凭什么好看?颜色褪成了温润的灰蓝,帽身软得贴头型,帽檐边和汗带口有深浅不一的磨白(1.2.2讲过:磨损先发生在斜纹的棱线上)。再对比一顶刚出厂的新帽:颜色饱和得发硬,帽身带着浆气的挺(1.3.2的浆),整体有一股"火气"。**vintage感的来源就是时间做的三件事:褪色、软化、磨损层次**——而 Mike 的客人不会等三年。工厂的解法,是用一缸水把三年压缩成四十分钟:**成衣水洗**——帽子做成成品或半成品后,整帽进工业洗水机洗一遍。这是一道独立的工序、独立的钱,也是"做旧"这门手艺的全部舞台。

水洗家族按下手轻重排队。**普洗**:清水加软化剂,把浆气洗掉、手感洗软,基本不褪色——严格说它不算做旧,算"去新"。**酵素洗**:洗水里加纤维素酶,酶专门"咬"棉纤维——把布面的浮绒咬掉、把纤维表层连同附着的染料剥下薄薄一层,颜色均匀地褪半档,手感变得滑糯,布面像被盘过——是最温和、最可控的做旧。注意这个机制的指向性:**酶只分解纤维素,也就是只咬棉;涤纶碰都不碰**——1.1.3那句"做旧效果与棉比例强相关",机制的真身在这里:65/35的涤棉帽扔进酵素缸,棉的部分褪了、涤的部分纹丝不动,洗出来发花。这也是当初 R&B 定全棉的完整闭环。**石磨洗**:洗水机里加浮石,石头和帽子一起翻滚,边角、棱线、缝份这些凸起部位被重点打磨——自然磨损的层次感(帽檐边先白)就是这么仿出来的。**重做旧**:石磨加酵素再加氯漂或喷洗,直接洗到发白露底——你那顶旧帽的"三年",一步到位。

钱和风险一起算。行情:**普洗¥0.5-0.8/顶,轻酵素洗¥0.8-1.5/顶,石磨+酵素的重做旧¥2-3/顶**;工期+2-3天(多数帽厂水洗外发给洗水厂);损耗**1-2%**——洗花、变形、缩水超差的个体,直接挑出来报废,报价时这笔损耗要摊进去。还有两个工序级的讲究:其一,**绣花在前、水洗在后**——涤纶绣花线(见3.1.8)不怕酶不怕磨,底布褪半档、线色不动,logo的对比度洗完反而更跳,这是个漂亮的免费红利;但3D泡绣(见3.1.7)怕重洗,泡棉会被揉塌,做旧款慎用3D。其二,**金属件怕洗**——古铜滑扣(见2.4.2)在洗水机里互相磕碰,电镀面出划痕氧化斑,所以行规是**洗后再装扣**,或者套袋保护;这一条要写给工厂,不能默认对方想得到。

做旧还有一个所有新手都栽过的特性:**随机性**。石头怎么滚、酶咬多深,每一顶都不完全一样——"每顶都独一无二"是vintage的卖点,也是验货时的定时炸弹。同行做过500顶重做旧藏青帽,没定标准,大货深的深浅的浅,客户挑出100顶"洗过头的"拒收;工厂说"做旧就是这样",客户说"我要的是均匀的旧"——谁都有理,因为**"旧到什么程度"从头到尾没被定义过**。防御的行规是**水洗封样**:打样阶段让洗水厂洗出深、中、浅三顶,客户圈定可接受的上下限,签字各执——大货在两顶封样之间浮动都算合格。这一招10.6讲封样管理时还会正式归档。

最后回到方案桌前,替 R&B 做本章第二个决策:**主款要不要洗?**Mike 买的是"戴旧了好看"——他要的是过程,不是出厂就旧的结果,重做旧替客人把帽子"用完了",否;但完全不洗,新帽的浆挺和火气会让第一触感打折,而**定制帽的成交就发生在上手前三秒**(1.2.2说过)。答案落在中间:**轻酵素洗**——去浆、软化、颜色沉稳半度,把"厚实柔软"直接送到 Mike 手上,又给他的客人留足了继续养旧的空间;成本+¥0.8-1.5/顶,你在成本盘里按¥1记。这个决策还顺手闭合了第1章的一个环:面料卡上"克重240g/㎡以退浆水洗后为准"(1.3.2)——现在你知道了,这不是纸面严谨,**是因为方案里本来就有一道洗**,克重、尺寸(1.1.1的"洗后尺寸")、颜色确认全部统一到洗后口径,前后一个数。本节动作:方案里写进三句——"**成品轻酵素洗;金属件洗后装配;大货以深/浅两只水洗封样为验收上下限**",然后把"洗前一块、洗后一块"两块布样收进给 Mike 的快递盒——让他亲手摸到"新"和"旧了"之间的那半档。

## 3.4 工艺选型决策:拿到logo后的判断流程

一整章的知识,最后要拧成一条你每接一单都会走的流水线。因为真实的生意里,客户不会问你"榻榻米针距多少",他只会甩过来一个logo文件加一句"能做吗、多少钱"——从这句话到一份专业的工艺方案,中间是一条固定的判断流程,这一节把它铺出来,并用 R&B 完整走一遍收官。

**第一步,查文件。**要矢量图(AI/PDF/EPS),没有矢量只有截图的,先让客户回去找——位图放大发虚,制版师(见3.1.6)只能连蒙带猜(文件规范的完整要求见10.2.2)。**第二步,锁尺寸。**成品宽高以毫米写死(3.1.2的教训),没有主意就给建议:前幅logo宽60-80毫米。**第三步,过三条红线。**渐变?照片?最小字高5毫米?最细线条1毫米?(3.1.6)——过线的,拿着制版师式的修改方案去和设计师谈:简化、加粗、减根数;谈不动的,才进印花通道。**第四步,看载体。**帽型有没有中缝、结构化还是软顶(见2.1.1)、面料是棉是化纤是厚是薄——弧面和中缝毙掉大图印花(3.2.4),软顶细节毙掉3D(3.1.7),全棉毙掉激光(3.3.2),载体的否决权比预算还大。**第五步,配工艺。**默认平绣;粗体极简要立体,3D;大于8厘米的大图,先算贴布绣的账(3.1.7);全彩渐变,按量分流——几十顶直喷、几百顶权衡丝印色数、短寿命促销热转印(3.2整节);要档次,标类组合加层次(3.3.1);要vintage,水洗收尾并定封样(3.3.3)。**第六步,算钱。**针数×千针价+制版费+印花版费+标类模具+水洗,逐项列出,一次性费用和单顶费用分开写——混在一起报,客户翻单时你自己都说不清哪笔该免。**第七步,出方案。**工艺、尺寸、色号线号、单价、一次性费用、交期影响,一页纸发给客户——**你交付的不是"能做",是"这样做、这个价、为什么"**。

这条流程在 R&B 身上跑出来的完整结果,就是本章的故事线:矢量图有(设计师给的);尺寸75×45毫米(3.1.2写死);红线撞了一条——麦芒0.3毫米,设计师改到1毫米四根(3.1.6);载体是软顶六片全棉磨毛斜纹——3D出局、激光出局、印花无理由(3.2.4的四问全是"否");定案**平绣**,8800针三色,涤纶线,麦金428号样带签字(3.1.8);加**轻酵素洗**(3.3.3);皮标留作翻单选配(3.3.1)。钱:绣花¥4/顶+水洗约¥1/顶,单顶装饰约¥5;一次性费用制版¥200(版归你,3.1.9)。你把这页方案连同快递一起发出——盒子里五样东西:没洗的布样、洗过的布样、绣着两支金色麦穗的样带、方案打印件,和一顶你从1688买来的同料同帽型的藏青dad hat——这种"工厂现有的同款样帽"行内叫**现成样**,专为让客户确认帽型和手感,不含他的logo(它在打样体系里的位置,10.1.1会正式归队)。第十二天,快递上了飞温哥华的飞机。

八天后,Mike 的邮件到了,三句话:"这个手感对了,就是它。麦穗绣出来比图上还好看。下一步?"——1.2.2那句预言兑现了。你看着"下一步"三个字,心里清楚接下来的仗比前三章加起来都大:样带和现成样只是零件,现在要找到一家能把布、帽型、绣花、水洗全部按你的规格做出500顶的工厂,要报价、要打样、要签约。本节动作,也是本章最后一个动作:把这条七步流程抄成你的接单SOP第一页,然后把 R&B 这一单跑过的每一步在旁边标注成实例——**模板加一个跑通的案例,就是你未来每一单的起点**。

# 第4章 一顶帽子的生产之旅:流程与时间

**主线推进** —— 七月中旬,胶州。昨夜落地青岛,今天早上七点半,你已经站在李哥庄这家帽厂的裁剪车间里。从Mike那句"就是它"到今天,中间隔着一个多月:找厂、询价、打样、签PI、付定金——那是后面几章要补的课,此刻先按下不表。眼前的事更要紧:你的60米藏青磨毛斜纹(见1.2.2)昨天验完布,在裁床边摊了一整夜,几分钟后,它就要变成三千多片裁片。裁床班长把一卷长长的唛架纸铺上布层,电剪的嗡声响起来的那一瞬间,你忽然明白了一件事:在此之前,这单生意都还只是纸——邮件、色号、规格表、打款回单,每一步都可以撤回重来;从这一刀起,它变成了物。布裁开就拼不回去,花绣错了拆不干净,帽型做塌了救不回来——生产,是整条链上唯一不可逆的一段。所以你飞过来了,要亲眼把这一段盯完。这一章就是你在车间里的这几天:跟着你自己的布,把一顶帽子的生产之旅从头走到尾——每个工序在做什么、要多久、会在哪儿出事、你该在哪儿留一手。

## 4.1 总流程图

### 4.1.1 全流程动线:跟着一批布走一遍车间(生产通知单/流转卡)

早上七点四十,小周在车间门口等你——微信上对接了一个多月的跟单员,今天第一次见到真人,比你想象的年轻,手里捏着一沓单据和一部贴膜碎了角的手机。他抽出一张A4纸递给你:"你的单,昨天正式下车间了。"纸的抬头四个字:**生产通知单**——工厂内部把你的订单翻译成车间指令的文件。单号25-0712,客户简称R&B,款号、帽型一栏写着"6片软顶dad hat"(见2.1.2),数量栏是两个数:**投产520顶,交货500顶**;往下是面辅料明细——藏青磨毛斜纹60米、古铜滑扣(见2.4.2)、织唛、洗水标(见2.3.4)——每样后面跟着领用数量;工艺栏一行小字:"前幅平绣8800针,线色金黄428(样带为准,见3.1.8),轻酵素洗(见3.3.3),洗后装扣";最底下是出货日期。跟单员开单,一式几联,裁剪、车缝、后整、仓库各留一联。从这张纸起,车间里没人再提你的名字,大家只叫它"0712那个单"。

小周带你沿着物料的路线走了一圈,这条动线每家帽厂大同小异:

```
面辅料入库 → 验布 → 松布 → 排料拉布 → 裁剪 → 扎号
→ 绣花(本厂无绣花车间,外发邻镇——4.3.4细讲)
→ 车缝 → 水洗(做旧款,外发) → 定型 → 剪线整烫 → 包装 → 成品入库 → 出货
```

先记住一个反直觉的点:**绣花在车缝之前**——logo是绣在还没缝成帽子的平整裁片上的,不是绣在成品帽上,为什么这样安排,4.3.1给你机制。再看一个新手容易忽略的问题:布裁成几千片、分装十几个筐、在五个车间和两家外发厂之间流转半个月,工厂靠什么保证不乱?答案是一张跟着货走的卡:**流转卡**。裁剪完成后,每筐(行内叫每"扎")裁片上挂一张卡,写着单号、部位、层号段、片数,底下一排签名格——每过一道工序,经手人点数、签字。它的机制一句话:**让信息跟着物走,而不是躺在办公室**。绣花厂收货,按卡点数签收;车缝组长发料,按卡核对层号;包装点数短了三顶,翻卡就能查到断在哪一环、经手是谁。没有流转卡的厂,数量对不上要到装箱那天才发现,而那时谁也说不清货丢在哪儿。

投产为什么是520不是500?带你算:生产一路上会有损耗——裁剪的疵片、绣坏的、缝坏的、洗花的、除不掉污渍的(全部去向4.5.3给你算总账),常规干款按2-3%备量,R&B带一道水洗,按4%,500×1.04=520。而且这个数还要"凑整"——裁剪的数量等于每版排多少顶乘以拉多少层布,只能取整数(4.2.4你会亲眼看到)。所以生产通知单上"投产/交货"两个数的差额,就是这张单的**损耗预算**:差额小于2%的,大概率交货要短数;差额大得离谱的,损耗率里可能藏着别的东西(第9章报价拆解时再算这笔)。

你问小周:"以后我在国内外两头跑,怎么知道货到哪一步了?"小周指了指车缝车间门口那块白板——各条线的在产单号、数量、当前工序、预计完工日,一行一单——又扬了扬手里的流转卡:"问我。我也是看这两样,车间不会骗单据。"这句话你要听懂:跟单员说"在做了、快了",是没有信息量的安抚;报得出"在哪道工序、完成多少数"的,才是真跟进——差别不在态度,在他有没有去看白板和翻卡。本节动作,今天就做成习惯:开产首日向工厂要两张照片——你的生产通知单(其他客户信息可以遮掉)和首批流转卡;此后每次催单,先报单号,再问工序和完成数。你用车间的语言提问,对方就没法用客服的语言应付你。

### 4.1.2 并行与串行:你的交期取决于最忙的那个环节(瓶颈/产能验算)

跟着动线走完一圈,你的直觉是:生产像接力赛,一棒交一棒,总时间等于各棒相加。小周听完摇头,从本子上撕下一页纸给你画:不对,有些棒是同时在跑的。你的织唛和滑扣,在布还没验完的时候就已经下了订单——辅料采购和面料处理**并行**;绣花的版带,打样阶段就做好了(见3.1.6),制版和生产并行;纸箱和塑料袋,只要在车缝结束前到厂就行,和整个生产并行。真正必须排队的是那条主链:**裁剪→绣花→车缝→后整→包装**——裁片不出来绣花没东西可绣,前幅不回来车缝开不了线,这是物理依赖,叫破嗓子也压缩不了顺序。看懂并行与串行,你就看懂了交期的结构:**主链决定下限,并行项管理得好不好决定会不会额外掉链子**。并行项的坑在于没人盯:纸箱按理十天前就该订,采购忘了,等500顶帽子全部做完,整批货码在包装台边上等纸箱等了三天——货等箱,是车间里最冤枉的一种延误,因为它本来完全不占用时间。

主链上,每个环节的产能并不一样,而你的交期取决于最忙、最挤的那一个——**瓶颈**。这家厂的瓶颈在哪,你在车间里走一圈就有体感:裁剪车间三个人、两张裁床,一天能裁几千顶的量;后整包装是长条桌加人手,人多活快;唯独车缝车间,八条线、一百多号人,占了整个厂房面积的一大半,机器声从早响到晚——**车缝人最多、工序最碎、耗时最长,是整条链的产能瓶颈**。带你算个粗账(细账4.4.4再算):一条车缝线日产800-1200顶,八条线满打满算一天七八千顶,而裁床一天能供出上万顶的裁片——上游永远喂得饱下游,堵点只会在车缝。所以工厂排产的本质,是围着车缝线的档期转:你的单什么时候能做,取决于哪条车缝线什么时候空出来,而不是仓库里有没有布。

这个结构直接改写你的催单语言。外行催单问"我的货做到哪了",得到的回答永远是"在做了";内行催单问的是瓶颈:"**我的单排在哪条车缝线?几号上线?**"——这两个问题有唯一、可验证的答案,对方答了,你就有了可以对照的承诺;答不上来,说明你的单压根还没排进档期,"在做了"三个字当场现形。这也是本章末尾"催单五问"的第一块骨头。对话样本,车间里的真实版本——你问小周:"我这单车缝排哪条线?"小周翻了下本子:"三线,计划下周头上上线,前面还压着一个两千顶的单。"注意他给了三个信息:线号、日期、前置订单——这才叫排产;如果答案是"放心,肯定来得及",你听到的不是安排,是安抚。

本节动作,把"并行项清单"建起来:凡下单,列出四样并行物料——织唛/洗水标、调节扣、polybag(4.6.1认识它)、纸箱——逐样问工厂"哪天下单、哪天到厂",记在你的跟单表上;生产过半时逐样确认到位。主链你催不动物理,并行项你盯得住人祸——**交期管理的一半,是别让本来不占时间的东西挤上关键的那条路**。

## 4.2 裁剪工序

### 4.2.1 验布:半小时省出一批货(四分制)

裁剪车间靠墙的位置立着一台**验布机**:两根辊筒夹着一块倾斜的白色灯板,布从下辊放出、匀速爬过灯板、卷上上辊,灯板从背后打光,布上任何一点毛病——断纱、粗节、破洞、油污、色档——都会在逆光里现出原形。验布工坐在机前,手边一个计数器、一沓贴纸:看到疵点,机器停一下,贴纸往布边一贴,本子上记一笔。你的60米昨天已经过完机了,小周把验布记录递给你;此刻机器上过的是别人家的一卷灰布,你正好站着看明白这套规则。

行业通行的记分法叫**四分制**(four-point system):按疵点在布长方向上的尺寸记分——**7.5厘米以内记1分,7.5-15厘米记2分,15-23厘米记3分,23厘米以上记4分;破洞不论大小,一律4分;同一码布内最多记4分,封顶**。分数除以受检面积,折成"**每百平方码得分**"(外贸行当沿用美制;有的厂按百平方米折,口径差不到两成,谈之前对齐单位就行)。判定阈值记三档:**20分以内是好布,常规验收线;20-40分之间可用可议——降价、让米数或者挑段用;超过40分,退**。这套规则的漂亮之处在于它把"这布行不行"从吵架变成了算术:你和面料商之间不再是"我觉得毛病多"对"这很正常",而是一个有小数点的数。

拿你自己的记录算一遍:60米、1.5米门幅(见1.5.1),受检面积90平方米,约108平方码;记录上四处疵点——两个粗节各1分、一段2厘米的小色档1分、一处断纱2分,合计5分,折合**不到5分/百平方码**,优等,放行。而半小时省出一批货的版本,上周刚在这个车间上演:一卷外单的斜纹布,验到三十多米处开始出连续条痕,断断续续十几米,验布工越记越快,最后整卷记了60多分——整卷退回面料商换货。小周替你把后果推演了一遍:如果这卷布不验直接上裁床,几百片带条痕的裁片会均匀混进上万片里,裁剪看不出、车缝顾不上,要到成品整烫时才陆续现形——那时布的问题已经变成了几百顶帽子的问题,布钱变成了布钱加工缴加交期。**验布是整个流程里唯一一个"疵点还集中在一处、还能整卷退货"的时刻**;错过它,疵点就化整为零,永远追不回来了。这就是为什么验布机是最容易被小作坊省掉、又最不该省的半小时。

顺带认一个小动作:验布时布头布尾各让掉半米一米不裁——布卷两端受轧最狠、印章标记也在那里,行内叫让码;你60米布实际可用五十八九米,1.5.1算过500顶用布约57米,余量刚刚好,这也是当初采购定60米而不是57米的原因之一(多出的布头还有一个用途:1.3.2说过的同缸布头,留两米作检测备份)。本节动作,两句话写进你的面料条款:"**大货面料按四分制验布,验布记录随大货提供;超过40分/百平方码的整卷退换,不得投产**。"人到厂的话再加一个动作:开裁前亲眼看一眼验布机开没开——机器上蒙着灰的厂,记录再漂亮也是补出来的。

### 4.2.2 松布与缩水:布的"脾气"要先泄掉

你的布昨夜没闲着——它在裁床边的长台上摊了一整夜。一卷卷布被拉开、一层一层松松地叠成"之"字,像一摞刚出锅晾着的千层饼。你问小周这是晾什么,小周说了个词:**松布**——布裁剪之前,先摊开静置,让它回到自然状态。"跟牛排一样,煎之前得回温。"

机制在布的身世里。一卷布从织机到染厂再到卷装,全程是被拉着走的:织造有经向张力,染整的烘筒拖着它跑,最后再紧紧卷成一卷——纤维始终处在被拉长的状态,**内应力**没有释放。这时直接上裁床会怎样?裁的那一刻尺寸全对;裁完的布片没有了卷装的约束,纤维慢慢回缩,几个小时到几天里,裁片自己"缩小半圈"。帽子的尺寸允差本来就紧——帽围±1厘米(见2.5.1)——布片回缩个百分之一,六片拼起来,帽围就能缩掉将近一厘米,一分钱不花就把整批货做到允差边缘。所以正规做法是:到布之后摊开静置**12-24小时**(梭织棉布的常规口径;针织布更娇气,要48小时),让张力先泄掉,再排料开裁。你在验厂时看到裁床边摊着一堆"晾着"的布,那不是懒散,是好信号。

这里要把两个容易混的概念切开:**松布管的是"张力回缩",预缩管的是"遇水收缩"**——后者就是1.1.1讲过的棉纤维吸水膨胀再干燥回缩,幅度1-3%,松布泄不掉它,只有让布先见一次水或蒸汽才行。讲究的厂对高要求全棉订单会加一道**预缩**:布过蒸汽预缩机,或者直接采购做过预缩处理的布。R&B这单在这件事上是闭环的,你可以顺着捋一遍:面料克重240克以"退浆水洗后"为准(1.3.2的条款),说明这批布进厂前就见过水;成品还要过一道轻酵素洗(见3.3.3),尺寸最终在水洗后定型定死;打样阶段量的就是洗后帽围——**从布到成品,所有尺寸口径统一在"洗后"**,当初面料卡上较真的那半句话,在裁床边兑现了。

不这样做的下场,给你一个真实质感的案例。一家厂赶一批加急的全封弹力帽(fitted,分码款,见2.4.3),布上午十点到厂,下午一点就上了裁床——省掉的那半天松布,三周后变成了客户的验货报告:全批帽围普遍偏小0.8-1.2厘米,7-1/4码的帽子戴出7-1/8的紧。分码款没有调节扣兜底,超差就是超差,返工无从返起,整批折价三成处理。最冤的是追责:布没问题、纸样没问题、车缝没问题,每个环节单独查都是好的——问题出在"布还没醒就挨了刀",而这个环节合同里一个字都没写。

本节动作,两句话。问厂:"**布到厂到开裁,中间留几个小时?全棉的做不做预缩?**"——答"当天到当天裁"的,你要在心里给它的尺寸稳定性打个问号;答得出"松24小时、高要求的过预缩"的,是懂行的厂。写单:凡全棉、凡分码款,在生产要求里加一行"**面料静置24小时后方可开裁**"——赶急单时这行字会保护你:省掉的12个小时,赌的是整批货的尺寸。

### 4.2.3 排料与唛架:电脑屏幕上抠出来的利润(用料率/倒顺毛)

裁床旁边隔出一间小办公室,一个技术员对着大屏幕挪动一堆彩色的小块——那些扇形、月牙形的色块,就是你这顶帽子的全部裁片:六片帽身(见2.2.1)、两片檐面布,还有后弧条几样小件。他在做的事叫**排料**:把所有裁片在一幅布的宽度里横挪竖转,拼出浪费最少的摆法——像玩一局不许留缝的俄罗斯方块。排定之后,绘图仪吐出一卷1:1的长纸,上面印满裁片轮廓,铺在布层最上面给裁刀引路——这卷纸叫**唛架**(marker,也叫排料图)。衡量这局方块玩得好不好,只看一个数:**用料率**——裁片净面积占用布总面积的百分比,**排得好85%以上,排得差只有75%**。

带你把这个百分比换算成钱。R&B这款帽子的裁片净面积约0.14平方米/顶:用料率85%,单顶耗布0.165㎡;掉到75%,就是0.187㎡——1.5.1说的"单顶用布0.15-0.18㎡"那个区间,高低两端之间隔着的就是排料水平。对你这一单,差距是(0.187−0.165)×520顶≈11平方米,合七八米布、一百来块钱——不大。但换到工厂的算盘上再算一遍:全厂日产八千顶,用料率每差一个点,一天多耗几十米布,一年下来是**十几万人民币**——这就是为什么排料技术员的屏幕前贴着每款的用料率指标,为什么这个岗位的工资比车工高:他是全厂唯一一个"在屏幕上直接生产利润"的人。这笔账还有一个对你的用法:1.5.1教过的反算验价,用的正是0.17这个中间值;哪家报价单里的用布量按0.19、0.20起算,你现在知道该问什么了——"你们这款用料率多少?"一句话,虚报用量的路就窄了。

你这款还有一个特殊约束,技术员指着屏幕给你看:所有裁片摆的是同一个方向,没有一片倒过来"插空"。原因在布上——磨毛斜纹的绒面有倒向(1.2.3讲灯芯绒时你见过这个词:**倒顺毛**),顺着摸和逆着摸,光线下深浅差半档;六片帽身如果有的顺排有的倒排,缝成帽子后相邻两片一深一浅,像拼错了色——而布本身没有任何问题,验布验不出、扎号救不了,病根在排料这一步。代价是:同向排料不能利用"倒插"抠缝隙,用料率掉2-3个点——你的单实际做到82%左右,单顶耗布0.17㎡,和1.5.1的算例严丝合缝。事故版本是省掉这个约束的:一批军旅风的磨毛斜纹五片帽,排料图省事用了双向排,大货在室内灯下看不出,客户拿到户外拍产品照,前幅和侧片一深一浅,整批投诉"色差"——工厂拿着同缸证明喊冤,面料商拿着验布记录喊冤,最后账算在排料头上时,货已经在海上了。

本节动作,两条。写进规格书:"**磨毛、灯芯绒等绒类面料,全部裁片同向排料**"——一句话,九个字换一批货的下限。问厂话术:"这款用料率能做到多少?唛架发我看一眼。"——唛架就是一张图,发你毫无成本;肯发的,用料率大概率是真的,支支吾吾的,报价单上的用布量先打八折再谈。

### 4.2.4 拉布与裁床:一刀下去几百顶(叠片检查法)

八点整,开裁。两个工人站在裁床两端,把你的布卷架上放卷器,拉着布头沿着十几米长的裁床往返铺布——这道工序叫**拉布**:把布一层一层平铺叠起,铺成一个厚厚的"布千层"。你这批240克斜纹,铺了**26层**;唛架纸往最上层一铺,一版排20顶,26层就是**520顶**——生产通知单上那个投产数,是这样凑出来的:裁剪数量=每版顶数×层数,只能取整,所以515的需求凑成了520(4.1.1埋的那个数,在这里落地)。顺带你注意到一个细节:工人每铺完一层,在末端把布剪断、回到起点再铺下一层,而不是拖着布来回折返——**单向拉布**,为的就是上一节的倒顺毛:折返铺布每层毛向会交替颠倒,同向排料就白排了。绒类面料的讲究,是一环扣一环的。

然后是裁。这家厂两套家伙:一台电脑裁床跑大单——龙门架上的振动刀按唛架数据自动走线,精度±1毫米,几十层一次成型;你这520顶是小单,班长直接上**手工电剪**——一台立式电动裁刀,刀片高频起落,老师傅双手推着它沿唛架线条走,像用电锯雕花。电剪的精度全看手艺:直线容易,帽片那种连续弧线,刀身稍一倾斜,上层照着线走、底层就偏出去一两毫米。这一两毫米为什么要命?**裁片精度是车缝质量的地基**:帽片弧线差2毫米,车缝工只能凭手感把长的一边"匀"进短的一边,匀好了看不出,匀不好就是缝歪、起皱、帽围超差——第11章疵点图鉴里的"缝歪",病根常常不在车缝在裁剪。

所以裁完不能直接扎号入筐,要过一道十秒钟的关:**叠片检查法**——从裁好的布千层里,抽**最上层、中间层、最底层**各一片同部位裁片,三片对齐叠在一起,捏着边缘转一圈看错位:**三层边缘错位不超过2毫米,放行;超过,整床追查**。三层的选法是有讲究的:上层偏差来自唛架铺放和刀的入角,底层偏差来自刀身倾斜和布层滑移,中层是基准——三点连线,整个厚度方向的走刀质量一目了然。班长当着你的面抽了前幅片做了一遍,三片边缘齐得像一片,他把裁片拍在你手里:"自己转一圈。"你转了一圈,第一次用手指头验收了自己的货。事故版本给你留着:一家厂拉布图快,张力没放匀,上松下紧,裁出来底下八层的帽片整体小了一圈——混进大货,那批帽子的帽围呈现出诡异的双峰分布,验货抽样怎么抽都像运气问题,折腾两轮才追到拉布头上。

数字锚点收拢一下:常规帽用面料拉布20-40层(布越厚层数越少,帆布这类重磅料十几层封顶);电脑裁床适合大单,小单调机不划算;电剪裁一床520顶,连拉布带裁带分捆,半天。你的裁剪环节账面写"1天",其中真正下刀的时间不到两小时——剩下的是拉布、静置间隙和收尾,这个"机时远小于历时"的结构,4.7.1会成为你理解整个交期的钥匙。本节动作:验货前学会开口要三样——"拉布单向还是往复?叠片检查做不做?抽三层的裁片让我看一眼。"人不在场,就让工厂拍"三片叠齐转边"的十秒视频——这个动作装不了假,做没做过,手法骗不了人。

### 4.2.5 扎号:几毛钱的标签,救回整批货的颜色

裁完的帽片一摞一摞码在案上,两个女工各持一把打号枪,沿着摞边"哒、哒、哒"地打——每片裁片的反面边缘,贴上一张指甲盖大的小纸标,印着两位数字。这道工序叫**扎号**(也叫打号):给每一层布裁出的每一片,标上它的**层号**——第1层裁的所有片都是"01",第26层都是"26"。到了车缝端,配片工按号发料,**同号相配**:一顶帽子的六片帽身加檐面,必须全部来自同一层布。520顶、每顶八片主裁片,四千多枚小标,材料加人工统共十几块钱——这十几块钱买的是什么,得回到第1章。

买的是**缸差防线的最后一环**。1.4.1讲过:同色不同缸的布有物理上无法消除的细微色差,你的面料条款写了"同一订单须同缸染出"。但同缸只解决了缸与缸之间的问题——同一缸布分卷、分段,匹头匹尾之间仍有轻微深浅(1.4.1拆过的三层来源,在卷内也小规模存在);更现实的是,拉布的26层未必来自同一卷:你60米布是两卷,第1-14层是A卷、第15-26层是B卷。如果配片时随手抓——第3层的前片配上第22层的后片——两卷布之间那一丝丝色差,就被并排缝在了同一顶帽子上,人眼对"并列对比"敏感得残酷:单看每片都正常,拼在一起就是一顶"阴阳帽"。扎号把这条路堵死了:同层必同卷、同段,**层号一致,颜色的出身就一致**。1.4.1那条"分缸裁剪、分缸装箱"的条款,车间里的执行形态就是这几毛钱的小纸标。

这套制度好不好使,还要看执行,车间里正好给你演了一课。三线一个新来的配片工,把两摞不同层号的前片混在了一起,车缝组长清点时发现号对不上,当场把二十几顶半成品退回重配——流转卡(见4.1.1)上多了一行返工记录,损失半小时。你看着觉得小题大做,小周在旁边说了句行话:"号乱了不返,等于没扎。"反面案例是省掉这道工序的小作坊:一批800顶的军绿渔夫帽,两批布混裁不扎号,室内验货一切正常,客户户外一拍照,一百多顶前幅侧片色差半档——没错,就是1.4.1讲过的那场事故;当时你记住的教训是"同色号不等于同缸",现在可以把另一半补全:**就算同缸,不扎号照样出阴阳帽**。缸差防线是三段式的:面料端锁同缸(1.4.1条款)、裁剪端扎号、车缝端按号配片——断掉任何一段,前面两段白做。

验货时这个知识点有一个便宜的用法:翻开帽子的汗带(见2.3.3),看缝份(见2.2.2)里侧——扎号的小纸标车缝时藏在缝份里,多数被撕掉,偶尔留下一两张残角或一点残胶。**看到残号,是好信号**:说明这批货认真扎过号;一批货翻十顶找不到任何扎号痕迹,就值得问一句"你们扎号按什么扎"。本节动作,把这句问话记进验厂清单:"**裁剪扎不扎号?按层还是按缸?**"——答"小单不用扎"的厂,把你关于颜色的全部条款都当成了纸;答得出"按层扎、配片对号"的,1.4.1到4.2.5这条防线,它是真的懂。

## 4.3 绣花工序

### 4.3.1 为什么绣花排在车缝前

第二天傍晚,裁剪收尾。案台上码着几十摞扎好号的裁片,小周领着两个工人做了两件事:先把前幅的两片帽身两两配对,送到车缝车间角落的两台平车上,拼合、劈缝、烫平——R&B的logo宽10厘米,跨着前中缝绣(2章定规格时埋的伏笔:6片帽有中缝,跨缝绣必须先拼前幅、把缝劈开烫平,绣花才能压缝而过);然后,拼好的前幅单独装筐,筐上挂流转卡,和其余裁片分开码放——这两筐明早出发,去邻镇的绣花厂。你问了那个每个新手都会问的问题:"为什么不把帽子做好再绣?省得这么折腾。"小周把一片烫得平平整整的前幅拍在你手心:"你摸摸它,再想想一顶做好的帽子,哪个好绣?"

机制拆三层。第一层,**平片才绷得紧**。绣花的质量本质是张力管理(3.1.6讲拉力补偿时你见过这个逻辑):底布绷得紧、绷得匀,针迹才密实平整;一块平整的裁片可以在绣花框里绷成一面小鼓,而缝成立体的帽子,前幅是个弧面,怎么绷都有松有紧——针迹一半浮一半陷,密度乱,轮廓毛。第二层,**平片才定位得准**。裁片往定位模板上一卡,logo位置毫米级复制五百次(下一节细讲);成品帽的弧面定位靠人眼和手感,偏个三五毫米是常态。第三层,也是生意层——**绣坏了不心疼**。带你算:绣废一片前幅,损失是两片布加裁剪工缴,统共不到一块钱,补裁一片重绣就是;绣废一顶成品帽,面料辅料工缴全部陪葬,十五六块(这顶帽子的完整成本构成,第7章拆给你看),**三十倍的差距**。500顶按千分之几的绣废率,两种顺序间隔着几十块和上千块的距离——顺序本身就是钱。

还有第四层,藏在流程组织里:绣花外发要走两三天(4.3.4的主题),这两三天里,车间并没有闲着——辅料在陆续到位、织唛在路上、车缝线在收前一个单的尾。**绣花排在车缝前,让"等绣花"和"备车缝"并行**(4.1.2的并行逻辑又用上了);如果反过来先车缝后绣花,成品帽运出去绣、绣完运回来包装,多出两趟物流不说,包装环节干等,主链凭空拉长。行业把绣花放在这个位置,是质量、成本、流程三笔账算出来的同一个答案。

这个知识点对你的实战价值,在接单端。客户常提一种听起来很合理的要求:"帽子你先做着,logo我们还在改,好了再绣。"你现在知道这句话在流程上意味着什么——logo不定稿,裁片就压在绣花前动不了,后面整条主链干等;真按客户说的先把帽子做出来,就只剩成品帽绣花一条路,质量和单价全变(4.3.3马上讲)。本节动作,把这句话术存好,原样回给未来的客户:"**帽子可以先裁,但logo每晚定稿一天,交期就顺延一天——绣花在车缝前面,是它在等你,不是你在等它。**"一句话,把流程知识变成交期谈判里的白纸黑字。

### 4.3.2 上绷与定位:绣偏的来源

绣花厂的车间你第三天上午就见到了(跟车去的,那段路上的故事下一节讲)。十几台十二头的多头机(见3.1.4)一字排开,机器边上坐着一排女工,做的是同一个动作:左手从筐里抽一片裁片,往一块开着窗口的亚克力板上一卡、对线、右手把绣花框"咔哒"扣紧,一片装好,丢进待上机的筐。这个动作叫**上绷**:把裁片固定进绣花框并绷紧、绷匀。那块开窗的亚克力板,是**定位模板**:按帽片形状开出窗口,窗口里刻着十字基准线——裁片卡进窗口,边缘对齐、中缝对准竖线,logo的位置就被锁死在同一个坐标上。500片前幅,靠这块几十块钱的板子,做到"每一片的麦穗都长在同一个地方"。你那批是跨缝绣,模板的竖线对的就是劈开烫平的前中缝——昨天傍晚那道拼缝工序,在这里显出了它的分量:缝劈得不平,模板对得再准也白搭。

**绣偏**——logo没绣在前幅正中,或高低歪斜——是绣花车间的头号疵点,来源恰好可以沿着上面那套动作逐个数。一,**上绷松了**:框没扣紧或布没绷匀,机器一开,几千针的拉力让布在框里悄悄走动,绣出来的图整体位移、轮廓发虚。二,**模板旧了**:亚克力窗口被裁片边缘磨了几万次,越磨越大,裁片在窗口里能晃出一两毫米——每一片都"对准了",每一片又都不在同一个位置。三,**裁片本身不正**:4.2.4那一两毫米的裁剪偏差,传导到这里就是对位基准漂移——裁剪的地基,又一次在下游收利息。四,**机器跑位**:断线急停再启动时起绣点错位,或绷框在机架上没卡到底。判定阈值给你一个通行口径:**logo中心相对前幅中线,横向偏差±2毫米、纵向±3毫米以内算合格**;这个数写进规格书,验货就有了裁判尺。

验货动作也顺手教你,成本为零:**拿十顶帽子对齐帽檐叠成一摞,正面看logo的高低左右**——单看一顶,3毫米的偏差人眼根本发现不了;十顶一叠,logo连成一条线,谁高谁低谁歪,像心电图一样直观。这一招的原理和4.2.4的叠片检查法同源:**单件的误差藏得住,批量的误差叠在一起自己招供**。事故案例配上数字:一家绣花厂给某单绣了300片,用的是一块窗口磨大了的旧模板,片片能晃,绣完一叠——logo高低差出4-5毫米。返工?**拆绣花等于毁裁片**:八千多针拆下来,布面留下一片针孔麻子,基本等于报废重裁。300片前幅,补布、补裁、补绣,交期多吃三天——一块该换没换的模板,市价几十块。

本节动作,落在"首件确认"上,这是你对绣花质量最重要的一次干预机会:**上机第一框绣出来,要照片也要实物比对**——照片看位置(对模板、量尺寸),实物对样带(见3.1.8,线色屏幕看不准,这句话的分量后面你会懂);首件签字放行,再让机器跑剩下的五百片。把它写进订单一句话:"**绣花首件确认后方可批量生产,首件实物随大货留存**。"绣花是所有工序里"错一个=错一批"最典型的一道——五百片是同一块模板、同一个程序绣出来的,首件对,批量大概率对;首件都没人看,批量出事就只是时间问题。

### 4.3.3 成品帽绣花:帽绣机与现货帽二次加工

绣花厂车间的最里侧,和那排多头机隔着一条走道,立着两台长相不同的机器:机头下卡着的不是平面绷框,而是一个个弧形的筒——筒上撑着的,是一顶顶做好的成品帽。这就是**帽绣机**(3.1.4面料市场二楼那台,你已经见过一面):专为成品帽设计的绣花机,筒形绷架把帽子前幅撑成尽可能接近平面的弧,帽檐翻折让开针位,机针在弧面上起落。既然4.3.1把"先绣后缝"的道理讲得那么硬,为什么还有一整类机器专干相反的事?因为市场上永远有一类订单,等不了、也不值得走大货流程——帽绣机吃的就是这碗饭。

先把它的先天限制交代清楚,免得你对它抱错期待。**绣区小**:帽檐占着下沿、帽顶弧度收得急,可绣区域比裁片绣缩一圈,贴近帽檐和顶扣的位置针进不去,大logo、低位logo直接出局。**张力不匀**:弧面绷不出平面的均匀张力,针迹密度和轮廓锐度天生比裁片绣差半档——3D立体绣、细笔画小字这类挑张力的工艺(见3.1.7),在帽绣机上要再让一步。**效率低**:裁片绣一框十几片一起装卸,成品帽一头一顶、单只上绷,装卸时间比净绣时间还长,弧面还得压着转速跑——同样8800针,裁片绣摊到单片一分钟出头(3.1.4算过),成品帽绣一头一小时只出三四顶。效率的差距直接写在价签上:**成品帽绣花按顶计价,常规logo¥2.5-3.5/顶,千针单价比裁片绣贵三到五成**。

那它凭什么活着?凭"快"和"小"。典型场景一:**现货帽二次加工**——客户下周就要200顶,任何定制流程都来不及,直接买市场现货白帽,帽绣机绣logo,三五天交货;这条"最低成本起步路"怎么走、账怎么算、边界在哪,第6章会带你去义乌现场看(见6.5.1)。场景二:**微单**——三五十顶的单,开裁床、上流水线的固定成本摊不动,现货帽加成品绣是唯一经济解。场景三:**大货救场**——大货里挑出几十顶绣花不良,拆花重绣或补绣,靠的就是帽绣机;这个用途眼下和你无关,记住就好,说不准哪天用得上。带你算一笔对比账,把选择的边界钉死:100顶急单,现货帽¥8+成品绣¥3+制版费¥200,合¥1300、五天;走定制流程,起订量就把你挡在门外(见1.5.2、6.2.2),就算接了,35天交期也早过了活动日期。**量小于百顶、时间短于两周、客户对帽子本身没有规格要求——三条占两条,成品帽绣花就是正解**,不是妥协。

反过来,新手最容易犯的错是把这条捷径当正路:有人给品牌客户报大货,打的算盘是"现货帽8块加绣花3块,比定制17块5便宜一半"——省的钱是真的,丢的东西也是真的:克重、辅料、版型、一致性,全部锁死在货架上是什么样就是什么样(这个代价的完整清单,见6.5.2),而品牌客户恰恰是为这些东西付钱的。对话样本,未来你会反复用到:客户问"你们能不能便宜点,我看有人报11块",你的回法——"11块做的是现货帽绣logo,帽子本身是市场通货;我报的是按你规格开的定制,布、扣、版型都是你的。**两个价对应两种货,你先定要哪种,再比价才有意义。**"本节动作:把"百顶内/两周内/无规格要求"这条三问决策口诀记进接单SOP——每次报价前先过一遍,给客户对的路线,比给客户低的价格更能留住人。

### 4.3.4 绣花外发:交期与品控的转手

第三天早上七点,一辆面包车停在裁剪车间门口,两筐前幅裁片抬上车,你跟着上了副驾。二十分钟,到邻镇的绣花厂——院子比你想象的热闹:卸货区码着十几个和你那两筐长得一样的筐,每个筐上都挂着流转卡,只是抬头各不相同,来自不同的帽厂。办公室里,老板娘接过小周递的流转卡,点数、签收、在一块写满单号的白板上添了一行。你凑近看那块白板,数了数:排在你前面的,有九个单号。

这就是**外发**:工厂把某道工序交给外部专业厂加工——你的工厂没有绣花车间,全镇大多数帽厂都没有。机制上这不是偷懒,是产业分工的算术:一台十二头绣花机十几万,绣花订单又天生波动——这个月三个大单排不开,下个月机器晒太阳;单个帽厂养绣花车间,设备利用率撑不满,摊销吃掉利润。于是绣花独立成厂:一家绣花厂几十台机,服务周围几十家帽厂,把波动互相对冲掉,机器全年吃饱,千针单价(见3.1.5)才压得下来。你后面会看到,这正是产业带"一小时配套圈"的毛细血管(第6章整章展开)。**外发本身不是问题**——专业绣花厂的设备和手艺往往比帽厂自养的车间更好;问题在于,你的订单从这一刻起,有两样东西转了手。

第一样是**品控的转手**。绣坏了谁负责?行规是绣花厂赔布——按裁片成本赔,一片几毛一块;但你的交期、你对Mike的承诺,它不赔也赔不起。首件确认(见4.3.2)谁来做?你的工厂跟单员来盯是正路,可旺季小周一个人跟着七八个单,靠的常常是微信照片——中间隔了一块屏幕(这块屏幕会吃掉什么,你很快会有切身体会)。第二样是**交期的转手**:白板上排在你前面的九个单,每一个都不归你的工厂管;你的交期里,有三五天押在一家你签约时根本不知道名字的厂里。这就是标题那句话的完整含义——**外发,是交期与品控的转手;转手不可怕,可怕的是你不知道转给了谁、转走了多少**。

然后,轮到你自己领教。说好裁片到厂第二天上机,第二天中午小周转来消息:"绣花厂那边前面插进来一个加急大单,美国客人的,两万多片,老板娘拍板先赶那个。你的往后排,后天上。"你当场算了算3.1.4的账:520片、8800针、十二头机,机时统共一个台班——**一天的活,排队排三天**。你问能不能加钱插队,小周在电话那头苦笑:"这点加急费人家看不上。旺季的绣花厂,大单才是亲儿子。"那个下午你第一次尝到了盯产的真实滋味:货不在自己厂里,连白板都看不到,只能等。你在笔记本上记了一行:"绣花外发,被压两天。"当时觉得记它纯属强迫症——后来复盘这一单的时候,你会发现这一行小字,是第一块倒下的骨牌(第26章见)。

本节动作,三条,全部写在下单之前。第一,问清转手对象:"**绣花自己做还是外发?外发哪家、多远、旺季排队一般几天?**"——答案填进你的交期预算,别让它藏在工厂报的总交期里。第二,把外发窗口写进计划:生产计划表上,绣花单列一行"外发X天(含排队)",超了这个数你才知道该催谁。第三,上机留痕:"**外发上机当天,发首件视频与样带比对照**"——货在别人厂里,留痕是你唯一的眼睛。至于排队这件事本身,记住绣花师傅那句被你抄进笔记的话(3.1.4):机时是物理,排队是江湖——物理你算得出,江湖,要靠后面几章慢慢学。

## 4.4 车缝工序

### 4.4.1 工序分解表:每道缝对应什么机器

等绣花的这两天,你泡在车缝车间——反正你的单还没上线,八条线上跑着的都是别人的货,正好把这门主课看明白。一进门先是声音:一百多台缝纫机的"哒哒"声连成一片密雨,间或插进气动打扣机"咔嗤"的重音;然后是节奏——三线正在做一批黑色snapback(见2.1.2),你站在线头看一片片裁片进去,站到线尾,看一顶顶成型的帽子出来,中间隔着十三个人、十来道工序。你问小周:"一顶帽子到底缝几步?"小周说:"走,从头给你数一遍。"下面这张表,就是那趟"数"出来的——以经典6片棒球帽为例,工价取常规款量级(只含工缴、不含辅料,单价随款型浮动):

| 工序 | 做什么 | 机器 | 工价量级(元/顶) |
|---|---|---|---|
| 合帽片 | 六片两两拼三组,三组合成帽身 | 平车 | 0.35 |
| 压线 | 拼缝处压双明线加固兼装饰 | 双针车 | 0.25 |
| 上沿条 | 帽内缝份包边(见2.2.2) | 嵌条机(拉筒) | 0.30 |
| 锁气眼 | 绣眼锁缝;金属鸡眼另用冲扣机(见2.3.1) | 凤眼机 | 0.15 |
| 做檐 | 檐面布包檐芯、车檐面线(见2.3.2) | 帽檐机/多针车 | 0.40 |
| 上檐 | 帽檐与帽身合缝 | 厚料平车 | 0.40 |
| 上汗带 | 缝入汗带、夹入织唛(见2.3.3、2.3.4) | 平车 | 0.30 |
| 装后弧上扣 | 后开口收边、装调节扣(见2.4) | 平车+手工 | 0.30 |
| 钉顶扣 | 帽顶装顶扣 | 撞钉机 | 0.10 |
| 中查翻帽 | 半成品检查、翻帽、传递 | 杂工 | 0.15 |

十项加总约¥2.7——**"车缝工缴¥2.5-4/顶"这个全书口径,就是这张表的合计**;款式越复杂,行数越多、单行越贵,合计往4块那头走。表不用背,但三个位置要看懂。第一,**上檐是王座**:把一条硬邦邦的檐芯均匀地"吃"进帽身的圆弧里,快一分起皱、慢一分歪斜,是全线技术含量最高、工价最高的工位——整条线谁坐这个位置,谁就是这条线的定海神针,验厂时多看它两眼。第二,**机器就是语言**:双针车、嵌条机、凤眼机……这些名字是你听懂报价和验厂的词汇表——第2章讲过檐面线每加两行工缴加一毛(2.3.2),现在你知道那一毛加在哪台机器上;将来验厂看设备(第12章),数的也是这些机型。第三,**你的单有个变体**:R&B的前中缝在裁剪后就拼好烫平了(为了跨缝绣,见4.3.1),所以上线后的第一道"合帽片"从合另外四片起步——流程不是死的,工艺要求会改写工序表,这也是为什么每个新款上线前,组长要拿着样品重排一遍工序。

对话样本,给你一个用这张表的实战瞬间。未来某天工厂对你说"你这款帽檐要车八行线、后弧加沙比织带,工缴得加三毛",你不必再凭感觉判断贵不贵——摊开表:八行线比六行多两行,+0.1(2.3.2口径);织带滚边多一道嵌条工序,+0.15量级;合计两毛五——对方要三毛,水分五分钱,谈或不谈都心里有数。**工序表是工缴的解剖图:别人报总数,你看得见明细,谈判桌就斜向你这边。**本节动作先留个作业引子:今晚回酒店,把你自己头上那顶帽子翻过来,对着这张表"倒放"一遍——找出每道缝对应哪道工序、哪台机器;找不全没关系,章末作业会让你正式做一次。

### 4.4.2 流水线逻辑:平衡、换款损耗与翻单红利

在三线旁边站了半个钟头,你看出一点门道:线中段的上檐工位前,慢慢堆起了一小摞半成品,而线尾的钉顶扣工人,每做完一顶都要空等几秒。班组长也看见了,走过去把压线工位的一个熟手挪去支援上檐,十分钟后,那摞半成品消下去了。你目睹的这一幕,是流水线管理的全部主题:**平衡**。

机制从一个数讲起:**节拍**。一条13人的线,一天10小时按1000顶产量算,平均每36秒就要有一顶成品下线——这36秒就是全线的节拍。但每道工序的耗时天生不等:钉顶扣十几秒,合帽片四十多秒,上檐要一分多钟——怎么让每一站都跟上36秒的鼓点?靠配置:快工序一人兼两道,慢工序双人并行(所以上檐几乎总是两个工位),这门"把人往工序上摆"的手艺就是**流水线平衡**。平衡的铁律是:**整线速度由最慢的那一站决定**——上檐堵住,后面五个工位集体挨饿,前面七个工位白忙,产量表上掉的是整条线的数。4.1.2讲过车缝是全厂的瓶颈,现在你看到了瓶颈的内部:每条线里还有自己的瓶颈工序,大瓶颈套着小瓶颈,产能就是这样一层层被"最慢的一站"定义出来的。

平衡不是排一次就完的——每换一个款,全部重来,这就是**换款损耗**。新款上线第一天:工序重拆、工价重议、模板夹具重调、每个工人的手要在新动作上重新长出肌肉记忆——头一两天,整线效率只有六七成;第三四天爬回九成;一周后满速。量化给你:1000顶/日的线,换款日只出六百多顶,凭空蒸发近四百顶产值——这就是为什么工厂讨厌频繁换款,为什么大厂拒绝小单(它的完整算术,见6.4.2)、为什么多款小单的报价总比单款大单贵一截:**你付的不是布和线,是那条爬坡曲线**。而曲线的另一面就是**翻单红利**:翻单上线,唛架是现成的(4.2.3)、绣花版带是现成的(3.1.6)、工价表是谈好的、工人的手是熟的——第一天就跑九成五,爬坡损耗归零,制版费还免(见3.1.5)。工厂报翻单价时那点难得的爽快,不是让利给你的人情,是成本结构真的变了——这笔红利怎么用在客户经营上,第24章会教你把它变成谈判筹码。

对话样本,你和三线班组长的原话。你问:"为什么不把最快的人都放在最难的工序上?"组长头也没抬:"快手都想守着简单工序多计件,难工序给谁谁躲——线是死的,人是活的,平衡就是跟人摔跤。"这句车间哲学,直接把你送进下一节的主题:工人为什么挑工序?因为工资是计件的——流水线的物理你已经懂了,流水线的人性,才是交期和质量的另一半真相。

本节动作,两句问厂话术,下单前用。第一句:"**我这款你们线上做过没有?**"——做过同款或近似款,爬坡省一半,交期实、质量稳;全新款,自动在心里给交期加两天。第二句:"**这款上线,你们计划整线做还是拆工位插着做?**"——500顶的小单多半是插着做(4.4.4细讲),提前问明白,你才知道4.7.1那张耗时表里"车缝5-6天"的真实构成。

### 4.4.3 计件工资与工价表:难款为什么没人做

车缝车间的饮水机旁贴着一张红纸,你路过时停下来看了很久。表格手写,一列工序名、一列单价:合帽片0.35、上沿条0.30、上檐0.40……正是4.4.1那张表的车间原版,只是每个数字旁边多了些涂改的痕迹——那是历次"议价"的化石。这张红纸叫**工价表**:每道工序的计件单价清单,车缝工人的工资=各自做的件数×对应单价,做多少算多少,月底加总——这就是**计件工资**,中国制造业车间的通行制度,也是你理解车间里一切行为的钥匙。

先验算一下这套制度的量级,顺便校准你对"工人挣多少"的体感。一条13人的线日产1000顶,工价合计¥2.7/顶,全线一天的计件工资就是2700块,摊到人头约200出头;干满26天,月薪5400上下——熟手快、守着好工序的,六千往上。这个数和你后面会在产业带一章看到的"山东车工月薪五六千"(第6章)对得上——**工价表×产量=工资,三个数互相锁死**,哪个数字听起来不对,都能用另外两个反算出来。这个验算还有个用途:哪家工厂跟你说"我们工人便宜,工缴给你算1块5",你现在会算了——1.5的工缴撑不起5000的月薪,便宜的要么是产量数字,要么是你看不到的角落。

制度的力量在于它塑造行为,而它的副作用正是本节标题:**难款没人做**。机制是干净的算术:计件制下,工人的时薪=单价÷单件耗时。一个常规款,上檐0.40元、一分钟一顶,时薪24块;换成一个八行檐面线加厚帆布(见1.2.3)的难款,单件耗时翻倍——如果单价不动,时薪当场腰斩。工人不会跟你争论,他们用脚投票:难款的裁片在线头堆着,人人都"先把手里的常规款做完";组长硬摊派,接活的人心里有气,手上就毛躁——**难款的质量风险,一半来自工艺,一半来自工价没到位**。解药只有一个:难工序加价,把时薪抹平。所以,当工厂对你说"**这款要加工缴**",先别按住钱包冷笑——这句话多半是真话:钱不是进老板口袋,是进红纸上那几个涂改的数字,让工人愿意伸手接你的裁片。

事故案例,数字齐全。一家贸易公司下了800顶灯芯绒六片帽,按常规款工缴谈的价,工厂勉强接了。上线那天,车工看一眼布就摇头——灯芯绒厚、滑、怕压痕(1.2.3的老话题),单件耗时一倍半,工价没加,没人领活。裁片在线头躺了整整一周,组长换了三拨人,最后老板拍板每顶补0.8元工价才动起来——交期晚了九天,补的工价工厂自己吞了,下一次报价,这家工厂给这个客户的所有"复杂款"报价直接上浮15%。你看:**砍掉的工缴不会消失,它会变成交期、质量或者下一单的价格,换个形状回来找你**(这个道理第9章讲报价时会正面展开:为什么砍工缴没有意义)。

本节动作,一句鉴别话术。听到"要加工缴",回:"**加在哪几道工序?各加多少?**"——能逐条报出"檐面线加两行加一毛、帆布上檐加两毛"的,是真账,照付,这钱买的是工人的手感和你的交期;只含糊报个总数"加两块"的,才有谈的空间。顺带把红线也记下:常规六片绣花帽工缴落在¥2.5-4,复杂款上浮两三成到五成都正常,**报到翻倍的,要么款真的邪门,要么在拿工缴当利润的马甲**——让他摊开工序表说话,4.4.1那张表就是你的底气。

### 4.4.4 产能估算:用车缝线验算工厂的话

晚上回到镇上的快捷酒店,你摊开笔记本,把白天在车间数的数过了一遍——是时候算一笔从询价那天起就该算的账了:**这家厂的产能,到底装不装得下我的单?工厂说的交期,是排出来的还是顺口答的?**这笔账只需要三个数:几条线、每线日产多少、档期排到哪。

先立公式:**产能=线数×单线日产**。单线日产的口径你已经有了:一条10-20人的车缝线,常规6片绣花帽日产800-1200顶——人少款难取下限,人齐款熟取上限。这家厂8条线,日产六千四到九千六,取中七八千顶,月产按26天算,**20万顶量级**。你的500顶放进去:占月产能的千分之二三,纯机时半条线一个白班——**账面上,你的整张单是这家厂"半天的活"**。第一次算出这个数的时候你愣了一下,随即明白了两件事:为什么中型厂接你的单眼都不眨(对它是插空的调剂,这层关系第6章展开),以及一个更扎眼的矛盾——半天的活,为什么排期表上写着"车缝5-6天"?

这就要引入本章最值钱的一对概念:**占用与历时**。占用,是你的单消耗的产能——半条线一天;历时,是从第一片上线到最后一顶下线的日历天数。两者为什么差出十倍?因为**小单不整线连做**:工厂不会为500顶把一条线停下来完整换款——换款损耗(见4.4.2)吃不消;常见做法是把你的单拆到一条线的部分工位,见缝插针地跟着大单一起流,或者塞进两个大单换款的空档整线快速过一遍。于是你的裁片分几批上线、几批下线,中间还要给水洗外发(见3.3.3)留出分批往返的窗口——历时5-6天,占用只有半天。**看懂"占用≠历时",你就不会再拿"一天就能做完"去跟工厂吵交期,也不会被"要做一周"吓住**——两句都是真话,说的不是同一个数。

然后是这套算法的真正用途:**验算工厂的话**。例一:一家厂拍胸脯"5000顶一周出货"。验算:5000顶÷一周=日产700+,要么一条线独占六天,要么两条线并做三天——旺季哪条线能给你独占?追问一句"哪条线、几号上线",对方报得出,是真排产;报不出,这句承诺就是空气。例二,反向:一家3条线的小厂敢接你2万顶、交期30天。验算:2万÷26天≈日产770,占它全厂产能三成往上,还得雷打不动连做一个月——大概率它要么偷偷外发(风险在哪,第6章讲转厂时你会看到),要么必延。**产能验算的价值,不是算出精确数,是当场识别"物理上不可能"的承诺**——工厂的话可以有水分,乘法没有。

本节动作,把验算收成三问一式,进你的询价SOP。三问:"**几条车缝线?单线日产多少顶?我的单计划哪条线、几号上线?**"一式:**承诺可信度=(线数×日产×距交期天数)÷它嘴里所有在手订单**——你问不全它的在手订单,但只要前三问的答案自相矛盾(线数×日产撑不起它答应你的日期),这家厂的交期就先打七折记账。顺手把今晚的账页撕角贴进笔记本:8条线、日产约8000、你的单占半天——这三个数,是你后面每一次催单、每一次听工厂解释延误时,心里那把不会被带偏的尺。

## 4.5 后整工序

### 4.5.1 定型:帽型是烫出来的

后整区在车缝车间的下游,隔着一排半人高的周转筐。最显眼的是定型工位:四个银亮的铝制头模一字排开,像四颗没有五官的金属人头,底座里蒸汽管嘶嘶作响。工人从筐里抓起一顶刚缝好的帽子——你凑近看才发现,**缝好的帽子其实是塌的**:帽身发软、六片拼缝的棱角僵硬、帽檐平直没有弧度,像一只泄了气的果壳——套上头模,拉下压杆,"呲"的一声蒸汽顶起,几十秒后取下:帽身圆润挺立,帽檐带着弧,棱角服帖——一顶帽子在你眼前"活"了过来。这道工序叫**定型**:借助头型模具、蒸汽湿热和压力,让帽子获得并记住立体形状。你在店里看到的每一顶挺括的帽子,那副精气神都是这里给的——**帽型不是缝出来的,是烫出来的**。

机制回到纤维(第1章的老朋友)。湿热让纤维分子链松动,压力和模具把它们按新形状摆好,冷却后锁定——这就是"记形"。不同纤维记性不同:涤纶是热塑性纤维,定型效果最持久,水洗都不走样(1.1.2讲过它这张牌);棉的记形靠蒸汽加上前幅衬布、檐芯(见2.1.1、2.3.2)这些"骨架"帮忙,会随佩戴慢慢回软——这不是缺陷,dad hat要的就是这份松弛。所以定型是分轻重的:**结构化棒球帽重定型**,高温长压,配合硬衬,出来像盔;**软顶轻定型**,低压短时,只定帽檐弧度和帽身圆度,保住软塌的慵懒感。参数量级记一下:蒸汽温度110-140℃、每顶30-60秒,一个双模工位一天定两三千顶——定型不是瓶颈,但它有一个流程位置的讲究,正好用你自己的单讲。

R&B是"轻酵素洗+软顶轻定型"的组合,顺序是死的:**先洗,后定型,再装扣**。倒着推就懂——定型完再下水洗,湿热一泡,辛辛苦苦烫出来的形当场洗回原形,等于白定(3.3.3提过做旧款"先洗再定"的顺序,机制在这里);古铜滑扣不耐洗水机的磕碰(3.3.3的另一条行规),所以车缝时后弧留着不装扣,整帽洗完、定完型,最后手工装扣收尾。你的生产通知单工艺栏那行"轻酵素洗、洗后装扣"(4.1.1你见过),就是把这串顺序压缩成的六个字。**工艺顺序是会互相咬合的:一道洗水,改写了定型和装扣两道工序的位置**——这也是为什么规格表(见2.5.2)上的工艺栏不能只写"有什么",还要写清"先后"。

事故案例给一个便宜又高发的:一批做旧款,工厂图省事按常规流程先定型后水洗,到货帽帽身皱塌、檐弧走直,客户认定质量事故。返工要整批重新定型,来回运费加工时,利润洗没了——病根只是流程顺序四个字没写进订单。另一个场景你未来做客服用得上:客户收到的帽子被快递压扁了,十有八九不是坏了——**家用挂烫机或水壶蒸汽熏三十秒,手托内衬整理帽型,能恢复大半**,这条小知识写进你的售后话术,能压掉一半"变形"投诉。本节动作,两句进订单:"**工艺顺序:水洗→定型→装扣;弯檐弧度以确认样为准**(拍好确认样的正侧照存档,后整照着弯)。"檐弧没有国际标准,你的标准就是那两张照片。

### 4.5.2 剪线与修整:管理水平的探针

定型工位再往里,是后整区真正的人海:两条长桌,十几个工人,每人面前一筐帽子、一把纱剪。动作单调得近乎催眠——抓起一顶,翻过来,里外扫一眼,剪刀尖"嚓嚓"几下,翻回去,再扫一眼,丢进合格筐;偶尔一顶被丢进旁边的小筐,那是发现了剪线救不了的问题,退回车缝返修。这道工序叫**剪线**(带着检查和整理,合称修整):把车缝留下的线头逐一剪净,顺手完成一次全数外观检查。

线头从哪来?平车每道缝的起针收针都要留头,一顶帽子十来道工序、二三十个起止点,下线时带着几十个线头是物理必然,不是谁偷懒。数字量级:熟手修一顶40-60秒,时产六七十顶;一条日产千顶的车缝线,后面要跟十来个修整工——**后整是车间里仅次于车缝的人力大户**,只是它安静,新手参观时常常一眼扫过。这笔人力是省不掉的:自动剪线的电脑平车能减掉一部分线头,但机器贵,中型厂只配在部分工位;最后一道,总要人手过。

现在讲标题里那个词——**探针**。剪线这道工序有个独一无二的性质:**零技术门槛,纯管理成色**。车缝好不好还能归因于工人手艺、面料难做;线头剪没剪干净,只取决于三件事:厂里有没有这道工序的完整工价、有没有人抽查、返修追不追责到工位(流转卡上的签名格,在这里第二次显出用处——见4.1.1)。所以一顶帽子翻开来的线头数量,是你能拿到的最便宜的"工厂管理水平化验单":**连一剪刀的事都管不住的厂,那些你看不见的环节——扎号、首件、中查——大概率同样是松的**;反过来,线头干净的厂,别的差也差不到哪去。这就是为什么老买手验货,第一个动作往往不是量尺寸,而是翻开帽子看内里。

别小看这几根线的杀伤力。在验货标准里,线头只算轻微疵点(严重不到哪去,第11章AQL抽样会给它定位);但在客户体验里,它是头号刺客——终端买家不懂克重不懂密度,**一顶帽子翻开三根线头,他对整批货的信任就没了**。做电商的更要命:海外买家的差评里,"loose threads"是帽类目出现频率最高的词组之一,一条带图差评拉低的转化率,值多少顶帽子的利润,第22章你可以自己算。事故样本快进版:一个卖家500顶货急着上架,免了验货直接入仓,首月差评七条里五条是线头,评分从4.6掉到4.1,广告费白烧——返工?货在海外仓,拆袋剪线重包,每顶成本比国内多十倍。

本节动作,两个零成本检查。验厂时:走到后整区,数修整工位的数量(和车缝线数对不对得上),再看一眼桌下的垃圾筐——**满筐线头是这个厂在认真干活的证据**,筐是空的、工位是摆设,扭头就走。验货时:随机抽十顶,翻过来数线头,超过3毫米的算一处——**平均每顶两处以上,把这个数写进验货报告,并要求整批复剪后再出货**。剪线返工是所有返工里最便宜的一种,别客气;真正贵的,是它探出来的那个管理问题。

### 4.5.3 整烫与除污:损耗的最后归宿

后整区的最后两站挨在一起:蒸汽烫台白雾缭绕,工人给每顶帽子整体过一遍蒸汽——压皱的压痕舒展开,磨毛的绒面立起来,这道叫**整烫**,是出货前最后一次"美容";旁边的除污台味道刺鼻,工人举着一把连着气泵的**除污枪**,对着帽身上的可疑印记喷射雾状药水再吹干——车缝机油印、划粉痕、流转途中蹭上的脏手印,能打掉的当场打掉。打不掉的呢?丢进桌角那个筐。你翻了翻那个筐:一顶油印洇进了布纹、一顶洗花了(酵素洗的随机性,3.3.3警告过)、一顶檐歪得肉眼可见、还有一顶绣花断线痕——它们的共同名字,叫**损耗**;这个筐,就是损耗的最后归宿。

现在可以把4.1.1埋的那笔总账合上了。投产520、交货500,中间那20顶的去向,一路数过来:验布让掉的布头折两三顶(4.2.1);裁剪疵片和试裁损两三顶(4.2.4);绣花废片三四顶(4.3.1算过为什么便宜);车缝缝坏退修不回来的三四顶;水洗洗花变形五六顶——做旧款独有,1-2%的口径3.3.3给过;最后是除污台救不回来的两三顶。合计约15-18顶,占投产的3-4%——**"损耗率2-3%"的全书口径说的是常规干款,带水洗的款要往4%备**,这正是你的单按520投产的原因。注意这句话的立场:**损耗是预算,不是事故**——它在报价那天就被计入了成本(你那¥17.5里有一笔¥0.4的损耗项,第9章拆报价时会重逢,顺带教你2%和5%之间藏着什么)。事故是超预算:损耗奔着8%、10%去,那不叫损耗,叫某个工序在漏。

除污台是这本账上唯一的"回血"环节:一枪药水几分钱,救回一顶就是十几块——一个熟练除污工一年从报废边缘拉回几千顶,顶得上自己几个月工资。所以别嫌那味道刺鼻,**除污是损耗漏斗上最后一道滤网**。而漏斗底下还剩一个新手必踩的问题,你当场问了小周:"这筐次品,最后去哪?"小周的回答值得你原样记下:"挑出来的次品,以前是论斤称给镇上收尾货的,现在带客户logo的不敢了——**你的麦穗要是出现在早市地摊上,Mike第一个找的是你**。"这就是**带标次品处理**的行规问题:次品上绣着客户的商标,随意流出就是品牌事故;正规做法是**剪除logo部位后作废品处理,或整体销毁,处理方式听客户的**。品牌客户的订单合同里这一条是标配,你的PI里同样该有。

多说一嘴溢短装:520投产、损耗若只有12顶,合格品508——多出的8顶好帽怎么办?行规叫**溢装**:多数外贸合同写"数量允差±3%,按实际数量结算";你和Mike的约定是整数500,那多出的几顶,建议你按单价从工厂买走自留——它们是未来的补发件、客户样品、内容素材(第23章拍视频用得上),比留在工厂仓库强。本节动作,两句进合同、一句进嘴:合同一,"**带客户logo的次品不得流通,须剪除logo部位后处理**";合同二,"**数量允差与结算方式:±3%按实结算**(或写死整数,溢装归买方选购)";嘴上一句,下单时问:"**这单投产多少?按几个点备的损耗?**"——投产数低于订单数102%的,交货短数几乎是注定的,这句话帮你在开裁前就把短装掐死。

## 4.6 包装工序

### 4.6.1 单塑袋与窒息警告语

后整区尽头是两张拼起来的长条桌,六个人围坐,桌上堆着刚整烫完的帽子和一沓沓透明塑料袋。动作是流水的:左手抓帽、右手抖开袋口、帽檐先进、帽身一送、袋口的胶条一按——"啪"的一声轻响,一顶帽子就有了自己的壳。一个熟练工一分钟能装十几顶。你搬了张凳子坐在旁边看了半小时——桌上这批不是你的货(你的前幅还在邻镇排队),是另一个先出的单;但你必须现在就把包装规格定死,因为塑料袋和纸箱是并行项(见4.1.2),得提前十天下单,等到帽子做完再想,就是"货等箱"。

先认识这个袋子。行内直接说英文:**polybag**,中文叫单塑袋或独立袋,指的是单顶帽子独立包装用的塑料袋。材质常见两种:PE袋乳白微软、手感塌;OPP袋透明挺括、印字清楚——帽子九成用OPP。厚度按"丝"计,**1丝=0.01mm**,通用2.5-4丝:低于2.5丝装帽檐一撑就裂,高于4丝纯属浪费。dad hat 的常用规格是28×32cm加3cm自封贴条边,单价¥0.05-0.12,500顶合起来不到¥50——整单成本里最不起眼的一笔,却是客户拆包裹时第一眼看到的东西。为什么非得一顶一袋?四条机制:一防蹭脏,后整到装箱之间还有无数只手;二防潮,海运集装箱昼夜温差大、内壁会结露,棉帽吸湿自重8-10%(见1.3.2),整箱受潮就是霉点;三是零售场景,Mike从箱里拿出来直接摆吧台,袋子是"新品未拆"的信号;四是验货,抽检开袋、复封可见,谁动过一目了然。

真正要你上心的是袋子上那行小字。**窒息警告语**(suffocation warning):塑料袋对婴幼儿有窒息风险,北美多个州和加拿大的消费品安全规则要求达到一定尺寸的塑料包装袋印上警示,亚马逊等平台把它写进了入仓强制标准。触发阈值记住两个:**袋口开口宽度或周长达到5英寸(约12.7cm)以上**,以及**厚度低于1.5mil(约3.8丝)**——帽子袋两条全占,所以这行字对你是必印项。标准英文文本行业通用一句:"WARNING: To avoid danger of suffocation, keep this plastic bag away from babies and children. Do not use this bag in cribs, beds, carriages or playpens. This bag is not a toy."另一条合规路线是**排气孔**:孔径≥6mm、孔距不超过15cm、开孔面积占袋面1%以上——工厂现货袋两样都有,你只要说清楚要哪一种。

对话样本。你问小周:"袋子上印什么?"小周答得很顺:"默认那句英文警告,厂里的现货袋都带,不加钱。"你又追一句:"加拿大要不要法文?"小周愣了两秒:"没客人问过这个。"当晚你把问题发给Mike,他回得很快:"我们自己吧台卖,不上连锁货架,英文就够。不过——你居然会问这个。"这句"你居然会问这个",是这一单里最便宜也最值钱的一次专业展示:法语标识在加拿大属于零售上架层面的要求(魁北克尤其严),客户自销用不上,但你问了,他就知道你懂他那边的规矩。这类小分怎么攒成翻单和转介绍,第24章会正面讲。

本节动作,三行字进PI的包装条款,一句话进你的问厂清单。条款:"**每顶独立OPP袋,厚度≥3丝,袋口自封贴条**";"**袋面印英文窒息警告语(或按买方指定文本/语种)**";"**袋内不得放干燥剂以外的任何未确认物料**"。问厂那句:"**塑袋是现货通用袋还是定制印刷袋?定制的版费多少、起订多少、几天到厂?**"——通用袋随时有;定制印刷袋起订常在5000-10000个、版费¥100-200、交期7-10天,500顶的单去定制印刷袋,是把¥50的东西做成¥500的浪漫,除非客户要,否则别碰。

### 4.6.2 装箱:嵌套的学问与装箱数

装袋工位往前一步是装箱台。你原以为装箱就是把帽子往箱里码,直到看见一个女工的手法:她把八顶装好袋的帽子一顶扣一顶,帽檐全部朝同一个方向,叠成一摞——像一叠没柄的勺子——然后整摞横躺着推进纸箱。这个动作叫**嵌套**(nesting):利用帽子上凸下空的形状,让后一顶的帽身钻进前一顶的空腔,把空气挤出去。八顶嵌套成一摞,高度只有二十几厘米;同样八顶各自摊平,能占满半个箱底。

带你算这笔账,你会立刻明白它为什么值钱。工厂用的标准箱是**60×40×40cm**,容积0.096CBM(立方米),嵌套装法**100顶一箱**;你的500顶正好5箱,合0.48CBM——按半个立方计。反过来,不嵌套散装,同样的箱子只塞得下四五十顶,500顶就要11箱、1.06CBM。海派专线(见7章那条到门通道)按体积计费,你这单的运费是¥1,400、折合¥2.8/顶;体积翻一倍,运费就奔着¥2,800去,每顶多吃¥2.8——**一个叠帽子的手法,值这单毛利的百分之十**。这也是为什么外贸报价单上"装箱数"是必填项:它不是仓库的事,是运费的事。

嵌套也有边界,越界就毁型。软顶dad hat 的帽身没有硬衬(见2.1.1),压得太狠会留下折痕,定型好的圆润(见4.5.1)白做;帽檐同向叠可以互相托住,反向叠就会彼此顶弯。所以行规是**一摞6-12顶**:厚料、硬衬款6-8顶封顶,薄款可以到12顶;每摞用一条皮筋或一张腰封轻箍,整摞横放、不竖压;箱内塞满、不留晃动空间,但也不许硬塞——**箱子装得响不算紧,装得不晃才算紧**。装箱数还要迁就毛重:一顶dad hat 约105-115克,100顶11-12公斤,加纸箱1.3公斤,毛重12.5公斤上下,净重11公斤。**单箱毛重的行业默认上限是15-20公斤**,原因很实在:港口和海外仓是人搬,超过20公斤搬运工会摔,快递渠道还要加计重费;所以你会看到"100顶/箱"这个数在薄款上会变成150顶,在羊毛beanie上会掉到80顶——**装箱数是被体积和毛重两头夹出来的,不是拍脑袋定的**。还有两样小东西值得一提:精品款会在每顶帽冠里塞一团薄棉纸撑形,一顶多花两三分钱,换来开箱时的挺括;走海运的棉帽,每箱丢一两包干燥剂(一包几分钱)能挡掉大半的返潮霉点——这两笔钱加起来不到五毛,却直接决定客户开箱那一眼的印象。

事故案例,数字齐全。一家贸易公司做1,150顶,按100顶/箱算了11箱,装到最后一箱只剩50顶,包装组顺手把它填成了整箱的模样,装箱单(PL,第16章细讲)照抄"11箱×100顶"。货到客户仓库,清点差50顶,客户先按短装索赔、再按"文件不实"要求全批复检,一来一回耗了九天,验货合格才放行——货一顶没少,少的是一行字。所以**尾箱必须单列**:PL上写"C/NO.1-10 @100PCS,C/NO.11 @50PCS",箱唛(4.6.3)上尾箱的数量也要单独改。本节动作两条。一,PI包装条款写死:"**8顶/摞嵌套,100顶/箱,60×40×40cm;尾箱数量单列并在箱唛注明**"。二,装箱前留痕——这是本章"四留痕点"的最后一点:**要工厂在封箱前拍两张照,一张俯拍箱内码放层次、一张拍箱唛与箱内数量对照**;这两张照片将来既是运输破损索赔的证据,也是你和客户对数量口径的凭据。

### 4.6.3 外箱与箱唛(shipping mark)

装箱台旁边码着一垛未成型的纸箱板,你抽出一张对着灯看断面:中间夹着两层波浪芯,这是**五层瓦楞**(双瓦楞);另一垛薄的只有一层波浪芯,是三层瓦楞。区别就在那层芯:五层箱抗压、耐堆码、能扛海运集装箱里六七层货的重量,60×40×40cm一只约¥8-11;三层箱轻、软、便宜一半,适合空运或短途快递。你的500顶走海运,五箱纸箱合计五十来块钱——**这五十块是全单最不值得省的五十块**:箱子塌了,里面所有工序都白做。判断标准给你一个手上的:**大人站上去箱子不塌,是五层;一脚踩瘪,是三层**。

纸箱外面那一组字叫**箱唛**(shipping mark):印或喷在外箱上、供承运人、海关和收货人识别货物的标识信息。分**正唛**(主唛,印在箱子大面,内容完整)和**侧唛**(边唛,印在窄面,通常只留品名、箱号、数量)。标准内容长这样:

```
        RIDGE & BARREL
   P/O NO. : RB-2507
   ITEM    : 6-PANEL DAD HAT / NAVY
   STYLE   : RB-DH-01
   QTY     : 100 PCS
   C/NO.   : 1 - 5
   N.W.    : 11.0 KGS
   G.W.    : 12.5 KGS
   MEAS.   : 60 x 40 x 40 CM
   MADE IN CHINA
```

逐行看它的用处:客户名和P/O号是给收货仓库分货用的,写错了货进不了对的货位;品名和款号是给海关看的,和报关单的品名必须对得上;C/NO.(箱号)是"第几箱/共几箱",清点和索赔全靠它;N.W./G.W.(净重/毛重)和MEAS.(尺寸)决定运费和舱位;最后一行**MADE IN CHINA是强制项**,原产地标注缺失是清关被扣的经典原因之一——同样的道理,帽子里面的洗水标(见2.3.4)上也必须有原产国。这里给你一条本章最重要的纪律,它会在第18章救你一次:**箱唛、装箱单(PL)、商业发票(CI)三者的件数、数量、毛重、尺寸必须一模一样**,一个数对不上,海关就有理由开箱查验;查验一次三五天,费用还得你出。

还有两类信息容易被新手漏掉。一类是**运输标志**:朝上箭头、"怕湿"、"勿压"这些图形符号,帽子这类怕压变形的货,箱面加一个"堆码层数不超过X层"的提示是有用的,装卸工真会看。另一类是**中性包装**的口径:有些客户不许箱面出现工厂名、也不许出现自己的品牌名(转运或代发场景),这叫中性箱;还有些客户反过来要求印上他的LOGO当门面。这一条必须在下单时问死,因为它决定纸箱是买通用现货还是要制版印刷,交期差着七到十天。

落地方式有三种:**喷唛**(镂空模板加喷枪,几块钱一套模板,最便宜,但油墨会蹭、深色箱不清楚)、**贴唛**(A5不干胶标签打印后贴,最灵活,改一个字重打即可,主流做法)、**印刷箱**(制版直接印在纸箱上,起订500-1000个、版费两三百,量大才划算)。500顶的单,贴唛是唯一理性选择。事故也出在这儿:一家工厂沿用了同客户上一单的箱唛模板,P/O号没改,货到仓库被系统判为"重复到货"退回码头,滞港三天、产生港杂费两千多。本节动作两条:**开裁那一周就要工厂把箱唛稿发给你**(一张图或一段文字都行),你逐字核对客户名、P/O号、款号、原产地,核完签字回传存档;**封箱后要一张箱唛照片**,和你手上的稿子比对——两分钟的事,挡掉的是三天滞港。

### 4.6.4 电商包装:FBA贴标要求

晚上回酒店,你在笔记本上给包装那一页画了个分叉:Mike这单是"自提到门、吧台自销",包装按上面三节做就够了;但你迟早会碰到另一种客户——他要的不是"发到我仓库",而是"直接发进亚马逊"。这条路叫**FBA**(见0.2,亚马逊仓配;完整玩法第22章讲),它的包装规则和你今天看的这一套不是一回事,提前知道,能让你在报价那一刻就不把自己坑进去。

核心差别一句话:**平台不认你的箱唛,只认它自己的两个条码**。第一个是商品级的 **FNSKU 标签**——亚马逊给每个SKU生成的唯一条码,**每一件商品的最外层包装上必须贴一张,且商品原有的其他条码必须被完全遮盖**;第二个是箱级的 shipment label(货件标签),每箱两张,由卖家在后台生成货件计划后打印。这意味着一件事,时间上很致命:**FNSKU必须在装箱之前就存在**,而它要等客户先建好listing。客户listing还没建、条码还没生成,工厂就只能先不贴——货到海外仓再拆箱补贴,行价$0.3-0.55/件、耗时三到五天。500顶的补贴费用就是$150-275,合¥1,000-2,000,而在工厂贴,行价只有**¥0.2-0.5/顶,500顶合¥100-250**——同一件事,时间点差几天,成本差十倍。

其余硬性要求,逐条都能在前面三节找到对应:单件必须**透明袋**包装,袋口开口≥5英寸的**必须印窒息警告语**(4.6.1那句英文就是为它准备的),标签要贴在袋子平整面、不得跨边角折弯、不得贴在帽子的弧面上;外箱**单边不得超过63.5cm(25英寸)**——你那只60×40×40的箱子刚好合规,换成65cm的长箱就要被罚;**单箱毛重不得超过22.7公斤(50磅)**,超过要贴"Team Lift"提示;箱内不得混装不同FNSKU(除非申请混装);填充物不得使用碎纸屑、泡沫花生。任何一条不合规,轻则收仓延迟,重则整批退运,而退运的运费和处置费全部由你承担——**FBA的规则不讲理由,只讲合不合**。

再补一条只有做过帽子的人才会提醒你的事:**亚马逊的仓库不管你的帽型**。货进仓之后,分拣、上架、拣选、二次装箱全部由机器和小时工完成,你那顶靠蒸汽定型(见4.5.1)撑起来的帽冠,可能被压在货位最底层放三个月。所以走FBA的帽子,包装要往"抗压"的方向调:帽冠里塞棉纸团撑形、嵌套的摞数从8顶降到6顶、袋子选3.5丝以上不易破的规格;有些卖家干脆在每顶帽子外面再加一个薄纸盒——单顶成本涨¥0.8-1.5,换来的是差评率下降。这笔账怎么算,取决于你的客单价:三十加元卖一顶帽子,一个"到货压扁了"的差评造成的损失,远不止一块钱。

本节动作,一句问客户的话,下单前必问:"**这批货最终去哪:你自提、进你的仓库、还是直发亚马逊FBA?**"三个答案对应三套包装规格和三种成本,写进PI的包装条款里。补充一条时间纪律:**若走FBA,FNSKU和货件标签必须在开裁前提供**;客户提供不了,就在PI里写明"未按期提供标签,视为客户接受海外仓补贴费用及由此产生的延迟"。这句话不是刁难客户,是把一件必然发生的事提前定价——你会发现,你敢在报价阶段问这些问题,客户对你的信任反而升一格。

## 4.7 时间账

### 4.7.1 各工序标准耗时表

第五天傍晚,车间的机器声一层层落下去。你翻回笔记本第一页,把这几天见过的每道工序按顺序抄成一列,在每一道后面填两个数:一个是真正干活的时间,一个是它在日历上吃掉的天数。填到一半你就笑了——这两列数根本不在一个量级上。这张表就是本章所有观察的收口,也是你今后每一次听工厂报交期时,心里那把可以当场对表的尺:

| 工序 | 500顶纯机时/工时 | 计划历时 | 时间主要花在哪 |
|---|---|---|---|
| 验布(4.2.1) | 约2小时 | 0.5天 | 排队等验布机 |
| 松布(4.2.2) | 0 | 1天 | 静置24小时,物理不可压缩 |
| 排料+拉布+裁剪+扎号(4.2.3-4.2.5) | 3-4小时 | 1天 | 唛架确认、拉布静置、分捆 |
| 绣花(外发,4.3.4) | 1个台班(约8小时机时) | 4天 | **往返运输+排队,排队占2天** |
| 车缝(4.4) | 半条线×1天(占用) | 5-6天 | 插工位分批做、等前道回料 |
| 水洗(外发,见3.3.3) | 约1天 | 2-3天 | 分批送洗、烘干、回厂;与车缝尾段交叠 |
| 定型+剪线+整烫(4.5) | 1.5天 | 1.5天 | 人海工序,基本等于工时 |
| 包装(4.6) | 0.5天 | 1天 | 等纸箱、等箱唛确认 |
| **合计** | **约4个工作日** | **约15天** | **四分之三的时间在等** |

带你把这张表读透。左右两列的比值,就是4.4.4那对概念的量化版:**占用与历时**(见4.4.4)。你的500顶,把所有机器真正转起来的时间加在一起不到4个工作日,而它在工厂里从开裁到装箱要待15天——**机时只占历时的四分之一,另外四分之三是排队、静置、往返和等前道**。这个比值不是这家厂效率低,是小单的宿命:每道工序你都只占人家半天到一天,而每道工序的档期都是按周排的,你在每一道上都要等一次"轮到我"。量越小,这个比值越难看;一万顶的单反而好看,因为它能把某条线占满,等的时间被摊薄了。

于是有了三个可以当场用的阈值。第一,**常规6片绣花帽的生产周期是12-18天**(见本书数字口径),你这单落在15天,正常;报到10天以内的,要么用的是现货白帽走成品绣(见4.3.3),要么在骗你,要么它准备牺牲某一道——多半是牺牲松布或后整。第二,**任何一道外发工序,历时不得少于3天**;工厂的计划表上如果给绣花只留2天,而绣花是外发的,这张表从写下来那一刻就注定要延——因为它没给排队留位置。第三,**定型、剪线、整烫这三道人海工序的历时如果被压到1天以内,质量必掉**:剪线是全数外观检查(见4.5.2),压缩它等于取消它。

本节动作,一句话,开产前发给跟单员:"**请把生产计划表发我:每道工序的计划起止日,外发工序单列。**"拿到之后,和上面这张表逐行对——**你不是在看它写了什么,你是在找它没给谁留时间**。哪一行的历时明显短于标准值,那一行就是这单未来延误的位置;现在指出来,工厂还能改排产,等到那一天再喊,就只剩道歉。而这张15天的表,只回答了"生产要多久";它回答不了你真正关心的那个问题——为什么工厂给Mike报的交期是35天?下一节把这中间的20天一天一天摊开给你看。

### 4.7.2 交期构成:生产15天为什么交期35天,交期起算条款

你把上一节那张表拍给了老纪——那位报价时和你磨了三天的业务员(第9章你会正式认识他)——附了一句半开玩笑的话:"照这张表,我这单十五天就该出货,你当初为什么给我报三十五天?"老纪的回复只有两句:"生产十五天,交期三十五天,两句都是真话。你把它们当成一个词,才会觉得我在骗你。"这两句话值得你记一辈子,因为它是新手和客户吵架、和工厂吵架的头号来源:**生产周期和交货期,是两个不同的词**。**生产周期**指的是从开裁到包装完成、货在车间里的那段时间;**交货期**(lead time)指的是从合同约定的起算日算起,到货物备妥可交付的全部日历天数。合同上写的、客户记住的、你要负责的,永远是后一个。

把这35天摊开,一天一天都有名字:

```
签PI/收定金
   │
   ├─→ 面辅料采购 ── 现货面料 3-5天 ┐
   │                定制辅料(电镀滑扣)10-15天 ┤
   │                织唛/洗水标 7-10天         │
   │                                           ├─→ 物料齐 ─┐
   └─→ 产前样制作 3-5天 → 国际快递 3-5天       │           │
                        → 客户确认 1-5天 ──────┘           │
                                                            ↓
                                              排产等待 3-7天(等线空)
                                                            ↓
                                              生产 15天(4.7.1那张表)
                                                            ↓
                                              验货 2-3天(+返工则再加)
                                                            ↓
                                              订舱/等船期 3-7天 → 开船
   ────────────────────────────────────────────────────────────
   合计 30-40天 ← 报价单上那个"交期35天"就是这么来的
```

现在带着你算R&B这一单,数字全部来自你自己的记录。你和工厂签PI是在一天,PI上写的出货日在**22天之后**。22天里装了什么?付定金到工厂财务确认到账,1-2天;备料5-6天;开裁到包装完,15天——**1+6+15=22,一天不多,一天不少**。这就是所谓"账面刚刚好":整张计划表上没有一天是留给意外的。更要命的是,你其实还欠着运气一笔债:古铜色滑扣(见2.4.2)是定制电镀件,行业常规是**10-15天**(见8.4.1),而你这批520套四五天就到了仓库——因为工厂手上有现成的模具,采购又在打样阶段就提前压了单。如果这批扣按常规走,你的开裁日就得整整往后推一周,PI上那个22天从签字那一刻就是空头支票。**这一单的交期没崩在备料上,是运气,不是流程**。

那么工厂对外报35天,是不是在给自己留水分?是,而且这水分该留。因为上面那条链里,有三段完全不由工厂控制:**产前样确认的往返**(样品飞到温哥华、Mike什么时候有空看、看完提不提意见)、**定制辅料的交期**、**订舱等船期**。这三段任何一段抖一下,15天的生产就被推走。所以行业里有一条对甲乙双方都公平的写法,叫**交期起算条款**——它规定交期从哪一天开始数,而不是含糊地"从下单起"。标准中文表述抄给你:"**交货期自卖方收到买方定金及买方书面确认产前样(PP样)之次日起算,计XX日历天;因买方确认延迟、变更规格或未按期提供资料所致的时间,交货期相应顺延。**"

现在用这条款回头看你这一单,你会出一身冷汗。你付定金是在签PI后第2天,Mike书面确认产前样(见10.1.1)是在签PI后第**5**天——按起算条款,交期本该从第5天的次日开始数,加上22天,PI上的出货日就该往后挪五天。你后来实际出货,恰恰晚了五天。所以这单的延误里,固然有绣花排队的两天(见4.3.4)和后来验货返工的几天,但**根子上,这五天从签PI那天起就欠着了**——欠在一句没写进合同的条款上。这就是本节要你带走的最后一件东西:**buffer**(缓冲),即你在客户要求的日期和你自己排出的日期之间,主动留出的空白。原则很简单:**对客户承诺的到货日,至少比你算出来的日期提前两周**;两周不是拍脑袋,它正好覆盖"一次产前样返工(7天)+一次外发排队(3天)+一次订舱延误(3天)"。你给Mike的到门日只比他的活动日早了十天——十天,被这五天吃掉了一半,剩下的一半是运气替你补的。本节动作,两条同时做:**PI里写死交期起算条款**(完整中英文版见本章工具三);**对客户报期时,在自己算出的日期上再加两周**,这两周不是你偷的懒,是这一行的天气预报。

### 4.7.3 排产与插单:大客户和人情的特权

第五天下午,你又去看了一次车缝车间门口那块白板。这块板行内有个正式名字:**排产表**——哪张单、上哪条线、占哪几天,全厂未来两三周的生产秩序都写在上面(这块板背后是谁在落笔、他凭什么落笔,第8章会带你站到他旁边,见8.3.1)。板上是一张网格:纵向是八条车缝线,横向是日期,一个格子一天。你在第三行找到了"0712"——你的单号——但位置和你上次看的不一样了:原本写在下周一那一格,现在被擦掉重写,挪到了周三,而周一到周二的两格,填的是另一个单号,后面跟着"2000"。

发生了什么?连锁反应,一环扣一环:你的前幅在邻镇绣花厂被压了两天(见4.3.4),绣花回不来,车缝就没有前幅可上;而**车缝线不会空着等你**——八条线一百多号人,一天空转就是几千块工资和摊销,组长手里那个原本排在你后面的两千顶大单,前幅是自己厂里做好的现成料,于是它被提上来先做。等你的绣花回厂,那条线正做在别人的单中间,你只能排到它后面去。这就是**插单**:把一张单塞进已经排定的档期,顺序被改变、别人的日期被后移。请你把这一幕看清楚——**这次插你的,不是谁的恶意,是物理**:你的料没到,产线不等人。这是插单里最常见、也最难申诉的一种。

另一种插单才是"特权"。行业里真正能靠一句话改动排产表的,只有三种人。第一种是**全年产能占比大的客户**:一家厂一年八成的产量来自三个大客户,他们的单晚一天,损失的是明年的合作,你的单晚一天,损失的是一次道歉——排产的笔在这个算术面前没有第二种落法。第二种是**账期干净、不改单的老客户**:能按期打款、不中途改规格、样品一次过——这种客户带给工厂的是"确定性",而确定性在车间里是硬通货。第三种是**有人情的人**:业务员、厂长、组长,谁欠了谁一个人情,一句话就能把某张单往前挪半天;这套东西怎么运作、你该不该参与、预算的合理边界在哪(提示:一年几百到一千块封顶),第8章会正面讲(见8.6),它比你想的更普通,也比你想的更有限——**人情能挪半天,挪不动三天;能让你插进空档,不能让你顶掉大单**。至于加急费,行价是订单额的5-10%或每顶加¥0.5-1;你这单500顶,顶格也就¥500,而绣花厂那边要为你打乱一个两万片的大单——**小单的加急费,数额小到人家看不上**,这就是小周那句"这点加急费人家看不上"背后的全部算术。

那你该怎么做?三件事,分三个时点。**下单时争取排期承诺**:在PI里除了出货日,再加一行"**计划上线日**"——"卖方应于___日前将本单排入车缝生产,并于开裁后___日内完成绣花";写不写得进去,取决于你谈的时候有没有提,但**提出来这个要求本身,就把你从"随便排"的那一类客户里择出去了**。**被压时有效催**:别问"我的货怎么样了",问4.1.2那两句——"**我的单排在哪条线?几号上线?**"——再加一句"**能不能拍一张排产表给我看**"(其他客户信息可以遮掉)。工厂肯拍,说明你的单真在板上;支支吾吾,说明还没排。**该认的时候认**:你的500顶在一个八条线、日产八千顶的厂里,占它一天产能的百分之六,这个体量没有任何插单的筹码,硬争只会消耗掉小周对你的耐心。认,不等于躺平,而是把认变成三个动作:一是让工厂把你的单**拆到空工位插着做**(见4.4.4),抢回一到两天;二是要一个**书面的新日期**,把口头的"很快"变成可追责的一行字;三是**第一时间同步客户**——延期不可怕,让客户从别处知道延期才可怕(第15章讲这封邮件怎么写)。

最后一句是关于将来的。今天挪你的那支笔,明天也能为你挪:**稳定翻单、按期付款、不中途改规格、样品一次确认——这四件事攒够了,你就是下一个能插单的人**。这不是鸡汤,是排产表上的算术:工厂给谁优先,取决于谁让它的产能最不容易空转。你现在没有筹码,那就先攒;而在攒够之前,你手里唯一的武器是提前量——**别人的特权是插队,你的特权是早到**。这也是上一节那两周buffer(见4.7.2)存在的全部理由。

**工具二:四留痕点清单**——生产中必须拿到影像的四个节点。共同原则:**留痕要在事情发生的当下,事后补拍的照片没有证据价值**;人不在现场,这四张就是你的眼睛。

| 节点 | 拍什么 | 为什么是这一刻 |
|---|---|---|
| ① 裁片扎号后 | 挂着流转卡的一捆裁片:卡上单号/部位/层号段/片数看得清,外加三片叠齐转边的十秒视频 | 这是数量与颜色的**唯一起点**;扎号一乱,后面色差追不回来(4.2.4/4.2.5) |

| ③ 车缝首件 | 第一顶完整成品:正面、内里、帽檐侧面三张,外加与确认样并排一张 | 工序、尺寸、辅料装配的总检;之后就是流水线复制,错一件等于错一批(4.4.1) |
| ④ 装箱封箱前 | 一张俯拍箱内嵌套层次,一张箱唛与箱内数量对照 | 数量、包装、箱唛三件事的最后一次可纠错时刻;也是运输破损索赔的证据(4.6.2/4.6.3) |

## 5.1 市场规模与增速

### 5.1.1 百亿美元级、年增3-4%:成熟市场的含义

深夜的酒店房间里,你把"global headwear market size"敲进搜索框,弹出来七八份行业报告的摘要,数字打着架:有说一百多亿美元的,有说两百亿的。别慌,先学会读这种数字——口径不同:有的只算棒球帽类,有的把毛线帽、草帽、礼帽全算上;有的按零售价统计,有的按出厂价,两者差着好几倍(那条从¥15到$29.99的链,0.1里你已经见过一眼,第7章会逐层解剖)。但所有报告在两件事上高度一致:量级是**百亿美元级**,增速是**每年3-4%**。这两个数,比任何一份报告的精确数字都值钱,因为它们定义了你要进的这个行业的性格。

先讲3-4%意味着什么。给你一个速算工具:**72法则**——用72除以年增速,就是市场翻一倍所需的年数。72÷3.5≈20,这个市场要**二十年**才能长大一倍。对比你熟悉的风口叙事:一个年增50%的赛道,一年半就翻倍,蛋糕膨胀得比谁都快,人人有肉吃,犯了错也会被增长原谅。帽子不是。3-4%大致就是全球人口增长加通胀的速度——蛋糕基本不变大,**你多卖的每一顶,几乎都是别人少卖的一顶**。这就是"成熟市场"四个字的真实含义:它不奖励故事,只奖励效率;你做的每个计划,都该把"行业替我增长"这一项填零。

那这3-4%又是从哪来的?拆成三股。第一股,**替换需求**,这是基本盘:帽子是消耗品,戴两三年就褪色、变形、积汗渍,存量戴帽人群定期换新——只要人类还戴帽子,这股需求就不清零,这也是0.1说"很难血本无归"的底层原因。第二股,人口与渗透:全球人口每年多几千万,新兴市场的消费升级再贡献一点。第三股,也是唯一有点新意的一股:**场景细分**——防晒经济把渔夫帽卖给了从不戴帽子的人,户外风潮抬了五片帽,社群周边文化让每家精酿酒厂、每个跑团都想要自己的帽子。总盘子不动,但盘子内部的结构一直在动,新人的机会全藏在第三股里。

再讲"百亿美元级"意味着什么。带你算一笔:按零售口径一两百亿美元、平均一顶零售几美元到十几美元折算,全球一年卖出的帽子在**二三十亿顶**这个量级。拿主线当尺子:Mike的500顶,占全球年销量的大约**五百万分之一**。这个比例请你记住,它治两种病:一治贪心——别做"占领1%市场"的PPT梦,1%就是两千多万顶,是一家巨型工厂的年产量;二治焦虑——市场永远装得下你,**你的问题从来不是需求存不存在,而是需求怎么找到你**(第五部整部都在回答这件事)。

你把查到的数字发给一个做投资的大学同学,他秒回:"年增3%?这行没有beta,劝你别进。"你想了想白天车间里那八条车缝线——这家厂开了十几年,墙上的老照片里机器都换了三代——回了他一句:"风口的钱是趋势给的,趋势走了钱也走;这行的钱是手艺给的,手艺跟人走。"他没再回。两种逻辑没有对错,但你得知道自己进的是哪种场子。

本节动作,三条判断规则写进你的笔记:①凡是把帽子说成"风口""蓝海""爆发前夜"的文章、课程、招商广告,直接关掉——不是帽子变了,是有人想赚你的入行钱;②做任何生意计划,市场增速按零计,增长只能来自你从别人手里把单抢过来的具体动作;③反过来,"行业不行了"的哀嚎也不必理会——替换需求在,人头在,帽子就在。成熟市场淘汰的从来不是行业,是懒人。

### 5.1.2 帽子消费的三驱动:功能/时尚/身份归属

第二天上午你又溜回车间,在成品区看到并排码着的三批货,像是有人故意摆好给你上课:左边一垛素色米白渔夫帽,发往日本一家连锁超市,吊牌上印着防晒指数;中间一批水洗做旧的五片帽,发美国一个潮牌,款式怪得你看不懂;右边正在装箱的,是绣着某公司logo的藏青棒球帽,一问,人家公司周年庆的伴手礼。同一条流水线,三批货,三种完全不同的买帽理由——这就是需求侧的第一张地图:**人为什么买帽子,只有三个驱动**。

**驱动一:功能。**遮阳、保暖、吸汗、防护——买的是帽子的物理性能。特征三条:价格敏感(性能达标后谁便宜买谁)、款式稳定(渔夫帽十年不变样)、渠道走商超和电商大盘。功能单拼的是成本和量,是大厂的主场。**驱动二:时尚。**帽子作为穿搭的一部分——买的是款式、颜色、当季感。特征:换季快、款式碎、单款生命周期短,拼的是设计和反应速度(为什么这类单往广东跑,6.3会讲)。**驱动三:身份归属。**买的既不是性能也不是款式,是**一句宣言**:我是谁,我属于哪儿。球队帽——全世界戴纽约洋基帽的人,绝大多数没看过一场棒球,他们买的是"纽约"这个符号;品牌帽——logo本身就是产品,帽子只是载体;社群周边——酒厂、咖啡馆、乐队、跑团、教会、公司,每一个有归属感的群体,都需要一个戴在头上的身份标记。帽子是人体最高处的那块广告位,一顶帽子等于向全世界持续广播一件事。

身份归属要单独讲透,因为它是你的主战场,而它的商业特性和前两类完全不同。第一,**价格敏感度低**:载体值多少钱不重要,logo对不对是一切——品质敏感点从面料克重整个转移到绣花上,logo颜色差半档,比布差一个档次更不可接受(事故见3.1.8的线色逻辑,第11章还会撞上)。第二,**订单跟着社群事件走**:周年庆、新店开业、赛季开幕、音乐节——所以死线是硬的,Mike那句"九月中旬周年活动前拿到货"就是典型。第三,**复购是天然的**:社群一年年活下去,周边就要一年年做(第24章的年度merch日历就长在这条性质上)。

带你算一遍三驱动的价格光谱:同样一顶出厂¥16-17的六片帽(见1.2.3的量级),走功能渠道零售$12-15,挂个潮牌logo能卖$25-30,印上球队标、摆进球迷店,$35-45还有人排队。布没变,变的是那顶帽子替买家说了什么话。再算Mike:预算12加元约合¥62,你的出厂价¥17.5——他愿意为"自家logo戴在常客头上"付出厂价三倍多的到手价,而且他从头到尾没问过一句克重。回头重读他那封邮件(0.4):logo绣前面、摸起来厚实、戴旧了好看——**老常客的帽子要像个老常客**,教科书级的身份归属客户。R&B这单,从第一天起就不是卖帽子的生意,是替一家酒厂制作身份标记的生意。

那批公司周年庆帽的下单人,你听跟单的转述过一个细节:对方从头到尾没问过布料一个字,却为logo里一个色号往返确认了四封邮件,最后一封写着"这个蓝必须和我们VI手册完全一致,错了整批不要"。——记住这个人,你未来一半以上的客户都是这个人。

本节动作,一条分类规则:接到任何询盘,先读第一封邮件把客户归进三驱动之一——开口就问"最低多少钱一顶"的,功能采购,谈成本;甩来一堆参考图问"能不能做成这样"的,时尚买手,谈款式和速度;先发logo、先讲自己品牌故事的,身份归属,谈效果和确定性。归错类,后面全盘错位:给身份归属客户降价换低配是自杀,给功能客户讲品牌故事是对牛弹琴。这条规则写进你的询盘处理清单第一行。

## 5.2 供给格局

### 5.2.1 前十厂商份额不足15%:高度分散的解读

查完市场规模那晚,你顺手又搜了一句"帽子行业市场份额排名",然后愣住了:搜手机,前五家吃掉八成以上市场;搜运动鞋,头部两家合计逼近一半;搜帽子——**全球前十大厂商加在一起,份额不足15%**,榜首那家也就个位数。这个行业没有苹果,没有耐克,没有"老大"。0.1里那句"高度分散"你当时扫过去了,现在把它拆开看:一个百亿美元的市场,为什么长不出巨头?

三个根,一个比一个硬。**第一根:工艺门槛低,攒不出技术代差。**开一条车缝线,十几二十个工人、几十万设备就能转起来(见4.4的量级);帽子一百年没有发生过技术革命,没有专利能封锁,没有配方能保密——对比运动鞋,中底科技一代代迭代、一套鞋模几十上百万,后来者追十年都追不平,而帽子领先者手里没有任何别人拿不到的东西。**第二根:款式碎,规模经济的天花板低。**帽型×面料×颜色×工艺×logo,SKU接近无限,单款起量小;更要命的是成本结构——帽子的成本大头是面料和人工,全是可变成本,产量翻倍靠的是多雇人多开线,单顶成本几乎不降。汽车厂产量翻倍成本大降,帽厂翻倍只是变大,不变强——**大厂对小厂没有成本碾压,这是分散最硬的一条物理原因**。第三根:**定制属性强,服务半径有限。**这个行业一半以上的货带定制logo,每一单都要沟通、打样、确认,做的其实是半个服务业;服务是要人对人的,管着五千工人的老板伺候不了五百个各怀心思的小客户——定制单天然往中小厂沉。

带你算一笔验证:前十合计不足15%,平摊下来单家1%出头,榜首撑死3-4%;按出厂口径的市场规模折算,全球最大的帽子制造商,年出厂额也就几亿美元量级——而耐克一家年营收几百亿美元。差两个数量级。这就是为什么你搜"最大的帽子公司",搜出来的名字一个都没听过。

早餐时你把这个发现讲给同住酒店的一位老业务员听——这家快捷酒店里住的一多半是各地来跟单的同行,餐厅就是个小型行业论坛。他做了十二年帽子,闻言笑了:"做帽子的没有老大。你看镇上最大那家厂,老板见了三千顶的客户照样陪笑。前些年还有资本进来,说要收十家厂做整合平台,两年,退了——帽子这行装不下巨头,装得下手艺人。"这句"装不下巨头,装得下手艺人",就是前十不足15%的人话版本。

对你,这个格局改写的是**提问方式**。集中行业里,新人的问题是"怎么面对巨头"——答案通常是没法面对;分散行业里,这个问题根本不存在,没有谁能封路,但也没有谁能带路。你该问的是另一个问题:**在一张没有霸主的草原上,我的那条缝在哪里?**草原的规则不是打败狮子,是找到自己的水源。

本节动作,一个填空题,现在就做:拿张纸写一句话——"我在____这个细分里,服务____这类客户,靠____比别人做得好。"三个空分别对应品类缝隙、客户类型(5.5给你地图)、竞争维度(下一节讲)。填不出来不丢人,这本书读完你会重填三次;但从今天起,这句话就是你在这个行业里的坐标,每次迷路就回来看它。

### 5.2.2 分散对新人的两面性:进得去,没定价权

高兴不过夜。当晚你换了个姿势搜——这回站在Mike的角度,在1688搜"绣花棒球帽 定制",结果数字跳出来:**几千家供应商**,起订量低到50顶,详情页一家比一家专业。你盯着屏幕后背发凉:Mike当初能从市集上撞见你,也能从这几千家里随便挑一家。分散的另一面,当头浇下来了。

把两面摊开说。**正面:进得去。**没有牌照门槛,没有专利封锁,没有渠道垄断,几百块就能开店询价——这个行业对新人的准入成本,低到近乎不设防,0.1说的"缝隙永远存在"就是这个意思。**反面:没定价权。**定价权来自稀缺,而分散的同义词就是不稀缺。你的报价上限,被"客户找到下一家的成本"锁死——那个成本现在是搜索框里敲五个字;你的下限,被"工厂报给下一个贸易商的价"锁死。两头都透明,你被夹在中间,谁也压不了谁,价格趋同是分散行业的宿命。更进一步:平台评分、机器翻译、海关数据(见21.3.1),每一样工具都在继续抹平信息差——**靠"我知道你不知道"赚的钱会越来越薄,利润被一寸寸挤向信息以外的东西**:响应速度、翻译能力(把"厚实"准确译成240g磨毛斜纹的能力,第1章你已经练过)、出了事有人兜底的确定性。一句话,挤向服务和信任。

没定价权的世界里,第一诱惑就是降价,所以这笔账必须现在算死。你报$2.45,对手报$2.33,低5%,跟不跟?算:假设你的毛利15个点——售价100,成本85,赚15;降价5%,售价95,还是那85的成本,只赚10——**降价5%,利润没了三分之一**;想把利润总额补回来,销量要多50%。而你降了,对手也会再降,他的成本结构和你几乎一样,这场比赛没有赢家,只有先失血完的一方。这就是分散行业价格战的数学:**打不赢,也不值得打**。

那客户拿低价压你怎么办?给你一段对照。Mike当初询价时如果来一句(他没有,但你未来的客户一定会):"另一家报$2.20,你能匹配我们就继续谈。"错误接法:咬牙回"我给你$2.18"——你刚教会客户,你的价格是砍出来的,他从此每单都砍。正确接法:"$2.20是个好价格,但我需要确认它和我报的是不是同一顶帽子——麻烦对方把克重、纱支密度、针数发你(见1.1.5、3.1.2)。同规格,我解释我的差价在哪;不同规格,我告诉你差的那部分你在不在乎。"这么回,三成客户会转身走掉——让他走,**靠降价拿来的客户,一定会靠降价失去**,那三成本来就留不住。剩下七成里,你赢得的不是这一单,是"这个人懂行、不慌"的判断。

本节动作,三条竞争纪律写成卡片贴在显示器上:①**价差5%以内,不跟,拆规格**——同规格差5%以内是正常浮动(见1.5.1的验价阈值同款逻辑);②**价差超过15%,更不能跟**——规格必有一处不同,找出来给客户看,这是你专业性的免费广告;③**每一次想降价之前,先问自己:我还有什么可以比别人快、比别人清楚、比别人可靠的地方没做到位?**三个问题都答"做到位了"再谈价格——你会发现永远轮不到谈价格。

## 5.3 三个模式术语

### 5.3.1 OEM/ODM/OBM:定义与毛利风险对比

下午你在工厂样品间等人,顺便把这间屋子看懂了——它其实是一面行业模式的展览墙。左墙挂满出货留样:全是别人的牌子,美国潮牌、日本渔具品牌、欧洲连锁超市的自有标,工厂的名字不在任何一顶上。右墙是另一番景象:几十顶没有logo的帽子,每顶别着型号卡,是厂里版房自己开发的款,等客户来挑中、贴上客户的牌。而墙角,一摞落了灰的纸箱,箱面印着一个你没见过的品牌名——你后来才知道,那是老板前几年自创牌子的遗迹。三面墙,正好是这个行业的三个模式,也是三个必须钉死的术语。

**OEM**(Original Equipment Manufacturer,贴牌代工):客户出设计、出规格,工厂出产能,来图来样照做,赚加工费。左墙全是它。**ODM**(Original Design Manufacturer,设计代工):工厂自己开发款式,客户从目录里挑中、贴自己的牌卖,工厂赚的是"设计+制造"的钱。右墙那几十顶就是ODM目录。**OBM**(Original Brand Manufacturer,自有品牌):自己的牌子、自己定价、自己卖给终端,赚品牌溢价——墙角那摞灰箱子。三个词后面各藏着一套完全不同的赚钱逻辑和送命逻辑,对照表如下(毛利量级与第7章的三个利润档位一一对应,第7章会展开):

| 模式 | 设计谁出 | 品牌谁的 | 客户资产归谁 | 毛利量级 | 主要风险 |
|---|---|---|---|---|---|
| OEM 贴牌代工 | 客户 | 客户 | 无(客户随时换厂) | 5-15% | 被比价、被抽单,旺季吃饱淡季挨饿 |
| ODM 设计代工 | 工厂 | 客户 | 弱(款可被抄) | 15-25% | 开发投入打水漂、爆款被同行抄走 |
| OBM 自有品牌 | 自己 | 自己 | 自己 | 40%以上 | 库存、营销、渠道全自担,死得最快 |

机制一句话讲透:**毛利是给风险开的工资**。越往下走,你替产业链扛的不确定性越多——OEM几乎不赌(单来了才开工),ODM赌开发(开十个款火一个),OBM赌一切(货做出来还没人买单)。老业务员的总结更糙也更准:"OEM赚辛苦钱,ODM赚脑子钱,OBM赚胆子钱。"

墙角那摞箱子的故事,值得你记住。老板前年注册了个牌子,信心满满做了两万顶铺线上,一年卖掉六千,剩下一万四千顶压到今天——按出厂成本算,二十多万压在纸箱里,还占着仓库。老板后来的原话:"还是接单踏实。"但你要看破的不是"OBM做不得",而是**为什么工厂做OBM十做九死**:工厂的基因是成本和交付,品牌要的是内容、渠道、用户运营——完全是另一门手艺;两万顶起做,更是把制造业的量级思维错用在了品牌冷启动上。不是船不好,是船长开错了船。

那你自己是哪一格?严格说哪格都不是——你没有工厂,你做R&B这单,是**贸易商身份的定制服务**:左手翻译客户需求,右手组织工厂产能,赚的是服务费和信息差。它最像OEM的服务化变体,第7章会给它正式的名分(7.3.2,新人的主战场)。这张表你现在的用法有两个。其一,**听懂工厂的话**:验厂或聊天时对方说"我们也有自己的品牌",别急着肃然起敬,追问一句"内销还是外销?一年走多少量?"——答得含糊的,多半就是墙角那种箱子;而一个有真实OBM业务的工厂接你的OEM单,要多留个心眼:你的爆款会不会转身出现在他自己的店里(防抄款条款怎么写,见15.5.1)。其二,**给自己定路线**:新人从OEM式服务切入攒客户、攒现金流,ODM思维(手里备几个验证过的款)是第二年的进阶,OBM是多年后的选修课——顺序倒过来走的人,坟头就在墙角那摞箱子里。

本节动作:把上面那张对比表抄进笔记,然后在下面写一行字并签上日期:"**未来十二个月,我只赚服务的钱。**"每次动了"做个自己的牌子"的念头,翻回来看一眼日期——不满十二个月,不许动。

## 5.4 头部玩家速览

### 5.4.1 Yupoong与Flexfit:配件品牌化案例

回到那个让你失眠的深夜搜索结果。"全球最大的帽子公司"跳出来的名字之一,是一家1974年在首尔起家的制帽厂:**Yupoong**。它手里的牌,是一个你可能在自己帽子内侧见过却从没留意的词——**Flexfit**。这个案例值得单开一节,因为它回答了分散行业里最难的问题:一家代工厂,怎么在没有终端品牌的情况下拿到定价权。

先看它做对的第一步。上世纪九十年代,Yupoong把一项自家技术做成了注册商标:在帽子的汗带(见2.3.3)和帽身结构里织入弹力材料(氨纶的用法,1.1.4讲过),做出不需要调节扣、靠面料弹性适配头围的全封闭帽(fitted/flex结构,见2.4.3),命名Flexfit——并且立下一条铁规矩:凡是用这个结构的帽子,不管外面绣着谁的logo,侧后方必须留一个小小的Flexfit标。消费者买的是潮牌A、乐队B、公司C的帽子,但帽子上永远有它的签名。这套打法有个名字:**配件品牌化**(要素品牌,ingredient branding)——自己不做终端品牌,但让终端品牌离不开你、还替你打广告。同门师兄你都认识:电脑里的Intel、冲锋衣里的Gore-Tex、拉链上的YKK。

第二步更狠:它把产品做成了**blank cap**——中文叫**空白帽**或**帽坯**:不带任何logo的成品帽,专门卖给下游做二次装饰(绣花、印花)后再销售,正是4.3.3成品帽绣花那条路的上游。Yupoong把Flexfit做成一本blank cap目录:每个款给一个型号,常备库存,按打起卖,北美的批发商仓库里堆到天花板。这一步消灭了定制生意最贵的两样东西——打样往返和起订量。算给你看这套模式的经济学:一顶blank cap批发$3-8;北美本地绣花$2-4一个位置;装饰商三五天交货、一打起订,转手卖终端$15-25。对比从中国定制:500顶起、四五十天交期。**blank cap卖的不是帽子,是时间和起订量的自由**——为这两样自由,北美市场愿意付出接近定制价两倍的单价。

这套体系强到什么程度?型号成了语言。你未来接北美询盘,会遇到这样的句子:"Can you do this on a Flexfit 6277 or equivalent?"(能用Flexfit 6277或同等款做吗?)——客户不描述帽型、不给规格表,报一个型号,全行业都知道那是什么帽子。**当你的产品名变成客户的规格书,比价就结束了**——这是分散行业里最高级的护城河,不靠垄断,靠的是把自己变成标准。读懂这句询盘还有一层实惠:"or equivalent"四个字是给你留的门——他要的是那个规格,不是那个牌子,你报一顶同规格国产帽坯的价,说明差异,单子就有得谈。

对你这个量级的新人,这个案例落地成两层。近的一层:**中国版blank cap玩法就是你的最低成本起步路**——现货帽加成品绣花(见4.3.3,6.5.1会给你产地地图),小到几十顶的单也能接,本质上你在扮演北美装饰商的角色,只是把货源换到了1688。远的一层,记在心里:等你某款帽子翻单翻到第五次、规格被三个客户重复验证过,就把它型号化——起个编号、写死规格、备一点现货。那一刻你就种下了自己的微型Flexfit。"卖帽坯也能做成品牌",这句话的完整含义是:**品牌的本质不是logo,是被指名的信任**。

本节动作:从今天起建一张"北美常用帽坯型号对照表"——遇到客户提一个型号(Flexfit 6277这类),就查清它的帽型、面料、结构,记一行,并配一个你能拿到的国产等效款和价格。这张表攒到二十行,你接北美单的报价速度会比同行快一天——而5.1.1说过,成熟行业里,快一天就是竞争力本身。

### 5.4.2 国内大厂:飞达、捷锋、源通的客户结构

第二天早餐,你把Yupoong的故事讲给老业务员听,他筷子一摆:"看什么韩国,全世界最大的几家帽厂,就在你隔壁几个省。"他报了几个名字——**飞达、捷锋、源通**——你一个都没听过。"正常,"他说,"消费者都没听过。但你头上戴过的大牌帽子,十有八九出自这几家和它们的同行。"这类企业是行业里**看不见的巨头**:不做终端品牌,专做全球头部品牌的代工,规模大到有的已经上市,财报摆在公开渠道里任你翻(以下量级均为行业常识与公开信息级别的画像,细节以各家披露为准)。

先看量级,和你熟悉的世界对照着看。这一档工厂,**年产能以千万顶计**,员工数千人,国内基地之外在东南亚设厂(为什么外迁,6.6会讲关税与工价的账)。带你算一笔,把"千万顶"翻译成体感:年产3000万顶,按300个工作日摊,日产10万顶;一天两班倒十几个小时,每小时近万顶——**你的500顶,是这种厂全线开动几分钟的产量**。你现在明白为什么第一部反复说"大厂看不上小单"了:不是傲慢,是它的机器一打喷嚏就把你的全年订单打完了。

再看这一节真正的主题:**客户结构**。翻这类上市帽企的公开财报,有一个数字年年扎眼:**前五大客户常占营收的一半以上**,名单里是New Era、Nike、Adidas这类品牌与授权商(授权是什么,下一节讲)。这个结构是一把双刃剑,两面都要看懂。好的一面:大客户给的是别人给不了的东西——巨量、稳定、按年下单,产线排得满满当当,规模效应和退税(见9.7.3)加起来,薄毛利也能过得不错。狠的一面:**客户越集中,议价权越旁落**——年度议价时品牌方压一个点,大厂的利润表就抖三抖;验厂标准、社会责任审计、交期罚则,全按客户的规矩来;哪天客户把订单挪去越南,几条产线立刻晒太阳。所以你会看到一个反直觉的事实:全行业最大的玩家,赚的恰恰是全行业最标准的工厂档毛利(5-15%,见7.2.1)——**规模买来的是生存的稳,买不来定价的权**,5.2.1讲的分散逻辑,在最大的玩家身上同样成立。

这个客户结构对你有三层用处。第一层,死心:这类厂不是你的供应商,起订量、准入流程、账期全按品牌客户的制度设计,500顶的单连它的排产系统都进不去。第二层,借光:**大厂是产业带的老母鸡**——它们二十年里培养的厂长、版师、绣花工、机修,一批批出来自己开中小厂,面辅料配套商围着它们扎堆生长;你在胶州找到的这家中型厂,以及镇上几十家同行,某种意义上都是大厂体系溢出来的种子(这张地图第6章展开)。找供应商时,"从大厂出来的人开的厂",往往是比大厂本身有用得多的线索。第三层,照镜子:连千万顶量级的巨头都在为客户集中度失眠——记住这面镜子,给你一个阈值:**单一客户占你营收超过40%,亮黄灯**;超过一半,你就不是在做生意,是在给那个客户打工,还没有社保(客户组合怎么配,5.5.3和24.2讲)。

早餐结束前,老业务员补了一句要紧的:"以后你会碰到小厂吹'我们给New Era代工过'。三步问死他:哪一年?做的哪条产品线?当年的货样或者水洗标拿一个看看。"——多数吹嘘会在第二步破功,真相通常是"给大厂做过配套"或"接过大厂外发的尾单"。这不算大罪,但一个在履历上加水的供应商,在克重上会加多少浆(见1.3.2),你可以自己推算。

本节动作,两条规则入卡:①供应商的"大厂背景"只当加分项、不当决定项,且必须按上面三步核验;②从今天起,给你未来的客户名单预设一条纪律——**任何单一客户占比不超过40%**,这条纪律现在写下来不花钱,五年后它可能救你的命。

### 5.4.3 New Era与球队授权生意

上一节财报客户名单里领头的那个名字,值得单开一节。你对New Era其实不陌生——温哥华街头每三顶帽子里就有一顶蓝色的Toronto Blue Jays,帽檐侧面那个小小的旗子logo就是它;你只是不知道,这家公司背后藏着帽子行业最独特的一门生意:**授权**。

先补历史。New Era是1920年在美国纽约州布法罗成立的家族制帽厂,前七十年和世上所有帽厂一样默默无闻地做帽子。命运的转折在1993年:它拿下**MLB(美国职棒大联盟)场上官方比赛帽的独家授权**——从那天起,大联盟球员在球场上戴的每一顶帽子,只能是New Era的**59FIFTY**(行话叫"5950",全封闭分码的fitted帽型,见2.4.3)。一家代工基因的制帽厂,靠一纸授权变成了全球帽子行业最响的品牌。

把**授权生意(licensing)**这个术语钉死:IP方(球队、联盟、大学、影视公司)把自己的logo、标志、名称的商业使用权**租**给制造商,制造商按销售抽成付租金——这笔租金叫**授权费(royalty)**,行业常见量级是**批发价的10-15%**,通常外加一笔"卖不到也要付"的年度保底。记住"租logo"三个字,整个模式就通了。

为什么两边都愿意?机制拆开看。联盟这边:球队的核心资产是IP,不是供应链——自建工厂、管品控、压库存,对它是纯粹的负资产;把logo租出去,躺着收租,风险为零,这是IP方的最优解。New Era这边:授权费买到的是**"官方"二字的合法垄断**——球迷要的是"球员头上同款",这个需求全世界只有独家授权者能合法满足,于是定价权凭空出现:一顶5950零售**$40上下**,常年不打折。带你拆这$40:制造成本几美元——注意,New Era自己也不全自产,大量产能外包给亚洲代工厂(上一节的国内大厂就在名单里),它对上游是品牌方,对MLB是被授权商,一家公司同时站在OBM和"租客"两个位置;授权费按批发价抽走几美元;剩下的大头归渠道加价和品牌利润。对照组:一顶做工相同但没有球队标的fitted帽,零售$15还要打折清仓——**差出来的那$25,就是IP的租金,由球迷用"身份归属"支付**(5.1.2的第三驱动,在这里完成闭环:授权生意就是把身份归属做成了收费站)。

这门生意对你有一面红线、一层启示。**红线**:授权的另一面就是侵权稽查。没有授权而生产、出口、销售带MLB、NBA、名校、名牌标志的帽子,每一环都违法——工厂违法,你这个中间商同样跑不掉(见25.4.1),平台下架、海关扣货、天价索赔都是常规操作。给你演一段你必然会遇到的对话。客户:"帮我做200顶带某球队logo的帽子,图我发你。"你:"有品牌方的书面授权吗?"客户:"没有,就我们自己戴,不卖。"——这话不能接:200顶不是"自己戴"的量级,而且法律不看用途看授权。判断规则一刀切:**logo里含知名IP元素、拿不出书面授权,直接拒,数量再小也拒**——这种单赚的是几百块,赔的是整条出口链路。**启示**:把授权逻辑缩小一万倍,看你自己的生意——Mike把R&B的logo文件交给你绣上500顶帽子,本质上就是一次微型授权;设计师发来的logo源文件加上Mike书面确认的邮件,就是你的授权凭证。每一单都把它存好:它平时是流程,出事时是你无辜的证据。

本节动作:把"**侵权自查三问**"写进接单流程——①这个logo是客户自己的吗?②里面含不含第三方元素(球队、名牌、卡通形象、名人肖像)?③拿到书面授权或客户的知识产权担保了吗?三问有一问过不去,单子停下。等到第15章做正式订单文件时,你会给这三问配上一条书面的知识产权条款(见15.5.1)。

## 5.5 需求侧地图

### 5.5.1 品牌客户的采购逻辑

供给侧看完,把望远镜掉个头:全世界到底是谁在下单买帽子?你在酒店房间开了一张Excel表,准备把买家分类画像——这三节画完,需求侧的地图就齐了。第一类,先画金字塔尖上的:**品牌客户**——服饰品牌、户外品牌、运动品牌,就是5.4.2里把大厂财报填满的那类买家。它们采购帽子的逻辑,和你打过交道的所有客户都不一样,不懂这套逻辑的人,会把机会当陷阱、把陷阱当机会。

第一个关键词:**季节企划**。品牌不是缺货了才买,是按季"企划"——一年2-4个波段(春夏、秋冬,加上节日胶囊系列),提前9-12个月开企划会,定款、定量、定价、定上市日,帽子作为配件品类跟着主线走。这对供应商意味着两件事:**下单窗口每年只开几次**,错过一个波段就等半年;窗口期打样急如星火,平时安静如鸡。你若不懂这个节奏,会误判"这客户没需求"——其实只是没到他的季节。

第二个关键词:**供应商准入**。品牌不从搜索框里找工厂,它们养一份**vendor list(供应商名录)**,进名录要过三关:验厂——社会责任与品质体系审计(BSCI、Sedex这类,见12.4.2);样品与测试——面料成分、色牢度、金属件全套检测报告;试单——先给小单看你的真实交付。三关走完,常见耗时半年到一年。名录内的日子也不轻松:年度议价、返点条款、质量罚则,以及最扎现金流的一条——**账期30-90天**,货发了,钱要等一到三个月。

带你算一笔品牌单的账,你就知道它为什么是第二阶段的目标。假设你挤进名录,接到一个款8000顶、单价$2.6的单:货值两万美金出头,听着美;但生产45天你要垫工厂货款,交货后账期90天——**一单资金占用四个半月,十几万人民币趴在别人的流程里**;毛利呢?品牌把价压到工厂档(5-15%,见7.2.1),你作为中间商能留住的更薄。量大、稳定、有牌面,但它吃的是资本和体系,不是机灵——新人的本钱和抗风险能力都撑不起。给你一条硬阈值:**账期超过60天而你没有信用保险兜底(见13.1.2)的单,不接**,再大的牌子也不接。

再给你一针疫苗,防的是展会上最经典的开场。品牌采购或其买手常这样开口:"我们年采购量八十万顶,先给个最好的价。"两个坑:八十万是全品类总盘子,分到你手里的可能是一个款3000顶;"最好的价"是让你先亮底牌的锚。正确接法四连问:"这个款单次下多少?交期窗口?账期几天?测试和验厂按什么标准?"——四个问题问完再报价,对方对你的尊重会上一个台阶,因为你问的全是他内部流程里真实存在的词。

画完这一类,回头看Mike,你会心一笑:R&B没有vendor list,没有测试清单,没有账期——30%定金爽快打过来,决策链就是Mike本人,邮件当天回。**小客户的"不专业",就是新人的现金流和生存空间**;品牌客户的专业,是你两三年后攒够本钱和体系再去啃的硬骨头(客户分类的完整打法见20.1.1)。本节动作:把上面那四连问存成话术卡,标题就叫"品牌询盘先问四件事";再在你的客户表里给"品牌客户"一栏写上备注——**看得起,追不得,两年后再来**。

### 5.5.2 促销品行业:ASI/PPAI分销体系

现在回答本章开头你问自己的那个问题:Mike如果不找你,他会找谁?答案九成九不是中国工厂,而是一个中国新人普遍没听过、体量却大得惊人的行业:**促销品(promotional products)**——印着logo用来送的一切:笔、马克杯、T恤、帆布袋,以及,帽子。这个行业在北美的年销售额**两百多亿美元**,帽子常年霸榜前几名的品类。Mike这样的小老板要做周边,默认动作是打给本地的促销品经销商,就像你缺打印纸默认上京东。

这个行业的结构必须画清楚,因为它是你未来最重要的客户来源之一。两层分工:**supplier(供应商)**——进口或持有空白货(blank cap体系在这里接上了,见5.4.1)、自带绣花印花产能,只服务行业内,不碰终端客户;**distributor(分销商)**——面对终端企业客户(酒厂、车行、银行、学校),卖方案、卖服务,自己不碰生产。两层之间靠行业组织粘合:**ASI**(Advertising Specialty Institute,广告特制品协会)——行业最大的平台,给会员发ASI编号,运营着行业通用的产品目录与报价系统;**PPAI**(Promotional Products Association International,国际促销品协会)——行业协会,办着每年的行业大展。名片或邮件签名里带ASI/PPAI编号,约等于亮了这个行业的执照。这个体系还有条铁的渠道纪律:supplier报给distributor的是内部折扣价,分销商加价卖终端;**供应商绕过分销商直卖终端,是行业里最犯忌讳的事**——记住这条纪律,未来你和北美supplier打交道时别踩(见20.1.2)。

为什么中间要养一层分销商?机制想透,你就懂了这个行业卖的是什么。终端买家是企业的行政、市场部——一年买一两次周边,不懂供应链也不想懂,他们付钱买的是一句话:"下周三活动开场前,500顶绣好logo的帽子准时出现在会场,出了问题有人负责。"**分销商卖的不是帽子,是这句话。**

现在算本节的核心账:**R&B这单如果走北美本土促销品渠道,要花多少钱?**分销商的方案会是:目录里选一款进口帽坯,本地绣一个位置的logo,500顶量级,常见落价区间**每顶$9-12美元**,约合**12-16加元**——Mike的12加元预算,在本土渠道要么顶着上限、要么降规格(换轻薄坯帽、缩小logo)。而你的账:出厂¥17.5≈$2.45(FOB口径,术语详见13.3.1),加上头程运费、关税税费、尾程派送,到Mike手里的完整成本仍在他预算的一半上下——逐项细账第19章算给你看。**你的价格优势不是省一点,是渠道级的**:你砍掉的是坯帽进口商、本地绣花厂、分销商三层加价。但硬币必须看反面:本土渠道三五天交货、一打起订、出错了开车就能上门追责;你是四五十天交期、几百顶起订、隔着一整个太平洋。所以你抢的不是整个市场,是其中特定的一段——**量够大、时间够宽、在乎价格和定制深度的单**。Mike提前三个半月下500顶,恰好整段落在你的射程里;换成"下周活动要100顶",那就该老老实实让给本土渠道,强接必砸。

最后教你认人。一封promo分销商的询盘长这样:邮箱签名带ASI编号,正文只有三行——"6片结构帽,3000顶,前后两个位置绣花,DDP到洛杉矶(含税到门,见13.3.2),目标价$3.80,能做吗?"全是行话、有目标价、有交付条款——**这是全世界最专业的一类帽子买家**:懂产品、量体面、复购稳定,一个分销商背后站着几十个终端客户,服务好一个等于接通一片(开发打法见20.1.2、21.3)。接这类单的正确姿势也不同:别从自己的成本正着报,先拿他的目标价倒推——$3.80能不能容下你的成本加合理服务费,能就接,不能就明说差多少,他们尊重算得清账的人。

本节动作,三个识别信号入卡:①签名带ASI/PPAI编号;②用语专业(说imprint、decoration、location这类装饰行话);③询盘自带目标价和交付条款。**三条中两条,标记为最高优先级客户,两小时内必回**——这类人手里永远不止一个单子,你回慢的每一小时,都是别人的机会。

### 5.5.3 团队机构与电商卖家

Excel表还剩最后两栏。深夜十二点半,绣花厂那边发来消息说你的裁片明天上机,你决定睡前把需求侧地图的最后两块拼完——恰好也是和你的生意关系最日常的两块。

第四类:**团队机构**。这是个大箩筐,往里装:业余球队和俱乐部、学校的社团和校队、公司(团建、司庆、展会、周年礼)、政府和非营利组织的活动帽——共同点是**买帽子的人花的不是自己的钱,走的是预算**。这个共同点决定了一整套画像:要正式报价单、要发票、要走审批,决策链比Mike长,一单常要等两三个"领导看一下";但相应地,**价格敏感度低**——预算是批下来的,批了500顶帽子8000块,你报7600他不会多高兴,你报8300他就要重新走流程,所以他们要的是"在预算内把事办漂亮",不是最低价。最硬的一条:**死线是活动日期,铁打不动**——运动会、司庆、赛季开幕,货晚到一天等于零。这类单的量级通常200-2000顶,恰好卡在你的甜区;服务好了,明年活动还是你的,复购像交房租一样准时。风险也有两个:公对公付款慢(合同里定金条款要咬死,见14.5.1),以及决策链上换个人、整单重来。你再看R&B:Mike其实是"社群小B"和"团队机构"的杂交体——身份归属的生意内核(5.1.2),加上机构式的活动死线(九月中旬),这两条你都已经在伺候了。

第五类:**电商卖家**。亚马逊、Etsy、TikTok小店、独立站的卖家们——0.2里画像三的那群人,现在他们坐到了你的对面变成客户。画像:**小批量、多SKU、快节奏**——一次下三个款每款一两百顶试卖,数据说话,款死了立刻停,款爆了半夜催你"15天能不能再交2000顶";**对成本极其敏感**——平台佣金、仓储、广告吃掉零售价的大半(那本账见22.1.2),出厂价每一毛钱都要掰扯;**要求细碎**——FBA贴标、条码、独立包装(见4.6.4),错一个标签整批入不了仓。和他们相处的规矩三条:打样费照收、定金规矩不破例(消失率是五类客户里最高的——不是人品问题,是款死了店就关了)、以及看懂你真正能卖给他们的东西:**不是低价,是低试错成本**——起订量降一点、打样快一点、翻单产能兜得住,对赌数据的人来说比单价便宜五毛值钱得多。

五类买家(品牌、促销品分销商、团队机构、电商卖家,加上R&B这种社群小B)全部到齐,带你把地图收拢成一个决策。比较五类的三个维度——现金流(定金爽不爽快)、决策速度、复购确定性——给你一个新人期的**客户组合配方**:主攻**社群小B+团队机构**(现金流好、决策快、死线明确、复购稳),这是你的米饭;搭一到两个**促销品分销商**(量大、专业、能把你的产能利用率顶起来),这是你的肉;**电商卖家**做产能空档的填充,规矩守住就是净贡献;**品牌客户**两年内只建联系不追单(5.5.1的结论)。这个配方不是永恒真理,是新人期的生存解——等你的资金和体系长大,配比自然会变(第20章会把每一类的开发打法逐个展开)。

本节动作,给自己立一个**每季度客户组合自查三问**,现在就把三句话写进日历提醒:①我的收入里,现金流好的客户(定金50%以上、无账期)占比还有没有六成?②下季度的死线型订单,产能上有没有互相打架的(两个活动帽死线撞在同一周,就是11月的你哭的原因)?③最大的那个客户,占比过没过40%(5.4.2那面镜子)?三问每季度问一遍,答案变坏的那个季度,就是你调整动作的季度——别等年底算总账时才发现船漏了。
