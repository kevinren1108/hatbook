# 第17章 物流

**主线推进** —— 尾款进账那天下午,你把¥6,125转给了老崔(见14.1.2),工厂那一头的账彻底清了。第二天上午八点半,小林安排的提货车拐进厂区——一辆蓝色的四米二厢车,车厢里已经装了大半,靠近车门的位置空着一块。司机跳下来,看了一眼你的五个箱子,说了句"就这点儿啊",然后一个人两趟就搬完了。

你临时决定跟车去一趟。四十分钟后,车停在青岛城阳一处货代集货仓的卸货平台前。卷帘门里灯很亮,地面用黄漆划着一格一格的区域,每格上方吊着一块牌子写着船期和目的港。你的五个箱子被推到写着"VAN-01"的那一格,旁边码着一垛卫浴五金,再旁边是一箱一箱的LED灯带,箱子比你的大一倍,压得托盘中间微微下弯。

仓管拿卷尺量了你其中一个箱子的三条边,报数:"六十、四十、四十。"另一个人在地磅前把五个箱子一起过了一遍,屏幕跳出**62.5**。然后是贴唛——不是你在4.6.3里逐字核对过的那张箱唛,而是货代自己打印的一张巴掌大的分拣标签,上面只有一个订舱号、一个格位号和"5/5"。

你站在那儿看了足足两分钟。三十多天的布、线、针、返工、验货,在这间仓库里变成了三个数:**0.48方,62.5公斤,5件**。往后一万公里,没有人会再看那顶帽子一眼——所有人看的,都是这三个数。

这一章讲的就是这三个数怎么变成钱、怎么变成天数,以及你在哪几个地方会被它们坑到。

## 17.1 海运整柜FCL

### 17.1.1 柜型与装柜估算:一个柜装多少顶帽子

从卸货平台出来,小林领你绕到仓库后面的堆场。三排集装箱码在那儿,大部分是空箱,门开着,里面黑洞洞的。他拍了拍最近的一个:"这是二十尺的,你钻进去看看。"

你弯腰走进去，人在里面站直没问题，伸手够不到顶。往里走十几步就到底了，回头看门口那个方框，光线在地上切出一条边。走出来再看旁边那个四十尺高柜——同样宽度，长了一倍，顶还高出一截，站在门口往里望，尽头有点看不清。

小林在外面喊:"能装几箱你的货,自己估一下。"

这个问题是这一节的全部。先把两个最基本的词钉死,后面五节都在用它们:

- **FCL(Full Container Load,整柜)**:你一个人包下一整个集装箱,货从工厂装进柜、加封、拖到码头、上船、到目的港整柜提走,中间没有人开过这个柜门。行内也叫"整箱""包柜"。
- **LCL(Less than Container Load,拼箱)**:你的货凑不满一个柜,交给货代,由货代把你和另外十几家的货装进同一个柜——这就是你刚才在仓库里看到的,你的帽子挨着别人的卫浴五金。

集装箱的规格是全球统一的,常用的就三种。**注意区分"理论容积"和"实用容积":理论容积是内尺寸三边相乘,实用容积是人工装柜实际能塞进去的量。**两者差10-15%,差在门框比箱体窄一圈、货物之间必然留缝、最后一排码不满、以及箱底的通风槽。报价和估算一律用实用容积,用理论容积算出来的方数是骗自己的。

| 柜型 | 全称 | 内尺寸(长×宽×高,米) | 理论容积 | **实用容积** | 常见限重 |
|---|---|---|---|---|---|
| **20GP** | 20尺普柜(General Purpose) | 5.90 × 2.35 × 2.39 | 33.1 CBM | **约28 CBM** | 21-22吨 |
| **40GP** | 40尺普柜 | 12.03 × 2.35 × 2.39 | 67.6 CBM | **约58 CBM** | 26-27吨 |
| **40HQ** | 40尺高柜(High Cube) | 12.03 × 2.35 × **2.69** | 76.0 CBM | **约68 CBM** | 26-27吨 |

**CBM** 就是立方米(cubic meter),4.6.2里已经用过——0.096CBM一箱。国际物流里所有的体积都叫方,一方就是一个CBM,货代嘴里的"你这票几个方"问的就是这个。

40HQ 和 40GP 只差一个高度:2.69 对 2.39,高出30厘米。可就这30厘米,容积多了10方——**多出来的这10方是白送的,因为40HQ的海运费通常只比40GP贵USD 50-150。**所以行业里有一条不用犹豫的规则:**装轻泡货,永远订高柜。**

现在带你算帽子。用4.6.2定死的口径:标准箱60×40×40cm,0.096CBM,嵌套装100顶。

```
40HQ 实用容积 68 CBM ÷ 0.096 CBM/箱 = 708 箱
708 箱 × 100 顶/箱 = 70,800 顶  ≈ 7 万顶

40GP:58 ÷ 0.096 = 604 箱 = 60,400 顶 ≈ 6 万顶
20GP:28 ÷ 0.096 = 291 箱 = 29,100 顶 ≈ 2.9 万顶
```

**一个40尺高柜装七万顶帽子。**这个数请你记住,它比任何一段行业分析都更快地告诉你自己站在哪儿:R&B这一单500顶,是这个柜子的 **0.7%**;你在1.2里做的四SKU方案,四个款各一千顶,加起来还不到一个20尺柜的七分之一。第6章说胶州那些大厂MOQ开口就是三千五千顶(见6.2.2),换算过来才三十几到五十几箱——**连半个20尺柜都装不满。**帽子这门生意的整柜门槛,比你想象的高得多。

再算一遍重量,这一算你会看懂帽子这个品类的物流性格。5箱62.5公斤,折**每方约130公斤**(62.5 ÷ 0.48)。现在拿它去撞柜子的限重线:

```
40HQ 装满 708 箱,毛重 = 708 × 10.1 kg ≈ 7.15 吨
40HQ 限重                              ≈ 26 吨
限重利用率 = 7.15 / 26 = 27.5%

"配平线"(装满68方刚好压到26吨所需的密度)= 26,000 ÷ 68 ≈ 382 kg/方
帽子的实际密度                                        ≈ 130 kg/方
```

结论一句话:**帽子永远是先装满体积,绝不可能先压满吨位。**这条性格贯穿本章——17.3.1的"抛货",17.6的"托盘吃柜容",甚至17.2.1那堵"最低一方"的墙,全都是它的直接后果。反过来,如果你哪天改行做陶瓷杯或者五金,规则会整个反过来:那些货是先压满吨位、柜子还空着一半。**做贸易的人必须知道自己的货是撞体积的还是撞重量的,这决定了你在每一次运输谈判里该争什么。**

那么什么量级该走整柜?这里先给结论,算法留到17.2.3:**行业经验值是12-15方以上开始认真算整柜的账。**折成帽子就是 125-156箱、**1.25万到1.56万顶**。低于这个数,你连想都不用想,拼箱。

给你一段小林的原话,是这一节最实用的一句。你问他:"我下一单要是做到三千顶,能走整柜吗?"他在电话那头笑:"三千顶三十个箱子,两个半方。你去订个柜,柜子里九成六是空气,拖车费报关费一分不少。**没有'为了整柜而整柜'这回事——柜子是用来装满的,不是用来显得专业的。**"

本节动作三条,现在就能用。①**把你的产品密度算出来记在手机备忘录里**:总毛重÷总方数,单位公斤/方。低于167是抛货(见17.3.1),高于400是重货,中间是均货——这一个数决定你以后所有的运输方式选择。②**问工厂要装箱数时,连箱规一起问**:"多少顶一箱?箱子外尺寸多少?单箱毛重多少?"三个数缺一个,你就算不出方数,也就没法比价。③**给自己建一张"我的量级表"**:1方=10箱=1000顶,12方≈1.25万顶开始考虑整柜,68方=7万顶装满一个高柜。以后客户报一个数量给你,你三秒内就知道这票货长什么样。

### 17.1.2 费用构成:海运费之外的十几项杂费

回程的车上,小林随手把手机递给你:"你看看这个,前天一个客户发来问我的。"

屏幕上是另一家货代的报价单,只有一行:

```
Qingdao → Vancouver, 40HQ, Ocean Freight  USD 200
```

你愣了一下:"两百美金?一个四十尺高柜从青岛到温哥华,两百美金?"

小林把手机拿回去:"是真的。这个数字本身不假。**假的是它让你以为这就是全部。**"

这一节把整柜的账彻底摊开。**新人对国际物流最大的误解,就是以为运费等于海运费。**实际上一票整柜的费用分三段:起运港本地费用、海运费、目的港本地费用。海运费是唯一会浮动几倍的那一项,也因此是唯一被拿来做诱饵的那一项——**因为其他十几项几乎是固定的,谁报都差不多,只有它能玩花样。**

先看起运港这一段。以青岛到温哥华、一个40HQ为例,逐项列全,金额是常规行情下的量级:

| # | 费用项 | 常用缩写 | 金额 | 收钱的人 | 这笔钱买的是什么 |
|---|---|---|---|---|---|
| 1 | 海运费 | O/F(Ocean Freight) | USD 200-2,800 | 船公司 | 柜子在海上漂的那一程 |
| 2 | 起运港码头操作费 | **THC**(见13.3.1) | ¥1,450/40HQ | 船公司代收 | 码头把柜子从堆场吊上船 |
| 3 | 订舱费/文件费 | DOC、B/L fee | ¥450/票 | 船公司或货代 | 出一份提单的钱 |
| 4 | 铅封费 | Seal | ¥60/柜 | 船公司 | 关柜门那根一次性封条 |
| 5 | 舱单申报费 | EDI、Manifest | ¥80/票 | 货代 | 向海关电子传输舱单数据 |
| 6 | 核实总重申报费 | **VGM** | ¥80/柜 | 船公司/码头 | 见下文,强制项 |
| 7 | 港务费/港建费 | Port charge | ¥100/柜 | 港口 | 港口设施使用 |
| 8 | 拖车费 | Trucking | ¥1,300 | 车队 | 胶州到青岛港一小时(见6.2.1) |
| 9 | 装柜费 | Loading | ¥500-800 | 装卸队 | 人工把货码进柜,按柜或按方 |
| 10 | 报关费 | Customs | ¥350/票 | 报关行 | 出口报关(见18.2.1) |
| 11 | 产地证代办 | C/O | ¥200-350 | 贸促会/代理 | 加拿大走MFN税率要用(见18.4.1) |
| 12 | 保险 | Insurance | 按保额算 | 保险公司 | 见17.7 |

起运港这一列不含海运费,合计约 **¥4,570**,折USD 645。也就是说,那个USD 200的海运费,连本地费用的三分之一都不到。

这里有个必须现场定义的强制项。**VGM(Verified Gross Mass,核实集装箱总重)**:国际海事组织的SOLAS公约从2016年7月1日起强制要求——托运人必须在截关前向船公司书面申报重柜的核实总重(货物+衬垫+箱皮),**没有VGM,码头不许装船。**两种合规做法:整柜过磅,或者把各件货逐一称重相加再加箱皮重。允许误差通常±5%。为什么要这么严?因为在此之前,集装箱申报重量与实际相差20%以上是常态,重量分布错了,船在风浪里会失去稳性——这条规矩是拿几起断船事故换来的。对你的实际影响只有一句:**你给货代报的毛重必须是真的**,报低了到码头过磅对不上,轻则改单收费,重则甩柜(货被剔出这一班船,等下一班)。

再看目的港这一段,温哥华,40HQ:

| 费用项 | 金额(CAD) | 说明 |
|---|---|---|
| 目的港码头操作费 DTHC | 450 | 与起运港THC对应 |
| 换单费 D/O fee | 75 | 见17.2.2 |
| 码头安全费 ISPS | 35 | |
| 清关代理费 | 125 | 见18.4.1 |
| 关税 + GST | 按货值 | 见18.4.1 |
| 拖车派送 | 350-600 | 港口到收货人仓库 |

目的港合计约 **CAD 1,035-1,285**,折 **¥5,400-6,700**。

现在把三段加起来,看那个USD 200的真实占比:

```
海运费      USD   200 = ¥ 1,420      11.6%
起运港本地  ¥ 4,570                  37.3%
目的港本地  ¥ 6,000(取中)           49.0%
─────────────────────────────
全程合计    ≈ ¥12,000               100%
```

**"海运费USD 200"占全程成本的11.6%。**这就是那份一行报价单的全部秘密:它把89%的钱藏在了你没问的地方。而且请注意最后一行——**目的港那一段占了将近一半,而在FOB和CIF条款下,那一半是你的客户掏的(见13.3.3)**。你报了一个漂亮的价,客户收到货代账单时被吓一跳,这笔账最后还是要算在你头上。

事故讲一个,数字都留着。一位同行做美西,货代报"海运费USD 50,**all-in** USD 850/40HQ",他觉得捡到宝,签了。柜子到长滩,客户收到目的港账单 **USD 1,240**(DDC + CFS + D/O + 底盘车chassis费),打电话来质问。他翻出报价单据理力争,货代回了一句让他哑口无言的话:"我们写的是all-in,all-in到装上船。"——**"all-in"这三个字母永远必须跟一个终点。**All-in to where?到船上、到目的港码头、到收货人门口,是三个完全不同的数。他最后自掏USD 1,240保住客户,这一单的利润是USD 1,600。

本节动作,**看整柜报价单的四问**,原样抄进你的询价邮件:①**这个价含到哪个节点?**用13.3.3那十个节点的编号说,别说"全包"。②**本地费用能不能逐条列出来,并写一句"除上列外无其他费用"?**——这句话的价值不在于它能免掉杂费,在于它逼对方把清单写完整。③**目的港费用大概多少、谁付?能不能给一张目的港费用表(destination charges)?**这一问是17.2.2整节的主题。④**报价有效期到哪天?旺季附加费(PSS)、燃油附加费(BAF)会不会另加?**海运费是全链条上波动最凶的一项,一个月涨一倍是发生过的事——**没有有效期的运价报价,等于没有报价。**

## 17.2 海运拼箱LCL

### 17.2.1 CBM计费与最低消费

小林把车停在写字楼底下,从副驾拿出一张纸,是他昨天发你的那份三行报价的明细版。他用笔圈住第二行:

```
② CIF Vancouver(拼箱)  约 ¥900
```

"你猜这九百块里,你那0.48方占多少?"

你算了半天没算明白。他直接说:"**你按一方付的。**"

这一节讲的就是这句话。拼箱的计费规则一共只有三条,但每一条都是新人第一次出货的学费。

**规则一:按体积或重量取大者计费,行话叫 W/M(Weight or Measurement)。**海运拼箱的尺重换算是 **1 CBM = 1,000 公斤**。也就是说,你这票货的计费单位取两个数中的大者:实际方数,或者"实际公斤数÷1000"。拿R&B算:体积0.48方,重量62.5公斤÷1000 = 0.06方。**取大者:0.48方。**帽子太轻,重量这一边永远输,所以帽子拼箱永远按体积计——这就是17.1.1那个"130公斤/方"的直接后果。

**规则二:最低计费一方(minimum 1 CBM)。**不管你实际几方,不足一方按一方算。你0.48方,按1方付钱。**一半的钱买的是空气。**

**规则三:票级固定费用不随体积缩小。**报关一票就是一票,文件一份就是一份,提货车跑一趟就是一趟——这些费用跟你的货是0.48方还是4.8方毫无关系。

把小林那份¥900拆开,你就看见这三条规则怎么咬合在一起:

| 项目 | 计费方式 | 金额 | 随体积缩小吗 |
|---|---|---|---|
| 提货费(胶州→青岛集货仓,零担) | 按票 | ¥150 | ✗ |
| 报关费 | 按票 | ¥200 | ✗ |
| 文件费/订舱费 | 按票 | ¥150 | ✗ |
| 起运港拼箱操作费(CFS装箱+THC分摊) | 按方,**最低1方** | ¥130 | ✗(已触底) |
| 海运费 | 按方,**最低1方** | ¥250 | ✗(已触底) |
| 保险(见17.7) | 按保额 | ¥34 | — |
| **合计** | | **¥914** | |

看清楚了:**¥914里,有¥500是纯粹的票级固定费,另外¥380是被"最低一方"这条线托住的。**你的货哪怕再少一半、变成0.24方,这张单子还是¥914,一分不少。

**这就是小货的第一堵墙,也是外贸新人最难受的一课:物流的边际成本不随订单缩小。**你可以把订单从500顶砍到250顶,货款省一半;但运费一分不省。带你把这个后果算成每顶的钱:

```
500顶(0.48方) → ¥914 ÷ 500 = ¥1.83/顶
250顶(0.24方) → ¥914 ÷ 250 = ¥3.66/顶   ← 每顶运费翻倍
100顶(0.10方) → ¥914 ÷ 100 = ¥9.14/顶   ← 每顶运费是货款的一半
```

再往回接一条已经学过的知识:9.7.1那张数量阶梯表告诉你,数量越大单价越低——那是工厂端的规模效应。**现在你看到了物流端的规模效应,而它比工厂端更陡。**工厂端从500顶做到3000顶,单价从¥17.5降到¥16.6,降5%;物流端从100顶做到500顶,每顶运费从¥9.14降到¥1.83,降**80%**。**所以"最小起订量"这件事,一半是工厂定的,另一半是集装箱定的。**

对话样本,标出哪句是真话哪句是托辞。你问小林:"我这0.48方,能不能按实际方数收?"

他的回答:"**按实际方数收也行,海运费和操作费按0.48算,一共省你一百八。**但报关、文件、提货这三样按票的省不掉。而且——"他顿了一下,"**你少付这一百八,我在船公司那边还是按一方买的舱位,这个亏我不会替你吃,我只会在别的地方找回来。**"

后半句是这场对话里最值钱的一句真话。**当一个货代同意在一个不该让步的地方让步时,他一定在另一个你看不见的地方补回来了**——通常是目的港,这正是下一节的内容。

本节动作三条。①**问价前先自己算方数**,公式钉死:`方数 = 箱长(m) × 箱宽 × 箱高 × 箱数`,量到厘米、进位不进位问清楚(不少货代按"最长边进位到整厘米"量,你自己按实际尺寸算会有几个百分点的差)。②**报价一律要"按方单价"**,不要总价——这是13.5已经给过的规则,这里给出原因:总价随货量变,按方单价才是能横向比价的那个数。R&B这一单¥1,400÷0.48方 = **¥2,900/方**,你拿这个数去问第二家、第三家,五分钟就知道行情。③**遇到不足一方的货,先做一道题:凑不凑得满?**如果你手上还有别的客户的货、别的样品、别的现货同期发同一个目的港,并成一票,你就把那¥500的票级费用摊薄了一半。**拼货是小卖家唯一能用的规模武器。**

### 17.2.2 目的港杂费陷阱:低价拼箱的套路

那句"我只会在别的地方找回来"你没听懂,晚上发微信问他。他回了三张截图,是他一个客户三个月前的真实遭遇,你看完后背发凉。

截图一:某货代的报价单,一行字——`Qingdao → Los Angeles, LCL, Ocean Freight: USD 1.00 / CBM`。

一美金一方。你第一反应是打印错误。

截图二:收货人收到的目的港账单,五行:

```
Destination Delivery Charge (DDC)   USD  95.00 / CBM   ×  3 CBM = 285.00
CFS Handling / Deconsolidation      USD  48.00 / CBM   ×  3 CBM = 144.00
Delivery Order Fee (D/O)            USD  85.00 / shipment       =  85.00
Chassis / Terminal Fee              USD  65.00 / shipment       =  65.00
ISF / Documentation                 USD  50.00 / shipment       =  50.00
                                                        TOTAL   = 629.00
```

截图三:客户的邮件,只有一句:`Why did I pay USD 629 on a USD 3 freight?`

这就是拼箱行业最经典的一套玩法,它有个行内名字叫"**目的港倒挂**"。机制必须讲透,因为它不是骗局,是一套完全合法、运转了几十年的商业模式:

**第一层:货代的钱可以在两头收。**一票拼箱货,起运港有一个操作方,目的港有一个操作方(叫**目的港代理**)。这两方之间有分成协议。当起运港这一方把海运费报到USD 1,它并不亏——它把这票货交给指定的目的港代理,后者从收货人身上收到的DDC、CFS、D/O,会按约定分一部分回来给它。**海运费不是它的收入来源,收货人才是。**

**第二层:出钱的人和选服务的人不是同一个人。**这是所有此类陷阱的共同结构。选货代的是发货人(你或你的客户),付目的港费用的是收货人。**选的人不付钱,付钱的人没得选。**在FOB和CIF条款下(见13.3.3),目的港以后的费用一律归买方——于是发货人只关心自己那一段便宜不便宜,后果全落在买方头上。你想想13.3.1那个"FOB指定货代扣提单"的坑,底层逻辑是同一个:**控制权和付款义务分离的地方,就是陷阱生长的地方。**

**第三层:收货人一旦货到港,就没有议价能力。**货已经在CFS仓库里躺着,每天产生仓租(free time通常3-7天,超期按方按天收),他不付这笔钱就换不到提货单。**这是一场他必输的谈判,因为时间站在对方那边。**

现在把三个必须认识的词现场定义清楚:

- **CFS(Container Freight Station,集装箱货运站)**:拼箱货的集散仓库。出口时在这里把十几家的货装进同一个柜(拼箱/consolidation),进口时在这里把柜拆开、按收货人分堆(拆箱/deconsolidation)。**你今天上午站的那个青岛的仓库,就是出口端的CFS。**CFS费按方收,而且一般不设"最低一方"以外的优惠。
- **DDC(Destination Delivery Charge,目的港交货费)**:北美航线特有的一项费用,名义上是把柜子从船边移到码头堆场再交付的费用,按方或按柜收。它是北美拼箱账单里金额最大、也最容易被藏起来的一项。
- **换单费(D/O fee,Delivery Order fee)**:收货人拿着提单去找目的港代理,换取一张"提货单"(D/O)——码头凭D/O放货,不凭提单。这一换,就是一笔钱,按票收,北美常见 USD 50-100,加拿大 CAD 50-90。**换单费是整个链条上最纯粹的一笔"钥匙费":它不对应任何实际作业,它对应的是一把锁。**

对R&B这一单,这一节的价值不在于你被坑了,而在于**你差点让Mike被坑**。小林那份三行报价的第二行"CIF Vancouver 约¥900",你当时看到的是¥900;而Mike那一头要付的是什么,报价单上一个字没写。你在13.3.2里估过是CAD 400-600,现在可以把它拆细了:

```
Mike 若按 CIF Vancouver 收货,他要付的账单(0.48方,按1方计):
  DDC              CAD  85 / CBM × 1 =  85
  CFS 拆箱费       CAD  55 / CBM × 1 =  55
  换单费 D/O       CAD  65 / 票      =  65
  码头安全费       CAD  30 / 票      =  30
  清关代理费       CAD 110 / 票      = 110
  关税 + GST                         =  按货值(见18.4.1)
  港口→酒厂派送   CAD 120           = 120
  ─────────────────────────────────────
  小计(不含税)                     = CAD 465  ≈ ¥2,418
```

**看清楚这个数:¥2,418。**它比你付的整个海派专线运费¥1,400还高七成。**而在CIF条款下,这¥2,418不出现在你给他的任何一张纸上。**他收到货代账单的那一刻,会觉得自己被你骗了——哪怕从条款上说,你一点错都没有。

这就是13.5那句"到门价把比价从帽子多少钱变成了这件事多少钱"的另一面:**到门价不只是卖得贵一点,它是把这张看不见的账单从客户手里拿走,放进你自己的报价里。**你敢这么做,是因为你知道它是多少;客户不敢自己承担,是因为他不知道它是多少。**信息差在这里不是用来欺负客户的,是用来定价的。**

本节动作,**问目的港费用的三句原话**,英文中文各一份,原样可抄:

> "Please quote all-in **including destination charges**. I need a written breakdown of the destination charges at [目的港], per shipment and per CBM."
> "请把目的港费用一并书面报出来,按票和按方分别列清:DDC、CFS、D/O、码头费、文件费。"

第三句是杀手锏,专门用来对付"我们只管到港口,目的港的事你问收货人":

> "如果你报不出目的港费用,请把你在目的港的代理公司名称和联系方式给我,我自己去问。"

**一家正经货代会直接给你一张表;一家靠目的港赚钱的货代会开始绕。**绕的那一秒,你就知道该找下一家了。最后加一条铁律进你的PI:走FOB/CFR/CIF时,在条款下面补一行 `Destination charges at [港口] are for Buyer's account and are estimated at [金额] — actual charges to be advised by carrier's agent.`——**把一个你无法控制的数字,变成一个你提前披露过的数字。**披露过的意外不叫意外,叫预期。

### 17.2.3 整拼决策点:多少方该转整柜

这一节要回答17.1.1留下的那个问号:**到底几方该转整柜?**行业里张口就来的答案是"十二到十五方",但你如果照着信,迟早会在一票二十方的货上多花几千块——因为**那个数字是经验值,不是算出来的,而且它成立的前提条件很多人没说。**

先把算法给你,这是一道标准的"固定成本 vs 变动成本"交叉点问题。

**整柜的成本结构:几乎全是固定的。**一个40HQ的全程费用,不管你装1方还是68方,基本不变——海运费按柜报、THC按柜、文件费按票、拖车按趟、报关按票、目的港DTHC按柜。用17.1.2那张表的数,青岛→温哥华一个40HQ全程约 **¥12,000**(常规行情、含目的港但不含关税和末端派送)。

**拼箱的成本结构:一部分固定、一部分按方。**用17.2.1那张拆解表,把它推广成公式:

```
LCL 总成本 = 票级固定费 + 每方单价 × max(实际方数, 1)

其中(青岛→温哥华,含目的港按方费用):
  票级固定费 = 起运港按票(报关200+文件150+提货150)+ 目的港按票(D/O 65 + 安全费30 ≈ CAD 95 ≈ ¥494)
             ≈ ¥994
  每方单价   = 起运港拼箱操作 130 + 海运 250 + 目的港 DDC 85 + CFS 55(CAD 140 ≈ ¥728)
             ≈ ¥1,108 / 方
```

令两者相等,解出交叉点:

```
994 + 1,108 × X = 12,000
        1,108 X = 11,006
              X = 9.9 方  ??
```

等一下——**这个数比"12-15方"还低,而且低得离谱。**问题出在哪?出在整柜那¥12,000里,我用的是海运费USD 200的那份报价。**运价一变,答案整个变。**把海运费换成常规行情USD 1,800(¥12,780),其余项不动,40HQ全程变成 ¥23,350:

```
994 + 1,108 X = 23,350
            X = 20.2 方
```

**同一条航线,同样的货,交叉点从9.9方跳到20.2方。**这就是这一节最重要的一句话:**整拼决策点不是一个固定数字,它是运价的函数。**海运费便宜的时候(运力过剩期),整柜的门槛低到十方以下;海运费飞涨的时候(2021那种行情),二十五方走拼箱都可能更划算,因为拼箱的每方单价涨得比整柜慢——**整柜运费翻五倍的时候,拼箱运费只翻两倍,因为拼箱的成本里有一大半是操作费和目的港费,那些不涨。**

那"12-15方"这个经验值是怎么来的?它是长期平均运价下的交叉点(约20方)**往下调了五到八方**的结果。这五到八方买的是三样不出现在价格表上的东西,每一样都值钱:

**一是货不被拆。**拼箱货要进CFS装、到港再进CFS拆,你的箱子被人工搬进搬出至少四次。整柜从工厂装好加封,到客户仓库才开封,中间**零次搬运**。帽子这种怕压的货,少四次搬运意味着少四次破损机会——回头看4.6.3那句"五层瓦楞箱是全单最不值得省的五十块",在拼箱场景下它才真正发挥作用。

**二是不被别人连坐。**同一个柜里十几家的货,只要有一家的申报有问题,整个柜都可能被海关扣下查验(事故三就是这么来的,见18.4.1)。你的帽子完全合规,可你陪着人家的货在码头躺三天,产生的滞港费还得分摊。**整柜的风险只来自你自己,拼箱的风险来自十几个陌生人。**

**三是快3-5天。**拼箱要等集货(货代凑满一个柜才配船,旺季等三五天是常事),到港还要等拆箱进仓(通常3-5个工作日)。整柜直接提走。**一票拼箱货的门到门时间,比同航线整柜慢一周左右——这一周在旺季订单里可能就是全部的buffer。**

给你一张速查表,把上面的推导压成能贴在桌上的东西:

| 你的货量 | 建议 | 帽子换算 | 理由 |
|---|---|---|---|
| < 1 方 | LCL,并想办法凑货 | < 1,000 顶 | 按1方计费,票级费用占大头(见17.2.1) |
| 1 - 8 方 | LCL,不用考虑整柜 | 1,000 - 8,300 顶 | 交叉点在任何运价下都够不着 |
| 8 - 12 方 | LCL 为主,**运价低迷期算一次整柜** | 8,300 - 1.25万顶 | 交叉点可能低至10方 |
| 12 - 20 方 | **两边都报,按当期运价算**;倾向整柜 | 1.25万 - 2.1万顶 | 决策区,三样非价格因素在这里起作用 |
| > 20 方 | 整柜(20GP或40GP) | > 2.1万顶 | 除非运价异常高企 |
| > 58 方 | 40HQ,或多柜 | > 6万顶 | 见17.1.1 |

本节动作两条,都很具体。①**进入12-20方这个区间时,不要问货代"我该走整柜还是拼箱",要问他两个报价:"同一票货,请分别报LCL按方全包价和40HQ全包价,都含目的港。"**——把决策权拿回自己手里,因为货代的偏好未必和你一致(拼箱他赚得多,整柜他省事)。②**把这道题的公式存进手机**:`交叉点方数 = (整柜全程价 − 拼箱票级固定费) ÷ 拼箱每方单价`。每半年重算一次,因为分子每天都在变。**记住结论没用,记住公式才有用——这是这本书里少数几个会随行情失效的知识点之一。**

## 17.3 空运与快递

### 17.3.1 计费重vs体积重:抛货的数学

从货代仓库回来的第三天,你做了一件事后才明白很有必要的事:你让小林把这票货**假装用空运和快递各报了一次价**。不是要改主意,是想知道自己放弃了什么。

他半小时后发来三行:

```
海派专线(双清包税到门,28-32天)   ¥ 1,400
空派(双清包税到门,10-15天)       ¥ 2,560
DHL 快递(到门,5-7天)             ¥ 3,360
```

你看着最后两个数,第一反应是:"我这才五十公斤啊,怎么算出来的?"

小林回了六个字:"**你不是五十公斤。**"

这一节讲的就是这六个字。它是全书里"一个换算规则直接决定成本"最典型的例子,而且帽子是它的教科书案例。

**先定义三个词,一次说清:**

- **实重(actual weight)**:货物上磅的真实重量。你的是62.5公斤。
- **体积重(volumetric weight / dimensional weight)**:把体积按一个约定的换算比折算成的"虚拟重量"。公式:`体积重(kg) = 长(cm) × 宽(cm) × 高(cm) ÷ 除数`。
- **计费重(chargeable weight)**:实重和体积重**取大者**,承运人按这个数收钱。

**除数(divisor)是这套规则的灵魂,不同渠道不一样,记住三个数就够用一辈子:**

| 渠道 | 除数 | 换算成每方多少公斤 | 记法 |
|---|---|---|---|
| 国际空运(航空公司) | **6000** | 1 CBM = 167 kg | 1,000,000 ÷ 6000 |
| 国际快递(DHL/FedEx/UPS) | **5000** | 1 CBM = 200 kg | 1,000,000 ÷ 5000 |
| 海运拼箱(见17.2.1) | ——(用W/M) | 1 CBM = 1,000 kg | 尺重比1:1000 |

除数越小,同样的体积折出来的重量越大,你付的钱越多。**快递的5000比空运的6000"狠",这不是巧合——飞机的货舱容积比重量更稀缺,而快递的车和分拣线更是如此。**

现在带你把R&B这票货在三个渠道下各算一遍。单箱 60×40×40 cm,5箱,实重合计62.5公斤。

```
【空运,除数6000】
  单箱体积重 = 60 × 40 × 40 ÷ 6000 = 96,000 ÷ 6000 = 16.0 kg
  5箱体积重  = 80.0 kg
  实重       = 62.5 kg
  计费重     = max(80.0, 62.5) = 80.0 kg      ← 多付了 17.5 kg 的空气

【快递,除数5000】
  单箱体积重 = 96,000 ÷ 5000 = 19.2 kg
  5箱体积重  = 96.0 kg
  计费重     = max(96.0, 62.5) = 96.0 kg      ← 多付了 33.5 kg 的空气

【海运,1CBM = 1000kg】
  体积折重   = 0.48 × 1,000 = 480 kg
  ……但海运拼箱直接按方计费,取 0.48 方 vs 0.05 方,按 0.48 方(见17.2.1)
```

倒推小林那两个报价就全通了:空派 ¥2,560 ÷ 80 kg = **¥32/公斤**;DHL ¥3,360 ÷ 96 kg = **¥35/公斤**。都在行情区间内(空派双清包税北美线常见¥28-45/公斤,商业快递到温哥华¥30-45/公斤)。**你付的不是重量的钱,是"体积重"的钱。**

**现在给出判断一票货是不是抛货的那条线,这是本节最该记住的东西:**

```
货物密度 = 总毛重(kg) ÷ 总体积(CBM)

密度 < 167 kg/方  →  空运里是抛货(泡货),按体积重计费
密度 < 200 kg/方  →  快递里是抛货
密度 > 200 kg/方  →  重货,按实重计费

R&B:62.5 ÷ 0.48 = 130 kg/方  ← 两条线都在下面,妥妥的抛货
```

**帽子是抛货中的抛货。**130公斤/方,连快递那条200的线的一半都不到。这意味着一件事,你必须在心里钉死:**对帽子而言,空运和快递的成本几乎与重量无关,只与体积有关。你在包装上省下的每一个立方厘米,都是直接从运费里拿回来的钱。**

带你把这句话算成具体的钱。回到4.6.2那个嵌套的手法:

```
嵌套装(8顶/摞,100顶/箱):5箱,0.48方
  空运计费重 80 kg × ¥32 = ¥ 2,560
不嵌套散装(45-50顶/箱):11箱,1.06方
  空运计费重 = 1.06 × 167 = 177 kg × ¥32 = ¥ 5,664
  ────────────────────────────────────
  差额 = ¥3,104   ← 一个叠帽子的手法,在空运渠道值三千块
```

4.6.2里算过,这个手法在海运上值¥1,400。**在空运上,它值¥3,104。渠道越贵,包装优化的杠杆越大。**这条规律你可以直接推广:凡是走空运和快递的货,包装组的每一分钟都比走海运时更值钱。

抛货的钱怎么省,四条路,按可操作性排序:

**一,压体积——见17.3.2,这是唯一一条你完全能控制的路。**

**二,消灭箱内空隙。**这条只在"箱子没装满"的时候有效,而箱子没装满这件事,比你想的常见得多。R&B这一款正好把60×40×40装到实处(100顶折算下来每顶约0.96升,基本没有富余),但你迟早会碰到装不满的款——尤其是结构化帽和beanie,摞数受限,工厂又只有一种库存箱,于是"顶上空一截"就成了常态。判断动作很简单:**装满后从箱口往下量,货面到箱口的距离超过3厘米,就有账可以算。**给你一个算例:某款帽摞高26厘米,一箱码到32厘米就满量了,工厂仍用箱高40厘米的通用箱,顶部空8厘米——**那是箱容的20%,而这20%你在空运里是要按体积重付钱的。**换成60×40×32的定制箱,单箱容积从0.096降到0.0768,同样500顶从0.48方降到0.384方,空运计费重从80公斤降到64公斤,省¥512;纸箱定制版费¥200-300、起订500-1000只。**500顶刚好打平,5,000顶净省五千块。这就是"箱规该不该定制"这道题的全部算法。**

**三,和重货拼一票。**这是货代最爱的操作,叫"**抛重搭配**"。你的帽子130公斤/方,某个客户的五金件600公斤/方,两票并成一票交给航空公司,平均密度落在167附近,双方都按实重计,谁都不多付。你一个人做不到,但**你可以在询价时直接问货代:"你们这条线有没有抛重搭配的价格?我这票是130公斤一方的抛货。"**——问出这句话,你在他眼里就从"小客户"变成了"懂行的小客户",价格立刻不一样。

**四,谈"最低计费重"和"分段价"。**空运和快递都有阶梯:通常 +45kg、+100kg、+300kg、+500kg 各一档,越重单价越低。你80公斤卡在+45这一档。**如果你算出来是95公斤,而+100档的单价低到能让总价更便宜——那就主动加到100公斤计费。**这是空运里最反直觉、也最实用的一个技巧,行话叫"**做重**"(报高一档换低单价)。给你一个算例:某条线 +45kg 档 ¥35/kg、+100kg 档 ¥28/kg,你95公斤:按实报 95×35 = ¥3,325;按100公斤报 100×28 = ¥2,800。**多报5公斤,省¥525。**下次货代给你报价,你就问一句:"下一档的重量线和单价是多少?"

本节动作三条。①**每一票货出门前,把实重、体积重(6000和5000各算一遍)、密度三个数写在报价工作表上**,这三个数决定了你能不能用空运救急(见17.4的时效账)。②**问快递报价时必须问除数**:有些渠道用6000(便宜),有些用5000,少数特货渠道用4000——**同一票货,除数从6000换到5000,运费直接涨20%。**③**把"密度130公斤/方"写进你给货代的每一封询价邮件**,它比"我这票是帽子"信息量大十倍。

### 17.3.2 压缩的度:帽子怎么打包不毁型(承接4.6)

上一节的结论是"压体积等于省钱",这一节讲的是那条不能越过的线——**因为压到某个点之后,你省下的运费会以另一种形式还回去:客户开箱那一刻的表情。**

先把画面调回4.6.2那张装箱台。那个女工把八顶帽子扣成一摞,你当时看着觉得神奇。现在换个角度看这个动作:**她其实在做一次结构判断——她知道这顶帽子哪里能压、哪里不能压。**这个判断的依据,是第2章讲过的帽子解剖学,现在把它和运费挂上钩。

**一顶帽子上,有三个"结构件"决定了它能被压到什么程度:**

**第一是前幅衬(见2.1.1)。**软顶dad hat没有硬衬,前幅只有一层薄的粘合衬甚至什么都没有,所以它可以嵌套、可以横躺、可以承受适度的侧压——这是它能装100顶一箱的物理基础。而**结构化棒球帽(见2.1.1)**前幅里是一片定型衬加泡棉,厚度2-4毫米,压狠了会出现一道横向的死折,而且**这道折是不可逆的:泡棉的闭孔结构被压塌之后不会回弹。**这就是为什么同样的箱子,结构化款只能装60-70顶,一摞只能6顶。

**第二是檐芯(见2.3.2)。**原生PE片,2.5-3毫米厚(见第2章口径)。它是整顶帽子上最硬也最脆的部件:弯曲到一定角度会产生**塑性形变**——也就是说,它记得自己被弯过。dad hat的弯檐本来就是弯的,同向嵌套时后一顶的檐贴着前一顶的檐,弧度一致,互相托住,反而更稳;**但只要方向反了,两个相反的弧顶在一起,受力点集中在檐尖那一小块,一箱货压二十几天,出来就是波浪边。**平檐款(snapback,见2.1.2)更娇气:它的檐必须是直的,任何一点弯都是瑕疵,所以平檐帽在行业里默认**不嵌套、单顶装盒或至多4顶一摞**。

**第三是定型后的帽冠(见4.5.1)。**蒸汽定型是靠棉纤维在湿热下重排、冷却后固定,这个固定不是永久的——**定型后48小时内,纤维还在缓慢回弹,这时候重压最容易留下永久折痕。**行业里的规矩是:定型下架后至少晾置一夜再装箱。你如果哪天看见工厂把刚从定型机上下来还温热的帽子直接往箱里码,那不是效率高,那是在毁货。

**现在讲那条最容易被外行想到、也最容易翻车的路:真空压缩。**

新人算过17.3.1那笔账之后,几乎都会冒出同一个念头:**服装行业不是有真空压缩袋吗?把500顶帽子抽成真空,0.48方能压到0.2方,运费直接砍一半。**

这个念头对了一半:真空压缩确实在纺织品出口里大量使用——但它有一条清晰的适用边界,**边界就是"这个产品有没有需要保持的三维形状"**:

| 品类 | 能不能真空压缩 | 原因 |
|---|---|---|
| 针织beanie(见1.1.4) | **能** | 纯针织物,无衬无芯,展开即回弹 |
| 渔夫帽(软檐款,见2.1.2) | **能,但要控制压缩比** | 软檐可卷,但缝份处压久会留印 |
| 毛巾、T恤、袜子 | **能** | 平面织物,本来就没有形状 |
| **dad hat / 棒球帽** | **不能** | 帽冠是三维定型的,压塌不回弹 |
| **snapback / 平檐款** | **绝对不能** | 檐芯塑性形变 + 排扣被压变形 |
| 草帽、礼帽 | **不能** | 编织结构一压就断 |

**为什么"压塌不回弹"这件事对结构化帽是致命的,机制在这里:**棉纤维在受压时,如果同时有湿气(海运集装箱内壁昼夜结露,见4.6.1),纤维会在被压的形状上重新定型——**这等于在你不希望的地方做了一次"反向定型"。**货到温哥华拆开,帽冠上一道横折,Mike拿去吧台卖,顾客拿起来第一眼就看见那道折。你没法解释"这是运输造成的",因为在客户眼里,**帽子长什么样,就是它长什么样。**

还有两条被忽略的技术性问题,说出来你就彻底死心:**一,真空袋在长途运输中会漏。**扎带松了、袋子被戳破了,袋内回气,帽子在一个原本按压缩体积设计的箱子里散开——箱子会鼓变形,整箱货在柜里的受力全乱。**二,抽真空需要设备和工时。**一台工业抽气机、一个专门的工位、每摞十几秒,500顶要多花两三个小时的人工,而你省下的是不到¥700的海运费(0.28方 × ¥2,900/方)。**账本身就不划算,更别说风险。**

那么压缩的"度"到底在哪?给你一组可以直接拿去和工厂对话的数字,这是本节最实用的部分:

```
dad hat 单顶自然高度(帽冠+檐,平放)         ≈ 11 - 12 cm
8顶同向嵌套后的整摞高度                       ≈ 25 - 28 cm
  → 平均每增加1顶,摞高只涨约 2 cm(嵌套效率 = 82%)

安全线:整摞高度不得低于  20 cm
  低于20cm = 单顶被压到 2.5cm 以下 = 帽冠出现死折
  换算:8顶一摞的压缩上限,是"用手轻按能到22cm,松手回到26cm"

结构化款:6顶一摞,摞高 ≈ 22 - 24 cm,不得手压
平檐款  :4顶一摞或单顶纸盒,不得横向受压
```

装箱时还有一条"不晃不硬塞"的原则,4.6.2给过一句"箱子装得响不算紧,装得不晃才算紧",这里给它一个可执行的检查动作:**封箱前把箱子横过来轻晃两下,听不到内容物移动的声音,同时用手能把最上层的帽子往下按进去1-2厘米——这就是刚好。**按不动是硬塞了(帽子在受压),晃得响是留空了(运输中会互相撞击磨损)。

事故案例,数字齐全。一位同行给美国客户做1,800顶结构化棒球帽,客户要求"尽量压缩体积以降低空运成本"。工厂照办:一摞从6顶加到10顶,每箱从60顶塞到100顶,方数从2.88方压到1.73方,空运计费重从481公斤降到289公斤,空运费从¥15,390降到¥9,250,**省了¥6,140**。货走空运五天到,客户开箱,前幅上一道横折贯穿logo正下方。全批1,800顶里,压在下层的约1,100顶有可见折痕。最后的处理:客户要求全部退运,协商后改为**降价35%就地接收**——货值USD 12,600,让了 **USD 4,410 ≈ ¥31,300**。

**用¥6,140的运费,换了¥31,300的折让,倍数是5.1。**这位同行后来说了一句话值得抄下来:"我那天在报价表上看到运费降了六千多,高兴了整整一个下午。"

本节动作,**三条压缩纪律,直接写进PI的包装条款**:

> ① 嵌套摞数按款型硬性上限:软顶8顶/摞、结构化6顶/摞、平檐款4顶/摞或单顶装盒;
> ② 装箱前帽子须完成定型并晾置**不少于12小时**;
> ③ 不得使用真空压缩或任何形式的机械压紧;整摞以腰封或皮筋轻箍,不得勒出印痕。

再加一条问工厂的话,开裁那周就问:"**这个款一摞几顶?摞高多少厘米?你按这个摞高算,一箱装多少顶、几个方?**"——四个数一次问全,你就能在生产还没开始的时候,把运费算准到个位数。**运费从来不是出货那天才产生的,它在你定装箱数的那一刻就已经定死了。**

## 17.4 专线物流:空派海派、双清包税的灰色

小林那三行报价你已经看了很多天,今天终于问了那个一直没问出口的问题:"**海派专线到底是个什么东西?它凭什么比CIF加目的港便宜,还能到门?**"

他在电话里想了两秒,说:"你把它想成一个**打包好的旅行团**。你自己去办签证、订机票、订酒店、找地陪,一样能玩;但旅行社把这四样打包卖给你,总价比你自己办还便宜,因为它一次带三十个人。**我们做的就是这个,只不过团员是箱子。**"

这个比喻比任何教科书定义都准。现在把它拆成机制。

**专线物流(dedicated line)的本质是三段服务的打包:**

```
① 头程国际运输    ② 目的国清关        ③ 尾程派送
   ↓                  ↓                    ↓
物流商用自己的名义   用自己或合作的      交给当地快递/卡车
向航司/船司包板包舱   清关行统一报关      送到收货人门口
批量买断 → 零售给你   一票多户或化整为零   最后一公里
```

三段各自的降本逻辑不同,这是"为什么专线更便宜"的完整答案:

**头程降本靠包板。**物流商向航空公司或船公司**包下固定的舱位**(空运叫"包板",一板通常1-2吨;海运叫包舱或长约),不管当期有没有货都要付钱。它承担了空舱风险,换来的是远低于零散订舱的价格。你一个人去订80公斤的空运舱位,拿到的是零售价;它一次订两吨,拿到的是批发价——**这个差价就是专线的第一层利润,也是你能享受到的第一层折扣。**

**清关降本靠归集。**十几个客户的货在目的国合成一份或几份报关单申报,报关代理费、文件费、检验费按票收的部分被摊薄了几十倍。一票单独清关在加拿大要CAD 110-125(见17.2.2),摊到三十个客户身上就是CAD 4。

**尾程降本靠体量。**它一个月往温哥华发几十吨货,和当地卡车公司谈的是月结协议价;你一个人一年发一次,拿到的是牌价。

按头程的运输工具,专线分三类,记住这张表你就能在任何一次询价里说对话:

| 类型 | 头程 | 到北美时效 | 计价方式 | 常见价位(北美线) | 适用 |
|---|---|---|---|---|---|
| **空派** | 空运 | 10-15天 | 按公斤(计费重,除数6000) | ¥28-45/kg | 急、货值高、量小 |
| **海派** | 海运 | 28-35天 | **按方**为主,或按公斤 | ¥2,600-3,500/方 | 常规补货、抛货 |
| 铁派 | 中欧班列 | 18-25天(欧洲) | 按方或公斤 | 介于两者之间 | 只走欧洲 |

**注意海派的计价单位:按方。**这是抛货(见17.3.1)的救命特性——同样一票0.48方62.5公斤的货,空派按80公斤计费重收¥2,560,海派按0.48方收¥1,400。**因为海运的尺重比是1:1000(见17.2.1),帽子这种130公斤/方的货在海运体系里"根本不算重"。**这一条,是R&B最终选海派的技术原因。

**现在讲双清包税,以及它的灰色地带。**

**双清包税**(概念在7.2.3点过、13.3.2定过性)指的是:出口清关 + 进口清关 + 关税和进口环节税,全部由服务商包干,你付一个总价,货到门,不再有任何后续账单。13.3.2已经给了它最准确的定性——**双清包税是DDP的商业替身**:客户体验完全等同于DDP,法律结构却不是。

灰色到底灰在哪?三层,一层比一层深:

**第一层:低申报。**服务商拿到一票多户的货,向目的国海关申报的货值往往远低于真实货值。它靠什么盈利?靠"包税"里收你的税费高于它实际缴的税费。**你付的"税"是一个平均价,它交的税是一个压低价,中间的差就是它的利润。**这不是个别现象,是这个模式的经济基础——如果按真实货值足额缴税,包税价根本降不到现在这个水平。

**第二层:归类优化。**把绣花棒球帽报成"针织配件"、把服装报成"布料"以适用更低税率。13.3.2那个2,000顶被美国海关扣三周的案例就是这么来的。

**第三层,也是最要命的一层:包税不等于合规,而且你连"不合规在哪里"都看不见。**因为进口人(importer of record,见13.3.2)不是你,也不是你的客户,是服务商或它的合作清关行。**申报单据你看不到,申报口径你无权决定,出事时海关找的也不是你——但商业后果全部落在你身上:你的客户没收到货。**

**出问题谁担责?看赔付条款,而这一条是本节你必须现场学会读的东西。**专线合同里的赔付条款通常长这样(小林公司的原文,你要来看过):

> 因承运人原因造成货物全部灭失的,按**该票货物运费的三倍**赔偿,最高不超过人民币壹万元;部分损失按比例赔偿。客户可在交运前声明货物价值并支付声明价值 **0.4%** 的费用,按声明价值赔偿,上限为声明价值的100%。因海关查验、扣留、罚没、政策变动造成的延误、费用及损失,承运人不承担赔偿责任。

逐句翻译成大白话:

- "运费的三倍":你运费¥1,400,全损赔 **¥4,200**。你的货值是 **¥25,740**。**赔付覆盖率 16.3%。**
- "最高不超过一万元":哪怕你运费很高,天花板在那儿。
- "声明价值0.4%":你要真赔全,得先花 25,740 × 0.4% = **¥103** 买保障——比自己买货运险贵(见17.7)。
- **最后一句才是重点:"因海关查验、扣留、罚没造成的损失不负责。"**——而海关查验恰恰是双清包税最主要的风险来源。**它把自己制造的那部分风险,明确排除在赔付范围之外了。**

**这句话你要记住:专线的赔付条款,保的是"我的车翻了",不保的是"我的申报被查了"。而后者才是这个模式的固有风险。**

**选专线的四问一确认**,承接13.3.2那套"包税到门四问一确认"(那四问是问合规的),这里这四问是问运输的,两套要一起用:

> ① **这条线是你们自营还是转包?转了几手?**——一手直营的能给你舱位号和排期表;转两手以上的,时效承诺是转述的,出事时索赔要穿过两家公司。
> ② **时效的28-32天,是从"交仓"算还是从"开船"算?超时怎么算?**——这是最容易被含糊过去的一条。交仓到开船之间还有集货和截关,旺季能等5-7天。**问清楚这一条,你的交期承诺才有底。**
> ③ **赔付上限的条款原文发我一份。**——不是问"你们赔不赔",是要那段文字。
> ④ **能不能出货代收货凭证和装箱照?**——这是14.1.2的"款到交仓"在专线场景下唯一的落地凭据(专线不出可流转的正本提单,见16.5),**没有这张纸,你的70%尾款条款就是悬空的。**
>
> **一确认(问客户):**你需不需要进口完税凭证做进项抵扣?——需要,就不能走包税(见13.3.2)。

**最后回答R&B那道题:你为什么选海派。**把三条路的账并排摆出来,这张表是本节的落点:

| | 路线A:CIF Vancouver | 路线B:**海派专线** | 路线C:空派 |
|---|---|---|---|
| 你付 | ¥900 | **¥1,400** | ¥2,560 |
| **Mike另付** | **约CAD 465 ≈ ¥2,418**(见17.2.2) | **¥0** | ¥0 |
| **到门总成本** | **¥3,318** | **¥1,400** | ¥2,560 |
| 计费口径 | 0.48方按1方计(见17.2.1) | 0.48方按方计,¥2,900/方 | 计费重80kg,¥32/kg |
| Mike要做的事 | 注册CARM、找报关行、付账单、约拖车 | **签收** | 签收 |
| 门到门时效 | 28-37天,**尾段不可控** | **28-32天** | 10-15天 |

**三个结论,每一个都值钱:**

**结论一:海派的到门总成本只有CIF的42%。**这不是打折,这是结构性的——CIF那条路上,0.48方在目的港仍然按1方吃DDC和CFS,而海派的目的港费用被三十个客户摊薄了。**小货在拼箱体系里是被惩罚的,在专线体系里是被摊平的。**

**结论二:¥900那个数是个陷阱,而这个陷阱是给客户设的。**如果你当时图便宜选了CIF,你的报价单上会好看¥500,Mike的账单上会多出¥2,418,而你和他的关系会在那一天出问题。**13.5说"到门价把比价从帽子多少钱变成这件事多少钱",这一栏就是证据。**

**结论三:空派贵了¥1,160,买的是18天。**这18天你需不需要?接下来这笔时效账会给出答案——**答案是不需要,而"不需要"这个判断本身,就值¥1,160。**

**这就是这一单的物流决策:海派专线,双清包税,¥1,400,¥2,900/方,28-32天到门。**

**最后算一笔时效账:那五天是怎么追回来的。**

这笔账你必须自己算一遍,因为它是这一单里最容易被忽略、也最能说明"物流是交期的一部分"的地方。

先把两条时间线摆出来。一条是**你对Mike的合同承诺**(见13.5那封报价邮件):`30 days production + 28-32 days transit`,交期自定金到账日起算(交期起算条款见4.7.2)。另一条是**你和工厂在PI上写的装运期**:定金到账后20天——**中间那10天,就是4.7.2教你留的buffer,你留了,而且你把它留在了自己这一侧,没有告诉客户。**

然后是实际发生的事:

```
定金到账 ────────────────────────────────────────────┐
  ├─ +20天  PI装运期(你和工厂约定的出货日)          │
  ├─ +25天  实际完工     ← 事故二:绣花外发排队+返工,晚5天
  ├─ +29天  实际交仓     ← 款到交仓再占4天(通知→到账→交仓,见14.1.2)
  ├─ +30天  你对客户承诺的最晚出货日                   │
  └─ +57天  实际到门(交仓 + 海派28天)                │
     +62天  你对客户承诺的最晚到门日(30 + 32)        │
     +68天  Mike的周年活动(九月中旬)                 ┘
```

三个数字从这张图里跳出来,每一个都要看懂:

**一,实际交仓比"对客户承诺的出货日"还早1天。**晚了5天的是**你和工厂之间**的装运期,不是你和客户之间的交期。**事故二吃掉的,正是你自己留的那10天buffer——这就是buffer存在的全部意义。**如果当初PI装运期和对客户承诺的出货日写成同一天,今天这封邮件你就得写"抱歉,延期"。

**二,实际到门比"对客户承诺的最晚到门日"早5天,离活动还有11天。**没有违约,而且还剩下一周多的余量给清关意外(事故三,见18.4.1)。

**三,如果当初选了LCL,这11天余量会被吃到只剩2-5天。**把LCL的门到门拆开你就明白"追回"到底追的是什么:

| 段 | 海派专线 | LCL(客户自清) |
|---|---|---|
| 交仓 → 开船(集货、配载、截关) | 3-4天 | 3-5天 |
| 海上(青岛→温哥华) | 16-18天 | 16-18天 |
| 卸货 → 拆箱进CFS仓 | **0天**(整票直提) | 3-5天 |
| 清关 | **2天**(批量报关,常态化) | **5-7天**(Mike第一次做,要注册CARM、找报关行、等账单) |
| 派送 | 1-2天 | 1-2天 |
| **合计** | **28-32天** | **28-37天,尾段方差最大** |

**看清楚了:海上那一段两条路完全一样——同样的船、同样的水。专线一天都没快在海上。**它快在最后两栏:**目的港拆箱的3-5天,和客户第一次自己清关的5-7天,合计8-12天的不确定性,被专线的批量清关和固定派送吃掉了。**

**所以"靠海派时效追回"这句话的准确含义是:你在生产端损失的5天,是用客户端的清关时间补回来的。**你没有让船开快一点,你是把一段本来要交给一个新手去办、方差极大的流程,换成了一条每周重复几十次的成熟流水线。**这就是专线真正卖的东西——不是速度,是方差。**

再补一句给你以后用的判断规则:**当一单货出现延误时,不要第一时间想"能不能加急生产",先算"能不能换渠道"。**这一单如果延误的是15天而不是5天,答案就变了——那时候的正解是掏¥1,160升级空派,把28天换成12天,依然赶得上。**渠道是交期的最后一道调节阀,而且它是唯一一个在货已经做完之后还能拧的阀。**

本节动作两条。①**建立"按方单价"和"按公斤单价"两个价格档案**:每问一次价,把总价换算成 ¥/方(海派)和 ¥/kg(空派)记下来,记航线、记月份。**半年之后你手上就有一张别人没有的行情表**,那时候你和货代的谈判地位会彻底改变。②**在给客户的报价邮件里,永远只说"delivered, duties and taxes included",不说"DDP",也不说"双清包税"**——前者是商业承诺,你做得到;中间那三个字母是法律术语,你的结构撑不起;后者是中文行话,客户听不懂。**这三种说法的区别,13.5那段"三张嘴"已经讲过了,这里是它在物流场景下的具体落地。**

## 17.5 货代

### 17.5.1 货代是干什么的:服务清单与收费点

小林这个人,你到今天为止一共见过两次,通过大概二十条微信、四个电话。可就是这个人,决定了你这单¥1,400怎么花、五个箱子什么时候到、Mike的九月活动能不能办成。

那他到底是干什么的?这个问题你得答得比"帮忙发货的"更精确,否则你永远不知道该考核他什么、该跟他谈什么。

**货运代理(freight forwarder,13.1的主线推进里已经出现过,这里正式定义):接受托运人委托,以自己或委托人的名义组织货物运输、办理相关手续,并从中收取报酬的中间人。**关键词是"**组织**"——**他自己通常不拥有船、不拥有飞机、不拥有卡车、不拥有码头。**他拥有的是三样东西:**舱位的批发采购能力、跨越十几个环节的操作能力、以及一张覆盖目的国的代理网络。**

先把他的完整服务清单摆出来,共九项。这张清单的用处不是让你背,是让你知道**哪些是你在付钱买的、哪些是他免费送的、哪些他其实没做**:

| # | 服务 | 具体动作 | R&B这一单他做了吗 |
|---|---|---|---|
| 1 | **订舱**(见13.3.1) | 向船公司/航司/专线渠道订下舱位与船期,出订舱确认 | ✓ 你签回的那份 |
| 2 | 提货/拖车 | 派车到工厂拉货,或安排整柜拖车 | ✓ 那辆四米二 |
| 3 | 仓储与集货 | 在CFS仓收货、量方、称重、暂存待配 | ✓ 你今天站的那间仓库 |
| 4 | 拼箱/装柜 | 把多家货配载进同一柜,或指导整柜装载 | ✓ |
| 5 | **报关** | 向海关申报出口(见18.2.1) | ✓(他外包给合作报关行) |
| 6 | 报检/换证 | 法定检验、通关单、产地证代办(见16.3) | 本单不需法检 |
| 7 | 单证 | 出提单/运单、协助制作装箱单唛头(见16.1) | ✓ 货代收货凭证 |
| 8 | 保险代办 | 代投货运险 | ✗ **他说专线代投不了(见17.7)** |
| 9 | 目的港服务 | 通过代理网络办清关、换单、派送 | ✓ 专线的第二三段 |

**现在讲他怎么赚钱,四个收费点,这是全节最该看懂的部分。**行业里没人主动告诉你这个,但你必须知道,否则你不知道自己在跟一个什么样的激励结构打交道:

**收费点一:运费差价(主收入)。**他从船公司/航司买断一批舱位,以批发价拿货,再零售给你。差价可能是5%,也可能是50%,取决于航线冷热和你的议价能力。**这一块是他应得的——他承担了空舱风险和垫资风险。**

**收费点二:本地费用的加价。**THC、文件费、报关费这些项目,他向你收的和他实际付出的可能不一样。比如报关行收他¥280,他向你收¥350。**这一块也算合理,但幅度要盯着:超过30%就该问。**

**收费点三:目的港返佣——这一块是暗的,也是17.2.2那个陷阱的资金来源。**这里要引出一对必须掌握的行话:

- **自控货(free hand)**:由发货人自己选择货代的货。货代的收入来自发货人这一头。
- **指定货(nominated)**:由收货人(或其在目的港的货代)指定承运货代的货。这种情况下,起运港的货代往往只收一个象征性的费用甚至倒贴,**它的真实收入来自目的港代理的分成。**

**13.3.1那个"FOB指定货代扣提单要USD 380"的事故,现在你可以从资金流的角度重新理解它了:那家货代的钱在买方那头,你对它而言不是客户,是货物本身。**你付的每一笔"莫名其妙的费用",都是它在把本该由指定方支付的成本转嫁给唯一能被它卡住的人——你。

**收费点四:增值服务费。**贴唛、换包装、拍照、验货、代垫税金的资金占用费。这些通常明码标价,而且往往很值——**让货代代拍装箱照收¥50,比你飞一趟胶州便宜太多。**

**最后一层关系必须理清:货代、NVOCC、船公司,三者是什么关系。**

**NVOCC(Non-Vessel Operating Common Carrier,无船承运人):它不拥有船,但以"承运人"的身份对货主签发自己的提单,并承担承运人的责任。**它再以托运人的身份向真正的船公司订舱,拿到船公司签发的提单。于是同一票货有两份提单:

```
你(发货人)
   │  托运
   ↓
NVOCC / 货代 ────签发────→ HB/L(House B/L,分提单,抬头是货代)  → 给你
   │  再托运
   ↓
船公司(实际承运人)──签发→ MB/L(Master B/L,主提单,抬头是NVOCC) → 留在货代手里
   │
   ↓
目的港:货代的目的港代理凭MB/L向船公司提货,再凭HB/L向收货人放货
```

**两份提单的差别在出事的时候才显形:**你手上的HB/L,签发人是货代;它破产、跑路、或者拒不放货,你手上这张纸对船公司没有任何约束力。**所以"这家货代有没有NVOCC资质"是一个值得问的问题**——中国的NVOCC需要在交通运输部备案并缴纳保证金(常见80万元),备案号可以在官网查到。**有备案的至少意味着:出事时有一笔钱在那儿,并且它的经营是被监管的。**

问完这个,你顺口问了小林:"你们公司是几级?"

他答得很痛快:"我们是青岛本地一级货代,有自己的报关行和NVOCC备案。**但你这票走的专线,是我们跟一家专做北美派送的同行合作的——这一段我们是转的。**"

**这句话是这一整节里最重要的信息,而且它是你主动问出来的。**它的含义:头程订舱、报关、仓储是小林公司自己做的(所以出问题他能立刻处理);而目的国清关和派送是另一家公司做的(所以出问题他要转一手,响应会慢)。**知道这条边界在哪里,你才知道货到温哥华以后如果出事,该给谁打电话——以及,该在什么时候提前打。**(事故三就发生在这条边界的另一侧,见18.4.1。)

本节动作两条。①**在第一次合作前,把这张九项服务清单发给货代,让他逐项标注"含/不含/另收费"**——这一张表能挡掉后面80%的"这个还要另外收钱吗"。②**永远问一句"这条线你们自己做还是转的"**,然后把答案记在联系人备注里。**一手的价格未必最低,但一手的响应速度在出事那天值一万块。**

### 17.5.2 筛选五问与报价单杂费逐条问

上一节讲清了货代是什么。这一节解决一个更现实的问题:**你怎么从一堆报价里挑出那个能把货送到的人。**

先说一个反直觉的判断:**在货代这件事上,最低价几乎从来不是最优解——但原因不是"便宜没好货",而是"低价必然对应一个你没看见的收费点"。**17.2.2讲的目的港倒挂、17.1.2讲的all-in陷阱、17.5.1讲的指定货返佣,三件事指向同一条规律:**这个行业的总成本是相对刚性的,一份报价比另一份低30%,不是因为它效率高,是因为它把这30%放在了别的地方。**你的任务不是找最便宜的,是**找那个把所有费用都写在纸上的**。

**筛选五问,顺序不能乱**——前三问筛能力,后两问筛关系。你在正式合作前把这五问发过去,收到的回答质量,比任何"朋友推荐"都可靠:

**问一:你们有没有自己的报关行?还是外包?**
——为什么重要:报关是唯一一个能让货物卡在国门里的环节。自有报关行意味着出问题时,处理链条上少一家公司、少一个时差。**外包不是问题,不告诉你是外包才是问题。**追问一句:"报关是你们自己做还是找XX报关行?他们的对接人电话能不能给我?"

**问二:目的港/目的国的代理是谁?公司名给我。**
——为什么重要:17.5.1讲过,货到目的港以后,你的一切都靠这家你没见过的公司。**一家能痛快说出代理名字的货代,和一家含糊其辞的,是两种生意。**加一句杀伤力更强的追问:"这家代理跟你们合作多久了?"——合作两年以上的关系里,你的货是"老关系的货";合作两个月的关系里,你的货是"新客户的货"。

**问三:所有费用能不能书面全列,并写明"除此之外无其他费用"?**
——这是五问里唯一一个必须落在纸面上的。口头承诺没有意义。**具体要求:一份Excel或PDF,列出起运港每一项、海运/空运费、目的港每一项,标明"按票/按方/按公斤",并在末尾加一句 `No other charges apply for this shipment.`**——大部分货代不会拒绝这个要求,但**有相当一部分会在写的过程中"想起来"两三项之前没提的费用**。那正是这一问的价值。

**问四:出问题的赔付条款是什么?把原文发我。**
——不是问"你们负不负责",是要那段文字(17.4已经给你看过一段真实的)。**要看的三个数:赔付上限的计算基数(运费的几倍还是声明价值)、绝对金额天花板、以及除外责任清单里有没有"海关查验"。**

**问五:账期怎么算?能不能月结?**
——这一问表面上问钱,实际上问的是**他愿不愿意认你**。新客户通常要求预付或货到付款;能给你月结(30天)的,意味着他把你当长期客户,也意味着**你的运费占款期被拉长了30天**——对现金流紧张的新手,这一条的价值不比价格低(现金流机制见14.5.1)。反过来,**如果一家从没合作过的货代第一票就主动给你月结,你要多想一层:他是不是打算在别的地方赚回来?**

**现在讲报价单怎么逐条对。**下面这张表是你和小林第一次通话后自己整理的,后来变成了你的固定模板。**用法:把货代发来的报价单,一项一项填进这张表,填不进去的、或者表里有而报价单没有的,就是你要问的。**

| 段 | 费用项 | 计费方式 | 谁付 | 必问的那句话 |
|---|---|---|---|---|
| **起运港** | 提货/拖车 | 按票/按趟 | 卖方 | 从哪个地址提?超公里怎么算?等待费怎么算? |
| | 仓储/集货 | 免费期+超期 | 卖方 | **免费存放几天?超了按方按天多少?** |
| | 报关费 | 按票 | 卖方 | 含不含商检、产地证、单证录入? |
| | 起运港操作费 THC/CFS | 按方/按柜 | 卖方 | 20GP和40HQ分别多少? |
| | 文件费 DOC | 按票 | 卖方 | 出几份单据?加签、改单另收吗? |
| | VGM/EDI/铅封 | 按柜/按票 | 卖方 | 有没有别的"小项"没列? |
| **海运/空运** | 运费 | **按方/按kg/按柜** | 看条款 | **单价是多少?最低计费是多少?** |
| | 附加费 BAF/CAF/PSS | 按柜/按方 | 看条款 | **有效期内会不会加?加的话提前几天通知?** |
| **目的港** | DTHC/DDC | 按方/按柜 | 看条款 | **金额?按方还是按票?**(见17.2.2) |
| | CFS拆箱费 | 按方 | 买方(LCL) | 有没有最低一方? |
| | 换单费 D/O | 按票 | 买方 | |
| | 清关代理费 | 按票 | 看条款 | 含不含HS归类咨询?(见18.1.1) |
| | 关税/进口税 | 按货值 | 看条款 | **包税的话,按什么货值申报?**(见13.3.2) |
| | 派送 | 按票/按公里 | 看条款 | **含不含卸货?收货人有没有卸货台?尾板车加不加钱?** |
| **异常** | 查验费 | 实报实销 | ? | **由谁先垫付?有没有上限?** |
| | 滞港/仓租 | 按天 | 买方 | 免费期几天? |
| | 改单/退关 | 按次 | 卖方 | |

最下面那一栏"异常"是新人最常漏的,而它恰恰是最贵的。**给你一句必须问出口的话:"如果货被海关查验,查验费和产生的仓储费由谁先垫付?事后怎么结算?有没有金额上限?"**——这个问题的答案在事故三里会救你一次(见18.4.1,查验相关杂费约CAD 150,货代代付后实报实销)。**"货代先垫、事后实报实销"是最理想的答案,因为它意味着货不会因为等你打钱而多躺三天。**

对话样本,标出真话和托辞。你把上面这张表发给另一家货代询价,对方回:"兄弟,我们这行没那么复杂,一口价¥1,250到门,你放心走。"

你追问:"目的港费用含吗?查验了怎么办?"

回:"含的含的,我们做了十年,从来没查过。"

**"从来没查过"这五个字是本章最典型的托辞。**它把一个概率问题偷换成了经验陈述。正确的追问只有一句:"那如果这次查了,费用算谁的?写在报价单上行吗?"——**一个肯把"没查过"写成"查了我承担"的人,你可以合作;一个只肯口头说"没查过"的人,他其实已经回答了你的问题。**

本节动作:把上面那张表存成一个文件,命名"货代询价对照表",**每问一家就复制一份填一次**。填完三家之后,你会看到一件很有意思的事——**三份报价的总价可能差不到10%,但漏项的位置各不相同。**那些漏项,就是这三家公司各自打算在哪里赚你的钱。**看懂漏项分布,比看懂价格高低更接近真相。**

## 17.6 装箱优化:嵌套图解、托盘与柜型匹配

在货代仓库的最后十分钟,你注意到一件事:你的五个箱子是散着码在地上的,而旁边那批LED灯带整整齐齐码在一块木托盘上,外面缠了一圈又一圈透明薄膜,像个粽子。

你问小林:"我这个要不要也弄成那样?"

他摇头:"五个箱子打托?托盘本身就占0.13个方,你的货才0.48方。**打托是给大货用的,小货打托是花钱买体积。**"

这句话是本节的入口。装箱优化这件事,在不同的货量级上,答案是完全相反的——**小货优化的是"怎么让方数变小",大货优化的是"怎么让柜子装满"。**这一节把两头都讲透。

**第一部分:嵌套,以及它的图解。**

4.6.2用文字描述过嵌套的动作,这里把它画出来,因为**有一半的装箱错误来自"方向"而不是"数量"**:

```
【正确】同向嵌套 —— 八顶帽檐全部朝同一方向,整摞横躺放入箱内

  帽檐方向 →→→→→→→→→→→→
  ╭─╮╭─╮╭─╮╭─╮╭─╮╭─╮╭─╮╭─╮
  │1││2││3││4││5││6││7││8│      摞高 25-28 cm
  ╰─╯╰─╯╰─╯╰─╯╰─╯╰─╯╰─╯╰─╯      (每加1顶只涨约2cm)
  └── 后一顶的帽冠钻进前一顶的空腔 ──┘

【错误一】反向对插 —— 檐尖顶檐尖

  ╭─╮╭─╮  ╭─╮╭─╮
  │1││2│  │3││4│           受力集中在檐尖 → 檐芯塑性形变(见17.3.2)
  ╰─╯╰─╯  ╰─╯╰─╯           摞高不降反升,白占体积

【错误二】竖立码放 —— 帽冠朝上一顶一顶摆

  ╭─╮ ╭─╮ ╭─╮              完全放弃嵌套:每顶独占 11-12cm 高度
  │ │ │ │ │ │              同样一箱只装 45-50 顶 → 方数翻倍(见4.6.2)
  ╰─╯ ╰─╯ ╰─╯
```

**装箱台上判断对错,只看一件事:整摞的帽檐是不是全都指向同一边。**这是你验货时(见11.5)在装箱环节唯一需要做的动作,两秒钟。

**第二部分:箱规不是随便定的——60×40这个尺寸背后有一整套体系。**

这是本节最有价值、也最少人讲的一层。工厂给你的标准箱是60×40×40cm,你可能一直以为是习惯。不是。**600×400毫米是国际物流的基础模数**,整个托盘、货架、卡车车厢、集装箱的尺寸体系,都是从这个模数往上搭的:

```
基础模数              600 × 400 mm
欧标托盘 EUR-pallet  1200 ×  800 mm = 4 × (600×400)   ← 整除
美标托盘 GMA         1200 × 1000 mm = 5 × (600×400)   ← 整除
```

**所以你那个箱子放在任何一种标准托盘上,都能铺满不留缝。**这不是运气,是设计。反过来说:**如果哪天工厂给你报一个"65×45×35"的怪箱规,你要立刻警觉——它在托盘上一定铺不满,而铺不满的代价会在装柜那一刻兑现。**

带你算一遍这个代价。假设你有一票大货要打托,用美标托盘:

```
托面 1200 × 1000 mm,箱底 600 × 400 mm
  → 每层 = (1200÷600) × (1000÷400) = 2 × 2.5 = 5 箱,铺满,零浪费 ✓

如果箱规改成 650 × 450:
  → 每层 = (1200÷650=1) × (1000÷450=2) = 2 箱……剩下一大片空地
  → 或者交错摆放勉强放3箱,托面利用率 从 100% 掉到 73%
```

**箱规差5厘米,托盘利用率差27%。**这就是为什么大客户会在规格书里硬性规定外箱尺寸——**他们规定的不是箱子,是他们仓库货架和托盘的匹配关系。**

**第三部分:托盘与柜型匹配,以及"托盘吃掉10-15%柜容"的完整算法。**

先定义两个词:

- **托盘(pallet,行话叫"卡板""栈板")**:承载货物的平台,通常木质,便于叉车整体搬运。标准高度约15cm(含承重梁)。
- **打托(palletizing)**:把纸箱码上托盘,用**缠绕膜**(拉伸膜)裹紧固定,四角加护角防止边缘被勒变形。

现在算40HQ里能放多少个美标托盘,以及打托之后到底损失了多少:

```
40HQ 内尺寸  12.03 m × 2.35 m × 2.69 m

【单层托盘排布】
  宽度方向:2.35 m ÷ 1.00 m = 2 列(占 2.00 m,剩 35 cm 走空)
  长度方向:12.03 m ÷ 1.20 m = 10 排
  → 单层 2 × 10 = 20 托(旋转交错可挤到 21 托)

【每托装几箱】
  每层 5 箱(见上),堆几层看高度:
  堆 6 层:货高 6 × 40 cm = 240 cm,加托盘 15 cm = 255 cm < 269 cm ✓
  堆 7 层:货高 280 cm + 15 cm = 295 cm > 269 cm ✗ 装不进去
  → 每托 6 × 5 = 30 箱

【结果】
  打托装载 = 20 托 × 30 箱 = 600 箱
  散装装载 = 68 CBM ÷ 0.096 = 708 箱(见17.1.1)
  ────────────────────────────────────
  柜容利用率 = 600 / 708 = 84.7%
  → 打托吃掉 15.3% 的柜容 ≈ 108 箱 ≈ 10,800 顶帽子
```

**损失的15%来自三处,每一处你都能看见:**①托盘自身15cm的高度,乘以只能放一层托盘,吃掉整柜高度的5.6%;②宽度方向2列托盘占2.00米,柜宽2.35米,剩下的35厘米没法用,吃掉14.9%的宽度;③每托堆6层用掉240cm,柜内还剩14cm白白空着。**三处叠加,又互相抵消一部分,净损失落在15%附近——这就是"10-15%"这个行业经验值的完整来源。**

**那还打不打托?**给你判断规则,三条:

**规则一:客户仓库有没有叉车和卸货平台,是第一决定因素。**没有平台的小客户(比如Mike的酒厂后门),托盘反而是麻烦——他要拆膜、拆托、把箱子一个个搬进去,还要处理一个没用的木托盘(北美处理废木托盘要花钱)。**有平台的仓库、连锁零售的DC、亚马逊FBA仓,则往往强制要求打托。**

**规则二:算一算15%的柜容值多少钱,再看打托省多少人工。**一个40HQ全程¥12,000-24,000,15%就是¥1,800-3,600;而不打托的散装要人工"顶天立地"码货,装柜费从¥500涨到¥800-1,200,卸货也要人工。**大致的分界:货值高、目的地人工贵(北美欧洲)、客户有平台 → 打托;货值低、量大、客户是仓库 → 散装。**

**规则三:走海运熏蒸别忘了。**木托盘出口必须做**IPPC熏蒸处理**并加盖标识(国际植物保护公约要求),否则目的国海关会拒绝入境或强制处理。**替代方案是免熏蒸的胶合板托盘或塑料托盘**,贵一点但省掉一道手续和风险。**这一条每年都有人栽,因为它是唯一一个"托盘本身能让整柜货被扣"的规则。**

**第四部分:堆码层数,给你一个公式。**

散装装柜时,底层的箱子要承受上面所有层的重量。什么时候该担心压塌?

```
允许堆码层数 N = P ÷ (K × W)  + 1

P = 空箱抗压强度(kgf)。60×40×40 五层瓦楞箱常见 500 - 700 kgf
K = 安全系数。海运取 5 - 7(湿度使纸箱强度降40-50%,长期堆码蠕变再降20-30%)
W = 单箱毛重(kg)

代入帽子箱:P=600,K=6,W=10.1
  N = 600 ÷ (6 × 10.1) + 1 = 9.9 + 1 ≈ 10 层
柜内高度允许的层数:269 cm ÷ 40 cm = 6.7 → 6 层
```

**结论:帽子是"高度先到限,强度还有富余"。**所以帽子箱可以放心顶天立地码到6层,不用担心底层压塌。**但如果你哪天改做五金或者布卷(单箱25-30公斤),这个公式算出来会是3-4层,那时候强度就成了硬约束**——这也是为什么重货装柜必须留"呼吸层"或加隔板。

本节动作三条。①**下单时把箱规写进PI,而且优先选600×400模数的标准箱**(60×40×40、60×40×30、60×40×25),别让工厂用它库存里那个"差不多的箱子"。②**问客户一句:"你的收货地址有没有卸货平台和叉车?"**——这一句决定打不打托,而它必须在报价之前问,因为打托会改变方数和运费。③**大货装柜前,要一张"装柜方案图"**:每托几箱、几层、柜内怎么排、总共几托几箱。**一张图能挡掉的,是装柜工现场随手一码、最后三箱塞不进去只能拆封重装的两个小时。**

## 17.7 货运保险:险种、费率、索赔

13.4结尾给过你一句很硬的建议:**"哪怕走包税,只要货值上了一两万人民币,都值得自己另外买一份货运险。"**

那天从货代仓库回来,你就是照这句话去做的。这一节讲的是——**你按书上说的去做了,然后发现现实比书上复杂;以及你最后怎么决定的。**这一节的价值一半在知识,一半在那个决定本身。

**先把知识补齐,三件事:险别、费率、流程。**

**险别。**13.4已经定义过《协会货物条款》**ICC(A)(B)(C)** 三级,这里把它做成一张能直接用的对照表——**你只需要知道自己的货最怕什么,然后往上找那一栏:**

| 风险 | ICC(C) | ICC(B) | ICC(A) |
|---|---|---|---|
| 船舶沉没、搁浅、触礁、火灾、爆炸 | ✓ | ✓ | ✓ |
| 陆上运输工具倾覆、出轨 | ✓ | ✓ | ✓ |
| 共同海损牺牲、抛货 | ✓ | ✓ | ✓ |
| 地震、火山爆发、雷电 | ✗ | ✓ | ✓ |
| **海水/湖水/河水进入船舱、集装箱** | ✗ | ✓ | ✓ |
| 整件在装卸时落海或摔落 | ✗ | ✓ | ✓ |
| **雨淋、淡水浸湿、受潮发霉** | ✗ | ✗ | ✓ |
| **偷窃、提货不着、短量** | ✗ | ✗ | ✓ |
| **包装破损、钩损、污染、串味** | ✗ | ✗ | ✓ |
| 战争、罢工 | 均需另加保 | 均需另加保 | 均需另加保 |

**把最后几行加粗的那些再看一遍:雨淋、受潮发霉、偷窃、破损——这四样恰好是帽子在海运中最可能出的事,而它们只有ICC(A)保。**13.4那位赔了USD 3,450的同行,栽的就是这一格。**所以对纺织品,ICC(A)不是"更好的选择",是唯一的选择。**

**费率。**普通纺织品海运,**ICC(A)约0.08%-0.15%,ICC(B)约0.05%-0.10%,ICC(C)约0.03%-0.08%**(与13.4口径一致)。影响费率的因素按权重排:目的地(南美、非洲、中东部分港口费率翻倍)、运输方式(空运比海运低,因为在途时间短)、包装方式(裸装、拼箱高于整柜)、货物本身的易损性、以及你的历史赔付记录。

**但有一个数比费率更重要,新人几乎都不知道:最低保费。**保险公司出一张保单的固定成本摆在那儿,所以**每张保单有最低保费,常见¥30-100,或USD 20-30。**这意味着:

```
保额 ¥28,314(发票金额¥25,740 × 110%,见13.4)
按 ICC(A) 费率 0.12% 计:28,314 × 0.12% = ¥ 34
最低保费门槛:                            ¥ 50
→ 实际应缴:¥50(按最低收)

保费占货值 = 50 ÷ 25,740 = 0.19%
保费占本单毛利 = 50 ÷ 13,790 = 0.36%
```

**¥50,占毛利的0.36%,换掉整批货的物理风险敞口。**从纯数学上看,这是全书里性价比最高的一笔支出,没有之一。

**投保流程,四步,一次做完十五分钟:**
① **填投保单**:货物名称与包装(500 PCS caps in 5 cartons)、保额与币种、运输工具与航次/运单号、起讫地(**必须写"仓至仓"**,即工厂仓库到收货人地址,见13.3.3)、险别(ICC(A))、被保险人。
② **保险公司出单**,你付保费,拿到保险单(policy)。
③ 若是CIF(见13.3.2),**在保单背面背书转让给买方**,连同其他单据一起交单(见16.1)。
④ 留存保单副本,并**把保单号发给收货人**——出事时他要在目的港凭它找检验代理。

**索赔流程,五步,顺序错一步可能全盘皆输:**
① **卸货时发现异常,当场向承运人书面提出保留**(行话叫"提保函"),并在**卸货后3天内**书面通知。**这一步是全部的关键:没有向承运人书面索赔的记录,保险公司可以以"你放弃了追偿权"为由拒赔。**
② **立即通知保险公司或保单上列明的目的港检验代理**——保单背面永远印着一份全球检验代理名单,那不是装饰。
③ **申请检验,取得检验报告(survey report)**。**在检验人到场之前,不要移动、不要处理、不要丢弃受损货物和包装。**照片要拍箱外、箱唛、拆封瞬间、货物受损处、以及集装箱内部(如果能拍到)。
④ **备齐索赔单证**:保险单正本、提单/运单、商业发票、装箱单、检验报告、向承运人索赔的函件及其回复、货物残损清单、修理或处理费用凭证。
⑤ **索赔时效**:海洋货物运输保险通常为**自货物卸离海轮之日起2年**;向承运人的索赔时效更短(海运一般1年)。**先向承运人索赔,再向保险公司索赔——顺序不能反。**

**免赔额。**保单上常见一行 `Deductible / Franchise`,分两种,差别很大:
- **绝对免赔额(deductible)**:损失超过免赔额的,**扣除免赔额后赔**。损失¥3,000、免赔¥500,赔¥2,500。
- **相对免赔额(franchise)**:损失超过免赔额的,**全额赔**;不超过的,一分不赔。损失¥3,000、免赔¥500,赔¥3,000;损失¥400,赔0。

小额货运险常见的设定是"**每次事故绝对免赔USD 100或保额的0.5%,以高者为准**"。**对R&B这单:0.5% × 28,314 = ¥142,USD 100 ≈ ¥710,取高者¥710。**这意味着:**低于¥710的损失自己扛,比如碰坏两三顶帽子。**这不是保险公司耍赖,是为了避免大量小额理赔把制度拖垮——**你要做的是知道这条线在哪,然后在这条线以下靠包装解决问题。**

**现在讲你实际做了什么,以及为什么最后是那个决定。**

你给小林发消息:"这票我自己买份货运险,ICC(A),保额¥28,314,你们能代投吗?"

他回得很快,而且很实在:"**专线的货我们代投不了。**两个原因:一,专线没有海运提单,保险公司的水险条款是按提单走的,投保单上'运输单据号'那一栏我只能填我们自己的运单号,很多财险不认;二,专线是我们和目的港那家的合作渠道,**货权和责任链条在保险公司眼里是不清楚的**,他们不太愿意接。你要保的话得自己找。"

你自己打了三通电话:

- 第一家财险:"专线拼货、单票两万多,我们最低保费¥300起,不划算。"
- 第二家:"双清包税渠道我们暂不承保。"
- 第三家(某平台的一单一保产品):可以接,**保费¥52**(0.18%,专线渠道加费三成),但条款里两句话让你停住了:"运输单据号为承运人运单号";"发生损失时,被保险人应先向承运人索赔,保险人在承运人赔付不足部分内承担责任。"

**第三家能保。所以问题不是"能不能",是"值不值"。**你在纸上算了四笔账,这四笔账是本节的落点:

**账一:你真实的敞口不是货值。**尾款已经在交仓前到账了(见14.1.2的"款到交仓")。也就是说,货全损时,**这4,870加元你已经收进来了**。你真正的损失是什么?是你**在商业上必须重做一批**——否则Mike的九月活动没了、这个客户没了、他在温哥华精酿圈的口碑传播也没了。重做的成本:货款¥8,750 + 运费¥1,400 = **¥10,150**(制版费不用再出、版权归己见9.4.2;确认样已封样见10.6,不用重打)。**所以敞口是¥10,150,不是¥25,740。**

**账二:专线的赔付能覆盖一部分。**运费三倍 = ¥4,200(见17.4)。全损时它至少赔这个数,缺口 = 10,150 − 4,200 = **¥5,950**。

**账三:概率的量级。**海运集装箱的全损(沉船、火灾、落海)是万分之几的量级;真正常见的是部分损失——受潮几顶、破损几箱。**而部分损失恰恰在专线赔付和保险免赔额之间的那个尴尬区间里:¥710以下自己扛,¥710到¥4,200专线能赔一部分。**保险真正能救你的,是"整箱进水报废"以上的情形。

**账四:¥52买的是什么。**用¥52覆盖一个¥5,950的缺口,期望值上肯定划算。**但那份保单里有一句"先向承运人索赔,保险人在赔付不足部分承担责任"——这意味着理赔时你要先跟专线打一轮,再跟保险公司打一轮,而专线的条款里明确排除了海关查验损失。**流程摩擦是真实成本。

**你最后的决定:这一单不投,同时立一条从下一单起生效的规则。**

理由三条,坦白讲给你听,因为这个决定不是标准答案,是一个具体处境下的权衡:①敞口是¥10,150而不是货值,且尾款已落袋,**你输得起**(回看13.1.1那条"任何时点的敞口不超过你能一次性亏掉的金额"——这个数在你这里是几千到一两万);②你把钱花在了别的地方,而且花得更准:**每箱两包干燥剂、五层瓦楞箱、嵌套摞高控制在26cm、封箱前两张照片(见4.6.2)**——这些加起来不到¥50,防的是发生概率高得多的受潮和挤压;③你在给Mike的邮件里加了一句,**把风险的另一半用条款处理掉了**:`Please inspect and photograph the cartons within 48 hours of delivery and report any visible damage immediately.`——**48小时验收条款,是没买保险的人唯一能拿到的证据保全手段。**

**然后是那条规则,你把它写在了笔记本第一页:**

> **从下一单起:单票货值超过¥30,000(约CAD 6,000),或者货值大于运费的10倍时,一律另投ICC(A)货运险,保额发票金额110%,仓至仓,并在选择物流渠道时优先选能出海运提单、能代投保的渠道。**

**为什么是¥30,000?**因为在这条线以上,重做成本会超过你一次能承受的现金损失;**为什么加"货值大于运费10倍"这一条?**因为专线的赔付上限挂在运费上——**运费越低、货值越高,赔付覆盖率越差。**R&B这单是25,740 ÷ 1,400 = 18.4倍,覆盖率16.3%,已经在警戒线上了;**如果哪天你走一票货值¥80,000、运费¥2,000的货,倍数是40,覆盖率只有7.5%——那时候不投保就是裸奔。**

**本节最后一句,也是13.4那句建议的修正版:书上说"值得买",现实里小货常常"买不到或买得别扭"。真正专业的做法不是硬买,是——把敞口算清楚,知道自己在裸奔哪一段,然后要么用钱补上,要么用包装和条款补上,要么明确接受它。最怕的从来不是没买保险,是没算过。**

## 18.1 HS编码

### 18.1.1 6505类目与材质归类:一顶帽子的税号怎么定

报关单上那个十位数字,是这张表里唯一一个"全世界通用"的东西。你把截图放大,商品编号那一栏写着 **6505** 打头的一串数。

先把词定死。**HS编码**,全称"商品名称及编码协调制度"(Harmonized System),由世界海关组织(WCO)维护,全球两百多个国家和地区共用;它把地球上所有能被买卖的实物商品编进一棵树:**21类、97章、上千个四位品目、几千个六位子目**。这棵树的**前六位全球统一**——你在中国报的六位数,和加拿大海关、美国海关看到的六位数,一模一样;**第七位开始各国自定**:中国用八位(报关时还要再加两位海关监管附加,合计十位申报),美国的HTS是十位,加拿大也是十位。所以准确的说法是:**六位是世界语,后面是方言**。HS每五年修订一版(2017、2022、2028……),偶有商品搬家,查编码时要认准当期版本。

帽子住在**第65章:帽类及其零件**。整个第65章一共七个品目,你必须一次记全,因为分错品目就是分错税率:

```
6501 / 6502  帽坯(毡呢帽坯、编结帽坯)——半成品,不是能戴的帽子
6504         用编结材料或条带拼合制成的帽子 —— 草帽、拉菲草渔夫帽
6505         针织或钩编的帽类;用花边、毡呢或"成匹纺织物"制成的帽类
             ★ 棒球帽、dad hat、trucker、beanie、渔夫帽,全在这里
6506         其他帽类 —— 安全帽、塑料/橡胶帽、毛皮帽
6507         帽子零件 —— 汗带、帽衬、帽檐、帽带、帽箍
```

看清楚6505那一行的两个并列条件:**"针织或钩编的"**,或者**"用成匹纺织物制成的"**。前者说的是你那顶100%腈纶提花beanie(见1.1.4)——它是织出来的一顶,不经裁剪;后者说的是你的主款——21支108×58的磨毛斜纹(见1.2.2)是一匹布,买回来裁成六片再车成一顶(见4.2)。**一个是"织成帽",一个是"裁成帽",归类条文把两条路都写进了同一个品目**,所以你四个SKU(主款、速干款、beanie、trucker)全部落在6505。这不是巧合,是65章的设计:帽子按"用什么材料、怎么成型"分品目,不按用途分。

于是"什么影响归类"就清楚了,三个变量,按权重排:

**第一,材料大类。** 纺织物制的进6505,塑料/橡胶/毛皮的进6506,编结草茎的进6504。你那顶带PE檐芯(见2.3.2)的棒球帽会不会因为有塑料件掉进6506?不会——归类看**构成基本特征的材料**,帽身是棉,檐芯藏在布里面,基本特征是纺织品。这条规则来自归类总规则第三条:成套或混合材料的货品,按"赋予其基本特征的材料"归类。

**第二,针织还是梭织。** 在6505项下,八位子目和各国的税率经常按这条分岔。你的主款是梭织棉斜纹裁片缝制,beanie是针织腈纶,两者在中国的八位号列可能相同、在美国的HTS里几乎肯定不同、税率也不同(见18.4.2)。所以填申报要素时,"加工工艺"那一栏写"针织"还是"梭织",不是文字游戏。

**第三,纤维成分。** 棉制、化纤制、羊毛制,在很多国家分列不同税率;混纺按重量占比大的那一种定性,50/50按从后归类原则取靠后的那个。你的主款100%全棉,干净;但如果哪天你做TC65/35(见1.1.3),定性就是"化纤制"——**35%的涤纶不改变定性,65%的才算数**。

**有没有帽檐影响归类吗?** 在6505品目层面不影响,棒球帽和beanie同品目;但在部分国家的子目和统计后缀里,"是否遮盖头顶"(visor空顶帽,见2.1.2)是分列条件——空顶帽在美国HTS里就是单独一档。

最后给方法,四步,按可靠性从低到高:① **问报关行**——快,但报关行图省事,惯用"沿用上一票"的老号,只能当参考;② **自己查**——中国"国际贸易单一窗口"里有税则查询和商品归类的官方通道,输入关键词逐级下钻,把品目条文、类注章注读一遍;③ **查先例**——海关归类决定与归类指引是公开的,同类商品别人怎么归,是最有说服力的证据;④ **申请预裁定**。**预裁定**这个词值一千块:货物拟进出口**前3个月**,可以向海关申请对商品归类、原产地或完税价格作出预裁定,海关自受理起**60日内**出具决定书,**在境内各口岸通用,有效期3年**。什么时候值得办?量大、单一款式长期出、税率因归类差出几个点的时候——你现在五百顶不必办,等你一年出十万顶帽子那天,这张纸能替你锁死税号,谁也不能临时给你改。

本节动作:**把你主力款的六位HS编码写进规格表首页**,和材质、克重放在一起。这一行字有三个用处:向工厂确认申报口径、向货代要准确的目的国税率、向客户回答"这批货在我这边报什么税号"。多数新人做了三年外贸都答不出自己产品的税号——你从第一票就该答得出。

### 18.1.2 归错的后果:补税、罚款、扣货

税号是个抽象东西,直到它开始扣你的钱。这一节把"归错"的账,分中国端和目的国端,一笔一笔摆开。

**中国端第一笔:行政处罚。** 出口申报的商品编号错了,法律上叫**申报不实**。《海关行政处罚实施条例》给了两把尺子,你记住这两个比例就够了:**影响国家税款征收的**,处漏缴税款**30%以上2倍以下**罚款;**影响出口退税管理的**,处**申报价格10%以下**罚款。第二把尺子对帽子行业才是要命的——帽子出口本身没有出口关税,谈不上"漏缴",但归类一错就直接踩中"影响出口退税管理"。按你这票 CAD 4,950(约¥25,740)算,10%就是**两千五百多块**;按一个年出口八百万的小厂算,一票罚十万也不是新闻。

**中国端第二笔,也是帽厂真正怕的那一笔:退税被卡、被追回。** 机制在这里:出口退税申报要拿**出口货物报关单**和**增值税专用发票**去系统里比对,两张纸上的**商品名称、计量单位、数量口径必须能对上**。报关单写"针织帽",专票开"棒球帽";报关单归6505,工厂开票用的商品编码却是6506——系统一比对就跳出疑点,轻则退税暂缓、要求补充说明,重则转**函调**:税务机关发函到供货方所在地核实,一来一回三五个月,这段时间钱躺在账上不动。

一个具体到能闻见味道的案例。胶州同镇一家做化纤beanie的厂,常年出俄罗斯和东欧,量不小。报关行接单时图快,把100%腈纶的针织beanie按"其他材料制帽"报进了6506项下的一个号,一年出了**两万顶、货值80万元**。第一年没事,第二年退税申报时被系统比中:专票上写的是"针织帽",报关单上的商品名称却是"其他帽",归类不符。结果三条:第一,当期应退的 **80万÷1.13×13% ≈ 9.2万元** 全额暂缓;第二,函调半年后认定归类不实,已退税款追回,并按**每日万分之五**加收滞纳金——按九万本金压半年算,滞纳金约 **8,100元**;第三,也是最贵的一条,这家厂的**出口退税企业管理类别从二类降到三类**,后续每一票的退税审核期从十天变成两三个月。老板复盘时说的话很朴素:"罚款我认了,退税晚三个月才是要命的——我一年周转四次,现在变三次。"

**目的国端第三笔:补税、罚款、扣货。** 归类是进口国征税的依据,所以错得越久越贵。加拿大海关(CBSA)对进口申报有**四年**的追溯核查期,发现归类错误可以要求进口商提交更正申报、补缴关税与GST,并按其**行政罚则体系(AMPS)**处罚——这套罚则的特点是**按次累计、首犯再犯逐级加重**,单次几百加元起,一年出十二票就是十二次。美国海关(CBP)同理,报关单在"清算"(liquidation)前后都可能被重新审定,涉及虚假申报的追溯期更长。

这里有个新人必踩的认知误区,现在拆掉:**"是货代/清关行报的,不关我事"——这句话在任何一个国家的海关面前都站不住**。中国端,《代理报关委托书》(见16.7)白纸黑字写着报关行按委托人提供的数据申报,**数据错了责任在委托人**;加拿大端,法定责任人是**进口人**(importer of record,见13.3.2)。你走双清包税,进口人是货代的清关代理,看起来风险不在你——但货被扣住的是你的货,误的是你客户的活动,而对方的赔付上限通常只有运费的三倍(见13.3.2的事故)。**责任可以外包,损失不能。**

**第四笔,最容易被忽略:扣货本身的时间成本。** 归类被质疑,货不会立刻放行,先进查验流程:开箱、取样、有时送检。一次三到五天,加拿大西岸这类查验的场地费、搬运费、仓储费合计**一百到三百加元**是常态。你这单28-32天的时效设计里(见17.4),没有给这五天留过位置。

给你三个判断阈值,拿去用:① **同一款货,两票之间税号变了**——除非HS改版或规格真变了,否则一定是有人在"随手报",立刻问清楚;② **税率差超过3个百分点的两个可选税号**——不要自己拍,查先例或做预裁定,3个点在货值十万美元上就是三千美元;③ **报关单商品名称和你的增值税专用发票不是同一个词**——这是退税出事的第一号信号,出货当周就核,别等退税申报时才发现。

本节动作,一条,现在就做:**要一份报关单副本**。你这票的报关单在工厂外贸公司手里,微信一句话的事:"小周,这票的报关单能发我一份吗,我存档。"拿到手做三件事——把商品编号抄进你的产品档案;把品名和你CI上的英文品名对一遍;把数量、件数、毛重和16.1那张六数字核对卡再对一遍。**报关单是你这票货唯一一份由国家出具的凭证**,以后客户问、税务问、你自己复盘,都从它开始。

## 18.2 中国出口端

### 18.2.1 报关流程与进出口权

现在把那张截图彻底读完。报关单上真正决定命运的,其实只有六栏,其余都是配套信息:

```
境内发货人   青岛××进出口有限公司        ← 谁在出口(法律责任人)
境外收货人   RIDGE & BARREL BREWING CO.  ← 谁在进口
监管方式     一般贸易(代码0110)          ← 这票货按哪套规则管
商品编号     6505...                     ← 按什么征税/退税(见18.1.1)
申报数量/总价 500 个 / CAD 4,950.00       ← 值多少钱
件数/毛重/净重 5件 / 62.50KGS / 55.00KGS  ← 和PL、箱唛必须一致(见16.3)
```

**报关**,定义钉死:**进出口货物的收发货人或其代理人,在海关规定的期限内,向海关申报货物情况并接受海关监管、办结海关手续的全过程**。它是四步,顺序不能乱:

```
① 申报 → ② 查验 → ③ 征税 → ④ 放行
```

**① 申报。** 现在全部电子化,报关行在"中国国际贸易单一窗口"里录入报关单,数据源就是你交的那套CI、PL和委托书(见16.7)。出口货物应当在装货的24小时以前申报;实务里还有"提前申报""两步申报"等便利化模式。你要记的量级是:**资料齐全、无异常的一票一般贸易出口,从交单到放行,半天到一天**;全国出口整体通关时间的官方口径已经压到小时级。所以如果货代告诉你"报关要三天",那三天多半不是海关的时间,是他等拼柜、等资料的时间。

**② 查验。** 海关按风险布控抽查,也有纯随机抽查。出口查验比例低于进口,但不是零。查到了就开箱、核对品名数量、必要时取样送检。**查验产生的所有费用——掏箱、装卸、仓储、场地——由货主承担,查验合格也不退**。这条规则在中国和加拿大都成立,你在一个月后会亲身验证一次。

**③ 征税。** 帽子出口不征出口关税,出口环节的增值税适用"免税并退税"(下一节讲)。所以这一步对你几乎是空转——**但它是退税那条链的起点,因为报关单在这一步生成了正式编号**。

**④ 放行。** 海关发出放行指令,货物才能装船。小林发你的那张截图,底下有一行小字"已放行",那就是这批帽子在法律意义上离开中国的时刻。

四步讲完,回到那个刺眼的问题:**为什么第一栏不是你?**

因为你没有**进出口权**。这个词读者多半听过,但九成人不知道它其实不是"一张证",而是**六件事全部办完之后的一种状态**:

1. **市场主体登记**:公司或个体工商户的营业执照,经营范围里要有"货物进出口";
2. **对外贸易经营者备案**:向商务主管部门备案登记,这是"你可以做外贸"的身份;
3. **海关进出口货物收发货人备案**:拿到海关注册编码,这是"你可以报关"的身份;
4. **电子口岸入网**:办法人卡、操作员卡,报关、退税、外汇的线上操作全靠它;
5. **外汇**:银行开外汇结算账户,并在外汇局的"贸易外汇收支企业名录"里登记,这是"你可以合法收外汇货款"的身份;
6. **出口退(免)税备案**:向税务机关备案,这是"你可以拿那13%"的身份。

六件事办齐,总耗时两三周,直接成本从零到几百块(备案基本免费,电子口岸卡几百块)。**这就是全部门槛**——它便宜得让人惊讶,而绝大多数SOHO(见0.2)迟迟不办,原因不是办不起,是"先做起来再说"。

谁能办?**企业能办,个体工商户也能办,自然人不能办**。没有任何一条通道让一个个人以自己的名义报关出口——这就是你此刻的处境。摆在你面前的路只有三条:

**路一:借别人的正规抬头,也就是你现在走的这条。** 工厂有双主体(见8.1.1),它的外贸公司有全套资质,你的货挂在它名下出口。好处:合法主体、正规报关单、货物出得去;代价下面说。
**路二:找代理。** 外贸代理公司或外贸综合服务企业,以它的抬头代理出口、代办报关、代收汇甚至代办退税,收费量级 **¥300-800/票**,或按货值 **0.5%-1%**。适合有单没主体、且客户要正规单据的阶段。
**路三:买单出口。** 下一节整节讲,先给结论:**能走前两条,就别走第三条。**

现在把你这一票的真实结构摊开,这是本章最重要的一段话,读慢一点:

- **货的那条线**:工厂做货 → 外贸公司名义报关出口 → 报关单金额 CAD 4,950;
- **票的那条线**:工厂开一张增值税专用发票给自家外贸公司(按¥17.5那个口径,金额¥8,750),外贸公司凭它退税(见18.3);
- **钱的那条线**:Mike把4,870加元打给**你**的第三方跨境收款账户(见14.4),你再用人民币¥8,750付给工厂——**这笔钱既没有发票,也没有对应任何一张报关单**。

三条线,各走各的。海关看见一家公司出口了两万五千块钱的帽子;银行看见一个自然人收了一笔外币;税务看见工厂卖了八千七百五十块钱的货给自家贸易公司。**每一条单独看都成立,合起来对不上——而它们对得上,才叫合规。**

你后来问过老纪一句:"报关金额报的是我卖给客户的价,可你们只有八千七的票,这中间差的一万七,你们账上怎么走?"老纪笑了一下,给了一个非常典型的答案:"这个你不用管,我们财务有办法。"——**这句话你要听懂两层:第一层,他确实有办法,这类小票在产业带里天天在走;第二层,那是他的办法,不是你的办法。你在这条链上没有任何位置,也就没有任何保护。**

本节动作两条:① 把上面那六件事抄进你的备忘录,标题写"我什么时候办抬头"——判断阈值给你:**年出口货值超过30万人民币,或客户开始要正规单据/原产地证/进口凭证,就到点了**(怎么办、办哪种主体,见25.1);② 在此之前的每一票,都向出口方要**报关单副本**,并存进你的订单文件夹——你借了人家的抬头,至少要留下这票货真实出过关的证据。

### 18.2.2 买单出口:灰色在哪、风险在哪

驻厂那几天,隔壁小旅馆住着一个做手机壳的同行,晚上在楼下抽烟聊起来,你问他没公司怎么发货,他说得特别轻松:"买单啊,三百块一票,报关行全包,货照走。"

这就是**买单出口**:**没有进出口权的货主,向报关行或货代购买他人的出口报关抬头,以该抬头向海关申报出口**。行价一票 **¥200-800**,小票拼柜常见 **¥300-500**,你什么都不用提供,报关行手里养着一批"抬头",随手给你套一个。

先纠正一个仍在流传的行话。老一辈会说"买核销单"——**外汇核销单这个东西已经在2012年取消了**,现在的货物贸易外汇管理走的是总量核查和企业名录分类,没有单证可买。所以"买核销单"这个说法本身就是过时的行业黑话,你听到有人这么说,可以顺手判断一下他的信息新鲜度。今天买的是**抬头**,以及那张抬头之下生成的报关单。

灰色到底灰在哪?五条,一条比一条深:

**第一条,货与人的分离。** 报关单上的境内发货人是A公司,货是你的,合同是你和客户签的。货在口岸出任何问题——归类被质疑、涉嫌侵犯知识产权(你的帽子上绣着客户的商标,见16.7)、被要求退运——**海关只会找A公司,而A公司会说"这票不是我们的货"**。你手上没有一张纸能证明这批货是你的,又能同时证明你有权处置它。

**第二条,退税彻底没有。** 退税跟着报关抬头走(见18.3.1)。A公司没有对应的进项专票,它退不了;它若硬拿你的报关单去凑票退税,那叫**骗取出口退税**,是刑事罪名,而你是这条链上的供货源头。**所以买单出口的准确说法不是"退不了税",是"这票货的13%被永久放弃了"。**

**第三条,收汇合规不了,这一条最先炸。** 你的报关记录挂在A公司名下,你的外汇却收进个人账户。个人结售汇有**每人每年等值5万美元**的便利化额度,超了就要逐笔提供材料;而拿几个亲戚的额度分批结汇,叫**分拆结汇**,是明确的违规行为,一旦被银行反洗钱系统识别,轻则要求说明来源、暂停业务,重则进入关注名单,五年内所有个人外汇业务逐笔审核。**很多做买单出口的人,最后不是被海关抓住的,是被银行卡住的。**

**第四条,税务上这门生意"不存在"。** 没有发票、没有对公流水、没有申报收入。今天看是省了税,明天你要贷款、要签正规客户、要开对公户、要把公司卖掉——**你拿不出任何一份可以自证的经营记录**。第7章算过外贸的利润结构,一门年利润十几万的生意,如果账面上一分钱也不存在,它不是一门生意,是一份现金流。

**第五条,连带风险。** 一个抬头同时挂着几十家货主的票。只要其中任何一票涉走私、骗税、侵权被立案,这个抬头名下的全部报关记录都会被翻出来复查——**你的那一票,和它们躺在同一个抽屉里**。

那为什么这么多人在用?因为算术在短期里是站在他们那边的,把两边的账并排摆出来你就懂了:

| | 买单出口 | 自己办抬头 |
|---|---|---|
| 一次性成本 | 0 | 注册公司几百到两千 |
| 每票成本 | ¥300-500 | ¥0(自己报) |
| 年固定成本 | 0 | 代账 ¥3,000-6,000/年 |
| 退税 | **拿不到** | 货值的约11.5%(13%÷1.13) |
| 收汇 | 个人额度,灰 | 对公,合规 |
| 出事时 | 无人认领 | 你自己是责任人,也是权利人 |

按一年做50万人民币出口货值算:买单一年十二票,成本约¥4,800;自办抬头,注册加代账约¥5,000,**但退税能拿回 50万÷1.13×13% ≈ 5.75万元**。差额五万七——**这不是省钱与花钱的差别,是这门生意有没有利润的差别**(帽子代工的净利率是个位数,见7.3.1)。

所以给你一条明确的判断,不打太极:

> **能走正规抬头就别买单。** 买单只在一种情形下是可以接受的过渡:货值小(单票两三千美元以下)、无品牌无logo、客户不要任何正规进口凭证、你自己也放弃退税、并且这只是你办抬头之前的最后几票。**只要碰到以下任何一条,买单立刻从"过渡方案"变成"炸弹":货上有客户商标;客户要原产地证;客户是要抵扣进项税的注册商家;单票货值上万美元;或者你打算把这条线做上三年。**

你这一票同时踩中前两条(帽子上有R&B的绣花logo、目的国可能要原产地证明),所以哪怕当初有人劝你"买单省事",这一票也不能买单——**你借工厂的正规抬头,虽然憋屈,但方向是对的**。

本节动作:如果你现在正在用买单,做两件事保命——① 每一票都问报关行要**报关单副本和抬头公司全称**,存档,这是你唯一的痕迹;② 立刻停止分拆结汇,把收汇集中到一个可解释的通道上(见14.4),并给自己定一个日期:**下一票或者三个月内,办抬头**。这件事没有中间选项。

## 18.3 出口退税

### 18.3.1 原理与帽子税率:13%从哪来、退给谁

先讲人话版,再讲机制版。

**人话版**:一顶帽子在中国国内被生产出来的过程中,布厂、辅料厂、绣花厂、工厂,每一环节都交过增值税;这些税最终都藏在你付给工厂的那个价格里。国家的态度是:**货物出口了,就不该带着中国的税走**——因为那等于让中国的税跟着货去和别国的产品竞争。于是把货物在国内环节承担的增值税退还给出口方,这就是**出口退税**。所以第一句要钉死的话:**退税不是补贴,是把已经收上去的税还回去。** 明白这一点,你才不会在客户或同行说"中国靠补贴倾销"时哑口无言。

**机制版**,四个词一次性定义清楚:

- **增值税**:对商品流转中"增值"部分征的税,一般纳税人的基本税率是13%。
- **进项税**:你买东西时付给上游、由上游代收的那部分税,凭**增值税专用发票**(简称专票——注意,只有专票能抵扣,普通发票不行)抵扣。
- **销项税**:你卖东西时向下游收的税。
- **退税率**:出口货物能退的比例,按商品分档。**帽子(6505项下)的出口退税率是13%,和征税率一致**,所以不存在"征退税率差"——这对你是好事,意味着理论上能退干净。

退给谁?**退给报关单上的那个出口方**,而且它必须同时满足三个条件:**有进出口权、办了出口退(免)税备案、拿得到上游开来的增值税专用发票**。三个条件缺一不可,这就是9.7.3那句"谁的名义报关出口,退给谁"的完整版。

具体怎么算,按主体分两套,第8章点过一次(见8.1.1),这里给完整口径:

**外贸公司走"免退"**——从工厂买进、开专票,出口后凭票退:

```
应退税额 = 增值税专用发票上的不含税金额 × 退税率
```

代入你这一票:工厂开给自家外贸公司的专票,不含税金额 **500 × ¥17.5 = ¥8,750**(专票上另列税额 ¥1,137.50,价税合计 ¥9,887.50)。

```
应退税额 = 8,750 × 13% = ¥1,137.50
折合每顶 = 1,137.50 ÷ 500 = ¥2.275/顶
```

**生产企业走"免抵退"**——出口环节免税,对应的进项税先抵内销的销项,抵不完的部分再退。它的账要绕三步、还要算"不得免征和抵扣税额",帽子这种征退税率一致的商品算下来结果接近,但账面复杂、退税受工厂整体进项结构牵制。**这正是帽厂门口挂两块牌子的第一个原因**(见8.1.1):把出口放进外贸公司,一张票对一笔退税,干净。

时间维度也要给,因为退税是**现金流游戏**,不是利润游戏:报关放行 → 收齐专票并认证 → 在电子税务局做退税申报 → 税务审核 → 退库到账。正常节奏 **一到两个月**;企业管理类别好(一类、二类)的,快的三五个工作日到账;被降到三类四类的,函调一等就是几个月(见18.1.2那个案例)。所以老练的外贸公司谈价时会把"退税几时到账"折成资金成本算进报价——一年周转四次和三次,是两条利润曲线。

最后回到那个你已经猜到的问题:**这一票的¥1,137.50,退给谁?**

退给"青岛××进出口有限公司"。不是退给你。

而且更扎心一点:这笔钱在你付给工厂的价格里**早已被定过价**。老纪当初报¥17.5的时候,心里那本账是"退税还有一块钱左右回来"(见9.7.3),所以他敢报这个数。**换句话说,你已经间接享受了这13%——以更低的采购价的形式;你只是没有摸到过那张钱。** 这两者的区别在下一节的最后一段会变得非常具体。

本节动作,两条:① 从今天起,**每次询价都问一句:"这个价是含票价还是不含票价?"**——不含票价 vs 含13%专票的价,差的就是这13%(实务里工厂常说"要票加个点",那个"点"要问死是几个点);② 在你的供应商档案里加一栏"能否开13%专票"。这一栏现在看着没用,等你有了自己的抬头,**它直接决定你每一顶帽子能不能拿回¥2.275**。

### 18.3.2 退税与工厂定价:报价为什么能贴着成本

第9章留过一道题:如果有人报你 **¥15.8** 的同规格价,低于你拆出来的成本合计¥15.6只多两毛,他图什么?当时给了半个答案:退税。现在把另外半个补完——因为这半个答案才是真正有用的那半个。

先纠正一个几乎所有新人都会犯的错:**"工厂能退13%,所以每顶白赚¥2.275"——这是错的**,而且错得很危险,因为按这个理解你会去砍一个砍不动的价。

看清楚这笔钱的流向。外贸公司花 ¥9,887.50(含税)从工厂买进,退回 ¥1,137.50,净支出正好 ¥8,750——**对外贸公司,增值税是一条穿过去的管道,不留钱**。工厂收到 ¥9,887.50,其中 ¥1,137.50 是它的销项税,要交给国家;但它买布、买辅料时也付过进项税,可以抵扣。于是:

```
工厂实际要缴的增值税 = 销项税 1,137.50 − 它取得的进项税
工厂在这条链上的净现金收益 = 退税带来的销项被退 − 实缴 = 它能拿到专票的那部分进项税
```

结论一句话:**退税真正还给这条链的,就是"帽子身上背着的、有据可查的那部分国内增值税";工厂能拿到多少张专票,就能拿回多少。** 拿你的BOM(见9.1.1)算一遍,这一算你就彻底懂了帽厂的行为:

| 成本项 | ¥/顶 | 能否拿到13%专票 | 对应进项税 |
|---|---|---|---|
| 面料 | 1.5 | 能(布厂正规开票) | 0.195 |
| 里衬/檐芯 | 1.0 | 能 | 0.130 |
| 辅料(扣、气眼、标) | 2.5 | 多数能 | 0.325 |
| 绣花(外发) | 4.0 | **看厂,一半概率不开** | 0-0.520 |
| 水洗(外发) | 1.0 | **多数不开** | 0 |
| 后整/包装 | 0.9 | 能 | 0.117 |
| 裁剪车缝工缴 | 3.5 | 自有工人,无进项 | 0 |
| 管理摊销/损耗 | 2.2 | 部分 | 忽略 |

```
绣花不开票:0.195+0.130+0.325+0.117 ≈ ¥0.77/顶
绣花开票:  再加 0.520          ≈ ¥1.29/顶
```

落到区间就是 **¥0.8-1.2/顶的现金回流**——这个数和CANON里的口径、和9.7.3给你的"约¥1"完全对得上,**而它是算出来的,不是记住的**。500顶合计约¥400-600。

现在把它放进工厂的损益里,那句"敢贴着成本报价"才有分量:

```
账面毛利:  ¥1.9/顶 (17.5 − 15.6,约11个点)
退税回流:  ¥1.0/顶
真实落袋:  ¥2.9/顶  ← 退税占了三分之一强

极端情形:报价压到成本线 15.6,账面毛利 0
真实落袋:  ¥1.0/顶  ← 依然是一门生意
```

**对一条不能停的产线,零毛利接单+退税,就是利润本身**(停线的账见7.2.1)。1688上那顶¥13.9的"同款"、那张¥15.8的报价单,现在你有第四把解释刀了:减配(见9.2.2)、万顶阶梯(见9.7.1)、走量摊薄、以及**把退税折进价里的打法**。

这套机制还顺手解释了两件你早就该问、但一直没问的事:

**第一,为什么工厂那么爱用自己的外贸公司接你的单?** 因为只有走它自己的抬头出口,这¥1,137.50的退税申报权才在它手里;换成你买单出口或者用第三方代理抬头,这笔钱它就摸不着,那它给你的¥17.5立刻要往上抬。**所以"我这单挂你们外贸公司出口"这句话,在谈价桌上是有价值的筹码**——你把退税的资格送给了它,你有资格换点东西回来:免制版费、免样品费、账期宽两天、或者干脆压两毛钱。这是9.4.2里那笔"制版费200"最终能被划掉的隐藏原因之一。

**第二,为什么工厂对"要不要票"那么敏感?** 因为不开票,它省掉的是销项税;开票,它必须缴。所以那句"打老板个人卡再便宜两个点"(见8.1.2)不是随口喊的价,**那两个点就是它在这条链上的税差**——你现在能看懂它的定价逻辑了,但结论不变:**那两个点买断你三层保护,不能做**。

最后,把这一节转向你自己,这才是它真正的价值。这一票的¥1,137.50进了工厂的账;而当你有了自己的抬头(见25.1),同样一票货的账会变成这样:

```
今天(借抬头):  你的成本 = ¥17.5/顶(退税已折进这个价里,你摸不到)
将来(自己出口):你从工厂进货 ¥17.5 + 13%专票 = ¥19.775 实付
                 出口后退回 ¥2.275
                 净成本仍是 ¥17.5 ——但如果工厂给你的"含票价"只加了6-8个点
                 (行业常见:不含票¥17.5,要票¥18.6-18.9)
                 那么你的净成本 = 18.9 − 2.19 ≈ ¥16.7/顶,反而比现在低¥0.8
```

看懂这个算式,你就明白第25章那件事为什么非做不可:**有抬头之后,你不是"多了一项合规负担",你是把一笔本来不属于你的钱,合法地拿到了自己这一侧的成本表上**。500顶是四百块,五万顶就是四万块——而它一分钱新增销售都不需要。

本节动作:做一张"两条路对照表",两列——"借抬头:采购价17.5,退税0"和"自有抬头:采购含票价18.9,退税2.19,净16.7",把你手上真实的采购价代进去算一遍。**算出来的那个差额,就是你办抬头这件事的年化回报**;把它写在便签上贴电脑边,比任何鸡汤都管用。

## 18.4 目的国进口端

### 18.4.1 加拿大:BN号、CARM、MFN与GST(主线:Mike那头的清关)

货离开中国之后,你几乎把它忘了。三十天,足够你把整单的账重算两遍(第19章)、开始琢磨下一个客户。直到那个星期二的深夜。

先把这一头的规则讲清楚,因为半小时后你就要用上它。

**谁是进口人?** 加拿大和所有国家一样,清关的法定责任人是**进口人**(importer of record,见13.3.2)。正规做法下,进口人需要三件东西:

**第一,BN号(Business Number,商业号)。** 加拿大税务局(CRA)给每个企业发的**9位**主号,后面挂各种程序账户,格式是"9位数字 + 2个字母 + 4位数字"。进出口用的是 **RM 账户**——比如 `123456789 RM0001`,合起来15位,行内直接叫 **BN15**。没有它,一个加拿大企业无法以商业身份进口。GST账户是 `RT0001`,和进口账户是同一个主号下的两个门牌。

**第二,CARM 账户。** **CARM**,全称 CBSA Assessment and Revenue Management,加拿大边境服务局的评估与征收管理系统。它的意义在于:**加拿大把进口申报、对账和缴税从"清关行代办"改成了"进口商自己在门户里对账缴款"**。进口商必须在 CARM 客户门户里注册、绑定自己的 BN15,才能授权清关行代自己申报;每月拿到自己的对账单(Statement of Account),在规定日期前缴清。

**第三,财务担保。** 加拿大有一个叫 **RPP(Release Prior to Payment,先放行后缴税)** 的机制:货可以先放行,税款月结再缴。但要享受它,**进口商必须自己提供财务担保**(保函或保证金),不能再像过去那样"借用"清关行的额度。这条对小买家不友好——Mike这种五百顶的小客户,自己走一遍这套流程要花的时间和担保成本,远超过他省下的那点钱。

**这就是为什么你这一票走的是双清包税(见17.4)**:进口人不是Mike,是专线在加拿大的清关代理。Mike不需要BN15,不需要CARM,不需要担保,货到门,不再掏一分钱——这正是你报"到门价"的商业价值(见7.3.2)。但你心里要清楚:**这也意味着这一票货在加拿大是怎么申报的,你根本看不见**(这件事的代价,18.5算给你看)。

**税怎么算?** 三层,按顺序:

```
① 完税价格 VFD(Value for Duty)
   = 成交价格(通常是不含国际运费保险的口径)
② 关税 = VFD × 税率
   税率三档:协定税率(中加之间没有自贸协定,不适用)
             MFN 最惠国税率 ← 中国货正常适用,帽类在十几个百分点量级
             General Tariff 普通税率 35% ← 证明不了原产地就落到这里(见16.6)
③ GST = (VFD + 关税) × 5%
   省税:BC省的PST 7%,商业进口在边境不征,由进口商自行申报处理
```

**MFN**(Most-Favoured-Nation,最惠国待遇)这个词16.6里出现过,这里正式定义:**WTO成员之间相互给予的、不低于给任何第三国的关税待遇**。要点在于——**它不是自动给的,是"你能证明你是谁"才给的**;证明的方式,就是原产地证明文件。

拿你这票算一遍(本书统一取MFN 16%、汇率1加元≈¥5.2):

```
成交价 4,950 加元(DDP口径,见15.5的PI条款)
  减去国际运费部分 ¥1,400 ÷ 5.2 ≈ 269 加元
VFD ≈ 4,681 加元
关税 = 4,681 × 16%      ≈ 749 加元
GST  = (4,681+749) × 5% ≈ 272 加元
合计税负 ≈ 1,020 加元 ≈ ¥5,306,折 ¥10.6/顶
```

**把这个数记住:一千零二十加元。** 它是这一章后半部分所有讨论的锚,包括18.5那个让你后背发凉的算术。

另外顺手记一条给客户省钱的知识,它会在第24章变成生意:**GST对注册商家不是成本**。Mike的酒厂是GST注册商家,他缴的5% GST可以作为**进项税额抵免(ITC)** 在申报时全额抵回来。所以"帮客户省税"的正确姿势不是低报货值,是让他把BN写在发票上、把GST拿回去(见16.2.2那封回信)。**真正不可逆的成本只有关税那749加元。**

现在,主线。

**第84天,货抵温哥华港。** 拼柜落地,专线的清关代理向CBSA申报。

**第85天凌晨一点十七分**,你已经睡了,小林的微信把你叫醒,三条连发:

> "醒着吗?你那票被查了。"
> "CBSA随机布控,查验场那边要两份东西:origin declaration 和 fibre content。加拿大那边现在下午一点,他们要今天下班前给,不然要压到下周。"
> "你手上有CO没有?"

你坐在床上,脑子里像有人拉了一下电闸——**你没有CO。** 一个月前你在微信上问过"要不要办原产地证",小林回的是"加拿大不需要,双清包税那边我们代理包了,省一笔",你回了一个"好"字(见16.6)。

接下来的三个小时,你做了这辈子最有效率的一次翻箱倒柜。**你手上到底有什么?**

- **箱唛**上印着 `MADE IN CHINA`(见4.6.3)——有原产国声明,但它印在箱子外面,不是官方文件;
- **洗水标**上写着 `100% Cotton / 100 % coton — Made in China / Fabriqué en Chine`(见2.3.4,英法双语的来历见18.6)——货上的成分和产地都在,而且是双语的;
- **CI 和 PL**(见16.2、16.3)——上面有品名、材质描述、数量、重量;
- **规格表**上那行"全棉,精梳;成分允差±5%,大货随附成分检测报告"(见1.1.3)——**但那份检测报告,五百顶的小单你从来没让工厂做过**;
- **原产地证:没有。**

三点二十,你给小周打了电话(胶州是上午),把三件事同时启动:

1. **原产地声明**:请外贸公司在自己的抬头纸上出一份 **Statement of Origin / Manufacturer's Declaration**——载明品名、款号 RB-DH-001、HS编码、数量500顶、原产国 **CHINA**、生产地址、签字人姓名职务和日期,盖公章扫描。**成本:零。耗时:一个半小时。**
2. **纤维成分证明**:请工厂出一份 **Fabric Composition Statement**(100% Cotton,附面料批次号),再向布厂要那批布的**第三方成分检测报告**——档口老板手里正好有同批次的现成报告,拍照发来,**¥0,当天到手**;同时补拍洗水标特写和帽内标位照片。
3. **后补原产地证**:让外贸公司当天向签证机构申请**后补一般CO**,证书上会加注 `ISSUED RETROSPECTIVELY`(见16.6),**¥200加急,三天出证**。

**第85天上午九点**(温哥华时间前一天下午),你把①②打包发给小林,小林转清关行。**第86天**,CBSA要求补一份布厂检测报告的英文摘要,你当天补上。**第87天**,后补CO出证,一并递交。**第88天下午,放行。**

**账单:** 查验场地费、掏箱搬运费、三天仓储费、清关行的额外文件处理费,合计 **CAD 150**(约¥780),货代先垫,后按实报实销向你收。

这笔钱谁出?你的报价单Notes里其实有一行英文:*"destination customs inspection charges (if any) at cost"*(见15.2)——**你有权把它转给Mike**。你算了三分钟,决定自己吃掉:¥780,换Mike的邮箱里永远不出现一封"你还欠我150加元"的信。**这里有一条老话你现在懂了:条款该写还是要写,写了不用是你的选择,没写就没得选——"有条款而不用"和"没有条款",在客户眼里是同一个体验,在你眼里是两件完全不同的事。**

那三天里你做对的最重要一件事,不是找文件,是**第85天早上主动给Mike发的那封邮件**:

> "Heads-up: your shipment was randomly selected for inspection by CBSA in Vancouver. Nothing is wrong with the goods — they asked for origin and fibre content documents, which I've already submitted. Expect a 2-4 day delay; revised door delivery around Sept 5. Your event is Sept 14, so we still have a 9-day buffer. I'll update you daily."

Mike当天回:"Thanks for telling me before I had to ask. Sept 14 — we're fine."

**第90天装车派送,第91天到温哥华,第92天Mike签收。距离九月中旬的周年活动,还剩十天。**——险,但没惊。而它之所以只是"险",是因为专线这一票走得比承诺快了几天,那几天正好被查验吃掉了。**你的buffer救了你,不是你的能力救了你。**

三条教训,写下来,这是本章最贵的三行字:

> **一、文件包必须随货走。** CI、PL、原产地声明、成分说明各打印一份,装进自封袋,贴在1号箱内侧。成本五分钟加一个自封袋。查验场的人手上有货、没有文件,你在一万公里外的床上——**能替你回答问题的,只有跟着货一起走的那张纸**(16.7的动作,你当时跳过了)。
> **二、箱唛、PL、CI三者的件数、数量、毛重必须完全一致。** 这一票你侥幸在这上面:封箱后过磅,单箱毛重12.50公斤、合计62.50公斤,和箱唛上开裁那周印下的数字(见4.6.3)正好对上——**那是运气,不是流程**。真实的常见情形是:箱唛在开裁周按估算印,PL和报关单在封箱后按实测填,两个数差个几百克没人回头改箱唛。这次CBSA只问了产地和成分,没在重量上做文章;**下一次未必**。所以把它变成流程:**封箱过磅后,拿实测数回头核一遍箱唛**——数字一改,所有载体一起改,箱唛也是载体。
> **三、"要不要办CO"永远不要问货代。** 换一个问法问自己:**"如果目的国海关明天开口要原产地文件,我三天之内能不能拿出来?"** 答案是"不能"就办。两百块 vs 三天延误加一百五十加元——这道题不需要计算器。

本节动作:把上面三条做成你的**出运前三问**,贴在电脑上,每一票出货前念一遍。另外补一个具体动作:**问货代要目的国清关代理的名字和联系方式**。双清包税模式下你交出去的是控制权,但至少要知道:出事的时候,那一头是谁在替你说话。

### 18.4.2 美国:HTS、加征叠加与de minimis

加拿大讲完了,但你迟早要面对那个更大、也更麻烦的市场——**北美促销品行业年规模两百多亿美元(见5.5.2),八成以上在美国**。所以这一节把美国进口端的三件事讲透:税号、加征、小额免税。**先立一条阅读纪律:这一节讲机制,不讲当期税率。** 美国的关税政策近年变动极频繁,任何写进书里的具体百分比都会过期,而机制不会。你要学的是"怎么自己查出当期答案",不是"当期答案是多少"。

**第一件:HTS。**

**HTS**,全称 Harmonized Tariff Schedule of the United States,美国协调关税表,由美国国际贸易委员会(USITC)编制发布,由海关与边境保护局(CBP)执行。它是**10位**:

```
6505.00.60.90
└──┬──┘ └┬┘ └┬┘
  HS 6位   美国子目   统计后缀
 全球通用   ←定税率→  ←只做统计→
```

要害在中间那两位:**前六位全世界一样,你的税率却由第7-8位决定**。帽子在6505.00项下按几条线细分,你必须知道分岔点在哪:**是不是针织/钩编;纤维是棉、化纤还是羊毛;是不是"含辫条"(braid);是不是空顶(visor,见2.1.2)**。同样是一顶棒球帽,棉制梭织和化纤针织,在HTS里是两个号、两个税率。

还有一个中国出口人常被打懵的设计:**复合税率**。美国对部分纺织帽类不用单一从价税,而是"**每公斤多少美分 + 百分之几**"的组合(specific + ad valorem)。这个设计对帽子很不友好——帽子轻、单价低,**按公斤计的那一段会把轻货的实际税负拉得很高**。所以给客户估税的时候,只报一个百分比是外行:**必须同时把毛重报给他**,不然那个"每公斤××美分"没法算。你的500顶净重50公斤(见16.3),这个数在美国报价里是要进公式的。

**第二件:加征的叠加。**

美国的最终税率不是一个数,是**叠加出来的**:

```
最终税率 = HTS基础税率(普通/MFN档)
         + 301条款项下对中国原产商品的加征(按清单分批,常见档位 7.5% / 25%)
         + 其他专项措施(232、IEEPA等,视商品与时期而定)
```

机制里有两条规则,比税率本身重要一百倍:

**规则一:加征按"原产地"判定,不按"发货地"。** 从越南发出的一票货,如果实质性加工(见16.6)是在中国完成的,照样按中国原产加征;反过来,布是中国的、但在越南完成了裁剪缝制、税则归类从第52/55章跳到第65章,那就是越南原产。**这一条就是整个"中国+1"产业转移的税法基础**(见6.6)——它也解释了为什么"在越南贴个标"是行不通的:贴标不构成实质性改变,那叫原产地欺诈。

**规则二:查法固定,答案会变。** 查当期税率的正确姿势是三步:① 在USITC的HTS在线检索里输入你的十位税号,看基础税率栏;② 看该税号下有没有指向**第99章**的附加标记(美国把所有临时性加征措施都放在第99章),有就点进去看当期加征税率与清单;③ 用CBP的裁定检索系统看同类商品的归类裁定。**这三步十五分钟,是你面对任何美国客户时都能当场做完的功课。**

**第三件:de minimis,以及它的变化如何重塑了跨境电商。**

**de minimis**(小额免税),字面意思是"微不足道的",指进口货值低于某个门槛时免征关税、免于正式报关。美国的这条规则来自**Section 321**:同一收货人、同一天、货值不超过 **USD 800** 的进口,可免税并通过简化的清关方式放行(行内说的 **T86** 清关就是它的电子申报通道)。

这条规则曾经是整个中国跨境电商直邮模式的地基,它的作用值得算给你看:

```
【直邮模式,依赖de minimis】
一顶帽子零售 $25,单件从中国直发消费者
关税:$0(在800美元门槛之下)
国际小包运费:$4-6/件
→ 单件税费成本 ≈ 0

【批量进口模式】
1,000顶一票走海运,FOB $2.45/顶(见CANON价格锚)
完税价格 = $2,450
假设基础税率 8% + 301加征 25% = 33%
关税 = $808.5 → 摊到每顶 $0.81
加头程海运、报关、清关杂费,摊薄后每顶再加 $0.5-1
→ 单件税费成本 ≈ $1.3-1.8
```

**在de minimis通道畅通的年代,直邮在税务上完胜。** 而这条规则近年经历了重大调整——对中国原产商品的适用被大幅限制乃至取消(**具体以当期规则为准,你读到这本书时的状态必须自己核实一遍**)。一旦它关上,上面那张表的两栏会瞬间反转:直邮的每一件小包都要按正式或简化流程申报、按33%缴税,还要摊上每票的报关成本;而批量进口的那$1.3-1.8几乎不变。**结果就是整个行业的重心从"从中国直邮"转向"批量进口+本土仓配"(FBA或第三方海外仓,见22.1)。**

加拿大这边顺带对照一下,免得你混:**加拿大的一般de minimis门槛只有 CAD 20**,低得几乎等于没有;CUSMA框架下从美国、墨西哥经快递进入的货物另有 CAD 40(税)/CAD 150(关税)的门槛。**从中国发货一律不适用。** 这就是为什么Mike那五百顶,一分钱免税空间都没有。

给你三个可以直接用的判断规则,不随政策过期:

① **报价给北美客户时,永远先问"你打算怎么进口"**——直邮到消费者、还是整票进你的仓?两种模式的税基完全不同,报价口径也完全不同。
② **税率超过20%的品类,把关税写进报价的假设栏**,而不是含糊地说"含税到门"——你不知道政策哪天变,写进假设栏,变了才有重议的依据(同汇率buffer条款的逻辑,见9.7.2)。
③ **任何"帮你规避加征"的方案,先问一句:原产地是怎么变的?** 答不出实质性改变发生在哪道工序的,一律是转口洗产地——那是刑事风险,不是节税方案。

本节动作:现在就去做一次十五分钟的功课——在HTS在线检索里查出**你主力款的美国十位税号、基础税率、以及第99章的附加标记**,把三个结果抄进产品档案。做完你就掌握了一项90%的同行不具备的能力:**当美国客户问"我要交多少税",你能当场给出一个带出处的数字,而不是"这个要问货代"。**

## 18.5 合规红线:低报伪报的稽查后果

先算一道让人不舒服的算术题。它会在三分钟内改变你对"包税专线"这四个字的全部理解。

18.4.1算过,你这票货在加拿大如实申报应缴的关税加GST,是 **CAD 1,020,约¥5,306**。

而你付给货代的全部费用是多少?**¥1,400**(见13.5)。这¥1,400里,包含了从胶州提货、拖到港口、出口报关、海运三十天、目的港清关、缴纳全部关税税金、以及送到温哥华门口的最后一公里派送。

```
你付的全部:           ¥1,400
仅关税+GST应缴:       ¥5,306
差额:               −¥3,906
```

**这道题无解。** 不是货代亏本做慈善,是这票货在加拿大那头,**几乎不可能是按 4,950 加元申报的**。它可能被并进一票大货按重量申报,可能被拆成若干低值包裹,可能申报了一个远低于成交价的货值。你不知道是哪一种——**因为你从来没见过那张进口报关单**。

这就是"包税"两个字的全部真相,也是这一节存在的理由。下面把红线一条一条画出来。

**第一条红线:低报出口货值。**

回到16.2.2那封邮件——Mike问能不能把发票写成2,000加元。那一节给了你话术,这一节给你**完整的后果链**,四层,一层比一层深:

**① 海关有独立的估价权。** 完税价格不是"你说多少就是多少"。WTO《海关估价协定》给了六种方法,顺序固定:成交价格法 → 相同货物成交价格法 → 类似货物成交价格法 → 倒扣价格法 → 计算价格法 → 合理方法。中国和加拿大都照这套走。翻译成人话:**海关手上有同类商品的价格数据库**。一顶带8800针绣花、金属滑扣的全棉dad hat申报4加元,数据库一比就是异常——**低报最容易被抓的原因不是有人举报,是它在统计上太显眼**。

**② 行政责任。** 中国端,低报出口货值属于申报不实乃至伪报,按18.1.2那两把尺子处罚(漏缴税款30%-2倍;影响出口退税管理的处申报价格10%以下),情节严重的没收货物。加拿大端,按AMPS按次处罚并追溯补税,追溯期四年。

**③ 外汇与信用,这一层最先炸也最持久。** 你的**收汇金额和出口报关金额是在同一个监测体系里对账的**(见16.2.2):申报2,000、实收4,950,那多出来的2,950加元在外汇口径上就是一笔无来源收入。企业端会被列为重点监管、逐笔审核;个人端会触发反洗钱关注。同时,**海关对注册企业实行信用等级管理**:高级认证(AEO)、一般认证、一般信用、失信企业四档。掉到失信这一档,后果不是罚款,是**查验率大幅提高、单证逐票人工审核、通关便利全部取消**——你此后每一票货都要多花三五天,而这个状态一背就是好几年。

**④ 刑事门槛。** 偷逃应缴税款达到一定数额构成走私罪;**骗取出口退税**是《刑法》单列的罪名。这两条不是吓唬人的修辞——每年都有帽子、服装行业的案子。实务上常说的量级是逃税十万元起步,**以现行司法解释为准**。

**第二条红线:高报。** 有人反向操作,虚高货值,目的是多骗退税或把资金转移出境。**性质比低报更重**,因为它直接指向骗税和逃汇。判据一句话记住:

> **任何让"纸上的钱"和"账上的钱"对不上的操作,红线在哪不看动机,只看差额能不能解释。**

顺手把你自己这票的一处差额解释清楚,免得你日后自乱阵脚:CI上是 **CAD 4,950**,Mike实付 **4,870**——差了80加元。这80是验货时那40顶让步接受的折让(见11.6.2),发生在报关之后,有Mike的书面同意邮件和一份贷记确认作凭。**这就是"能解释的差额"的标准样子:有原因、有书面、有时间顺序。** 而低报那2,950加元的差额,你编不出任何一个能写在纸上的原因。

**第三条红线:客户要求你低报,怎么回绝?**

16.2.2给过一封信,这里补上客户**坚持**时的三段式,因为总有客户会追第二次:

- **第一段,共情,不评判**:"I understand — everyone wants to keep landed cost down, and it's a fair question."(**永远不要用"这是违法的"开场**,那等于指控客户是罪犯,生意当场就凉。)
- **第二段,把风险落到他头上,而不是你头上**:"The problem is on your side too: CBSA can re-value the goods, and once your BN gets flagged, every future shipment of yours gets pulled for inspection. You'd be paying for this for years."(**客户不怕你被罚,客户怕自己被拖累**——把红线翻译成他的成本。)
- **第三段,给替代方案**:正确税号、运费不计入完税价格、GST可作ITC抵回(见18.4.1)。

如果他还坚持第三次,最后一句话是:"I can't do this one — but everything else in the quote stands."**然后接受可能丢单。** 给你一个阈值,拿去当决策规则:**当客户要求你承担刑事风险,去换取他节省的金额低于这单毛利的三倍时,这单不做**。Mike要省的620加元,而你这单毛利¥13,790——不用算第二遍。

**最后一条,也是这一节真正要留给你的东西:包税专线里的低报,是谁在担风险?**

法律上:进口人是货代的清关代理,申报责任在它,罚款也罚它。**你确实不是法定责任人。**

商业上:

- **被扣的是你的货。** 查验、扣关、补税核查期间,货在人家仓库里躺着,你的客户在等他的活动。
- **赔付的上限是运费的三倍。** 第13章那个同行的案子:运费USD 3,600,拿到USD 10,800,实际损失超过USD 30,000(见13.3.2)。
- **被打标签的是你客户的名字。** 收货人一旦进了高风险名单,以后每一票都排队——**而你会是他记住的那个"给我带来麻烦的供应商"**。
- **你连自证清白的资格都没有**,因为你从头到尾没见过那张进口报关单。

所以第13章那句"包税不是免责"要往前推一层:**包税不是把风险消灭了,是把风险从"你不知道"变成"你不知道,而且你也管不着";而当它爆发时,它会精准地落在你最在乎的那个东西上——客户关系。**

判断规则,两条,划得很清楚:

> **可以用专线包税**:货值小(单票一两万人民币量级)、常规品类、客户不需要正规进口凭证、不需要抵扣进项税、你自己也接受"看不见申报"这件事。
> **必须走正规报关**(客户自己做进口人的DAP,或找正规清关行做真DDP):客户是要抵扣GST/VAT的注册商家;客户需要进口凭证入账或要做产品合规备案;单票货值上万美元;品牌敏感或有商标授权链;客户所在行业本身受监管。

本节动作三条:① 在货代询价单里加一句必问——**"这票货在目的国按什么货值申报?能不能给我进口报关单的副本?"** 对方支支吾吾,你就知道自己在买什么了(能给副本的专线,报价通常贵10-20%,而那10-20%就是合规的价格);② 所有涉及申报口径的沟通**只走邮件**,永远不在电话和语音里松口——那封邮件是你将来唯一的免责证据;③ 在报价单和PI里固定一句:**"All customs declarations shall be made at the actual transaction value."** 这句话不值钱,但它在你和客户之间划了一条线,而划过线之后,九成的客户不会再问第二次。

## 18.6 标签合规:产地标/成分标/儿童品CPSIA

查验放行的第三天,你重读了一遍CBSA当初要的那两份东西——**origin(产地)和 fibre content(纤维成分)**。然后你意识到一件事,后背又凉了一次:这两样东西,**其实一直缝在帽子里面**。

你翻出确认样,把汗带翻过来,左内侧缝上那枚小小的洗水标(见2.3.4)上印着:

```
100% COTTON
100 % COTON
MADE IN CHINA
FABRIQUÉ EN CHINE
[洗涤图标 ×5]
```

**英法双语。** 如果那天CBSA的关员是当场拆一顶帽子看标,而不是隔着系统向清关行要文件,这件事可能半小时就结束了。**货上的标,和随货的文件,是同一件事的两个载体**——这句话第2章埋下过(见2.3.4),现在它兑现了。

但更该让你不安的是另一个问题:**这枚双语标,不是你的功劳。**

时间倒回产前样那一轮(见10.1.1)。你把标样照片发给Mike确认,他回了一行:

> "Looks right. One thing — for Canada please add the French: 100 % coton, Fabriqué en Chine."

你当时以为这是他的个人偏好,或者是照顾魁北克的客人,回了句"No problem",顺手改了标样。**现在你知道那不是偏好,那是法律。** 而如果这个客户不是Mike,是一个和你一样第一次做进口的加拿大小老板,这一行法语就不会有人提醒你——**五百顶帽子会带着不合规的标进加拿大,而扣货的时候没有人会问"是谁忘了说"。**

**教训一句话:目的国的标签规则,是卖方该查的功课,不是等客户提的要求。** 下面把三国的规则一次讲全,你查一遍,用十年。

**第一层:产地标(country of origin marking)。**

这是全球最普遍、也最刚性的一条。美国的规定来自关税法第304节:**每一件进口商品,必须以尽可能显著、清晰、永久的方式,向最终购买者标明原产国**。加拿大同理。落到帽子上是三个位置:

1. **帽内的洗水标或主标上必须有 `Made in China`**——这是"商品本身"的标注,不可缺;
2. **外箱箱唛上的 `MADE IN CHINA`**(见4.6.3)——这是"运输包装"的标注;
3. **零售包装(如有)上的产地标注。**

三者缺一都可能被要求整改。**注意"永久"这个词**:用不干胶贴纸贴在帽内、洗两次就掉,不算永久;缝进侧缝的织标或印标才算。

**第二层:纤维成分标(加拿大与美国的两套编号)。**

**加拿大**,依据《纺织品标签法》(Textile Labelling Act)与相应规章(TLAR),对在加拿大销售的消费性纺织品要求四件事:

- **纤维成分**:用通用名称,按重量降序列出,**含量5%及以上的纤维必须单独列明**;
- **英法双语**:纤维名称必须以英法两种语言标示——这就是Mike那行法语的法律来源;
- **经销商身份**:标上必须能识别经销商,可以写全称和地址,也可以用 **CA号**——由加拿大竞争局(Competition Bureau)核发的经销商识别号,格式是 "CA" 加五位数字(如 CA12345)。**申请免费、线上办理**,是加拿大客户做自有品牌时几乎必备的一件事;
- **牢固附着**:标签要以不易脱落的方式附在商品上。

**美国**,依据《纺织纤维产品识别法》(TFPIA)与FTC规则,要求纤维成分、原产国、以及**制造商或经销商的身份**;身份可以用公司全称,也可以用 **RN号**(Registered Identification Number)——由美国联邦贸易委员会(FTC)核发的注册识别号,同样**线上免费申请**。另外,美国还有单独的 **Care Labeling Rule**(护理标签规则),要求成衣提供合理的洗涤护理说明——帽子是否强制适用有争议,但**照做没有成本,不做有风险**。

**这两个号很重要,而且是你能给客户的增值服务**:客户如果做自有品牌、要进零售或上平台,你在标样阶段主动问一句"Do you have a CA number (or RN)? If so I'll put it on the care label",客户对你的专业判断会瞬间升一档——**这是零成本的顾问动作**(第24章会把这类动作系统化)。

**第三层:儿童产品,CPSIA。**

**CPSIA**,全称 Consumer Product Safety Improvement Act(《消费品安全改进法》,2008年),适用于**12岁及以下儿童使用的产品**——童帽在内。它要求的不是"标好看",是"能被追溯和被检测":

- **总铅含量限值**:基材 **100 ppm**,表面涂层 **90 ppm**。帽子上的金属滑扣、金属气眼、烫钻、印花涂层都在射程内(你的古铜滑扣,见2.4.2,如果是童款就必须测);
- **邻苯二甲酸酯**限值,适用于玩具和儿童护理用品,部分童帽配件会被波及;
- **追溯标签(tracking label)**:产品和包装上必须有永久性标记,能识别**生产商、生产地点、生产日期(批次)**——这是CPSIA最容易被中国工厂漏掉的一条,因为它要求把批次号做进标里;
- **CPC(Children's Product Certificate,儿童产品证书)**:基于**CPSC认可的第三方实验室**出具的检测报告,由进口商或制造商签发,随货或电子形式提供。**没有CPC,货可以被直接扣在港口。**

加拿大的对应法规是《加拿大消费品安全法》(CCPSA),另有针对儿童外衣**拉绳(drawstring)**的专门要求——帽子上如果有抽绳、绳扣,童款要格外小心。

成本量级给你:**一次CPSIA全套检测(铅、邻苯、物理机械)USD 200-500/款**,周期一到两周。这笔钱在500顶的童帽单上摊到每顶一块多,**但它是这一票能不能进关的门票**,不是可选项。判断规则一句话:**做成人帽,标签合规是文件问题;做童帽,标签合规是准入问题。**

**不合规的后果为什么是"整批扣"而不是"改了再放"?** 因为标是缝在货上的。文件错了可以补一份传真过去;标错了,唯一的修法是把五百顶帽子拆出来,一顶一顶拆线、换标、重缝——在目的国做这件事叫 **relabeling**,行价 **USD 0.5-1.5/件**,五百顶就是USD 250-750,还要加仓储和人工排期,通常一两周。而更常见的结局是货被退运或销毁。第2章那位卖家的下场你还记得:洗水标写"100% Cotton"、实际是TC混纺,被职业打假买家送检,**平台下架链接、资金冻结45天**(见2.3.4)。**标是货上唯一白纸黑字的承诺,写上去的每一个字都是法律意义上的。**

本节动作,**标签合规三步法**,把它写进你的工作流:

1. **查**:接到任何一个新目的国的订单,第一件事去查该国的纺织品标签要求,三个关键词就够——"textile labelling requirements + 国名"、"country of origin marking + 国名"、"children's product safety + 国名"。半小时。
2. **写**:把查到的结果**逐字写进规格表的"标类"一栏和trim sheet**(见9.3.1),精确到每一行文字、语言、位置、工艺。R&B这一栏的正确写法是:

```
洗水标 CARE LABEL:
  尺寸 3×5cm,白底黑字,涤纶缎带,左内侧缝
  第1行  100% COTTON
  第2行  100 % COTON
  第3行  MADE IN CHINA
  第4行  FABRIQUÉ EN CHINE
  第5行  洗涤图标5枚(机洗30℃/不可漂白/不可烘干/低温熨烫/不可干洗)
  备注:英法双语为加拿大法定要求;客户CA号如提供须加印
```

3. **确认并存档**:**打标样、拍照、让客户书面确认**,把确认邮件和标样照片一起存进订单文件夹。这三件东西加起来,是你日后唯一能证明"标的内容是客户签过字的"的证据。

最后一条纪律送给你,它同时是本章的收束:**不许用工厂的通用现成标**。工厂抽屉里那一沓"100% Cotton / Made in China"的通用标,省的是几分钱,赌的是整票货。**写进合同、写进规格表、验货时翻开一顶帽子亲眼看一遍**(把它加进第2章工具里那套验货操,当第八式)——这个动作花你十秒钟。

**主线推进** —— 货在太平洋上。第十天,货代小林发来一条船期更新:预计还有二十天靠港。这是从市集遇见 Mike 到现在,你第一次手上什么都不用干——工厂那边尾款付清了,单证交出去了,中国这头的报关和退税单证也递上去了(那笔退税归工厂,见18.3.2)。你把一个鞋盒倒在桌上:工厂的PI和收款收据、绣花制版的收据、四张国际快递单、洗水厂的结算条、货代那张三行报价单、两张银行入账通知、两张结汇水单,还有——你犹豫了一下才把它也放进去——两趟去山东的高铁票和酒店发票。

你原本以为这是十分钟的活:第7章那张分账表你早就算过了,收入4,950加元,成本11,950,毛利13,790,54个点。可真的把每张纸摊平、按日期排好、一张一张往表里录,有三样东西让你停了很久。一是验货那几天给 Mike 的让步邮件——折让80加元、¥416,这笔钱当初报9.9时根本不在脑子里。二是两趟山东的票据,加起来三千五,你从没把它当成"这一单的成本"。三不是纸,是你翻日历数出来的数字:从六月初到现在,你在这一单上真正花掉的时间。

台灯下你写下一行字:**估价是感觉,算账是证据。**这一章,你要把这单从头到尾算一遍——不是估,是把每一张单据摊开对着算。

## 19.1 到岸成本公式

### 19.1.1 landed cost逐项分解:货款+头程+关税税费+尾程+损耗

第7章那张价值链表里,进口商那一行写着"到岸约$3.30",后面跟了一个括号:landed cost,详19.1(见7.1.1)。现在到了兑现的时候。

先把定义钉死。**landed cost(到岸成本)**:一批货从供应商手里出发,到最终躺进收货方仓库(或客户门口)那一刻为止,你为它付出的全部现金,除以数量,就是单顶到岸成本。三个词是关键:**全部**(不是货款,不是货款加运费,是全部)、**现金**(实际流出去的钱,不是估的、不是"应该差不多")、**躺进仓库那一刻**(不是上船那一刻,不是清关那一刻)。

为什么必须用这个口径?因为这条链上每一段的报价口径都不一样(见13.3.3的三线图),而**只有到岸成本是唯一可以跨口径比较的数**。工厂报你FOB青岛¥17.5,加拿大本地供应商报 Mike 落地价14加元,亚马逊上一顶同款现货卖$12.99——这三个数根本不在一个坐标系里,只有全部换算成"帽子躺进温哥华那间酒厂仓库时,一顶到底花了多少钱",才能放在一起。**landed cost 是外贸人的公制单位。**

完整公式,八块,抄进笔记本:

```
到岸成本 Landed Cost =
   ① 货款           出厂价×数量 + 货款外单列的加工费
 + ② 一次性费用      制版/开模/样品/寄样/检测/差旅  ÷ 摊销基数
 + ③ 头程物流        国内段 + 主运费 + 附加费 + 保险 + 报关单证
 + ④ 关税税费        关税 + 进口环节税 + 清关代理费(+特别税)
 + ⑤ 尾程            目的港到门派送 + 入仓/预约/偏远附加
 + ⑥ 资金与汇兑      收款手续费 + 结汇点差 + 资金占用利息
 + ⑦ 损耗与售后备付   生产损耗 + 运输破损 + 折让退换 + 意外备付
 − ⑧ 退税抵减        谁报关退给谁(见18.3.1);你不报关,这行填 0
```

逐块拆开,每一块都还有子项,子项才是漏钱的地方。

**①货款**,看着最简单,坑在"货款外"。你以为货款就是¥17.5×500=¥8,750,可这单还有一笔轻酵素洗¥500(见3.3.3)——它是洗水厂外发,老纪的报价单上单列,不在¥17.5里。同类的还有:超出常规的包装升级、贴条码标(工厂贴标¥0.2-0.5/顶,见4.6.4)、加急插单费(订单额5-8%,见9.7.1)。**规则:凡是报价单上和单价分行写的,一律单独进表**,因为它们不随单价的数量阶梯下降。

**②一次性费用**,本章的头号杀手,19.5会单独算。它的特点是**与数量无关**:制版费¥200,做500顶是¥200,做100顶还是¥200(见3.1.5);打样和四趟国际寄样合计¥700(见10.4.2),数量减半也不会变成¥350。所以它的杀伤力等于"总额÷数量"——500顶时摊¥1.8/顶,100顶时摊¥9/顶,足足五倍。**摊销基数怎么定,是一个判断题**:保守派全摊进首单(这单赚不赚得回,一次见分晓);现实派摊进"预计十二个月内这个客户的总量"(制版是资产,翻单免费复用)。两种都对,但必须在表上写清你用的是哪种——**含糊的摊销,是自欺的开始**。

**③头程物流**,不等于"运费"两个字。它至少五层:国内段(工厂到货代仓的拖车或快递)、主运费(海运/空运/专线的干线)、附加费(燃油、旺季、超长超重、单证)、货运保险(见17.7)、出口报关与单证费。你这单为什么只有一个数¥1,400?因为你买的是专线的打包价(见17.4),五层全被卷进"按方计费"里了。**打包价的好处是省心,代价是你看不见结构**——19.4那个整柜例子会把这五层完整摊开给你看。

**④关税税费**,在你这单里同样"看不见"——双清包税的运价里包含了目的国清关和税(见17.4)。但看不见不等于没有:500顶货值折加元约CAD 1,670,按加拿大对纺织帽类的MFN税率16%(见18.4.1)算,关税本身就是CAD 267≈¥1,388,合¥2.78/顶——几乎正好等于你付的整个¥2.8运价。这个反差19.4会正面处理,它是理解"包税专线为什么便宜"的钥匙。

**⑤尾程**,目的港/目的机场到客户门口那一段。整柜和拼箱要单独付(温哥华港到市区仓库一趟CAD 400-600),专线和快递含在报价里。它的隐藏子项是**偏远附加与二次派送**:客户地址是工业区、收货没人签、要预约卸货窗口——每一条都能加出几十上百加元。

**⑥资金与汇兑**,第14章整章讲过机制,这里只管落到表上:中转行扣费(你这单两笔共60加元,见14.1.1)、结汇点差(0.3-0.5%)、以及最容易被忘的**资金占用**——你垫出去的钱在外面待了多久,乘以你的资金成本。

**⑦损耗与售后备付**,唯一一块"还没发生就要先记账"的成本。生产损耗2-3%(见9.6.1)已经在工厂报价里了,你要备的是三样:运输破损、客户折让(你这单实际发生了80加元,见11.6.2)、意外(第18章那笔查验杂费CAD 150,此刻还在未来,但你现在就该给它开一行)。

**⑧退税**,是唯一的减项。13%的出口退税(见9.7.3)跟着报关单抬头走,**谁报关退给谁**。这一单是工厂自营出口(见8.1.1),退税归工厂,已经体现在它敢报¥17.5这个薄价里;你的表上这一行,就是0。等你自己有了进出口权,这一行会变成表里最大的一笔正数——这也是第25章要谈"生意正规化"的原因之一。

现在把八块套回你这一单,得到本节的落点:出厂价¥17.5,单顶到岸成本¥23.90(见7.3.2那张表),**中间隔着¥6.4,涨幅36.6%**。这6块4就是本章的全部主题——它是你敢报9.9的底气,也是你差点亏钱的地方。

本节动作:现在就把上面那八行抄成一张空表,八个大项、每项留三到五行子项,存成"到岸成本核算表 v1"。以后任何一单开工前,先把这张空表打开,填不满的格子逐个去问——**问不出来的格子,就是你这单的风险敞口。**

### 19.1.2 每个数从哪来:对应单据与查询渠道

上一节给了你一张八块的表;这一节回答一个更要命的问题:**表里每一格的数,凭什么是那个数?**

先讲一条纪律,本章最硬的一条:**没有出处的数字不许进表。**不是"大概两千"、不是"货代说差不多"、不是"上次好像是这个价"——每一格背后必须站着一张纸或一个可复查的链接,并且这张纸上要有日期。理由很简单:成本表不是给你自己看的,它是你报价的地基;地基里掺了估计值,你报出去的价就是一个估计值,而客户付给你的钱是精确到分的。

逐项对表,这张表建议你直接复制到核算表的"取数来源"列里:

| 成本行 | 取数单据/渠道 | 由谁出具 | 关键核对动作 |
|---|---|---|---|
| 货款 | 工厂PI/形式发票 + 出货对账单 | 工厂业务(老纪) | 单价、数量、币种、是否含税含运;与9.1.1的四栏拆分对得上 |
| 货款外加工 | 加工厂结算条(洗水/贴标/后整) | 外发厂或工厂代收 | 是否按顶计、有无最低一缸/最低批量 |
| 制版/开模 | 制版收据 + 版权归属说明 | 工厂或绣花厂 | 是否一次性、翻单免不免、.dst文件是否交付(见3.1.6) |
| 打样与寄样 | 快递运单 + 打样费收据 | 快递公司/工厂 | 单号可查、重量与费用对得上;哪几票能让客户到付(见10.4.2) |
| 头程运费 | **货代书面报价单**(PDF/邮件) | 货代(小林) | 计费方式、有效期、含哪些不含哪些 |
| 关税税费 | HS编码 + 目的国税则查询截图 | 你自己查 | 税号6505类目(见18.1.1)、MFN税率、是否有协定优惠 |
| 进口环节税 | 同上 + 清关行费率表 | 清关行 | GST/VAT能不能抵扣(见18.4.1) |
| 尾程派送 | 货代报价单的派送行 或 快递账单 | 货代/快递 | 是否偏远、有没有预约费和二次派送费 |
| 收款手续费 | **银行入账通知/MT103水单** | 银行 | 到账金额与客户汇出金额之差,就是中转行扣了多少(见14.1.1) |
| 结汇损失 | 结汇水单 | 银行 | 结汇牌价与当日中间价之差=点差 |
| 资金占用 | 你自己的资金流水表 | 你自己 | 垫资峰值×占用月数(见14.5.1那张时间表) |
| 折让/售后 | 客户书面同意邮件 + 让步接受记录 | 客户 | 金额、扣款方式(减尾款还是退款) |
| 生产损耗 | 验货报告 + 装箱单 | QC/工厂 | 实际入箱数与下单数之差 |

带你看三个最容易出问题的格子。

**第一个,运费。**运费必须是**书面报价单**,不能是微信语音里那句"两千八一方"。真实质感的一段对话,发生在很多新人身上:

> 你:"小林,0.48方到温哥华门到门,多少?"
> 小林:"两千九一方,你这票一千四。"
> 你(记下¥1,400,报价发出去了)
> 十天后账单来了:海派运费¥1,392,**出口报关费¥150/票,仓储操作费¥80,单证费¥50**,合计¥1,672。
> 你:"不是说一千四吗?"
> 小林:"运费是一千四啊,报关和操作费是另外的,大家都这样。"

他没骗你,他答的是你问的那个问题。**病根在你的提问方式**——你问的是"多少钱",该问的是"门到门全包,除了这个数我还要付什么"。所以给你一句原样可抄的话术:"这个价是**门到门全包**吗?报关费、操作费、单证费、燃油附加、目的港杂费、派送费,有没有哪一项是另外收的?麻烦发我一份写清楚的PDF,注明有效期。"——把这句话发过去,对方回你一份PDF,那份PDF才是你表里那一格的出处。这也是13.5为什么要求物流段按报价的1.15-1.2倍计入:**书面报价之外总还有零头,buffer 就是给零头准备的。**

**第二个,关税。**关税这一格的出处不是任何人的嘴,是两样东西:**HS编码**和**目的国税则表**。编码怎么定见18.1.1,查询渠道记住三个:加拿大查 CBSA 的 Customs Tariff、美国查 USITC 的 HTS、欧盟查 TARIC——都是官网、都免费、都能查到具体税号下的MFN税率和有无协定优惠。查完**截图存档,文件名带日期**,因为税率是会变的。任何一个货代或清关行给你口头报"大概十几个点",都只能当参考,不能进表。

**第三个,汇兑。**这一格新人最爱拍脑袋,其实它是全表出处最硬的一格——银行的入账通知上明明白白写着客户汇出多少、你到账多少,两个数一减就是中转行扣费;结汇水单上写着结汇牌价,和当天中间价一比就是点差。你这单两笔加起来是¥388(见14.5.1),不是"大约1.5%"——**1.5%是你报价时的计提,¥388是事后的实账,两个数都要留在表上,差额就是你计提得准不准的成绩单。**

最后给你一条把纪律变成习惯的做法:**在Excel的每一个输入格上加批注**(右键"插入批注"),批注只写两行——来源、日期。比如运费格的批注:"小林2026-07-15报价PDF,有效期30天"。三个月后你回头看这张表,不用回忆,不用翻聊天记录。19.7会把这个做法固化进模板。

本节动作:把你手上正在跑的那一单,按上面这张表逐行去要单据——缺哪张要哪张。要完之后做一件事:**把每一格的数和它的单据对一遍,记下所有对不上的差额。**这些差额加起来,就是你此前"凭感觉"的误差范围;知道了这个范围,你才知道自己的报价该留多厚的余地。

## 19.2 算例一:100顶空运快递(体积重演示)

三张纸摊完,你顺手在笔记本上出了三道自测题。**第一题:如果 Mike 当初只要100顶试单,而且赶着八月初的一场小活动,只能走快递,这单该怎么算、该报多少?**

先算物流,因为这一题的全部机关都在这里。

100顶,按嵌套8顶一摞、100顶一箱的装法(见4.6.2),正好**1箱**:60×40×40cm,0.096CBM,连箱毛重**12.5公斤**。你打开快递公司的报价页面,准备按12.5公斤算钱——这是新人踩的第一个坑。

**体积重**的原理17.3.1已经讲透,这里只做一件事:算给你看。飞机和快递车卖的不是重量,是空间;一个装满羽毛的箱子和一个装满钢块的箱子占同样的舱位,凭什么收一样的钱?于是行业造了一个换算:把体积折算成一个"假想重量",跟实际重量比,**谁大按谁收**。换算用一个除数:

```
空运(航空货运)体积重 = 长×宽×高(cm) ÷ 6000     即 CBM × 167
国际快递(DHL/FedEx/UPS)体积重 = 长×宽×高(cm) ÷ 5000   即 CBM × 200
计费重 = MAX(实际毛重, 体积重)
```

代进你这一箱:

```
空运体积重 = 60×40×40 ÷ 6000 = 16.0 公斤
快递体积重 = 60×40×40 ÷ 5000 = 19.2 公斤
实际毛重   = 12.5 公斤
计费重     = MAX(12.5, 19.2) = 19.2 公斤 → 快递按0.5进位 = 19.5 公斤
```

**你实际交给快递12.5公斤的货,付的是19.5公斤的钱——多付56%。**这不是被宰,这是规则;不知道规则的人才被宰。

再往深挖一层,得到一个关于这个行业的重要结论。把你这箱货的密度算出来:12.5 ÷ 0.096 = **130公斤/立方米**。而快递的分界线是200、空运是167——**帽子的密度低于所有分界线,帽子天生是抛货。**这句话值得写进你的笔记本第一页,因为它决定了三件事:第一,帽子的物流成本永远按体积算,货值再高也没用;第二,4.6.2里"嵌套装箱"那个手法之所以值这单毛利的10%,根源就在这里;第三,你没法靠压缩解决它——软顶dad hat压狠了留折痕,定型白做(压缩的度见17.3.2)。**别人做电子产品可以在重量上省钱,你做帽子只能在体积上省钱。**

单价怎么取?中国到加拿大的商业快递,重量分档,越重单价越低:21公斤以下是最贵的一档,渠道价(货代代理的折扣价,不是官网价)大约**¥60-80/公斤**;100公斤以上能降到¥40-50/公斤(所以ch15里算500顶改空运时用的是"一公斤四五十块",两个数不矛盾,是两个重量档)。这一票19.5公斤,取中间值¥70:

```
快递运费 = 19.5 × 70 = ¥1,365     单顶物流成本 = ¥13.65
```

对比你实际走的海派:¥2.8/顶(见13.3.2)。**空运快递是海派的4.9倍。**

接着补两个小单特有的坑,然后表就完整了。

**坑一:最低消费。**轻酵素洗按¥1/顶算,100顶是¥100——洗水厂不会为你开一缸。行规是**最低一缸起收,约¥300-500**,你这票按¥400。同理,海派专线也有最低计费方数(约0.3方或最低收费¥800上下,见17.2.1的LCL同理),所以100顶就算走海派也不是0.096×2,900=¥278,而是按最低收¥870。**小单的世界里,处处是最低消费。**

**坑二:税。**快递不是不交税,是快递公司替你交了再向你收。货值CAD约335,加拿大低值货物简化清关下,关税16%约CAD 54、GST 5%约CAD 19、快递公司代垫手续费CAD 10-20,合计约**CAD 88≈¥458**(见18.4.1)。这里有个真实的坑要提前说:如果你的快递单没有勾DDP,这张税单会直接寄到客户门口——**客户以为"包税到门",结果开门被要钱**,是快递小单最常见的客户体验事故。所以:**报价里写清含不含税,快递面单上勾DDP,两处都要做。**

完整到岸成本表:

| 成本行 | 金额(¥) | 折每顶(¥) | 取数来源 |
|---|---|---|---|
| 货款 100×17.5 | 1,750 | 17.50 | 工厂PI |
| 轻酵素洗(最低一缸) | 400 | 4.00 | 洗水厂结算条 |
| 绣花制版费(一次性) | 200 | 2.00 | 制版收据 |
| 打样与寄样(一次性) | 700 | 7.00 | 快递运单×4 |
| 国际快递 19.5kg×¥70 | 1,365 | 13.65 | 快递渠道报价单 |
| 进口关税+GST+代垫费 CAD 88 | 458 | 4.58 | 税则表+快递账单 |
| **小计(不含换汇)** | **4,873** | **48.73** | |

现在做定价。假如你还按9.9加元报:收入100×9.9×5.2=¥5,148,换汇1.5%=¥77,总成本¥4,882,**毛利¥266,毛利率5.2%**。同样一个9.9,500顶时是54个点,100顶时只剩5个点——**一次查验、一顶返修、一次二次派送,这单就归零甚至倒贴。**

那该报多少?按45%的目标毛利率倒推(公式见7.1.2:报价=成本÷(1−目标毛利率)),答案是**CAD 17/顶**:收入¥8,840,换汇¥133,总成本¥4,938,毛利¥3,902,**44.1%**。

盯着这个17看三秒,你会看到本节最有价值的那句话:**本地促销品渠道的报价是12-16加元(见5.5.2)——你的17,已经贵过了 Mike 家门口的供应商。**也就是说,在100顶这个量级上,**你相对本地供应商的成本优势不存在了**,一次性费用和小票物流把它全吃掉了。

所以"什么时候值得空运/走快递",三条判断规则,直接用:

**规则一,看单顶差价换来的天数值不值。**快递¥13.65 vs 海派最低收费口径¥8.70,差¥4.95/顶≈0.95加元,换来的是25天。问客户一句话就有答案:"提前三周半到,值不值0.95加元一顶?"——办活动的客户答"值",补库存的客户答"不值"。**把时间明码标价,谈判就不再是拉锯。**

**规则二,看量级阈值。**200顶以下、或者交期不足35天,走快递(专线的最低消费和28-32天时效在这里都不划算);500顶以上且时间够,走海派;超过10方,算整柜(见17.2.3)。

**规则三,看一次性费用的摊销分母。**这一票真正的杀手不是快递费¥13.65,是制版+寄样的¥9/顶。**同样这900块钱,500顶时摊¥1.8,100顶时摊¥9**——所以小单的正确解法不是压运费,是**要么把一次性费用向客户单列收取**(制版费在报价单上单独列一行,见15.2),**要么把摊销基数放到十二个月的预计总量上**并在心里接受首单不赚钱。

本节动作:打开快递公司的官网价目表,查一次中国到你目标市场的21公斤档单价,再用你自己产品的一个标准箱尺寸算一遍体积重和密度。密度低于167的,在你的产品资料上永久标注一行:**"抛货,物流按体积计费"**——以后每次报价,这行字会替你省下真金白银。

## 19.3 算例二:1000顶海派专线

**第二题:同样的帽子、同样的通道,数量翻一倍到1000顶,该报多少?**

这一题看着简单——不就是把 R&B 那张表乘以2吗?算完你会发现,乘以2的只有两行,其余全变了,而**变化的方向和幅度,正是"规模效应"这四个字的真实含义**。

先算物流。1000顶=**10箱**=0.96CBM;毛重10×12.5=125公斤。先做一次密度校验:125÷0.96=130公斤/立方米,还是抛货,还是按方计费(专线按方还是按重,取的也是MAX,只是除数比快递宽松)。运费:

```
0.96 方 × ¥2,900/方 = ¥2,784      单顶物流 = ¥2.78
```

停在这里。500顶时是¥2.80,1000顶时是¥2.78——**量翻了一倍,单顶运费只降了两分钱。**这是本节的第一个反直觉结论:**按方计费的专线,运价对量是线性的,量本身不产生任何规模效应。**新人最爱在运费上抠,以为量大了运费就便宜,其实要等到货量大到能换通道(拼箱转整柜,见17.2.3)才有台阶,在同一个通道里,方价就是方价。

那规模效应从哪来?从另外三个地方,一个一个算。

**第一处,货价的数量阶梯。**老纪的报价单上写着:3,000顶¥16.6、10,000顶¥16.0(见9.7.1)。1,000顶落在500和3,000之间,按这条线插值并留一点谈判空间,取**¥17.0/顶**——比500顶的¥17.5降¥0.5。这¥0.5不是老纪发善心,是9.1.1里那八层拆解中"管理摊销"和"损耗"两层被摊薄的结果:同样一次排产、一次换线、一次首件确认,分摊到1,000顶和500顶,差的就是这几毛。

**第二处,一次性费用的摊销。**制版费¥200、打样与寄样¥700、两趟山东¥3,500——合计¥4,400,与数量完全无关。500顶时摊¥8.80/顶,1,000顶时摊¥4.40/顶,**一刀砍掉一半**。这是规模效应真正的主力。

**第三处,备付项的性质差异。**折让和换汇是按售价百分比走的(量大了绝对额同比增,单顶不变),但"意外备付"是按票走的——一票查验就是CAD 150左右,不管你这票是500顶还是1,000顶。所以¥800的意外备付,500顶时摊¥1.60,1,000顶时摊¥0.80。

把三处合起来,列完整的到岸成本表。场景设定说清楚:**新客户、新logo、首单1,000顶**(所以制版、打样、差旅一样不少),报价按后面19.6.2的阶梯定为**CAD 10.5/顶**:

| 成本行 | 金额(¥) | 折每顶(¥) | 相对500顶的变化 |
|---|---|---|---|
| 货款 1,000×17.0 | 17,000 | 17.00 | −0.50(数量阶梯) |
| 轻酵素洗 ¥1×1,000 | 1,000 | 1.00 | 持平 |
| 绣花制版费 | 200 | 0.20 | −0.20(摊销) |
| 打样与寄样 | 700 | 0.70 | −0.70(摊销) |
| 差旅(两趟山东) | 3,500 | 3.50 | −3.50(摊销) |
| 海派专线 0.96方×¥2,900 | 2,784 | 2.78 | −0.02 |
| 收款与换汇 1.5%×收入 | 819 | 0.82 | 随售价 |
| 折让与售后备付 1.5%×收入 | 819 | 0.82 | 新增计提 |
| 意外备付(每票¥800) | 800 | 0.80 | −0.80(按票摊销) |
| 资金占用(峰值¥4,400×1.5月×年化12%) | 66 | 0.07 | — |
| **到岸成本合计** | **27,688** | **27.69** | |
| 收入 1,000×10.5加元×5.2 | 54,600 | 54.60 | |
| **毛利** | **26,912** | **26.91** | **49.3%** |

现在把"规模效应"这四个字的账拆干净。单顶到岸成本从500顶口径的¥33.28(完整口径见19.5)降到1,000顶的¥27.69,降了¥5.59。这¥5.59从哪来?

```
差旅摊销   −3.50   (61.6%)
意外摊销   −0.76   (13.4%)
寄样摊销   −0.70   (12.3%)
货价阶梯   −0.50   ( 8.8%)
制版摊销   −0.20   ( 3.5%)
运费       −0.02   ( 0.4%)
──────────────────────
小计       −5.68   (再叠加换汇、折让、资金三项按售价计提的微调 +0.08,净 −5.59)
```

**运费只贡献了千分之四。**而摊销类(差旅+意外+寄样+制版)加起来贡献了90.8%。这个分解应该改变你的行为:下一次接到一单量翻倍的机会,你该花力气去谈的不是运价,是**能不能免掉制版费、能不能让客户承担寄样、这一趟能不能一次跑三个客户把差旅摊掉**。

对话时刻,把这个认知变成谈判话术。客户问:"我要1,000顶,你能便宜多少?"新人的答法是"我给你算一下运费"——错。你的答法:

> "500顶报11.5,1,000顶我给你10.5,便宜一加元。这一加元不是我少赚了,是三笔钱被摊薄了:制版费一次性200,打样寄样700,再加上我为这个单跑工厂的成本——这些钱做500顶和做1,000顶是一模一样的,你量大一倍,它们每顶就少一半。**运费我一分钱没省,因为按体积算,你的货翻倍运费也翻倍。**"

这段话有三个作用:它是真话;它让客户看见你的成本结构从而信任你的报价;它顺手教育了客户"下次要更便宜就再加量",把加量的动机种进去。**能把自己的成本结构讲明白的人,不需要跟客户吵价格。**

最后留一个判断给你。1,000顶0.96方,离拼箱转整柜还很远(20方以上才该算整柜,见17.2.3),但已经到了另一个岔路口:0.96方这个量,**海运拼箱LCL**(见17.2)可能比海派专线便宜三到四成,代价是你要自己搞定目的港杂费、清关和派送——也就是13.3.2里 Mike 不愿意碰的那一堆事。规则给你:**你的客户是终端(不懂进口)就走专线,客户是有清关能力的进口商就报CIF让他自己接;别把清关的活揽到自己身上,除非你收了这份钱。**

本节动作:把你手上任何一个产品,做一张"三档量的单顶到岸成本对比表",三档自己定(比如300/1,000/3,000)。做完只看一件事:**从第一档到第三档,降下来的钱里有几成来自一次性费用摊销?**这个比例告诉你,你的生意到底是"靠量压成本"还是"靠量摊费用"——两者的谈判策略完全不同。

## 19.4 算例三:一个整柜(规模效应)

**第三题:一个整柜。**

这道题你三年之内可能都碰不到,但必须算一遍——因为它是你所有价格判断的**远端坐标**。不知道整柜的成本长什么样,你就永远不知道自己在链条上的成本劣势有多大,也就无法理解为什么第0章那顶帽子的到岸价能做到$3.30(见7.1.1)。

先装柜。40HQ(40英尺高柜)内容积约76立方米,实际装载率85-90%,可用**约68CBM**(柜型与装柜估算见17.1.1)。你的标准箱0.096CBM:

```
可装箱数 = 68 ÷ 0.096 ≈ 708 箱 → 取整 700 箱
可装数量 = 700 × 100 = 70,000 顶
总毛重   = 700 × 12.5 = 8,750 公斤 = 8.75 吨
```

第二次密度校验,这次的结论会让你会心一笑:40HQ的载重上限约26吨,你只用了8.75吨——**一整个柜子装满了帽子,重量只用掉三分之一。**抛货的性质在整柜这个尺度上依然成立,而且更有画面感:一个四十尺的铁盒子,塞满七万顶帽子,还没有装三分之一的水泥重。这就是为什么帽子行业的柜子永远是"体积爆了重量还早得很",也是为什么行内谈整柜只谈方数不谈吨位。
