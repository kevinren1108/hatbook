name: 每日练习出题

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:
    inputs:
      force:
        description: '当天已有题也强制重出(1=是)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-quiz
  cancel-in-progress: false

jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install anthropic requests pillow
      - name: 出题
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ONEBOUND_KEY: ${{ secrets.ONEBOUND_KEY }}
          ONEBOUND_SECRET: ${{ secrets.ONEBOUND_SECRET }}
          QUIZ_MODEL: ${{ vars.QUIZ_MODEL }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo '仓库 secret ANTHROPIC_API_KEY 未配置,今天先不出题(配好后自动恢复)。'
            exit 0
          fi
          python3 scripts/daily_quiz.py
      - name: 提交
        run: |
          git config user.name 'hatbook-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add daily/
          git diff --cached --quiet && echo '无变化' && exit 0
          git commit -m "每日练习: $(date -u -d '+8 hours' +%F)"
          git pull --rebase origin main
          git push
